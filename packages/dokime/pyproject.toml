[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "dokime"
version = "0.1.0"
readme = "README.md"
description = "Async remote control and evidence collection for Dokime."
requires-python = ">=3.13,<3.16"
license = "Apache-2.0"
license-files = ["LICENSE-APACHE"]
dependencies = ["grpcio>=1.84.0,<2", "protobuf>=7.36.2,<8"]

[tool.hatch.build.targets.wheel]
packages = ["src/dokime"]

[tool.hatch.build.targets.sdist]
include = ["src/dokime", "examples", "README.md", "pyproject.toml", "LICENSE-APACHE"]

[tool.ty.environment]
python-version = "3.13"
python = "../../.venv"
extra-paths = ["src"]

[tool.ty.src]
include = ["src/dokime", "tests", "examples"]

[tool.ty.rules]
unresolved-import = "warn"
unresolved-attribute = "warn"
# Generated protobuf classes are typed as `type[Message]`, whose stub constructor declares no fields.
unknown-argument = "warn"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib", "--timeout-method=thread"]

[tool.ruff]
extend-exclude = ["src/dokime/_wire"]

[tool.ruff.lint.isort]
known-first-party = ["dokime"]
