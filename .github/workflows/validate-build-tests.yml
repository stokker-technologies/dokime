name: Validation / Build Tests
'on':
  workflow_call:
    inputs:
      channel:
        description: ci, stable or nightly
        type: string
        required: true
      profile:
        description: Build Profile
        type: string
        default: dev
      bench:
        description: Build Native Benchmarks Instead of the Tests Archive
        type: boolean
        default: false
permissions:
  contents: read
env:
  PROFILE: ${{ inputs.profile }}
  MISE_LOCKED: '1'
  MISE_EXPERIMENTAL: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo
  pnpm_config_store_dir: ${{ github.workspace }}/.cache/pnpm
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: 'true'
jobs:
  build_tests:
    if: '!inputs.bench'
    name: Build / Tests (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.minutes }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
        bootstrap: ${{ runner.os == 'Linux' && '["mise run ci:prerequisites -- --gui-packages"]' || '[]' }}
    - name: Download Matching Product Binaries
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: build-cli-${{ env.PROFILE }}-${{ matrix.platform }}
        path: target/ci
    - name: Read Locked Library Release
      id: library
      shell: python
      run: |
        import os
        import tomllib
        from pathlib import Path
        lock = tomllib.loads(Path("Cargo.lock").read_text(encoding="utf-8"))
        version = next(package["version"] for package in lock["package"] if package["name"] == "harmos")
        Path(os.environ["GITHUB_OUTPUT"]).write_text(f"version={version}\n", encoding="utf-8")
    - name: Restore Locked Conformance Host
      id: reference_host
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: target/reference-host
        key: conformance-host-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.PROFILE }}-${{ steps.library.outputs.version }}-${{ hashFiles('mise.lock') }}
    # The Public Build Wrapper Collects Sccache Counts and Renders ci.summary to GITHUB_STEP_SUMMARY.
    - name: Build Tests and Report Compiler Cache Counts
      run: mise run build -- --artifact tests --profile ${{ env.PROFILE }}
    - name: Save Locked Conformance Host
      if: success() && steps.reference_host.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: target/reference-host
        key: ${{ steps.reference_host.outputs.cache-primary-key }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: build-tests-${{ env.PROFILE }}-${{ matrix.platform }}
        path: target/ci/build-tests-${{ env.PROFILE }}-${{ matrix.platform }}.tar.zst
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
      if: success()
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.cargo_downloads-cache-hit
        != 'true' && steps.setup.outputs.cargo_downloads-path != ''
      with:
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.mise-cache-hit != 'true' &&
        steps.setup.outputs.mise-path != ''
      with:
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
        path: ${{ steps.setup.outputs.mise-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.pnpm-cache-hit != 'true' &&
        steps.setup.outputs.pnpm-path != ''
      with:
        key: ${{ steps.setup.outputs.pnpm-cache-primary-key }}
        path: ${{ steps.setup.outputs.pnpm-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.uv-cache-hit != 'true' &&
        steps.setup.outputs.uv-path != ''
      with:
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
        path: ${{ steps.setup.outputs.uv-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.sccache-cache-hit != 'true'
        && steps.setup.outputs.sccache-path != '' && env.COMPILER_CACHE_WRITTEN == 'true'
      with:
        key: ${{ steps.setup.outputs.sccache-cache-primary-key }}
        path: ${{ steps.setup.outputs.sccache-path }}
    env:
      MISE_ENABLE_TOOLS: aqua:bufbuild/buf,aqua:anchore/syft,aqua:koalaman/shellcheck,aqua:nextest-rs/nextest/cargo-nextest,github:CycloneDX/cyclonedx-rust-cargo,github:EmbarkStudios/cargo-about,github:bnjbvr/cargo-machete,github:rust-secure-code/cargo-auditable,go,go:github.com/rhysd/actionlint/cmd/actionlint,node,pnpm,powershell,protoc,python,rust,sccache,taplo,uv
      COMPILER_CACHE_BACKEND: disk
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      COMPILER_CACHE_MODE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/dev' && 'READ_WRITE' || 'READ_ONLY' }}
      DOKIME_HOST_FIXTURE_LANGUAGE: rust
      CI_TRANSPORT: 'true'
      CI_OUTPUTS: ${{ matrix.outputs }}
      CI_CACHE_PROFILE: test
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: unix
          runner: ubuntu-22.04
          minutes: 120
          inputs: ''
          outputs: '[{"archive":"target/ci/build-tests-{profile}-unix.tar.zst","paths":["target/build/{profile}/{target}/tests","target/build/{profile}/{target}/fixtures"]}]'
        - platform: windows
          runner: windows-latest
          minutes: 120
          inputs: ''
          outputs: '[{"archive":"target/ci/build-tests-{profile}-windows.tar.zst","paths":["target/build/{profile}/{target}/tests","target/build/{profile}/{target}/fixtures"]}]'
  build_bench:
    if: inputs.bench
    name: Build / Bench (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.minutes }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
        bootstrap: ${{ runner.os == 'Linux' && '["mise run ci:prerequisites -- --gui-packages"]' || '[]' }}
    - run: mise run build -- --artifact bench --binary system-desktop
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: build-bench-${{ matrix.platform }}
        path: target/ci/build-bench-${{ matrix.platform }}.tar.zst
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
      if: success()
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.cargo_downloads-cache-hit
        != 'true' && steps.setup.outputs.cargo_downloads-path != ''
      with:
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.mise-cache-hit != 'true' &&
        steps.setup.outputs.mise-path != ''
      with:
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
        path: ${{ steps.setup.outputs.mise-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.pnpm-cache-hit != 'true' &&
        steps.setup.outputs.pnpm-path != ''
      with:
        key: ${{ steps.setup.outputs.pnpm-cache-primary-key }}
        path: ${{ steps.setup.outputs.pnpm-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.uv-cache-hit != 'true' &&
        steps.setup.outputs.uv-path != ''
      with:
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
        path: ${{ steps.setup.outputs.uv-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.sccache-cache-hit != 'true'
        && steps.setup.outputs.sccache-path != '' && env.COMPILER_CACHE_WRITTEN == 'true'
      with:
        key: ${{ steps.setup.outputs.sccache-cache-primary-key }}
        path: ${{ steps.setup.outputs.sccache-path }}
    env:
      MISE_ENABLE_TOOLS: aqua:bufbuild/buf,aqua:anchore/syft,aqua:koalaman/shellcheck,aqua:nextest-rs/nextest/cargo-nextest,github:CycloneDX/cyclonedx-rust-cargo,github:EmbarkStudios/cargo-about,github:bnjbvr/cargo-machete,github:rust-secure-code/cargo-auditable,go,go:github.com/rhysd/actionlint/cmd/actionlint,node,pnpm,powershell,protoc,python,rust,sccache,taplo,uv
      DOKIME_HOST_FIXTURE_LANGUAGE: ${{ inputs.channel == 'nightly' && 'none' || 'rust' }}
      CI_TRANSPORT: 'true'
      CI_OUTPUTS: ${{ matrix.outputs }}
      CI_CACHE_PROFILE: bench
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: unix
          runner: ubuntu-22.04
          minutes: 120
          inputs: ''
          outputs: '[{"archive":"target/ci/build-bench-unix.tar.zst","paths":["target/build/bench/{target}"]}]'
        - platform: windows
          runner: windows-latest
          minutes: 120
          inputs: ''
          outputs: '[{"archive":"target/ci/build-bench-windows.tar.zst","paths":["target/build/bench/{target}"]}]'
