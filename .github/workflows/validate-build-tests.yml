name: Validation / Build Tests
'on':
  workflow_call:
    inputs:
      channel:
        description: ci, stable or nightly
        type: string
        required: true
      profile:
        description: Build Profile
        type: string
        default: dev
      fixture-language:
        description: Build One Independent SDK Fixture Instead of the Tests Archive
        type: string
        default: ''
      bench:
        description: Build Native Benchmarks Instead of the Tests Archive
        type: boolean
        default: false
permissions:
  contents: read
env:
  PROFILE: ${{ inputs.profile }}
  MISE_LOCKED: '1'
  MISE_EXPERIMENTAL: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo
  pnpm_config_store_dir: ${{ github.workspace }}/.cache/pnpm
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: 'true'
jobs:
  build_tests:
    if: inputs.fixture-language == '' && !inputs.bench
    name: Build / Tests (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.minutes }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
        bootstrap: ${{ runner.os == 'Linux' && '["python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-packages"]' || '[]' }}
    - run: mise run build -- --artifact tests --profile ${{ env.PROFILE }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: build-tests-${{ env.PROFILE }}-${{ matrix.platform }}
        path: target/ci/build-tests-${{ env.PROFILE }}-${{ matrix.platform }}.tar.zst
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
      if: success()
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.cargo_downloads-cache-hit
        != 'true' && steps.setup.outputs.cargo_downloads-path != ''
      with:
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.mise-cache-hit != 'true' &&
        steps.setup.outputs.mise-path != ''
      with:
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
        path: ${{ steps.setup.outputs.mise-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.pnpm-cache-hit != 'true' &&
        steps.setup.outputs.pnpm-path != ''
      with:
        key: ${{ steps.setup.outputs.pnpm-cache-primary-key }}
        path: ${{ steps.setup.outputs.pnpm-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.uv-cache-hit != 'true' &&
        steps.setup.outputs.uv-path != ''
      with:
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
        path: ${{ steps.setup.outputs.uv-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.sccache-cache-hit != 'true'
        && steps.setup.outputs.sccache-path != ''
      with:
        key: ${{ steps.setup.outputs.sccache-cache-primary-key }}
        path: ${{ steps.setup.outputs.sccache-path }}
    env:
      MISE_ENABLE_TOOLS: aqua:anchore/syft,aqua:koalaman/shellcheck,aqua:nextest-rs/nextest/cargo-nextest,github:CycloneDX/cyclonedx-rust-cargo,github:EmbarkStudios/cargo-about,github:bnjbvr/cargo-machete,github:rust-secure-code/cargo-auditable,go,go:github.com/rhysd/actionlint/cmd/actionlint,cmake,dotnet,node,pnpm,powershell,protoc,python,rust,sccache,taplo,uv
      COMPILER_CACHE_BACKEND: disk
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      SCCACHE_CACHE_SIZE: 8G
      COMPILER_CACHE_MODE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/dev' && 'READ_WRITE' || 'READ_ONLY' }}
      DOKIME_HOST_FIXTURE_LANGUAGE: rust
      CI_TRANSPORT: 'true'
      CI_OUTPUTS: ${{ matrix.outputs }}
      CI_CACHE_PROFILE: test
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: unix
          runner: ubuntu-latest
          minutes: 120
          inputs: ''
          outputs: '[{"archive":"target/ci/build-tests-{profile}-unix.tar.zst","paths":["target/build/{profile}/{target}/tests","target/build/{profile}/{target}/fixtures"]}]'
        - platform: windows
          runner: windows-latest
          minutes: 120
          inputs: ''
          outputs: '[{"archive":"target/ci/build-tests-{profile}-windows.tar.zst","paths":["target/build/{profile}/{target}/tests","target/build/{profile}/{target}/fixtures"]}]'
  build_bench:
    if: inputs.bench
    name: Build / Bench (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.minutes }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
        bootstrap: ${{ runner.os == 'Linux' && '["python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-packages"]' || '[]' }}
    - run: mise run build -- --artifact bench --binary system-desktop
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: build-bench-${{ matrix.platform }}
        path: target/ci/build-bench-${{ matrix.platform }}.tar.zst
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
      if: success()
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.cargo_downloads-cache-hit
        != 'true' && steps.setup.outputs.cargo_downloads-path != ''
      with:
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.mise-cache-hit != 'true' &&
        steps.setup.outputs.mise-path != ''
      with:
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
        path: ${{ steps.setup.outputs.mise-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.pnpm-cache-hit != 'true' &&
        steps.setup.outputs.pnpm-path != ''
      with:
        key: ${{ steps.setup.outputs.pnpm-cache-primary-key }}
        path: ${{ steps.setup.outputs.pnpm-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.uv-cache-hit != 'true' &&
        steps.setup.outputs.uv-path != ''
      with:
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
        path: ${{ steps.setup.outputs.uv-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.sccache-cache-hit != 'true'
        && steps.setup.outputs.sccache-path != ''
      with:
        key: ${{ steps.setup.outputs.sccache-cache-primary-key }}
        path: ${{ steps.setup.outputs.sccache-path }}
    env:
      MISE_ENABLE_TOOLS: aqua:anchore/syft,aqua:koalaman/shellcheck,aqua:nextest-rs/nextest/cargo-nextest,github:CycloneDX/cyclonedx-rust-cargo,github:EmbarkStudios/cargo-about,github:bnjbvr/cargo-machete,github:rust-secure-code/cargo-auditable,go,go:github.com/rhysd/actionlint/cmd/actionlint,cmake,dotnet,node,pnpm,powershell,protoc,python,rust,sccache,taplo,uv
      DOKIME_HOST_FIXTURE_LANGUAGE: ${{ inputs.channel == 'nightly' && 'none' || 'rust' }}
      CI_TRANSPORT: 'true'
      CI_OUTPUTS: ${{ matrix.outputs }}
      CI_CACHE_PROFILE: bench
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: unix
          runner: ubuntu-latest
          minutes: 120
          inputs: ''
          outputs: '[{"archive":"target/ci/build-bench-unix.tar.zst","paths":["target/build/bench/{target}"]}]'
        - platform: windows
          runner: windows-latest
          minutes: 120
          inputs: ''
          outputs: '[{"archive":"target/ci/build-bench-windows.tar.zst","paths":["target/build/bench/{target}"]}]'
  build_fixture:
    if: inputs.fixture-language != ''
    name: Build / Fixture / ${{ inputs.fixture-language }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: unix
          runner: ubuntu-22.04
        - platform: windows
          runner: windows-latest
    env:
      MISE_ENABLE_TOOLS: cmake,dotnet,python,rust,protoc,uv,sccache
      CI_TRANSPORT: 'true'
      CI_OUTPUTS: >-
        [{"archive":"target/ci/build-host-${{ inputs.fixture-language }}-{profile}-${{ matrix.platform }}.tar.zst","paths":["${{ inputs.fixture-language == 'python' && 'target/build/{profile}/any/python' || 'target/build/{profile}/{target}/fixtures/host' }}"]}]
      DOKIME_CPP_BUILD_DIR: ${{ github.workspace }}/.cache/sdk-cpp
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - uses: ./.github/actions/setup
      with:
        platform: ${{ matrix.platform }}
        prepare-arguments: --without-frontend
    - name: Install the .NET SDK
      if: inputs.fixture-language == 'csharp'
      run: mise -C sdk/csharp install dotnet
    - name: Install CMake
      if: inputs.fixture-language == 'cpp'
      run: mise -C sdk/cpp install cmake
    - name: Restore Pinned C++ Dependencies
      id: cpp_dependencies
      if: inputs.fixture-language == 'cpp'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: .cache/sdk-cpp/_deps
        key: sdk-cpp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sdk/cpp/CMakeLists.txt', 'sdk/cpp/cmake/**', 'sdk/cpp/mise.toml', 'sdk/cpp/mise.lock', 'sdk/cpp/tools/sdk.py') }}
    - run: mise run build:host-fixtures -- --profile ${{ env.PROFILE }} --language ${{ inputs.fixture-language }} --export
    - name: Preserve C++ Build Diagnostics
      if: always() && inputs.fixture-language == 'cpp'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: diagnostics-host-cpp-${{ env.PROFILE }}-${{ matrix.platform }}
        path: .cache/sdk-cpp/*.log
        if-no-files-found: ignore
        retention-days: 7
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: build-host-${{ inputs.fixture-language }}-${{ env.PROFILE }}-${{ matrix.platform }}
        path: target/ci/build-host-${{ inputs.fixture-language }}-${{ env.PROFILE }}-${{ matrix.platform }}.tar.zst
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
    - name: Save Pinned C++ Dependencies
      if: inputs.fixture-language == 'cpp' && steps.cpp_dependencies.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: .cache/sdk-cpp/_deps
        key: ${{ steps.cpp_dependencies.outputs.cache-primary-key }}
