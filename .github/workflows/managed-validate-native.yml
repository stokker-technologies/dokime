name: Validate
"on":
  workflow_call:
    inputs:
      runners:
        type: string
        required: true
      budgets:
        type: string
        required: true
      platform:
        type: string
        required: true
env:
  PROFILE: >-
    ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.head_ref,
