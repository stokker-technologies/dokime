name: Release / Publish
'on':
  workflow_call:
    inputs:
      channel:
        description: stable or nightly
        type: string
        required: true
      profile:
        description: Build Profile
        type: string
        default: release
      build-run:
        description: Run Containing Unsigned Packages
        type: string
        default: ''
      build-sha:
        description: Validated Review Revision
        type: string
        default: ''
      build-version:
        description: Validated Review Version
        type: string
        default: ''
      report:
        description: Complete Nightly Reports After All Suites
        type: boolean
        default: false
      results:
        description: Suite Results JSON
        type: string
        default: '{}'
permissions:
  contents: write
  actions: read
  checks: read
  id-token: write
  attestations: write
env:
  PROFILE: ${{ inputs.profile }}
  MISE_LOCKED: '1'
  MISE_EXPERIMENTAL: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo
  pnpm_config_store_dir: ${{ github.workspace }}/.cache/pnpm
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: 'true'
jobs:
  publish:
    name: ${{ inputs.report && 'Nightly / Report' || 'Release / Publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
        cache-backend: disk
        cache-mode: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/dev')) && 'READ_WRITE'
          || 'READ_ONLY' }}
        bootstrap: '[]'
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: package-${{ env.PROFILE }}-python-unix
        path: target/ci
        run-id: ${{ inputs.build-run || github.run_id }}
        github-token: ${{ github.token }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: package-${{ env.PROFILE }}-python-windows
        path: target/ci
        run-id: ${{ inputs.build-run || github.run_id }}
        github-token: ${{ github.token }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: package-${{ env.PROFILE }}-rust-unix
        path: target/ci
        run-id: ${{ inputs.build-run || github.run_id }}
        github-token: ${{ github.token }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: package-${{ env.PROFILE }}-rust-windows
        path: target/ci
        run-id: ${{ inputs.build-run || github.run_id }}
        github-token: ${{ github.token }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      if: inputs.report
      with:
        pattern: results-*
        path: target/nightly-reports
    - run: mise run release:publish -- --channel ${{ inputs.channel }}
      if: '!inputs.report'
    - name: Complete Nightly Reports
      if: inputs.report
      run: mise run ci:nightly-report --
      env:
        NEEDS: ${{ inputs.results }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      id: report
    - name: Share Release Manifest
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: release-manifest
        path: target/release-assets/upload.json
        if-no-files-found: error
        retention-days: 7
        overwrite: true
      if: '!inputs.report || steps.report.outputs.published == ''true'''
    - name: Attest Installer, CLI, Sidecar and Wheel Digests
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
      with:
        subject-checksums: target/release-assets/any/SHA256SUMS
      if: '!inputs.report || steps.report.outputs.published == ''true'''
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.cargo_downloads-cache-hit
        != 'true' && steps.setup.outputs.cargo_downloads-path != ''
      with:
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.mise-cache-hit != 'true' &&
        steps.setup.outputs.mise-path != ''
      with:
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
        path: ${{ steps.setup.outputs.mise-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.pnpm-cache-hit != 'true' &&
        steps.setup.outputs.pnpm-path != ''
      with:
        key: ${{ steps.setup.outputs.pnpm-cache-primary-key }}
        path: ${{ steps.setup.outputs.pnpm-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.uv-cache-hit != 'true' &&
        steps.setup.outputs.uv-path != ''
      with:
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
        path: ${{ steps.setup.outputs.uv-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.sccache-cache-hit != 'true'
        && steps.setup.outputs.sccache-path != ''
      with:
        path: ${{ steps.setup.outputs.sccache-path }}
        key: ${{ steps.setup.outputs.sccache-cache-primary-key }}
    env:
      MISE_ENABLE_TOOLS: aqua:anchore/syft,git-cliff,github:CycloneDX/cyclonedx-rust-cargo,github:EmbarkStudios/cargo-about,github:rust-secure-code/cargo-auditable,go,minisign,node,pnpm,powershell,python,rust,sccache,uv
      COMPILER_CACHE_BACKEND: disk
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      SCCACHE_CACHE_SIZE: 8G
      COMPILER_CACHE_MODE: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/dev')) && 'READ_WRITE'
        || 'READ_ONLY' }}
      PROFILE: ${{ inputs.profile }}
      RELEASE_BUILD_RUN_ID: ${{ inputs.build-run }}
      RELEASE_BUILD_SHA: ${{ inputs.build-sha }}
      RELEASE_BUILD_VERSION: ${{ inputs.build-version }}
      CI_TRANSPORT: 'true'
      RELEASE_PROFILE: ${{ inputs.profile }}
      RELEASE_TARGET_SHA: ${{ inputs.channel == 'stable' && github.sha || '' }}
      GH_TOKEN: ${{ github.token }}
      CI_READ_TOKEN: ${{ github.token }}
      CI_INPUT_ARCHIVES: '["target/ci/package-{profile}-python-unix.tar.zst","target/ci/package-{profile}-python-windows.tar.zst","target/ci/package-{profile}-rust-unix.tar.zst","target/ci/package-{profile}-rust-windows.tar.zst"]'
    environment: ${{ inputs.channel == 'stable' && 'release' || 'nightly' }}
    permissions:
      checks: read
      contents: write
      actions: read
      id-token: write
      attestations: write
    concurrency:
      group: ${{ inputs.channel }}-publish
      cancel-in-progress: false
