name: Check
"on":
  workflow_call:
    inputs:
      runners:
        type: string
        required: true
      budgets:
        type: string
        required: true
      platform:
        type: string
        required: true
env:
  PROFILE: >-
    ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.head_ref,
    'release/v')) && 'release' || 'dev' }}
  MISE_LOCKED: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo
  npm_config_store_dir: ${{ github.workspace }}/.cache/pnpm
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
jobs:
  check_rust:
    name: Rust (${{ inputs.platform }})
    runs-on: ${{ fromJSON(inputs.runners)[inputs.platform].large }}
    timeout-minutes: ${{ fromJSON(inputs.budgets).check_rust }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Cache / Cargo
      id: cargo
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |-
          .cache/cargo/registry/
          .cache/cargo/git/
        key: >-
          ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-${{
          github.head_ref || github.ref_name }}
        restore-keys: |-
          ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-dev
          ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}-main
    - name: Cache / Pnpm
      id: pnpm
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: .cache/pnpm/
        key: >-
          ${{ runner.os }}-${{ runner.arch }}-pnpm-${{
          hashFiles('crates/dokime-gui/pnpm-lock.yaml') }}-${{ github.head_ref || github.ref_name }}
        restore-keys: |-
          ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('crates/dokime-gui/pnpm-lock.yaml') }}-dev
          ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('crates/dokime-gui/pnpm-lock.yaml') }}-main
    - name: Cache / Uv
      id: uv
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: .cache/uv/
        key: >-
          ${{ runner.os }}-${{ runner.arch }}-uv-${{ hashFiles('uv.lock') }}-${{
          github.head_ref || github.ref_name }}
        restore-keys: |-
          ${{ runner.os }}-${{ runner.arch }}-uv-${{ hashFiles('uv.lock') }}-dev
          ${{ runner.os }}-${{ runner.arch }}-uv-${{ hashFiles('uv.lock') }}-main
    - name: Resolve Mise Directory
      if: runner.os == 'Windows'
      shell: pwsh
      run: |-
        $directory = Join-Path ([System.IO.Path]::GetTempPath()) 'stkr-mise'
        "MISE_DATA_DIR=$directory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    - name: Resolve Mise Directory
      if: runner.os != 'Windows'
      shell: bash
      run: printf 'MISE_DATA_DIR=%s/stkr-mise\n' "${TMPDIR:-/tmp}" >> "$GITHUB_ENV"
    - name: Cache / Tools
      id: tools
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ env.MISE_DATA_DIR }}
        key: >-
          ${{ runner.os }}-${{ runner.arch }}-mise-v2-${{ hashFiles('mise.lock') }}-${{
          github.head_ref || github.ref_name }}
        restore-keys: |-
          ${{ runner.os }}-${{ runner.arch }}-mise-v2-${{ hashFiles('mise.lock') }}-dev
          ${{ runner.os }}-${{ runner.arch }}-mise-v2-${{ hashFiles('mise.lock') }}-main
    - run: sudo apt-get update
      if: inputs.platform == 'linux'
      shell: bash
    - run: >-
        sudo apt-get install -y --no-install-recommends build-essential pkg-config
        libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev
        libjavascriptcoregtk-4.1-dev librsvg2-dev libasound2-dev linux-libc-dev libclang-dev webkit2gtk-driver
        xvfb xdotool desktop-file-utils xdg-utils rpm dbus gnome-keyring
      if: inputs.platform == 'linux'
      shell: bash
    - run: Xvfb :99 -screen 0 1920x1080x24 -noreset >/dev/null 2>&1 &
      if: inputs.platform == 'linux'
      shell: bash
    - run: echo DISPLAY=:99 >> "$GITHUB_ENV"
      if: inputs.platform == 'linux'
      shell: bash
    - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      env:
        RUSTC_WRAPPER: ""
      with:
        install: true
        cache: false
        mise_dir: ${{ env.MISE_DATA_DIR }}
    - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      with:
        version: v0.18.0
    - run: mise run check:rust
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: >-
        success() && (github.event_name == 'pull_request' || (github.event_name ==
        'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'))) &&
