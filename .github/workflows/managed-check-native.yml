      with:
        path: |-
          .cache/cargo/registry/
          .cache/cargo/git/
        key: ${{ steps.cargo.outputs.cache-primary-key }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: >-
        success() && (github.event_name == 'pull_request' || (github.event_name ==
        'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'))) &&
        steps.pnpm.outputs.cache-hit != 'true'
      with:
        path: .cache/pnpm/
        key: ${{ steps.pnpm.outputs.cache-primary-key }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: >-
        success() && (github.event_name == 'pull_request' || (github.event_name ==
        'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'))) &&
        steps.uv.outputs.cache-hit != 'true'
      with:
        path: .cache/uv/
        key: ${{ steps.uv.outputs.cache-primary-key }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: >-
        success() && (github.event_name == 'pull_request' || (github.event_name ==
        'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'))) &&
        steps.tools.outputs.cache-hit != 'true'
      with:
        path: ${{ env.MISE_DATA_DIR }}
        key: ${{ steps.tools.outputs.cache-primary-key }}
    - run: sccache --show-stats
      if: always()
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: >-
        ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' ||
        github.ref == 'refs/heads/main') && 'READ_WRITE' || 'READ_ONLY' }}
      SCCACHE_GHA_VERSION: ${{ inputs.platform }}
      MISE_ENABLE_TOOLS: >-
        node,python,rust,pnpm,uv,aqua:nextest-rs/nextest/cargo-nextest,sccache,aqua:rhysd/actionlint,npm:@fission-ai/openspec,taplo,protoc,aqua:cargo-bins/cargo-binstall
