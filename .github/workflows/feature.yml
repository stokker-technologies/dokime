name: Check Features

on:
  push:
    branches-ignore: [dev, main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: feature-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check Feature (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
          - os: windows
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      MISE_YES: '1'
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.cache/mise-global.toml
      MISE_DATA_DIR: ${{ github.workspace }}/.cache/mise
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find Existing PR
        id: pr
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          count=$(gh pr list --repo "$REPOSITORY" --head "$BRANCH" --state open --json number --jq 'length')
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.pr.outputs.count == '0'
        with:
          key: native-${{ matrix.os }}-${{ hashFiles('mise.lock', 'Cargo.lock', 'uv.lock') }}
          path: |
            .cache/mise/
            .cache/cargo/registry/
            .cache/cargo/git/
            .cache/uv/
      - name: Prepare Linux
        if: steps.pr.outputs.count == '0' && matrix.os == 'linux'
        shell: bash
        run: . tools/ci/install.sh
      - name: Prepare Windows
        if: steps.pr.outputs.count == '0' && matrix.os == 'windows'
        shell: pwsh
        run: . ./tools/ci/install.ps1
      - if: steps.pr.outputs.count == '0'
        run: mise run check
