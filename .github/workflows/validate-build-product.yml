name: Validation / Build Product
'on':
  workflow_call:
    inputs:
      channel:
        description: ci, stable or nightly
        type: string
        required: true
      profile:
        description: Build Profile
        type: string
        default: dev
permissions:
  contents: read
env:
  PROFILE: ${{ inputs.profile }}
  MISE_LOCKED: '1'
  MISE_EXPERIMENTAL: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo
  pnpm_config_store_dir: ${{ github.workspace }}/.cache/pnpm
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: 'true'
jobs:
  build_product:
    name: Build / Product (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.minutes }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
        bootstrap: ${{ runner.os == 'Linux' && '["python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-packages"]' || '[]' }}
    - run: mise run build -- --artifact product --profile ${{ env.PROFILE }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: build-cli-${{ env.PROFILE }}-${{ matrix.platform }}
        path: target/ci/build-cli-${{ env.PROFILE }}-${{ matrix.platform }}.tar.zst
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
      if: success()
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: build-clients-${{ env.PROFILE }}-${{ matrix.platform }}
        path: target/ci/build-clients-${{ env.PROFILE }}-${{ matrix.platform }}.tar.zst
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
      if: success()
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: build-generator-${{ env.PROFILE }}-${{ matrix.platform }}
        path: target/ci/build-generator-${{ env.PROFILE }}-${{ matrix.platform }}.tar.zst
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
      if: success()
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: build-gui-${{ env.PROFILE }}-${{ matrix.platform }}
        path: target/ci/build-gui-${{ env.PROFILE }}-${{ matrix.platform }}.tar.zst
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
      if: success()
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: build-packaging-${{ env.PROFILE }}-${{ matrix.platform }}
        path: target/ci/build-packaging-${{ env.PROFILE }}-${{ matrix.platform }}.tar.zst
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
      if: success()
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: build-plugins-${{ env.PROFILE }}-${{ matrix.platform }}
        path: target/ci/build-plugins-${{ env.PROFILE }}-${{ matrix.platform }}.tar.zst
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
      if: success()
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.cargo_downloads-cache-hit
        != 'true' && steps.setup.outputs.cargo_downloads-path != ''
      with:
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.mise-cache-hit != 'true' &&
        steps.setup.outputs.mise-path != ''
      with:
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
        path: ${{ steps.setup.outputs.mise-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.pnpm-cache-hit != 'true' &&
        steps.setup.outputs.pnpm-path != ''
      with:
        key: ${{ steps.setup.outputs.pnpm-cache-primary-key }}
        path: ${{ steps.setup.outputs.pnpm-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.sccache-cache-hit != 'true'
        && steps.setup.outputs.sccache-path != ''
      with:
        key: ${{ steps.setup.outputs.sccache-cache-primary-key }}
        path: ${{ steps.setup.outputs.sccache-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.uv-cache-hit != 'true' &&
        steps.setup.outputs.uv-path != ''
      with:
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
        path: ${{ steps.setup.outputs.uv-path }}
    env:
      MISE_ENABLE_TOOLS: aqua:anchore/syft,aqua:koalaman/shellcheck,aqua:nextest-rs/nextest/cargo-nextest,github:CycloneDX/cyclonedx-rust-cargo,github:EmbarkStudios/cargo-about,github:bnjbvr/cargo-machete,github:rust-secure-code/cargo-auditable,go,go:github.com/rhysd/actionlint/cmd/actionlint,node,pnpm,powershell,protoc,python,rust,sccache,taplo,uv
      COMPILER_CACHE_BACKEND: disk
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      SCCACHE_CACHE_SIZE: 8G
      COMPILER_CACHE_MODE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/dev' && 'READ_WRITE' || 'READ_ONLY' }}
      CI_TRANSPORT: 'true'
      CI_OUTPUTS: ${{ matrix.outputs }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: unix
          runner: ubuntu-22.04
          minutes: 120
          inputs: ''
          outputs: '[{"archive":"target/ci/build-cli-{profile}-unix.tar.zst","paths":["target/build/{profile}/{target}/bin/dokime"]},{"archive":"target/ci/build-clients-{profile}-unix.tar.zst","paths":["target/build/{profile}/{target}/generated/typescript"]},{"archive":"target/ci/build-generator-{profile}-unix.tar.zst","paths":["target/build/{profile}/{target}/bin/cargo-dokime"]},{"archive":"target/ci/build-gui-{profile}-unix.tar.zst","paths":["target/build/{profile}/{target}/bin/dokime-gui"]},{"archive":"target/ci/build-packaging-{profile}-unix.tar.zst","paths":["target/build/{profile}/{target}/product","target/build/{profile}/{target}/web"]},{"archive":"target/ci/build-plugins-{profile}-unix.tar.zst","paths":["target/build/{profile}/{target}/plugins"]}]'
        - platform: windows
          runner: windows-latest
          minutes: 120
          inputs: ''
          outputs: '[{"archive":"target/ci/build-cli-{profile}-windows.tar.zst","paths":["target/build/{profile}/{target}/bin/dokime.exe"]},{"archive":"target/ci/build-clients-{profile}-windows.tar.zst","paths":["target/build/{profile}/{target}/generated/typescript"]},{"archive":"target/ci/build-generator-{profile}-windows.tar.zst","paths":["target/build/{profile}/{target}/bin/cargo-dokime.exe"]},{"archive":"target/ci/build-gui-{profile}-windows.tar.zst","paths":["target/build/{profile}/{target}/bin/dokime-gui.exe"]},{"archive":"target/ci/build-packaging-{profile}-windows.tar.zst","paths":["target/build/{profile}/{target}/product","target/build/{profile}/{target}/web"]},{"archive":"target/ci/build-plugins-{profile}-windows.tar.zst","paths":["target/build/{profile}/{target}/plugins"]}]'
