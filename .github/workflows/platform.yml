name: Native Platform

on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      authorization:
        type: string
        default: full-validation

permissions:
  contents: read
  actions: read

jobs:
  check:
    name: Check (${{ inputs.os }})
    runs-on: ${{ inputs.os == 'linux' && github.event_name == 'push' && github.repository == 'stokker-technologies/dokime' && github.ref == 'refs/heads/dev' && 'stokker-local-linux-x64' || inputs.os == 'linux' && 'ubuntu-24.04' || 'windows-2022' }}
    timeout-minutes: 120
    env: &native_env
      MISE_YES: '1'
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.cache/mise-global.toml
      MISE_DATA_DIR: ${{ github.workspace }}/.cache/mise
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: native_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: native-${{ inputs.os }}-${{ hashFiles('mise.lock', 'Cargo.lock', 'uv.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            native-${{ inputs.os }}-${{ hashFiles('mise.lock', 'Cargo.lock', 'uv.lock') }}-
            native-${{ inputs.os }}-${{ hashFiles('mise.lock', 'Cargo.lock', 'uv.lock') }}
          path: &native_cache_paths |
            .cache/mise/
            .cache/cargo/registry/
            .cache/cargo/git/
            .cache/uv/
      - id: check_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: compiled-${{ runner.os }}-${{ runner.arch }}-check-v1-${{ hashFiles('mise.lock', 'mise.toml', '.cargo/config.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            compiled-${{ runner.os }}-${{ runner.arch }}-check-v1-${{ hashFiles('mise.lock', 'mise.toml', '.cargo/config.toml') }}-${{ hashFiles('Cargo.lock') }}-
            compiled-${{ runner.os }}-${{ runner.arch }}-check-v1-${{ hashFiles('mise.lock', 'mise.toml', '.cargo/config.toml') }}-${{ hashFiles('Cargo.lock') }}
            compiled-${{ runner.os }}-${{ runner.arch }}-check-v1-${{ hashFiles('mise.lock', 'mise.toml', '.cargo/config.toml') }}-
          path: &check_cache_paths |
            target/debug/.fingerprint/
            target/debug/build/
            target/debug/deps/
            target/wasm32-unknown-unknown/debug/.fingerprint/
            target/wasm32-unknown-unknown/debug/build/
            target/wasm32-unknown-unknown/debug/deps/
      - &linux
        name: Prepare Linux
        if: inputs.os == 'linux'
        shell: bash
        run: . tools/ci/install.sh
      - &windows
        name: Prepare Windows
        if: inputs.os == 'windows'
        shell: pwsh
        run: . ./tools/ci/install.ps1
      - name: Check Route
        if: github.base_ref == 'main'
        run: mise run ci:route
      - run: mise run check
      - name: Preserve Native Tool Cache
        if: always() && steps.native_cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: ${{ steps.native_cache.outputs.cache-primary-key }}
          path: *native_cache_paths
      - name: Preserve Check Compiler Cache
        if: always() && steps.check_cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: ${{ steps.check_cache.outputs.cache-primary-key }}
          path: *check_cache_paths

  build_release:
    name: Build Release (${{ inputs.os }})
    needs: check
    environment: ${{ inputs.authorization }}
    runs-on: ${{ inputs.os == 'linux' && 'ubuntu-24.04' || 'windows-2022' }}
    timeout-minutes: 360
    env:
      MISE_YES: '1'
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.cache/mise-global.toml
      MISE_DATA_DIR: ${{ github.workspace }}/.cache/mise
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      GITHUB_TOKEN: ${{ github.token }}
      DOKIME_RELEASE_CONTEXT: ${{ inputs.authorization == 'release' }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.authorization == 'release' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.authorization == 'release' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
    outputs:
      artifact_name: ${{ steps.build.outputs.artifact_name }}
    steps:
      - *checkout
      - id: native_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: native-${{ inputs.os }}-${{ hashFiles('mise.lock', 'Cargo.lock', 'uv.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}-build-release
          restore-keys: |
            native-${{ inputs.os }}-${{ hashFiles('mise.lock', 'Cargo.lock', 'uv.lock') }}-
            native-${{ inputs.os }}-${{ hashFiles('mise.lock', 'Cargo.lock', 'uv.lock') }}
          path: *native_cache_paths
      - id: build_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: compiled-${{ runner.os }}-${{ runner.arch }}-build-release-v1-${{ hashFiles('mise.lock', 'mise.toml', '.cargo/config.toml', 'tools/python/src/dokime_tools/package/linux.py') }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            compiled-${{ runner.os }}-${{ runner.arch }}-build-release-v1-${{ hashFiles('mise.lock', 'mise.toml', '.cargo/config.toml', 'tools/python/src/dokime_tools/package/linux.py') }}-${{ hashFiles('Cargo.lock') }}-
            compiled-${{ runner.os }}-${{ runner.arch }}-build-release-v1-${{ hashFiles('mise.lock', 'mise.toml', '.cargo/config.toml', 'tools/python/src/dokime_tools/package/linux.py') }}-${{ hashFiles('Cargo.lock') }}
            compiled-${{ runner.os }}-${{ runner.arch }}-build-release-v1-${{ hashFiles('mise.lock', 'mise.toml', '.cargo/config.toml', 'tools/python/src/dokime_tools/package/linux.py') }}-
          path: &build_cache_paths |
            target/release/.fingerprint/
            target/release/build/
            target/release/deps/
            target/python/manylinux/release/.fingerprint/
            target/python/manylinux/release/build/
            target/python/manylinux/release/deps/
      - *linux
      - *windows
      - id: build
        run: mise run build:release
      - name: Preserve Native Tool Cache
        if: always() && steps.native_cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: ${{ steps.native_cache.outputs.cache-primary-key }}
          path: *native_cache_paths
      - name: Preserve Release Compiler Cache
        if: always() && steps.build_cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: ${{ steps.build_cache.outputs.cache-primary-key }}
          path: *build_cache_paths
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: dist/downloads/dokime-${{ inputs.os }}.zip
          if-no-files-found: error
          retention-days: 30
      - name: Preserve Build Diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-diagnostics-${{ inputs.os }}
          path: target/cargo-timings/*.html
          retention-days: 30

  test:
    name: Test (${{ inputs.os }})
    needs: build_release
    runs-on: ${{ inputs.os == 'linux' && github.event_name == 'push' && github.repository == 'stokker-technologies/dokime' && github.ref == 'refs/heads/dev' && 'stokker-local-linux-x64' || inputs.os == 'linux' && 'ubuntu-24.04' || 'windows-2022' }}
    timeout-minutes: 360
    env: *native_env
    steps:
      - *checkout
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: native-${{ inputs.os }}-${{ hashFiles('mise.lock', 'Cargo.lock', 'uv.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}-test
          restore-keys: |
            native-${{ inputs.os }}-${{ hashFiles('mise.lock', 'Cargo.lock', 'uv.lock') }}-
            native-${{ inputs.os }}-${{ hashFiles('mise.lock', 'Cargo.lock', 'uv.lock') }}
          path: *native_cache_paths
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: coverage-${{ inputs.os }}-${{ hashFiles('Cargo.lock', 'mise.lock') }}
          path: target/validation/cargo/coverage/
      - *linux
      - *windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build_release.outputs.artifact_name }}
          path: dist/downloads/
      - run: mise run ci:artifacts:restore
      - id: test
        run: mise run test
        env:
          STKR_COVERAGE: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.test.outputs.artifact_name }}
          path: dist/downloads/dokime-${{ inputs.os }}.zip
          if-no-files-found: error
          retention-days: 90
      - name: Preserve Native Test Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports-${{ inputs.os }}
          include-hidden-files: true
          path: |
            .stkr/tests/
            target/cargo-timings/*.html
          retention-days: 30
