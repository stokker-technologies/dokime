name: Native Platform

on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      authorization:
        type: string
        default: full-validation
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read
  actions: read

# Pinned Actions Require Node 24 And Actions Runner 2.327.1 Or Newer.
jobs:
  check_fast:
    name: Check Fast (${{ inputs.os }})
    runs-on: ${{ inputs.os == 'linux' && github.event_name == 'push' && github.repository == 'stokker-technologies/dokime' && github.ref == 'refs/heads/dev' && 'stokker-local-linux-x64' || inputs.os == 'linux' && 'ubuntu-24.04' || 'windows-2022' }}
    timeout-minutes: 120
    env:
      MISE_YES: '1'
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.cache/mise-global.toml
      MISE_DATA_DIR: ${{ github.workspace }}/.cache/mise
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      GITHUB_TOKEN: ${{ github.token }}
      STKR_COVERAGE: '0'
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - &tools_restore
        id: tools_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: tools-${{ runner.os }}-${{ runner.arch }}-v2-${{ hashFiles('mise.lock', 'mise.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tools-${{ runner.os }}-${{ runner.arch }}-v2-${{ hashFiles('mise.lock', 'mise.toml') }}-
          path: .cache/mise/
      - &sources_restore
        id: sources_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: sources-${{ runner.os }}-${{ runner.arch }}-v2-${{ hashFiles('Cargo.lock', 'uv.lock', 'pnpm-lock.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sources-${{ runner.os }}-${{ runner.arch }}-v2-${{ hashFiles('Cargo.lock', 'uv.lock', 'pnpm-lock.yaml') }}-
          path: &source_paths |
            .cache/cargo/registry/cache/
            .cache/cargo/registry/index/
            .cache/cargo/git/db/
            .cache/uv/
      - &linux
        name: Prepare Linux
        if: inputs.os == 'linux'
        shell: bash
        run: . tools/ci/install.sh
      - &windows
        name: Prepare Windows
        if: inputs.os == 'windows'
        shell: pwsh
        run: . ./tools/ci/install.ps1
      - name: Check Route
        if: github.base_ref == 'main'
        run: mise run --skip-tools ci:route
      - run: mise run --skip-tools check:fast

  contracts_prepare_release:
    name: Contracts Prepare Release (${{ inputs.os }})
    needs: check_fast
    runs-on: ${{ inputs.os == 'linux' && 'ubuntu-24.04' || 'windows-2022' }}
    timeout-minutes: 120
    env:
      MISE_YES: '1'
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.cache/mise-global.toml
      MISE_DATA_DIR: ${{ github.workspace }}/.cache/mise
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      GITHUB_TOKEN: ${{ github.token }}
      STKR_COVERAGE: '0'
      DOKIME_CI_ROLE: contracts
      DOKIME_CI_PLATFORM: ${{ inputs.os }}
    outputs:
      artifact_name: ${{ steps.contracts.outputs.artifact_name }}
      tool_artifact_name: ${{ steps.contracts.outputs.tool_artifact_name }}
      sha256: ${{ steps.contracts.outputs.sha256 }}
    steps:
      - *checkout
      - *tools_restore
      - *sources_restore
      - id: harmos_pin
        shell: bash
        run: echo "revision=$(python tools/python/src/dokime_tools/ci/bootstrap.py --harmos-key)" >> "$GITHUB_OUTPUT"
      - id: harmos_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: harmos-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.harmos_pin.outputs.revision }}-${{ hashFiles('mise.lock') }}
          path: .cache/harmos-tool/
      - id: portable_compiler_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: compiler-${{ runner.os }}-${{ runner.arch }}-portable-and-tool-release-v2-${{ hashFiles('mise.lock', '.cargo/config.toml', 'Cargo.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            compiler-${{ runner.os }}-${{ runner.arch }}-portable-and-tool-release-v2-${{ hashFiles('mise.lock', '.cargo/config.toml', 'Cargo.toml') }}-${{ hashFiles('Cargo.lock') }}-
            compiler-${{ runner.os }}-${{ runner.arch }}-portable-and-tool-release-v2-${{ hashFiles('mise.lock', '.cargo/config.toml', 'Cargo.toml') }}-
          path: &portable_compiler_paths |
            target/release/.fingerprint/
            target/release/build/
            target/release/deps/
            target/tooling/harmos/release/.fingerprint/
            target/tooling/harmos/release/build/
            target/tooling/harmos/release/deps/
      - *linux
      - *windows
      - run: mise run --skip-tools contracts:prepare:release
      - run: mise run --skip-tools ci:contracts:archive
      - id: contracts
        run: mise run --skip-tools ci:contracts:publish
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.contracts.outputs.artifact_name }}
          path: |
            target/contracts/dokime-contract.tar
            target/contracts/dokime-contract.tar.sha256
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.contracts.outputs.tool_artifact_name }}
          path: .cache/harmos-tool/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Preserve Published Harmos Tool
        if: success() && steps.harmos_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.harmos_cache.outputs.cache-primary-key }}
          path: .cache/harmos-tool/
      - name: Preserve Portable Compiler Outputs
        if: always() && steps.portable_compiler_cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.portable_compiler_cache.outputs.cache-primary-key }}
          path: *portable_compiler_paths

  build_release:
    name: Build Release (${{ inputs.os }})
    needs: contracts_prepare_release
    environment: ${{ inputs.authorization }}
    runs-on: ${{ inputs.os == 'linux' && 'ubuntu-24.04' || 'windows-2022' }}
    timeout-minutes: 360
    env:
      MISE_YES: '1'
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.cache/mise-global.toml
      MISE_DATA_DIR: ${{ github.workspace }}/.cache/mise
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      GITHUB_TOKEN: ${{ github.token }}
      STKR_COVERAGE: '0'
      DOKIME_CI_ROLE: build
      DOKIME_CONTRACT_EXPORT: ${{ github.workspace }}/target/contracts/restored
      DOKIME_CONTRACT_SHA256: ${{ needs.contracts_prepare_release.outputs.sha256 }}
      DOKIME_RELEASE_CONTEXT: ${{ inputs.authorization == 'release' }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.authorization == 'release' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.authorization == 'release' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
    outputs:
      artifact_name: ${{ steps.build.outputs.artifact_name }}
    steps:
      - *checkout
      - *tools_restore
      - *sources_restore
      - id: compiler_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: compiler-${{ runner.os }}-${{ runner.arch }}-native-release-v2-${{ hashFiles('mise.lock', '.cargo/config.toml', 'Cargo.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            compiler-${{ runner.os }}-${{ runner.arch }}-native-release-v2-${{ hashFiles('mise.lock', '.cargo/config.toml', 'Cargo.toml') }}-${{ hashFiles('Cargo.lock') }}-
            compiler-${{ runner.os }}-${{ runner.arch }}-native-release-v2-${{ hashFiles('mise.lock', '.cargo/config.toml', 'Cargo.toml') }}-
          path: &release_compiler_paths |
            target/release/.fingerprint/
            target/release/build/
            target/release/deps/
            target/wasm32-unknown-unknown/release/.fingerprint/
            target/wasm32-unknown-unknown/release/build/
            target/wasm32-unknown-unknown/release/deps/
            .cache/sccache/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.contracts_prepare_release.outputs.tool_artifact_name }}
          path: .cache/harmos-tool/
      - *linux
      - *windows
      - &contract_download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.contracts_prepare_release.outputs.artifact_name }}
          path: target/contracts/
      - &contract_restore
        run: mise run --skip-tools ci:contracts:restore
      - id: build
        run: mise run --skip-tools build:release
      - name: Preserve Installed Tools
        if: always() && steps.tools_cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.tools_cache.outputs.cache-primary-key }}
          path: .cache/mise/
      - name: Preserve Downloaded Sources
        if: always() && steps.sources_cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.sources_cache.outputs.cache-primary-key }}
          path: *source_paths
      - name: Preserve Release Compiler Outputs
        if: always() && steps.compiler_cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.compiler_cache.outputs.cache-primary-key }}
          path: *release_compiler_paths
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: dist/downloads/dokime-${{ inputs.os }}.zip
          if-no-files-found: error
          retention-days: 30
      - name: Preserve Build Diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-diagnostics-${{ inputs.os }}
          path: |
            target/cargo-timings/*.html
            target/ci/
          retention-days: 30

  test_integration_javascript:
    name: Test Integration Javascript (${{ inputs.os }})
    needs: contracts_prepare_release
    runs-on: ${{ inputs.os == 'linux' && 'ubuntu-24.04' || 'windows-2022' }}
    timeout-minutes: 120
    env:
      MISE_YES: '1'
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.cache/mise-global.toml
      MISE_DATA_DIR: ${{ github.workspace }}/.cache/mise
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      GITHUB_TOKEN: ${{ github.token }}
      STKR_COVERAGE: '0'
      DOKIME_CI_ROLE: javascript
      DOKIME_CONTRACT_EXPORT: ${{ github.workspace }}/target/contracts/restored
      DOKIME_CONTRACT_SHA256: ${{ needs.contracts_prepare_release.outputs.sha256 }}
    steps:
      - *checkout
      - *tools_restore
      - *sources_restore
      - *linux
      - *windows
      - *contract_download
      - *contract_restore
      - run: mise run --skip-tools test:integration:javascript
      - name: Preserve Correctness Evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ inputs.os }}-integration-javascript
          include-hidden-files: true
          path: .stkr/tests/
          if-no-files-found: error
          retention-days: 30

  test_integration_rust:
    name: Test Integration Rust (${{ inputs.os }})
    needs: build_release
    runs-on: ${{ inputs.os == 'linux' && github.event_name == 'push' && github.repository == 'stokker-technologies/dokime' && github.ref == 'refs/heads/dev' && 'stokker-local-linux-x64' || inputs.os == 'linux' && 'ubuntu-24.04' || 'windows-2022' }}
    timeout-minutes: 360
    env:
      MISE_YES: '1'
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.cache/mise-global.toml
      MISE_DATA_DIR: ${{ github.workspace }}/.cache/mise
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      GITHUB_TOKEN: ${{ github.token }}
      STKR_COVERAGE: '0'
      DOKIME_CI_ROLE: test
    steps:
      - *checkout
      - *tools_restore
      - *sources_restore
      - *linux
      - *windows
      - &build_download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build_release.outputs.artifact_name }}
          path: dist/downloads/
      - run: mise run --skip-tools ci:artifacts:restore
      - run: mise run --skip-tools test:integration:rust
      - name: Preserve Correctness Evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ inputs.os }}-integration-rust
          include-hidden-files: true
          path: .stkr/tests/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve Native Test Diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-diagnostics-${{ inputs.os }}-integration-rust
          path: |
            target/validation/default/
            target/cargo-timings/*.html
            target/ci/
          retention-days: 30

  test_integration_python:
    name: Test Integration Python (${{ inputs.os }})
    needs: build_release
    runs-on: ${{ inputs.os == 'linux' && github.event_name == 'push' && github.repository == 'stokker-technologies/dokime' && github.ref == 'refs/heads/dev' && 'stokker-local-linux-x64' || inputs.os == 'linux' && 'ubuntu-24.04' || 'windows-2022' }}
    timeout-minutes: 360
    env:
      MISE_YES: '1'
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.cache/mise-global.toml
      MISE_DATA_DIR: ${{ github.workspace }}/.cache/mise
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      GITHUB_TOKEN: ${{ github.token }}
      STKR_COVERAGE: '0'
      DOKIME_CI_ROLE: test
    steps:
      - *checkout
      - *tools_restore
      - *sources_restore
      - *linux
      - *windows
      - *build_download
      - run: mise run --skip-tools ci:artifacts:restore
      - run: mise run --skip-tools test:integration:python
      - name: Preserve Correctness Evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ inputs.os }}-integration-python
          include-hidden-files: true
          path: .stkr/tests/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve Native Test Diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-diagnostics-${{ inputs.os }}-integration-python
          path: |
            target/validation/default/
            target/cargo-timings/*.html
            target/ci/
          retention-days: 30

  test_acceptance_rust:
    name: Test Acceptance Rust (${{ inputs.os }})
    needs: build_release
    runs-on: ${{ inputs.os == 'linux' && github.event_name == 'push' && github.repository == 'stokker-technologies/dokime' && github.ref == 'refs/heads/dev' && 'stokker-local-linux-x64' || inputs.os == 'linux' && 'ubuntu-24.04' || 'windows-2022' }}
    timeout-minutes: 360
    env:
      MISE_YES: '1'
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.cache/mise-global.toml
      MISE_DATA_DIR: ${{ github.workspace }}/.cache/mise
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      GITHUB_TOKEN: ${{ github.token }}
      STKR_COVERAGE: '0'
      DOKIME_CI_ROLE: test
    steps:
      - *checkout
      - *tools_restore
      - *sources_restore
      - *linux
      - *windows
      - *build_download
      - run: mise run --skip-tools ci:artifacts:restore
      - run: mise run --skip-tools test:acceptance:rust
      - name: Preserve Correctness Evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ inputs.os }}-acceptance-rust
          include-hidden-files: true
          path: .stkr/tests/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve Native Test Diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-diagnostics-${{ inputs.os }}-acceptance-rust
          path: |
            target/validation/default/
            target/cargo-timings/*.html
            target/ci/
          retention-days: 30

  test_acceptance_python:
    name: Test Acceptance Python (${{ inputs.os }})
    needs: build_release
    runs-on: ${{ inputs.os == 'linux' && github.event_name == 'push' && github.repository == 'stokker-technologies/dokime' && github.ref == 'refs/heads/dev' && 'stokker-local-linux-x64' || inputs.os == 'linux' && 'ubuntu-24.04' || 'windows-2022' }}
    timeout-minutes: 360
    env:
      MISE_YES: '1'
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.cache/mise-global.toml
      MISE_DATA_DIR: ${{ github.workspace }}/.cache/mise
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      GITHUB_TOKEN: ${{ github.token }}
      STKR_COVERAGE: '0'
      DOKIME_CI_ROLE: test
    steps:
      - *checkout
      - *tools_restore
      - *sources_restore
      - *linux
      - *windows
      - *build_download
      - run: mise run --skip-tools ci:artifacts:restore
      - run: mise run --skip-tools test:acceptance:python
      - name: Preserve Correctness Evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ inputs.os }}-acceptance-python
          include-hidden-files: true
          path: .stkr/tests/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve Example Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-${{ inputs.os }}-acceptance-python
          path: target/validation/examples/charger-report.html
          if-no-files-found: error
          retention-days: 30
      - name: Preserve Native Test Diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-diagnostics-${{ inputs.os }}-acceptance-python
          path: |
            target/validation/default/
            target/cargo-timings/*.html
            target/ci/
          retention-days: 30

  test_system_javascript:
    name: Test System Javascript (${{ inputs.os }})
    if: inputs.os == 'windows'
    needs: build_release
    runs-on: ${{ inputs.os == 'linux' && github.event_name == 'push' && github.repository == 'stokker-technologies/dokime' && github.ref == 'refs/heads/dev' && 'stokker-local-linux-x64' || inputs.os == 'linux' && 'ubuntu-24.04' || 'windows-2022' }}
    timeout-minutes: 360
    env:
      MISE_YES: '1'
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.cache/mise-global.toml
      MISE_DATA_DIR: ${{ github.workspace }}/.cache/mise
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      GITHUB_TOKEN: ${{ github.token }}
      STKR_COVERAGE: '0'
      DOKIME_CI_ROLE: test
      DOKIME_E2E_DISPOSABLE_WINDOWS: '1'
    steps:
      - *checkout
      - *tools_restore
      - *sources_restore
      - *linux
      - *windows
      - *build_download
      - run: mise run --skip-tools ci:artifacts:restore
      - run: mise run --skip-tools test:system:javascript
      - name: Preserve Correctness Evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ inputs.os }}-system-javascript
          include-hidden-files: true
          path: .stkr/tests/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve Native Test Diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-diagnostics-${{ inputs.os }}-system-javascript
          path: |
            target/validation/default/
            target/cargo-timings/*.html
            target/ci/
            target/native-desktop-e2e-*/
          retention-days: 30

  ci_coverage:
    name: Ci Coverage (${{ inputs.os }})
    needs: build_release
    runs-on: ${{ inputs.os == 'linux' && github.event_name == 'push' && github.repository == 'stokker-technologies/dokime' && github.ref == 'refs/heads/dev' && 'stokker-local-linux-x64' || inputs.os == 'linux' && 'ubuntu-24.04' || 'windows-2022' }}
    timeout-minutes: 360
    env:
      MISE_YES: '1'
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.cache/mise-global.toml
      MISE_DATA_DIR: ${{ github.workspace }}/.cache/mise
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      GITHUB_TOKEN: ${{ github.token }}
      STKR_COVERAGE: '0'
      DOKIME_CI_ROLE: coverage
    outputs:
      artifact_name: ${{ steps.coverage.outputs.artifact_name }}
    steps:
      - *checkout
      - *tools_restore
      - *sources_restore
      - id: coverage_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: compiler-${{ runner.os }}-${{ runner.arch }}-coverage-release-v2-${{ hashFiles('mise.lock', '.cargo/config.toml', 'Cargo.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            compiler-${{ runner.os }}-${{ runner.arch }}-coverage-release-v2-${{ hashFiles('mise.lock', '.cargo/config.toml', 'Cargo.toml') }}-${{ hashFiles('Cargo.lock') }}-
            compiler-${{ runner.os }}-${{ runner.arch }}-coverage-release-v2-${{ hashFiles('mise.lock', '.cargo/config.toml', 'Cargo.toml') }}-
          path: &coverage_compiler_paths |
            target/validation/cargo/coverage/release/.fingerprint/
            target/validation/cargo/coverage/release/build/
            target/validation/cargo/coverage/release/deps/
      - *linux
      - *windows
      - *build_download
      - run: mise run --skip-tools ci:artifacts:restore
      - id: coverage
        run: mise run --skip-tools ci:coverage
      - name: Preserve Coverage Compiler Outputs
        if: always() && steps.coverage_cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.coverage_cache.outputs.cache-primary-key }}
          path: *coverage_compiler_paths
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.coverage.outputs.artifact_name }}
          path: dist/coverage/${{ inputs.os }}/
          if-no-files-found: error
          retention-days: 90
      - name: Preserve Coverage Reports On Failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-diagnostics-${{ inputs.os }}
          include-hidden-files: true
          path: |
            .stkr/tests/
            target/validation/coverage/
            target/cargo-timings/*.html
            target/ci/
          retention-days: 30

  test:
    name: Test (${{ inputs.os }})
    if: ${{ !cancelled() && needs.build_release.result == 'success' && (inputs.os != 'windows' || needs.test_system_javascript.result == 'success') }}
    needs: [build_release, test_integration_javascript, test_integration_rust, test_integration_python, test_acceptance_rust, test_acceptance_python, test_system_javascript, ci_coverage]
    runs-on: ${{ inputs.os == 'linux' && github.event_name == 'push' && github.repository == 'stokker-technologies/dokime' && github.ref == 'refs/heads/dev' && 'stokker-local-linux-x64' || inputs.os == 'linux' && 'ubuntu-24.04' || 'windows-2022' }}
    timeout-minutes: 60
    env:
      MISE_YES: '1'
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.cache/mise-global.toml
      MISE_DATA_DIR: ${{ github.workspace }}/.cache/mise
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      GITHUB_TOKEN: ${{ github.token }}
      STKR_COVERAGE: '0'
      DOKIME_CI_ROLE: catalog
    steps:
      - *checkout
      - *tools_restore
      - *sources_restore
      - *linux
      - *windows
      - *build_download
      - run: mise run --skip-tools ci:artifacts:restore
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: evidence-${{ inputs.os }}-*
          path: dist/evidence-downloads/
      - name: Select Exact Correctness Lanes
        run: mise run --skip-tools ci:artifacts:collect
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: example-${{ inputs.os }}-acceptance-python
          path: dist/examples/${{ inputs.os }}/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.ci_coverage.outputs.artifact_name }}
          path: dist/coverage/${{ inputs.os }}/
      - id: test
        run: mise run --skip-tools ci:artifacts:validate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.test.outputs.artifact_name }}
          path: dist/downloads/dokime-${{ inputs.os }}.zip
          if-no-files-found: error
          retention-days: 90
