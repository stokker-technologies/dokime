# Temporary Native Diagnostic; Remove Before Final Candidate Validation.
name: Diagnostic / Windows Storage
"on":
  push:
    branches: [chore/migrate-hub-ci]
    paths: [.github/workflows/diagnostic-windows-startup.yml]
permissions:
  contents: read
  actions: read
env:
  PROFILE: dev
  MISE_LOCKED: "1"
  MISE_EXPERIMENTAL: "1"
  MISE_ENABLE_TOOLS: python,rust,uv,aqua:nextest-rs/nextest/cargo-nextest
jobs:
  storage:
    name: Hosted Windows Storage Diagnostic
    runs-on: windows-latest
    # The Original Native Test Deadline Remains Unchanged.
    timeout-minutes: 30
    steps:
    - name: Configure Checkout Git
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $count = if ($env:GIT_CONFIG_COUNT) { $env:GIT_CONFIG_COUNT } else { '0' }
        if ($count -notmatch '^\d+$' -or [int]$count -gt 1000) { throw 'Invalid inherited Git configuration count' }
        [Environment]::SetEnvironmentVariable("GIT_CONFIG_KEY_$count", 'core.longpaths')
        [Environment]::SetEnvironmentVariable("GIT_CONFIG_VALUE_$count", 'true')
        $env:GIT_CONFIG_COUNT = ([int]$count + 1).ToString()
        if ($env:GITHUB_ENV) {
          foreach ($name in @('GIT_CONFIG_COUNT', "GIT_CONFIG_KEY_$count", "GIT_CONFIG_VALUE_$count")) {
            "$name=$([Environment]::GetEnvironmentVariable($name))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
        }
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        ref: 10b65651e83435925490550db6acaa8941c5f877
    - name: Resolve Mise Directory
      if: runner.os == 'Windows'
      shell: pwsh
      run: |-
        $identity = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
        $bytes = [Text.Encoding]::UTF8.GetBytes($identity)
        $slot = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
        $directory = Join-Path ([IO.Path]::GetTempPath()) ('stkr-mise/' + $slot)
        "MISE_DATA_DIR=$directory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "STKR_RUNNER_IMAGE=$($env:ImageOS ?? 'windows')-$($env:ImageVersion ?? 'self')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    - name: Identify Installation Roots
      if: runner.os == 'Windows'
      shell: pwsh
      run: |-
        foreach ($entry in @{ STKR_MISE_ROOT = $env:MISE_DATA_DIR; STKR_WORKSPACE_ROOT = $env:GITHUB_WORKSPACE }.GetEnumerator()) {
          $bytes = [System.Text.Encoding]::UTF8.GetBytes([System.IO.Path]::GetFullPath($entry.Value))
          $digest = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          "$($entry.Key)=$digest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        }
    - name: Bootstrap
      run: python tools/python/src/dokime_tools/ci/bootstrap.py
    - name: Prepare Windows Tools
      if: runner.os == 'Windows'
      shell: pwsh
      run: |-
        $ErrorActionPreference = 'Stop'
        # === Setup === #
        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
        if (!(Test-Path -LiteralPath $vswhere -PathType Leaf)) { throw 'The standard Windows image requires installed Visual Studio Build Tools' }
        $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if ($LASTEXITCODE -ne 0 -or !$installation) { throw 'The standard Windows image requires installed Visual Studio C++ tools' }
        Import-Module (Join-Path $installation 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
        Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64' | Out-Null
        $compiler = @($env:PATH -split [IO.Path]::PathSeparator | Where-Object { [IO.Path]::IsPathFullyQualified($_) } | ForEach-Object { Join-Path $_ 'cl.exe' } | Where-Object { (Test-Path -LiteralPath $_ -PathType Leaf) -and $_.StartsWith($installation, [StringComparison]::OrdinalIgnoreCase) }) | Select-Object -First 1
        if (!$compiler -or !(Test-Path -LiteralPath (Join-Path (Split-Path -Parent $compiler) 'link.exe') -PathType Leaf)) { throw 'MSVC compiler and linker are required from the selected installation' }
        $archiveRoot = Join-Path $PWD '.cache/bootstrap/zstd-1.5.7'
        $archive = Join-Path $archiveRoot 'zstd.zip'
        New-Item -ItemType Directory -Force $archiveRoot | Out-Null
        $checksum = 'acb4e8111511749dc7a3ebedca9b04190e37a17afeb73f55d4425dbf0b90fad9'
        if (!(Test-Path -LiteralPath $archive) -or (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant() -ne $checksum) {
            Invoke-WebRequest 'https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-v1.5.7-win64.zip' -OutFile $archive
        }
        if ((Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant() -ne $checksum) { throw 'Pinned zstd archive checksum mismatch' }
        Expand-Archive -LiteralPath $archive -DestinationPath $archiveRoot -Force
        $compressor = Join-Path $archiveRoot 'zstd-v1.5.7-win64/zstd.exe'
        if (!(Test-Path -LiteralPath $compressor -PathType Leaf)) { throw 'Pinned zstd executable missing' }
        $compressorRoot = Split-Path -Parent $compressor
        $env:PATH = (Split-Path -Parent $compiler) + [IO.Path]::PathSeparator + $compressorRoot + [IO.Path]::PathSeparator + $env:PATH
        # === Verification === #
        & $compressor --version
        if ($LASTEXITCODE -ne 0) { throw 'Pinned zstd cannot execute' }
        $selectedLink = @($env:PATH -split [IO.Path]::PathSeparator | Where-Object { [IO.Path]::IsPathFullyQualified($_) } | ForEach-Object { Join-Path $_ 'link.exe' } | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf }) | Select-Object -First 1
        if ($selectedLink -ne (Join-Path (Split-Path -Parent $compiler) 'link.exe')) { throw 'MSVC linker precedence is required' }
        # === Entry Point === #
        $paths = @($env:PATH -split [IO.Path]::PathSeparator | ForEach-Object { $_.Trim('"') } | Where-Object { [IO.Path]::GetPathRoot($_).Length -ge 3 })
        $candidates = @($paths | ForEach-Object { Join-Path $_ 'tar.exe' })
        foreach ($git in @($paths | ForEach-Object { Join-Path $_ 'git.exe' } | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf })) {
          $root = Split-Path -Parent (Split-Path -Parent $git)
          $candidates += Join-Path $root 'usr/bin/tar.exe'
        }
        $tar = $null
        foreach ($candidate in @($candidates | Select-Object -Unique)) {
          if ([IO.Path]::GetPathRoot($candidate).Length -lt 3 -or !(Test-Path -LiteralPath $candidate -PathType Leaf)) { continue }
          try {
            $version = & $candidate --version 2>$null
            if ($LASTEXITCODE -ne 0 -or "$version" -notmatch '^tar \(GNU tar\)') { continue }
            $capabilities = & $candidate --help 2>$null
            if ($LASTEXITCODE -ne 0 -or "$capabilities" -notmatch '--force-local' -or "$capabilities" -notmatch '--use-compress-program') { continue }
            $tar = $candidate
            break
          } catch { continue }
        }
        if (!$tar) { throw 'GNU tar with force-local and external-compressor support is required from the standard Git image baseline' }
        $env:PATH = (@((Split-Path -Parent $compiler), (Split-Path -Parent $tar), $compressorRoot) + @($env:PATH -split [IO.Path]::PathSeparator) | Select-Object -Unique) -join [IO.Path]::PathSeparator
        if ($env:GITHUB_ENV) {
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($null -ne $value) { "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append }
          }
        }
    - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      env:
        RUSTC_WRAPPER: ""
      with:
        install: true
        cache: false
        mise_dir: ${{ env.MISE_DATA_DIR }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        artifact-ids: 12529665166,12530021778
        merge-multiple: true
        run-id: 40014526197
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Extract Build
      shell: pwsh
      run: |-
        $paths = @($env:PATH -split [IO.Path]::PathSeparator | ForEach-Object { $_.Trim('"') } | Where-Object { [IO.Path]::GetPathRoot($_).Length -ge 3 })
        $candidates = @($paths | ForEach-Object { Join-Path $_ 'tar.exe' })
        foreach ($git in @($paths | ForEach-Object { Join-Path $_ 'git.exe' } | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf })) {
          $root = Split-Path -Parent (Split-Path -Parent $git)
          $candidates += Join-Path $root 'usr/bin/tar.exe'
        }
        $tar = $null
        foreach ($candidate in @($candidates | Select-Object -Unique)) {
          if ([IO.Path]::GetPathRoot($candidate).Length -lt 3 -or !(Test-Path -LiteralPath $candidate -PathType Leaf)) { continue }
          try {
            $version = & $candidate --version 2>$null
            if ($LASTEXITCODE -ne 0 -or "$version" -notmatch '^tar \(GNU tar\)') { continue }
            $capabilities = & $candidate --help 2>$null
            if ($LASTEXITCODE -ne 0 -or "$capabilities" -notmatch '--force-local' -or "$capabilities" -notmatch '--use-compress-program') { continue }
            $tar = $candidate
            break
          } catch { continue }
        }
        if (!$tar) { throw 'GNU tar with force-local and external-compressor support is required from the standard Git image baseline' }
        foreach ($kind in @('product', 'tests')) {
          & $tar -xf "build-$kind-${{ env.PROFILE }}-windows.tar.zst" --force-local --use-compress-program "zstd -d"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
    - name: Run Original Storage Test Without Rebuilding
      shell: pwsh
      run: |
        mise exec -- uv run --locked --project tools/python python -m dokime_tools.test.run test --category integration --language rust --profile dev -- -p dokime-runtime -E 'test(=services::execution::storage::execution_save_sealing)' --no-capture
        exit $LASTEXITCODE
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: diagnostic-hosted-windows-storage
        path: target/tests/dev/*/integration-rust/
        retention-days: 7
        if-no-files-found: error
        include-hidden-files: true
