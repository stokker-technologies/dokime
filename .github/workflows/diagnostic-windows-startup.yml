# Temporary Native Diagnostic; Remove Before Final Candidate Validation.
name: Diagnostic / Windows Desktop Startup
"on":
  push:
    branches: [chore/migrate-hub-ci]
    paths: [.github/workflows/diagnostic-windows-startup.yml]
permissions:
  contents: read
  actions: read
env:
  PROFILE: dev
  MISE_LOCKED: "1"
  MISE_EXPERIMENTAL: "1"
  MISE_ENABLE_TOOLS: node,python,pnpm,uv
  DOKIME_E2E_JOURNEYS: owned-startup
jobs:
  token:
    name: Hosted Windows Token Diagnostic
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
    - name: Record Process Token
      shell: pwsh
      run: |
        $principal = [Security.Principal.WindowsPrincipal]::new([Security.Principal.WindowsIdentity]::GetCurrent())
        @{ Elevated = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator); UserInteractive = [Environment]::UserInteractive; SessionId = (Get-Process -Id $PID).SessionId } | ConvertTo-Json -Compress
  startup:
    name: Hosted Windows Startup Diagnostic
    runs-on: windows-latest
    # Bounds A Failed Native Launch; Its Existing Driver Deadline Remains Unchanged.
    timeout-minutes: 30
    steps:
    - name: Configure Checkout Git
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $count = if ($env:GIT_CONFIG_COUNT) { $env:GIT_CONFIG_COUNT } else { '0' }
        if ($count -notmatch '^\d+$' -or [int]$count -gt 1000) { throw 'Invalid inherited Git configuration count' }
        [Environment]::SetEnvironmentVariable("GIT_CONFIG_KEY_$count", 'core.longpaths')
        [Environment]::SetEnvironmentVariable("GIT_CONFIG_VALUE_$count", 'true')
        $env:GIT_CONFIG_COUNT = ([int]$count + 1).ToString()
        if ($env:GITHUB_ENV) {
          foreach ($name in @('GIT_CONFIG_COUNT', "GIT_CONFIG_KEY_$count", "GIT_CONFIG_VALUE_$count")) {
            "$name=$([Environment]::GetEnvironmentVariable($name))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
        }
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        ref: 10b65651e83435925490550db6acaa8941c5f877
    - name: Resolve Mise Directory
      if: runner.os == 'Windows'
      shell: pwsh
      run: |-
        $identity = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
        $bytes = [Text.Encoding]::UTF8.GetBytes($identity)
        $slot = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
        $directory = Join-Path ([IO.Path]::GetTempPath()) ('stkr-mise/' + $slot)
        "MISE_DATA_DIR=$directory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "STKR_RUNNER_IMAGE=$($env:ImageOS ?? 'windows')-$($env:ImageVersion ?? 'self')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    - name: Identify Installation Roots
      if: runner.os == 'Windows'
      shell: pwsh
      run: |-
        foreach ($entry in @{ STKR_MISE_ROOT = $env:MISE_DATA_DIR; STKR_WORKSPACE_ROOT = $env:GITHUB_WORKSPACE }.GetEnumerator()) {
          $bytes = [System.Text.Encoding]::UTF8.GetBytes([System.IO.Path]::GetFullPath($entry.Value))
          $digest = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          "$($entry.Key)=$digest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        }
    - name: Bootstrap
      run: python tools/python/src/dokime_tools/ci/bootstrap.py --desktop
    - name: Prepare Windows Tools
      if: runner.os == 'Windows'
      shell: pwsh
      run: |-
        $ErrorActionPreference = 'Stop'
        # === Setup === #
        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
        if (!(Test-Path -LiteralPath $vswhere -PathType Leaf)) { throw 'The standard Windows image requires installed Visual Studio Build Tools' }
        $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if ($LASTEXITCODE -ne 0 -or !$installation) { throw 'The standard Windows image requires installed Visual Studio C++ tools' }
        Import-Module (Join-Path $installation 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
        Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64' | Out-Null
        $compiler = @($env:PATH -split [IO.Path]::PathSeparator | Where-Object { [IO.Path]::IsPathFullyQualified($_) } | ForEach-Object { Join-Path $_ 'cl.exe' } | Where-Object { (Test-Path -LiteralPath $_ -PathType Leaf) -and $_.StartsWith($installation, [StringComparison]::OrdinalIgnoreCase) }) | Select-Object -First 1
        if (!$compiler -or !(Test-Path -LiteralPath (Join-Path (Split-Path -Parent $compiler) 'link.exe') -PathType Leaf)) { throw 'MSVC compiler and linker are required from the selected installation' }
        $archiveRoot = Join-Path $PWD '.cache/bootstrap/zstd-1.5.7'
        $archive = Join-Path $archiveRoot 'zstd.zip'
        New-Item -ItemType Directory -Force $archiveRoot | Out-Null
        $checksum = 'acb4e8111511749dc7a3ebedca9b04190e37a17afeb73f55d4425dbf0b90fad9'
        if (!(Test-Path -LiteralPath $archive) -or (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant() -ne $checksum) {
            Invoke-WebRequest 'https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-v1.5.7-win64.zip' -OutFile $archive
        }
        if ((Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant() -ne $checksum) { throw 'Pinned zstd archive checksum mismatch' }
        Expand-Archive -LiteralPath $archive -DestinationPath $archiveRoot -Force
        $compressor = Join-Path $archiveRoot 'zstd-v1.5.7-win64/zstd.exe'
        if (!(Test-Path -LiteralPath $compressor -PathType Leaf)) { throw 'Pinned zstd executable missing' }
        $compressorRoot = Split-Path -Parent $compressor
        $env:PATH = (Split-Path -Parent $compiler) + [IO.Path]::PathSeparator + $compressorRoot + [IO.Path]::PathSeparator + $env:PATH
        # === Verification === #
        & $compressor --version
        if ($LASTEXITCODE -ne 0) { throw 'Pinned zstd cannot execute' }
        $selectedLink = @($env:PATH -split [IO.Path]::PathSeparator | Where-Object { [IO.Path]::IsPathFullyQualified($_) } | ForEach-Object { Join-Path $_ 'link.exe' } | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf }) | Select-Object -First 1
        if ($selectedLink -ne (Join-Path (Split-Path -Parent $compiler) 'link.exe')) { throw 'MSVC linker precedence is required' }
        # === Entry Point === #
        $paths = @($env:PATH -split [IO.Path]::PathSeparator | ForEach-Object { $_.Trim('"') } | Where-Object { [IO.Path]::GetPathRoot($_).Length -ge 3 })
        $candidates = @($paths | ForEach-Object { Join-Path $_ 'tar.exe' })
        foreach ($git in @($paths | ForEach-Object { Join-Path $_ 'git.exe' } | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf })) {
          $root = Split-Path -Parent (Split-Path -Parent $git)
          $candidates += Join-Path $root 'usr/bin/tar.exe'
        }
        $tar = $null
        foreach ($candidate in @($candidates | Select-Object -Unique)) {
          if ([IO.Path]::GetPathRoot($candidate).Length -lt 3 -or !(Test-Path -LiteralPath $candidate -PathType Leaf)) { continue }
          try {
            $version = & $candidate --version 2>$null
            if ($LASTEXITCODE -ne 0 -or "$version" -notmatch '^tar \(GNU tar\)') { continue }
            $capabilities = & $candidate --help 2>$null
            if ($LASTEXITCODE -ne 0 -or "$capabilities" -notmatch '--force-local' -or "$capabilities" -notmatch '--use-compress-program') { continue }
            $tar = $candidate
            break
          } catch { continue }
        }
        if (!$tar) { throw 'GNU tar with force-local and external-compressor support is required from the standard Git image baseline' }
        $env:PATH = (@((Split-Path -Parent $compiler), (Split-Path -Parent $tar), $compressorRoot) + @($env:PATH -split [IO.Path]::PathSeparator) | Select-Object -Unique) -join [IO.Path]::PathSeparator
        if ($env:GITHUB_ENV) {
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($null -ne $value) { "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append }
          }
        }
    - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      env:
        RUSTC_WRAPPER: ""
      with:
        install: true
        cache: false
        mise_dir: ${{ env.MISE_DATA_DIR }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: build-product-${{ env.PROFILE }}-windows
        run-id: 40014526197
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Extract Build
      shell: pwsh
      run: |-
        $paths = @($env:PATH -split [IO.Path]::PathSeparator | ForEach-Object { $_.Trim('"') } | Where-Object { [IO.Path]::GetPathRoot($_).Length -ge 3 })
        $candidates = @($paths | ForEach-Object { Join-Path $_ 'tar.exe' })
        foreach ($git in @($paths | ForEach-Object { Join-Path $_ 'git.exe' } | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf })) {
          $root = Split-Path -Parent (Split-Path -Parent $git)
          $candidates += Join-Path $root 'usr/bin/tar.exe'
        }
        $tar = $null
        foreach ($candidate in @($candidates | Select-Object -Unique)) {
          if ([IO.Path]::GetPathRoot($candidate).Length -lt 3 -or !(Test-Path -LiteralPath $candidate -PathType Leaf)) { continue }
          try {
            $version = & $candidate --version 2>$null
            if ($LASTEXITCODE -ne 0 -or "$version" -notmatch '^tar \(GNU tar\)') { continue }
            $capabilities = & $candidate --help 2>$null
            if ($LASTEXITCODE -ne 0 -or "$capabilities" -notmatch '--force-local' -or "$capabilities" -notmatch '--use-compress-program') { continue }
            $tar = $candidate
            break
          } catch { continue }
        }
        if (!$tar) { throw 'GNU tar with force-local and external-compressor support is required from the standard Git image baseline' }
        & $tar -xf "build-product-${{ env.PROFILE }}-windows.tar.zst" --force-local --use-compress-program "zstd -d"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Record Launch Context And Enable Driver Diagnostics
      shell: pwsh
      run: |
        $directory = Join-Path $PWD 'target/diagnostics/windows-startup'
        New-Item -ItemType Directory -Path $directory -Force | Out-Null
        $browser = @{}
        foreach ($name in @('WEBVIEW2_USER_DATA_FOLDER', 'WEBVIEW2_BROWSER_EXECUTABLE_FOLDER', 'WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS', 'TAURI_WEBVIEW_AUTOMATION', 'SESSIONNAME')) {
          $browser[$name] = [Environment]::GetEnvironmentVariable($name)
        }
        @{ UserInteractive = [Environment]::UserInteractive; SessionId = (Get-Process -Id $PID).SessionId; BrowserEnvironment = $browser; ProductRun = '40014526197'; ProductArtifact = '12529665166'; ProductRevision = '10b65651e83435925490550db6acaa8941c5f877' } | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $directory 'context.json')
        $path = Join-Path $PWD 'crates/dokime-gui/e2e/native-desktop.mjs'
        $source = [IO.File]::ReadAllText($path)
        $before = 'driverProcess = spawn(driver, ["--host=127.0.0.1", `--port=${port}`], {'
        $after = 'driverProcess = spawn(driver, ["--host=127.0.0.1", `--port=${port}`, "--verbose", "--append-log", `--log-path=${join(evidence, "webdriver.log")}`], {'
        if (!$source.Contains($before)) { throw 'The identified candidate launch boundary changed' }
        [IO.File]::WriteAllText($path, $source.Replace($before, $after))
    - name: Exercise Existing Native Startup Without Rebuilding
      shell: pwsh
      run: |
        $directory = Join-Path $PWD 'target/diagnostics/windows-startup'
        $env:CHROME_LOG_FILE = Join-Path $directory 'webview-browser.log'
        $observer = Start-Job -ArgumentList $directory -ScriptBlock {
          param($directory)
          for ($sample = 0; $sample -lt 90; $sample++) {
            $processes = @(Get-CimInstance Win32_Process | Where-Object { $_.Name -in @('dokime-gui.exe', 'msedgedriver.exe', 'msedgewebview2.exe') } | ForEach-Object {
              $process = Get-Process -Id $_.ProcessId -ErrorAction SilentlyContinue
              @{ Name = $_.Name; Id = $_.ProcessId; ParentId = $_.ParentProcessId; SessionId = $_.SessionId; CommandLine = $_.CommandLine; WindowTitle = $process.MainWindowTitle; Responding = $process.Responding }
            })
            @{ Time = (Get-Date).ToString('o'); Processes = $processes } | ConvertTo-Json -Depth 5 -Compress | Add-Content (Join-Path $directory 'live-processes.jsonl')
            Start-Sleep -Seconds 1
          }
        }
        try {
          mise run test:typescript:system --profile dev
          $verdict = $LASTEXITCODE
        } finally {
          Stop-Job $observer
          Remove-Job $observer
          foreach ($root in @("${env:ProgramFiles(x86)}/Microsoft/EdgeWebView/Application", "$env:LOCALAPPDATA/Microsoft/EdgeWebView/Application")) {
            Get-ChildItem -LiteralPath $root -Filter msedgewebview2.exe -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length, VersionInfo | ConvertTo-Json -Depth 4 | Add-Content (Join-Path $directory 'runtime-files.json')
          }
          Get-ChildItem target -Directory -Filter 'native-desktop-work-*' -ErrorAction SilentlyContinue | ForEach-Object { Get-ChildItem -LiteralPath $_.FullName -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length } | ConvertTo-Json -Depth 3 | Set-Content (Join-Path $directory 'work-files.json')
        }
        exit $verdict
    - name: Preserve Native Launch Evidence
      if: always()
      shell: pwsh
      run: |
        $directory = Join-Path $PWD 'target/diagnostics/windows-startup'
        New-Item -ItemType Directory -Path $directory -Force | Out-Null
        Get-CimInstance Win32_Process | Where-Object { $_.Name -in @('dokime-gui.exe', 'msedgedriver.exe', 'msedgewebview2.exe') } | Select-Object Name, ProcessId, ParentProcessId, SessionId, ExecutablePath | ConvertTo-Json -Depth 3 | Set-Content (Join-Path $directory 'processes.json')
        $logs = Join-Path $env:LOCALAPPDATA 'com.stokker.dokime/logs'
        if (Test-Path -LiteralPath $logs) { Copy-Item -LiteralPath $logs -Destination (Join-Path $directory 'desktop-logs') -Recurse }
        Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-30) } -ErrorAction SilentlyContinue | Where-Object { $_.Message -match 'dokime-gui\.exe' } | Select-Object TimeCreated, Id, ProviderName, Message | ConvertTo-Json -Depth 3 | Set-Content (Join-Path $directory 'application-events.json')
        Get-ChildItem target -Directory -Filter 'native-desktop-work-*' -ErrorAction SilentlyContinue | ForEach-Object { Get-ChildItem -LiteralPath $_.FullName -Recurse -Filter DevToolsActivePort -ErrorAction SilentlyContinue } | ForEach-Object { @{ Path = $_.FullName; Value = Get-Content -LiteralPath $_.FullName -Raw } } | ConvertTo-Json -Depth 3 | Set-Content (Join-Path $directory 'devtools-ports.json')
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: diagnostic-hosted-windows-startup
        path: |
          target/diagnostics/windows-startup/
          target/tests/dev/*/system-typescript/
        retention-days: 7
        if-no-files-found: error
        include-hidden-files: true
