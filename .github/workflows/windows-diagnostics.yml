# Temporary Native Diagnostics; Remove Before Final Candidate Validation.
name: Windows Settlement Phases
on:
  push:
    branches: [refactor/conventions-baseline]
permissions:
  contents: read
concurrency:
  group: windows-settlement-diagnostics-${{ github.ref }}
  cancel-in-progress: true
env:
  MISE_LOCKED: "1"
  MISE_ENABLE_TOOLS: node,python,rust,pnpm,uv,aqua:nextest-rs/nextest/cargo-nextest,sccache,protoc
  MISE_DATA_DIR: ${{ github.workspace }}/.cache/mise
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo
  CARGO_INCREMENTAL: "0"
  npm_config_store_dir: ${{ github.workspace }}/.cache/pnpm
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
jobs:
  windows:
    name: Diagnose / Settlement (windows)
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/mise/
          key: ${{ runner.os }}-${{ runner.arch }}-mise-${{ hashFiles('mise.lock') }}
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          RUSTC_WRAPPER: ""
        with:
          install: true
          cache: false
          mise_dir: ${{ github.workspace }}/.cache/mise
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: windows-build-dev
          cache-bin: false
          save-if: "false"
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.18.0
      - name: Prepare Current Report Asset
        run: mise run prepare:report
      - name: Measure Sampling Settlement Under Concurrent Load
        shell: pwsh
        run: |
          Write-Output "Diagnostic consumer: $env:GITHUB_SHA; provisional Harmos: c1dc51e2ffde7ab1955a32224e17fef64c594f5f"
          Write-Output "Seven current stories concurrently; no reused product binaries or retries; this patched graph is not a final delivery candidate"
          $producer = 'c1dc51e2ffde7ab1955a32224e17fef64c594f5f'
          $prior = '8357e1b337c840194d08e36bd0b3b2f31384393f'
          $manifest = Get-Content -Raw Cargo.toml
          $references = [regex]::Matches($manifest, [regex]::Escape($prior)).Count
          if ($references -ne 4) { throw 'The diagnostic manifest does not have exactly four original Harmos pins' }
          $manifest.Replace($prior, $producer) | Set-Content -NoNewline -Encoding utf8 Cargo.toml
          $packages = @('harmos', 'harmos-domain', 'harmos-macros', 'harmos-packaging', 'harmos-runtime', 'harmos-sdk', 'harmos-sidecar', 'harmos-storage')
          mise exec -- cargo update -p harmos
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $metadataJson = mise exec -- cargo metadata --locked --format-version 1 --filter-platform x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $metadata = $metadataJson | ConvertFrom-Json
          $resolved = @($metadata.packages | Where-Object { $_.name -in $packages })
          if ($resolved.Count -ne $packages.Count) { throw 'The diagnostic graph does not contain every patched Harmos package' }
          $expected = "git+https://github.com/stokker-technologies/harmos.git?rev=$producer#$producer"
          foreach ($package in $resolved) {
            if ($package.source -ne $expected) { throw "Unexpected diagnostic source for $($package.name): $($package.source)" }
          }
          New-Item -ItemType Directory -Force target/tmp/windows-diagnostics | Out-Null
          @'
          [store]
          dir = "target/tmp/windows-diagnostics/store"
          [profile.diagnostics]
          retries = 0
          fail-fast = false
          slow-timeout = { period = "900s", terminate-after = 1 }
          [profile.diagnostics.junit]
          path = "junit.xml"
          '@ | Set-Content -Encoding utf8 target/tmp/windows-diagnostics/nextest.toml
          mise exec -- cargo nextest run --locked --cargo-profile dev -p dokime-runtime --test acceptance --features fault-injection --config-file target/tmp/windows-diagnostics/nextest.toml --profile diagnostics --test-threads 7 --success-output immediate --failure-output immediate -E 'test(services::execution::sampling::)' 2>&1 | Tee-Object target/tmp/windows-diagnostics/run.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain Native Phase Evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-settlement-phases-${{ github.sha }}
          path: target/tmp/windows-diagnostics/
          retention-days: 7
          if-no-files-found: warn
