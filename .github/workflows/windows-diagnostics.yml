# Temporary Native Diagnostics; Remove Before Final Candidate Validation.
name: Windows Diagnostics
on:
  push:
    branches: [refactor/conventions-baseline]
permissions:
  contents: read
  actions: read
concurrency:
  group: windows-diagnostics-${{ github.ref }}
  cancel-in-progress: true
env:
  MISE_LOCKED: "1"
  MISE_ENABLE_TOOLS: node,python,rust,pnpm,uv,aqua:nextest-rs/nextest/cargo-nextest,sccache,protoc
  MISE_DATA_DIR: ${{ github.workspace }}/.cache/mise
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo
  CARGO_INCREMENTAL: "0"
  npm_config_store_dir: ${{ github.workspace }}/.cache/pnpm
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
jobs:
  windows:
    name: Diagnose / Rust (windows)
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/mise/
          key: ${{ runner.os }}-${{ runner.arch }}-mise-${{ hashFiles('mise.lock') }}
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        with:
          install: true
          cache: false
          mise_dir: ${{ github.workspace }}/.cache/mise
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: windows-build-dev
          cache-bin: false
          save-if: "false"
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.18.0
      - name: Download Identified Unchanged Fixture Binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: build-dev-windows
          run-id: 39150421186
          github-token: ${{ github.token }}
          path: target/tmp/windows-baseline
      - name: Extract Fixtures And Record Source Boundary
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $baseline = gh api repos/stokker-technologies/dokime/actions/runs/39150421186 --jq .head_sha
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($baseline -ne 'f2b16b882d212678da6f904990d0e25972f3d019') { throw 'Unexpected fixture revision' }
          Write-Output "Diagnostic source: $env:GITHUB_SHA; unchanged CLI/server fixtures: $baseline"
          & "$env:ProgramFiles\Git\usr\bin\tar.exe" -xf target/tmp/windows-baseline/build-dev-windows.tar.zst --wildcards 'dist/build/windows/bin/*'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare Current Report Asset
        run: mise run prepare:report
      - name: Run Changed Tests On Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/tmp/windows-diagnostics | Out-Null
          @'
          [store]
          dir = "target/tmp/windows-diagnostics/store"
          [profile.diagnostics]
          retries = 0
          fail-fast = false
          slow-timeout = { period = "120s", terminate-after = 1 }
          [profile.diagnostics.junit]
          path = "junit.xml"
          '@ | Set-Content -Encoding utf8 target/tmp/windows-diagnostics/nextest.toml
          mise exec -- cargo nextest run --locked -p dokime -p dokime-runtime -p cargo-dokime --test integration --test acceptance --features dokime-runtime/fault-injection --config-file target/tmp/windows-diagnostics/nextest.toml --profile diagnostics --test-threads 2 --stress-count 3 --success-output immediate -E '(package(=dokime) & test(install::)) | (package(=dokime-runtime) & test(services::files::watch::stream_local_tree)) | (package(=cargo-dokime) & test(development_environment::))' 2>&1 | Tee-Object target/tmp/windows-diagnostics/run.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain Native Diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-diagnostics-${{ github.sha }}
          path: target/tmp/windows-diagnostics/
          retention-days: 7
          if-no-files-found: warn
