name: Validation / Release Dry
'on':
  workflow_call:
    inputs:
      channel:
        description: ci, stable or nightly
        type: string
        required: true
      profile:
        description: Build Profile
        type: string
        default: dev
permissions:
  contents: read
env:
  PROFILE: ${{ inputs.profile }}
  MISE_LOCKED: '1'
  MISE_EXPERIMENTAL: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo
  pnpm_config_store_dir: ${{ github.workspace }}/.cache/pnpm
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: 'true'
jobs:
  release_dry:
    name: Release / Dry
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
        bootstrap: '["python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-packages"]'
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: package-${{ env.PROFILE }}-python-any
        path: target/ci
        github-token: ${{ github.token }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: package-${{ env.PROFILE }}-rust-windows
        path: target/ci
        github-token: ${{ github.token }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: package-${{ env.PROFILE }}-rust-unix
        path: target/ci
        github-token: ${{ github.token }}
    - run: mise run release:publish -- --dry --profile ${{ env.PROFILE }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.cargo_downloads-cache-hit
        != 'true' && steps.setup.outputs.cargo_downloads-path != ''
      with:
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.mise-cache-hit != 'true' &&
        steps.setup.outputs.mise-path != ''
      with:
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
        path: ${{ steps.setup.outputs.mise-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.pnpm-cache-hit != 'true' &&
        steps.setup.outputs.pnpm-path != ''
      with:
        key: ${{ steps.setup.outputs.pnpm-cache-primary-key }}
        path: ${{ steps.setup.outputs.pnpm-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.uv-cache-hit != 'true' &&
        steps.setup.outputs.uv-path != ''
      with:
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
        path: ${{ steps.setup.outputs.uv-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.sccache-cache-hit != 'true'
        && steps.setup.outputs.sccache-path != ''
      with:
        path: ${{ steps.setup.outputs.sccache-path }}
        key: ${{ steps.setup.outputs.sccache-cache-primary-key }}
    env:
      MISE_ENABLE_TOOLS: aqua:anchore/syft,git-cliff,github:CycloneDX/cyclonedx-rust-cargo,github:EmbarkStudios/cargo-about,github:rust-secure-code/cargo-auditable,go,minisign,node,pnpm,powershell,protoc,python,rust,sccache,uv
      COMPILER_CACHE_BACKEND: disk
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      SCCACHE_CACHE_SIZE: 8G
      COMPILER_CACHE_MODE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/dev' && 'READ_WRITE' || 'READ_ONLY' }}
      CI_TRANSPORT: 'true'
      RELEASE_PROFILE: ${{ inputs.profile }}
    permissions:
      actions: read
      contents: read
