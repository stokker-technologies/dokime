      group: >-
        ci-${{ github.workflow }}-validate_test_typescript_system-${{ matrix.platform }}-${{
        (github.event_name == 'pull_request' || github.event_name == 'push') && github.ref ||
        github.run_id }}
      cancel-in-progress: true
  required:
    name: CI / Required
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs:
    - source
    - check_python
    - check_typescript
    - impact
    - build_python_any
    - release_dry
    - release_rehearsal
    - check_generated_python
    - check_generated_typescript
    - validate_test_python_unit
    - validate_test_python_acceptance
    - validate_test_typescript_unit
    - validate_test_python_integration
    - package_python
    - validate_test_typescript_integration
    - build_product
    - build_tests
    - check_rust
    - package_rust
    - validate_test_rust_acceptance
    - validate_test_rust_integration
    - validate_test_rust_system
    - validate_test_rust_unit
    - validate_test_typescript_system
    if: always()
    steps:
    - name: Configure Checkout Git
      run: git config --global core.longpaths true
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - shell: python
      run: >-
        import runpy; runpy.run_path('.github/actions/plan-impact/gate.py',
        run_name='__main__')
      env:
        RESULTS: ${{ toJSON(needs) }}
    concurrency:
      group: >-
        ci-${{ github.workflow }}-required-${{ (github.event_name == 'pull_request' ||
        github.event_name == 'push') && github.ref || github.run_id }}
      cancel-in-progress: true
