name: CI
run-name: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && 'CI / Closed Review' || github.event_name == 'pull_request'
  && github.event.pull_request.draft && 'CI / Draft Review' || 'CI / Validation' }}
'on':
  push:
    branches:
    - dev
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
    - closed
  workflow_dispatch: {}
permissions:
  contents: read
env:
  PROFILE: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.head_ref, 'release/v')) && 'release' || 'dev' }}
  MISE_LOCKED: '1'
  MISE_EXPERIMENTAL: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo
  pnpm_config_store_dir: ${{ github.workspace }}/.cache/pnpm
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: 'true'
jobs:
  impact:
    name: Check / CI / Impact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: ./.github/actions/setup
      with:
        platform: unix
        prepare-arguments: --tools-only
    - id: impact
      run: mise run ci:impact
    env:
      MISE_ENABLE_TOOLS: python,uv
    outputs:
      check: ${{ steps.impact.outputs.check }}
      build_product: ${{ steps.impact.outputs.build_product }}
      build_tests: ${{ steps.impact.outputs.build_tests }}
      build_sdk_cpp: ${{ steps.impact.outputs.build_sdk_cpp }}
      build_host_fixtures_csharp: ${{ steps.impact.outputs.build_host_fixtures_csharp }}
      build_python: ${{ steps.impact.outputs.build_python }}
      build_docs: ${{ steps.impact.outputs.build_docs }}
      check_generated: ${{ steps.impact.outputs.check_generated }}
      test: ${{ steps.impact.outputs.test }}
      test_host_csharp: ${{ steps.impact.outputs.test_host_csharp }}
      package: ${{ steps.impact.outputs.package }}
      release_dry: ${{ steps.impact.outputs.release_dry }}
      release_rehearsal: ${{ steps.impact.outputs.release_rehearsal }}
      selected: ${{ steps.impact.outputs.selected }}
      skipped: ${{ steps.impact.outputs.skipped }}
      check_matrix: ${{ steps.impact.outputs.check_matrix }}
      test_matrix: ${{ steps.impact.outputs.test_matrix }}
  check:
    name: Check / Product
    uses: ./.github/workflows/validate-check.yml
    with:
      channel: ci
      profile: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.head_ref, 'release/v')) && 'release' || 'dev' }}
      matrix: ${{ needs.impact.outputs.check_matrix }}
    if: always() && needs.impact.result == 'success' && needs.impact.outputs.check == 'true'
    needs:
    - impact
  build_product:
    name: Build / Product
    uses: ./.github/workflows/validate-build-product.yml
    with:
      channel: ci
      profile: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.head_ref, 'release/v')) && 'release' || 'dev' }}
    if: always() && needs.impact.result == 'success' && needs.impact.outputs.build_product == 'true'
    needs:
    - impact
  build_tests:
    name: Build / Tests
    uses: ./.github/workflows/validate-build-tests.yml
    with:
      channel: ci
      profile: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.head_ref, 'release/v')) && 'release' || 'dev' }}
    if: always() && needs.impact.result == 'success' && needs.impact.outputs.build_tests == 'true'
    needs:
    - impact
  build_sdk_cpp:
    name: Build / SDK / C++
    uses: ./.github/workflows/validate-build-tests.yml
    with:
      channel: ci
      profile: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.head_ref, 'release/v')) && 'release' || 'dev' }}
      fixture-language: cpp
    if: always() && needs.impact.result == 'success' && needs.impact.outputs.build_sdk_cpp == 'true'
    needs:
    - impact
  build_host_fixtures_csharp:
    name: Build / SDK / C# / Fixtures
    uses: ./.github/workflows/validate-build-tests.yml
    with:
      channel: ci
      profile: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.head_ref, 'release/v')) && 'release' || 'dev' }}
      fixture-language: csharp
    if: always() && needs.impact.result == 'success' && needs.impact.outputs.build_host_fixtures_csharp == 'true'
    needs:
    - impact
  build_python:
    name: Build / SDK / Python
    uses: ./.github/workflows/validate-build-python.yml
    with:
      channel: ci
      profile: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.head_ref, 'release/v')) && 'release' || 'dev' }}
    if: always() && needs.impact.result == 'success' && needs.impact.outputs.build_python == 'true'
    needs:
    - impact
  build_docs:
    name: Build / Docs
    uses: ./.github/workflows/validate-build-docs.yml
    with:
      channel: ci
      profile: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.head_ref, 'release/v')) && 'release' || 'dev' }}
    if: always() && needs.impact.result == 'success' && needs.impact.outputs.build_docs == 'true'
    needs:
    - impact
  check_generated:
    name: Check / Generated
    uses: ./.github/workflows/validate-check-generated.yml
    with:
      channel: ci
      profile: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.head_ref, 'release/v')) && 'release' || 'dev' }}
    needs:
    - impact
    - build_python
    if: always() && needs.impact.result == 'success' && needs.impact.outputs.check_generated == 'true'
  test:
    name: Test / Product
    uses: ./.github/workflows/validate-test.yml
    with:
      channel: ci
      profile: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.head_ref, 'release/v')) && 'release' || 'dev' }}
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      work: ${{ matrix.work }}
      command: ${{ matrix.command }}
      bootstrap: ${{ matrix.bootstrap }}
      archives: ${{ matrix.archives }}
      minutes: ${{ matrix.minutes }}
      suite: ${{ format('{0}', strategy.job-index) }}
    needs:
    - impact
    - build_product
    - build_tests
    - build_python
    - build_sdk_cpp
    if: always() && needs.impact.result == 'success' && needs.impact.outputs.test == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.impact.outputs.test_matrix) }}
  test_host_csharp:
    name: Test / SDK / Equivalence / C# (${{ matrix.platform }})
    uses: ./.github/workflows/validate-test.yml
    needs:
    - impact
    - build_tests
    - build_host_fixtures_csharp
    if: always() && needs.impact.result == 'success' && needs.impact.outputs.test_host_csharp == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: unix
          runner: ubuntu-latest
        - platform: windows
          runner: windows-latest
    with:
      channel: ci
      profile: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.head_ref, 'release/v')) && 'release' || 'dev' }}
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      work: SDK / Equivalence / C#
      command: test -- --artifact tests --package dokime-runtime --target system --filterset "test(csharp_plugin_matches_rust_thermal_evidence)"
      bootstrap: ${{ matrix.platform == 'unix' && '["mise run ci:prerequisites -- --gui-runtime"]' || '[]' }}
      archives: '["target/ci/build-tests-{profile}-{platform}.tar.zst", "target/ci/build-host-csharp-{profile}-{platform}.tar.zst"]'
      minutes: 120
      suite: execution-host-csharp
  package:
    name: Package / Product
    uses: ./.github/workflows/validate-package.yml
    with:
      channel: ci
      profile: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.head_ref, 'release/v')) && 'release' || 'dev' }}
    needs:
    - impact
    - build_product
    - build_python
    if: always() && needs.impact.result == 'success' && needs.impact.outputs.package == 'true'
  release_dry:
    name: Release / Dry
    uses: ./.github/workflows/validate-release-dry.yml
    with:
      channel: ci
      profile: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.head_ref, 'release/v')) && 'release' || 'dev' }}
    needs:
    - impact
    - package
    if: always() && needs.impact.result == 'success' && needs.impact.outputs.release_dry == 'true'
    permissions:
      actions: read
      contents: read
  release_rehearsal:
    name: Release / Rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
        bootstrap: '["mise run ci:prerequisites -- --gui-packages"]'
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: package-${{ env.PROFILE }}-python-any
        path: target/ci
        github-token: ${{ github.token }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: package-${{ env.PROFILE }}-rust-windows
        path: target/ci
        github-token: ${{ github.token }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: package-${{ env.PROFILE }}-rust-unix
        path: target/ci
        github-token: ${{ github.token }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: build-docs-${{ env.PROFILE }}-any
        path: target/docs
        github-token: ${{ github.token }}
    - run: mise run release:rehearse -- --profile ${{ env.PROFILE }} --target all
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.cargo_downloads-cache-hit
        != 'true' && steps.setup.outputs.cargo_downloads-path != ''
      with:
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.mise-cache-hit != 'true' &&
        steps.setup.outputs.mise-path != ''
      with:
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
        path: ${{ steps.setup.outputs.mise-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.pnpm-cache-hit != 'true' &&
        steps.setup.outputs.pnpm-path != ''
      with:
        key: ${{ steps.setup.outputs.pnpm-cache-primary-key }}
        path: ${{ steps.setup.outputs.pnpm-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.uv-cache-hit != 'true' &&
        steps.setup.outputs.uv-path != ''
      with:
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
        path: ${{ steps.setup.outputs.uv-path }}
    env:
      MISE_ENABLE_TOOLS: aqua:anchore/syft,git-cliff,github:CycloneDX/cyclonedx-rust-cargo,github:EmbarkStudios/cargo-about,github:rust-secure-code/cargo-auditable,go,minisign,node,pnpm,powershell,python,rust,uv
      CI_TRANSPORT: 'true'
      RELEASE_PROFILE: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.head_ref, 'release/v')) && 'release' || 'dev' }}
    permissions:
      contents: read
    needs:
    - impact
    - package
    - build_docs
    if: always() && needs.impact.result == 'success' && needs.impact.outputs.release_rehearsal == 'true'
  required:
    name: Check / CI / Required
    runs-on: ubuntu-latest
    if: always() && (github.event_name != 'pull_request' || github.event.action != 'closed')
    needs:
    - impact
    - check
    - build_product
    - build_tests
    - build_python
    - build_docs
    - check_generated
    - test
    - build_sdk_cpp
    - build_host_fixtures_csharp
    - test_host_csharp
    - package
    - release_dry
    - release_rehearsal
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: ./.github/actions/setup
      with:
        platform: unix
        prepare-arguments: --tools-only
      id: setup
    - name: Execution Host Coverage
      run: mise run ci:summary
    - run: mise run ci:required --
      env:
        RESULTS: ${{ toJSON(needs) }}
    env:
      MISE_ENABLE_TOOLS: python,uv,node,pnpm
  cancel_closed:
    name: Check / CI / Closed Review
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && !(github.event.pull_request.merged && startsWith(github.head_ref,
      'release/v'))
    runs-on: ubuntu-latest
    steps:
    - run: echo "Closed Review Cancels Earlier Validation Through Workflow Concurrency"
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !(github.event.action == 'closed' && github.event.pull_request.merged && startsWith(github.head_ref,
    'release/v')) }}
