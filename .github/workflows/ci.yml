    - name: Cache / Pnpm
      id: pnpm
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: .cache/pnpm/
        key: >-
          ${{ runner.os }}-${{ runner.arch }}-pnpm-${{
          hashFiles('crates/dokime-gui/pnpm-lock.yaml') }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-
