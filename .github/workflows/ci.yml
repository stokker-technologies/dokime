    name: Publish / Release
    runs-on:
    - ubuntu-latest
    timeout-minutes: 30
    needs:
    - package_rust
    - package_python
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Cache / Pnpm
      id: pnpm
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: .cache/pnpm/
        key: >-
          ${{ runner.os }}-${{ runner.arch }}-pnpm-${{
          hashFiles('crates/dokime-gui/pnpm-lock.yaml') }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-
    - name: Cache / Uv
      id: uv
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: .cache/uv/
        key: ${{ runner.os }}-${{ runner.arch }}-uv-${{ hashFiles('uv.lock') }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-uv-
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      id: tools
      with:
        path: .cache/mise/
        key: ${{ runner.os }}-${{ runner.arch }}-mise-${{ hashFiles('mise.lock') }}
    - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      env:
        TEMP: ${{ runner.temp }}
        TMP: ${{ runner.temp }}
      with:
        install: true
        cache: false
        mise_dir: ${{ github.workspace }}/.cache/mise
    - name: Cache / Registry
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        shared-key: ${{ runner.os }}-registry
        cache-targets: false
        cache-bin: false
        save-if: "false"
    - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      with:
        version: v0.18.0
    - run: sudo apt-get update
    - run: >-
        sudo apt-get install -y --no-install-recommends build-essential pkg-config
        libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev
        libjavascriptcoregtk-4.1-dev librsvg2-dev libasound2-dev linux-libc-dev libclang-dev webkit2gtk-driver
        xvfb
    - run: Xvfb :99 -screen 0 1920x1080x24 >/dev/null 2>&1 &
    - run: echo DISPLAY=:99 >> "$GITHUB_ENV"
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: package-release-*
        merge-multiple: true
    - id: crates
      uses: rust-lang/crates-io-auth-action@v1
    - run: mise run release:publish
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.crates.outputs.token }}
        GH_TOKEN: ${{ github.token }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: >-
        (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') &&
        steps.pnpm.outputs.cache-hit != 'true'
      with:
        path: .cache/pnpm/
        key: ${{ steps.pnpm.outputs.cache-primary-key }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: >-
        (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') &&
        steps.uv.outputs.cache-hit != 'true'
      with:
        path: .cache/uv/
        key: ${{ steps.uv.outputs.cache-primary-key }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: >-
        (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') &&
        steps.tools.outputs.cache-hit != 'true'
      with:
        path: .cache/mise/
        key: ${{ steps.tools.outputs.cache-primary-key }}
    - run: sccache --show-stats
      if: always()
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: linux
      MISE_ENABLE_TOOLS: node,python,rust,pnpm,uv,aqua:nextest-rs/nextest/cargo-nextest
