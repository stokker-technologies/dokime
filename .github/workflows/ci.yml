      with:
        path: ${{ env.MISE_DATA_DIR }}
        key: ${{ steps.tools.outputs.cache-primary-key }}
    - run: sccache --show-stats
      if: always()
    if: >-
      always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result,
      'cancelled') && needs.source.outputs.stable_release == 'true' &&
