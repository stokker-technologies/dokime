name: Native Validation

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: native-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  MISE_YES: '1'
  MISE_LOCKED: '1'
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.cache/mise-global.toml
  MISE_DATA_DIR: ${{ github.workspace }}/.cache/mise
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  native:
    name: Native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows]
    uses: ./.github/workflows/platform.yml
    with:
      os: ${{ matrix.os }}

  ci_artifacts_catalog:
    name: Ci Artifacts Catalog
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: native-linux-${{ hashFiles('mise.lock', 'Cargo.lock', 'uv.lock') }}
          path: |
            .cache/mise/
            .cache/cargo/registry/
            .cache/cargo/git/
            .cache/uv/
      - name: Prepare Linux
        run: . tools/ci/install.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: validation-*
          merge-multiple: true
          path: dist/downloads/
      - id: catalog
        run: mise run ci:artifacts:catalog
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.catalog.outputs.artifact_name }}
          path: dist/validation/catalog.json
          if-no-files-found: error
          retention-days: 90

  ci_gate:
    name: Ci Gate / Full Validation Gate
    if: always()
    needs: [native, ci_artifacts_catalog]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEEDS_RESULTS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gate Tools
        run: |
          . tools/ci/install-mise.sh
          echo "$GITHUB_WORKSPACE/.cache/bootstrap/bin" >> "$GITHUB_PATH"
          mise install --locked python
      - run: mise run --skip-tools ci:gate
