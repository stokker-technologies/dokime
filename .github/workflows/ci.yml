        mise_dir: ${{ github.workspace }}/.cache/mise
    - run: sudo apt-get update
    - run: >-
        sudo apt-get install -y --no-install-recommends build-essential pkg-config
        libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev
        libjavascriptcoregtk-4.1-dev librsvg2-dev libasound2-dev linux-libc-dev libclang-dev webkit2gtk-driver
        xvfb
    - run: Xvfb :99 -screen 0 1920x1080x24 >/dev/null 2>&1 &
    - run: echo DISPLAY=:99 >> "$GITHUB_ENV"
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: build-bench
        merge-multiple: true
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: .stkr/benchmarks/
        key: bench-bench_integration_rust-${{ runner.os }}-${{ github.run_id }}
        restore-keys: bench-bench_integration_rust-${{ runner.os }}-
    - run: mise run bench:integration:rust --refresh-baseline
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
