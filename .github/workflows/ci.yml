name: CI
run-name: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && 'CI / Closed Review' || github.event_name == 'pull_request'
  && github.event.pull_request.draft && 'CI / Draft Review' || 'CI / Validation' }}
'on':
  push:
    branches:
    - dev
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
    - closed
  workflow_dispatch: {}
permissions:
  contents: read
env:
  PROFILE: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.head_ref, 'release/v')) && 'release' || 'dev' }}
  MISE_LOCKED: '1'
  MISE_EXPERIMENTAL: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo
  pnpm_config_store_dir: ${{ github.workspace }}/.cache/pnpm
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: 'true'
jobs:
  check:
    name: Check
    uses: ./.github/workflows/validate-check.yml
    with:
      channel: ci
      profile: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.head_ref, 'release/v')) && 'release' || 'dev' }}
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
  build_product:
    name: Build / Product
    uses: ./.github/workflows/validate-build-product.yml
    with:
      channel: ci
      profile: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.head_ref, 'release/v')) && 'release' || 'dev' }}
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
  build_tests:
    name: Build / Tests
    uses: ./.github/workflows/validate-build-tests.yml
    with:
      channel: ci
      profile: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.head_ref, 'release/v')) && 'release' || 'dev' }}
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
  build_python:
    name: Build / Python
    uses: ./.github/workflows/validate-build-python.yml
    with:
      channel: ci
      profile: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.head_ref, 'release/v')) && 'release' || 'dev' }}
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
  check_generated:
    name: Check / Generated
    uses: ./.github/workflows/validate-check-generated.yml
    with:
      channel: ci
      profile: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.head_ref, 'release/v')) && 'release' || 'dev' }}
    needs:
    - build_python
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
  test:
    name: Test
    uses: ./.github/workflows/validate-test.yml
    with:
      channel: ci
      profile: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.head_ref, 'release/v')) && 'release' || 'dev' }}
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      work: ${{ matrix.work }}
      command: ${{ matrix.command }}
      bootstrap: ${{ matrix.bootstrap }}
      archives: ${{ matrix.archives }}
      minutes: ${{ matrix.minutes }}
      suite: ${{ format('{0}', strategy.job-index) }}
    needs:
    - build_product
    - build_tests
    - build_python
    if: (github.event_name != 'pull_request' || github.event.action != 'closed') && github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: unix
          runner: ubuntu-22.04
          minutes: 120
          work: Python / Wheel
          command: test -- --language python --wheel
          bootstrap: '["python3 tools/python/src/dokime_tools/ci/bootstrap.py --credential-store"]'
          archives: '["target/ci/build-product-python-{profile}-any.tar.zst","target/ci/build-tests-{profile}-{platform}.tar.zst"]'
        - platform: windows
          runner: windows-latest
          minutes: 120
          work: Python / Wheel
          command: test -- --language python --wheel
          bootstrap: '[]'
          archives: '["target/ci/build-product-python-{profile}-any.tar.zst","target/ci/build-tests-{profile}-{platform}.tar.zst"]'
        - platform: unix
          runner: ubuntu-latest
          minutes: 120
          work: TypeScript / Unit
          command: test -- --language typescript --layer unit
          bootstrap: '[]'
          archives: '["target/ci/build-clients-{profile}-unix.tar.zst"]'
        - platform: unix
          runner: ubuntu-22.04
          minutes: 120
          work: Python / Integration
          command: test -- --language python --layer integration
          bootstrap: '["python3 tools/python/src/dokime_tools/ci/bootstrap.py --credential-store"]'
          archives: '["target/ci/build-product-python-{profile}-any.tar.zst","target/ci/build-tests-{profile}-{platform}.tar.zst"]'
        - platform: windows
          runner: windows-latest
          minutes: 120
          work: Python / Integration
          command: test -- --language python --layer integration
          bootstrap: '[]'
          archives: '["target/ci/build-product-python-{profile}-any.tar.zst","target/ci/build-tests-{profile}-{platform}.tar.zst"]'
        - platform: unix
          runner: ubuntu-latest
          minutes: 120
          work: TypeScript / Integration
          command: test -- --language typescript --layer integration
          bootstrap: '[]'
          archives: '["target/ci/build-clients-{profile}-unix.tar.zst"]'
        - platform: unix
          runner: ubuntu-latest
          minutes: 120
          work: Rust / Integration
          command: test -- --language rust --layer integration
          bootstrap: '["python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-runtime"]'
          archives: '["target/ci/build-tests-{profile}-{platform}.tar.zst"]'
        - platform: windows
          runner: windows-latest
          minutes: 120
          work: Rust / Integration
          command: test -- --language rust --layer integration
          bootstrap: '[]'
          archives: '["target/ci/build-tests-{profile}-{platform}.tar.zst"]'
        - platform: unix
          runner: ubuntu-latest
          minutes: 120
          work: Rust / System
          command: test -- --language rust --layer system --select "not package(dokime-runtime-next)"
          bootstrap: '["python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-runtime"]'
          archives: '["target/ci/build-product-python-{profile}-any.tar.zst","target/ci/build-cli-{profile}-{platform}.tar.zst","target/ci/build-tests-{profile}-{platform}.tar.zst"]'
        - platform: windows
          runner: windows-latest
          minutes: 120
          work: Rust / System
          command: test -- --language rust --layer system --select "not package(dokime-runtime-next)"
          bootstrap: '[]'
          archives: '["target/ci/build-product-python-{profile}-any.tar.zst","target/ci/build-cli-{profile}-{platform}.tar.zst","target/ci/build-tests-{profile}-{platform}.tar.zst"]'
        - platform: unix
          runner: ubuntu-latest
          minutes: 120
          work: Rust / System / Execution Host
          command: test -- --artifact tests --package dokime-runtime-next --target system --filterset "not (test(csharp_plugin_matches_rust_thermal_evidence)
            or test(cpp_plugin_matches_rust_thermal_evidence))"
          bootstrap: '["python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-runtime"]'
          archives: '["target/ci/build-tests-{profile}-{platform}.tar.zst","target/ci/build-product-python-{profile}-any.tar.zst"]'
        - platform: windows
          runner: windows-latest
          minutes: 120
          work: Rust / System / Execution Host
          command: test -- --artifact tests --package dokime-runtime-next --target system --filterset "not (test(csharp_plugin_matches_rust_thermal_evidence)
            or test(cpp_plugin_matches_rust_thermal_evidence))"
          bootstrap: '[]'
          archives: '["target/ci/build-tests-{profile}-{platform}.tar.zst","target/ci/build-product-python-{profile}-any.tar.zst"]'
        - platform: unix
          runner: ubuntu-latest
          minutes: 120
          work: Rust / Unit
          command: test -- --language rust --layer unit
          bootstrap: '["python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-runtime"]'
          archives: '["target/ci/build-tests-{profile}-{platform}.tar.zst"]'
        - platform: windows
          runner: windows-latest
          minutes: 120
          work: Rust / Unit
          command: test -- --language rust --layer unit
          bootstrap: '[]'
          archives: '["target/ci/build-tests-{profile}-{platform}.tar.zst"]'
  package:
    name: Package
    uses: ./.github/workflows/validate-package.yml
    with:
      channel: ci
      profile: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.head_ref, 'release/v')) && 'release' || 'dev' }}
    needs:
    - build_product
    - build_python
    if: (github.event_name != 'pull_request' || github.event.action != 'closed') && github.event_name != 'push'
  release_dry:
    name: Release / Dry
    uses: ./.github/workflows/validate-release-dry.yml
    with:
      channel: ci
      profile: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.head_ref, 'release/v')) && 'release' || 'dev' }}
    needs:
    - package
    if: (github.event_name != 'pull_request' || github.event.action != 'closed') && github.event_name != 'push'
    permissions:
      actions: read
      contents: read
  release_rehearsal:
    name: Release / Rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
        bootstrap: '["python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-packages"]'
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: package-${{ env.PROFILE }}-python-any
        path: target/ci
        github-token: ${{ github.token }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: package-${{ env.PROFILE }}-rust-windows
        path: target/ci
        github-token: ${{ github.token }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: package-${{ env.PROFILE }}-rust-unix
        path: target/ci
        github-token: ${{ github.token }}
    - run: mise run release:rehearse -- --profile ${{ env.PROFILE }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.cargo_downloads-cache-hit
        != 'true' && steps.setup.outputs.cargo_downloads-path != ''
      with:
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.mise-cache-hit != 'true' &&
        steps.setup.outputs.mise-path != ''
      with:
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
        path: ${{ steps.setup.outputs.mise-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.pnpm-cache-hit != 'true' &&
        steps.setup.outputs.pnpm-path != ''
      with:
        key: ${{ steps.setup.outputs.pnpm-cache-primary-key }}
        path: ${{ steps.setup.outputs.pnpm-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.uv-cache-hit != 'true' &&
        steps.setup.outputs.uv-path != ''
      with:
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
        path: ${{ steps.setup.outputs.uv-path }}
    env:
      MISE_ENABLE_TOOLS: aqua:anchore/syft,git-cliff,github:CycloneDX/cyclonedx-rust-cargo,github:EmbarkStudios/cargo-about,github:rust-secure-code/cargo-auditable,go,minisign,node,pnpm,powershell,python,rust,uv
      CI_TRANSPORT: 'true'
      RELEASE_PROFILE: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.head_ref, 'release/v')) && 'release' || 'dev' }}
    permissions:
      contents: read
    needs:
    - package
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.base_ref == 'dev' && startsWith(github.head_ref, 'release/v')
  required:
    name: CI / Required
    runs-on: ubuntu-latest
    if: always() && (github.event_name != 'pull_request' || github.event.action != 'closed')
    needs:
    - check
    - build_product
    - build_tests
    - build_python
    - check_generated
    - test
    - package
    - release_dry
    - release_rehearsal
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: ./.github/actions/setup
      with:
        platform: unix
      id: setup
    - name: Execution Host Coverage
      shell: python
      run: "import os\nfrom pathlib import Path\nwith Path(os.environ[\"GITHUB_STEP_SUMMARY\"]).open(\"a\", encoding=\"utf-8\") as summary:\n\
        \    summary.write(\"Execution host: the Rust and Python stories run on Linux and Windows. C# and C++ equivalence stories run in Nightly.\\\
        n\")\n"
    - run: mise run ci:required --
      env:
        RESULTS: ${{ toJSON(needs) }}
        OPTIONAL_JOBS: ${{ github.event_name == 'push' && '["test","package","release_dry","release_rehearsal"]' || (github.event_name == 'pull_request'
          && github.base_ref == 'dev' && startsWith(github.head_ref, 'release/v')) && '[]' || '["release_rehearsal"]' }}
    env:
      MISE_ENABLE_TOOLS: python,uv,node,pnpm
  cancel_closed:
    name: Cancel Closed Review
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && !(github.event.pull_request.merged && startsWith(github.head_ref,
      'release/v'))
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: ./.github/actions/setup
      with:
        platform: unix
      id: setup
    - run: mise run ci:required --
      env:
        RESULTS: '{}'
    env:
      MISE_ENABLE_TOOLS: python,uv,node,pnpm
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !(github.event.action == 'closed' && github.event.pull_request.merged && startsWith(github.head_ref,
    'release/v')) }}
