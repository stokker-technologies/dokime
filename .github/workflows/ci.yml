name: Native Validation

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: native-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'push' && github.sha || 'current' }}
  cancel-in-progress: true

env:
  MISE_YES: '1'
  MISE_LOCKED: '1'
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.cache/mise-global.toml
  MISE_DATA_DIR: ${{ github.workspace }}/.cache/mise
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  policy:
    name: Validation Policy
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.policy.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: policy
        env:
          PYTHONPATH: tools/python/src
        run: python -m dokime_tools.ci.policy

  native:
    name: Native (${{ matrix.os }})
    needs: policy
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.policy.outputs.matrix) }}
    uses: ./.github/workflows/platform.yml
    with:
      os: ${{ matrix.os }}

  ci_artifacts_catalog:
    name: Ci Artifacts Catalog
    env:
      DOKIME_CI_ROLE: catalog
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: tools-${{ runner.os }}-${{ runner.arch }}-v2-${{ hashFiles('mise.lock', 'mise.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tools-${{ runner.os }}-${{ runner.arch }}-v2-${{ hashFiles('mise.lock', 'mise.toml') }}-
          path: .cache/mise/
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: sources-${{ runner.os }}-${{ runner.arch }}-v2-${{ hashFiles('Cargo.lock', 'uv.lock', 'pnpm-lock.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sources-${{ runner.os }}-${{ runner.arch }}-v2-${{ hashFiles('Cargo.lock', 'uv.lock', 'pnpm-lock.yaml') }}-
          path: |
            .cache/cargo/registry/cache/
            .cache/cargo/registry/index/
            .cache/cargo/git/db/
            .cache/uv/
      - name: Prepare Linux
        run: . tools/ci/install.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: validation-*
          merge-multiple: true
          path: dist/downloads/
      - id: catalog
        run: mise run --skip-tools ci:artifacts:catalog
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.catalog.outputs.artifact_name }}
          path: dist/validation/catalog.json
          if-no-files-found: error
          retention-days: 90

  ci_gate:
    name: Ci Gate / Full Validation Gate
    if: always()
    needs: [policy, native, ci_artifacts_catalog]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEEDS_RESULTS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gate Tools
        run: |
          . tools/ci/install-mise.sh
          echo "$GITHUB_WORKSPACE/.cache/bootstrap/bin" >> "$GITHUB_PATH"
          mise install --locked python
      - run: mise run --skip-tools ci:gate
