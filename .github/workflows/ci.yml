        xvfb
    - run: Xvfb :99 -screen 0 1920x1080x24 >/dev/null 2>&1 &
    - run: echo DISPLAY=:99 >> "$GITHUB_ENV"
    - run: mise run build --profile bench
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: build-bench
        path: |-
          target/nextest/
          target/fixtures/
          target/wheels/
          dist/
          packages/dokime/src/dokime/_wire
          packages/dokime/src/dokime/operation.py
          packages/dokime/src/dokime/dynamic.py
          crates/dokime-gui/.generated
          crates/dokime-gui/src/lib/rpc/generated
        if-no-files-found: ignore
        retention-days: 7
        include-hidden-files: true
    if: github.event_name == 'schedule'
