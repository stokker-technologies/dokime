name: Nightly
run-name: Nightly / Validation
'on':
  schedule:
  - cron: 0 */4 * * *
  workflow_dispatch: {}
permissions:
  contents: read
env:
  PROFILE: release
  MISE_LOCKED: '1'
  MISE_EXPERIMENTAL: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo
  pnpm_config_store_dir: ${{ github.workspace }}/.cache/pnpm
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: 'true'
concurrency:
  group: nightly
  cancel-in-progress: false
jobs:
  plan:
    name: Check / Nightly / Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: ./.github/actions/setup
      with:
        platform: unix
        prepare-arguments: --tools-only
    - id: impact
      run: mise run ci:impact -- --event nightly
    env:
      MISE_ENABLE_TOOLS: python,uv
    outputs:
      check_matrix: ${{ steps.impact.outputs.check_matrix }}
      test_matrix: ${{ steps.impact.outputs.test_matrix }}
    if: github.ref == 'refs/heads/dev'
  freshness:
    name: Check / Nightly / Freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - uses: ./.github/actions/setup
      with:
        platform: unix
      id: setup
    - id: freshness
      run: mise run ci:nightly-freshness --
      env:
        GH_TOKEN: ${{ github.token }}
    env:
      CI_TRANSPORT: 'true'
      MISE_ENABLE_TOOLS: python,uv,node,pnpm
    outputs:
      build: ${{ steps.freshness.outputs.build }}
    if: github.ref == 'refs/heads/dev'
  check:
    name: Check / Product
    uses: ./.github/workflows/validate-check.yml
    with:
      channel: nightly
      profile: release
      matrix: ${{ needs.plan.outputs.check_matrix }}
    needs:
    - plan
  build_product:
    name: Build / Product
    uses: ./.github/workflows/validate-build-product.yml
    with:
      channel: nightly
      profile: release
    needs:
    - plan
  build_tests:
    name: Build / Tests
    uses: ./.github/workflows/validate-build-tests.yml
    with:
      channel: nightly
      profile: release
    needs:
    - plan
  build_host_fixtures:
    name: Build / SDK / ${{ matrix.language == 'csharp' && 'C#' || 'C++' }} / Fixtures
    uses: ./.github/workflows/validate-build-tests.yml
    needs:
    - plan
    strategy:
      fail-fast: false
      matrix:
        language:
        - csharp
        - cpp
    with:
      channel: nightly
      profile: release
      fixture-language: ${{ matrix.language }}
  build_bench:
    name: Build / Bench
    uses: ./.github/workflows/validate-build-tests.yml
    needs:
    - plan
    with:
      channel: nightly
      profile: release
      bench: true
  bench:
    name: Bench / Desktop / ${{ matrix.variant.name }} (${{ matrix.platform }})
    uses: ./.github/workflows/validate-test.yml
    needs:
    - build_bench
    strategy:
      fail-fast: false
      matrix:
        platform:
        - unix
        - windows
        variant:
        - name: Round Trip
          select: ^desktop_round_trip/
          suite: desktop-bench-round-trip
        - name: History
          select: ^desktop_history_round_trip/
          suite: desktop-bench-history
        include:
        - platform: unix
          runner: ubuntu-22.04
          bootstrap: '["mise run ci:prerequisites -- --gui-runtime --desktop"]'
        - platform: windows
          runner: windows-latest
          bootstrap: '["mise run ci:prerequisites -- --desktop"]'
    with:
      channel: nightly
      profile: release
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      bootstrap: ${{ matrix.bootstrap }}
      work: Desktop / ${{ matrix.variant.name }}
      command: bench -- --language rust --layer system --binary system-desktop --refresh-baseline --select "${{ matrix.variant.select }}"
      archives: '["target/ci/build-bench-{platform}.tar.zst"]'
      minutes: 120
      suite: ${{ matrix.variant.suite }}
  build_python:
    name: Build / SDK / Python
    uses: ./.github/workflows/validate-build-python.yml
    with:
      channel: nightly
      profile: release
    needs:
    - plan
  build_docs:
    name: Build / Docs
    uses: ./.github/workflows/validate-build-docs.yml
    with:
      channel: nightly
      profile: release
    needs:
    - plan
  check_generated:
    name: Check / Generated
    uses: ./.github/workflows/validate-check-generated.yml
    with:
      channel: nightly
      profile: release
    needs:
    - build_python
  test:
    name: Test / Product
    uses: ./.github/workflows/validate-test.yml
    with:
      channel: nightly
      profile: release
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      work: ${{ matrix.work }}
      command: ${{ matrix.command }}
      bootstrap: ${{ matrix.bootstrap }}
      archives: ${{ matrix.archives }}
      minutes: ${{ matrix.minutes }}
      suite: ${{ format('{0}', strategy.job-index) }}
    needs:
    - plan
    - build_product
    - build_tests
    - build_python
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.test_matrix) }}
  test_host:
    name: Test / Host / System / Execution (${{ matrix.platform }})
    uses: ./.github/workflows/validate-test.yml
    needs:
    - build_tests
    - build_python
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: unix
          runner: ubuntu-latest
        - platform: windows
          runner: windows-latest
    with:
      channel: nightly
      profile: release
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      work: Host / System / Execution
      command: test -- --artifact tests --package dokime-runtime --target system --filterset "not (test(csharp_plugin_matches_rust_thermal_evidence)
        or test(cpp_plugin_matches_rust_thermal_evidence))"
      bootstrap: ${{ matrix.platform == 'unix' && '["mise run ci:prerequisites -- --gui-runtime"]' || '[]' }}
      archives: '["target/ci/build-tests-{profile}-{platform}.tar.zst", "target/ci/build-product-python-{profile}-any.tar.zst"]'
      minutes: 120
      suite: execution-host
  test_host_sdks:
    name: Test / SDK / Equivalence (${{ matrix.platform }})
    uses: ./.github/workflows/validate-test.yml
    needs:
    - build_tests
    - build_host_fixtures
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: unix
          runner: ubuntu-latest
        - platform: windows
          runner: windows-latest
    with:
      channel: nightly
      profile: release
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      work: SDK / Equivalence
      command: test -- --artifact tests --package dokime-runtime --target system --filterset "test(csharp_plugin_matches_rust_thermal_evidence)
        or test(cpp_plugin_matches_rust_thermal_evidence)"
      bootstrap: ${{ matrix.platform == 'unix' && '["mise run ci:prerequisites -- --gui-runtime"]' || '[]' }}
      archives: '["target/ci/build-tests-{profile}-{platform}.tar.zst", "target/ci/build-host-csharp-{profile}-{platform}.tar.zst", "target/ci/build-host-cpp-{profile}-{platform}.tar.zst"]'
      minutes: 120
      suite: execution-host-sdks
  coverage:
    name: Test / ${{ matrix.work }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.minutes }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
        bootstrap: ${{ matrix.bootstrap }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: build-cli-${{ env.PROFILE }}-unix
        path: target/ci
      if: contains(format(',{0},', matrix.inputs), ',0,')
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: build-product-python-${{ env.PROFILE }}-any
        path: target/ci
      if: contains(format(',{0},', matrix.inputs), ',2,')
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: build-tests-${{ env.PROFILE }}-unix
        path: target/ci
      if: contains(format(',{0},', matrix.inputs), ',3,')
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: build-clients-${{ env.PROFILE }}-unix
        path: target/ci
      if: contains(format(',{0},', matrix.inputs), ',4,')
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: build-host-csharp-${{ env.PROFILE }}-unix
        path: target/ci
      if: contains(format(',{0},', matrix.inputs), ',5,')
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: build-host-cpp-${{ env.PROFILE }}-unix
        path: target/ci
      if: contains(format(',{0},', matrix.inputs), ',6,')
    - run: mise run ${{ matrix.command }} --profile ${{ env.PROFILE }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: results-${{ strategy.job-index }}-${{ github.job }}-${{ env.PROFILE }}-${{ matrix.platform }}
        path: 'target/tests/

          target/traces/

          target/test-reports/

          target/benchmarks/

          target/coverage/'
        if-no-files-found: ignore
        retention-days: 7
        include-hidden-files: true
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.cargo_downloads-cache-hit
        != 'true' && steps.setup.outputs.cargo_downloads-path != ''
      with:
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.mise-cache-hit != 'true' &&
        steps.setup.outputs.mise-path != ''
      with:
        path: ${{ steps.setup.outputs.mise-path }}
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.pnpm-cache-hit != 'true' &&
        steps.setup.outputs.pnpm-path != ''
      with:
        path: ${{ steps.setup.outputs.pnpm-path }}
        key: ${{ steps.setup.outputs.pnpm-cache-primary-key }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.uv-cache-hit != 'true' &&
        steps.setup.outputs.uv-path != ''
      with:
        path: ${{ steps.setup.outputs.uv-path }}
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
    needs:
    - build_product
    - build_tests
    - build_python
    - build_host_fixtures
    env:
      CI_TRANSPORT: 'true'
      MISE_ENABLE_TOOLS: aqua:bufbuild/buf,aqua:anchore/syft,aqua:koalaman/shellcheck,aqua:nextest-rs/nextest/cargo-nextest,aqua:taiki-e/cargo-llvm-cov,github:CycloneDX/cyclonedx-rust-cargo,github:EmbarkStudios/cargo-about,github:bnjbvr/cargo-machete,github:rust-secure-code/cargo-auditable,go,go:github.com/rhysd/actionlint/cmd/actionlint,node,pnpm,powershell,protoc,python,rust,sccache,taplo,uv
      CI_PROFILE: release
      CI_PLATFORM: ${{ matrix.platform }}
      CI_CACHE_PROFILE: test
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: unix
          runner: ubuntu-latest
          minutes: 120
          work: SDK / Python / Coverage
          command: test -- --language python --coverage
          bootstrap: '["mise run ci:prerequisites -- --gui-runtime"]'
          inputs: 0,1,2,3
        - platform: unix
          runner: ubuntu-latest
          minutes: 120
          work: Host / Coverage
          command: test -- --language rust --coverage
          bootstrap: '["mise run ci:prerequisites -- --gui-packages"]'
          inputs: 0,1,2,3,4,5,6
  package:
    name: Package / Product
    uses: ./.github/workflows/validate-package.yml
    with:
      channel: nightly
      profile: release
    needs:
    - build_product
    - build_python
  release_dry:
    name: Release / Dry
    uses: ./.github/workflows/validate-release-dry.yml
    with:
      channel: nightly
      profile: release
    needs:
    - package
    permissions:
      actions: read
      contents: read
  publish:
    name: Release / Publish / GitHub
    uses: ./.github/workflows/publish.yml
    needs:
    - package
    - freshness
    if: github.ref == 'refs/heads/dev' && needs.freshness.outputs.build == 'true'
    permissions:
      contents: write
      actions: read
      checks: read
      id-token: write
      attestations: write
    secrets: inherit
    with:
      channel: nightly
  report:
    name: Release / Report / Nightly
    uses: ./.github/workflows/publish.yml
    needs:
    - freshness
    - check
    - build_product
    - build_tests
    - build_bench
    - bench
    - build_host_fixtures
    - build_python
    - build_docs
    - check_generated
    - test
    - test_host
    - test_host_sdks
    - coverage
    - package
    - release_dry
    - publish
    - verify
    if: always() && needs.freshness.outputs.build == 'true' && needs.publish.result == 'success'
    permissions:
      contents: write
      actions: read
      checks: read
      id-token: write
      attestations: write
    secrets: inherit
    with:
      channel: nightly
      report: true
      results: ${{ toJSON(needs) }}
  verify:
    name: Release / Verify
    uses: ./.github/workflows/verify.yml
    needs:
    - publish
    permissions:
      contents: read
      actions: read
    secrets: inherit
    with:
      channel: nightly
