name: Nightly
run-name: Nightly / Validation
'on':
  schedule:
  - cron: 0 */4 * * *
  workflow_dispatch: {}
permissions:
  contents: read
env:
  PROFILE: release
  MISE_LOCKED: '1'
  MISE_EXPERIMENTAL: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo
  pnpm_config_store_dir: ${{ github.workspace }}/.cache/pnpm
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: 'true'
concurrency:
  group: nightly
  cancel-in-progress: false
jobs:
  freshness:
    name: Plan / Freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - uses: ./.github/actions/setup
      with:
        platform: unix
      id: setup
    - id: freshness
      run: mise run ci:nightly-freshness --
      env:
        GH_TOKEN: ${{ github.token }}
    env:
      CI_TRANSPORT: 'true'
      MISE_ENABLE_TOOLS: python,uv,node,pnpm
    outputs:
      build: ${{ steps.freshness.outputs.build }}
    if: github.ref == 'refs/heads/dev'
  check:
    name: Check
    uses: ./.github/workflows/validate-check.yml
    with:
      channel: nightly
      profile: release
    needs:
    - freshness
    if: needs.freshness.outputs.build == 'true'
  build_product:
    name: Build / Product
    uses: ./.github/workflows/validate-build-product.yml
    with:
      channel: nightly
      profile: release
    needs:
    - freshness
    if: needs.freshness.outputs.build == 'true'
  build_tests:
    name: Build / Tests
    uses: ./.github/workflows/validate-build-tests.yml
    with:
      channel: nightly
      profile: release
    needs:
    - freshness
    if: needs.freshness.outputs.build == 'true'
  build_python:
    name: Build / Python
    uses: ./.github/workflows/validate-build-python.yml
    with:
      channel: nightly
      profile: release
    needs:
    - freshness
    if: needs.freshness.outputs.build == 'true'
  build_bench:
    name: Build / Bench
    needs:
    - freshness
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
        bootstrap: '["python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-packages"]'
    - run: mise run build -- --artifact bench --profile ${{ env.PROFILE }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: build-bench-bench-unix
        path: target/ci/build-bench-bench-unix.tar.zst
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
      if: success()
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.cargo_downloads-cache-hit
        != 'true' && steps.setup.outputs.cargo_downloads-path != ''
      with:
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.mise-cache-hit != 'true' &&
        steps.setup.outputs.mise-path != ''
      with:
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
        path: ${{ steps.setup.outputs.mise-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.uv-cache-hit != 'true' &&
        steps.setup.outputs.uv-path != ''
      with:
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
        path: ${{ steps.setup.outputs.uv-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.sccache-cache-hit != 'true'
        && steps.setup.outputs.sccache-path != ''
      with:
        key: ${{ steps.setup.outputs.sccache-cache-primary-key }}
        path: ${{ steps.setup.outputs.sccache-path }}
    env:
      MISE_ENABLE_TOOLS: aqua:anchore/syft,aqua:koalaman/shellcheck,aqua:nextest-rs/nextest/cargo-nextest,github:CycloneDX/cyclonedx-rust-cargo,github:EmbarkStudios/cargo-about,github:bnjbvr/cargo-machete,github:rust-secure-code/cargo-auditable,go,go:github.com/rhysd/actionlint/cmd/actionlint,node,pnpm,powershell,protoc,python,rust,sccache,taplo,uv
      COMPILER_CACHE_BACKEND: disk
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      SCCACHE_CACHE_SIZE: 8G
      COMPILER_CACHE_MODE: ${{ github.ref == 'refs/heads/dev' && 'READ_WRITE' || 'READ_ONLY' }}
      CI_TRANSPORT: 'true'
      CI_OUTPUTS: '[{"archive":"target/ci/build-bench-bench-unix.tar.zst","paths":["target/build/bench/{target}"]}]'
      CI_CACHE_PROFILE: bench
    if: needs.freshness.outputs.build == 'true'
  check_generated:
    name: Check / Generated
    uses: ./.github/workflows/validate-check-generated.yml
    with:
      channel: nightly
      profile: release
    needs:
    - build_python
  test:
    name: Test
    uses: ./.github/workflows/validate-test.yml
    with:
      channel: nightly
      profile: release
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      work: ${{ matrix.work }}
      command: ${{ matrix.command }}
      bootstrap: ${{ matrix.bootstrap }}
      archives: ${{ matrix.archives }}
      minutes: ${{ matrix.minutes }}
      suite: ${{ format('{0}', strategy.job-index) }}
    needs:
    - build_product
    - build_tests
    - build_python
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: unix
          runner: ubuntu-latest
          minutes: 120
          work: TypeScript / Unit
          command: test -- --language typescript --layer unit
          bootstrap: '[]'
          archives: '["target/ci/build-clients-{profile}-unix.tar.zst"]'
        - platform: unix
          runner: ubuntu-22.04
          minutes: 120
          work: Python / Integration
          command: test -- --language python --layer integration
          bootstrap: '[]'
          archives: '["target/ci/build-product-python-{profile}-{platform}.tar.zst"]'
        - platform: windows
          runner: windows-latest
          minutes: 120
          work: Python / Integration
          command: test -- --language python --layer integration
          bootstrap: '[]'
          archives: '["target/ci/build-product-python-{profile}-{platform}.tar.zst"]'
        - platform: unix
          runner: ubuntu-latest
          minutes: 120
          work: TypeScript / Integration
          command: test -- --language typescript --layer integration
          bootstrap: '[]'
          archives: '["target/ci/build-clients-{profile}-unix.tar.zst"]'
        - platform: unix
          runner: ubuntu-22.04
          minutes: 120
          work: Python / Wheel
          command: test -- --language python --wheel
          bootstrap: '[]'
          archives: '["target/ci/build-product-python-{profile}-{platform}.tar.zst"]'
        - platform: windows
          runner: windows-latest
          minutes: 120
          work: Python / Wheel
          command: test -- --language python --wheel
          bootstrap: '[]'
          archives: '["target/ci/build-product-python-{profile}-{platform}.tar.zst"]'
        - platform: unix
          runner: ubuntu-22.04
          minutes: 120
          work: Python / System
          command: test -- --language python --layer system
          bootstrap: '[]'
          archives: '["target/ci/build-product-python-{profile}-{platform}.tar.zst", "target/ci/build-cli-{profile}-{platform}.tar.zst"]'
        - platform: windows
          runner: windows-latest
          minutes: 120
          work: Python / System
          command: test -- --language python --layer system
          bootstrap: '[]'
          archives: '["target/ci/build-product-python-{profile}-{platform}.tar.zst", "target/ci/build-cli-{profile}-{platform}.tar.zst"]'
        - platform: unix
          runner: ubuntu-latest
          minutes: 120
          work: Rust / Acceptance
          command: test -- --language rust --layer acceptance
          bootstrap: '["python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-runtime"]'
          archives: '["target/ci/build-product-python-{profile}-{platform}.tar.zst", "target/ci/build-cli-{profile}-{platform}.tar.zst", "target/ci/build-plugins-{profile}-{platform}.tar.zst",
            "target/ci/build-tests-{profile}-{platform}.tar.zst", "target/ci/build-clients-{profile}-{platform}.tar.zst", "target/ci/build-generator-{profile}-{platform}.tar.zst"]'
        - platform: windows
          runner: windows-latest
          minutes: 120
          work: Rust / Acceptance
          command: test -- --language rust --layer acceptance
          bootstrap: '[]'
          archives: '["target/ci/build-product-python-{profile}-{platform}.tar.zst", "target/ci/build-cli-{profile}-{platform}.tar.zst", "target/ci/build-plugins-{profile}-{platform}.tar.zst",
            "target/ci/build-tests-{profile}-{platform}.tar.zst", "target/ci/build-clients-{profile}-{platform}.tar.zst", "target/ci/build-generator-{profile}-{platform}.tar.zst"]'
        - platform: unix
          runner: ubuntu-latest
          minutes: 120
          work: Rust / Integration
          command: test -- --language rust --layer integration
          bootstrap: '["python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-runtime"]'
          archives: '["target/ci/build-tests-{profile}-{platform}.tar.zst"]'
        - platform: windows
          runner: windows-latest
          minutes: 120
          work: Rust / Integration
          command: test -- --language rust --layer integration
          bootstrap: '[]'
          archives: '["target/ci/build-tests-{profile}-{platform}.tar.zst"]'
        - platform: unix
          runner: ubuntu-latest
          minutes: 120
          work: Rust / Starter
          command: test -- --starter
          bootstrap: '[]'
          archives: '["target/ci/build-generator-{profile}-{platform}.tar.zst"]'
        - platform: windows
          runner: windows-latest
          minutes: 120
          work: Rust / Starter
          command: test -- --starter
          bootstrap: '[]'
          archives: '["target/ci/build-generator-{profile}-{platform}.tar.zst"]'
        - platform: unix
          runner: ubuntu-latest
          minutes: 120
          work: Rust / System
          command: test -- --language rust --layer system
          bootstrap: '["python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-runtime"]'
          archives: '["target/ci/build-product-python-{profile}-{platform}.tar.zst", "target/ci/build-cli-{profile}-{platform}.tar.zst", "target/ci/build-plugins-{profile}-{platform}.tar.zst",
            "target/ci/build-tests-{profile}-{platform}.tar.zst"]'
        - platform: windows
          runner: windows-latest
          minutes: 120
          work: Rust / System
          command: test -- --language rust --layer system
          bootstrap: '[]'
          archives: '["target/ci/build-product-python-{profile}-{platform}.tar.zst", "target/ci/build-cli-{profile}-{platform}.tar.zst", "target/ci/build-plugins-{profile}-{platform}.tar.zst",
            "target/ci/build-tests-{profile}-{platform}.tar.zst"]'
        - platform: unix
          runner: ubuntu-latest
          minutes: 120
          work: Rust / Unit
          command: test -- --language rust --layer unit
          bootstrap: '["python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-runtime"]'
          archives: '["target/ci/build-tests-{profile}-{platform}.tar.zst"]'
        - platform: windows
          runner: windows-latest
          minutes: 120
          work: Rust / Unit
          command: test -- --language rust --layer unit
          bootstrap: '[]'
          archives: '["target/ci/build-tests-{profile}-{platform}.tar.zst"]'
        - platform: unix
          runner: ubuntu-latest
          minutes: 120
          work: TypeScript / System / Execution
          command: test -- --language typescript --layer system --select native-desktop
          bootstrap: '["python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-runtime --desktop"]'
          archives: '["target/ci/build-cli-{profile}-{platform}.tar.zst", "target/ci/build-plugins-{profile}-{platform}.tar.zst", "target/ci/build-tests-{profile}-{platform}.tar.zst",
            "target/ci/build-clients-{profile}-{platform}.tar.zst", "target/ci/build-gui-{profile}-{platform}.tar.zst"]'
        - platform: windows
          runner: windows-latest
          minutes: 120
          work: TypeScript / System / Execution
          command: test -- --language typescript --layer system --select native-desktop
          bootstrap: '["python tools/python/src/dokime_tools/ci/bootstrap.py --desktop"]'
          archives: '["target/ci/build-cli-{profile}-{platform}.tar.zst", "target/ci/build-plugins-{profile}-{platform}.tar.zst", "target/ci/build-tests-{profile}-{platform}.tar.zst",
            "target/ci/build-clients-{profile}-{platform}.tar.zst", "target/ci/build-gui-{profile}-{platform}.tar.zst"]'
        - platform: unix
          runner: ubuntu-latest
          minutes: 120
          work: TypeScript / System / Connections
          command: test -- --language typescript --layer system --select desktop-configuration,desktop-appearance,desktop-remote,desktop-ownership,two-gui-remote
          bootstrap: '["python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-runtime --desktop"]'
          archives: '["target/ci/build-cli-{profile}-{platform}.tar.zst", "target/ci/build-plugins-{profile}-{platform}.tar.zst", "target/ci/build-tests-{profile}-{platform}.tar.zst",
            "target/ci/build-clients-{profile}-{platform}.tar.zst", "target/ci/build-gui-{profile}-{platform}.tar.zst"]'
        - platform: windows
          runner: windows-latest
          minutes: 120
          work: TypeScript / System / Connections
          command: test -- --language typescript --layer system --select desktop-configuration,desktop-appearance,desktop-remote,desktop-ownership,two-gui-remote
          bootstrap: '["python tools/python/src/dokime_tools/ci/bootstrap.py --desktop"]'
          archives: '["target/ci/build-cli-{profile}-{platform}.tar.zst", "target/ci/build-plugins-{profile}-{platform}.tar.zst", "target/ci/build-tests-{profile}-{platform}.tar.zst",
            "target/ci/build-clients-{profile}-{platform}.tar.zst", "target/ci/build-gui-{profile}-{platform}.tar.zst"]'
  coverage:
    name: Test / ${{ matrix.work }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.minutes }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
        bootstrap: ${{ matrix.bootstrap }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: build-cli-${{ env.PROFILE }}-unix
        path: target/ci
      if: contains(format(',{0},', matrix.inputs), ',0,')
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: build-plugins-${{ env.PROFILE }}-unix
        path: target/ci
      if: contains(format(',{0},', matrix.inputs), ',1,')
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: build-product-python-${{ env.PROFILE }}-unix
        path: target/ci
      if: contains(format(',{0},', matrix.inputs), ',2,')
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: build-tests-${{ env.PROFILE }}-unix
        path: target/ci
      if: contains(format(',{0},', matrix.inputs), ',3,')
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: build-clients-${{ env.PROFILE }}-unix
        path: target/ci
      if: contains(format(',{0},', matrix.inputs), ',4,')
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: build-generator-${{ env.PROFILE }}-unix
        path: target/ci
      if: contains(format(',{0},', matrix.inputs), ',5,')
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: build-gui-${{ env.PROFILE }}-unix
        path: target/ci
      if: contains(format(',{0},', matrix.inputs), ',6,')
    - run: mise run ${{ matrix.command }} --profile ${{ env.PROFILE }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: results-${{ strategy.job-index }}-${{ github.job }}-${{ env.PROFILE }}-${{ matrix.platform }}
        path: 'target/tests/

          target/traces/

          target/test-reports/

          target/benchmarks/

          target/coverage/'
        if-no-files-found: ignore
        retention-days: 7
        include-hidden-files: true
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.cargo_downloads-cache-hit
        != 'true' && steps.setup.outputs.cargo_downloads-path != ''
      with:
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.mise-cache-hit != 'true' &&
        steps.setup.outputs.mise-path != ''
      with:
        path: ${{ steps.setup.outputs.mise-path }}
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.pnpm-cache-hit != 'true' &&
        steps.setup.outputs.pnpm-path != ''
      with:
        path: ${{ steps.setup.outputs.pnpm-path }}
        key: ${{ steps.setup.outputs.pnpm-cache-primary-key }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.uv-cache-hit != 'true' &&
        steps.setup.outputs.uv-path != ''
      with:
        path: ${{ steps.setup.outputs.uv-path }}
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
    needs:
    - build_product
    - build_tests
    - build_python
    env:
      CI_TRANSPORT: 'true'
      MISE_ENABLE_TOOLS: aqua:anchore/syft,aqua:koalaman/shellcheck,aqua:nextest-rs/nextest/cargo-nextest,aqua:taiki-e/cargo-llvm-cov,github:CycloneDX/cyclonedx-rust-cargo,github:EmbarkStudios/cargo-about,github:bnjbvr/cargo-machete,github:rust-secure-code/cargo-auditable,go,go:github.com/rhysd/actionlint/cmd/actionlint,node,pnpm,powershell,protoc,python,rust,sccache,taplo,uv
      CI_PROFILE: release
      CI_PLATFORM: ${{ matrix.platform }}
      CI_CACHE_PROFILE: test
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: unix
          runner: ubuntu-latest
          minutes: 120
          work: Python / Coverage
          command: test -- --language python --coverage
          bootstrap: '[]'
          inputs: 0,1,2,3
        - platform: unix
          runner: ubuntu-latest
          minutes: 120
          work: Rust / Coverage
          command: test -- --language rust --coverage
          bootstrap: '["python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-packages"]'
          inputs: 0,1,2,3,4,5,6
  bench:
    name: Bench / ${{ matrix.work }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.minutes }}
    needs:
    - build_bench
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
        bootstrap: ${{ matrix.bootstrap }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: build-bench-bench-unix
        path: target/ci
      if: contains(format(',{0},', matrix.inputs), ',0,')
    - run: mise run ${{ matrix.command }} --profile ${{ env.PROFILE }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: results-${{ strategy.job-index }}-${{ github.job }}-${{ env.PROFILE }}-${{ matrix.platform }}
        path: 'target/tests/

          target/traces/

          target/test-reports/

          target/benchmarks/

          target/coverage/'
        if-no-files-found: ignore
        retention-days: 7
        include-hidden-files: true
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.bench_baselines-cache-hit
        != 'true' && steps.setup.outputs.bench_baselines-path != ''
      with:
        path: ${{ steps.setup.outputs.bench_baselines-path }}
        key: ${{ steps.setup.outputs.bench_baselines-cache-primary-key }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.cargo_downloads-cache-hit
        != 'true' && steps.setup.outputs.cargo_downloads-path != ''
      with:
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.mise-cache-hit != 'true' &&
        steps.setup.outputs.mise-path != ''
      with:
        path: ${{ steps.setup.outputs.mise-path }}
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.uv-cache-hit != 'true' &&
        steps.setup.outputs.uv-path != ''
      with:
        path: ${{ steps.setup.outputs.uv-path }}
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
    env:
      CI_TRANSPORT: 'true'
      MISE_ENABLE_TOOLS: aqua:anchore/syft,aqua:koalaman/shellcheck,aqua:nextest-rs/nextest/cargo-nextest,git-cliff,github:CycloneDX/cyclonedx-rust-cargo,github:EmbarkStudios/cargo-about,github:rust-secure-code/cargo-auditable,go,go:github.com/rhysd/actionlint/cmd/actionlint,node,pnpm,powershell,python,rust,uv
      CI_PROFILE: release
      CI_PLATFORM: ${{ matrix.platform }}
      CI_CACHE_PROFILE: bench
      CI_BENCH: 'true'
      CI_BENCH_LAYER: ${{ matrix.layer }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: unix
          runner: ubuntu-latest
          minutes: 120
          work: Rust / System
          command: bench -- --language rust --layer system --refresh-baseline
          bootstrap: '[]'
          inputs: '0'
          layer: system
        - platform: unix
          runner: ubuntu-latest
          minutes: 120
          work: Rust / Unit
          command: bench -- --language rust --layer unit --refresh-baseline
          bootstrap: '[]'
          inputs: '0'
          layer: unit
        - platform: unix
          runner: ubuntu-latest
          minutes: 120
          work: Rust / Integration
          command: bench -- --language rust --layer integration --refresh-baseline
          bootstrap: '[]'
          inputs: '0'
          layer: integration
  package:
    name: Package
    uses: ./.github/workflows/validate-package.yml
    with:
      channel: nightly
      profile: release
    needs:
    - build_product
    - build_python
  release_dry:
    name: Release / Dry
    uses: ./.github/workflows/validate-release-dry.yml
    with:
      channel: nightly
      profile: release
    needs:
    - package
    permissions:
      actions: read
      contents: read
  publish:
    name: Nightly / Publish
    uses: ./.github/workflows/publish.yml
    needs:
    - package
    if: github.ref == 'refs/heads/dev'
    permissions:
      contents: write
      actions: read
      checks: read
      id-token: write
      attestations: write
    secrets: inherit
    with:
      channel: nightly
  report:
    name: Nightly / Report
    uses: ./.github/workflows/publish.yml
    needs:
    - freshness
    - check
    - build_product
    - build_tests
    - build_python
    - build_bench
    - check_generated
    - test
    - coverage
    - bench
    - package
    - release_dry
    - publish
    - verify
    if: always() && needs.freshness.outputs.build == 'true' && needs.publish.result == 'success'
    permissions:
      contents: write
      actions: read
      checks: read
      id-token: write
      attestations: write
    secrets: inherit
    with:
      channel: nightly
      report: true
      results: ${{ toJSON(needs) }}
  verify:
    name: Nightly / Verify
    uses: ./.github/workflows/verify.yml
    needs:
    - publish
    permissions:
      contents: read
      actions: read
    secrets: inherit
    with:
      channel: nightly
