name: CI / Nightly
"on":
  schedule:
  - cron: 0 0 * * *
    timezone: Europe/Zurich
  workflow_dispatch: {}
permissions:
  contents: read
env:
  PROFILE: release
  MISE_LOCKED: "1"
  MISE_EXPERIMENTAL: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo
  pnpm_config_store_dir: ${{ github.workspace }}/.cache/pnpm
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
concurrency:
  group: nightly-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  source:
    name: Check / Repository
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - name: Configure Checkout Git
      run: git config --global core.longpaths true
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
        cache-backend: ""
        cache-mode: ""
        caches: "{\"cargo_downloads\":{\"key\":\"ci-v5-cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}\",\"path\":\".cache/cargo/registry/\\n.cache/cargo/git/\"},\"mise\":{\"key\":\"ci-v5-mise-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}-<RUNNER_IMAGE_ID>-${{ env.JOB_IMAGE_ID }}-<MISE_ROOT_ID>-<WORKSPACE_ROOT_ID>-${{ hashFiles('mise.lock') }}\",\"path\":\"<MISE_DATA_DIR>\"},\"pnpm\":{\"key\":\"ci-v5-pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}-${{ hashFiles('crates/dokime-gui/pnpm-lock.yaml', 'mise.lock') }}\",\"path\":\".cache/pnpm/\"},\"uv\":{\"key\":\"ci-v5-uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}-${{ hashFiles('uv.lock', 'mise.lock') }}\",\"path\":\".cache/uv/\"}}"
        bootstrap: "[]"
    - run: mise run check:repository
    - id: release_kind
      name: Identify Stable Release
      shell: bash
      run: |-
        stable=false
        if [[ "$GITHUB_REF" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
          if [[ "$GITHUB_REF_PROTECTED" != true ]]; then
            printf '%s\n' 'Stable release tag is unprotected: configure the tag ruleset for v* before releasing' >&2
            exit 1
          fi
          stable=true
        fi
        printf 'stable_release=%s\n' "$stable" >> "$GITHUB_OUTPUT"
    - uses: ./.github/actions/save-caches
      if: >-
        success() && (github.ref == 'refs/heads/dev' && github.event_name !=
        'pull_request') && steps.setup.outputs.cargo_downloads-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
    - uses: ./.github/actions/save-caches
      if: >-
        success() && (github.ref == 'refs/heads/dev' && github.event_name !=
        'pull_request') && steps.setup.outputs.mise-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
        path: ${{ steps.setup.outputs.mise-path }}
    - uses: ./.github/actions/save-caches
      if: >-
        success() && (github.ref == 'refs/heads/dev' && github.event_name !=
        'pull_request') && steps.setup.outputs.pnpm-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.pnpm-cache-primary-key }}
        path: ${{ steps.setup.outputs.pnpm-path }}
    - uses: ./.github/actions/save-caches
      if: >-
        success() && (github.ref == 'refs/heads/dev' && github.event_name !=
        'pull_request') && steps.setup.outputs.uv-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
        path: ${{ steps.setup.outputs.uv-path }}
    - name: Cache Summary
      if: always()
      env:
        CACHE_RESTORES: "{\"Mise\":\"${{ steps.setup.outputs.mise-cache-hit == 'true' && 'Exact Hit' || steps.setup.outputs.mise-cache-hit == 'false' && 'Partial Hit' || steps.setup.outputs.mise-outcome == 'success' && 'Miss' || 'Unavailable' }}\",\"Cargo\":\"${{ steps.setup.outputs.cargo_downloads-cache-hit == 'true' && 'Exact Hit' || steps.setup.outputs.cargo_downloads-cache-hit == 'false' && 'Partial Hit' || steps.setup.outputs.cargo_downloads-outcome == 'success' && 'Miss' || 'Unavailable' }}\",\"UV\":\"${{ steps.setup.outputs.uv-cache-hit == 'true' && 'Exact Hit' || steps.setup.outputs.uv-cache-hit == 'false' && 'Partial Hit' || steps.setup.outputs.uv-outcome == 'success' && 'Miss' || 'Unavailable' }}\",\"PNPM\":\"${{ steps.setup.outputs.pnpm-cache-hit == 'true' && 'Exact Hit' || steps.setup.outputs.pnpm-cache-hit == 'false' && 'Partial Hit' || steps.setup.outputs.pnpm-outcome == 'success' && 'Miss' || 'Unavailable' }}\"}"
      uses: ./.github/actions/save-caches
      with:
        summary-module: dokime_tools.ci.summary
    env:
      MISE_ENABLE_TOOLS: >-
        go,node,powershell,python,rust,pnpm,uv,aqua:nextest-rs/nextest/cargo-nextest,aqua:taiki-e/cargo-llvm-cov,github:bnjbvr/cargo-machete,sccache,aqua:koalaman/shellcheck,go:github.com/rhysd/actionlint/cmd/actionlint,taplo,protoc,git-cliff
    outputs:
      stable_release: ${{ steps.release_kind.outputs.stable_release }}
    concurrency:
      group: ci-${{ github.workflow }}-source-shared-${{ github.run_id }}
      cancel-in-progress: false
  check_python:
    name: Check / Python
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - name: Configure Checkout Git
      run: git config --global core.longpaths true
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
        cache-backend: ""
        cache-mode: ""
        caches: "{\"cargo_downloads\":{\"key\":\"ci-v5-cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}\",\"path\":\".cache/cargo/registry/\\n.cache/cargo/git/\"},\"mise\":{\"key\":\"ci-v5-mise-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}-<RUNNER_IMAGE_ID>-${{ env.JOB_IMAGE_ID }}-<MISE_ROOT_ID>-<WORKSPACE_ROOT_ID>-${{ hashFiles('mise.lock') }}\",\"path\":\"<MISE_DATA_DIR>\"},\"pnpm\":{\"key\":\"ci-v5-pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}-${{ hashFiles('crates/dokime-gui/pnpm-lock.yaml', 'mise.lock') }}\",\"path\":\".cache/pnpm/\"},\"uv\":{\"key\":\"ci-v5-uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}-${{ hashFiles('uv.lock', 'mise.lock') }}\",\"path\":\".cache/uv/\"}}"
        bootstrap: "[]"
    - run: mise run check:python
    - uses: ./.github/actions/save-caches
      if: >-
        success() && (github.ref == 'refs/heads/dev' && github.event_name !=
        'pull_request') && steps.setup.outputs.cargo_downloads-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
    - uses: ./.github/actions/save-caches
      if: >-
        success() && (github.ref == 'refs/heads/dev' && github.event_name !=
        'pull_request') && steps.setup.outputs.mise-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
        path: ${{ steps.setup.outputs.mise-path }}
    - uses: ./.github/actions/save-caches
      if: >-
        success() && (github.ref == 'refs/heads/dev' && github.event_name !=
        'pull_request') && steps.setup.outputs.pnpm-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.pnpm-cache-primary-key }}
        path: ${{ steps.setup.outputs.pnpm-path }}
    - uses: ./.github/actions/save-caches
      if: >-
        success() && (github.ref == 'refs/heads/dev' && github.event_name !=
        'pull_request') && steps.setup.outputs.uv-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
        path: ${{ steps.setup.outputs.uv-path }}
    - name: Cache Summary
      if: always()
      env:
        CACHE_RESTORES: "{\"Mise\":\"${{ steps.setup.outputs.mise-cache-hit == 'true' && 'Exact Hit' || steps.setup.outputs.mise-cache-hit == 'false' && 'Partial Hit' || steps.setup.outputs.mise-outcome == 'success' && 'Miss' || 'Unavailable' }}\",\"Cargo\":\"${{ steps.setup.outputs.cargo_downloads-cache-hit == 'true' && 'Exact Hit' || steps.setup.outputs.cargo_downloads-cache-hit == 'false' && 'Partial Hit' || steps.setup.outputs.cargo_downloads-outcome == 'success' && 'Miss' || 'Unavailable' }}\",\"UV\":\"${{ steps.setup.outputs.uv-cache-hit == 'true' && 'Exact Hit' || steps.setup.outputs.uv-cache-hit == 'false' && 'Partial Hit' || steps.setup.outputs.uv-outcome == 'success' && 'Miss' || 'Unavailable' }}\",\"PNPM\":\"${{ steps.setup.outputs.pnpm-cache-hit == 'true' && 'Exact Hit' || steps.setup.outputs.pnpm-cache-hit == 'false' && 'Partial Hit' || steps.setup.outputs.pnpm-outcome == 'success' && 'Miss' || 'Unavailable' }}\"}"
      uses: ./.github/actions/save-caches
      with:
        summary-module: dokime_tools.ci.summary
    env:
      MISE_ENABLE_TOOLS: >-
        go,node,powershell,python,rust,pnpm,uv,aqua:nextest-rs/nextest/cargo-nextest,aqua:koalaman/shellcheck,go:github.com/rhysd/actionlint/cmd/actionlint,git-cliff
    concurrency:
      group: ci-${{ github.workflow }}-check_python-shared-${{ github.run_id }}
      cancel-in-progress: false
  check_typescript:
    name: Check / TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - name: Configure Checkout Git
      run: git config --global core.longpaths true
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
        cache-backend: ""
        cache-mode: ""
        caches: "{\"cargo_downloads\":{\"key\":\"ci-v5-cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}\",\"path\":\".cache/cargo/registry/\\n.cache/cargo/git/\"},\"mise\":{\"key\":\"ci-v5-mise-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}-<RUNNER_IMAGE_ID>-${{ env.JOB_IMAGE_ID }}-<MISE_ROOT_ID>-<WORKSPACE_ROOT_ID>-${{ hashFiles('mise.lock') }}\",\"path\":\"<MISE_DATA_DIR>\"},\"pnpm\":{\"key\":\"ci-v5-pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}-${{ hashFiles('crates/dokime-gui/pnpm-lock.yaml', 'mise.lock') }}\",\"path\":\".cache/pnpm/\"},\"uv\":{\"key\":\"ci-v5-uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}-${{ hashFiles('uv.lock', 'mise.lock') }}\",\"path\":\".cache/uv/\"}}"
        bootstrap: "[]"
    - run: mise run check:typescript
    - uses: ./.github/actions/save-caches
      if: >-
        success() && (github.ref == 'refs/heads/dev' && github.event_name !=
        'pull_request') && steps.setup.outputs.cargo_downloads-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
    - uses: ./.github/actions/save-caches
      if: >-
        success() && (github.ref == 'refs/heads/dev' && github.event_name !=
        'pull_request') && steps.setup.outputs.mise-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
        path: ${{ steps.setup.outputs.mise-path }}
    - uses: ./.github/actions/save-caches
      if: >-
        success() && (github.ref == 'refs/heads/dev' && github.event_name !=
        'pull_request') && steps.setup.outputs.pnpm-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.pnpm-cache-primary-key }}
        path: ${{ steps.setup.outputs.pnpm-path }}
    - uses: ./.github/actions/save-caches
      if: >-
        success() && (github.ref == 'refs/heads/dev' && github.event_name !=
        'pull_request') && steps.setup.outputs.uv-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
        path: ${{ steps.setup.outputs.uv-path }}
    - name: Cache Summary
      if: always()
      env:
        CACHE_RESTORES: "{\"Mise\":\"${{ steps.setup.outputs.mise-cache-hit == 'true' && 'Exact Hit' || steps.setup.outputs.mise-cache-hit == 'false' && 'Partial Hit' || steps.setup.outputs.mise-outcome == 'success' && 'Miss' || 'Unavailable' }}\",\"Cargo\":\"${{ steps.setup.outputs.cargo_downloads-cache-hit == 'true' && 'Exact Hit' || steps.setup.outputs.cargo_downloads-cache-hit == 'false' && 'Partial Hit' || steps.setup.outputs.cargo_downloads-outcome == 'success' && 'Miss' || 'Unavailable' }}\",\"UV\":\"${{ steps.setup.outputs.uv-cache-hit == 'true' && 'Exact Hit' || steps.setup.outputs.uv-cache-hit == 'false' && 'Partial Hit' || steps.setup.outputs.uv-outcome == 'success' && 'Miss' || 'Unavailable' }}\",\"PNPM\":\"${{ steps.setup.outputs.pnpm-cache-hit == 'true' && 'Exact Hit' || steps.setup.outputs.pnpm-cache-hit == 'false' && 'Partial Hit' || steps.setup.outputs.pnpm-outcome == 'success' && 'Miss' || 'Unavailable' }}\"}"
      uses: ./.github/actions/save-caches
      with:
        summary-module: dokime_tools.ci.summary
    env:
      MISE_ENABLE_TOOLS: >-
        go,node,powershell,python,rust,pnpm,uv,aqua:nextest-rs/nextest/cargo-nextest,aqua:koalaman/shellcheck,go:github.com/rhysd/actionlint/cmd/actionlint,git-cliff
    concurrency:
      group: ci-${{ github.workflow }}-check_typescript-shared-${{ github.run_id }}
      cancel-in-progress: false
  release_dry_nightly:
    name: Release / Dry
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - name: Configure Checkout Git
      run: git config --global core.longpaths true
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
        cache-backend: disk
        cache-mode: >-
          ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' &&
          github.ref == 'refs/heads/dev')) && 'READ_WRITE' || 'READ_ONLY' }}
        caches: "{\"cargo_downloads\":{\"key\":\"ci-v5-cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}\",\"path\":\".cache/cargo/registry/\\n.cache/cargo/git/\"},\"mise\":{\"key\":\"ci-v5-mise-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}-<RUNNER_IMAGE_ID>-${{ env.JOB_IMAGE_ID }}-<MISE_ROOT_ID>-<WORKSPACE_ROOT_ID>-${{ hashFiles('mise.lock') }}\",\"path\":\"<MISE_DATA_DIR>\"},\"pnpm\":{\"key\":\"ci-v5-pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}-${{ hashFiles('crates/dokime-gui/pnpm-lock.yaml', 'mise.lock') }}\",\"path\":\".cache/pnpm/\"},\"sccache\":{\"key\":\"ci-v5-sccache-${{ runner.os }}-${{ runner.arch }}-${{ env.PROFILE }}-release-publish-dry-${{ hashFiles('mise.lock') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}\",\"path\":\".cache/sccache/\",\"restore-keys\":\"ci-v5-sccache-${{ runner.os }}-${{ runner.arch }}-${{ env.PROFILE }}-release-publish-dry-${{ hashFiles('mise.lock') }}-${{ hashFiles('Cargo.lock') }}-\\nci-v5-sccache-${{ runner.os }}-${{ runner.arch }}-${{ env.PROFILE }}-release-publish-dry-${{ hashFiles('mise.lock') }}-\"},\"uv\":{\"key\":\"ci-v5-uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}-${{ hashFiles('uv.lock', 'mise.lock') }}\",\"path\":\".cache/uv/\"}}"
        bootstrap: "[\"python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-packages\"]"
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: package-${{ env.PROFILE }}-python-any
        path: target/ci
        github-token: ${{ github.token }}
    - name: Extract package:python / package
      uses: ./.github/actions/extract-build
      with:
        command: "[\"mise\",\"exec\",\"--\",\"uv\",\"run\",\"--locked\",\"--project\",\"tools/python\",\"python\",\"-m\",\"dokime_tools.ci.artifacts\",\"extract\",\"--archive\",\"target/ci/package-${{ env.PROFILE }}-python-any.tar.zst\",\"--profile\",\"${{ env.PROFILE }}\",\"--target\",\"any\"]"
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: package-${{ env.PROFILE }}-rust-windows
        path: target/ci
        github-token: ${{ github.token }}
    - name: Extract package:rust / package
      uses: ./.github/actions/extract-build
      with:
        command: "[\"mise\",\"exec\",\"--\",\"uv\",\"run\",\"--locked\",\"--project\",\"tools/python\",\"python\",\"-m\",\"dokime_tools.ci.artifacts\",\"extract\",\"--archive\",\"target/ci/package-${{ env.PROFILE }}-rust-windows.tar.zst\",\"--profile\",\"${{ env.PROFILE }}\"]"
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: package-${{ env.PROFILE }}-rust-unix
        path: target/ci
        github-token: ${{ github.token }}
    - name: Extract package:rust / package
      uses: ./.github/actions/extract-build
      with:
        command: "[\"mise\",\"exec\",\"--\",\"uv\",\"run\",\"--locked\",\"--project\",\"tools/python\",\"python\",\"-m\",\"dokime_tools.ci.artifacts\",\"extract\",\"--archive\",\"target/ci/package-${{ env.PROFILE }}-rust-unix.tar.zst\",\"--profile\",\"${{ env.PROFILE }}\"]"
    - run: >-
        mise exec -- uv run --locked --project tools/python python -m
        dokime_tools.ci.build
      env:
        RELEASE_PROFILE: ${{ env.PROFILE }}
        BUILD_SCRIPT: mise run release:publish:dry
    - uses: ./.github/actions/save-caches
      if: >-
        success() && (github.ref == 'refs/heads/dev' && github.event_name !=
        'pull_request') && steps.setup.outputs.cargo_downloads-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
    - uses: ./.github/actions/save-caches
      if: >-
        success() && (github.ref == 'refs/heads/dev' && github.event_name !=
        'pull_request') && steps.setup.outputs.mise-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
        path: ${{ steps.setup.outputs.mise-path }}
    - uses: ./.github/actions/save-caches
      if: >-
        success() && (github.ref == 'refs/heads/dev' && github.event_name !=
        'pull_request') && steps.setup.outputs.pnpm-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.pnpm-cache-primary-key }}
        path: ${{ steps.setup.outputs.pnpm-path }}
    - uses: ./.github/actions/save-caches
      if: >-
        success() && (github.ref == 'refs/heads/dev' && github.event_name !=
        'pull_request') && steps.setup.outputs.sccache-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.sccache-cache-primary-key }}
        path: ${{ steps.setup.outputs.sccache-path }}
    - uses: ./.github/actions/save-caches
      if: >-
        success() && (github.ref == 'refs/heads/dev' && github.event_name !=
        'pull_request') && steps.setup.outputs.uv-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
        path: ${{ steps.setup.outputs.uv-path }}
    - name: Cache Summary
      if: always()
      env:
        CACHE_RESTORES: "{\"Mise\":\"${{ steps.setup.outputs.mise-cache-hit == 'true' && 'Exact Hit' || steps.setup.outputs.mise-cache-hit == 'false' && 'Partial Hit' || steps.setup.outputs.mise-outcome == 'success' && 'Miss' || 'Unavailable' }}\",\"Cargo\":\"${{ steps.setup.outputs.cargo_downloads-cache-hit == 'true' && 'Exact Hit' || steps.setup.outputs.cargo_downloads-cache-hit == 'false' && 'Partial Hit' || steps.setup.outputs.cargo_downloads-outcome == 'success' && 'Miss' || 'Unavailable' }}\",\"UV\":\"${{ steps.setup.outputs.uv-cache-hit == 'true' && 'Exact Hit' || steps.setup.outputs.uv-cache-hit == 'false' && 'Partial Hit' || steps.setup.outputs.uv-outcome == 'success' && 'Miss' || 'Unavailable' }}\",\"PNPM\":\"${{ steps.setup.outputs.pnpm-cache-hit == 'true' && 'Exact Hit' || steps.setup.outputs.pnpm-cache-hit == 'false' && 'Partial Hit' || steps.setup.outputs.pnpm-outcome == 'success' && 'Miss' || 'Unavailable' }}\",\"Compiler\":\"${{ steps.setup.outputs.sccache-cache-hit == 'true' && 'Exact Hit' || steps.setup.outputs.sccache-cache-hit == 'false' && 'Partial Hit' || steps.setup.outputs.sccache-outcome == 'success' && 'Miss' || 'Unavailable' }}\"}"
      uses: ./.github/actions/save-caches
      with:
        summary-module: dokime_tools.ci.summary
    env:
      MISE_ENABLE_TOOLS: git-cliff,go,minisign,node,pnpm,powershell,python,rust,sccache,uv
      MISE_TASK_SKIP: package:python,package:rust
      COMPILER_CACHE_BACKEND: disk
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      SCCACHE_CACHE_SIZE: 2G
      COMPILER_CACHE_MODE: >-
        ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' &&
        github.ref == 'refs/heads/dev')) && 'READ_WRITE' || 'READ_ONLY' }}
      RELEASE_PROFILE: release
    needs:
    - build_product
    - build_python_any
    - build_tests
    - check_generated_python
    - check_generated_typescript
    - check_python
    - check_rust
    - check_typescript
    - package_python
    - package_rust
    - source
    - validate_test_python_acceptance
    - validate_test_python_integration
    - validate_test_python_unit
    - validate_test_rust_acceptance
    - validate_test_rust_integration
    - validate_test_rust_system
    - validate_test_rust_unit
    - validate_test_typescript_integration
    - validate_test_typescript_system
    - validate_test_typescript_unit
    permissions:
      actions: read
      contents: read
    concurrency:
      group: ci-${{ github.workflow }}-release_dry_nightly-shared-${{ github.run_id }}
      cancel-in-progress: false
  build_python_any:
    name: Build / Product / Python (any)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - name: Configure Checkout Git
      run: git config --global core.longpaths true
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - id: setup
