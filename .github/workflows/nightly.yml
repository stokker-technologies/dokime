    - run: mise run build -- --artifact product --profile ${{ env.PROFILE }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: build-cli-${{ env.PROFILE }}-${{ matrix.platform }}
        path: target/ci/build-cli-${{ env.PROFILE }}-${{ matrix.platform }}.tar.zst
