name: Publish Release
on:
  pull_request:
    branches: [main]
    types: [closed]
permissions:
  contents: read
  actions: read
concurrency:
  group: release-publication
  cancel-in-progress: false
env:
  MISE_YES: '1'
  MISE_LOCKED: '1'
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.cache/mise-global.toml
  MISE_DATA_DIR: ${{ github.workspace }}/.cache/mise
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  native:
    name: Native (${{ matrix.os }})
    if: github.event.pull_request.merged && github.event.pull_request.head.repo.full_name == github.repository && (startsWith(github.event.pull_request.head.ref, 'release/') || startsWith(github.event.pull_request.head.ref, 'fix/'))
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows]
    uses: ./.github/workflows/platform.yml
    with:
      os: ${{ matrix.os }}
      authorization: release
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
  ci_artifacts_catalog:
    name: Ci Artifacts Catalog
    env:
      DOKIME_CI_ROLE: catalog
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - &tools_restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: tools-${{ runner.os }}-${{ runner.arch }}-v2-${{ hashFiles('mise.lock', 'mise.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tools-${{ runner.os }}-${{ runner.arch }}-v2-${{ hashFiles('mise.lock', 'mise.toml') }}-
          path: .cache/mise/
      - &sources_restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: sources-${{ runner.os }}-${{ runner.arch }}-v2-${{ hashFiles('Cargo.lock', 'uv.lock', 'pnpm-lock.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sources-${{ runner.os }}-${{ runner.arch }}-v2-${{ hashFiles('Cargo.lock', 'uv.lock', 'pnpm-lock.yaml') }}-
          path: |
            .cache/cargo/registry/cache/
            .cache/cargo/registry/index/
            .cache/cargo/git/db/
            .cache/uv/
      - name: Prepare Linux
        run: . tools/ci/install.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: validation-[lw]*
          merge-multiple: true
          path: dist/downloads/
      - id: catalog
        run: mise run --skip-tools ci:artifacts:catalog
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.catalog.outputs.artifact_name }}
          path: dist/validation/catalog.json
          if-no-files-found: error
          retention-days: 90

  release_publish:
    name: Release Publish
    needs: ci_artifacts_catalog
    environment: release
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MISE_YES: '1'
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.cache/mise-global.toml
      MISE_DATA_DIR: ${{ github.workspace }}/.cache/mise
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      GITHUB_TOKEN: ${{ github.token }}
      DOKIME_CI_ROLE: publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - *tools_restore
      - *sources_restore
      - name: Prepare Linux
        run: . tools/ci/install.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: validation-[lw]*
          merge-multiple: true
          path: dist/downloads/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: validation-catalog-*
          merge-multiple: true
          path: dist/validation/
      - run: mise run --skip-tools release:publish
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: .stkr/state/release/
          include-hidden-files: true
          if-no-files-found: ignore
