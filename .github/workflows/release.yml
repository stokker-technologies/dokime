name: Release
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && 'Release / Preparation' ||
  github.event_name == 'push' && 'Release / Publication' || 'Release / Tagging' }}
"on":
  workflow_dispatch: {}
  workflow_run:
    workflows: [CI]
    types: [completed]
  push:
    tags:
    - v*
    - '!v*-dev.*'
permissions:
  contents: read
env:
  PROFILE: >-
    ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.head_ref,
    'release/v')) && 'release' || 'dev' }}
  MISE_LOCKED: "1"
  MISE_EXPERIMENTAL: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo
  pnpm_config_store_dir: ${{ github.workspace }}/.cache/pnpm
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
jobs:
  mode:
    name: Release / Mode
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      sha: ${{ steps.mode.outputs.sha }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - id: mode
      shell: python
      run: |-
        import os, runpy
        from pathlib import Path
        action = runpy.run_path('.github/actions/review-release/run.py')
        result = action['github_release_mode']()
        with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as stream:
            stream.write(''.join(f'{key}={value}\n' for key, value in result.items()))
      env:
        GH_TOKEN: ${{ github.token }}
    permissions:
      contents: read
      pull-requests: read
  prepare:
    name: Release / Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - name: Configure Checkout Git
      run: git config --global core.longpaths true
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
        cache-backend: ""
        cache-mode: ""
        caches: "{\"cargo_downloads\":{\"key\":\"ci-v5-cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}\",\"path\":\".cache/cargo/registry/\\n.cache/cargo/git/\"},\"mise\":{\"key\":\"ci-v5-mise-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}-<RUNNER_IMAGE_ID>-${{ env.JOB_IMAGE_ID }}-<MISE_ROOT_ID>-<WORKSPACE_ROOT_ID>-${{ hashFiles('mise.lock') }}\",\"path\":\"<MISE_DATA_DIR>\"},\"pnpm\":{\"key\":\"ci-v5-pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}-${{ hashFiles('crates/dokime-gui/pnpm-lock.yaml', 'mise.lock') }}\",\"path\":\".cache/pnpm/\"},\"uv\":{\"key\":\"ci-v5-uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}-${{ hashFiles('uv.lock', 'mise.lock') }}\",\"path\":\".cache/uv/\"}}"
        bootstrap: "[]"
    - run: mise run release:prepare
    - name: Check Runner Group Allowlist
      run: >-
        mise exec -- uv run --locked --project tools/python python -m
        dokime_tools.test.runners
      env:
        GITHUB_RUNNER_WORKFLOWS: "{\"ci.yml\":{\"unix\":{\"small\":\"ubuntu-latest\",\"large\":\"ubuntu-latest\"},\"windows\":{\"small\":\"windows-latest\",\"large\":\"windows-latest\"},\"nightly\":{\"small\":\"ubuntu-latest\",\"coverage\":\"ubuntu-latest\"}},\"release.yml\":{\"unix\":{\"small\":\"ubuntu-latest\",\"large\":\"ubuntu-latest\"},\"windows\":{\"small\":\"windows-latest\",\"large\":\"windows-latest\"},\"nightly\":{\"small\":\"ubuntu-latest\",\"coverage\":\"ubuntu-latest\"}}}"
        GH_TOKEN: ${{ secrets.RUNNER_GROUP_READ_TOKEN || github.token }}
    - run: >-
        mise exec -- uv run --locked --project tools/python python -m
        dokime_tools.release.run review
    - uses: ./.github/actions/save-caches
      if: >-
        success() && (github.ref == 'refs/heads/dev' && github.event_name !=
        'pull_request') && steps.setup.outputs.cargo_downloads-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
    - uses: ./.github/actions/save-caches
      if: >-
        success() && (github.ref == 'refs/heads/dev' && github.event_name !=
        'pull_request') && steps.setup.outputs.mise-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
        path: ${{ steps.setup.outputs.mise-path }}
    - uses: ./.github/actions/save-caches
      if: >-
        success() && (github.ref == 'refs/heads/dev' && github.event_name !=
        'pull_request') && steps.setup.outputs.pnpm-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.pnpm-cache-primary-key }}
        path: ${{ steps.setup.outputs.pnpm-path }}
    - uses: ./.github/actions/save-caches
      if: >-
        success() && (github.ref == 'refs/heads/dev' && github.event_name !=
        'pull_request') && steps.setup.outputs.uv-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
        path: ${{ steps.setup.outputs.uv-path }}
    - name: Cache Summary
      if: always()
      env:
        CACHE_RESTORES: "{\"Mise\":\"${{ steps.setup.outputs.mise-cache-hit == 'true' && 'Exact Hit' || steps.setup.outputs.mise-cache-hit == 'false' && 'Partial Hit' || steps.setup.outputs.mise-outcome == 'success' && 'Miss' || 'Unavailable' }}\",\"Cargo\":\"${{ steps.setup.outputs.cargo_downloads-cache-hit == 'true' && 'Exact Hit' || steps.setup.outputs.cargo_downloads-cache-hit == 'false' && 'Partial Hit' || steps.setup.outputs.cargo_downloads-outcome == 'success' && 'Miss' || 'Unavailable' }}\",\"UV\":\"${{ steps.setup.outputs.uv-cache-hit == 'true' && 'Exact Hit' || steps.setup.outputs.uv-cache-hit == 'false' && 'Partial Hit' || steps.setup.outputs.uv-outcome == 'success' && 'Miss' || 'Unavailable' }}\",\"PNPM\":\"${{ steps.setup.outputs.pnpm-cache-hit == 'true' && 'Exact Hit' || steps.setup.outputs.pnpm-cache-hit == 'false' && 'Partial Hit' || steps.setup.outputs.pnpm-outcome == 'success' && 'Miss' || 'Unavailable' }}\"}"
      uses: ./.github/actions/save-caches
      with:
        summary-module: ""
    env:
      MISE_ENABLE_TOOLS: go,node,powershell,python,rust,pnpm,uv,git-cliff,minisign,github:rust-secure-code/cargo-auditable,github:EmbarkStudios/cargo-about,github:CycloneDX/cyclonedx-rust-cargo,aqua:anchore/syft
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      CRATES_BOOTSTRAP_AVAILABLE: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    needs: [mode]
    if: needs.mode.outputs.mode == 'prepare'
    environment: release
    permissions:
      contents: read
  tag:
    name: Release / Tag
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - name: Configure Checkout Git
      run: git config --global core.longpaths true
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ needs.mode.outputs.sha }}
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
        cache-backend: ""
        cache-mode: ""
        caches: "{\"cargo_downloads\":{\"key\":\"ci-v5-cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}\",\"path\":\".cache/cargo/registry/\\n.cache/cargo/git/\"},\"mise\":{\"key\":\"ci-v5-mise-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}-<RUNNER_IMAGE_ID>-${{ env.JOB_IMAGE_ID }}-<MISE_ROOT_ID>-<WORKSPACE_ROOT_ID>-${{ hashFiles('mise.lock') }}\",\"path\":\"<MISE_DATA_DIR>\"},\"pnpm\":{\"key\":\"ci-v5-pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}-${{ hashFiles('crates/dokime-gui/pnpm-lock.yaml', 'mise.lock') }}\",\"path\":\".cache/pnpm/\"},\"uv\":{\"key\":\"ci-v5-uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}-${{ hashFiles('uv.lock', 'mise.lock') }}\",\"path\":\".cache/uv/\"}}"
        bootstrap: "[\"python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-packages\"]"
    - id: crates
      uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
      if: env.CARGO_REGISTRY_TOKEN == ''
    - name: Show Trusted Publishing Identity
      run: >-
        mise exec -- uv run --locked --project tools/python python -m
        dokime_tools.release.run identity
    - name: Verify Target Commit Required CI
      shell: python
      run: |-
        import runpy
        runpy.run_path('.github/actions/review-release/checks.py', run_name='__main__')
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TARGET_SHA: ${{ needs.mode.outputs.sha }}
    - run: mise run release:tag
      env:
        RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        GITHUB_TOKEN: ${{ github.token }}
        CARGO_REGISTRY_TOKEN: >-
          ${{ env.CARGO_REGISTRY_TOKEN != '' && env.CARGO_REGISTRY_TOKEN ||
          steps.crates.outputs.token }}
    - uses: ./.github/actions/save-caches
      if: >-
        success() && (github.ref == 'refs/heads/dev' && github.event_name !=
        'pull_request') && steps.setup.outputs.cargo_downloads-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
    - uses: ./.github/actions/save-caches
      if: >-
        success() && (github.ref == 'refs/heads/dev' && github.event_name !=
        'pull_request') && steps.setup.outputs.mise-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
        path: ${{ steps.setup.outputs.mise-path }}
    - uses: ./.github/actions/save-caches
      if: >-
        success() && (github.ref == 'refs/heads/dev' && github.event_name !=
        'pull_request') && steps.setup.outputs.pnpm-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.pnpm-cache-primary-key }}
        path: ${{ steps.setup.outputs.pnpm-path }}
    - uses: ./.github/actions/save-caches
      if: >-
        success() && (github.ref == 'refs/heads/dev' && github.event_name !=
        'pull_request') && steps.setup.outputs.uv-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
        path: ${{ steps.setup.outputs.uv-path }}
    - name: Cache Summary
      if: always()
      env:
        CACHE_RESTORES: "{\"Mise\":\"${{ steps.setup.outputs.mise-cache-hit == 'true' && 'Exact Hit' || steps.setup.outputs.mise-cache-hit == 'false' && 'Partial Hit' || steps.setup.outputs.mise-outcome == 'success' && 'Miss' || 'Unavailable' }}\",\"Cargo\":\"${{ steps.setup.outputs.cargo_downloads-cache-hit == 'true' && 'Exact Hit' || steps.setup.outputs.cargo_downloads-cache-hit == 'false' && 'Partial Hit' || steps.setup.outputs.cargo_downloads-outcome == 'success' && 'Miss' || 'Unavailable' }}\",\"UV\":\"${{ steps.setup.outputs.uv-cache-hit == 'true' && 'Exact Hit' || steps.setup.outputs.uv-cache-hit == 'false' && 'Partial Hit' || steps.setup.outputs.uv-outcome == 'success' && 'Miss' || 'Unavailable' }}\",\"PNPM\":\"${{ steps.setup.outputs.pnpm-cache-hit == 'true' && 'Exact Hit' || steps.setup.outputs.pnpm-cache-hit == 'false' && 'Partial Hit' || steps.setup.outputs.pnpm-outcome == 'success' && 'Miss' || 'Unavailable' }}\"}"
      uses: ./.github/actions/save-caches
      with:
        summary-module: ""
    env:
      MISE_ENABLE_TOOLS: go,node,powershell,python,rust,pnpm,uv,git-cliff,minisign,github:rust-secure-code/cargo-auditable,github:EmbarkStudios/cargo-about,github:CycloneDX/cyclonedx-rust-cargo,aqua:anchore/syft
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      PROFILE: ${{ needs.validated.outputs.review_profile }}
      RELEASE_BUILD_RUN_ID: ${{ needs.validated.outputs.review_run }}
      RELEASE_BUILD_SHA: ${{ needs.validated.outputs.review_sha }}
      RELEASE_BUILD_VERSION: ${{ needs.validated.outputs.review_version }}
    if: >-
      always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result,
      'cancelled') && needs.mode.outputs.mode == 'tag'
    environment: release
    permissions:
      checks: read
      contents: read
      actions: read
      id-token: write
    concurrency:
      group: release-tag
      cancel-in-progress: false
    needs:
    - mode
    - validated
  publish:
    name: Release / Publish
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - name: Configure Checkout Git
      run: git config --global core.longpaths true
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
        cache-backend: disk
        cache-mode: >-
          ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' &&
          github.ref == 'refs/heads/dev')) && 'READ_WRITE' || 'READ_ONLY' }}
        caches: "{\"cargo_downloads\":{\"key\":\"ci-v5-cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}\",\"path\":\".cache/cargo/registry/\\n.cache/cargo/git/\"},\"mise\":{\"key\":\"ci-v5-mise-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}-<RUNNER_IMAGE_ID>-${{ env.JOB_IMAGE_ID }}-<MISE_ROOT_ID>-<WORKSPACE_ROOT_ID>-${{ hashFiles('mise.lock') }}\",\"path\":\"<MISE_DATA_DIR>\"},\"pnpm\":{\"key\":\"ci-v5-pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}-${{ hashFiles('crates/dokime-gui/pnpm-lock.yaml', 'mise.lock') }}\",\"path\":\".cache/pnpm/\"},\"sccache\":{\"key\":\"ci-v5-sccache-${{ runner.os }}-${{ runner.arch }}-${{ env.PROFILE }}-${{ hashFiles('mise.lock') }}-${{ hashFiles('Cargo.lock') }}\",\"path\":\".cache/sccache/\",\"restore-keys\":\"ci-v5-sccache-${{ runner.os }}-${{ runner.arch }}-${{ env.PROFILE }}-${{ hashFiles('mise.lock') }}-\"},\"uv\":{\"key\":\"ci-v5-uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}-${{ hashFiles('uv.lock', 'mise.lock') }}\",\"path\":\".cache/uv/\"}}"
        bootstrap: "[]"
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: package-${{ env.PROFILE }}-python-unix
        path: target/ci
        run-id: ${{ needs.validated.outputs.review_run }}
        github-token: ${{ github.token }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: package-${{ env.PROFILE }}-python-windows
        path: target/ci
        run-id: ${{ needs.validated.outputs.review_run }}
        github-token: ${{ github.token }}
    - name: Extract package:python / package
      uses: ./.github/actions/extract-build
      with:
        command: '["mise","exec","--","uv","run","--locked","--project","tools/python","python","-m","dokime_tools.ci.artifacts","extract","--archive","target/ci/package-${{
          env.PROFILE }}-python-unix.tar.zst","--profile","${{ env.PROFILE }}"]'
    - name: Extract package:python / package
      uses: ./.github/actions/extract-build
      with:
        command: '["mise","exec","--","uv","run","--locked","--project","tools/python","python","-m","dokime_tools.ci.artifacts","extract","--archive","target/ci/package-${{
          env.PROFILE }}-python-windows.tar.zst","--profile","${{ env.PROFILE }}"]'
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: package-${{ env.PROFILE }}-rust-unix
        path: target/ci
        run-id: ${{ needs.validated.outputs.review_run }}
        github-token: ${{ github.token }}
    - name: Extract package:rust / package
      uses: ./.github/actions/extract-build
      with:
        command: "[\"mise\",\"exec\",\"--\",\"uv\",\"run\",\"--locked\",\"--project\",\"tools/python\",\"python\",\"-m\",\"dokime_tools.ci.artifacts\",\"extract\",\"--archive\",\"target/ci/package-${{ env.PROFILE }}-rust-unix.tar.zst\",\"--profile\",\"${{ env.PROFILE }}\"]"
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: package-${{ env.PROFILE }}-rust-windows
        path: target/ci
        run-id: ${{ github.run_id }}
        github-token: ${{ github.token }}
    - name: Extract package:rust / package
      uses: ./.github/actions/extract-build
      with:
        command: "[\"mise\",\"exec\",\"--\",\"uv\",\"run\",\"--locked\",\"--project\",\"tools/python\",\"python\",\"-m\",\"dokime_tools.ci.artifacts\",\"extract\",\"--archive\",\"target/ci/package-${{ env.PROFILE }}-rust-windows.tar.zst\",\"--profile\",\"${{ env.PROFILE }}\"]"
    - name: Verify Target Commit Required CI
      shell: python
      run: |-
        import runpy
        runpy.run_path('.github/actions/review-release/checks.py', run_name='__main__')
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TARGET_SHA: ${{ github.sha }}
    - name: Show Trusted Publishing Identity
      run: >-
        mise exec -- uv run --locked --project tools/python python -m
        dokime_tools.release.run identity
    - run: >-
        mise exec -- uv run --locked --project tools/python python -m
        dokime_tools.ci.build
      env:
        GH_TOKEN: ${{ github.token }}
        BUILD_SCRIPT: mise run release:publish
      # Staging reads matching notices from both extracted Rust distribution ZIPs.
    - name: Share Release Manifest
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: release-manifest
        path: target/release-assets/upload.json
        if-no-files-found: error
        retention-days: 7
    - name: Attest Installer, CLI, Sidecar and Wheel Digests
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
      with:
        subject-checksums: target/release-assets/any/SHA256SUMS
    - uses: ./.github/actions/save-caches
      if: >-
        success() && (github.ref == 'refs/heads/dev' && github.event_name !=
        'pull_request') && steps.setup.outputs.cargo_downloads-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
    - uses: ./.github/actions/save-caches
      if: >-
        success() && (github.ref == 'refs/heads/dev' && github.event_name !=
        'pull_request') && steps.setup.outputs.mise-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
        path: ${{ steps.setup.outputs.mise-path }}
    - uses: ./.github/actions/save-caches
      if: >-
        success() && (github.ref == 'refs/heads/dev' && github.event_name !=
        'pull_request') && steps.setup.outputs.pnpm-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.pnpm-cache-primary-key }}
        path: ${{ steps.setup.outputs.pnpm-path }}
    - uses: ./.github/actions/save-caches
      if: >-
        success() && (github.ref == 'refs/heads/dev' && github.event_name !=
        'pull_request') && steps.setup.outputs.uv-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
        path: ${{ steps.setup.outputs.uv-path }}
    - name: Cache Summary
      if: always()
      env:
        CACHE_RESTORES: "{\"Mise\":\"${{ steps.setup.outputs.mise-cache-hit == 'true' && 'Exact Hit' || steps.setup.outputs.mise-cache-hit == 'false' && 'Partial Hit' || steps.setup.outputs.mise-outcome == 'success' && 'Miss' || 'Unavailable' }}\",\"Cargo\":\"${{ steps.setup.outputs.cargo_downloads-cache-hit == 'true' && 'Exact Hit' || steps.setup.outputs.cargo_downloads-cache-hit == 'false' && 'Partial Hit' || steps.setup.outputs.cargo_downloads-outcome == 'success' && 'Miss' || 'Unavailable' }}\",\"UV\":\"${{ steps.setup.outputs.uv-cache-hit == 'true' && 'Exact Hit' || steps.setup.outputs.uv-cache-hit == 'false' && 'Partial Hit' || steps.setup.outputs.uv-outcome == 'success' && 'Miss' || 'Unavailable' }}\",\"PNPM\":\"${{ steps.setup.outputs.pnpm-cache-hit == 'true' && 'Exact Hit' || steps.setup.outputs.pnpm-cache-hit == 'false' && 'Partial Hit' || steps.setup.outputs.pnpm-outcome == 'success' && 'Miss' || 'Unavailable' }}\",\"Compiler\":\"${{ steps.setup.outputs.sccache-cache-hit == 'true' && 'Exact Hit' || steps.setup.outputs.sccache-cache-hit == 'false' && 'Partial Hit' || steps.setup.outputs.sccache-outcome == 'success' && 'Miss' || 'Unavailable' }}\"}"
      uses: ./.github/actions/save-caches
      with:
        summary-module: ""
    env:
      MISE_ENABLE_TOOLS: git-cliff,go,minisign,node,pnpm,powershell,python,rust,sccache,uv,github:rust-secure-code/cargo-auditable,github:EmbarkStudios/cargo-about,github:CycloneDX/cyclonedx-rust-cargo,aqua:anchore/syft
      COMPILER_CACHE_BACKEND: disk
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      SCCACHE_CACHE_SIZE: 8G
      COMPILER_CACHE_MODE: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/dev')) && 'READ_WRITE'
        || 'READ_ONLY' }}
      PROFILE: ${{ needs.validated.outputs.review_profile }}
      RELEASE_BUILD_RUN_ID: ${{ needs.validated.outputs.review_run }}
      RELEASE_BUILD_SHA: ${{ needs.validated.outputs.review_sha }}
      RELEASE_BUILD_VERSION: ${{ needs.validated.outputs.review_version }}
    if: >-
      always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result,
      'cancelled') && (startsWith(github.ref, 'refs/tags/v'))
    environment: release
    permissions:
      checks: read
      contents: write
      actions: read
      id-token: write
      attestations: write
    concurrency:
      group: release-publication
      cancel-in-progress: false
    needs:
    - package_signing_windows_rust
    - validated
  validated:
    name: Review / Release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - name: Configure Checkout Git
      run: git config --global core.longpaths true
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        ref: >-
          ${{ needs.mode.outputs.sha || github.sha }}
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
        cache-backend: ""
        cache-mode: ""
        caches: "{}"
        bootstrap: "[]"
    - id: review
      uses: ./.github/actions/review-release
      env:
        GH_TOKEN: ${{ github.token }}
