name: Release
run-name: ${{ github.event_name == 'workflow_dispatch' && 'Release / Preparation' || github.event_name == 'push' && 'Release / Publication' || 'Release / Tagging'
  }}
'on':
  workflow_dispatch: {}
  workflow_run:
    workflows: [CI]
    types: [completed]
  push:
    tags:
    - v*
    - '!v*-dev.*'
permissions:
  contents: read
env:
  PROFILE: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.head_ref, 'release/v')) && 'release' || 'dev' }}
  MISE_LOCKED: '1'
  MISE_EXPERIMENTAL: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo
  pnpm_config_store_dir: ${{ github.workspace }}/.cache/pnpm
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: 'true'
jobs:
  mode:
    name: Release / Mode
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      sha: ${{ steps.mode.outputs.sha }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: ./.github/actions/setup
      with:
        platform: unix
        cache-backend: ''
        cache-mode: ''
        bootstrap: '[]'
    - id: mode
      run: mise run ci:release-mode --
      env:
        GH_TOKEN: ${{ github.token }}
    env:
      MISE_ENABLE_TOOLS: python,uv,node,pnpm
    permissions:
      contents: read
      pull-requests: read
  prepare:
    name: Release / Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
        cache-backend: ''
        cache-mode: ''
        bootstrap: '[]'
    - run: mise run release:prepare --
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.cargo_downloads-cache-hit != 'true' && steps.setup.outputs.cargo_downloads-path
        != ''
      with:
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.mise-cache-hit != 'true' && steps.setup.outputs.mise-path
        != ''
      with:
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
        path: ${{ steps.setup.outputs.mise-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.pnpm-cache-hit != 'true' && steps.setup.outputs.pnpm-path
        != ''
      with:
        key: ${{ steps.setup.outputs.pnpm-cache-primary-key }}
        path: ${{ steps.setup.outputs.pnpm-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.uv-cache-hit != 'true' && steps.setup.outputs.uv-path
        != ''
      with:
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
        path: ${{ steps.setup.outputs.uv-path }}
    env:
      MISE_ENABLE_TOOLS: aqua:anchore/syft,git-cliff,github:CycloneDX/cyclonedx-rust-cargo,github:EmbarkStudios/cargo-about,github:rust-secure-code/cargo-auditable,go,minisign,node,pnpm,powershell,python,rust,uv
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      CRATES_BOOTSTRAP_AVAILABLE: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
      CI_TRANSPORT: 'true'
      RELEASE_PROFILE: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.head_ref, 'release/v')) && 'release' || 'dev' }}
      RELEASE_TARGET_SHA: ''
      GITHUB_RUNNER_WORKFLOWS: '{"ci.yml":{"unix":{"small":"ubuntu-latest","large":"ubuntu-latest"},"windows":{"small":"windows-latest","large":"windows-latest"},"nightly":{"small":"ubuntu-latest","coverage":"ubuntu-latest"}},"release.yml":{"unix":{"small":"ubuntu-latest","large":"ubuntu-latest"},"windows":{"small":"windows-latest","large":"windows-latest"},"nightly":{"small":"ubuntu-latest","coverage":"ubuntu-latest"}}}'
      RUNNER_GROUP_READ_TOKEN: ${{ secrets.RUNNER_GROUP_READ_TOKEN || github.token }}
    environment: release
    permissions:
      contents: read
    needs: [mode]
    if: needs.mode.outputs.mode == 'prepare'
  tag:
    name: Release / Tag
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ needs.mode.outputs.sha }}
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
        cache-backend: ''
        cache-mode: ''
        bootstrap: '["python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-packages"]'
    - id: crates
      uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
      if: env.CARGO_REGISTRY_TOKEN == ''
    - run: mise run release:tag --
      env:
        RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        GITHUB_TOKEN: ${{ github.token }}
        CARGO_REGISTRY_TOKEN: ${{ env.CARGO_REGISTRY_TOKEN != '' && env.CARGO_REGISTRY_TOKEN || steps.crates.outputs.token }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.cargo_downloads-cache-hit != 'true' && steps.setup.outputs.cargo_downloads-path
        != ''
      with:
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.mise-cache-hit != 'true' && steps.setup.outputs.mise-path
        != ''
      with:
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
        path: ${{ steps.setup.outputs.mise-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.pnpm-cache-hit != 'true' && steps.setup.outputs.pnpm-path
        != ''
      with:
        key: ${{ steps.setup.outputs.pnpm-cache-primary-key }}
        path: ${{ steps.setup.outputs.pnpm-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.uv-cache-hit != 'true' && steps.setup.outputs.uv-path
        != ''
      with:
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
        path: ${{ steps.setup.outputs.uv-path }}
    env:
      MISE_ENABLE_TOOLS: aqua:anchore/syft,git-cliff,github:CycloneDX/cyclonedx-rust-cargo,github:EmbarkStudios/cargo-about,github:rust-secure-code/cargo-auditable,go,minisign,node,pnpm,powershell,python,rust,uv
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      PROFILE: ${{ needs.validated.outputs.review_profile }}
      RELEASE_BUILD_RUN_ID: ${{ needs.validated.outputs.review_run }}
      RELEASE_BUILD_SHA: ${{ needs.validated.outputs.review_sha }}
      RELEASE_BUILD_VERSION: ${{ needs.validated.outputs.review_version }}
      CI_TRANSPORT: 'true'
      RELEASE_PROFILE: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.head_ref, 'release/v')) && 'release' || 'dev' }}
      RELEASE_TARGET_SHA: ${{ needs.mode.outputs.sha }}
      CI_READ_TOKEN: ${{ github.token }}
    environment: release
    permissions:
      checks: read
      contents: read
      actions: read
      id-token: write
    needs:
    - mode
    - validated
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && needs.mode.outputs.mode == 'tag'
    concurrency:
      group: release-tag
      cancel-in-progress: false
  publish:
    name: Release / Publish
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
        cache-backend: disk
        cache-mode: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/dev')) && 'READ_WRITE' || 'READ_ONLY' }}
        bootstrap: '[]'
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: package-${{ env.PROFILE }}-python-unix
        path: target/ci
        run-id: ${{ needs.validated.outputs.review_run }}
        github-token: ${{ github.token }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: package-${{ env.PROFILE }}-python-windows
        path: target/ci
        run-id: ${{ needs.validated.outputs.review_run }}
        github-token: ${{ github.token }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: package-${{ env.PROFILE }}-rust-unix
        path: target/ci
        run-id: ${{ needs.validated.outputs.review_run }}
        github-token: ${{ github.token }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: package-${{ env.PROFILE }}-rust-windows
        path: target/ci
        run-id: ${{ github.run_id }}
        github-token: ${{ github.token }}
    - run: mise run release:publish --
    - name: Share Release Manifest
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: release-manifest
        path: target/release-assets/upload.json
        if-no-files-found: error
        retention-days: 7
      if: success()
    - name: Attest Installer, CLI, Sidecar and Wheel Digests
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
      with:
        subject-checksums: target/release-assets/any/SHA256SUMS
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.cargo_downloads-cache-hit != 'true' && steps.setup.outputs.cargo_downloads-path
        != ''
      with:
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.mise-cache-hit != 'true' && steps.setup.outputs.mise-path
        != ''
      with:
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
        path: ${{ steps.setup.outputs.mise-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.pnpm-cache-hit != 'true' && steps.setup.outputs.pnpm-path
        != ''
      with:
        key: ${{ steps.setup.outputs.pnpm-cache-primary-key }}
        path: ${{ steps.setup.outputs.pnpm-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.uv-cache-hit != 'true' && steps.setup.outputs.uv-path
        != ''
      with:
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
        path: ${{ steps.setup.outputs.uv-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.sccache-cache-hit != 'true' && steps.setup.outputs.sccache-path
        != ''
      with:
        path: ${{ steps.setup.outputs.sccache-path }}
        key: ${{ steps.setup.outputs.sccache-cache-primary-key }}
    env:
      MISE_ENABLE_TOOLS: aqua:anchore/syft,git-cliff,github:CycloneDX/cyclonedx-rust-cargo,github:EmbarkStudios/cargo-about,github:rust-secure-code/cargo-auditable,go,minisign,node,pnpm,powershell,python,rust,sccache,uv
      COMPILER_CACHE_BACKEND: disk
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      SCCACHE_CACHE_SIZE: 8G
      COMPILER_CACHE_MODE: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/dev')) && 'READ_WRITE' || 'READ_ONLY'
        }}
      PROFILE: ${{ needs.validated.outputs.review_profile }}
      RELEASE_BUILD_RUN_ID: ${{ needs.validated.outputs.review_run }}
      RELEASE_BUILD_SHA: ${{ needs.validated.outputs.review_sha }}
      RELEASE_BUILD_VERSION: ${{ needs.validated.outputs.review_version }}
      CI_TRANSPORT: 'true'
      RELEASE_PROFILE: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.head_ref, 'release/v')) && 'release' || 'dev' }}
      RELEASE_TARGET_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      CI_READ_TOKEN: ${{ github.token }}
    environment: release
    permissions:
      checks: read
      contents: write
      actions: read
      id-token: write
      attestations: write
    needs:
    - package_signing_windows_rust
    - validated
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && (startsWith(github.ref, 'refs/tags/v'))
    concurrency:
      group: release-publication
      cancel-in-progress: false
  validated:
    name: Review / Release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        ref: ${{ needs.mode.outputs.sha || github.sha }}
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
        cache-backend: ''
        cache-mode: ''
        bootstrap: '[]'
    - run: mise run ci:review --
      id: review
      env:
        GH_TOKEN: ${{ github.token }}
        REVIEW_RELEASE: 'true'
        REVIEW_PACKAGES: '["package-PROFILE-python-unix","package-PROFILE-python-windows","package-PROFILE-rust-unix","package-PROFILE-rust-windows"]'
        REVIEW_BUILDS: '["build-cli-PROFILE-windows","build-generator-PROFILE-windows","build-gui-PROFILE-windows","build-packaging-PROFILE-windows","build-plugins-PROFILE-windows"]'
        REVIEW_REQUIRED: 'true'
    permissions:
      contents: read
      pull-requests: read
      actions: read
    env:
      MISE_ENABLE_TOOLS: aqua:anchore/syft,github:CycloneDX/cyclonedx-rust-cargo,github:EmbarkStudios/cargo-about,github:rust-secure-code/cargo-auditable,node,pnpm,python,uv
      CI_TRANSPORT: 'true'
      RELEASE_TARGET_SHA: ''
    needs: [mode]
    if: always() && (needs.mode.outputs.mode == 'tag' || startsWith(github.ref, 'refs/tags/v'))
    outputs:
      validated: ${{ steps.review.outputs.validated }}
      review_run: ${{ steps.review.outputs.review_run }}
      review_profile: ${{ steps.review.outputs.review_profile }}
      review_sha: ${{ steps.review.outputs.review_sha }}
      review_version: ${{ steps.review.outputs.review_version }}
      stable_release: ${{ steps.review.outputs.stable_release }}
  verify:
    name: Release / Verify (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.minutes }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
        cache-backend: ''
        cache-mode: ''
        bootstrap: '[]'
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: package-${{ env.PROFILE }}-python-unix
        path: target/ci
        run-id: ${{ needs.validated.outputs.review_run }}
        github-token: ${{ github.token }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: package-${{ env.PROFILE }}-python-windows
        path: target/ci
        run-id: ${{ needs.validated.outputs.review_run }}
        github-token: ${{ github.token }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: package-${{ env.PROFILE }}-rust-${{ matrix.platform }}
        path: target/ci
        run-id: ${{ matrix.platform == 'windows' && github.run_id || needs.validated.outputs.review_run }}
        github-token: ${{ github.token }}
    - name: Download Release Manifest
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: release-manifest
        path: target/release-assets
        run-id: ${{ github.run_id }}
        github-token: ${{ github.token }}
    - run: mise run release:verify --
      env:
        GH_TOKEN: ${{ github.token }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.cargo_downloads-cache-hit != 'true' && steps.setup.outputs.cargo_downloads-path
        != ''
      with:
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.mise-cache-hit != 'true' && steps.setup.outputs.mise-path
        != ''
      with:
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
        path: ${{ steps.setup.outputs.mise-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.pnpm-cache-hit != 'true' && steps.setup.outputs.pnpm-path
        != ''
      with:
        key: ${{ steps.setup.outputs.pnpm-cache-primary-key }}
        path: ${{ steps.setup.outputs.pnpm-path }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: success() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && steps.setup.outputs.uv-cache-hit != 'true' && steps.setup.outputs.uv-path
        != ''
      with:
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
        path: ${{ steps.setup.outputs.uv-path }}
    env:
      MISE_ENABLE_TOOLS: aqua:anchore/syft,git-cliff,github:CycloneDX/cyclonedx-rust-cargo,github:EmbarkStudios/cargo-about,github:rust-secure-code/cargo-auditable,go,minisign,node,pnpm,powershell,python,rust,uv
      PROFILE: ${{ needs.validated.outputs.review_profile }}
      RELEASE_BUILD_RUN_ID: ${{ needs.validated.outputs.review_run }}
      RELEASE_BUILD_SHA: ${{ needs.validated.outputs.review_sha }}
      RELEASE_BUILD_VERSION: ${{ needs.validated.outputs.review_version }}
      CI_TRANSPORT: 'true'
      RELEASE_PROFILE: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.head_ref, 'release/v')) && 'release' || 'dev' }}
      RELEASE_TARGET_SHA: ''
    environment: release
    needs:
    - publish
    - validated
    - package_signing_windows_rust
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: unix
          runner: ubuntu-latest
          minutes: 120
          inputs: ''
        - platform: windows
          runner: windows-latest
          minutes: 120
          inputs: ''
    if: (always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && (startsWith(github.ref, 'refs/tags/v')))
  sign_product:
    name: Sign / Product (Windows)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.minutes }}
    needs:
    - validated
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
        cache-backend: ''
        cache-mode: ''
        bootstrap: '[]'
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: build-cli-${{ env.PROFILE }}-${{ matrix.platform }}
        path: target/ci
        run-id: ${{ needs.validated.outputs.review_run }}
        github-token: ${{ github.token }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: build-generator-${{ env.PROFILE }}-${{ matrix.platform }}
        path: target/ci
        run-id: ${{ needs.validated.outputs.review_run }}
        github-token: ${{ github.token }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: build-gui-${{ env.PROFILE }}-${{ matrix.platform }}
        path: target/ci
        run-id: ${{ needs.validated.outputs.review_run }}
        github-token: ${{ github.token }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: build-packaging-${{ env.PROFILE }}-${{ matrix.platform }}
        path: target/ci
        run-id: ${{ needs.validated.outputs.review_run }}
        github-token: ${{ github.token }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: build-plugins-${{ env.PROFILE }}-${{ matrix.platform }}
        path: target/ci
        run-id: ${{ needs.validated.outputs.review_run }}
        github-token: ${{ github.token }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
