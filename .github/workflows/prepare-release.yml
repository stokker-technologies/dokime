name: Prepare Release
"on":
  workflow_dispatch:
    inputs:
      version:
        description: Release Version
        required: true
        type: string
permissions:
  contents: write
  actions: write
env:
  MISE_LOCKED: "1"
  CARGO_INCREMENTAL: "0"
  MISE_DATA_DIR: ${{ github.workspace }}/.cache/mise
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo
  npm_config_store_dir: ${{ github.workspace }}/.cache/pnpm
