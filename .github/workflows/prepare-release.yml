name: Prepare Release
"on":
  workflow_dispatch:
    inputs:
      version:
        description: Release Version
        required: true
        type: string
permissions:
  contents: write
env:
  MISE_LOCKED: "1"
  CARGO_INCREMENTAL: "0"
  MISE_DATA_DIR: ${{ github.workspace }}/.cache/mise
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo
  npm_config_store_dir: ${{ github.workspace }}/.cache/pnpm
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
jobs:
  prepare:
    name: Publish / Prepare
    runs-on:
    - ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      id: tools
      with:
        path: .cache/mise/
        key: ${{ runner.os }}-${{ runner.arch }}-mise-${{ hashFiles('mise.lock') }}
    - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      env:
        TEMP: ${{ runner.temp }}
        TMP: ${{ runner.temp }}
      with:
        install: true
        cache: false
        mise_dir: ${{ github.workspace }}/.cache/mise
    - run: sudo apt-get update
    - run: >-
        sudo apt-get install -y --no-install-recommends build-essential pkg-config
        libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev
        libjavascriptcoregtk-4.1-dev librsvg2-dev libasound2-dev linux-libc-dev libclang-dev webkit2gtk-driver
        xvfb desktop-file-utils xdg-utils
    - run: Xvfb :99 -screen 0 1920x1080x24 >/dev/null 2>&1 &
    - run: echo DISPLAY=:99 >> "$GITHUB_ENV"
    - name: Check Runner Group Allowlist
      run: >-
        mise exec -- uv run --locked --project tools/python python -m
        dokime_tools.test.runners
      env:
        GITHUB_RUNNER_WORKFLOWS: "{\"ci.yml\":[[\"self-hosted\",\"linux\"]]}"
        RELEASE_VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ secrets.RUNNER_GROUP_READ_TOKEN || github.token }}
    - run: git switch -c "release/v${{ inputs.version }}"
    - run: mise run release:prepare
    - run: "git -c user.name=\"${{ github.actor }}\" -c user.email=\"${{ github.actor }}@users.noreply.github.com\" commit -am \"chore: prepare release v${{ inputs.version }}\""
    - run: git push origin "release/v${{ inputs.version }}"
