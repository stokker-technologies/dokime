jobs:
  prepare:
    name: Publish / Prepare
    runs-on:
    - ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      id: tools
      with:
        path: .cache/mise/
        key: ${{ runner.os }}-${{ runner.arch }}-mise-${{ hashFiles('mise.lock') }}
    - run: sudo apt-get update
    - run: >-
        sudo apt-get install -y --no-install-recommends build-essential pkg-config
        libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev
