name: Prepare Release
"on":
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write
env:
  MISE_LOCKED: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo
  npm_config_store_dir: ${{ github.workspace }}/.cache/pnpm
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
jobs:
  prepare:
    name: Publish / Prepare
    runs-on:
    - ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Resolve Mise Directory
      if: runner.os == 'Windows'
      shell: pwsh
      run: |-
        $directory = Join-Path ([System.IO.Path]::GetTempPath()) 'stkr-mise'
        "MISE_DATA_DIR=$directory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    - name: Resolve Mise Directory
      if: runner.os != 'Windows'
      shell: bash
      run: printf 'MISE_DATA_DIR=%s/stkr-mise\n' "${TMPDIR:-/tmp}" >> "$GITHUB_ENV"
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      id: tools
      with:
        path: ${{ env.MISE_DATA_DIR }}
        key: ${{ runner.os }}-${{ runner.arch }}-mise-v2-${{ hashFiles('mise.lock') }}
    - run: sudo apt-get update
    - run: >-
        sudo apt-get install -y --no-install-recommends build-essential pkg-config
        libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev
        libjavascriptcoregtk-4.1-dev librsvg2-dev libasound2-dev linux-libc-dev libclang-dev webkit2gtk-driver
        xvfb desktop-file-utils xdg-utils rpm
    - run: Xvfb :99 -screen 0 1920x1080x24 >/dev/null 2>&1 &
    - run: echo DISPLAY=:99 >> "$GITHUB_ENV"
    - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      env:
        RUSTC_WRAPPER: ""
      with:
        install: true
        cache: false
        mise_dir: ${{ env.MISE_DATA_DIR }}
    - name: Select Release Version
      shell: bash
      run: |-
        version="$(mise exec -- git-cliff --bump patch --bumped-version --use-branch-tags)"
        printf 'RELEASE_VERSION=%s\n' "${version#v}" >> "$GITHUB_ENV"
    - run: git switch -c "release/v$RELEASE_VERSION"
    - run: mise run release:prepare
    - run: >-
        mise exec -- uv run --locked --project tools/python python -m
        dokime_tools.release.run author
    if: github.ref == 'refs/heads/dev'
    env:
      GH_TOKEN: ${{ github.token }}
      MISE_ENABLE_TOOLS: node,python,rust,pnpm,uv,gh,git-cliff,glab,minisign
