name: Prepare Release
"on":
  workflow_dispatch:
    inputs:
      version:
        description: Release Version
        required: true
        type: string
permissions:
  contents: write
env:
  MISE_LOCKED: "1"
  MISE_DATA_DIR: ${{ github.workspace }}/.cache/mise
  CARGO_TERM_COLOR: always
jobs:
  release_prepare:
    name: Release / Prepare
    runs-on:
    - ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      id: tools
      with:
        path: .cache/mise/
        key: ${{ runner.os }}-${{ runner.arch }}-mise-${{ hashFiles('mise.lock') }}
    - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      with:
        install: true
        cache: false
        mise_dir: ${{ github.workspace }}/.cache/mise
    - run: sudo apt-get update
    - run: >-
        sudo apt-get install -y --no-install-recommends build-essential pkg-config
        libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev
        libjavascriptcoregtk-4.1-dev librsvg2-dev libasound2-dev linux-libc-dev libclang-dev webkit2gtk-driver
        xvfb
    - run: Xvfb :99 -screen 0 1920x1080x24 >/dev/null 2>&1 &
    - run: echo DISPLAY=:99 >> "$GITHUB_ENV"
    - run: git switch -c "release/v${{ inputs.version }}"
    - run: mise run release:prepare
    - run: "git -c user.name=\"${{ github.actor }}\" -c user.email=\"${{ github.actor }}@users.noreply.github.com\" commit -am \"chore: prepare release v${{ inputs.version }}\""
    - run: git push origin "release/v${{ inputs.version }}"
    env:
      MISE_ENABLE_TOOLS: node,python,rust,pnpm,npm:pnpm,uv,git-cliff,gh,aqua:jedisct1/minisign
