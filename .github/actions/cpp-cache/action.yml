name: C++ Dependency Cache
description: Share ABI-Addressed vcpkg Binary Archives Across SDK Jobs
inputs:
  operation:
    description: Restore or Save the Binary Archives
    default: restore
  restored-key:
    description: Matched Key Returned by Restore
    default: ''
outputs:
  restored-key:
    description: Archive Set Actually Restored
    value: ${{ steps.restore.outputs.cache-matched-key }}
runs:
  using: composite
  steps:
  - name: Prepare Binary Archive Directory
    id: prepare
    if: always()
    shell: python
    run: |
      import os
      from pathlib import Path
      path = Path(os.environ['GITHUB_WORKSPACE']) / '.cache/vcpkg/archives'
      path.mkdir(parents=True, exist_ok=True)
      output = Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8')
      output.write(f'VCPKG_DEFAULT_BINARY_CACHE={path.as_posix()}\n')
      output.close()
      prefix = f"sdk-cpp-v2-{os.environ['RUNNER_OS']}-{os.environ['RUNNER_ARCH']}-{os.environ['RUNNER_IMAGE_ID']}-"
      output = Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8')
      output.write(f'prefix={prefix}\n')
      output.close()
  - name: Restore Binary Archives
    id: restore
    if: inputs.operation == 'restore'
    uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
    with:
      path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
      key: ${{ steps.prepare.outputs.prefix }}restore
      restore-keys: ${{ steps.prepare.outputs.prefix }}
  - name: Identify Binary Archive Set
    id: content
    if: always() && inputs.operation == 'save' && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
    shell: python
    env:
      CACHE_PREFIX: ${{ steps.prepare.outputs.prefix }}
    run: |
      import os
      from hashlib import sha256
      from pathlib import Path
      path = Path(os.environ['VCPKG_DEFAULT_BINARY_CACHE'])
      listing = sorted(file.relative_to(path).as_posix() for file in path.rglob('*') if file.is_file())
      if listing:
          digest = sha256('\n'.join(listing).encode('utf-8')).hexdigest()
          key = os.environ['CACHE_PREFIX'] + digest
          output = Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8')
          output.write(f'key={key}\n')
          output.close()
  - name: Save Binary Archives
    if: >-
      always() && inputs.operation == 'save' && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' &&
      steps.content.outputs.key != '' && steps.content.outputs.key != inputs.restored-key
    uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
    with:
      path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
      key: ${{ steps.content.outputs.key }}
