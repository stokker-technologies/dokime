# === Workspace === #

[workspace]
members = [
  "crates/dokime-gui/src-tauri",
  "crates/dokime-cli",
  "crates/dokime-client-internal",
  "crates/dokime-test-support",
  "crates/dokime-protocol",
  "crates/dokime-storage",
  "crates/dokime-operations",
  "crates/dokime-runtime",
  "crates/dokime-packaging",
  "plugins/sidecars/host",
  "plugins/sidecars/obc",
  "sdk/benches",
  "sdk/rust",
  "tools/protocol",
]
default-members = [
  "crates/dokime-gui/src-tauri",
  "crates/dokime-cli",
  "crates/dokime-runtime",
  "crates/dokime-storage",
  "crates/dokime-operations",
  "sdk/rust",
  "crates/dokime-protocol",
  "crates/dokime-packaging",
  "plugins/sidecars/host",
  "plugins/sidecars/obc",
]
resolver = "2"

# === Workspace Package === #

[workspace.package]
version = "0.1.5"
edition = "2024"
rust-version = "1.99"
description = "Dokime application and runtime packages."
license = "Apache-2.0"
publish = true
repository = "https://github.com/stokker-technologies/dokime"

# === Workspace Dependencies === #

[workspace.dependencies]
# Local
dokime-client-internal = { path = "crates/dokime-client-internal" }
dokime-operations = { version = "0.1.5", path = "crates/dokime-operations" }
dokime-packaging = { version = "0.1.5", path = "crates/dokime-packaging" }
dokime-protocol = { version = "0.1.5", path = "crates/dokime-protocol" }
dokime-runtime = { version = "0.1.5", path = "crates/dokime-runtime" }
dokime-storage = { version = "0.1.5", path = "crates/dokime-storage" }
dokime-test-support = { path = "crates/dokime-test-support" }

# Git
# Edit This Pin, Then Run mise run generate -- --protocol and mise run prepare:locks.
harmos = { version = "0.1.14", git = "https://github.com/stokker-technologies/harmos", rev = "5891eee43a4867cda7e8bedf66d7b8bf5fb4bf42" }
harmos-domain = { version = "0.1.14", git = "https://github.com/stokker-technologies/harmos", rev = "5891eee43a4867cda7e8bedf66d7b8bf5fb4bf42" }
harmos-operations = { version = "0.1.14", git = "https://github.com/stokker-technologies/harmos", rev = "5891eee43a4867cda7e8bedf66d7b8bf5fb4bf42" }
harmos-packaging = { version = "0.1.14", git = "https://github.com/stokker-technologies/harmos", rev = "5891eee43a4867cda7e8bedf66d7b8bf5fb4bf42" }
harmos-protocol = { version = "0.1.14", git = "https://github.com/stokker-technologies/harmos", rev = "5891eee43a4867cda7e8bedf66d7b8bf5fb4bf42" }
harmos-query = { version = "0.1.14", git = "https://github.com/stokker-technologies/harmos", rev = "5891eee43a4867cda7e8bedf66d7b8bf5fb4bf42" }
harmos-runtime = { version = "0.1.14", git = "https://github.com/stokker-technologies/harmos", rev = "5891eee43a4867cda7e8bedf66d7b8bf5fb4bf42" }
harmos-storage = { version = "0.1.14", git = "https://github.com/stokker-technologies/harmos", rev = "5891eee43a4867cda7e8bedf66d7b8bf5fb4bf42" }

# Error Handling
thiserror = { version = "2.0.21" }

# Logging
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "registry"] }

# Utilities
keyring = { version = "4.2.0" }
libc = { version = "0.2.191" }
num-bigint = { version = "0.5.1", features = ["serde"] }
num-traits = { version = "0.2.19" }
regex = { version = "1.13.1" }
semver = { version = "1.0.28" }
sha2 = { version = "0.11.1" }
spdx = { version = "0.13.5" }
starship-battery = { version = "0.12.0" }
sysinfo = { version = "0.40.0" }
time = { version = "0.3.55", features = ["formatting", "parsing"] }
uuid = { version = "1.28.0", features = ["v5", "v7", "serde"] }
windows = { version = "0.62.2" }
windows-sys = { version = "0.61.2" }
# Excludes the default Tokio integration; host D-Bus calls use the blocking API on async-io.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
zeroize = { version = "=1.9.1" }

# Serialization
arrow-array = { version = "=60.1.0" }
arrow-buffer = { version = "=60.1.0" }
arrow-ipc = { version = "=60.1.0", features = ["zstd"] }
arrow-schema = { version = "=60.1.0" }
arrow-select = { version = "=60.1.0" }
base64 = { version = "0.23.1" }
flatbuffers = { version = "25.12.19" }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
prost = { version = "0.14.4" }
prost-build = { version = "=0.14.4", default-features = false }
prost-reflect = { version = "0.16.5", features = ["serde"] }
prost-types = { version = "=0.14.4" }
protoc-bin-vendored = { version = "3.3.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154" }
toml = { version = "1.1.8" }
# Excludes every default compression and encryption backend; Dokime writes stored archives only.
zip = { version = "9.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Configuration
clap = { version = "4.6.7", features = ["derive"] }

# Filesystem
# Uses zlib-rs, the inflate backend shared with the ZIP reader.
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
ignore = { version = "0.4.33" }
tar = { version = "0.4.46" }
tempfile = { version = "3.27.0" }

# Parsing
heck = { version = "0.5.0" }
proc-macro-crate = { version = "3.5.0" }
proc-macro2 = { version = "1.0.107" }
quote = { version = "1.0.47" }
roxmltree = { version = "0.21.1" }
syn = { version = "3.0.9", features = ["extra-traits", "full"] }

# Concurrency

# Async
async-trait = { version = "0.1.92" }
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "=0.1.19" }
tokio-util = { version = "=0.7.20" }

# Networking
# Excludes the aws-lc-rs TLS, Prometheus metrics and proxy-protocol defaults; the test FTP server needs none of them.
# Excludes default TLS provider selection; Dokime installs ring before constructing HTTP clients.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
# Excludes the default aws-lc-rs provider; Dokime installs ring.
rustls = { version = "0.23.46", default-features = false }
tonic = { version = "=0.14.8" }
tonic-prost = { version = "0.14.8", default-features = false }
tonic-prost-build = { version = "=0.14.8", default-features = false }

# Storage
rusqlite = { version = "0.41.1", features = ["bundled", "limits"] }

# UI
# Excludes default image codecs; consumers select their required formats explicitly.
image = { version = "0.25.10", default-features = false }
tauri-bundler = { version = "2.10.4" }
tauri-utils = { version = "2.10.2" }
tauri-winres = { version = "0.3.6" }

# Testing
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
handlebars = { version = "6.4.4" }

# === Workspace Lints === #

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"

# === Lints === #

# === Profiles === #

# Keep Development Debug Archives Small While Retaining Workspace Source Locations.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The Stored Evidence Integrity Check Digests Every Row A Read Returns; Unoptimized,
# SHA-256 Alone Cost About 21 µs Per Row In Debug Test Builds.
[profile.dev.package.sha2]
opt-level = 3

# Evidence Archives Store Telemetry Files As-Is, So Their CRC-32 Covers Every Byte.
[profile.dev.package.crc32fast]
opt-level = 3

# Live Plots Decode Telemetry Chunks, Filter Their Rows and Rank Exact Medians Through These on Every Refresh.
[profile.dev.package.arrow-array]
opt-level = 3

[profile.dev.package.arrow-buffer]
opt-level = 3

[profile.dev.package.arrow-data]
opt-level = 3

[profile.dev.package.arrow-ipc]
opt-level = 3

[profile.dev.package.arrow-select]
opt-level = 3

[profile.dev.package.zstd-sys]
opt-level = 3

[profile.dev.package.harmos-domain]
opt-level = 3

[profile.dev.package.harmos-query]
opt-level = 3

[profile.dev.package.libsqlite3-sys]
opt-level = 3

# === Patches === #

# === Other === #
