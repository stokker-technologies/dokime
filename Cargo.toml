[workspace]
members = [
  "crates/dokime",
  "crates/dokime-client",
  "crates/dokime-contract",
  "crates/cargo-dokime",
  "crates/dokime-starter-check",
  "crates/dokime-packaging",
  "crates/dokime-cli",
  "crates/dokime-terminal",
  "crates/dokime-theme",
  "crates/dokime-gui/src-tauri",
  "crates/dokime-host",
  "crates/dokime-macros",
  "crates/dokime-app",
  "crates/dokime-server",
  "crates/dokime-filesystem",
  "plugins/mini",
  "crates/dokime-app/tests/fixtures/route_plugin",
  "plugins/mini/runtime",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Dokime application and runtime packages."
license = "Apache-2.0"
publish = true
repository = "https://github.com/stokker-technologies/dokime"

[workspace.dependencies]
# Git
harmos = { git = "https://github.com/stokker-technologies/harmos.git", rev = "a7dbbfecf707b4e9ef307aadc74cf6f4acddfed3", default-features = false }
harmos-contract = { git = "https://github.com/stokker-technologies/harmos.git", rev = "a7dbbfecf707b4e9ef307aadc74cf6f4acddfed3", default-features = false }
harmos-signal = { git = "https://github.com/stokker-technologies/harmos.git", rev = "a7dbbfecf707b4e9ef307aadc74cf6f4acddfed3", default-features = false }

# Error Handling
anyhow = { version = "1.0.104", default-features = false }
thiserror = { version = "2.0.21", default-features = false }

# Logging
tracing = { version = "0.1.44", default-features = false }
tracing-appender = { version = "0.2.5", default-features = false }
tracing-chrome = { version = "0.7.2", default-features = false }
tracing-error = { version = "0.2.1", default-features = false }
tracing-flame = { version = "0.2.0", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
  "env-filter",
  "fmt",
  "json",
  "registry",
] }

# Utilities
blake2 = { version = "0.11.0", default-features = false }
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
process-wrap = { version = "10.0.1", default-features = false }
rand = { version = "0.10.3", default-features = false }
regex = { version = "1.13.1", default-features = false }
semver = { version = "1.0.28", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
starship-battery = { version = "0.12.0", default-features = false }
subtle = { version = "=2.6.1", default-features = false }
sysinfo = { version = "0.39.6", default-features = false, features = [
  "component",
  "disk",
  "network",
  "system",
] }
time = { version = "0.3.55", default-features = false, features = ["formatting", "parsing"] }
uuid = { version = "1.28.0", default-features = false, features = ["v5", "v7", "serde"] }
windows = { version = "0.62.2", default-features = false }
windows-sys = { version = "0.61.2", default-features = false }
zeroize = { version = "=1.9.1", default-features = false }

# Serialization
arrow-array = { version = "60.0.0", default-features = false }
arrow-ipc = { version = "60.0.0", default-features = false }
arrow-schema = { version = "60.0.0", default-features = false }
arrow-select = { version = "60.0.0", default-features = false }
base64 = { version = "0.23.1", default-features = false }
hound = { version = "3.5.1", default-features = false }
image = { version = "0.25.10", default-features = false }
prost = { version = "0.14.4", default-features = false }
prost-build = { version = "=0.14.4", default-features = false }
prost-types = { version = "=0.14.4", default-features = false }
protoc-bin-vendored = { version = "=3.3.0", default-features = false }
schemars = { version = "1.2.2", default-features = false, features = ["derive"] }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde_arrow = { version = "0.15.1", default-features = false, features = ["arrow-60"] }
serde_json = { version = "1.0.154", default-features = false }
toml = { version = "1.1.8", default-features = false }
toml_edit = { version = "0.25.17", default-features = false }

# Configuration
clap = { version = "4.6.7", default-features = false, features = ["derive"] }
dotenv = { package = "dotenvy", version = "0.15.7", default-features = false }

# Filesystem
glob = { version = "0.3.4", default-features = false }
globset = { version = "0.4.20", default-features = false }
tar = { version = "=0.4.46", default-features = false }
tempfile = { version = "3.27.0", default-features = false }
walkdir = { version = "2.5.0", default-features = false }
zip = { version = "9.0.2", default-features = false }

# Parsing
cargo_metadata = { version = "0.23.1", default-features = false }
cssparser = { version = "0.38.0", default-features = false }
proc-macro-crate = { version = "3.5.0", default-features = false }
proc-macro2 = { version = "1.0.107", default-features = false }
quote = { version = "1.0.47", default-features = false }
syn = { version = "3.0.9", default-features = false, features = ["extra-traits", "full"] }

# Async
async-trait = { version = "0.1.92", default-features = false }
futures-util = { version = "0.3.34", default-features = false }
tokio = { version = "1.53.2", default-features = false, features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-stream = { version = "=0.1.19", default-features = false }
tokio-util = { version = "=0.7.20", default-features = false }

# Networking
getifs = { version = "0.7.0", default-features = false }
libunftp = { version = "0.23.1", default-features = false }
rcgen = { version = "0.14.10", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rustls = { version = "0.23.45", default-features = false }
rustls-platform-verifier = { version = "0.7.1", default-features = false }
suppaftp = { version = "12.0.0", default-features = false }
tonic = { version = "=0.14.6", default-features = false }
tonic-prost = { version = "=0.14.6", default-features = false }
tonic-prost-build = { version = "=0.14.6", default-features = false }
tonic-types = { version = "=0.14.6", default-features = false }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
unftp-core = { version = "0.1.0", default-features = false }
unftp-sbe-fs = { version = "0.4.0", default-features = false }
url = { version = "2.5.8", default-features = false }

# Storage
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "functions"] }

# UI
anstream = { version = "1.0.0", default-features = false }
anstyle = { version = "1.0.14", default-features = false }
ashpd = { version = "0.13.13", default-features = false }
cpal = { version = "0.18.2", default-features = false }
indicatif = { version = "0.18.6", default-features = false }
nokhwa = { version = "0.10.11", default-features = false }
portable-pty = { version = "0.9.0", default-features = false }
tauri = { version = "2.12.3", default-features = false }
tauri-build = { version = "2.7.2", default-features = false }
tauri-plugin-deep-link = { version = "2.6.1", default-features = false }
tauri-plugin-dialog = { version = "2.8.2", default-features = false }
tauri-plugin-opener = { version = "2.7.1", default-features = false }
tauri-plugin-updater = { version = "2.13.3", default-features = false }
xcap = { version = "0.9.8", default-features = false }

# Testing
criterion = { version = "0.8.2", default-features = false }

[profile.dev]
debug = 1

# Distribution applications, validation executables and native admission fixtures
# share the release profile. Instrumented coverage uses its isolated build inputs.
[profile.release]
debug = 0
incremental = false
codegen-units = 1
lto = "thin"
strip = "symbols"

# Development hosts inspect complete plugin executables during packaging and
# admission. Keep their byte scanners optimized without optimizing authored
# plugin code or disabling debug information across the workspace.
[profile.dev.package.harmos-contract]
opt-level = 2

[profile.dev.package.harmos-sidecar]
opt-level = 2

# Plugin packaging and admission hash complete executable images repeatedly.
# Match installed-tool hash throughput without optimizing authored plugin code.
[profile.dev.package.sha2]
opt-level = 3

# TEMPORARY fast-dev override: local Harmos worktree instead of the published pin.
# Remove before publication; sync:harmos re-pins the git revision.
[patch."https://github.com/stokker-technologies/harmos.git"]
harmos = { path = "../../harmos.wt/streamline/crates/harmos" }
harmos-bundle = { path = "../../harmos.wt/streamline/crates/harmos-bundle" }
harmos-contract = { path = "../../harmos.wt/streamline/crates/harmos-contract" }
harmos-macros = { path = "../../harmos.wt/streamline/crates/harmos-macros" }
harmos-sidecar = { path = "../../harmos.wt/streamline/crates/harmos-sidecar" }
harmos-signal = { path = "../../harmos.wt/streamline/crates/harmos-signal" }
