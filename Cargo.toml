# === Workspace === #

[workspace]
members = [
  "crates/dokime",
  "crates/dokime-cli",
  "crates/dokime-runtime",
  "crates/dokime-client",
  "crates/dokime-domain",
  "crates/dokime-operations",
  "crates/cargo-dokime",
  "crates/dokime-packaging",
  "crates/dokime-gui/src-tauri",
  "plugins/sidecars/host",
  "crates/dokime-macros",
  "crates/dokime-server",
  "plugins/sidecars/obc",
  "plugins/sidecars/obc/runtime",
]
resolver = "2"

# === Workspace Package === #

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.99"
description = "Dokime application and runtime packages."
license = "Apache-2.0"
publish = true
repository = "https://github.com/stokker-technologies/dokime"

# === Workspace Dependencies === #

[workspace.dependencies]
# Local
dokime = { version = "0.1.2", path = "crates/dokime" }
dokime-client = { version = "0.1.2", path = "crates/dokime-client" }
dokime-domain = { version = "0.1.2", path = "crates/dokime-domain" }
dokime-packaging = { version = "0.1.2", path = "crates/dokime-packaging" }
dokime-runtime = { version = "0.1.2", path = "crates/dokime-runtime", default-features = false }
dokime-server = { version = "0.1.2", path = "crates/dokime-server" }
plugin-host = { path = "plugins/sidecars/host", default-features = false }

# Git
harmos = { git = "https://github.com/stokker-technologies/harmos", rev = "4e2669fa03cf5a123aa62de1aad0f042fb5cb381" }
harmos-packaging = { git = "https://github.com/stokker-technologies/harmos", rev = "4e2669fa03cf5a123aa62de1aad0f042fb5cb381" }
harmos-sdk = { git = "https://github.com/stokker-technologies/harmos", rev = "4e2669fa03cf5a123aa62de1aad0f042fb5cb381" }

# Error Handling
thiserror = { version = "2.0.21" }

# Logging
tracing = { version = "0.1.44" }
tracing-appender = { version = "0.2.5" }
tracing-chrome = { version = "0.7.2" }
tracing-error = { version = "0.2.1" }
tracing-flame = { version = "0.2.0" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "registry"] }

# Utilities
keyring = { version = "4.2.0" }
keyring-core = { version = "=1.0.0" }
libc = { version = "0.2.190" }
process-wrap = { version = "10.0.1" }
rand = { version = "0.10.3" }
regex = { version = "1.13.1" }
semver = { version = "1.0.28" }
sha2 = { version = "0.11.1" }
starship-battery = { version = "0.12.0" }
subtle = { version = "=2.6.1" }
sysinfo = { version = "0.40.0" }
time = { version = "0.3.55", features = ["formatting", "parsing"] }
uuid = { version = "1.28.0", features = ["v5", "v7", "serde"] }
windows = { version = "0.62.2" }
windows-sys = { version = "0.61.2" }
zeroize = { version = "=1.9.1" }

# Serialization
arrow-array = { version = "=60.1.0" }
arrow-schema = { version = "=60.1.0" }
base64 = { version = "0.23.1" }
handlebars = { version = "6.4.4" }
hound = { version = "3.5.1" }
# Excludes default image codecs; consumers select their required formats explicitly.
image = { version = "0.25.10", default-features = false }
prost = { version = "0.14.4" }
prost-types = { version = "=0.14.4" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154" }
toml = { version = "1.1.8" }
toml_edit = { version = "0.25.17" }

# Configuration
clap = { version = "4.6.7", features = ["derive"] }
dotenv = { package = "dotenvy", version = "0.15.7" }

# Filesystem
file-id = { version = "0.2.3" }
# Uses zlib-rs, the inflate backend shared with the ZIP reader.
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
glob = { version = "0.3.4" }
globset = { version = "0.4.20" }
tar = { version = "0.4.46" }
tempfile = { version = "3.27.0" }
walkdir = { version = "2.5.0" }
# Excludes every default compression and encryption backend; Dokime writes stored archives only.
zip = { version = "9.1.0", default-features = false }

# Parsing
cargo_metadata = { version = "0.23.1" }
cssparser = { version = "0.38.0" }
proc-macro-crate = { version = "3.5.0" }
proc-macro2 = { version = "1.0.107" }
quote = { version = "1.0.47" }
syn = { version = "3.0.9", features = ["extra-traits", "full"] }

# Concurrency

# Async
async-trait = { version = "0.1.92" }
futures-util = { version = "0.3.34" }
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "=0.1.19" }
tokio-util = { version = "=0.7.20" }

# Networking
# Excludes the aws-lc-rs TLS, Prometheus metrics and proxy-protocol defaults; the test FTP server needs none of them.
libunftp = { version = "0.23.1", default-features = false }
rcgen = { version = "0.14.10", features = ["x509-parser"] }
# Excludes default TLS provider selection; Dokime installs ring before constructing HTTP clients.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
# Excludes the default aws-lc-rs provider; Dokime installs ring.
rustls = { version = "0.23.46", default-features = false }
rustls-platform-verifier = { version = "0.7.1" }
suppaftp = { version = "12.0.0" }
tonic = { version = "=0.14.8" }
tonic-types = { version = "=0.14.8" }
unftp-core = { version = "0.1.0" }
unftp-sbe-fs = { version = "0.4.0" }
url = { version = "2.5.8" }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

# Storage
rusqlite = { version = "0.40.2", features = ["bundled", "functions", "limits"] }

# UI
anstream = { version = "1.0.0" }
anstyle = { version = "1.0.14" }
ashpd = { version = "0.13.13" }
cpal = { version = "0.18.2" }
indicatif = { version = "0.18.6" }
nokhwa = { version = "0.10.11" }
portable-pty = { version = "0.9.0" }
tauri = { version = "2.12.5" }
tauri-build = { version = "2.7.2" }
tauri-bundler = { version = "2.10.4" }
tauri-plugin-dialog = { version = "2.8.2" }
tauri-plugin-opener = { version = "2.7.1" }
tauri-plugin-updater = { version = "2.13.3" }
tauri-utils = { version = "2.10.2" }
xcap = { version = "0.9.8" }

# Testing
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

# === Workspace Lints === #

# === Lints === #

# === Profiles === #

# Keep Development Debug Archives Small While Retaining Workspace Source Locations.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The Stored Evidence Integrity Check Digests Every Row A Read Returns; Unoptimized,
# SHA-256 Alone Cost About 21 µs Per Row In Debug Test Builds.
[profile.dev.package.sha2]
opt-level = 3

