# === Workspace === #

[workspace]
members = [
  "crates/dokime-gui/src-tauri",
  "crates/dokime-cli-next",
  "crates/dokime-protocol",
  "crates/dokime-storage",
  "crates/dokime-operations-next",
  "crates/dokime-runtime-next",
  "crates/dokime-packaging",
  "sdk/rust",
  "tools/protocol",
]
default-members = [
  "crates/dokime-gui/src-tauri",
  "crates/dokime-cli-next",
  "crates/dokime-runtime-next",
  "crates/dokime-storage",
  "crates/dokime-operations-next",
  "sdk/rust",
  "crates/dokime-protocol",
  "crates/dokime-packaging",
]
resolver = "2"

# === Workspace Package === #

[workspace.package]
version = "0.1.5"
edition = "2024"
rust-version = "1.99"
description = "Dokime application and runtime packages."
license = "Apache-2.0"
publish = true
repository = "https://github.com/stokker-technologies/dokime"

# === Workspace Dependencies === #

[workspace.dependencies]
# Local
dokime-operations-next = { version = "0.1.5", path = "crates/dokime-operations-next" }
dokime-packaging = { version = "0.1.5", path = "crates/dokime-packaging" }
dokime-protocol = { version = "0.1.5", path = "crates/dokime-protocol" }
dokime-runtime-next = { version = "0.1.5", path = "crates/dokime-runtime-next" }
dokime-storage = { version = "0.1.5", path = "crates/dokime-storage" }

# Git
harmos = { version = "0.1.14", git = "https://github.com/stokker-technologies/harmos", rev = "81d32d3bc9ab3e2121746923712ec9508cee3ec7" }
harmos-protocol = { version = "0.1.14", git = "https://github.com/stokker-technologies/harmos", rev = "81d32d3bc9ab3e2121746923712ec9508cee3ec7" }
harmos-runtime = { version = "0.1.14", git = "https://github.com/stokker-technologies/harmos", rev = "81d32d3bc9ab3e2121746923712ec9508cee3ec7" }
harmos-storage = { version = "0.1.14", git = "https://github.com/stokker-technologies/harmos", rev = "81d32d3bc9ab3e2121746923712ec9508cee3ec7" }

# Error Handling
thiserror = { version = "2.0.21" }

# Logging
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "registry"] }

# Utilities
num-bigint = { version = "0.5.1", features = ["serde"] }
num-traits = { version = "0.2.19" }
keyring = { version = "4.2.0" }
regex = { version = "1.13.1" }
semver = { version = "1.0.28" }
sha2 = { version = "0.11.1" }
uuid = { version = "1.28.0", features = ["v5", "v7", "serde"] }
zeroize = { version = "=1.9.1" }

# Serialization
arrow-buffer = { version = "=60.1.0" }
arrow-array = { version = "=60.1.0" }
arrow-ipc = { version = "=60.1.0", features = ["zstd"] }
arrow-select = { version = "=60.1.0" }
arrow-schema = { version = "=60.1.0" }
flatbuffers = { version = "25.12.19" }
base64 = { version = "0.23.1" }
# Excludes default image codecs; consumers select their required formats explicitly.
prost = { version = "0.14.4" }
prost-build = { version = "=0.14.4", default-features = false }
prost-reflect = { version = "0.16.5", features = ["serde"] }
prost-types = { version = "=0.14.4" }
protoc-bin-vendored = { version = "3.3.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154" }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
zip = { version = "9.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
toml = { version = "1.1.8" }

# Configuration
clap = { version = "4.6.7", features = ["derive"] }

# Filesystem
# Uses zlib-rs, the inflate backend shared with the ZIP reader.
tar = { version = "0.4.46" }
tempfile = { version = "3.27.0" }

# Parsing
# Excludes every default compression and encryption backend; Dokime writes stored archives only.
heck = { version = "0.5.0" }
proc-macro-crate = { version = "3.5.0" }
proc-macro2 = { version = "1.0.107" }
quote = { version = "1.0.47" }
syn = { version = "3.0.9", features = ["extra-traits", "full"] }

# Concurrency

# Async
async-trait = { version = "0.1.92" }
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "=0.1.19" }
tokio-util = { version = "=0.7.20" }

# Networking
# Excludes the aws-lc-rs TLS, Prometheus metrics and proxy-protocol defaults; the test FTP server needs none of them.
# Excludes default TLS provider selection; Dokime installs ring before constructing HTTP clients.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
# Excludes the default aws-lc-rs provider; Dokime installs ring.
rustls = { version = "0.23.46", default-features = false }
tonic = { version = "=0.14.8" }
tonic-prost = { version = "0.14.8", default-features = false }
tonic-prost-build = { version = "=0.14.8", default-features = false }

# Storage
rusqlite = { version = "0.41.1", features = ["bundled", "limits"] }

# UI

# Testing
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

# === Workspace Lints === #

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"

# === Lints === #

# === Profiles === #

# Keep Development Debug Archives Small While Retaining Workspace Source Locations.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The Stored Evidence Integrity Check Digests Every Row A Read Returns; Unoptimized,
# SHA-256 Alone Cost About 21 µs Per Row In Debug Test Builds.
[profile.dev.package.sha2]
opt-level = 3

# === Patches === #

# === Other === #
