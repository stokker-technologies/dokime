# Library Packages Composed by Dokime
[[libraries]]
descriptors = "../crates/dokime-protocol/src/descriptors.bin"
packages = ["harmos.model.v1", "harmos.host.v1", "harmos.plugin.v1"]

# Product Admission Restrictions
[callers]
