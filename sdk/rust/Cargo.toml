# === Package === #

[package]
name = "dokime"
description = "Rust plugin authoring and typed clients over the Dokime gRPC protocol."
autotests = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# === Package Targets === #

# === Features === #

# === Dependencies === #

[dependencies]
# Local
dokime-derive = { version = "0.1.5", path = "derive" }
dokime-protocol = { workspace = true }

# Git
harmos = { workspace = true }
harmos-protocol = { workspace = true }

# Error Handling
thiserror = { workspace = true }

# Logging

# Utilities
uuid = { workspace = true }

# Serialization
prost = { workspace = true, features = ["derive", "std"] }
prost-reflect = { workspace = true }
prost-types = { workspace = true, features = ["std"] }

# Configuration

# Filesystem

# Parsing

# Concurrency

# Async

# Networking
tonic = { workspace = true, features = ["codegen", "transport"] }

# Storage

# UI

# Testing

