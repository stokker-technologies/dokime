# === Tools === #

[tools]
cmake = "4.2.8"
ninja = "1.13.2"

# === Entry Points === #

[tasks.build]
description = "Build the Plugin and Client"
run = ['cmake --preset development', 'cmake --build --preset development']

[tasks.run]
description = "Run the Test Client"
run = "build/dokime-client"

[tasks.dev]
description = "Start Plugin Development"
run = "dokime dev --plugin ."
