# === Tools === #

[tools]
cmake = "4.2.8"
ninja = "1.13.2"
"pipx:clang-format" = "21.1.8"

# === Entry Points === #

[tasks.prepare]
description = "Prepare the C++ SDK"
usage = 'arg "[args]" var=#true'
run = 'python tools/sdk.py prepare {% for arg in usage.args %}"{{arg}}" {% endfor %}'

[tasks.configure]
description = "Configure the C++ SDK"
usage = 'arg "[args]" var=#true'
run = 'python tools/sdk.py configure {% for arg in usage.args %}"{{arg}}" {% endfor %}'

[tasks.format]
description = "Format the C++ SDK"
usage = 'arg "[args]" var=#true'
run = [
  'python tools/sdk.py format {% for arg in usage.args %}"{{arg}}" {% endfor %}',
  'uv run --no-sync --project ../../tools/python ruff check --select I,F401 --fix tools tests/support',
  'uv run --no-sync --project ../../tools/python ruff format tools tests/support',
]

[tasks.check]
description = "Check the C++ SDK"
usage = 'arg "[args]" var=#true'
run = [
  'python tools/sdk.py check {% for arg in usage.args %}"{{arg}}" {% endfor %}',
  'python tools/sdk.py format --check',
  'uv run --no-sync --project ../../tools/python ruff check tools tests/support',
  'uv run --no-sync --project ../../tools/python ruff format --check tools tests/support',
  'uv run --no-sync --project ../../tools/python ty check --python ../../.venv tools tests/support',
]

[tasks.build]
description = "Build the C++ SDK"
usage = 'arg "[args]" var=#true'
run = 'python tools/sdk.py build {% for arg in usage.args %}"{{arg}}" {% endfor %}'

[tasks.test]
description = "Test the C++ SDK"
usage = 'arg "[args]" var=#true'
run = 'python tools/sdk.py test {% for arg in usage.args %}"{{arg}}" {% endfor %}'

[tasks.package]
description = "Package the C++ SDK"
usage = 'arg "[args]" var=#true'
run = 'python tools/sdk.py package {% for arg in usage.args %}"{{arg}}" {% endfor %}'

[tasks.consumer]
description = "Build the Installed C++ Package Consumer"
usage = 'arg "[args]" var=#true'
run = 'python tools/sdk.py consumer {% for arg in usage.args %}"{{arg}}" {% endfor %}'

[tasks.conformance]
description = "Test Library Conformance with the C++ SDK"
usage = 'arg "[args]" var=#true'
run = 'python tools/sdk.py conformance {% for arg in usage.args %}"{{arg}}" {% endfor %}'

[tasks.clean]
description = "Clean C++ Compiler Outputs"
run = 'python tools/sdk.py clean'
