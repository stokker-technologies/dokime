[tools]
dotnet = "10.0.403"

[tasks.build]
description = "Build the Managed Plugin Executable"
run = 'dotnet build Starter.csproj --configuration Release'

[tasks.serve]
description = "Serve the Remote Plugin"
run = 'dotnet run --project Starter.csproj --configuration Release --no-build -- --remote'
