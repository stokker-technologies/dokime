[vars]

configuration = "{{ get_env(name='DOKIME_CSHARP_CONFIGURATION', default='Release') }}"

[tools]
dotnet = "10.0.403"

[tasks.build]
description = "Build the Managed Plugin Executable"
# Re-Evaluate the Mutable Development Preview Before Building With Its Verified Lock.
run = [
  '"{{tools.dotnet.path}}/dotnet" restore Plugin.csproj --force-evaluate',
  '"{{tools.dotnet.path}}/dotnet" publish Plugin.csproj --configuration {{vars.configuration}} --no-restore --output assets/plugin',
]

[tasks.dev]
description = "Serve the Remote Plugin"
run = '"{{tools.dotnet.path}}/dotnet" run --project Plugin.csproj --configuration {{vars.configuration}} --no-build -- --remote'
