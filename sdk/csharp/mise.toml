# === Tools === #

[vars]

configuration = "{{ get_env(name='DOKIME_CSHARP_CONFIGURATION', default='Release') }}"

[tools]
dotnet = "10.0.403"

[tasks."prepare:protocol"]
hide = true
description = "Restore the Pinned Protocol Compiler"
run = [
  '"{{tools.dotnet.path}}/dotnet" restore tools/Harmos.csproj --packages ../../target/cs/packages --locked-mode -p:ManagePackageVersionsCentrally=false',
]

[tasks."prepare:harmos"]
hide = true
description = "Prepare the Pinned Harmos Project and NuGet Feed"
usage = 'flag "--refresh-lock"'
run = [
  'python tools/prepare_harmos.py "{{tools.dotnet.path}}/dotnet" --configuration {{vars.configuration}}{% if usage.refresh_lock %} --refresh-lock{% endif %}',
]

[tasks."restore"]
hide = true
description = "Restore the C# Solution"
usage = 'flag "--refresh-lock"'
depends = ["prepare:harmos{% if usage.refresh_lock %} --refresh-lock{% endif %}"]
run = [
  '"{{tools.dotnet.path}}/dotnet" restore Dokime.slnx --configfile NuGet.Config {% if usage.refresh_lock %}--force-evaluate{% else %}--locked-mode{% endif %}',
]

[tasks."generate"]
description = "Verify Frozen C# Generation"
usage = 'flag "--write"'
run = [
  'uv run --no-sync --project ../../tools/python python -m dokime_tools.build.protocol --language csharp{% if not usage.write %} --check{% endif %}',
]

[tasks."build"]
description = "Build the C# Solution or a Selected Project"
usage = 'flag "--project <project>" default="Dokime.slnx"'
depends = ["restore", "generate"]
run = ['"{{tools.dotnet.path}}/dotnet" build "{{usage.project}}" --configuration {{vars.configuration}} --no-restore']

[tasks."format"]
description = "Format the C# Solution"
run = [
  'python tools/format.py "{{tools.dotnet.path}}/dotnet"',
  'uv run --no-sync --project ../../tools/python ruff check --select I --fix tools',
  'uv run --no-sync --project ../../tools/python ruff format --line-length 140 tools',
]

[tasks."check"]
description = "Check C# Formatting and Generated Clients"
run = [
  'python tools/format.py "{{tools.dotnet.path}}/dotnet" --check',
  'uv run --no-sync --project ../../tools/python python -m dokime_tools.build.protocol --language csharp --check',
  'python tools/check_clients.py',
  'uv run --no-sync --project ../../tools/python ruff check --select I,F401,E9 tools',
  'uv run --no-sync --project ../../tools/python ruff format --line-length 140 --check tools',
  'uv run --no-sync --project ../../tools/python ty check --project . --python ../../.venv --extra-search-path ../../tools/python/src tools',
]

[tasks."package"]
description = "Pack the C# SDK"
run = [
  'python tools/package.py',
  '"{{tools.dotnet.path}}/dotnet" pack Dokime.slnx --configuration {{vars.configuration}} --no-build --no-restore --output ../../target/cs/feed',
]

[tasks."test"]
description = "Test the C# Solution"
usage = 'flag "--builders" help="Run Only the Builder Contracts"'
run = [
  '{% if not usage.builders %}"{{tools.dotnet.path}}/dotnet" test Dokime.slnx --configuration {{vars.configuration}} --no-build --no-restore --filter "Layer!=Conformance&Layer!=Starter"{% endif %}',
  '"{{tools.dotnet.path}}/dotnet" ../../target/cs/bin/Builders/{{vars.configuration | lower}}/Builders.dll',
]

[tasks."build:starter"]
hide = true
description = "Build the NuGet Consumer"
usage = 'flag "--project <project>" default="examples/Starter/Example.slnx"'
run = [
  '"{{tools.dotnet.path}}/dotnet" restore "{{usage.project}}" --configfile NuGet.Config --packages ../../target/cs/packages --force-evaluate',
  '"{{tools.dotnet.path}}/dotnet" build "{{usage.project}}" --configuration {{vars.configuration}} --no-restore',
  '{% if usage.project == "examples/Starter/Example.slnx" %}"{{tools.dotnet.path}}/dotnet" publish examples/Starter/src/Example.Plugin/Example.Plugin.csproj --configuration {{vars.configuration}} --no-build --output examples/Starter/assets/plugin{% endif %}',
]

[tasks."build:system"]
hide = true
description = "Build the Shared Host Fixture"
run = [
  '"{{tools.dotnet.path}}/dotnet" restore ../tests/fixtures/csharp/SystemPlugin/SystemPlugin.csproj --configfile NuGet.Config --force-evaluate',
  '"{{tools.dotnet.path}}/dotnet" build ../tests/fixtures/csharp/SystemPlugin/SystemPlugin.csproj --configuration {{vars.configuration}} --no-restore',
]

[tasks."publish:system"]
hide = true
description = "Publish the Shared Host Fixture"
usage = 'arg "output"'
run = [
  '"{{tools.dotnet.path}}/dotnet" publish ../tests/fixtures/csharp/SystemPlugin/SystemPlugin.csproj --configuration {{vars.configuration}} --self-contained true --output "{{usage.output}}" --configfile NuGet.Config -p:NuGetLockFilePath="{{usage.output}}/packages.lock.json" -p:RestoreForceEvaluate=true',
]

[tasks."build:reference"]
hide = true
description = "Build the Resolved Library Reference Host"
run = 'uv run --no-sync --project ../../tools/python python -m dokime_tools.build.host_fixtures --reference-only --profile dev'

[tasks."build:examples"]
hide = true
description = "Build the Installed NuGet Examples"
run = [{ task = "build:starter --project examples/Starter/Example.slnx" }]

[tasks."test:starter"]
hide = true
description = "Test the Packaged Starter"
run = ['python tools/run_stories.py "{{tools.dotnet.path}}/dotnet" "Layer=Starter"']

[tasks."test:created"]
hide = true
description = "Run the Created C# Project Against Prepared Product Bytes"
run = 'uv run --no-sync --project ../../tools/python python tools/test_created.py'

[tasks."test:conformance"]
hide = true
description = "Test Library Conformance"
run = ['python tools/run_stories.py "{{tools.dotnet.path}}/dotnet" "Layer=Conformance"']

[tasks.clean]
hide = true
description = "Clean C# Compiler Outputs"
run = [
  '"{{tools.dotnet.path}}/dotnet" clean Dokime.slnx --configuration {{vars.configuration}}',
  '"{{tools.dotnet.path}}/dotnet" clean examples/Starter/Example.slnx --configuration {{vars.configuration}}',
  '"{{tools.dotnet.path}}/dotnet" clean ../../target/cs/h/Harmos.csproj --configuration {{vars.configuration}}',
]

[tasks."check:generated"]
hide = true
description = "Compile the Generated Client and Plugin Consumer"
run = [
  '"{{tools.dotnet.path}}/dotnet" restore tests/Generation/Generation.csproj --configfile NuGet.Config --locked-mode',
  '"{{tools.dotnet.path}}/dotnet" build tests/Generation/Generation.csproj --configuration Debug --no-restore',
]
