[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "dokime-sdk"
version = "0.1.5"
description = "Remote Dokime plugin authoring and generated gRPC clients."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
  "grpcio>=1.85.1,<2",
  "protobuf>=7.35.1,<8",
  "harmos-sdk @ git+https://github.com/stokker-technologies/harmos@c2cfb153ab136159f07741d1061fcb3a1191e86c#subdirectory=sdk/python",
]

[project.optional-dependencies]
polars = ["polars>=2.1,<3"]
pandas = ["pandas>=3,<4"]

[dependency-groups]
generate = ["grpcio-tools==1.85.1", "mypy-protobuf==5.1.0"]
stubs = ["mypy==2.4.1", "pandas-stubs==3.1.0.261029", "polars==2.1.0", "types-protobuf==7.35.1.20260906", "types-grpcio==1.85.0.20261028"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/dokime"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tools/generate.py", "/hatch_build.py", "/pyproject.toml", "/ruff.toml", "/README.md"]

[tool.hatch.build.targets.sdist.force-include]
"../../proto" = "proto"
"../../LICENSE" = "LICENSE"
"../../NOTICE" = "NOTICE"

[tool.ty.environment]
python-version = "3.13"
python = "../../.venv"

[tool.ty.src]
include = ["src/dokime", "tests", "examples", "tools", "hatch_build.py"]
# protoc Owns Generated Bindings; Descriptor and Stub Stories Verify Their Contract.
exclude = ["**/*_pb2*"]

[tool.ruff]
target-version = "py313"
# protoc Owns the Committed Generated Bindings.
extend-exclude = ["*_pb2.py", "*_pb2.pyi", "*_pb2_grpc.py", "*_pb2_grpc.pyi"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib"]

[tool.coverage.run]
source_pkgs = ["dokime"]

[tool.coverage.paths]
dokime = ["src/dokime", "*/site-packages/dokime"]

[tool.ruff.lint]
# Every SDK and Tooling Function Has an Explicit Typed Signature.
extend-select = ["ANN"]
