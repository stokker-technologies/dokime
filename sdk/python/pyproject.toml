[build-system]
requires = ["hatchling==1.33.0", "grpcio-tools==1.85.1"]
build-backend = "hatchling.build"

[project]
name = "dokime-sdk"
version = "0.1.5"
description = "Remote Dokime plugin authoring and generated gRPC clients."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
  "grpcio>=1.85.1,<2",
  "protobuf>=7.35.1,<8",
  "harmos-sdk @ git+https://github.com/stokker-technologies/harmos@81d32d3bc9ab3e2121746923712ec9508cee3ec7#subdirectory=sdk/python",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/dokime"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/hatch_build.py", "/pyproject.toml", "/README.md"]

[tool.hatch.build.targets.sdist.force-include]
"../../proto" = "proto"
"../../LICENSE" = "LICENSE"
"../../NOTICE" = "NOTICE"

[tool.ty.environment]
python-version = "3.13"
python = "../../.venv"

[tool.ty.src]
include = ["src/dokime", "tests", "examples"]

[tool.ruff]
target-version = "py313"
# Generated Bindings Are Build Outputs Owned By protoc.
extend-exclude = ["*_pb2.py", "*_pb2.pyi", "*_pb2_grpc.py"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib"]

[tool.coverage.run]
source_pkgs = ["dokime"]

[tool.coverage.paths]
dokime = ["src/dokime", "*/site-packages/dokime"]
