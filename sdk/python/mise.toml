# === Entry Points === #

[tasks.prepare]
description = "Prepare the Python Environment"
run = 'uv sync --locked --all-groups --project ../../tools/python'

[tasks.format]
description = "Format the Python SDK"
run = [
  'uv run --no-sync --project ../../tools/python ruff check --select I,F401 --fix . ../tests/fixtures/python',
  'uv run --no-sync --project ../../tools/python ruff format . ../tests/fixtures/python',
]

[tasks.check]
description = "Check the Python SDK"
run = [
  'uv run --no-sync --project ../../tools/python ruff format --check .',
  'uv run --no-sync --project ../../tools/python ruff check .',
  'uv run --no-sync --project ../../tools/python ty check --project .',
]

[tasks.build]
description = "Build the Python Distributions"
run = 'mise -C ../.. run build:python -- --profile {{env.DOKIME_BUILD_PROFILE | default(value="dev")}}'

[tasks.package]
description = "Package the Built Python Distributions"
run = 'uv run --no-sync --project ../../tools/python python tools/package.py'

[tasks.install]
description = "Install the Built Python Wheel"
run = 'uv run --no-sync --project ../../tools/python python tools/installed.py install'

[tasks.test]
description = "Test the Installed Python SDK"
run = [
  'uv run --no-sync --project ../../tools/python python -m unittest discover -s tests/unit -v',
  'uv run --no-sync --project ../../tools/python python -m unittest discover -s tests/integration -v',
]

[tasks.wheel]
description = "Test the Installed Wheel Story"
run = 'mise -C ../.. run test:python:wheel'

[tasks.generated]
description = "Check Generated Python Messages"
run = 'uv run --no-sync --project ../../tools/python python tools/generated.py'

[tasks.conformance]
description = "Test Library Conformance"
run = 'uv run --no-sync --project ../../tools/python python -m unittest discover -s tests/system -v'

[tasks.starter]
description = "Test the Starter"
run = 'uv run --no-sync --project ../../tools/python python -m unittest discover -s ../tests/fixtures/python/starter -v'

[tasks.generate]
description = "Generate Typed Python Protocol Packages"
run = 'uv run --locked --group generate python tools/generate.py'
