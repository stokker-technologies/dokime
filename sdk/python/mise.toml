# === Entry Points === #

[tasks.prepare]
description = "Prepare the Python Environment"
run = ['uv sync --locked --all-groups --project ../../tools/python', { task = "build" }, { task = "install" }]

[tasks.format]
usage = 'arg "[paths]..."'
description = "Format the Python SDK"
run = [
  'uv run --no-sync --project ../../tools/python ruff check --select I,F401 --fix {% if usage.paths %}{{usage.paths | join(sep=" ")}}{% else %}.{% endif %}',
  'uv run --no-sync --project ../../tools/python ruff format {% if usage.paths %}{{usage.paths | join(sep=" ")}}{% else %}.{% endif %}',
]

[tasks.check]
description = "Check the Python SDK"
run = [
  'uv run --no-sync --project ../../tools/python ruff format --check .',
  'uv run --no-sync --project ../../tools/python ruff check .',
  'uv run --no-sync --project ../../tools/python ty check --project .',
  'uv run --no-sync --project ../../tools/python python tools/stubs.py',
  'uv run --no-sync --project ../../tools/python python -c "from pathlib import Path; from dokime_tools.build.protocol_callers import check_public_surfaces; check_public_surfaces(Path.cwd().parents[1])"',

]

[tasks.build]
description = "Build the Python Distributions"
run = 'mise -C ../.. run build:python -- --profile {{env.DOKIME_BUILD_PROFILE | default(value="dev")}}'

[tasks.package]
description = "Package the Built Python Distributions"
run = 'uv run --no-sync --project ../../tools/python python tools/package.py'

[tasks.install]
hide = true
description = "Install the Built Python Wheel"
run = 'uv run --no-sync --project ../../tools/python python tools/installed.py install'

[tasks.test]
description = "Test the Installed Python SDK"
usage = 'flag "--layer <layer>" { choices "unit" "integration" }; flag "--select <select>" help="Run Matching Python Tests"'
run = [
  '{% if not usage.layer or usage.layer == "unit" %}uv run --no-sync --project ../../tools/python python -m unittest discover -s tests/unit -v{% if usage.select %} -k "{{usage.select}}"{% endif %}{% endif %}',
  '{% if not usage.layer or usage.layer == "integration" %}uv run --no-sync --project ../../tools/python python -m unittest discover -s tests/integration -v{% if usage.select %} -k "{{usage.select}}"{% endif %}{% endif %}',
]

[tasks.wheel]
hide = true
description = "Test the Installed Wheel Story"
run = 'mise -C ../.. run test:python:wheel'

[tasks.generated]
hide = true
description = "Check Generated Python Messages"
run = 'uv run --no-sync --project ../../tools/python python tools/generated.py'

[tasks.example-test]
hide = true
description = "Test the Starter Description Without a Host"
dir = "examples/starter"
run = "uv run python -m unittest"

[tasks.generate]
description = "Generate Typed Python Protocol Packages"
usage = 'flag "--check"'
run = 'uv run --no-sync --project ../../tools/python python tools/generate.py{% if usage.check %} --check{% endif %}'
