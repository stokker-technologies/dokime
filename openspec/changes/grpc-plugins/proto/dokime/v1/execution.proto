// DRAFT for owner review. Not implemented. See ../../README.md for the rules.
//
// Messages the redesign introduces. Suites, parameters, files, documents,
// record contracts, analyses and settings keep their current shapes and are
// exported into dokime.v1 by the existing generator.
syntax = "proto3";

package dokime.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

message Metadata {
  string identifier = 1;
  string label = 2;
  string description = 3;
}

// ------------------------------------------------- Operations a plugin serves
//
// Operation identifiers, all with Host visibility:
//   <template>.materialize   MaterializeRequest -> TestCase       (pure)
//   <template>.initialize    InitializeRequest  -> InitializeResponse   (optional)
//   <template>.cleanup       CleanupRequest     -> CleanupResponse      (optional)
//   Step.operation           StepRequest        -> StepResponse
//   Criterion.operation      CriterionRequest   -> CriterionResponse
// The Harmos Request.scope of each call is the execution identifier.

message MaterializeRequest {
  string template = 1;
  // One resolved parameter set from the host's expansion.
  map<string, google.protobuf.Value> parameters = 2;
}

message TestCase {
  string template = 1;
  // Plugin identifier and catalog digest the case was materialized from.
  string plugin = 2;
  bytes digest = 3;
  map<string, google.protobuf.Value> parameters = 4;
  repeated Step steps = 5;
  repeated Criterion criteria = 6;
  // Identifiers of the streams the host opens for the execution.
  repeated string streams = 7;
}

message Step {
  // Evidence keys on metadata.identifier.
  Metadata metadata = 1;
  // Generated by the SDK. Its retry count is the operation's policy.
  string operation = 2;
  // The operator may run the step again in an interactive execution.
  bool repeatable = 3;
}

message Criterion {
  Metadata metadata = 1;
  string operation = 2;
}

message InitializeRequest {
  string execution = 1;
  TestCase test_case = 2;
}

message InitializeResponse {}

message StepRequest {
  string execution = 1;
  // Metadata.identifier of the step.
  string step = 2;
}

message StepResponse {}

message CriterionRequest {
  string execution = 1;
  // Metadata.identifier of the criterion.
  string criterion = 2;
}

message CriterionResponse {
  bool passed = 1;
}

message CleanupRequest {
  string execution = 1;
  Termination termination = 2;
}

message CleanupResponse {}

enum Termination {
  TERMINATION_UNSPECIFIED = 0;
  // Every step ran.
  TERMINATION_COMPLETED = 1;
  // A step or initialize failed.
  TERMINATION_FAILED = 2;
  // The operator stopped or cancelled the execution.
  TERMINATION_CANCELLED = 3;
}

// ----------------------------------- Host operations a plugin calls (ctx)
//
// Public operations served by Dokime. Prompts, artifacts, file capture and
// effects keep their current request shapes.
//   dokime.execution.record       PublishRecord     -> RecordReceipt
//   dokime.execution.records      RecordsRequest    -> Records
//   dokime.execution.statistics   StatisticsRequest -> Statistics
//   dokime.execution.progress     ReportProgress    -> ReportProgressResponse
//   dokime.execution.log          WriteLog          -> WriteLogResponse
//   dokime.settings.read          ReadSettings      -> Settings
//   dokime.secrets.read           ReadSecret        -> Secret

message PublishRecord {
  string execution = 1;
  // Identifier of the record contract.
  string kind = 2;
  // Serialized record message of that contract.
  bytes payload = 3;
  // When the plugin produced it; the host adds its arrival time.
  google.protobuf.Timestamp at = 4;
}

message RecordReceipt {
  // Position of the record among the execution's records of this kind.
  uint64 ordinal = 1;
}

message RecordsRequest {
  string execution = 1;
  string kind = 2;
  // Limit to the time range of one step; empty for the whole execution.
  string step = 3;
  // 0 returns only count and last.
  uint32 limit = 4;
}

message Records {
  uint64 count = 1;
  Record last = 2;
  // The most recent records, oldest first, up to the requested limit.
  repeated Record records = 3;
}

message Record {
  string kind = 1;
  bytes payload = 2;
  google.protobuf.Timestamp at = 3;
  uint64 ordinal = 4;
}

message StatisticsRequest {
  string execution = 1;
  string stream = 2;
  // Column of the stream. May be empty when the stream has one value column.
  string field = 3;
  // Limit to the time range of one step; empty for the whole execution.
  string step = 4;
}

// Fields are meaningful only when count is greater than zero.
message Statistics {
  uint64 count = 1;
  double min = 2;
  double max = 3;
  double mean = 4;
  double stddev = 5;
  double median = 6;
  double p05 = 7;
  double p95 = 8;
  double p99 = 9;
  double first = 10;
  double last = 11;
}

message ReportProgress {
  string execution = 1;
  uint64 completed = 2;
  uint64 total = 3;
  string label = 4;
}

message ReportProgressResponse {}

message WriteLog {
  string execution = 1;
  Severity severity = 2;
  string message = 3;
  google.protobuf.Timestamp at = 4;
}

message WriteLogResponse {}

enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_DEBUG = 1;
  SEVERITY_INFO = 2;
  SEVERITY_WARNING = 3;
  SEVERITY_ERROR = 4;
}

message ReadSettings {}

message Settings {
  // Saved values of the calling plugin's settings, by identifier.
  google.protobuf.Struct values = 1;
}

message ReadSecret {
  string identifier = 1;
}

message Secret {
  bytes value = 1;
}
