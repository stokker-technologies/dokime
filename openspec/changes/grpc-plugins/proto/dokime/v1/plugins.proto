// DRAFT for owner review. Not implemented. See ../../README.md for the rules.
syntax = "proto3";

package dokime.v1;

import "google/protobuf/timestamp.proto";

// Operations served to clients:
//   dokime.plugins.list     ListPlugins     -> Plugins
//   dokime.plugins.add      AddRemotePlugin -> Plugin
//   dokime.plugins.remove   RemovePlugin    -> RemovePluginResponse
// Installing and uninstalling a managed bundle keep their current operations.

message ListPlugins {}

message Plugins {
  repeated Plugin plugins = 1;
}

message AddRemotePlugin {
  // Address of the plugin's server, for example "http://bench-pc:7001".
  string url = 1;
}

message RemovePlugin {
  // Entry identifier from Plugin.entry.
  string entry = 1;
}

message RemovePluginResponse {}

message Plugin {
  // Identifies the entry whether or not the plugin has ever connected.
  string entry = 1;
  Placement placement = 2;
  // Set for a remote plugin.
  string url = 3;
  State state = 4;
  // Why the plugin is unavailable or failed, and what to do.
  string reason = 5;
  // From the plugin's description; empty until it first connects.
  string id = 6;
  string version = 7;
  bytes digest = 8;
  google.protobuf.Timestamp started_at = 9;
}

enum Placement {
  PLACEMENT_UNSPECIFIED = 0;
  // A bundle Dokime installs, starts and supervises.
  PLACEMENT_MANAGED = 1;
  // A server someone else runs, reached by URL.
  PLACEMENT_REMOTE = 2;
}

enum State {
  STATE_UNSPECIFIED = 0;
  // Starting a managed plugin or connecting to a remote one.
  STATE_CONNECTING = 1;
  STATE_READY = 2;
  // A remote plugin that cannot be reached; Dokime keeps trying.
  STATE_UNAVAILABLE = 3;
  // A managed plugin that failed to start or was refused at connect.
  STATE_FAILED = 4;
}
