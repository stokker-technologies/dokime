# === Installer === #

[installer]
# The CLI Built With the Kit Supplies the Product Version and Native Target.
formats = ["nsis"]

# === Product === #

[dokime]

# === Signing === #

[signing.updater]
private_key_env = "TAURI_SIGNING_PRIVATE_KEY"
