# The evidence runner layers its own `stkr` profile beneath this file, so the
# test groups and overrides here apply to it and to ad hoc `cargo nextest` runs.
[profile.default]
retries = 0
fail-fast = false

# Stories that move whole captures and large reports through the shipped
# storage settings run one at a time so their memory never overlaps.
[test-groups]
large-transfers = { max-threads = 1 }

[[profile.default.overrides]]
filter = '''package(dokime-server) & binary(grpc) & test(=evidence_contract)
  | package(dokime-app) & binary(domains) & test(/^execution_(large_case|whole_capture|pool_refusal|running_report|report_progress|contended_reads)_contract$/)'''
test-group = 'large-transfers'
