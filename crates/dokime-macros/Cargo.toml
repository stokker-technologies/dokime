# === Package === #

# Plumbing, not a layer: Rust forces proc macros into their own compile target,
# and `dokime` re-exports them so authors only ever write `#[dokime::…]`.
[package]
name = "dokime-macros"
edition.workspace = true
rust-version.workspace = true
description = "Authoring attributes re-exported by the dokime crate."
license.workspace = true
repository.workspace = true
version = { workspace = true }

# === Package Targets === #

[lib]
proc-macro = true

# === Features === #

[features]
# Author fixtures compile as a plugin crate's runtime build: Harmos gates
# operation execution (`Dependent`, `Requires`, catalog registration) on the
# consuming crate's `runtime` feature. The proc-macro library ignores it.
default = ["runtime"]
runtime = []

