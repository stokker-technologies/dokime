# === Package === #

[package]
name = "dokime-server-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Dokime backend executable."
license.workspace = true
repository.workspace = true
publish = false

# === Package Targets === #

[[bin]]
name = "dokime-server"
path = "src/main.rs"
doc = false

# === Features === #

[features]
default = []
media-native = ["dokime-server/media-native"]

# === Dependencies === #

[dependencies]

# Local
dokime = { version = "0.1.0", path = "../dokime" }
dokime-server = { version = "0.1.0", path = "../dokime-server" }
dokime-runtime = { version = "0.1.0", path = "../dokime-runtime" }

# Configuration
clap = { workspace = true }
dotenv = { workspace = true }

