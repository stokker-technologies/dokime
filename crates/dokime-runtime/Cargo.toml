# === Package === #

[package]
name = "dokime-runtime"
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
version = { workspace = true }

include = ["/src/**", "/tests/**", "/benches/**", "/build.rs", "/Cargo.toml", "/dist-report/report.html", "/dist-brand/**"]

# === Package Targets === #

# === Features === #

[features]
default = ["native", "derive"]
native = [
  "harmos/plugin-sidecar",
  "dep:file-id",
  "dep:futures-util",
  "dep:globset",
  "dep:tempfile",
  "dep:tokio",
  "dep:tokio-stream",
  "dep:tracing-subscriber",
  "dep:tracing-error",
]
derive = ["dep:dokime-macros"]
configuration = ["dep:base64", "dep:cssparser", "dep:sysinfo", "dep:tempfile", "dep:tokio", "dep:toml", "dep:url", "dep:image"]
storage = ["dep:base64", "dep:futures-util", "dep:rusqlite", "dep:sha2", "dep:tempfile", "dep:tokio"]
host = [
  "configuration",
  "native",
  "derive",
  "storage",
  "dep:async-trait",
  "dep:base64",
  "dep:dokime-host",
  "dep:futures-util",
  "dep:keyring",
  "dep:image",
  "dep:keyring-core",
  "dep:rustls-platform-verifier",
  "dep:sha2",
  "dep:suppaftp",
  "dep:tokio",
  "dep:tokio-util",
  "dep:tonic",
  "dep:walkdir",
  "dep:zip",
  "dep:zeroize",
  "harmos/grpc",
  "harmos/plugin-sidecar",
]
fault-injection = ["host"]
fft = ["host", "harmos/signal-fft"]
media-native = ["host", "dep:ashpd", "dep:cpal", "dep:hound", "dep:image", "dep:nokhwa", "dep:url", "dep:xcap"]
simulation = ["host", "harmos/simulation"]

# === Dependencies === #

[dependencies]
# Local
dokime-domain = { version = "0.1.0", path = "../dokime-domain", features = ["diagnostics"] }
dokime-host = { version = "0.1.0", path = "../dokime-host", optional = true }
dokime-macros = { version = "0.1.0", path = "../dokime-macros", optional = true }

# Git

# Error Handling
thiserror = { workspace = true }
tonic = { workspace = true, optional = true }

# Logging
tracing = { workspace = true }
tracing-error = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

# Utilities
harmos = { workspace = true, features = ["plugin", "signal"] }
harmos-packaging = { workspace = true }
keyring = { workspace = true, optional = true }
keyring-core = { workspace = true, optional = true }
regex = { workspace = true }
ring = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
time = { workspace = true }
uuid = { workspace = true, features = ["js"] }
zeroize = { workspace = true, optional = true }

# Serialization
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
base64 = { workspace = true, optional = true }
hound = { workspace = true, optional = true }
image = { workspace = true, optional = true, features = ["jpeg", "png"] }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
sysinfo = { workspace = true, optional = true }
toml = { workspace = true, optional = true }

# Configuration

# Filesystem
globset = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
walkdir = { workspace = true, optional = true }
zip = { workspace = true, optional = true }

# Parsing
cssparser = { workspace = true, optional = true }

# Concurrency

# Async
async-trait = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
tokio = { workspace = true, features = ["process"], optional = true }
tokio-stream = { workspace = true, features = ["sync"], optional = true }
tokio-util = { workspace = true, features = ["io", "rt"], optional = true }

# Networking
rustls-platform-verifier = { workspace = true, optional = true }
suppaftp = { workspace = true, features = ["tokio", "tokio-rustls-ring"], optional = true }
url = { workspace = true, optional = true }

# Storage
rusqlite = { workspace = true, optional = true }

# UI
cpal = { workspace = true, optional = true }
nokhwa = { workspace = true, optional = true, features = ["input-native"] }

# Testing

# === Build Dependencies === #

# === Dev Dependencies === #

[dev-dependencies]
# Local

# Git

# Error Handling

# Logging
tracing-subscriber = { workspace = true }

# Utilities
harmos = { workspace = true, features = ["plugin-sidecar"] }

# Serialization
serde_json = { workspace = true, features = ["float_roundtrip"] }

# Configuration

# Filesystem
tempfile = { workspace = true }

# Parsing

# Concurrency

# Async
tokio = { workspace = true, features = ["test-util"] }

# Networking
libunftp = { workspace = true, features = ["ring"] }
unftp-core = { workspace = true }
unftp-sbe-fs = { workspace = true }

# Storage
rusqlite = { workspace = true }

# UI

# Testing
criterion = { workspace = true }

# === Target Dependencies === #

[target."cfg(unix)".dependencies]
# Local

# Git

# Error Handling

# Logging

# Utilities
libc = { workspace = true }

# Serialization

# Configuration

# Filesystem

# Parsing

# Concurrency

# Async

# Networking

# Storage

# UI

# Testing

[target.'cfg(target_os = "linux")'.dependencies]
# Local

# Git

# Error Handling

# Logging

# Utilities

# Serialization

# Configuration

# Filesystem

# Parsing

# Concurrency

# Async

# Networking

# Storage

# UI
ashpd = { workspace = true, optional = true, features = ["screenshot"] }

# Testing

[target."cfg(windows)".dependencies]
# Local

# Git

# Error Handling

# Logging

# Utilities

# Serialization

# Configuration

# Filesystem
# Windows has no inode in std metadata; the volume serial and file index tell a rotated file from a truncated one.
file-id = { workspace = true, optional = true }

# Parsing

# Concurrency

# Async

# Networking

# Storage

# UI

# Testing

[target."cfg(any(windows, target_os = \"macos\"))".dependencies]
# Local

# Git

# Error Handling

# Logging

# Utilities

# Serialization

# Configuration

# Filesystem

# Parsing

# Concurrency

# Async

# Networking

# Storage

# UI
xcap = { workspace = true, optional = true }

# Testing

# === Test Targets === #

[[test]]
name = "integration"
path = "tests/integration/main.rs"
required-features = ["host"]

[[test]]
name = "acceptance"
path = "tests/acceptance/main.rs"
required-features = ["host"]

[[test]]
name = "system"
path = "tests/system/main.rs"
required-features = ["host"]

# === Bench Targets === #

[[bench]]
name = "unit-runtime"
path = "benches/unit/main.rs"
harness = false
required-features = ["host"]

[[bench]]
name = "integration-runtime"
path = "benches/integration/main.rs"
harness = false
required-features = ["host"]

[[bench]]
name = "system-runtime"
path = "benches/system/main.rs"
harness = false
required-features = ["host"]

[[bench]]
name = "integration-storage"
path = "benches/storage/main.rs"
harness = false
required-features = ["host"]

