# === Package === #

[package]
name = "dokime-runtime"
description = "Independent gRPC execution host."
autotests = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# === Package Targets === #

[[bin]]
name = "dokime-host"
path = "src/bin/host.rs"

# === Features === #

# === Dependencies === #

[dependencies]
# Local
dokime-operations = { workspace = true }
dokime-packaging = { workspace = true }
dokime-protocol = { workspace = true }
dokime-storage = { workspace = true }

# Git
harmos-domain = { workspace = true }
harmos-operations = { workspace = true }
harmos-protocol = { workspace = true }
harmos-runtime = { workspace = true }

# Error Handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Utilities
keyring = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

# Serialization
prost = { workspace = true }
prost-reflect = { workspace = true }
prost-types = { workspace = true }
serde_json = { workspace = true }

# Configuration

# Filesystem
tempfile = { workspace = true }

# Parsing

# Concurrency

# Async
async-trait = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "io-std", "sync", "rt", "macros", "time", "net"] }
tokio-stream = { workspace = true, features = ["net"] }
tokio-util = { workspace = true }

# Networking
tonic = { workspace = true, features = ["tls-ring"] }

# Storage

# UI

# Testing

# === Build Dependencies === #

# === Dev Dependencies === #

[dev-dependencies]
# Local
dokime = { path = "../../sdk/rust" }
dokime-client-internal = { workspace = true }
# Native Payload Preparation Is Test-Only; Shipping Hosts Do Not Link Installer Tooling.
dokime-packaging = { workspace = true, features = ["installer"] }
dokime-test-support = { workspace = true }

# Git

# Error Handling

# Logging

# Utilities
sha2 = { workspace = true }

# Serialization
base64 = { workspace = true }
zip = { workspace = true }

# Configuration

# Filesystem
tempfile = { workspace = true }

# Parsing

# Concurrency

# Async

# Networking

# Storage
rusqlite = { workspace = true }

# UI

# Testing
criterion = { workspace = true }

# === Target Dependencies === #

[target.'cfg(unix)'.dependencies]
# Utilities
libc = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
# Utilities
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
# Testing
windows-sys = { workspace = true, features = ["Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# === Test Targets === #

[[test]]
name = "system"
path = "tests/main.rs"

# === Bench Targets === #

[[bench]]
name = "storage"
path = "benches/storage/main.rs"
harness = false

# === Example Targets === #

# === Workspace Lints === #

# === Lints === #

[lints]
workspace = true

# === Profiles === #

# === Patches === #

# === Other === #
