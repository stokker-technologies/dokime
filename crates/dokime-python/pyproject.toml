[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "dokime"
readme = "README.md"
description = "Dokime Python SDK for authoring, runtime ownership, and remote execution."
requires-python = ">=3.13"
license = "Apache-2.0"
classifiers = [
  "Programming Language :: Python :: 3",
]
dynamic = ["version"]
dependencies = ["protobuf>=7.35.1,<8"]

[project.optional-dependencies]
examples = ["rich>=14,<15"]

[project.scripts]
dokime-client = "dokime.client.cli:main"

[dependency-groups]
test = ["grpcio>=1.84.0,<2", "pytest==9.1.1", "pytest-cov==7.1.0", "pytest-timeout==2.4.0"]

[tool.maturin]
manifest-path = "Cargo.toml"
python-source = "python"
module-name = "dokime._native"
exclude = ["**/__pycache__/**", "**/*.pyc"]
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--import-mode=importlib",
  "--timeout-method=thread",
]

[tool.ruff]
extend-exclude = ["python/dokime/client/_generated"]
