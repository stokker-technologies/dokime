[package]
name = "dokime-cli"
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
version = { workspace = true }

[dependencies]
# Local
dokime-contract = { path = "../dokime-contract", features = ["diagnostics"] }
dokime-client = { path = "../dokime-client" }
dokime-filesystem = { path = "../dokime-filesystem" }

# Git
harmos = { workspace = true, features = ["plugin"] }

# Error Handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Utilities
sha2 = { workspace = true }
zeroize = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Configuration
clap = { workspace = true }

# Filesystem
tempfile = { workspace = true }

# Async
tokio = { workspace = true }
tokio-stream = { workspace = true }

# UI
anstream = { workspace = true }
anstyle = { workspace = true }
indicatif = { workspace = true }

[dev-dependencies]
# Git
harmos = { workspace = true, features = ["plugin", "plugin-sidecar", "grpc"] }

# Networking
tonic = { workspace = true }

# Utilities
time = { workspace = true }

# Filesystem
tempfile = { workspace = true }

# Testing
criterion = { workspace = true }

# UI
portable-pty = { workspace = true }

[[bin]]
name = "dokime"
path = "src/main.rs"
doc = false
