[package]
name = "dokime-cli"
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
version = { workspace = true }
# Ships As Installers And Raw Release Executables, Not Through crates.io.
publish = false

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }{ binary-ext }"
pkg-fmt = "bin"

[dependencies]
# Local
dokime = { workspace = true, features = ["client", "terminal", "diagnostics"] }

# Git
harmos-packaging = { workspace = true }

# Error Handling

# Logging

# Utilities
sha2 = { workspace = true }
uuid = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Configuration
clap = { workspace = true }

# Filesystem
tempfile = { workspace = true }

# Async
tokio = { workspace = true }

# UI

[[bin]]
name = "dokime"
path = "src/main.rs"
doc = false

[dev-dependencies]
# Local
dokime = { workspace = true, features = ["plugin-sidecar"] }

# Git
harmos-packaging = { workspace = true, features = ["generate-proto"] }

# Utilities
time = { workspace = true }

# Filesystem
tempfile = { workspace = true }

# Networking
tonic = { workspace = true }

# UI
portable-pty = { workspace = true }

# Testing
criterion = { workspace = true }
