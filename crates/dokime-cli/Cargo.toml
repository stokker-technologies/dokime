[package]
name = "dokime-cli"
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
version = { workspace = true }

[dependencies]
# Local
dokime = { path = "../dokime", features = ["client"] }
dokime-app = { path = "../dokime-app", features = ["fft"] }
dokime-filesystem = { path = "../dokime-filesystem" }
dokime-protocol = { path = "../dokime-protocol" }
dokime-server = { path = "../dokime-server" }
dokime-terminal = { path = "../dokime-terminal" }

# Error Handling
thiserror = { workspace = true, default-features = true }

# Logging
tracing = { workspace = true, default-features = true }
tracing-appender = { workspace = true, default-features = true }
tracing-chrome = { workspace = true, default-features = true }
tracing-error = { workspace = true, default-features = true }
tracing-flame = { workspace = true, default-features = true }
tracing-subscriber = { workspace = true, default-features = true }

# Utilities
sha2 = { workspace = true, default-features = true }
zeroize = { workspace = true, default-features = true }

# Serialization
serde = { workspace = true, default-features = true }
serde_json = { workspace = true, default-features = true }

# Configuration
clap = { workspace = true, default-features = true }
dotenv = { workspace = true, default-features = true }

# Filesystem
tempfile = { workspace = true, default-features = true }

# Async
tokio = { workspace = true, default-features = true }

[dev-dependencies]
# Utilities
time = { workspace = true, default-features = true }

# Filesystem
tempfile = { workspace = true, default-features = true }

# Testing
criterion = { workspace = true, default-features = true }

[[bin]]
name = "dokime"
path = "src/main.rs"
doc = false

[[bench]]
name = "shutdown"
path = "benches/commands/main.rs"
harness = false
