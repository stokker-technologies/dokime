# === Package === #

[package]
name = "dokime-cli"
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
version = { workspace = true }
# Ships As Installers And Raw Release Executables, Not Through crates.io.
publish = false

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }{ binary-ext }"
pkg-fmt = "bin"

# === Package Targets === #

[[bin]]
name = "dokime"
path = "src/main.rs"
doc = false
test = false

# === Features === #

[features]
default = []
media-native = ["dokime-server/media-native"]

# === Dependencies === #

[dependencies]
# Local
dokime = { workspace = true, features = ["client", "terminal", "diagnostics"] }
dokime-server = { workspace = true }

# Git
harmos-packaging = { workspace = true }

# Error Handling

# Logging
tracing = { workspace = true }

# Utilities
sha2 = { workspace = true }
uuid = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Configuration
clap = { workspace = true }
dotenv = { workspace = true }

# Filesystem
tempfile = { workspace = true }

# Parsing

# Concurrency

# Async
tokio = { workspace = true }

# Networking

# Storage

# UI

# Testing

# === Build Dependencies === #

# === Dev Dependencies === #

[dev-dependencies]
# Local
dokime = { workspace = true, features = ["plugin-sidecar"] }

# Git
harmos-packaging = { workspace = true, features = ["generate-proto"] }

# Error Handling

# Logging

# Utilities
time = { workspace = true }

# Serialization

# Configuration

# Filesystem
tempfile = { workspace = true }

# Parsing

# Concurrency

# Async
futures-util = { workspace = true }

# Networking
tonic = { workspace = true }

# Storage

# UI
portable-pty = { workspace = true }

# Testing
criterion = { workspace = true }

