# === Package === #

[package]
name = "dokime-host"
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
version = { workspace = true }

# === Package Targets === #

# === Features === #

# === Dependencies === #

[dependencies]
# Local
dokime-domain = { version = "0.1.0", path = "../dokime-domain" }

# Git

# Error Handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Utilities
starship-battery = { workspace = true }
sysinfo = { workspace = true }
uuid = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Configuration

# Filesystem

# Parsing

# Concurrency

# Async
tokio = { workspace = true, features = ["process"] }

# Networking
getifs = { workspace = true }

# Storage

# UI

# Testing

# === Build Dependencies === #

# === Dev Dependencies === #

[dev-dependencies]
# Local
dokime-runtime = { path = "../dokime-runtime" }

# Git

# Error Handling

# Logging

# Utilities

# Serialization

# Configuration

# Filesystem
tempfile = { workspace = true }

# Parsing

# Concurrency

# Async

# Networking

# Storage

# UI

# Testing
criterion = { workspace = true }

# === Target Dependencies === #

[target.'cfg(windows)'.dependencies]
# Local

# Git

# Error Handling

# Logging

# Utilities
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_NetworkManagement_WiFi",
  "Win32_Networking_WinSock",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Power",
  "Win32_System_Variant",
  "Win32_System_Wmi",
] }

# Serialization

# Configuration

# Filesystem

# Parsing

# Concurrency

# Async

# Networking

# Storage

# UI

# Testing

