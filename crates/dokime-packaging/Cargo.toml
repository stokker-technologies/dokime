[package]
name = "dokime-packaging"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cargo-driven native Dokime plugin packaging"
version = { workspace = true }

[dependencies]
# Local
dokime = { workspace = true, features = ["terminal", "plugin-sidecar"] }

# Git
harmos-packaging = { workspace = true }

# Error Handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Utilities
process-wrap = { workspace = true, features = ["tokio1"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Configuration
clap = { workspace = true }

# Filesystem
tempfile = { workspace = true }

# Parsing
cargo_metadata = { workspace = true }

# Async
tokio = { workspace = true, features = ["process"] }
