[package]
name = "dokime-packaging"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cargo-driven native Dokime plugin packaging"
publish = false
version = { workspace = true }

[dependencies]
# Local
dokime-terminal = { path = "../dokime-terminal" }

# Git
harmos = { workspace = true, features = ["runtime", "derive", "plugin", "sidecar", "artifact"] }

# Error Handling
thiserror = { workspace = true, default-features = true }

# Logging
tracing = { workspace = true, default-features = true }

# Utilities
process-wrap = { workspace = true, features = [
  "tokio1",
  "process-group",
  "job-object",
  "kill-on-drop",
] }

# Serialization
serde_json = { workspace = true, default-features = true }

# Configuration
clap = { workspace = true, default-features = true }

# Filesystem
tempfile = { workspace = true, default-features = true }

# Parsing
cargo_metadata = { workspace = true, default-features = true }

# Async
tokio = { workspace = true, default-features = true, features = ["process"] }
