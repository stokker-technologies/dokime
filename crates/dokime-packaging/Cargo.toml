[package]
name = "dokime-packaging"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cargo-driven native Dokime plugin packaging"
publish = false
version = { workspace = true }

[dependencies]
# Local
dokime-terminal = { path = "../dokime-terminal" }

# Git
harmos = { workspace = true, features = ["plugin", "plugin-sidecar"] }

# Error Handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Utilities
process-wrap = { workspace = true, features = ["tokio1"] }

# Serialization
serde_json = { workspace = true }

# Configuration
clap = { workspace = true }

# Filesystem
tempfile = { workspace = true }

# Parsing
cargo_metadata = { workspace = true }

# Async
tokio = { workspace = true, features = ["process"] }
