# === Package === #

[package]
name = "dokime-packaging"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Dokime sidecar and native installer packaging"
version = { workspace = true }

# === Package Targets === #

# === Features === #

# === Dependencies === #

[dependencies]
# Local
dokime = { workspace = true, features = ["terminal", "plugin-sidecar"] }

# Git

# Error Handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Utilities
harmos-packaging = { workspace = true }
process-wrap = { workspace = true, features = ["tokio1"] }
sha2 = { workspace = true }
time = { workspace = true }

# Serialization
base64 = { workspace = true }
image = { workspace = true, features = ["bmp", "ico", "png"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Configuration
clap = { workspace = true }

# Filesystem
ar = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
zip = { workspace = true, features = ["deflate-flate2-zlib-rs"] }

# Parsing
cargo_metadata = { workspace = true }
nsis = { workspace = true }
rpm = { workspace = true }
syn = { workspace = true }

# Concurrency

# Async
tokio = { workspace = true, features = ["process"] }

# Networking
reqwest = { workspace = true }
rustls = { workspace = true, features = ["ring", "std"] }

# Storage

# UI
tauri-bundler = { workspace = true }

# Testing

# === Build Dependencies === #

# === Dev Dependencies === #

[dev-dependencies]
# Async
tokio = { workspace = true, features = ["test-util"] }

