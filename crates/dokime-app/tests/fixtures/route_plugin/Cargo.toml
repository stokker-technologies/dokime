[package]
name = "dokime-route-plugin"
default-run = "dokime-route-plugin"
edition.workspace = true
rust-version.workspace = true
description = "Native fixtures for plugin routes, suites, observers, and dependencies."
license.workspace = true
version = { workspace = true }

[dependencies]
# Local
dokime = { path = "../../../../dokime" }

# Git
harmos = { workspace = true }

# Error Handling
thiserror = { workspace = true, default-features = true }

# Logging
tracing = { workspace = true, default-features = true }

# Serialization
serde = { workspace = true, default-features = true }
serde_json = { workspace = true, default-features = true }

# Async
tokio = { workspace = true, default-features = true }

[[bin]]
name = "dokime-route-plugin"
path = "src/main.rs"

[[bin]]
name = "fixture-sidecar-protocol"
path = "src/protocol.rs"

[[bin]]
name = "dokime-app-suite-sidecar-fixture"
path = "../suite_sidecar/main.rs"
test = false
bench = false

[[bin]]
name = "dokime-app-telemetry-sidecar-fixture"
path = "../telemetry_sidecar/main.rs"
test = false
bench = false

[[bin]]
name = "dokime-app-dependent-sidecar-fixture"
path = "../dependent_sidecar/main.rs"
test = false
bench = false
