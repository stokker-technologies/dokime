[package]
name = "dokime-app"
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
version = { workspace = true }
include = [
  "/src/**",
  "/tests/**",
  "/benches/**",
  "/build.rs",
  "/Cargo.toml",
  "/dist-report/report.html",
]

[features]
default = []
fft = ["harmos-signal/fft"]
# Deterministic whole-runtime simulation, forwarded to the library that owns it.
sim = ["harmos/sim"]

[dependencies]
# Local
dokime = { path = "../dokime", features = ["storage"] }
dokime-contract = { path = "../dokime-contract" }
dokime-filesystem = { path = "../dokime-filesystem" }
dokime-host = { path = "../dokime-host" }
dokime-theme = { path = "../dokime-theme" }

# Git
harmos = { workspace = true, features = ["runtime", "derive", "plugin", "sidecar-host", "grpc"] }
harmos-signal = { workspace = true, default-features = false }

# Error Handling
thiserror = { workspace = true, default-features = true }

# Logging
tracing = { workspace = true, default-features = true }

# Utilities
blake2 = { workspace = true, default-features = true }
keyring = { workspace = true }
regex = { workspace = true, default-features = true }
sha2 = { workspace = true, default-features = true }
time = { workspace = true, default-features = true }
uuid = { workspace = true, default-features = true }

# Serialization
arrow-array = { workspace = true, default-features = true }
arrow-schema = { workspace = true, default-features = true }
arrow-select = { workspace = true, default-features = true }
base64 = { workspace = true, default-features = true }
prost = { workspace = true, default-features = true }
serde = { workspace = true, default-features = true }
serde_arrow = { workspace = true }
serde_json = { workspace = true, default-features = true }
toml = { workspace = true, default-features = true }

# Filesystem
tempfile = { workspace = true, default-features = true }
zip = { workspace = true }

# Parsing
cssparser = { workspace = true, default-features = true }

# Async
async-trait = { workspace = true, default-features = true }
futures-util = { workspace = true, default-features = true }
tokio = { workspace = true, default-features = true }
tokio-util = { workspace = true, default-features = true, features = ["io"] }

# Storage

[dev-dependencies]

# Logging
tracing-subscriber = { workspace = true, default-features = true }

# Serialization
serde_json = { workspace = true, default-features = true }

# Async
tokio = { workspace = true, default-features = true, features = ["test-util"] }

# Storage
rusqlite = { workspace = true }

# Testing
criterion = { workspace = true, default-features = true }

[[bench]]
name = "runtime"
path = "benches/runtime/main.rs"
harness = false
