[package]
name = "dokime-server"
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
version = { workspace = true }

[dependencies]
# Local
dokime = { path = "../dokime" }
dokime-app = { path = "../dokime-app" }
dokime-contract = { path = "../dokime-contract" }
dokime-protocol = { path = "../dokime-protocol", default-features = false, features = ["server"] }

# Git
harmos = { workspace = true, features = ["grpc"] }

# Error Handling
thiserror = { workspace = true, default-features = true }

# Logging
tracing = { workspace = true, default-features = true }

# Utilities
sha2 = { workspace = true, default-features = true }
subtle = { workspace = true }
sysinfo = { workspace = true }
time = { workspace = true, default-features = true }
uuid = { workspace = true, default-features = true }
zeroize = { workspace = true, default-features = true }

# Serialization
prost = { workspace = true, default-features = true }
prost-types = { workspace = true, default-features = true }
serde = { workspace = true, default-features = true }
serde_json = { workspace = true, default-features = true }

# Filesystem
tempfile = { workspace = true, default-features = true }
zip = { workspace = true }

# Async
futures-util = { workspace = true, default-features = true }
tokio = { workspace = true, default-features = true }
tokio-stream = { workspace = true, default-features = true, features = ["net"] }
tokio-util = { workspace = true, default-features = true, features = ["rt"] }

# Networking
rustls = { workspace = true, features = ["ring", "std"] }
tonic = { workspace = true, features = ["server", "router", "tls-ring"] }
tonic-prost = { workspace = true, default-features = true }
tonic-types = { workspace = true, default-features = true }
tower = { workspace = true, default-features = true }

[dev-dependencies]
# Local
dokime = { path = "../dokime", features = ["client"] }
dokime-host = { path = "../dokime-host" }
dokime-protocol = { path = "../dokime-protocol", features = ["client"] }

# Error Handling
anyhow = { workspace = true, default-features = true }

# Logging
tracing-subscriber = { workspace = true, default-features = true }

# Async
tokio = { workspace = true, default-features = true, features = ["test-util"] }

# Networking
rcgen = { workspace = true, default-features = true }
tonic = { workspace = true, features = ["channel"] }

# Testing
criterion = { workspace = true, default-features = true }

[build-dependencies]
# Local
dokime-contract = { path = "../dokime-contract" }
dokime-protocol = { path = "../dokime-protocol", default-features = false }

# Git
harmos = { workspace = true, features = ["grpc"] }

# Serialization
prost = { workspace = true, default-features = true }
prost-types = { workspace = true, default-features = true }

# Networking
tonic-prost-build = { workspace = true, default-features = true }

[[bench]]
name = "grpc"
path = "benches/grpc/main.rs"
harness = false
