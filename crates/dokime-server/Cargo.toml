# === Package === #

[package]
name = "dokime-server"
edition.workspace = true
rust-version.workspace = true
publish = false
description.workspace = true
license.workspace = true
repository.workspace = true
version = { workspace = true }

# === Package Targets === #

# === Features === #

[features]
default = ["runtime"]
runtime = []
fault-injection = ["dokime/fault-injection"]
# Host screenshot, camera and audio capture, enabled by the release server build;
# see dokime-runtime for the system packages it links.
media-native = ["dokime/media-native"]

# === Dependencies === #

[dependencies]
# Local
dokime = { workspace = true, features = ["native", "fft", "diagnostics", "terminal", "client"] }

# Git

# Error Handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-chrome = { workspace = true }
tracing-error = { workspace = true }
tracing-flame = { workspace = true }
tracing-subscriber = { workspace = true }

# Utilities
rand = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
sysinfo = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

# Serialization
prost = { workspace = true }
prost-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Configuration
clap = { workspace = true }

# Filesystem
tempfile = { workspace = true }
zip = { workspace = true }

# Parsing

# Concurrency

# Async
futures-util = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }

# Networking
rcgen = { workspace = true }
rustls = { workspace = true, features = ["ring", "std"] }
tonic = { workspace = true, features = ["server", "tls-ring"] }
tonic-types = { workspace = true }

# Storage

# UI

# Testing

# === Build Dependencies === #

[build-dependencies]
# Local
dokime = { workspace = true }
dokime-packaging = { workspace = true }

# Git
harmos-packaging = { workspace = true, features = ["generate-proto"] }

# Error Handling

# Logging

# Utilities

# Serialization
serde_json = { workspace = true }

# Configuration

# Filesystem

# Parsing

# Concurrency

# Async

# Networking

# Storage

# UI

# Testing

# === Dev Dependencies === #

[dev-dependencies]
# Local
dokime-cli = { path = "../dokime-cli" }
dokime-runtime = { workspace = true }
plugin-host = { workspace = true }

# Git
harmos-packaging = { workspace = true }
harmos-sdk = { workspace = true, features = ["grpc"] }

# Error Handling

# Logging

# Utilities
keyring-core = { workspace = true }

# Serialization

# Configuration

# Filesystem

# Parsing

# Concurrency

# Async
async-trait = { workspace = true }
tokio = { workspace = true, features = ["process", "test-util"] }
tokio-stream = { workspace = true }

# Networking
tonic = { workspace = true, features = ["channel"] }

# Storage
rusqlite = { workspace = true }

# UI
anstream = { workspace = true }
portable-pty = { workspace = true }

# Testing
criterion = { workspace = true }

# === Target Dependencies === #

[target.'cfg(windows)'.dev-dependencies]
# Local

# Git

# Error Handling

# Logging

# Utilities
windows-sys = { workspace = true, features = ["Win32_System_Console"] }

# Serialization

# Configuration

# Filesystem

# Parsing

# Concurrency

# Async

# Networking

# Storage

# UI

# Testing

# === Test Targets === #

# === Bench Targets === #

[[bench]]
name = "system-server"
path = "benches/system/main.rs"
harness = false

