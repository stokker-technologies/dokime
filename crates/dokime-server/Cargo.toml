[package]
name = "dokime-server"
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
version = { workspace = true }

[features]
default = []
# Host screenshot, camera and audio capture, enabled by the release server build;
# see dokime-app for the system packages it links.
media-native = ["dokime-app/media-native"]

[dependencies]
# Local
dokime = { path = "../dokime" }
dokime-app = { path = "../dokime-app", features = ["fft"] }
dokime-contract = { path = "../dokime-contract", features = ["diagnostics"] }
dokime-filesystem = { path = "../dokime-filesystem" }
dokime-cli = { path = "../dokime-cli" }

# Git
harmos = { workspace = true, features = ["grpc"] }

# Error Handling
thiserror = { workspace = true }

# Logging
tracing-appender = { workspace = true }
tracing-chrome = { workspace = true }
tracing-error = { workspace = true }
tracing-flame = { workspace = true }
tracing-subscriber = { workspace = true }
tracing = { workspace = true }

# Utilities
sha2 = { workspace = true }
subtle = { workspace = true }
sysinfo = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

# Serialization
prost = { workspace = true }
prost-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Configuration
clap = { workspace = true }
dotenv = { workspace = true }

# Filesystem
tempfile = { workspace = true }
zip = { workspace = true }

# Async
futures-util = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true, features = ["net"] }
tokio-util = { workspace = true, features = ["rt"] }

# Networking
rustls = { workspace = true, features = ["ring", "std"] }
tonic = { workspace = true, features = ["server", "tls-ring"] }
tonic-prost = { workspace = true }
tonic-types = { workspace = true }

[build-dependencies]
# Local
dokime-contract = { path = "../dokime-contract", features = ["descriptors"] }

[dev-dependencies]
# Local
dokime-client = { path = "../dokime-client" }
dokime-host = { path = "../dokime-host" }

# Error Handling
anyhow = { workspace = true }

# Async
tokio = { workspace = true, features = ["test-util"] }

# Networking
rcgen = { workspace = true }
tonic = { workspace = true, features = ["channel"] }

# Testing
criterion = { workspace = true }

[[bench]]
name = "grpc"
path = "benches/grpc/main.rs"
harness = false

[[bin]]
name = "dokime-server"
path = "src/main.rs"
doc = false

[[bench]]
name = "shutdown"
path = "benches/host/main.rs"
harness = false
