[package]
name = "dokime-server"
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
version = { workspace = true }

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }{ binary-ext }"
pkg-fmt = "bin"

[features]
default = []
# Host screenshot, camera and audio capture, enabled by the release server build;
# see dokime-runtime for the system packages it links.
media-native = ["dokime/media-native"]

[dependencies]
# Local
dokime = { workspace = true, features = ["host", "fft", "diagnostics", "terminal", "client"] }

# Error Handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-chrome = { workspace = true }
tracing-error = { workspace = true }
tracing-flame = { workspace = true }
tracing-subscriber = { workspace = true }

# Utilities
rand = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
sysinfo = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

# Serialization
prost = { workspace = true }
prost-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Configuration
clap = { workspace = true }
dotenv = { workspace = true }

# Filesystem
tempfile = { workspace = true }
zip = { workspace = true }

# Async
futures-util = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true, features = ["net"] }
tokio-util = { workspace = true, features = ["rt"] }

# Networking
rcgen = { workspace = true }
rustls = { workspace = true, features = ["ring", "std"] }
tonic = { workspace = true, features = ["server", "tls-ring"] }
tonic-prost = { workspace = true }
tonic-types = { workspace = true }

[build-dependencies]
# Local
dokime = { workspace = true }

# Git
harmos-packaging = { workspace = true, features = ["generate-proto"] }

[dev-dependencies]
# Local
dokime = { path = "../dokime" }
dokime-cli = { path = "../dokime-cli" }

# Git
harmos-packaging = { workspace = true }
harmos-sdk = { workspace = true, features = ["grpc"] }

# Error Handling
anyhow = { workspace = true }

# Async
async-trait = { workspace = true }
tokio = { workspace = true, features = ["process", "test-util"] }

# Networking
tonic = { workspace = true, features = ["channel"] }

# Storage
rusqlite = { workspace = true }

# UI
anstream = { workspace = true }
portable-pty = { workspace = true }

# Testing
criterion = { workspace = true }

[[bench]]
name = "system-server"
path = "benches/system/main.rs"
harness = false

[[bin]]
name = "dokime-server"
path = "src/main.rs"
doc = false
