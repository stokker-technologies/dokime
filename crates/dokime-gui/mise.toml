# === Generate === #

[tasks."generate:host"]
hide = true
description = "Generate Desktop Execution Host Dispatch"
run = "node tools/host-bindings.mjs"

[tasks."generate:host-frontend"]
hide = true
description = "Generate Canonical Desktop Host Messages"
run = "node tools/host-bindings.mjs --frontend"

[tasks."generate:messages"]
hide = true
description = "Generate Frontend Protobuf Modules from Prepared Descriptors"
run = "node ../../tools/typescript/generate.mjs"

[tasks."generate:report"]
hide = true
description = "Generate the Embedded Report"
run = "uv run --no-sync python -m dokime_tools.build.frontend report"

# === Build === #

[tasks."build:frontend"]
hide = true
description = "Build the Desktop Frontend from Prepared Messages"
run = ["pnpm run typecheck", "pnpm run build:live"]
