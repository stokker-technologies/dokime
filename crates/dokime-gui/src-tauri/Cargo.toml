[package]
name = "dokime-gui"
publish = false
edition.workspace = true
rust-version.workspace = true
description = "Dokime desktop application shell."
license.workspace = true
repository.workspace = true
build = "build.rs"
default-run = "dokime-gui"
version = { workspace = true }
# Ships Inside The Desktop Installers, Not Through crates.io.

[features]
default = ["updater"]
updater = ["dep:tauri-plugin-updater"]
# Keep a Windows console attached for `tauri dev`; installer builds of any
# profile leave it off so the desktop never opens a terminal window.
console = []

[[bin]]
name = "dokime-gui"
path = "src/main.rs"
test = false

[build-dependencies]
# Local
dokime = { workspace = true }

# Git
harmos-packaging = { workspace = true, features = ["generate-proto"] }

# Serialization
serde_json = { workspace = true }

# UI
tauri-build = { workspace = true, features = [] }

[dependencies]
# Local
dokime = { workspace = true, features = ["native", "client", "diagnostics"] }
dokime-server = { workspace = true }

# Git
harmos-sdk = { workspace = true, features = ["grpc"] }

# Error Handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }

# Utilities
keyring = { workspace = true }
rand = { workspace = true }
semver = { workspace = true }
sha2 = { workspace = true }
time = { workspace = true }
zeroize = { workspace = true }
# Organization packs from Finder, Explorer and `zip` are deflated.
zip = { workspace = true, features = ["deflate-flate2-zlib-rs"] }

# Serialization
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Configuration
dotenv = { workspace = true }

# Filesystem
tempfile = { workspace = true }

# Async
tokio = { workspace = true, features = ["process"] }
tokio-stream = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }

# Networking
reqwest = { workspace = true }
tonic = { workspace = true, features = ["channel", "tls-ring", "tls-native-roots"] }
url = { workspace = true }

# UI
tauri = { workspace = true, features = ["tray-icon", "image-png"] }
tauri-plugin-deep-link = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-updater = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
# Utilities
windows = { workspace = true, features = ["Win32_System_Com"] }

[dev-dependencies]
# Local
dokime = { path = "../../dokime", features = ["host", "fft", "plugin-sidecar"] }

# Git
harmos-packaging = { workspace = true, features = ["generate-proto"] }

# Filesystem

# Async
async-trait = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tokio-stream = { workspace = true, features = ["net"] }

# Networking
rcgen = { workspace = true }
rustls = { workspace = true, features = ["ring", "std"] }

# UI
tauri = { workspace = true, features = ["test"] }
