[package]
name = "dokime-gui"
edition.workspace = true
rust-version.workspace = true
description = "Dokime desktop application shell."
license.workspace = true
repository.workspace = true
build = "build.rs"
default-run = "dokime-gui"
version = { workspace = true }

[features]
default = ["updater"]
updater = ["dep:tauri-plugin-updater"]
# Keep a Windows console attached for `tauri dev`; installer builds of any
# profile leave it off so the desktop never opens a terminal window.
console = []

[build-dependencies]
# Local
dokime-contract = { path = "../../dokime-contract", features = ["descriptors"] }

# UI
tauri-build = { workspace = true, features = [] }

[dependencies]
# Local
dokime-client = { path = "../../dokime-client" }
# Excludes the SDK default `derive`; the shell authors no plugins and needs no attribute macros.
dokime = { path = "../../dokime", default-features = false, features = ["native"] }
dokime-filesystem = { path = "../../dokime-filesystem" }
dokime-contract = { path = "../../dokime-contract" }

# Git
harmos = { workspace = true, features = ["grpc"] }

# Error Handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }

# Utilities
keyring = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
time = { workspace = true }
zeroize = { workspace = true }

# Serialization
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Configuration
dotenv = { workspace = true }

# Async
tokio = { workspace = true, features = ["process"] }
tokio-stream = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }

# Networking
reqwest = { workspace = true }
tonic = { workspace = true, features = ["channel", "tls-ring", "tls-native-roots"] }
url = { workspace = true }

# UI
tauri = { workspace = true, features = [] }
tauri-plugin-deep-link = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-updater = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
# Utilities
windows = { workspace = true, features = ["Win32_System_Com"] }

[dev-dependencies]
# Local
dokime = { path = "../../dokime" }
dokime-app = { path = "../../dokime-app", features = ["fft"] }
dokime-server = { path = "../../dokime-server" }

# Git
harmos = { workspace = true, features = ["plugin", "plugin-sidecar"] }

# Filesystem
tempfile = { workspace = true }

# Async
async-trait = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tokio-stream = { workspace = true, features = ["net"] }

# Networking
rcgen = { workspace = true }
rustls = { workspace = true, features = ["ring", "std"] }

# UI
tauri = { workspace = true, features = ["test"] }
