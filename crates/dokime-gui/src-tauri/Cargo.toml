# === Package === #

[package]
name = "dokime-gui"
publish = false
edition.workspace = true
rust-version.workspace = true
description = "Dokime desktop application shell."
license.workspace = true
repository.workspace = true
build = "build.rs"
default-run = "dokime-gui"
version = { workspace = true }

# === Package Targets === #

[[bin]]
name = "dokime-gui"
path = "src/main.rs"
test = false

# === Features === #

# Ships Inside The Desktop Installers, Not Through crates.io.
[features]
default = ["updater"]
updater = ["dep:tauri-plugin-updater"]
# Keep a Windows console attached for `tauri dev`; installer builds of any
# profile leave it off so the desktop never opens a terminal window.
console = []
custom-protocol = ["tauri/custom-protocol"]
# Private Native Delivery Port For The Tests Archive Only.
testing = []

# === Dependencies === #

[dependencies]
# Local
dokime-sdk = { package = "dokime", path = "../../../sdk/rust" }
dokime-runtime-next = { workspace = true }
dokime-protocol = { workspace = true }

# Git

# Error Handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-appender = { version = "0.2.5" }
tracing-subscriber = { workspace = true }

# Utilities
rand = { version = "0.10.3" }
sha2 = { workspace = true }
time = { version = "0.3.55", features = ["formatting", "parsing"] }
zeroize = { workspace = true }
# Storage Backups And Plugin Archives Use ZIP.
zip = { version = "9.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Serialization
base64 = { workspace = true }
prost = { workspace = true }
prost-reflect = { workspace = true }
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
serde = { workspace = true }
serde_json = { workspace = true }

# Configuration

# Filesystem
harmos-runtime = { workspace = true }
toml = { workspace = true }
tempfile = { workspace = true }

# Parsing
percent-encoding = { version = "2.3.2" }

# Concurrency

# Async
futures-util = { version = "0.3.34" }
tokio = { workspace = true, features = ["process"] }
tokio-stream = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }

# Networking
reqwest = { workspace = true }
rustls = { workspace = true, features = ["ring", "std"] }
tonic = { workspace = true, features = ["channel", "tls-ring", "tls-native-roots"] }
tonic-prost = { workspace = true }
url = { version = "2.5.8" }

# Storage

# UI
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = { version = "2.8.2" }
tauri-plugin-opener = { version = "2.7.1" }
tauri-plugin-updater = { version = "2.14.1", optional = true }

# Testing

# === Build Dependencies === #

[build-dependencies]
# Local

# Git

# Error Handling

# Logging

# Utilities

# Serialization
serde_json = { workspace = true }

# Configuration

# Filesystem

# Parsing

# Concurrency

# Async

# Networking

# Storage

# UI
tauri-build = { version = "2.7.2", features = [] }

# Testing

# === Dev Dependencies === #

[dev-dependencies]
# Local
dokime-storage = { workspace = true }

# Git

# Error Handling

# Logging

# Utilities

# Serialization
prost-types = { workspace = true }

# Configuration

# Filesystem
tar = { workspace = true }

# Parsing

# Concurrency

# Async
async-trait = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tokio-stream = { workspace = true, features = ["net"] }

# Networking
rcgen = { version = "0.14.10", features = ["x509-parser"] }

# Storage

# UI
tauri = { version = "2.12.5", features = ["test"] }

# Testing
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

# === Target Dependencies === #

[target.'cfg(windows)'.dependencies]
# Local

# Git

# Error Handling

# Logging

# Utilities
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security_Authorization",
  "Win32_System_Com",
  "Win32_UI_WindowsAndMessaging",
] }

# Serialization

# Configuration

# Filesystem

# Parsing

# Concurrency

# Async

# Networking

# Storage

# UI

# Testing

# === Test Targets === #

[[test]]
name = "integration"
path = "tests/integration/main.rs"
required-features = ["testing"]

[[test]]
name = "acceptance"
path = "tests/acceptance/main.rs"
required-features = ["testing"]

[[test]]
name = "system"
path = "tests/system/main.rs"
required-features = ["testing"]

# === Bench Targets === #

[[bench]]
name = "system-desktop"
path = "../benches/system/main.rs"
harness = false

