# === Package === #

[package]
name = "dokime-cli-next"
version.workspace = true
description = "Command-line interface to the independent Dokime host."
license.workspace = true
rust-version.workspace = true
publish = false
autotests = false
edition = "2024"

# === Package Targets === #

[[bin]]
name = "dokime-next"
path = "src/main.rs"

# === Features === #

# === Dependencies === #

[dependencies]
dokime = { version = "0.1.5", path = "../../sdk/rust" }
dokime-protocol = { workspace = true }
dokime-runtime-next = { workspace = true }
clap = { workspace = true }
prost = { workspace = true }
prost-reflect = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
tokio = { workspace = true, features = ["io-std", "process"] }
tokio-stream = { workspace = true }
toml = { workspace = true }
tonic = { workspace = true }
reqwest = { workspace = true }
tempfile = { workspace = true }
rustls = { workspace = true, features = ["ring"] }


# === Build Dependencies === #

# === Dev Dependencies === #

[dev-dependencies]
tempfile = { workspace = true }

# === Target Dependencies === #

# === Test Targets === #

[[test]]
name = "system"
path = "tests/system/main.rs"

# === Bench Targets === #

# === Example Targets === #

# === Workspace Lints === #

# === Lints === #

[lints]
workspace = true

# === Profiles === #

# === Patches === #

# === Other === #
