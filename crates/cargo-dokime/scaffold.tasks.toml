[tasks.dev]
description = "Rebuild And Reload The Plugin In A Development Host"
run = "cargo dokime dev"

[tasks.build]
description = "Build The Plugin And Its Frozen Catalog"
usage = 'flag "--profile <profile>" default="dev"'
tools = { "github:stokker-technologies/dokime" = { version = "0.1.0", matching_regex = "^cargo-dokime-", bin = "cargo-dokime" } }
run = "uv run --locked --project tools/python python -m project_tools.build.plugin --profile {{usage.profile}}"

[tasks."package:rust"]
description = "Package Rust"
usage = 'flag "--profile <profile>" default="dev"'
tools = { "github:stokker-technologies/dokime" = { version = "0.1.0", matching_regex = "^cargo-dokime-", bin = "cargo-dokime" } }
run = "uv run --locked --project tools/python python -m project_tools.package.plugin --profile {{usage.profile}}"

[tasks."release:publish"]
description = "Publish Through The Configured Native Release Policy"
run = [
  "uv run --locked --project tools/python python -m project_tools.release.run stage",
  "uv run --locked --project tools/python python -m project_tools.release.run publish",
  "uv run --locked --project tools/python python -m project_tools.release.run finalize",
]
