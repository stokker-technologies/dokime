[tasks.dev]
description = "Rebuild And Reload The Plugin In A Development Host"
run = "cargo dokime dev"

[tasks.build]
description = "Build The Plugin Bundle From The Shipping Compiler Output"
usage = 'flag "--profile <profile>" default="dev"'
run = "uv run --locked --project tools/python python -m project_tools.build.plugin build --profile {{usage.profile}}"

[tasks."package:rust"]
description = "Package Rust"
usage = 'flag "--profile <profile>" default="dev"'
run = "uv run --locked --project tools/python python -m project_tools.build.plugin package --profile {{usage.profile}}"

[tasks."release:publish"]
description = "Attach The Release Bundle To The Tagged Release"
run = '''
if [ -n "$GITHUB_ACTIONS" ]; then
  gh release create "$GITHUB_REF_NAME" target/package/release/*/rust/{{package}}.dokime --verify-tag
else
  glab release create "$CI_COMMIT_TAG" target/package/release/*/rust/{{package}}.dokime
fi
'''
shell = "bash -c"
