# === Package === #

[package]
name = "cargo-dokime"
publish = false
edition.workspace = true
rust-version.workspace = true
description = "Build, develop and inspect Dokime plugins"
license.workspace = true
repository.workspace = true
version = { workspace = true }

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }.zip"
pkg-fmt = "zip"

# === Package Targets === #

[[bin]]
name = "cargo-dokime"
path = "src/main.rs"
test = false

# === Features === #

# === Dependencies === #

[dependencies]
# Local
dokime = { workspace = true, features = ["terminal", "configuration"] }
dokime-packaging = { version = "0.1.2", path = "../dokime-packaging" }

# Git

# Error Handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Utilities
harmos-packaging = { workspace = true }
semver = { workspace = true }
sha2 = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml_edit = { workspace = true }

# Configuration
clap = { workspace = true }
dotenv = { workspace = true }

# Filesystem
glob = { workspace = true }
tempfile = { workspace = true }

# Parsing

# Concurrency

# Async
tokio = { workspace = true, features = ["process"] }

# Networking
url = { workspace = true }

