[package]
name = "cargo-dokime"
edition.workspace = true
rust-version.workspace = true
description = "Build, develop and inspect Dokime plugins"
license.workspace = true
repository.workspace = true
version = { workspace = true }

[dependencies]
# Local
dokime-contract = { path = "../dokime-contract" }
dokime-packaging = { path = "../dokime-packaging" }
dokime = { path = "../dokime" }

# Git
harmos = { workspace = true, features = ["plugin"] }

# Error Handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Utilities
semver = { workspace = true }
sha2 = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml_edit = { workspace = true }

# Configuration
clap = { workspace = true }
dotenv = { workspace = true }

# Filesystem
glob = { workspace = true }
tempfile = { workspace = true }

# Async
tokio = { workspace = true, features = ["process"] }

# Networking
url = { workspace = true }
