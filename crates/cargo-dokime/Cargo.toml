[package]
name = "cargo-dokime"
edition.workspace = true
rust-version.workspace = true
description = "Build, develop and inspect Dokime plugins"
license.workspace = true
repository.workspace = true
version = { workspace = true }

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }{ binary-ext }"
pkg-fmt = "bin"

[dependencies]
# Local
dokime-domain = { version = "0.1.0", path = "../dokime-domain" }
dokime-packaging = { version = "0.1.0", path = "../dokime-packaging" }
dokime = { version = "0.1.0", path = "../dokime" }

# Git
harmos = { workspace = true, features = ["plugin"] }
harmos-packaging = { workspace = true }

# Error Handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Utilities
semver = { workspace = true }
sha2 = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml_edit = { workspace = true }

# Configuration
clap = { workspace = true }
dotenv = { workspace = true }

# Filesystem
glob = { workspace = true }
tempfile = { workspace = true }

# Async
tokio = { workspace = true, features = ["process"] }

# Networking
url = { workspace = true }
