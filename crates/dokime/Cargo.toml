# === Package === #

[package]
name = "dokime"
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
version = { workspace = true }

# === Package Targets === #

# === Features === #

[features]
default = []
distribution = ["dep:flate2", "dep:harmos-packaging", "dep:sha2", "dep:tar", "dep:zip"]
plugin-sidecar = ["native", "derive"]
# Plugin Is An Alias For The Native Sidecar Authoring Surface.
plugin = ["plugin-sidecar"]
native = ["dokime-runtime/native"]
derive = ["dokime-runtime/derive"]
diagnostics = ["dokime-domain/diagnostics"]
storage = ["dokime-runtime/storage"]
configuration = ["dokime-runtime/configuration"]
fault-injection = ["dokime-runtime/fault-injection"]
fft = ["dokime-runtime/fft"]
media-native = ["dokime-runtime/media-native"]
simulation = ["dokime-runtime/simulation"]
client = ["dep:dokime-client", "dep:tokio"]
terminal = ["diagnostics", "dep:anstream", "dep:anstyle", "dep:indicatif"]

# === Dependencies === #

[dependencies]
# Local
dokime-client = { workspace = true, optional = true }
dokime-domain = { workspace = true }
dokime-runtime = { workspace = true }

# Git

# Error Handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Utilities
harmos-packaging = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

# Serialization
serde_json = { workspace = true }

# Configuration
clap = { workspace = true }

# Filesystem
flate2 = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
zip = { workspace = true, features = ["deflate-flate2-zlib-rs"], optional = true }

# Parsing

# Concurrency

# Async
tokio = { workspace = true, optional = true }

# Networking

# Storage

# UI
anstream = { workspace = true, optional = true }
anstyle = { workspace = true, optional = true }
indicatif = { workspace = true, optional = true }

# Testing

# === Build Dependencies === #

# === Dev Dependencies === #

[dev-dependencies]
