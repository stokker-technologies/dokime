[package]
name = "dokime"
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
version = { workspace = true }

[features]
default = ["native", "derive"]
native = [
  "harmos/plugin-sidecar",
  "dep:tokio",
  "dep:tokio-stream",
  "dep:tracing-subscriber",
  "dep:tracing-error",
]
# The authoring attributes, the way serde ships its derives. Traits are the API
# and the attributes are the derive path, so a plugin that writes `impl
# dokime::Observer` by hand compiles without them.
derive = ["dep:dokime-macros"]

storage = [
  "dep:base64",
  "dep:dokime-filesystem",
  "dep:futures-util",
  "dep:rusqlite",
  "dep:sha2",
  "dep:tempfile",
  "dep:tokio",
  "dep:uuid",
]

[dependencies]
# Local
dokime-contract = { path = "../dokime-contract" }
dokime-filesystem = { path = "../dokime-filesystem", optional = true }
dokime-macros = { path = "../dokime-macros", optional = true }

# Git
harmos = { workspace = true, features = ["plugin"] }

# Error Handling
thiserror = { workspace = true, default-features = true }

# Logging
tracing-error = { workspace = true, default-features = true, optional = true }
tracing = { workspace = true, default-features = true }
tracing-subscriber = { workspace = true, default-features = true, optional = true }

# Utilities
sha2 = { workspace = true, default-features = true, optional = true }
time = { workspace = true, default-features = true }
uuid = { workspace = true, default-features = true, optional = true }

# Serialization
base64 = { workspace = true, default-features = true, optional = true }
prost = { workspace = true, default-features = true }
serde = { workspace = true, default-features = true }
serde_json = { workspace = true, default-features = true, features = ["float_roundtrip"] }

# Filesystem
tempfile = { workspace = true, default-features = true, optional = true }

# Async
futures-util = { workspace = true, default-features = true, optional = true }
tokio = { workspace = true, default-features = true, optional = true }
tokio-stream = { workspace = true, default-features = true, features = ["sync"], optional = true }

# Networking

# Storage
rusqlite = { workspace = true, optional = true }

[dev-dependencies]
# Git
harmos = { workspace = true, features = ["plugin-sidecar"] }

# Serialization
arrow-schema = { workspace = true, default-features = true }
serde_json = { workspace = true, default-features = true }

# Filesystem
tempfile = { workspace = true, default-features = true }

# Async
tokio = { workspace = true, default-features = true, features = ["test-util"] }
