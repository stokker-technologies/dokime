[package]
name = "dokime"
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
version = { workspace = true }

[features]
default = []
plugin = ["native", "derive"]
native = ["dokime-runtime/native"]
derive = ["dokime-runtime/derive"]
diagnostics = ["dokime-domain/diagnostics"]
storage = ["dokime-runtime/storage"]
host = ["dokime-runtime/host"]
fault-injection = ["dokime-runtime/fault-injection"]
fft = ["dokime-runtime/fft"]
media-native = ["dokime-runtime/media-native"]
simulation = ["dokime-runtime/simulation"]
client = ["dep:dokime-client", "dep:dotenv", "dep:tokio", "dep:zeroize"]
terminal = ["diagnostics", "dep:anstream", "dep:anstyle", "dep:indicatif"]

[dependencies]
# Local
dokime-client = { workspace = true, optional = true }
dokime-domain = { workspace = true }
dokime-runtime = { workspace = true, default-features = false }

# Git
harmos = { workspace = true, features = ["plugin"] }
harmos-packaging = { workspace = true }

# Error Handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Utilities
zeroize = { workspace = true, optional = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Configuration
clap = { workspace = true }
dotenv = { workspace = true, optional = true }

# Filesystem
tempfile = { workspace = true }

# Async
tokio = { workspace = true, optional = true }

# UI
anstream = { workspace = true, optional = true }
anstyle = { workspace = true, optional = true }
indicatif = { workspace = true, optional = true }

[dev-dependencies]
# Filesystem
tempfile = { workspace = true }
