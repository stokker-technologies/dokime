syntax = "proto3";
package dokime.v1;
import "dokime/v1/common.proto";
import "dokime/v1/execution.proto";
service Observation {
  rpc WatchRuntime(WatchRuntimeRequest) returns (stream RuntimeStateFrame);
  // Streams the latest process-local progress for one execution. This is
  // operational state: it is coalesced, cleared at termination, and never
  // persisted as telemetry or report evidence.
  rpc WatchExecutionProgress(WatchExecutionProgressRequest) returns (stream ExecutionProgressFrame);
  // Returns a bounded cycle page at one exact runtime revision.
  rpc GetRuntimeShell(GetRuntimeShellRequest) returns (RuntimeShellSnapshot);
  // Returns the bounded, scope-aware current traceability projection. This is
  // a read of the current runtime state and never creates a checkpoint.
  rpc GetTraceability(GetTraceabilityRequest) returns (TraceabilityPage);
}
// This is a latest-state invalidation stream, not a durable event log. The
// initial frame always resynchronizes from current state. Subsequent frames may
// coalesce commits. Query cycle/catalog details after a frame as needed.
// A different epoch or a future position is rejected; reconnect without a cursor
// to explicitly resynchronize. Disconnect never cancels admitted execution.
message WatchRuntimeRequest { Cursor cursor = 1; }
message RuntimeStateFrame {
  Cursor cursor = 1;
  bool resynchronized = 2;
  bool shutting_down = 3;
  uint64 cycle_count = 4;
}

message WatchExecutionProgressRequest { string test_execution_id = 1; }

message ExecutionProgress {
  string test_execution_id = 1;
  string step_id = 2;
  string phase = 3;
  uint64 completed = 4;
  uint64 total = 5;
  uint64 elapsed_ms = 6;
  optional uint64 remaining_ms = 7;
}

message ExecutionProgressFrame {
  uint64 revision = 1;
  bool resynchronized = 2;
  ExecutionProgress progress = 3;
  bool cleared = 4;
}

message GetRuntimeShellRequest {
  // Zero selects the default page size (50); the maximum is 100.
  uint32 limit = 1;
  string after_cycle_id = 2;
  reserved 3, 4, 6, 7, 8;
  Cursor cursor = 5;
}

message RuntimeShellSnapshot {
  string session_id = 1;
  uint64 revision = 2;
  bool shutting_down = 3;
  Metadata hub_metadata = 4;
  uint64 test_suite_count = 5;
  repeated CycleSummary cycle_summaries = 6;
  reserved 7, 11, 12, 13;
  EvidenceCounts evidence_counts = 8;
  Cursor observed_cursor = 9;
  optional string next_after_cycle_id = 10;

}

message EvidenceCounts {
  uint64 records = 1;
  uint64 telemetry = 2;
  uint64 prompts = 3;
  uint64 artifacts = 4;
  uint64 health = 5;
  uint64 traceability = 6;
  uint64 notes = 7;
}

message GetTraceabilityRequest {
  // Absent selects all current traceability groups. A supplied scope selects
  // that scope and its visible ancestors/global values.
  EvidenceScope scope = 1;
  // Zero selects the default page size (50); the maximum is 100.
  uint32 limit = 2;
  // Continuations require the exact cursor returned by the preceding page.
  string after_traceability_id = 3;
  Cursor cursor = 4;
  // Continuations must echo the host telemetry fingerprint returned by the
  // preceding page; an empty-host fingerprint is still nonempty.
  string host_traceability_fingerprint = 5;
}

message TraceabilityPage {
  // The request scope is echoed so a consumer cannot accidentally apply a
  // response to another selected execution.
  EvidenceScope scope = 1;
  repeated TraceabilitySnapshot snapshots = 2;
  Cursor cursor = 3;
  string next_after_traceability_id = 4;
  bool complete = 5;
  // The source cut used for the host overlay. This binds continuations even
  // though host telemetry is stored outside the journal cursor.
  string host_traceability_fingerprint = 6;
}
