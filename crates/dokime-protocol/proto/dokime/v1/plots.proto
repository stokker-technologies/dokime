syntax = "proto3";
package dokime.v1;

import "dokime/v1/common.proto";
import "dokime/v1/catalog.proto";
import "dokime/v1/schema.proto";
import "dokime/v1/value.proto";

// Typed plot snapshots and live updates. A request is evaluated against the
// runtime's current evidence view; the cursor returned by an envelope is the
// only position a caller may use for a subsequent append request.
service Plots {
  rpc ListAnalyses(ListAnalysesRequest) returns (ListAnalysesReply);
  rpc QuerySnapshots(PlotSnapshotsRequest) returns (PlotSnapshotsReply);
  rpc Watch(PlotWatchRequest) returns (stream PlotStreamFrame);
}

// The native bridge and server reject a request with more than 32 plots. The
// reply contains repeated envelopes in one bounded message; callers must
// lower max_points or split a batch on exhaustion.
message PlotSnapshotsRequest { repeated PlotRequest requests = 1; }
message PlotSnapshotsReply { repeated PlotEnvelope envelopes = 1; }

// Watch is server-streaming. To change the request set, cancel this stream and
// open another one. Requests without a cursor receive an initial Snapshot
// before the watch begins; later frames are coalesced by the server at 100 ms
// only after a runtime state or telemetry watch advances.
message PlotWatchRequest { repeated PlotRequest requests = 1; }

message PlotRequest {
  optional string plot_id = 1;
  PlotType plot_type = 2;
  AxisScale x_scale = 3;
  AxisScale y_scale = 4;
  string stream = 5;
  repeated string y_keys = 6;
  repeated string marker_record_types = 7;
  repeated PlotFilter filters = 8;
  optional string x_key = 9;
  optional string series_by = 10;
  DataExpression x_expression = 11;
  repeated DataExpression y_expressions = 12;
  DataExpression series_by_expression = 13;
  optional string z_stream = 14;
  optional string z_field = 15;
  optional string unit = 16;
  optional uint64 max_points = 17;
  optional double window_s = 18;
  EvidenceScope scope = 19;
  PlotCursor cursor = 20;
  DownsampleTechnique technique = 21;
  DataExpression z_expression = 22;
  PlotFftOptions fft = 23;
  PlotIntervalOptions interval = 24;
  PlotHistogramOptions histogram = 25;
  AnalysisSelection analysis = 26;
}

message PlotFilter {
  DataExpression expression = 1;
  FilterOperator operator = 2;
  // Absent means the Exists operator. A present Value may explicitly be null.
  Value value = 3;
}

// Data expressions are deliberately structural. They cover the expression
// forms accepted by document plot descriptors without embedding JSON or a
// language-specific serialized AST.
message DataExpression {
  oneof source {
    TelemetryDataSource telemetry = 1;
    ParameterDataSource parameter = 2;
    DimensionDataSource dimension = 3;
    RecordDataSource record = 4;
    ArtifactDataSource artifact = 5;
  }
  repeated DataTransform transforms = 6;
  optional string label = 7;
}
message TelemetryDataSource { string stream = 1; string field = 2; }
message ParameterDataSource { string name = 1; }
message DimensionDataSource { string name = 1; }
message RecordDataSource { string record_type = 1; }
message ArtifactDataSource { string artifact = 1; }

message DataTransform {
  oneof kind {
    EmptyTransform count = 1;
    EmptyTransform mean = 2;
    EmptyTransform median = 3;
    EmptyTransform min = 4;
    EmptyTransform max = 5;
    TimeBetweenTransform time_between = 6;
    TelemetryAtOrBeforeTransform telemetry_at_or_before = 7;
    DetailTransform detail = 8;
    EmptyTransform per_case = 9;
  }
}
message EmptyTransform {}
message DetailTransform { string name = 1; }
message TimeBetweenTransform { string previous_record_type = 1; }
message TelemetryAtOrBeforeTransform {
  string stream = 1;
  string field = 2;
}

message PlotCursor {
  map<string, uint64> telemetry_streams = 1;
  optional uint64 record_sequence = 2;
  // Cursors are process-local. The backend rejects a cursor from another
  // runtime epoch or another plot selection instead of silently resuming it.
  string epoch = 3;
  string selection = 4;
}

message PlotEnvelope {
  string plot_id = 1;
  uint64 revision = 2;
  PlotCursor cursor = 3;
  PlotPayload payload = 4;
  PlotPayloadDiagnostics diagnostics = 5;
  repeated string warnings = 6;
}

message PlotStreamFrame {
  PlotStreamKind kind = 1;
  PlotEnvelope envelope = 2;
}

message PlotPayload {
  string stream = 1;
  string x_key = 2;
  optional string series_by = 3;
  ValueObject context = 4;
  repeated PlotSeries series = 5;
  PlotCartesianFrame cartesian = 6;
  repeated PlotMarker markers = 7;
  uint64 max_points = 8;
  optional double window_s = 9;
  string generated_at = 10;
  ValueFormat x_format = 11;
  // RFC3339, the origin `elapsed_since_run` counts from. Absent when this
  // payload was not built for one execution.
  optional string run_started_at = 12;
  // RFC3339, the origin `elapsed_since_cycle` counts from.
  optional string cycle_started_at = 13;
  PlotAnalysis analysis = 14;
  AnalysisComputation computed = 15;
}

message PlotCartesianFrame {
  PlotCartesianMode mode = 1;
  repeated PlotCartesianSeriesFrame series = 2;
  PlotDomain x_domain = 3;
  PlotDomain y_domain = 4;
  uint64 point_count = 5;
  string signature = 6;
}

message PlotCartesianSeriesFrame {
  repeated double x = 1;
  // A message wrapper preserves null y values without a NaN sentinel.
  repeated NullableNumber y = 2;
}
message NullableNumber { optional double value = 1; }
message PlotDomain { double min = 1; double max = 2; }

message PlotPayloadDiagnostics {
  uint64 series_count = 1;
  uint64 point_count = 2;
  uint64 raw_point_count = 3;
  bool downsampled = 4;
  bool delta = 5;
  uint64 max_points = 6;
  optional double window_s = 7;
}

message PlotSeries {
  string key = 1;
  string label = 2;
  optional string unit = 3;
  repeated PlotPoint points = 4;
  uint64 raw_points = 5;
  bool downsampled = 6;
  ValueFormat format = 7;
}

message PlotPoint {
  Value x = 1;
  optional double y = 2;
  optional double z = 3;
}

message PlotMarker {
  Value x = 1;
  string label = 2;
  string record_type = 3;
  string color = 4;
}

enum PlotType {
  PLOT_TYPE_UNSPECIFIED = 0;
  PLOT_TYPE_TIME_SERIES = 1;
  PLOT_TYPE_BAR = 2;
  PLOT_TYPE_GROUPED_BAR = 3;
  PLOT_TYPE_STACKED_BAR = 4;
  PLOT_TYPE_PIE = 5;
  PLOT_TYPE_DONUT = 6;
  PLOT_TYPE_PARETO = 7;
  PLOT_TYPE_XY_SCATTER = 8;
  PLOT_TYPE_XY_LINE = 9;
  PLOT_TYPE_XY_INTERVAL = 10;
  PLOT_TYPE_TRAJECTORY = 11;
  PLOT_TYPE_HEATMAP = 12;
  PLOT_TYPE_XY_VALUE_HEATMAP = 13;
  PLOT_TYPE_WIFI_CHANNEL_OCCUPANCY = 14;
  PLOT_TYPE_FREQUENCY_SERIES = 15;
  PLOT_TYPE_HISTOGRAM = 16;
  PLOT_TYPE_BOX_SUMMARY = 17;
  PLOT_TYPE_AGGREGATE_TABLE = 18;
}

enum AxisScale {
  AXIS_SCALE_UNSPECIFIED = 0;
  AXIS_SCALE_LINEAR = 1;
  AXIS_SCALE_LOG = 2;
}

enum DownsampleTechnique {
  DOWNSAMPLE_TECHNIQUE_UNSPECIFIED = 0;
  DOWNSAMPLE_TECHNIQUE_RAW = 1;
  DOWNSAMPLE_TECHNIQUE_MIN_MAX = 2;
  DOWNSAMPLE_TECHNIQUE_LTTB = 3;
}

enum FilterOperator {
  FILTER_OPERATOR_UNSPECIFIED = 0;
  FILTER_OPERATOR_EQ = 1;
  FILTER_OPERATOR_NE = 2;
  FILTER_OPERATOR_GT = 3;
  FILTER_OPERATOR_GTE = 4;
  FILTER_OPERATOR_LT = 5;
  FILTER_OPERATOR_LTE = 6;
  FILTER_OPERATOR_CONTAINS = 7;
  FILTER_OPERATOR_EXISTS = 8;
}

enum PlotStreamKind {
  PLOT_STREAM_KIND_UNSPECIFIED = 0;
  PLOT_STREAM_KIND_SNAPSHOT = 1;
  PLOT_STREAM_KIND_APPEND = 2;
  PLOT_STREAM_KIND_REPLACE = 3;
  PLOT_STREAM_KIND_ERROR = 4;
}

enum PlotCartesianMode {
  PLOT_CARTESIAN_MODE_UNSPECIFIED = 0;
  PLOT_CARTESIAN_MODE_ALIGNED = 1;
  PLOT_CARTESIAN_MODE_FACETED = 2;
}

message PlotFftOptions {
  optional double sample_rate_hz = 1;
  FftWindow window = 2;
  FftDetrend detrend = 3;
  FrequencyLevelUnit level_unit = 4;
  bool include_dc = 5;
  optional double min_frequency_hz = 6;
  optional double max_frequency_hz = 7;
}

message PlotIntervalOptions {
  double bin_width = 1;
  double sigma = 2;
  bool clip_to_observed = 3;
}

message PlotHistogramOptions {
  uint64 bins = 1;
  optional string unit = 2;
}

enum FftWindow {
  FFT_WINDOW_UNSPECIFIED = 0;
  FFT_WINDOW_HANN = 1;
  FFT_WINDOW_RECTANGULAR = 2;
}

enum FftDetrend {
  FFT_DETREND_UNSPECIFIED = 0;
  FFT_DETREND_NONE = 1;
  FFT_DETREND_MEAN = 2;
}

enum FrequencyLevelUnit {
  FREQUENCY_LEVEL_UNIT_UNSPECIFIED = 0;
  FREQUENCY_LEVEL_UNIT_LINEAR = 1;
  FREQUENCY_LEVEL_UNIT_DB = 2;
  FREQUENCY_LEVEL_UNIT_DBU = 3;
  FREQUENCY_LEVEL_UNIT_DBM = 4;
}

message PlotAnalysis {
  oneof result {
    PlotHistogramAnalysis histogram = 1;
    PlotBoxSummaryAnalysis box_summary = 2;
    PlotSigmaIntervalAnalysis sigma_interval = 3;
    PlotAnalysisError error = 4;
  }
}
message PlotAnalysisError { string message = 1; }
message PlotHistogramAnalysis { repeated PlotHistogramSeries series = 1; }
message PlotHistogramSeries {
  string key = 1;
  repeated PlotHistogramBin bins = 2;
  uint64 count = 3;
  PlotHistogramStatistics statistics = 4;
}
message PlotHistogramStatistics {
  double mean = 1;
  double median = 2;
  double std = 3;
  double rms = 4;
  double min = 5;
  double max = 6;
}
message PlotHistogramBin { double lower = 1; double upper = 2; uint64 count = 3; }
message PlotBoxSummaryAnalysis { repeated PlotBoxSummary series = 1; }
message PlotBoxSummary {
  string key = 1;
  uint64 count = 2;
  double min = 3;
  double q1 = 4;
  double median = 5;
  double q3 = 6;
  double max = 7;
  double lower_whisker = 8;
  double upper_whisker = 9;
  repeated double outliers = 10;
  string label = 11;
}
message PlotSigmaIntervalAnalysis { repeated PlotSigmaSeries series = 1; }
message PlotSigmaSeries { string key = 1; repeated PlotSigmaBin bins = 2; }
message PlotSigmaBin {
  double x = 1;
  uint64 count = 2;
  double mean = 3;
  double lower = 4;
  double upper = 5;
}

// Analysis IDs Are Open; Each Contribution Declares Its Parameters And Outputs.
message ListAnalysesRequest { uint32 limit = 1; string after_id = 2; }
message ListAnalysesReply { repeated AnalysisDefinition definitions = 1; optional string next_after_id = 2; }
message AnalysisDefinition {
  string id = 1;
  uint32 version = 2;
  string label = 3;
  string description = 4;
  repeated ParameterSchema parameters = 5;
  repeated AnalysisOutput outputs = 6;
  uint32 max_samples = 7;
  uint32 max_output_values = 8;
}
message AnalysisOutput { string key = 1; string label = 2; optional string unit = 3; AnalysisAxis axis = 4; }
message AnalysisAxis { string key = 1; optional string unit = 2; }
message AnalysisSelection { string id = 1; uint32 version = 2; ValueObject parameters = 3; }
message AnalysisComputation {
  AnalysisDefinition definition = 1;
  AnalysisSelection selection = 2;
  AnalysisEvidence source = 3;
  repeated AnalysisSeries series = 4;
}
message AnalysisEvidence {
  string epoch = 8;
  string stream = 1;
  EvidenceScope scope = 2;
  map<string, uint64> telemetry_streams = 3;
  optional uint64 record_sequence = 4;
  optional double window_s = 5;
  repeated string fields = 6;
  string x_key = 7;
}
message AnalysisSeries {
  string key = 1;
  string label = 2;
  optional string origin = 3;
  uint64 input_samples = 4;
  double first_axis = 5;
  double last_axis = 6;
  repeated AnalysisValues outputs = 7;
}
// Numeric Payloads Stay Numeric On The Wire, Including Custom Results.
message AnalysisValues {
  string key = 1;
  string unit = 2;
  string axis_unit = 3;
  repeated double axis = 4;
  repeated double values = 5;
  // Optional display selection into the complete scientific arrays.
  repeated uint32 display_indices = 6;
}
