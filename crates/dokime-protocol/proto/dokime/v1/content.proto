syntax = "proto3";
package dokime.v1;
import "google/protobuf/timestamp.proto";
import "dokime/v1/appearance.proto";

// References identify backend-owned content, never client filesystem paths.
service Content {
  rpc DownloadAppearanceAsset(DownloadAppearanceAssetRequest) returns (stream AppearanceAssetFrame);
  rpc ListExecutionFiles(ListExecutionFilesRequest) returns (ListExecutionFilesReply);
  rpc ReadExecutionFile(ReadExecutionFileRequest) returns (ExecutionFileWindow);
  rpc DownloadExecutionFile(DownloadExecutionFileRequest) returns (stream ExecutionFileDownloadFrame);
  rpc ListArtifacts(ListArtifactsRequest) returns (ListArtifactsReply);
  rpc DownloadArtifact(DownloadArtifactRequest) returns (stream ArtifactFrame);
  // Uploads one immutable artifact into the runtime's active execution. The
  // first frame is a header and the remaining frames are contiguous chunks;
  // end of stream commits the runtime upload.
  rpc UploadArtifact(stream UploadArtifactFrame) returns (ArtifactMetadata);
  // Captures the selected cycle's export and streams the resulting ZIP.
  rpc DownloadCycleBundle(DownloadCycleBundleRequest) returns (stream CycleBundleFrame);
  // Returns the runtime-owned cycle folder for the local desktop opener.
  // Remote listeners reject this method because it exposes a host path.
  rpc GetCycleFolderPath(GetCycleFolderPathRequest) returns (LocalPathResponse);
}
// Metadata-only inventory for operator views. Entries are ordered by artifact
// ID. A continuation is valid only while the runtime epoch and complete
// metadata fingerprint remain unchanged.
message ListArtifactsRequest {
  uint32 limit = 1;
  string after_artifact_id = 2;
  ArtifactCursor cursor = 3;
}
message ArtifactCursor {
  string epoch = 1;
  bytes metadata_sha256 = 2;
}
message ListArtifactsReply {
  repeated ArtifactMetadata artifacts = 1;
  optional string next_after_artifact_id = 2;
  ArtifactCursor cursor = 3;
}
message DownloadArtifactRequest { string artifact_id = 1; }
message ArtifactScope {
  optional string cycle_id = 1;
  optional string case_id = 2;
  // Captured artifacts carry their owning execution.
  optional string execution_id = 3;
}
message ArtifactMetadata {
  string artifact_id = 1;
  string upload_id = 2;
  ArtifactScope scope = 3;
  string filename = 4;
  optional string content_type = 5;
  uint64 size_bytes = 6;
  // Exactly 64 lowercase hexadecimal characters.
  string sha256 = 7;
  ArtifactState state = 8;
  google.protobuf.Timestamp created_at = 9;
}
enum ArtifactState {
  ARTIFACT_STATE_UNSPECIFIED = 0;
  ARTIFACT_STATE_COMPLETE = 1;
  ARTIFACT_STATE_CANCELLED = 2;
  ARTIFACT_STATE_REJECTED = 3;
}
// One metadata frame, contiguous chunks bounded by the listener's configured
// transfer size starting at offset 0, then one completion frame. An immutable
// checkpoint is pinned for the stream.
// Cancelled/rejected artifacts may contain partial evidence; their state remains
// explicit. Completion verifies the stored length and digest, and must be
// followed by an OK gRPC final status before the consumer accepts the transfer.
message ArtifactFrame {
  oneof payload {
    ArtifactMetadata metadata = 1;
    ArtifactChunk chunk = 2;
    ArtifactCompletion complete = 3;
  }
}
message ArtifactChunk { uint64 offset = 1; bytes data = 2; }
message ArtifactCompletion { uint64 size_bytes = 1; string sha256 = 2; }

// The first upload frame must carry the header. Every later frame must carry
// either a non-empty chunk with the next expected offset or the terminal
// completion frame; no frame may follow completion. The server caps chunks at
// 1 MiB. The header's digest is optional: the terminal completion frame
// carries the authoritative size and sha256, verified against the bytes
// actually received before the upload commits. Uploads have no resumable
// session or idempotency key; callers must not retry a stream automatically
// after an uncertain disconnect.
message UploadArtifactFrame {
  oneof payload {
    UploadArtifactHeader header = 1;
    ArtifactChunk chunk = 2;
    ArtifactCompletion complete = 3;
  }
}
message UploadArtifactHeader {
  ArtifactScope scope = 1;
  string filename = 2;
  optional string content_type = 3;
  uint64 size_bytes = 4;
  optional string sha256 = 5;
}

message DownloadCycleBundleRequest { string cycle_id = 1; }
message CycleBundleFrame {
  oneof payload {
    CycleBundleMetadata metadata = 1;
    ArtifactChunk chunk = 2;
    ArtifactCompletion complete = 3;
  }
}
message CycleBundleMetadata {
  string cycle_id = 1;
  string filename = 2;
  string content_type = 3;
  uint64 size_bytes = 4;
  // Exactly 64 lowercase hexadecimal characters.
  string sha256 = 5;
}

message GetCycleFolderPathRequest { string cycle_id = 1; }
message LocalPathResponse { string path = 1; }


// Files currently owned by an execution in this runtime. These logical names
// select registered outputs; they never resolve arbitrary filesystem paths.
// Listings are ordered by relative_path. A continuation binds to execution,
// runtime epoch and metadata fingerprint; changed listings require a restart.
message ListExecutionFilesRequest {
  string execution_id = 1; uint32 limit = 2; string after_path = 3;
  ExecutionFilesCursor cursor = 4;
}
message ExecutionFilesCursor { string epoch = 1; string execution_id = 2; bytes metadata_sha256 = 3; }
message ListExecutionFilesReply {
  repeated ExecutionFileMetadata files = 1; optional string next_after_path = 2;
  ExecutionFilesCursor cursor = 3;
}
message ExecutionFileMetadata {
  string relative_path = 1; optional string content_type = 2;
  ExecutionFileKind kind = 3; ExecutionFileState state = 4;
  uint64 size_bytes = 5; google.protobuf.Timestamp created_at = 6;
}
// A bounded read for live previews/tailing, not an immutable full-file download.
// A native producer may rewrite/truncate a streaming file between or during
// reads. Each window reports its actual offset and observed length. An offset
// past the current end is clamped to that end. max_bytes defaults to 64 KiB and
// must not exceed 64 KiB. No EOF/finality is implied by an empty streaming window.
message ReadExecutionFileRequest { string execution_id = 1; string relative_path = 2; uint64 offset = 3; uint32 max_bytes = 4; }
message ExecutionFileWindow {
  string relative_path = 1; optional string content_type = 2;
  ExecutionFileKind kind = 3; ExecutionFileState state = 4;
  uint64 offset = 5; uint64 observed_size_bytes = 6; bytes data = 7;
}
enum ExecutionFileKind { EXECUTION_FILE_KIND_UNSPECIFIED = 0; EXECUTION_FILE_KIND_TEXT = 1; EXECUTION_FILE_KIND_BINARY = 2; EXECUTION_FILE_KIND_MEDIA = 3; EXECUTION_FILE_KIND_UNKNOWN = 4; }
enum ExecutionFileState { EXECUTION_FILE_STATE_UNSPECIFIED = 0; EXECUTION_FILE_STATE_STREAMING = 1; EXECUTION_FILE_STATE_FINALIZED = 2; EXECUTION_FILE_STATE_INTERRUPTED = 3; }

// Opens one admitted output on its original saved view or active producer inode.
// Saved reads verify the frozen descriptor length and digest. Live reads stop at
// the observed prefix; producer rewrites may make that read fail. Each original
// charged chunk is encoded before the next read. Completion describes bytes
// actually delivered. Consumers verify offsets, size, digest and final OK status.
message DownloadExecutionFileRequest { string execution_id = 1; string relative_path = 2; }
message ExecutionFileDownloadFrame {
  oneof payload {
    ExecutionFileDownloadMetadata metadata = 1;
    ArtifactChunk chunk = 2;
    ArtifactCompletion complete = 3;
  }
}
message ExecutionFileDownloadMetadata {
  string relative_path = 1; optional string content_type = 2;
  ExecutionFileKind kind = 3; ExecutionFileState state = 4;
  uint64 observed_size_bytes = 5;
}

// At most 8 MiB per registered appearance asset. Capture and verify before
// streaming: one metadata frame, contiguous <=64 KiB chunks, completion and OK
// final status. A changed/missing reference requires refreshing GetAppearance.
message DownloadAppearanceAssetRequest { AppearanceAssetReference reference = 1; }
message AppearanceAssetFrame {
  oneof payload {
    AppearanceAssetMetadata metadata = 1;
    ArtifactChunk chunk = 2;
    ArtifactCompletion complete = 3;
  }
}
