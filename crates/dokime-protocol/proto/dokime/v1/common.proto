syntax = "proto3";
package dokime.v1;

import "dokime/v1/value.proto";
import "google/protobuf/timestamp.proto";

message Metadata {
  string identifier = 1;
  string label = 2;
  optional string description = 3;
  repeated string tags = 4;
  map<string, Value> attributes = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

// A process-local position, never a durable checkpoint identity. Consumers
// must reject a different epoch instead of treating the position as resumable.
message Cursor {
  string epoch = 1;
  // Identifies the ordered journal/stream, including its selection.
  string stream = 2;
  uint64 position = 3;
}

enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_TRACE = 1;
  SEVERITY_DEBUG = 2;
  SEVERITY_INFO = 3;
  SEVERITY_WARN = 4;
  SEVERITY_ERROR = 5;
}

// Backend-owned evidence scope. Identifiers are not client filesystem paths.
message EvidenceScope {
  optional string session_id = 1;
  optional string cycle_id = 2;
  optional string case_id = 3;
  optional string execution_id = 4;
  optional string step_id = 5;
  optional string criterion_id = 6;
  optional string template_id = 7;
  optional string suite_id = 8;
  EvidenceOrigin origin = 9;
}

// Execution admission attribution; producer occurrence and capture times stay separate.
message EvidenceOrigin {
  oneof kind {
    bool default = 1;
    bool initialization = 2;
    string step_attempt_id = 3;
    bool cleanup = 4;
  }
}

// A current or historical traceability group. The snapshot retains the
// authored entry metadata, value and provenance source; consumers must not
// reconstruct provenance from the display label.
message TraceabilitySnapshot {
  string traceability_id = 1;
  EvidenceScope scope = 2;
  google.protobuf.Timestamp created_at = 3;
  repeated TraceabilityEntry entries = 4;
  // What this group is, when something said so. A template states its
  // traceability as labelled sections and a section is a group, so the label
  // travels with it; the groups the runtime derives on its own carry none.
  optional Metadata metadata = 5;
}
message TraceabilityEntry {
  Metadata metadata = 1;
  Value value = 2;
  optional string source = 3;
  // The unit the value is stated in, for a value that has one.
  optional string unit = 4;
}

// The whole story behind one failure: the message an operator reads, the cause
// chain beneath it, where it was captured, the spans it happened inside, and
// the frames a maintainer needs. Redacted before it is stored, so no absolute
// home directory or account name ever reaches a consumer.
message Diagnostic {
  string message = 1;
  repeated string chain = 2;
  string location = 3;
  repeated string span_trace = 4;
  string backtrace = 5;
}
