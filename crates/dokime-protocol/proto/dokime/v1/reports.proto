syntax = "proto3";
package dokime.v1;

import "dokime/v1/checkpoint.proto";
import "dokime/v1/common.proto";
import "google/protobuf/timestamp.proto";

// Reports stream the exact saved HTML referenced by a native cycle seal.
service Reports {
  rpc DownloadCycleReport(DownloadCycleReportRequest) returns (stream ReportHtmlFrame);
  rpc RenderCheckpointReport(RenderCheckpointReportRequest) returns (RenderedReport);
}

message DownloadCycleReportRequest {
  // Canonical UUID of a saved cycle.
  string cycle_id = 1;
  string identifier = 2;
}
message RenderCheckpointReportRequest {
  ExecutionCheckpoint context = 1;
  repeated ExecutionCheckpoint checkpoints = 2;
  string identifier = 3;
}

// Legacy preview response shape. Native storage does not implement rerendering.
message RenderedReport {
  string identifier = 1;
  Metadata metadata = 2;
  google.protobuf.Timestamp generated_at = 3;
  repeated string warnings = 4;
  string html = 5;
}
message ReportMetadata {
  string test_cycle_id = 1;
  string identifier = 2;
  Metadata metadata = 3;
  google.protobuf.Timestamp generated_at = 4;
  repeated string warnings = 5;
}
// Accept the download only after completion and a successful final status.
message ReportHtmlFrame {
  oneof payload {
    ReportMetadata report = 1;
    ReportHtmlChunk chunk = 2;
    ReportHtmlCompletion complete = 3;
  }
}
message ReportHtmlChunk { uint64 offset = 1; bytes data = 2; }
message ReportHtmlCompletion {
  uint64 size_bytes = 1;
  // SHA-256 of exactly the bytes delivered by preceding chunks.
  string sha256 = 2;
}
