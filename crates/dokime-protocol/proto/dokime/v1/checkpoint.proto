syntax = "proto3";
package dokime.v1;

// Exact inspected sealed revision and captured evidence in one native history.
// Reading this identity never creates or publishes a newer checkpoint.
message ExecutionCheckpoint {
  reserved 1, 2, 4, 5;
  reserved "dataset", "revision", "execution_version", "evidence_versions";
  string execution_identifier = 3;
  StorageCursor position = 6;
  // Original opaque Harmos ObjectVersionToken protobuf bytes.
  bytes version = 7;
  StorageCursor evidence_through = 8;
}

message StorageCursor {
  StoreHistory history = 1;
  uint64 sequence = 2;
}

message StoreHistory {
  string store = 1;
  string epoch = 2;
}
