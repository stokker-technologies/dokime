syntax = "proto3";
package dokime.v1;

import "dokime/v1/value.proto";

// Typed aggregate reads over original native saved revisions. One generalized operation
// replaces per-question statistics RPCs: a caller names a source table, the
// filters that narrow it, the columns it groups by and the aggregates it wants.
//
// This is not a SQL or JSON tunnel. Every element is an explicit enum or a
// column name checked against the source's own schema; an unknown source or
// column is rejected with InvalidArgument naming the columns that exist.
service Query {
  // Read-only and idempotent. Requires the read role; no capability beyond the
  // one every other read method uses. Replies are bounded by `limit` and by a
  // server ceiling of 10,000 rows, and additionally by the negotiated gRPC
  // message limit — a reply that would exceed it fails with ResourceExhausted
  // rather than being silently truncated. Safe to retry: the call has no
  // effect, and repeating it observes the original saved frontier selected for that call.
  //
  // Coverage: objects contribute their latest logical revision at this call's
  // original saved frontier. Steps use each execution's frozen case snapshot;
  // records retain their original journal sequence and process identity.
  // Staged evidence is absent until saved. Planned executions with no saved
  // revision and executions retired by deletion are absent.
  // Page decode, reduction, outcome projection and canonical response encoding
  // share the original query's configured decoded allowance and active-time
  // budget. The response retains its original loan through transport encoding.
  rpc Aggregate(AggregateRequest) returns (AggregateReply);
}

// A zero limit means the server ceiling of 10,000 rows. Larger values are
// clamped to it rather than rejected. `group_by` may be empty, which
// aggregates the whole filtered selection into a single row. `aggregates` must
// name at least one output.
message AggregateRequest {
  QuerySource source = 1;
  repeated QueryFilter filters = 2;
  repeated string group_by = 3;
  repeated QueryAggregate aggregates = 4;
  uint32 limit = 5;
}

// Native saved sources a caller may aggregate. Telemetry samples retain their
// declared-schema reader through Telemetry.ListSamples.
enum QuerySource {
  QUERY_SOURCE_UNSPECIFIED = 0;
  QUERY_SOURCE_CYCLES = 1;
  QUERY_SOURCE_CASES = 2;
  QUERY_SOURCE_EXECUTIONS = 3;
  // Step evidence joined to its execution and that execution's frozen case, so
  // template and execution-level questions are expressible without a
  // client-side join. Beside the stored step columns this source carries
  // `template_identifier`, `execution_status`, `cycle_identifier` and the
  // derived `duration_ms` (float milliseconds, null unless the step has both
  // `started_at` and `finished_at`).
  QUERY_SOURCE_STEPS = 4;
  QUERY_SOURCE_RECORDS = 5;
}

// `values` carries exactly one value for EQ, NEQ, GT, GTE, LT and LTE, one or
// more for IN, and none for IS_NULL. Values are compared against the column's
// own type; a value that cannot be coerced to it is rejected.
message QueryFilter {
  string column = 1;
  QueryFilterOperator op = 2;
  repeated Value values = 3;
}

// Named for its service: `FilterOperator` already belongs to the plot
// contract, and enum value names are siblings of their type in one package.
enum QueryFilterOperator {
  QUERY_FILTER_OPERATOR_UNSPECIFIED = 0;
  QUERY_FILTER_OPERATOR_EQ = 1;
  QUERY_FILTER_OPERATOR_NEQ = 2;
  QUERY_FILTER_OPERATOR_IN = 3;
  QUERY_FILTER_OPERATOR_GT = 4;
  QUERY_FILTER_OPERATOR_GTE = 5;
  QUERY_FILTER_OPERATOR_LT = 6;
  QUERY_FILTER_OPERATOR_LTE = 7;
  QUERY_FILTER_OPERATOR_IS_NULL = 8;
}

// COUNT with an empty column counts rows; COUNT with a column counts its
// non-null values. SUM, MEAN, MIN and MAX require a column. Null inputs are
// skipped by every function, so MEAN over a nullable column is the mean of the
// rows that have a value. `alias` names the output column and must be unique
// across the request and distinct from every `group_by` name.
message QueryAggregate {
  AggregateFunction function = 1;
  string column = 2;
  string alias = 3;
}

enum AggregateFunction {
  AGGREGATE_FUNCTION_UNSPECIFIED = 0;
  AGGREGATE_FUNCTION_COUNT = 1;
  AGGREGATE_FUNCTION_SUM = 2;
  AGGREGATE_FUNCTION_MEAN = 3;
  AGGREGATE_FUNCTION_MIN = 4;
  AGGREGATE_FUNCTION_MAX = 5;
}

// `columns` lists the group-by names in request order followed by the aggregate
// aliases in request order; every row has exactly that many values in that
// order. `complete` is false when the selection had more groups than the
// effective limit returned.
message AggregateReply {
  repeated string columns = 1;
  repeated QueryRow rows = 2;
  bool complete = 3;
}

message QueryRow { repeated Value values = 1; }
