syntax = "proto3";
package dokime.v1;

import "dokime/v1/appearance.proto";
import "dokime/v1/catalog.proto";
import "dokime/v1/checkpoint.proto";
import "dokime/v1/common.proto";
import "dokime/v1/content.proto";
import "dokime/v1/documents.proto";
import "dokime/v1/evidence.proto";
import "dokime/v1/execution.proto";
import "dokime/v1/notes.proto";
import "dokime/v1/prompts.proto";
import "dokime/v1/plots.proto";
import "dokime/v1/schema.proto";
import "dokime/v1/telemetry.proto";
import "dokime/v1/value.proto";
import "google/protobuf/timestamp.proto";

// Immutable execution history. Every checkpoint read opens the supplied
// native revision and evidence cut through one saved view; it never publishes live state.
service History {
  rpc BrowseExecutions(BrowseExecutionsRequest) returns (ExecutionBrowsePage);
  // Bounded inspection of one existing saved seal; never flushes or publishes.
  // NOT_FOUND means no saved seal is available, including an unsealed row.
  rpc GetExecutionCheckpoint(GetExecutionCheckpointRequest) returns (ExecutionCheckpoint);
  rpc DeleteExecution(DeleteExecutionRequest) returns (DeleteExecutionResponse);
  rpc GetCheckpointDocument(GetCheckpointDocumentRequest) returns (CheckpointDocument);
  rpc GetCheckpointEvidence(GetCheckpointEvidenceRequest) returns (CheckpointEvidence);
  rpc ReadCheckpointOutput(ReadCheckpointOutputRequest) returns (CheckpointFileWindow);
  rpc DownloadCheckpointArtifact(DownloadCheckpointArtifactRequest) returns (stream ArtifactFrame);
  rpc ListCheckpointRecords(ListCheckpointRecordsRequest) returns (CheckpointRecordPage);
  rpc ListCheckpointTelemetry(ListCheckpointTelemetryRequest) returns (CheckpointTelemetryPage);
  rpc GetCheckpointContext(GetCheckpointContextRequest) returns (CheckpointContext);
}

message GetExecutionCheckpointRequest { string execution_identifier = 1; }

// Permanently delete one sealed historical execution. The caller supplies a
// stable request identifier so a retry can identify the accepted deletion.
message DeleteExecutionRequest {
  ExecutionCheckpoint checkpoint = 1;
  string request_identifier = 2;
}
message DeleteExecutionResponse {
  string request_identifier = 1;
  string execution_identifier = 2;
  bool local_complete = 3;
}

// Server-side selection and ordering for the merged execution browse.
//
// `text` matches an entry's title, its execution identifier and its suite
// label case-insensitively; an empty string selects everything. Repeated
// fields are disjunctive within themselves and conjunctive with the other
// fields, and an empty repeated field is no constraint. The timestamp range is
// inclusive and compares `started_at`; an entry that has not started is
// excluded by either bound.
message ExecutionFilter {
  string text = 1;
  repeated ExecutionStatus statuses = 2;
  repeated string template_ids = 3;
  repeated string cycle_ids = 4;
  optional google.protobuf.Timestamp started_after = 5;
  optional google.protobuf.Timestamp started_before = 6;
}
// The requested order key. Ordering is always total: the key, then the
// execution ID ascending, so equal keys never permute between pages. An
// unspecified key is STARTED_AT. TITLE compares the case-folded title. An
// absent timestamp sorts after every present one in ascending order.
enum ExecutionOrderKey {
  EXECUTION_ORDER_KEY_UNSPECIFIED = 0;
  EXECUTION_ORDER_KEY_STARTED_AT = 1;
  EXECUTION_ORDER_KEY_FINISHED_AT = 2;
  EXECUTION_ORDER_KEY_TITLE = 3;
}
message ExecutionOrder { ExecutionOrderKey key = 1; bool descending = 2; }
// `filter` and `order` must be repeated unchanged on every continuation, and
// `after_execution_id` must still be a member of the filtered result. A
// changed selection, a changed order, or a continuation ID the filter excludes
// is rejected rather than silently restarted.
message BrowseExecutionsRequest {
  uint32 limit = 1;
  string after_execution_id = 2;
  ExecutionFilter filter = 3;
  ExecutionOrder order = 4;
}
message ExecutionBrowsePage {
  repeated ExecutionBrowseEntry entries = 1;
  optional string next_after_execution_id = 2;
  bool discovery_complete = 3;
  repeated string conflicts = 4;
  uint32 omitted_conflicts = 5;
  repeated HistoryIssue issues = 6;
  uint32 omitted_issues = 7;
}
message ExecutionBrowseEntry {
  HistoricalExecutionMetadata metadata = 1;
  ExecutionCheckpoint checkpoint = 2;
  ExecutionAvailability availability = 3;
}
message HistoricalExecutionMetadata {
  string execution_id = 1;
  optional string cycle_id = 2;
  string case_id = 3;
  string title = 4;
  ExecutionStatus status = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp finished_at = 7;
  ResultSummary result = 8;
  // The frozen case template and admitted suite label this entry belongs to,
  // so a client can read back what `ExecutionFilter` selected on. Absent when
  // the stored row no longer resolves its case or suite revision.
  optional string template_id = 9;
  optional string suite_label = 10;
}
enum ExecutionAvailability {
  EXECUTION_AVAILABILITY_UNSPECIFIED = 0;
  EXECUTION_AVAILABILITY_LIVE = 1;
  EXECUTION_AVAILABILITY_STORED = 2;
  EXECUTION_AVAILABILITY_INTERRUPTED = 3;
  EXECUTION_AVAILABILITY_UNCHECKPOINTED = 4;
}
message HistoryIssue {
  optional string source = 1;
  optional string dataset = 2;
  string message = 3;
}

message GetCheckpointDocumentRequest { ExecutionCheckpoint checkpoint = 1; }
message CheckpointDocument {
  ExecutionCheckpoint checkpoint = 1;
  HistoricalExecutionDocument document = 2;
  bool acquisition_finished = 3;
}
message HistoricalExecutionDocument {
  HistoricalExecutionCycle cycle = 1;
  HistoricalTestExecution execution = 2;
}
message HistoricalExecutionCycle { string cycle_id = 1; Metadata metadata = 2; }
message HistoricalTestExecution {
  string execution_id = 1;
  string case_id = 2;
  Metadata suite = 3;
  ExecutionStatus status = 4;
  EvidenceScope scope = 5;
  HistoricalExecutionSnapshot snapshot = 6;
  repeated MaterializedParameter output_parameters = 7;
  repeated HistoricalDocument documents = 8;
  repeated HealthItem health = 9;
  repeated OperatorNote notes = 10;
  google.protobuf.Timestamp started_at = 11;
  google.protobuf.Timestamp finished_at = 12;
  repeated HistoricalStep steps = 13;
  ResultSummary result = 14;
  ExecutionInvalidation invalidation = 15;
  repeated HistoricalStepAttempt step_attempts = 16;
  HistoricalStepAttemptStart active_step_attempt = 17;
  ExecutionMode mode = 18;
}

message HistoricalStepAttemptStart {
  string attempt_id = 1;
  string step_id = 2;
  google.protobuf.Timestamp started_at = 3;
}

message HistoricalStepAttempt {
  string attempt_id = 1;
  string step_id = 2;
  google.protobuf.Timestamp started_at = 3;
  google.protobuf.Timestamp finished_at = 4;
  StepTermination termination = 5;
  Diagnostic detail = 6;
}
enum StepTermination {
  STEP_TERMINATION_UNSPECIFIED = 0;
  STEP_TERMINATION_COMPLETED = 1;
  STEP_TERMINATION_FAILED = 2;
  STEP_TERMINATION_CANCELLED = 3;
  STEP_TERMINATION_INTERRUPTED = 4;
}
message HistoricalExecutionSnapshot {
  Metadata suite = 1;
  optional string template_id = 2;
  Metadata template = 3;
  ExecutionPluginIdentity plugin = 4;
  repeated ParameterSchema parameter_definitions = 5;
  repeated MaterializedParameter parameters = 6;
  repeated HistoricalDocument documents = 7;
  reserved 8; // Ordinary inputs are materialized parameters.
  // Captured at admission; never reconstructed from the current suite catalog.
  HistoricalCaseDefinition case_definition = 9;
  optional string host_version = 10;
}
message HistoricalCaseDefinition {
  string case_id = 1;
  string template_id = 2;
  Metadata metadata = 3;
  Metadata suite = 4;
  repeated CaseParameter parameters = 5;
  uint64 generation_index = 6;
  string suite_id = 7;
}
message HistoricalStep {
  string step_id = 1;
  Metadata metadata = 2;
  StepStatus status = 3;
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp finished_at = 5;
  repeated StepMeasurement measurements = 6;
  repeated StepCriterion criteria = 7;
}

// A historical document retains the standard presentation header and the
// authored layout/card identities. Payload data remains owned by the relevant
// evidence APIs, as it is for current DocumentFrame streams.
message HistoricalDocument {
  DocumentHeader presentation = 1;
  repeated DocumentLayoutNode layout_nodes = 2;
  repeated HistoricalDocumentCard cards = 3;
  repeated DocumentTableRow table_rows = 4;
}

// Historical cards carry authored definitions in addition to the shared
// presentation/layout vocabulary. A checkpoint must remain renderable after
// the live suite registry has changed, so plot and summary configuration is
// explicit rather than reduced to an owner reference or fabricated defaults.
message HistoricalDocumentCard {
  Metadata metadata = 1;
  repeated HistoricalDocumentFilter filters = 2;
  oneof body {
    string markdown = 3;
    DocumentTable table = 4;
    HistoricalTelemetrySummary summary = 5;
    DocumentPlotDefinition plot = 6;
    DocumentOwnerReference owner = 7;
  }
}
message HistoricalTelemetrySummary { repeated HistoricalSummaryGroup groups = 1; }
message HistoricalSummaryGroup {
  Metadata metadata = 1;
  repeated HistoricalSummaryTile tiles = 2;
}
message HistoricalSummaryTile {
  Metadata metadata = 1;
  DataExpression value = 2;
  repeated HistoricalDocumentFilter filters = 3;
  DocumentSummaryStat stat = 4;
  DocumentSummaryFormat format = 5;
  DocumentSummaryPresentation presentation = 6;
  optional string unit = 7;
  repeated HistoricalSummaryCondition conditions = 8;
}
message HistoricalSummaryCondition {
  FilterOperator operator = 1;
  Value value = 2;
  DocumentSummaryState state = 3;
}

message HistoricalDocumentFilter {
  DataExpression expression = 1;
  FilterOperator operator = 2;
  Value value = 3;
}

message GetCheckpointEvidenceRequest {
  ExecutionCheckpoint checkpoint = 1;
  repeated EvidenceSection sections = 2;
}
enum EvidenceSection {
  EVIDENCE_SECTION_UNSPECIFIED = 0;
  EVIDENCE_SECTION_OUTPUTS = 1;
  EVIDENCE_SECTION_ARTIFACTS = 2;
  reserved 3;
  EVIDENCE_SECTION_RECORD_SCHEMAS = 4;
  EVIDENCE_SECTION_TELEMETRY_TABLES = 5;
}
message CheckpointTelemetryTable {
  string table = 1;
  TelemetrySchema schema = 2;
}
message CheckpointEvidence {
  ExecutionCheckpoint checkpoint = 1;
  repeated ExecutionFileMetadata outputs = 2;
  repeated ArtifactMetadata artifacts = 3;
  reserved 4;
  repeated RecordSchema record_schemas = 5;
  reserved 6;
  reserved "telemetry_schemas";
  repeated CheckpointTelemetryTable telemetry_tables = 7;
}

message ReadCheckpointOutputRequest {
  ExecutionCheckpoint checkpoint = 1;
  string relative_path = 2;
  uint64 offset = 3;
  uint32 max_bytes = 4;
}
message CheckpointFileWindow {
  ExecutionCheckpoint checkpoint = 1;
  ExecutionFileWindow content = 2;
}
message DownloadCheckpointArtifactRequest {
  ExecutionCheckpoint checkpoint = 1;
  string artifact_id = 2;
}
message ListCheckpointRecordsRequest {
  ExecutionCheckpoint checkpoint = 1;
  uint32 limit = 2;
  string after = 3;
}
message CheckpointRecordPage {
  ExecutionCheckpoint checkpoint = 1;
  repeated SavedRecord records = 2;
  optional string next_after = 3;
  repeated HistoryIssue issues = 4;
  bool issues_truncated = 5;
}
// The Original Producer Epoch Qualifies The Process-Local Journal Sequence.
message SavedRecord {
  string epoch = 1;
  CapturedRecord record = 2;
}
message ListCheckpointTelemetryRequest {
  ExecutionCheckpoint checkpoint = 1;
  // Original logical native stream identifier; never a Delta table name.
  string table = 2;
  uint32 limit = 3;
  string after = 4;
}
message CheckpointTelemetryPage {
  ExecutionCheckpoint checkpoint = 1;
  string table = 2;
  repeated SavedTelemetrySample rows = 3;
  optional string next_after = 4;
  repeated HistoryIssue issues = 5;
  bool issues_truncated = 6;
}
// The Original Producer Epoch Qualifies The Process-Local Sample Ordinal.
message SavedTelemetrySample {
  string epoch = 1;
  uint64 ordinal = 2;
  TelemetrySample sample = 3;
}

message GetCheckpointContextRequest { ExecutionCheckpoint checkpoint = 1; }
message CheckpointContext {
  ExecutionCheckpoint checkpoint = 1;
  string session_id = 2;
  optional string execution_id = 10;
  EvidenceScope execution_scope = 11;
  HistoricalCycleContext cycle = 3;
  repeated HistoricalDocument execution_documents = 4;
  repeated PromptInstance prompts = 5;
  repeated HealthItem health = 6;
  repeated OperatorNote notes = 7;
  repeated TraceabilitySnapshot traceability = 8;
  AppearanceSnapshot appearance = 9;
}
message HistoricalCycleContext {
  HistoricalCycle cycle = 1;
  repeated string execution_order = 2;
  reserved 3;
  reserved "documents";
}
message HistoricalCycle {
  string cycle_id = 1;
  Metadata metadata = 2;
  CycleStatus lifecycle = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  reserved 7;
  reserved "parameters";
  repeated CaseSummary cases = 8;
  ResultSummary result = 9;
}
