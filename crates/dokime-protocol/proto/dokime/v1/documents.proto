syntax = "proto3";
package dokime.v1;
import "dokime/v1/common.proto";
import "dokime/v1/plots.proto";
import "dokime/v1/schema.proto";
import "dokime/v1/value.proto";

// Current process state only. Historical checkpoint documents are separate.
service Documents {
  rpc CaptureCurrentDocument(CaptureCurrentDocumentRequest) returns (stream DocumentFrame);
}
message DocumentScope {
  string cycle_id = 1;
  string execution_id = 2;
}
message CaptureCurrentDocumentRequest {
  DocumentScope scope = 1;
  string document_id = 2;
  reserved 3;
  reserved "view_id";
}
// Sources are captured separately; this is not an atomic latest/durable snapshot.
// Missing frontiers mean the source was not needed by this capture.
message DocumentFrontiers {
  string process_epoch = 1;
  uint64 state_revision = 2;
  DocumentTelemetryCut telemetry = 4;
  // SHA-256 of this captured artifact/report descriptor input, not a journal
  // position or published checkpoint. These owners have no shared revision.
  optional string artifacts_sha256 = 5;
}
message DocumentTelemetryCut {
  uint64 delivered_cursor = 1;
  oneof source {
    uint64 series_epoch = 2;
    bool retained_window = 3;
  }
  optional uint64 series_ordinal = 4;
}
message DocumentHeader {
  string document_id = 1;
  Metadata metadata = 2;
  EvidenceScope scope = 3;
  reserved 4, 5;
  reserved "selected_view_id", "views";
  DocumentFrontiers frontiers = 6;
}
enum DocumentCardKind {
  DOCUMENT_CARD_KIND_UNSPECIFIED = 0;
  DOCUMENT_CARD_KIND_TEXT = 1;
  DOCUMENT_CARD_KIND_TELEMETRY_SUMMARY = 2;
  DOCUMENT_CARD_KIND_PLOT = 3;
  DOCUMENT_CARD_KIND_TABLE = 4;
  DOCUMENT_CARD_KIND_STEPS = 5;
  DOCUMENT_CARD_KIND_CRITERIA = 6;
  DOCUMENT_CARD_KIND_TRACEABILITY = 7;
  DOCUMENT_CARD_KIND_NOTES = 8;
  DOCUMENT_CARD_KIND_RECORDS = 9;
  DOCUMENT_CARD_KIND_ARTIFACTS = 10;
  DOCUMENT_CARD_KIND_MEDIA = 11;
  DOCUMENT_CARD_KIND_HEALTH = 12;
  DOCUMENT_CARD_KIND_TELEMETRY_CONTEXT = 13;
}
// Flat pre-order layout nodes retain ordered parent/child identity without an
// unbounded recursive protobuf. A top-level node has no parent; nested
// sections/placements do.
message DocumentLayoutNode {
  uint64 ordinal = 1;
  optional uint64 parent_ordinal = 2;
  reserved 3;
  reserved "tab";
  oneof node {
    DocumentSection section = 4;
    DocumentPlacement placement = 5;
  }
}
message DocumentSection { string node_id = 1; Metadata metadata = 2; DocumentRepeat repeat = 3; }
message DocumentRepeat {
  DataExpression value = 1;
  string label_template = 2;
  optional string id_template = 3;
  DataExpression order_by = 4;
  repeated PlotFilter filters = 5;
}
message DocumentPlacement {
  string card_id = 1;
  DocumentSpan column_span = 2;
  uint32 row_span = 3;
  sint32 order = 4;
  DocumentDensity density = 5;
  DocumentRail rail = 6;
}
message DocumentSpan {
  uint32 base = 1;
  optional uint32 sm = 2;
  optional uint32 md = 3;
  optional uint32 lg = 4;
  optional uint32 xl = 5;
}
enum DocumentDensity { DOCUMENT_DENSITY_UNSPECIFIED = 0; DOCUMENT_DENSITY_COMPACT = 1; DOCUMENT_DENSITY_NORMAL = 2; DOCUMENT_DENSITY_SPACIOUS = 3; }
enum DocumentRail { DOCUMENT_RAIL_UNSPECIFIED = 0; DOCUMENT_RAIL_MAIN = 1; DOCUMENT_RAIL_RIGHT = 2; DOCUMENT_RAIL_LEFT = 3; }
// Authored Cards Are Captured Once; Bindings Carry Instance Results Separately.
message DocumentCard {
  Metadata metadata = 1;
  repeated PlotFilter filters = 6;
  oneof body {
    string markdown = 2;
    DocumentTable table = 3;
    DocumentSummary summary = 4;
    DocumentOwnerReference owner = 5;
  }
}
// Built-in live content remains owned by its domain API. Plot references select
// a plot within this authored document; they do not contain client-authored input.
message DocumentOwnerReference {
  DocumentCardKind kind = 1;
  optional string plot_id = 2;
  reserved 3, 4, 5;
  reserved "scope", "artifact_count", "completed_artifact_count";
  // Plot owners carry the authored input and presentation alongside the
  // stable owner identity. The request has no cursor; callers add one only
  // when opening a live plot stream.
  DocumentPlotDefinition plot = 6;
}

message DocumentPlotDefinition {
  Metadata metadata = 1;
  PlotRequest request = 2;
  PlotPresentation presentation = 3;
  // Authored z-axis data selection. This belongs to the document definition
  // and is kept separate from PlotRequest because the runtime query currently
  // evaluates only the request's lowered fields.
  optional DataExpression z_expression = 4;
}

message PlotPresentation {
  string group = 1;
  PlotStyle style = 2;
  PlotFftOptions fft = 3;
  PlotIntervalOptions interval = 4;
  PlotHistogramOptions histogram = 5;
  repeated PlotReferenceLine reference_lines = 6;
  repeated PlotReferenceBand reference_bands = 7;
  optional double live_window_s = 8;
  ValueFormat x_format = 9;
  ValueFormat y_format = 10;
  // What the x axis measures. Unspecified is wall time, so a payload written
  // before this was declared still reads correctly.
  PlotAxisKind x_axis = 11;
  // The unit an elapsed x axis counts in, as the column declared it: "s",
  // "ms", "us", "min", "h". Absent for a wall-time axis.
  optional string x_axis_unit = 12;
}

// What a plot's x axis measures, so a client never infers it from a name.
enum PlotAxisKind {
  PLOT_AXIS_KIND_UNSPECIFIED = 0;
  // An absolute instant: the axis draws a date and a clock face.
  PLOT_AXIS_KIND_WALL_TIME = 1;
  // A duration counted from the start of the run, in `x_axis_unit`.
  PLOT_AXIS_KIND_ELAPSED = 2;
}

message PlotReferenceLine {
  ReferenceAxis axis = 1;
  optional double value = 2;
  DataExpression source = 3;
  double source_scale = 4;
  optional string label = 5;
  string color = 6;
}

message PlotReferenceBand {
  ReferenceAxis axis = 1;
  optional double min = 2;
  optional double max = 3;
  optional string label = 4;
  string color = 5;
  DataExpression center = 6;
  DataExpression tolerance = 7;
}

enum PlotStyle {
  PLOT_STYLE_UNSPECIFIED = 0;
  PLOT_STYLE_LINE = 1;
  PLOT_STYLE_POINTS = 2;
  PLOT_STYLE_LINE_POINTS = 3;
  PLOT_STYLE_STEP = 4;
}

enum ReferenceAxis {
  REFERENCE_AXIS_UNSPECIFIED = 0;
  REFERENCE_AXIS_X = 1;
  REFERENCE_AXIS_Y = 2;
}
message DocumentTable { uint64 row_count = 1; }
message DocumentTableRow { string card_id = 1; uint64 ordinal = 2; ValueObject values = 3; }
message DocumentSummary { uint64 group_count = 1; }
message DocumentSummaryGroup { string card_id = 1; uint64 ordinal = 2; Metadata metadata = 3; uint64 tile_count = 4; }
message DocumentSummaryTile {
  string card_id = 1;
  uint64 group_ordinal = 2;
  uint64 ordinal = 3;
  Metadata metadata = 4;
  Value value = 5;
  DocumentSummaryStat stat = 6;
  DocumentSummaryFormat format = 7;
  DocumentSummaryPresentation presentation = 8;
  optional string unit = 9;
  optional DocumentSummaryState state = 10;
  // Evaluation failure; value and state must be absent. Missing evidence alone
  // remains an absent value, not an unavailable result.
  optional string unavailable = 11;
}
enum DocumentSummaryStat { DOCUMENT_SUMMARY_STAT_UNSPECIFIED = 0; DOCUMENT_SUMMARY_STAT_LATEST = 1; }
enum DocumentSummaryFormat { DOCUMENT_SUMMARY_FORMAT_UNSPECIFIED = 0; DOCUMENT_SUMMARY_FORMAT_AUTO = 1; DOCUMENT_SUMMARY_FORMAT_NUMBER = 2; DOCUMENT_SUMMARY_FORMAT_PERCENT = 3; DOCUMENT_SUMMARY_FORMAT_DURATION = 4; DOCUMENT_SUMMARY_FORMAT_DISTANCE = 5; DOCUMENT_SUMMARY_FORMAT_STATUS = 6; DOCUMENT_SUMMARY_FORMAT_TEXT = 7; }
enum DocumentSummaryPresentation { DOCUMENT_SUMMARY_PRESENTATION_UNSPECIFIED = 0; DOCUMENT_SUMMARY_PRESENTATION_VALUE = 1; DOCUMENT_SUMMARY_PRESENTATION_PROGRESS = 2; DOCUMENT_SUMMARY_PRESENTATION_BADGE = 3; }
enum DocumentSummaryState { DOCUMENT_SUMMARY_STATE_UNSPECIFIED = 0; DOCUMENT_SUMMARY_STATE_OK = 1; DOCUMENT_SUMMARY_STATE_WARNING = 2; DOCUMENT_SUMMARY_STATE_CRITICAL = 3; DOCUMENT_SUMMARY_STATE_MUTED = 4; }
message DocumentWarning { string code = 1; string message = 2; }
message DocumentSummaryGroupDefinition {
  string card_id = 1;
  uint64 ordinal = 2;
  Metadata metadata = 3;
  uint64 tile_count = 4;
}
message DocumentSummaryTileDefinition {
  string card_id = 1;
  uint64 group_ordinal = 2;
  uint64 ordinal = 3;
  Metadata metadata = 4;
  DataExpression value = 5;
  repeated PlotFilter filters = 6;
  DocumentSummaryStat stat = 7;
  DocumentSummaryFormat format = 8;
  DocumentSummaryPresentation presentation = 9;
  optional string unit = 10;
  repeated DocumentSummaryCondition conditions = 11;
}
message DocumentSummaryCondition {
  FilterOperator operator = 1;
  Value value = 2;
  DocumentSummaryState state = 3;
}
message DocumentBinding {
  string source_id = 1;
  Metadata metadata = 2;
  oneof result {
    bool literal = 3;
    DocumentSummary summary = 4;
    DocumentPlotDefinition plot = 5;
  }
}
message DocumentRepeatSelection { string node_id = 1; uint64 instance_count = 2; }
message DocumentRepeatInstance {
  string selection_id = 1;
  uint64 ordinal = 2;
  string suffix = 3;
  string node_id = 4;
  PlotFilter filter = 5;
}
message DocumentSectionIdentity {
  string node_id = 1;
  Metadata metadata = 2;
  // An unevaluable repeat retains its original section identity with no instances.
  optional string unavailable = 3;
}
message DocumentCompletion {
  uint64 frame_count = 1;
  uint64 card_count = 2;
  uint64 layout_node_count = 3;
  uint64 binding_count = 4;
  uint64 repeat_count = 5;
  uint64 section_count = 6;
}
// Header Is First; Completion Is Last. Apply Only After Clean gRPC EOF.
message DocumentFrame {
  oneof frame {
    DocumentHeader header = 1;
    DocumentLayoutNode layout_node = 2;
    DocumentCard card = 3;
    DocumentTableRow table_row = 4;
    DocumentSummaryGroup summary_group = 5;
    DocumentSummaryTile summary_tile = 6;
    DocumentWarning warning = 7;
    DocumentCompletion completion = 8;
    DocumentSummaryGroupDefinition group_definition = 9;
    DocumentSummaryTileDefinition tile_definition = 10;
    DocumentBinding binding = 11;
    DocumentRepeatSelection repeat_selection = 12;
    DocumentRepeatInstance repeat_instance = 13;
    DocumentSectionIdentity section_identity = 14;
  }
}
