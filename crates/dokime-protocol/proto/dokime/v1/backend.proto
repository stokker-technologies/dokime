syntax = "proto3";
package dokime.v1;

import "dokime/v1/common.proto";
import "google/protobuf/timestamp.proto";

// Native gRPC only. Reachability is not authorization: deployments must apply
// their access policy even to discovery. No RPC here mutates the runtime.
service Backend {
  rpc GetIdentity(GetIdentityRequest) returns (BackendIdentity);
  rpc GetHealth(GetHealthRequest) returns (BackendHealth);
  rpc GetCapabilities(GetCapabilitiesRequest) returns (BackendCapabilities);
  rpc GetDiagnostics(GetDiagnosticsRequest) returns (DiagnosticsResponse);
  // Builds one support archive and streams it. Read access, like
  // GetDiagnostics; the archive never carries credential material.
  rpc CollectDiagnostics(CollectDiagnosticsRequest) returns (stream DiagnosticsBundleFrame);
  // Replays a bounded tail of the hub log, then follows it. Read access.
  rpc WatchLogs(WatchLogsRequest) returns (stream LogFrame);
}

message GetIdentityRequest {}
message GetHealthRequest {}
message GetCapabilitiesRequest {}
message GetDiagnosticsRequest {}

message CollectDiagnosticsRequest {
  // Ceiling on the hub-log tail copied into the archive. Absent uses 2 MiB and
  // larger values are clamped to it; zero omits the log entirely. The whole
  // log is never archived.
  optional uint64 max_log_tail_bytes = 1;
}

message WatchLogsRequest {
  // Frames below this level are never delivered. Unspecified means TRACE.
  LogLevel min_level = 1;
  // Matching lines replayed from the end of the hub log before following it.
  // Zero uses 500; larger values are clamped to 5000.
  uint32 replay_lines = 2;
}

message BackendIdentity {
  // Stable identity of this backend installation, not its network address.
  string backend_id = 1;
  // Unique for every runtime boot; invalidates process-local cursors.
  string epoch = 2;
  ApiIdentity api = 3;
  string product_version = 4;
  optional string source_revision = 5;
  optional string sdk_revision = 6;
  google.protobuf.Timestamp started_at = 7;
  string display_name = 8;
}

message ApiIdentity {
  // Fully qualified protobuf package, currently dokime.v1.
  string package = 1;
  // Contract version independent of product and SDK version.
  string version = 2;
  // SHA-256 of the released descriptor set, including imports.
  bytes descriptor_sha256 = 3;
}

message BackendHealth {
  string backend_id = 1;
  string epoch = 2;
  Readiness readiness = 3;
  google.protobuf.Timestamp observed_at = 4;
  // Human-readable explanation; callers branch on readiness, not this text.
  string message = 5;
}

enum Readiness {
  READINESS_UNSPECIFIED = 0;
  READINESS_STARTING = 1;
  READINESS_READY = 2;
  READINESS_DEGRADED = 3;
  READINESS_STOPPING = 4;
}

message BackendCapabilities {
  string backend_id = 1;
  string epoch = 2;
  // Methods both implemented and available to the authenticated caller.
  // Full names, e.g. /dokime.v1.Backend/GetIdentity.
  repeated string methods = 3;
  BackendLimits limits = 4;
}

message BackendLimits {
  // Positive limits enforced by this backend, excluding transport framing.
  uint64 max_request_bytes = 1;
  uint64 max_response_bytes = 2;
  // Optional until corresponding streaming/query services are implemented.
  optional uint64 max_content_bytes = 3;
  optional uint32 max_chunk_bytes = 4;
  optional uint32 max_page_items = 5;
  optional uint32 max_stream_buffer_items = 6;
}

// Native diagnostics intentionally reports backend and runtime facts. It does
// not mirror HTTP listener policy such as origins, heartbeat intervals, or
// bind addresses.
message DiagnosticsResponse {
  BackendDiagnostics server = 1;
  RuntimeDiagnostics runtime = 2;
}

message BackendDiagnostics {
  string version = 1;
  ProcessDiagnostics process = 2;
}

message ProcessDiagnostics {
  uint32 pid = 1;
  optional float cpu_percent = 2;
  optional uint64 memory_bytes = 3;
  optional uint64 virtual_memory_bytes = 4;
}

message RuntimeDiagnostics {
  google.protobuf.Timestamp captured_at = 1;
  string session_id = 2;
  RuntimeIdentity identity = 3;
  uint64 revision = 4;
  bool shutting_down = 5;
  string storage_root = 6;
  Metadata hub_metadata = 7;
  StartupDoctorSnapshot startup_doctor = 8;
  repeated DiagnosticPathConvention path_conventions = 9;
  DiagnosticsCounts counts = 10;
  repeated InstalledPluginErrorRecord installed_plugin_errors = 11;
}

message RuntimeIdentity {
  RuntimeNodeIdentity node = 1;
  RuntimeActorIdentity actor = 2;
}

message RuntimeNodeIdentity {
  string node_id = 1;
  optional string hostname_label = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message RuntimeActorIdentity {
  string actor_id = 1;
  string display_name = 2;
}

message StartupDoctorSnapshot {
  google.protobuf.Timestamp checked_at = 1;
  DiagnosticCheckStatus status = 2;
  repeated StartupDoctorCheck checks = 3;
}

message StartupDoctorCheck {
  StartupDoctorCheckKey key = 1;
  DiagnosticCheckStatus status = 2;
  string message = 3;
  optional string detail = 4;
}

enum DiagnosticCheckStatus {
  DIAGNOSTIC_CHECK_STATUS_UNSPECIFIED = 0;
  DIAGNOSTIC_CHECK_STATUS_OK = 1;
  DIAGNOSTIC_CHECK_STATUS_WARNING = 2;
  DIAGNOSTIC_CHECK_STATUS_FAILED = 3;
}

enum StartupDoctorCheckKey {
  STARTUP_DOCTOR_CHECK_KEY_UNSPECIFIED = 0;
  STARTUP_DOCTOR_CHECK_KEY_STORAGE_ROOT = 1;
  STARTUP_DOCTOR_CHECK_KEY_SHUTDOWN_STATE = 2;
}

message DiagnosticPathConvention {
  DiagnosticPathKey key = 1;
  DiagnosticPathScope scope = 2;
  DiagnosticFileFormat format = 3;
  string relative_path = 4;
  optional string absolute_path = 5;
}

enum DiagnosticPathKey {
  DIAGNOSTIC_PATH_KEY_UNSPECIFIED = 0;
  DIAGNOSTIC_PATH_KEY_HUB_LOG = 1;
  DIAGNOSTIC_PATH_KEY_STARTUP_DOCTOR = 2;
  DIAGNOSTIC_PATH_KEY_DIAGNOSTICS_SNAPSHOT = 3;
  DIAGNOSTIC_PATH_KEY_COLLECT_BUNDLE = 4;
  DIAGNOSTIC_PATH_KEY_CYCLE_LOG_PATTERN = 5;
  DIAGNOSTIC_PATH_KEY_EXECUTION_LOG_PATTERN = 6;
}

enum DiagnosticPathScope {
  DIAGNOSTIC_PATH_SCOPE_UNSPECIFIED = 0;
  DIAGNOSTIC_PATH_SCOPE_ROOT = 1;
  DIAGNOSTIC_PATH_SCOPE_CYCLE_PATTERN = 2;
  DIAGNOSTIC_PATH_SCOPE_EXECUTION_PATTERN = 3;
}

enum DiagnosticFileFormat {
  DIAGNOSTIC_FILE_FORMAT_UNSPECIFIED = 0;
  DIAGNOSTIC_FILE_FORMAT_JSON = 1;
  DIAGNOSTIC_FILE_FORMAT_JSONL = 2;
  DIAGNOSTIC_FILE_FORMAT_ZIP = 3;
}

message DiagnosticsCounts {
  uint64 test_suites = 1;
  uint64 cycles = 2;
  reserved 3;
  uint64 installed_plugin_errors = 4;
  uint64 state_cycles = 5;
  uint64 state_executions_total = 6;
  uint64 state_record_count = 7;
  reserved 8;
  uint64 telemetry_cursor_entries = 9;
}

message InstalledPluginErrorRecord {
  string plugin_id = 1;
  optional string contribution_id = 2;
  InstalledPluginPhase phase = 3;
  Severity level = 4;
  string message = 5;
  optional string code = 6;
  optional string source = 7;
  repeated ErrorCause cause_chain = 8;
  optional string stacktrace_attachment = 9;
  optional string trace_id = 10;
  EvidenceScope scope = 11;
  optional string session_id = 12;
  optional string test_cycle_id = 13;
  optional string test_execution_id = 14;
  google.protobuf.Timestamp recorded_at = 15;
}

message ErrorCause {
  string message = 1;
  optional string code = 2;
  optional string source = 3;
}

enum InstalledPluginPhase {
  INSTALLED_PLUGIN_PHASE_UNSPECIFIED = 0;
  INSTALLED_PLUGIN_PHASE_ENTRYPOINT = 1;
  INSTALLED_PLUGIN_PHASE_ACTION = 2;
  INSTALLED_PLUGIN_PHASE_SIDECAR = 3;
  INSTALLED_PLUGIN_PHASE_PROVIDER = 4;
  INSTALLED_PLUGIN_PHASE_INITIALIZE = 5;
  INSTALLED_PLUGIN_PHASE_RUN = 6;
  INSTALLED_PLUGIN_PHASE_FINALIZE = 7;
  INSTALLED_PLUGIN_PHASE_INTERRUPT = 8;
}

// One diagnostics archive, delivered as a header, contiguous chunks, and a
// completion. Accept the bytes only after the completion frame and a
// successful final gRPC status.
message DiagnosticsBundleFrame {
  oneof payload {
    DiagnosticsBundleHeader header = 1;
    DiagnosticsBundleChunk chunk = 2;
    DiagnosticsBundleCompletion complete = 3;
  }
}

message DiagnosticsBundleHeader {
  // Suggested save name, dokime-diagnostics-<utc timestamp>.zip. It is a name,
  // not a backend path: nothing is written to the storage root.
  string filename = 1;
  string content_type = 2;
  google.protobuf.Timestamp generated_at = 3;
  // Present whenever the archive is complete before the first chunk, which is
  // how this backend builds it.
  optional uint64 total_size_bytes = 4;
  // The same inventory the archive's manifest.json carries.
  repeated DiagnosticsBundleEntry entries = 5;
}

message DiagnosticsBundleEntry {
  // Archive-relative path, never a backend filesystem path.
  string path = 1;
  uint64 size_bytes = 2;
  // False when the source file does not exist; the entry is still listed so an
  // absent convention is distinguishable from an unattempted one.
  bool present = 3;
  optional string note = 4;
}

message DiagnosticsBundleChunk { uint64 offset = 1; bytes data = 2; }
message DiagnosticsBundleCompletion {
  uint64 size_bytes = 1;
  // SHA-256 of exactly the bytes delivered by preceding chunks.
  string sha256 = 2;
}

// Hub log severity. Callers branch on this, never on the log text.
enum LogLevel {
  LOG_LEVEL_UNSPECIFIED = 0;
  LOG_LEVEL_TRACE = 1;
  LOG_LEVEL_DEBUG = 2;
  LOG_LEVEL_INFO = 3;
  LOG_LEVEL_WARN = 4;
  LOG_LEVEL_ERROR = 5;
}

// One observed hub-log record. Secret-looking field names carry a redaction
// marker instead of their value.
message LogFrame {
  google.protobuf.Timestamp time = 1;
  LogLevel level = 2;
  string target = 3;
  string message = 4;
  map<string, string> fields = 5;
  // Matching records discarded ahead of this one because the client fell
  // behind. Cumulative for the stream; it never rewinds.
  uint64 dropped = 6;
}
