syntax = "proto3";
package dokime.v1;

// Dynamic plugin data only. Fixed service requests use explicit messages.
// An unset kind is invalid. Null is an explicitly present value; absence is
// represented by absence of the containing message or object key.
message Value {
  oneof kind {
    NullValue null_value = 1;
    bool bool_value = 2;
    sint64 integer_value = 3;
    // IEEE-754 binary64, including NaN and infinities.
    double number_value = 4;
    string text_value = 5;
    ValueList array_value = 6;
    ValueObject object_value = 7;
    // RFC3339 UTC.
    string datetime_value = 8;
    uint64 unsigned_value = 9;
  }
}

enum NullValue {
  NULL_VALUE_NULL = 0;
}

message ValueList {
  repeated Value values = 1;
}

message ValueObject {
  // Map order has no semantic meaning.
  map<string, Value> fields = 1;
}
