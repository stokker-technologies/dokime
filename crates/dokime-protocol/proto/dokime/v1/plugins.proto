syntax = "proto3";
package dokime.v1;
import "google/protobuf/timestamp.proto";

// Installations are next-boot authorizations; admitted plugins describe this
// process. All installation operations require Admin, inventory requires Read.
service Plugins {
  rpc ListInstallations(ListInstallationsRequest) returns (InstallationPage);
  rpc GetInstallation(GetInstallationRequest) returns (PluginInstallation);
  rpc Stage(stream StagePluginFrame) returns (PluginInstallation);
  rpc Consent(ConsentPluginRequest) returns (PluginInstallation);
  rpc SetEnabled(SetPluginEnabledRequest) returns (PluginInstallation);
  rpc Remove(RemovePluginRequest) returns (RemovePluginReply);
  rpc ListAdmittedPlugins(ListAdmittedPluginsRequest) returns (AdmittedPluginPage);
}
message InstallationCursor { string manifest_sha256 = 1; string after_install_id = 2; }
message ListInstallationsRequest { uint32 page_size = 1; InstallationCursor after = 2; }
message InstallationPage {
  repeated PluginInstallation installations = 1;
  InstallationCursor next = 2;
  uint64 total_count = 3;
  string manifest_sha256 = 4;
}
message GetInstallationRequest { string install_id = 1; }
message ConsentPluginRequest { string install_id = 1; string expected_sha256 = 2; }
message SetPluginEnabledRequest { string install_id = 1; bool enabled = 2; }
message RemovePluginRequest { string install_id = 1; }
message RemovePluginReply {
  // Absent means the staged installation was removed. Consented installations
  // remain RemovalPending until next boot; the active process is untouched.
  PluginInstallation installation = 1;
}
// Exactly one header first, followed by contiguous nonempty chunks <=256KiB.
// EOF must match the declared size and SHA-256. Native archive limit is 272 MiB.
// No resumable upload session or automatic retry: after uncertain acknowledgement,
// reconcile the manifest by digest before explicitly starting another stage.
message StagePluginFrame {
  oneof frame { StagePluginHeader header = 1; StagePluginChunk chunk = 2; }
}
message StagePluginHeader { uint64 size_bytes = 1; string sha256 = 2; }
message StagePluginChunk { uint64 offset = 1; bytes data = 2; }
message PluginIdentity { string name = 1; string version = 2; string description = 3; }
message PluginEnvironmentReference { string owner = 1; string setting = 2; string variable = 3; }
message PluginMetadata {
  PluginIdentity identity = 1;
  repeated string owners = 2;
  uint64 size_bytes = 3;
  repeated PluginEnvironmentReference environment_references = 4;
}
enum PluginInstallationState {
  PLUGIN_INSTALLATION_STATE_UNSPECIFIED = 0;
  PLUGIN_INSTALLATION_STATE_STAGED = 1;
  PLUGIN_INSTALLATION_STATE_INSTALLED = 2;
  PLUGIN_INSTALLATION_STATE_DISABLED = 3;
  PLUGIN_INSTALLATION_STATE_REMOVAL_PENDING = 4;
}
message PluginLastBoot {
  google.protobuf.Timestamp at = 1;
  oneof result { bool loaded = 2; string error = 3; }
}
message PluginInstallation {
  string install_id = 1;
  string sha256 = 2;
  google.protobuf.Timestamp staged_at = 3;
  google.protobuf.Timestamp consented_at = 4;
  PluginInstallationState state = 5;
  PluginLastBoot last_boot = 6;
  // Absent if bytes cannot be verified or full metadata exceeds the response
  // budget; error explains why. Permission disclosure is never truncated.
  PluginMetadata metadata = 7;
  optional string error = 8;
  bool active = 9;
  bool restart_required = 10;
  optional string boot_error = 11;
}
message AdmittedPluginCursor { string epoch = 1; uint64 revision = 2; string after_plugin_id = 3; }
message ListAdmittedPluginsRequest { uint32 page_size = 1; AdmittedPluginCursor after = 2; }
message AdmittedPluginPage {
  repeated AdmittedPlugin plugins = 1;
  AdmittedPluginCursor next = 2;
  uint64 total_count = 3;
  string epoch = 4;
  uint64 revision = 5;
}
message AdmittedBundleOwner { string package = 1; optional string installation_id = 2; string content_digest = 3; }
message AdmittedEmbeddedOwner { string generation = 1; }
message AdmittedPlugin {
  string plugin_id = 1;
  string label = 2;
  string version = 3;
  bool enabled = 4;
  oneof owner { bool host = 5; AdmittedBundleOwner bundle = 6; AdmittedEmbeddedOwner embedded = 7; }
}
