syntax = "proto3";
package dokime.v1;
import "dokime/v1/common.proto";
import "dokime/v1/value.proto";
import "dokime/v1/planning.proto";
import "dokime/v1/schema.proto";
import "google/protobuf/timestamp.proto";
service Execution {
  rpc ListExecutionSteps(ListExecutionStepsRequest) returns (ListExecutionStepsReply);
  rpc ListStepCriteria(ListStepEvidenceRequest) returns (ListStepCriteriaReply);
  rpc CopyCycle(CopyCycleRequest) returns (CreateCycleReply);
  rpc CreateCycle(CreateCycleRequest) returns (CreateCycleReply);
  rpc GetCycle(GetCycleRequest) returns (CycleSummary);
  rpc GetCase(GetCaseRequest) returns (CaseDetail);
  rpc GetExecution(GetExecutionRequest) returns (ExecutionDetail);
  rpc ListCaseParameters(ListCaseParametersRequest) returns (ListCaseParametersReply);
  rpc ListExecutionParameters(ListExecutionParametersRequest) returns (ListMaterializedParametersReply);
  rpc ListCycles(ListCyclesRequest) returns (ListCyclesReply);
  rpc ListCases(ListCasesRequest) returns (ListCasesReply);
  rpc ListExecutions(ListExecutionsRequest) returns (ListExecutionsReply);
  rpc AppendPlannedCases(AppendPlannedCasesRequest) returns (ControlReply);
  // RunCycle dispatches one provider run per execution target its runnable
  // cases resolve to, sequentially and in case order, under one request.
  rpc RunCycle(RunCycleRequest) returns (RunReply);
  rpc RunCase(RunCaseRequest) returns (RunReply);
  // Admit one existing, unstarted execution. Never reopens a finished attempt.
  rpc RunExecution(RunExecutionRequest) returns (RunReply);
  // Controls require that execution's active execution-addressed request.
  rpc PauseExecution(ExecutionControlRequest) returns (ControlReply);
  rpc ResumeExecution(ExecutionControlRequest) returns (ControlReply);
  rpc StopExecution(ExecutionControlRequest) returns (ControlReply);
  rpc GetRunRequest(GetRunRequestRequest) returns (RunRequestReceipt);
  rpc SubmitExecutionCommand(SubmitExecutionCommandRequest) returns (ExecutionCommandReceipt);
  rpc GetExecutionCommand(GetExecutionCommandRequest) returns (ExecutionCommandReceipt);
  rpc PauseCycle(CycleControlRequest) returns (ControlReply);
  rpc ResumeCycle(CycleControlRequest) returns (ControlReply);
  rpc StopCycle(CycleControlRequest) returns (ControlReply);
  rpc DeleteCase(CaseControlRequest) returns (ControlReply);
  rpc ScheduleCaseRerun(CaseControlRequest) returns (ControlReply);
  rpc ClearCycle(CycleControlRequest) returns (ControlReply);
  rpc UpdateCyclePolicy(UpdateCyclePolicyRequest) returns (ControlReply);
}
// Correlation is a caller label, never authenticated identity or an idempotency
// key. Only the run-specific idempotency_key fields support safe retries. Other
// mutations remain unsafe to replay after an ambiguous transport failure.
message MutationContext { optional string correlation_id = 1; }
// Copies the current plan, authored Definition/Operator cycle inputs, documents,
// and policy into a new ready cycle. No execution evidence or derived parameters
// are copied. The source remains untouched, including if currently running.
// Copy does not certify provider availability; Run validates that separately.
message CopyCycleRequest { string source_cycle_id = 1; MutationContext context = 2; }
message CreateCycleRequest {
  SelectionPlan plan = 1;
  Metadata metadata = 2;
  bool continue_on_failure = 4;
  MutationContext context = 5;
}
// Creation plans from the registered suite. It does not run any case.
message CreateCycleReply { string cycle_id = 1; Cursor observed_cursor = 2; }
// Append cases generated from the current registered catalog to an existing
// mutable cycle. The plan is resolved and validated against one captured
// registry snapshot before the existing append transaction is committed.
message AppendPlannedCasesRequest {
  string cycle_id = 1;
  SelectionPlan plan = 2;
  MutationContext context = 3;
}
message GetCycleRequest { string cycle_id = 1; }
// Server-side selection and ordering for the live cycle list.
//
// `text` matches a cycle's label, its identifier and its admitted suite label
// case-insensitively; an empty string selects everything. Repeated fields are
// disjunctive within themselves and conjunctive with the other fields, and an
// empty repeated field is no constraint. The timestamp range is inclusive and
// compares `created_at`.
message CycleFilter {
  string text = 1;
  repeated CycleStatus statuses = 2;
  repeated string suite_ids = 3;
  optional google.protobuf.Timestamp created_after = 4;
  optional google.protobuf.Timestamp created_before = 5;
}
// The requested order key. Ordering is always total: the key, then the cycle ID
// ascending, so equal keys never permute between pages. An unspecified key is
// UPDATED_AT. LABEL compares the case-folded label.
enum CycleOrderKey {
  CYCLE_ORDER_KEY_UNSPECIFIED = 0;
  CYCLE_ORDER_KEY_UPDATED_AT = 1;
  CYCLE_ORDER_KEY_CREATED_AT = 2;
  CYCLE_ORDER_KEY_LABEL = 3;
}
message CycleOrder { CycleOrderKey key = 1; bool descending = 2; }
// `filter` and `order` must be repeated unchanged on every continuation, and
// `after_cycle_id` must still be a member of the filtered result. A changed
// selection, a changed order, or a continuation ID the filter excludes is
// rejected rather than silently restarted.
message ListCyclesRequest {
  uint32 limit = 1;
  string after_cycle_id = 2;
  Cursor cursor = 3;
  CycleFilter filter = 4;
  CycleOrder order = 5;
}
message ListCyclesReply { repeated CycleSummary cycles = 1; optional string next_after_cycle_id = 2; Cursor cursor = 3; }
message CycleControlRequest { string cycle_id = 1; MutationContext context = 2; }
message ExecutionControlRequest { string execution_id = 1; MutationContext context = 2; }
// DeleteCase only removes an unexecuted case. ScheduleCaseRerun makes the
// cycle ready without altering prior attempts or starting execution. A subsequent
// RunCase dispatches the next attempt; prior attempts and evidence remain retained.
// ClearCycle removes the live case/attempt lists after execution has stopped.
message CaseControlRequest { string cycle_id = 1; string case_id = 2; MutationContext context = 3; }
message UpdateCyclePolicyRequest { string cycle_id = 1; bool continue_on_failure = 2; MutationContext context = 3; }
// Optional keys are exact opaque values: 1–256 UTF-8 bytes, nonblank, no control
// characters. Namespace: stable node + authenticated principal, shared across
// RunCycle and RunCase. Reuse requires the identical cycle/case selection;
// correlation labels do not affect identity. Persist a key before first send.
// Repeating the original request resolves its durable receipt after restart;
// it never resumes an interrupted acquisition. Omission provides no retry safety.
message RunCycleRequest { string cycle_id = 1; MutationContext context = 2; optional string idempotency_key = 3; }
message RunCaseRequest { string cycle_id = 1; string case_id = 2; MutationContext context = 3; optional string idempotency_key = 4; }
message RunExecutionRequest { string execution_id = 1; MutationContext context = 2; optional string idempotency_key = 3; ExecutionMode mode = 4; }
enum ExecutionMode { EXECUTION_MODE_AUTOMATIC = 0; EXECUTION_MODE_INTERACTIVE = 1; }
// Lookup is independent of live cycles and epoch cursors. A Read principal may
// inspect its own receipts; Admin may inspect any. Unknown and other-owner IDs
// both return NotFound. A native receipt with no submitter is Admin-only.
message GetRunRequestRequest { string request_id = 1; }
// Commands belong to an admitted interactive run. Reuse the same command UUID
// and identical action to recover admission; a transport failure is uncertain.
message SubmitExecutionCommandRequest {
  string request_id = 1;
  string command_id = 2;
  string execution_id = 3;
  ExecutionCommandAction action = 4;
  optional string step_id = 5;
}
message GetExecutionCommandRequest { string request_id = 1; string command_id = 2; }
enum ExecutionCommandAction {
  EXECUTION_COMMAND_ACTION_UNSPECIFIED = 0;
  EXECUTION_COMMAND_ACTION_NEXT = 1;
  EXECUTION_COMMAND_ACTION_RUN_STEP = 2;
  EXECUTION_COMMAND_ACTION_FINISH = 3;
}
enum ExecutionCommandPhase {
  EXECUTION_COMMAND_PHASE_UNSPECIFIED = 0;
  EXECUTION_COMMAND_PHASE_ACCEPTED = 1;
  EXECUTION_COMMAND_PHASE_DISPATCHING = 2;
  EXECUTION_COMMAND_PHASE_RUNNING = 3;
  EXECUTION_COMMAND_PHASE_COMPLETED = 4;
  EXECUTION_COMMAND_PHASE_REFUSED = 5;
  EXECUTION_COMMAND_PHASE_FAILED = 6;
  EXECUTION_COMMAND_PHASE_INTERRUPTED = 7;
}
// Completion references the actual callback attempt; Finish completes only
// after cleanup and evaluation. Interrupted commands are never replayed.
message ExecutionCommandReceipt {
  string request_id = 1;
  string command_id = 2;
  string execution_id = 3;
  ExecutionCommandAction action = 4;
  optional string step_id = 5;
  ExecutionCommandPhase phase = 6;
  optional string attempt_id = 7;
  google.protobuf.Timestamp accepted_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  optional string detail = 10;
}

// Primary-published operation progress, not the current in-memory cycle state.
// finished_count counts folded outcomes; terminal Completed/Failed/Stopped also
// certifies required execution checkpoints settled. Interrupted means recovery
// did not resume device actions and cannot certify those terminal checkpoints.
message RunRequestReceipt {
  string request_id = 1;
  string node_id = 2;
  string cycle_id = 3;
  RunRequestPhase phase = 4;
  bool paused = 5;
  bool stop_requested = 6;
  uint64 planned_count = 7;
  uint64 prepared_count = 8;
  uint64 finished_count = 9;
  uint64 unstarted_count = 10;
  uint64 failed_count = 11;
  uint64 claimed_count = 12;
  RunAttemptClaim last_claim = 13;
  google.protobuf.Timestamp accepted_at = 14;
  // Authorized provider dispatch, not proof that a device action occurred.
  google.protobuf.Timestamp provider_started_at = 15;
  google.protobuf.Timestamp finished_at = 16;
  optional string submitted_by = 17;
  optional string interruption = 18;
  ExecutionMode mode = 19;
}
message RunAttemptClaim { uint64 ordinal = 1; string case_id = 2; string execution_id = 3; }
enum RunRequestPhase {
  RUN_REQUEST_PHASE_UNSPECIFIED = 0;
  RUN_REQUEST_PHASE_QUEUED = 1;
  RUN_REQUEST_PHASE_PREPARING = 2;
  RUN_REQUEST_PHASE_RUNNING = 3;
  RUN_REQUEST_PHASE_FINISHING = 4;
  RUN_REQUEST_PHASE_COMPLETED = 5;
  RUN_REQUEST_PHASE_FAILED = 6;
  RUN_REQUEST_PHASE_STOPPED = 7;
  RUN_REQUEST_PHASE_INTERRUPTED = 8;
}

// Observation position, not an exact command commit/checkpoint receipt.
message ControlReply { Cursor observed_cursor = 1; }
message RunReply {
  oneof outcome { Admission accepted = 1; Rejection rejected = 2; }
}
// Admission or resolution of the original keyed request; not execution completion.
// command_id is the durable GetRunRequest request_id. A resolved job_id after
// restart does not imply a live job. Query the receipt for durable completion.
message Admission { string command_id = 1; optional string job_id = 2; Cursor cursor = 3; google.protobuf.Timestamp accepted_at = 4; }
// Domain failures pack this in google.rpc.Status.details as Any with type URL
// type.googleapis.com/dokime.v1.Rejection. An error may follow
// a committed control transition (e.g. checkpoint failure); it does not promise
// rollback or make a retry safe.
message Rejection { string code = 1; string message = 2; repeated ValidationIssue issues = 3; }
message ValidationIssue { string path = 1; string message = 2; optional string expected = 3; }
message CycleSummary {
  string cycle_id = 1;
  Metadata metadata = 2;
  CycleStatus status = 3;
  uint64 case_count = 4;
  uint64 execution_count = 5;
  bool continue_on_failure = 6;
  Cursor observed_cursor = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp started_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  ResultSummary result = 11;
  // The admitted suite identity is retained in the bounded summary so shell
  // consumers need not embed every case/execution just to render its title.
  Metadata suite = 12;
}
// Detail pages preserve native planned-case / execution-attempt vector order.
// Ordinals are zero-based positions at this cursor, not permanent identities.
// Continuations require the same epoch/revision and an existing after-ID in the
// requested cycle; changed revisions abort and unknown markers are invalid.
message ListCasesRequest { string cycle_id = 1; uint32 limit = 2; string after_case_id = 3; Cursor cursor = 4; }
message ListCasesReply { repeated CaseSummary cases = 1; optional string next_after_case_id = 2; Cursor cursor = 3; }
message ListExecutionsRequest { string cycle_id = 1; uint32 limit = 2; string after_execution_id = 3; Cursor cursor = 4; }
message ListExecutionsReply { repeated ExecutionSummary executions = 1; optional string next_after_execution_id = 2; Cursor cursor = 3; }
// One planned case with everything a navigator renders about it, so a shell
// never joins this page against ListExecutions to learn a case's state.
//
// The latest attempt is the last attempt materialized for this case, which is
// the same attempt the runtime's rerun and restart admission reads. `status`
// projects that attempt: no attempt at all is PLANNED; an attempt materialized
// but never dispatched is QUEUED; otherwise the attempt's own outcome.
// `attempt_count` counts every live attempt, including superseded ones.
// `rerun_scheduled` means this case already carries a recorded outcome and a
// fresh undispatched attempt on top of it, so the next RunCase runs that one.
// Historical projections report no actions: a checkpoint is immutable. A
// captured cycle grouping also retains the plan without its attempt records,
// so its rows carry CASE_STATUS_UNSPECIFIED and a zero attempt count; the
// checkpoint's own execution and `HistoricalCycleContext.execution_order` are
// where that cycle's attempts live.
message CaseSummary {
  string case_id = 1;
  string template_id = 2;
  Metadata metadata = 3;
  uint64 ordinal = 4;
  CaseStatus status = 5;
  optional string latest_execution_id = 6;
  optional ExecutionStatus latest_execution_status = 7;
  uint32 attempt_count = 8;
  bool rerun_scheduled = 9;
  CaseActions actions = 10;
  string suite_id = 11;
}
// Which case mutations the runtime would admit right now, computed from the
// same checks RunCase, ScheduleCaseRerun and DeleteCase
// enforce. `unavailable_reasons` carries each refused operation's own reason
// text, deduplicated; it is diagnostic copy, not a stable code vocabulary.
// Eligibility is observed, never a promise: admission is re-checked on the
// mutation itself and a concurrent change can still reject it.
message CaseActions {
  bool run = 1;
  bool schedule_rerun = 2;
  reserved 3;
  reserved "reset_history";
  bool delete = 4;
  repeated string unavailable_reasons = 5;
}
message ExecutionSummary { string execution_id = 1; string case_id = 2; ExecutionStatus status = 3; uint64 ordinal = 4; }
enum CycleStatus {
  CYCLE_STATUS_UNSPECIFIED = 0; CYCLE_STATUS_PREVIEWED = 1; CYCLE_STATUS_READY = 2;
  CYCLE_STATUS_RUNNING = 3; CYCLE_STATUS_PAUSED = 4; CYCLE_STATUS_STOPPING = 5;
  CYCLE_STATUS_COMPLETED = 6; CYCLE_STATUS_FAILED = 7; CYCLE_STATUS_BLOCKED = 8;
  CYCLE_STATUS_STOPPED = 9; CYCLE_STATUS_CLEARED = 10;
}
// A case's state, derived from its latest attempt. This is a projection of the
// live attempt vector, not a stored field, so it changes with the attempts.
enum CaseStatus {
  CASE_STATUS_UNSPECIFIED = 0; CASE_STATUS_SKIPPED = 1; CASE_STATUS_INVALIDATED = 2;
  CASE_STATUS_PLANNED = 3; CASE_STATUS_QUEUED = 4; CASE_STATUS_RUNNING = 5;
  CASE_STATUS_PASSED = 6; CASE_STATUS_FAILED = 7; CASE_STATUS_BLOCKED = 8;
  CASE_STATUS_CANCELLED = 9; CASE_STATUS_INTERRUPTED = 10;
}
enum ExecutionStatus {
  EXECUTION_STATUS_UNSPECIFIED = 0; EXECUTION_STATUS_INVALIDATED = 1; EXECUTION_STATUS_PENDING = 2;
  EXECUTION_STATUS_RUNNING = 3; EXECUTION_STATUS_PASSED = 4; EXECUTION_STATUS_FAILED = 5;
  EXECUTION_STATUS_BLOCKED = 6; EXECUTION_STATUS_CANCELLED = 7;
  EXECUTION_STATUS_INTERRUPTED = 8; EXECUTION_STATUS_SKIPPED = 9;
}

// Current-runtime detail. Published historical checkpoints are a separate API.
message GetCaseRequest { string cycle_id = 1; string case_id = 2; }
message CaseDetail {
  CaseSummary summary = 1;
  Metadata suite = 2;
  uint64 parameter_count = 3;
  uint64 generation_index = 4;
  Cursor observed_cursor = 5;
}
message GetExecutionRequest { string execution_id = 1; }
message ExecutionDetail {
  ExecutionSummary summary = 1;
  string cycle_id = 2;
  EvidenceScope scope = 3;
  Metadata admitted_suite = 4;
  optional string admitted_template_id = 5;
  Metadata admitted_template = 6;
  ExecutionPluginIdentity admitted_plugin = 7;
  ExecutionInvalidation invalidation = 8;
  google.protobuf.Timestamp started_at = 9;
  google.protobuf.Timestamp finished_at = 10;
  ResultSummary result = 11;
  uint64 input_parameter_count = 12;
  uint64 output_parameter_count = 13;
  uint64 step_count = 14;
  Cursor observed_cursor = 15;
  ExecutionControls controls = 16;
}
// Snapshot eligibility reuses the mutation checks. A later mutation validates
// again; absent controls means no active execution-addressed request.
message ExecutionControls {
  string request_id = 1;
  bool paused = 2;
  bool stop_requested = 3;
  bool can_pause = 4;
  bool can_resume = 5;
  bool can_stop = 6;
  ExecutionMode mode = 7;
}
message ExecutionPluginIdentity {
  string source = 1;
  optional string version = 3;
  // Embedded generations identify registered callables, never captured binaries.
  oneof implementation {
    string content_digest = 2;
    string generation = 4;
  }
}
message ExecutionInvalidation { ExecutionPluginIdentity previous = 1; ExecutionPluginIdentity current = 2; }
message ResultSummary { ResultStatus status = 1; uint32 passed = 2; uint32 failed = 3; uint32 blocked = 4; uint32 skipped = 5; }
enum ResultStatus { RESULT_STATUS_UNSPECIFIED = 0; RESULT_STATUS_PENDING = 1; RESULT_STATUS_PASSED = 2; RESULT_STATUS_FAILED = 3; RESULT_STATUS_BLOCKED = 4; RESULT_STATUS_CANCELLED = 5; }
// Input parameters are frozen at admission. Outputs are separate evidence and
// overlay inputs by key for presentation; they never rewrite the input snapshot.
enum ExecutionParameterSet { EXECUTION_PARAMETER_SET_UNSPECIFIED = 0; EXECUTION_PARAMETER_SET_INPUTS = 1; EXECUTION_PARAMETER_SET_OUTPUTS = 2; }
// A continuation belongs to exactly one parameter selection at one runtime
// revision. Names use ascending UTF-8 order. A changed revision requires a fresh
// first page; changing selection is rejected even if its after-name exists.
message PlannedCaseParameters { string cycle_id = 1; string case_id = 2; }
message ParameterCursor {
  reserved 2;
  reserved "cycle_id";
  Cursor observed = 1;
  oneof selection {
    string execution_inputs_id = 3;
    string execution_outputs_id = 4;
    PlannedCaseParameters planned_case = 5;
  }
}
message ListCaseParametersRequest { string cycle_id = 1; string case_id = 2; uint32 limit = 3; string after_name = 4; ParameterCursor cursor = 5; }
message CaseParameter { string name = 1; Value value = 2; }
message ListCaseParametersReply { repeated CaseParameter parameters = 1; optional string next_after_name = 2; ParameterCursor cursor = 3; }
message ListExecutionParametersRequest { string execution_id = 1; ExecutionParameterSet set = 2; uint32 limit = 3; string after_name = 4; ParameterCursor cursor = 5; }
message ListMaterializedParametersReply { repeated MaterializedParameter parameters = 1; optional string next_after_name = 2; ParameterCursor cursor = 3; }
message MaterializedParameter { string name = 1; Metadata metadata = 2; optional string group_id = 3; ParameterSource source = 4; Value value = 5; MeasurementUnit unit = 6; }
enum ParameterSource { PARAMETER_SOURCE_UNSPECIFIED = 0; PARAMETER_SOURCE_DEFINITION = 1; PARAMETER_SOURCE_TRACEABILITY = 2; PARAMETER_SOURCE_ENVIRONMENT = 3; PARAMETER_SOURCE_RESOURCE = 4; PARAMETER_SOURCE_OPERATOR = 5; PARAMETER_SOURCE_RUNTIME = 6; PARAMETER_SOURCE_TELEMETRY = 7; PARAMETER_SOURCE_RECORD = 8; PARAMETER_SOURCE_OUTPUT = 9; }

// Current execution evidence in native vector order. Repeated measurement names
// remain separate entries; ordinals belong to this revision, not stable identity.
// Continuation binds execution, step, collection and exact runtime revision.
// Any state change aborts continuation; restart with no cursor. Limits: default
// 50, maximum 100. A value exceeding the documented Value budget is an explicit
// ResourceExhausted error, never truncated evidence.
message StepPageCursor { Cursor revision = 1; string execution_id = 2; string step_id = 3; StepPageKind kind = 4; uint64 next_ordinal = 5; }
enum StepPageKind { STEP_PAGE_KIND_UNSPECIFIED = 0; STEP_PAGE_KIND_STEPS = 1; STEP_PAGE_KIND_MEASUREMENTS = 2; STEP_PAGE_KIND_CRITERIA = 3; }
message ListExecutionStepsRequest { string execution_id = 1; uint32 limit = 2; StepPageCursor cursor = 3; }
message ListStepEvidenceRequest { string execution_id = 1; string step_id = 2; uint32 limit = 3; StepPageCursor cursor = 4; }
message ListExecutionStepsReply { repeated ExecutionStep steps = 1; StepPageCursor next_cursor = 2; Cursor observed_cursor = 3; }
message ListStepCriteriaReply { repeated StepCriterion criteria = 1; StepPageCursor next_cursor = 2; Cursor observed_cursor = 3; }
message ExecutionStep {
  string step_id = 1; Metadata metadata = 2; StepStatus status = 3;
  google.protobuf.Timestamp started_at = 4; google.protobuf.Timestamp finished_at = 5;
  uint64 measurement_count = 6; uint64 criterion_count = 7; uint64 ordinal = 8;
  // Why this step failed, for the one step that did. Present only on a failed
  // step, and already redacted: the step is the row an event log renders with a
  // status, so it is where the failure's own story belongs.
  optional Diagnostic detail = 9;
}
message StepMeasurement { Metadata metadata = 1; Value value = 2; MeasurementUnit unit = 3; uint64 ordinal = 4; }
message StepCriterion { string criterion_id = 1; Metadata metadata = 2; CriterionStatus status = 3; Value observed = 4; optional string message = 5; uint64 ordinal = 6; }
enum StepStatus { STEP_STATUS_UNSPECIFIED = 0; STEP_STATUS_PENDING = 1; STEP_STATUS_RUNNING = 2; STEP_STATUS_PASSED = 3; STEP_STATUS_FAILED = 4; STEP_STATUS_SKIPPED = 5; STEP_STATUS_CANCELLED = 6; }
// Indeterminate means no conclusive verdict is available, including unreported
// or unevaluated criteria. This status alone does not prove evaluation ran.
enum CriterionStatus { CRITERION_STATUS_UNSPECIFIED = 0; CRITERION_STATUS_PENDING = 1; CRITERION_STATUS_PASSED = 2; CRITERION_STATUS_FAILED = 3; CRITERION_STATUS_INDETERMINATE = 4; CRITERION_STATUS_SKIPPED = 5; }
