syntax = "proto3";
package dokime.v1;

import "dokime/v1/value.proto";

// Settings expose installed-plugin status and explicit calls into the
// preference boundary. Runtime owns credentials, validation and permissions;
// this service only carries typed request and reply values. A status probe
// and an options-list provider are the only plugin routes the host still
// calls; a multiple-choice setting names its options route rather than the
// host dispatching one here.
service Settings {
  rpc ReadStoragePolicy(ReadStoragePolicyRequest) returns (StoragePolicyView);
  rpc UpdateStoragePolicy(UpdateStoragePolicyRequest) returns (StoragePolicyView);
  rpc GetSettings(GetSettingsRequest) returns (SettingsFrame);
  rpc ListStorageSources(ListStorageSourcesRequest) returns (StorageSources);
  rpc ReorderStorageSources(ReorderStorageSourcesRequest) returns (StorageSources);
  rpc SetStorageSourceEnabled(SetStorageSourceEnabledRequest) returns (StorageSources);
  rpc GetPluginSettings(GetPluginSettingsRequest) returns (PluginRuntimeSettings);
  rpc UpdatePluginSettings(UpdatePluginSettingsRequest) returns (PluginRuntimeSettings);
  rpc UpdatePluginCredential(UpdatePluginCredentialRequest) returns (PluginRuntimeSettings);
  // The backend's settings.json: appearance and the data root. Saved values
  // apply to the next start of the backend; what is in effect now is reported
  // beside them.
  rpc ReadApplicationSettings(ReadApplicationSettingsRequest) returns (ApplicationSettings);
  rpc UpdateAppearance(UpdateAppearanceRequest) returns (ApplicationSettings);
  rpc UpdateDataRoot(UpdateDataRootRequest) returns (ApplicationSettings);
}

message ReadApplicationSettingsRequest {}

message UpdateAppearanceRequest { AppearancePreference appearance = 1; }

// An absent data root restores the default beneath the application root.
message UpdateDataRootRequest { optional string data_root = 1; }

enum ThemeMode {
  THEME_MODE_UNSPECIFIED = 0;
  THEME_MODE_SYSTEM = 1;
  THEME_MODE_LIGHT = 2;
  THEME_MODE_DARK = 3;
}

enum Density {
  DENSITY_UNSPECIFIED = 0;
  DENSITY_COMFORTABLE = 1;
  DENSITY_COMPACT = 2;
  DENSITY_TOUCH = 3;
}

message AppearancePreference {
  ThemeMode theme_mode = 1;
  optional string theme_family = 2;
  Density density = 3;
}

message ApplicationSettings {
  AppearancePreference appearance = 1;
  string application_root = 2;
  // Absent when settings.json names none and the default applies.
  optional string configured_data_root = 3;
  string default_data_root = 4;
  // The data root this backend process is using.
  string effective_data_root = 5;
  bool restart_required = 6;
}

message ReadStoragePolicyRequest {}
message UpdateStoragePolicyRequest {
  uint64 expected_revision = 1;
  StoragePolicy policy = 2;
}
message StoragePolicy {
  uint64 save_interval_ms = 1;
  uint64 compaction_interval_ms = 2;
  optional uint64 local_retention_ms = 3;
}
message StoragePolicyView {
  uint64 revision = 1;
  StoragePolicy configured = 2;
  StoragePolicy effective = 3;
  bool restart_required = 4;
}

message GetSettingsRequest {}

message ListStorageSourcesRequest {}
message ReorderStorageSourcesRequest { repeated string identifiers = 1; }
message SetStorageSourceEnabledRequest {
  string identifier = 1;
  bool enabled = 2;
}
message StorageSource {
  string identifier = 1;
  string adapter = 2;
  int64 priority = 3;
  bool enabled = 4;
}
message StorageSources { repeated StorageSource sources = 1; }

message SettingsFrame {
  repeated SettingsSection sections = 1;
  repeated SettingsCard cards = 2;
}

message SettingsSection {
  string section_id = 1;
  string label = 2;
  optional string description = 3;
  oneof owner {
    bool app = 4;
    string installed_plugin_id = 5;
  }
  sint32 order = 6;
}

message SettingsCard {
  string plugin_id = 1;
  string card_id = 2;
  string section_id = 3;
  string label = 4;
  optional string description = 5;
  HostCardBody body = 6;
  reserved 7;
  reserved "actions";
  SettingsCardRefreshPolicy refresh = 8;
  SettingsCardState state = 9;
  sint32 order = 10;
}

message HostCardBody { repeated HostCardBlock blocks = 1; }

message HostCardBlock {
  oneof kind {
    string text = 1;
    HostCardStatus status = 2;
    HostCardKeyValueList key_value_list = 3;
    HostCardMetrics metrics = 4;
  }
}

message HostCardStatus {
  string label = 1;
  HostCardTone tone = 2;
  optional string detail = 3;
}

message HostCardKeyValueList { repeated HostCardKeyValue items = 1; }

message HostCardKeyValue {
  string label = 1;
  string value = 2;
  optional string detail = 3;
}

message HostCardMetrics { repeated HostCardMetric items = 1; }

message HostCardMetric {
  string label = 1;
  string value = 2;
  optional string unit = 3;
  optional string trend = 4;
}

enum HostCardTone {
  HOST_CARD_TONE_UNSPECIFIED = 0;
  HOST_CARD_TONE_NEUTRAL = 1;
  HOST_CARD_TONE_INFO = 2;
  HOST_CARD_TONE_SUCCESS = 3;
  HOST_CARD_TONE_WARNING = 4;
  HOST_CARD_TONE_DANGER = 5;
}

message SettingsCardRefreshPolicy {
  oneof policy {
    ManualRefresh manual = 1;
    CachedRefresh cached = 2;
    OnDemandRefresh on_demand = 3;
  }
}

message ManualRefresh {}
message CachedRefresh { uint64 max_age_ms = 1; }
message OnDemandRefresh {}

enum SettingsCardState {
  SETTINGS_CARD_STATE_UNSPECIFIED = 0;
  SETTINGS_CARD_STATE_READY = 1;
  SETTINGS_CARD_STATE_DISABLED = 2;
  SETTINGS_CARD_STATE_DISCONNECTED = 3;
  SETTINGS_CARD_STATE_STALE = 4;
  SETTINGS_CARD_STATE_ERROR = 5;
  SETTINGS_CARD_STATE_PERMISSION_DENIED = 6;
}

message GetPluginSettingsRequest { string plugin_id = 1; }

message UpdatePluginSettingsRequest {
  string plugin_id = 1;
  ValueObject values = 2;
}

message UpdatePluginCredentialRequest {
  string plugin_id = 1;
  string credential_id = 2;
  string secret = 3;
}

message PluginRuntimeSettings {
  SettingsCatalog settings = 1;
  ValueObject values = 2;
  PluginRuntimeCredentialBindings credential_bindings = 3;
  // Values a plugin's discovery routes computed, by setting id, for the fields
  // nobody saved. A value here is shown on the card with a `Discovered` marker
  // and is used by no run: saving it is what turns it into an edited value.
  ValueObject discovered = 4;
}

message SettingsCatalog { repeated SettingContribution contributions = 1; }

message SettingContribution {
  oneof kind {
    BooleanSetting boolean = 1;
    TextAreaSetting text_area = 2;
    PathSetting path = 3;
    NumberSetting number = 4;
    MultipleChoiceSetting multiple_choice = 5;
    SecretSetting secret_reference = 6;
  }
  reserved 7;
  reserved "status";
}

message BooleanSetting {
  string id = 1;
  string title = 2;
  optional string description = 3;
  bool default = 4;
}

message TextAreaSetting {
  string id = 1;
  string title = 2;
  optional string description = 3;
  string default = 4;
  bool required = 5;
}

message PathSetting {
  string id = 1;
  string title = 2;
  optional string description = 3;
  string default = 4;
  bool required = 5;
}

message NumberSetting {
  string id = 1;
  string title = 2;
  optional string description = 3;
  double default = 4;
  optional double min = 5;
  optional double max = 6;
  optional double step = 7;
}

message MultipleChoiceSetting {
  string id = 1;
  string title = 2;
  optional string description = 3;
  string default = 4;
  repeated SettingChoice choices = 5;
  // The id of the plugin route that fills this dropdown at run time.
  optional string provider = 6;
}

message SettingChoice { string value = 1; string title = 2; }

message SecretSetting {
  string id = 1;
  string title = 2;
  optional string description = 3;
  SecretReference default = 4;
  bool required = 5;
}

message SecretReference {
  oneof kind {
    string environment = 1;
    string stored_credential = 2;
  }
}

message PluginRuntimeCredentialBindings {
  map<string, RedactedCredentialBinding> bindings = 1;
  repeated string missing_required = 2;
}

message RedactedCredentialBinding {
  string credential_id = 1;
  CredentialBackendKind backend = 2;
  bool configured = 3;
}

enum CredentialBackendKind {
  CREDENTIAL_BACKEND_KIND_UNSPECIFIED = 0;
  CREDENTIAL_BACKEND_KIND_OS_KEYRING = 1;
  CREDENTIAL_BACKEND_KIND_MEMORY = 2;
  CREDENTIAL_BACKEND_KIND_LOCAL_FILE = 3;
}
