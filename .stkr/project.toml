# Project Policy Owned by the Hub
# Native manifests own package metadata; mise owns executable recipes.
# Defaults stay implicit. Commented sections do not declare configuration.

# === === Hooks === === #

[hooks]
# Workspace repair and checks exceed one minute even with warm Cargo caches.
step_timeout_seconds = 900

# === === Conventions === === #

[conventions.rust]
generated = ["crates/dokime-protocol/src/v1.rs", "crates/dokime-protocol/src/harmos/v1.rs"]
# The Owner-Locked SDK Lives Beside The Other SDKs And Depends On The Facade And Server.
bindings = ["dokime-python"]

[conventions.rust.source_roots]
# Owner-Locked Layout Exception To The crates/<project>-python Convention.
dokime-python = "sdk/python/src"
# Validate the authored source that this compile-only crate renders and includes.
dokime-starter-check = "crates/cargo-dokime/templates"

[skeletons]
# Audit Native Sources And Cargo/CI Policy Skeletons.
include = ["**/*.rs", "**/*.py", "**/Cargo.toml", "mise.toml", ".stkr/project.toml"]
# Generated RPC output is owned and checked by the binding generators.
exclude = ["crates/dokime-gui/src-tauri/src/rpc/generated.rs"]

[barrels]
# Deliberate Public Import Surfaces: Authoring, Criterion Evidence And GUI Test Ports.
exclude = [
  "crates/dokime-runtime/src/prelude.rs",
  "crates/dokime-runtime/src/plugin/sidecar.rs",
  "crates/dokime-runtime/src/evidence.rs",
  "crates/dokime-gui/src-tauri/src/testing.rs",
]

[markdown]
include = ["**/README.md", "CHANGELOG.md", "docs/CONTRIBUTING.md", "docs/SECURITY.md", "LICENSE.md", ".github/**", "openspec/**", "docs/**/*.md"]
