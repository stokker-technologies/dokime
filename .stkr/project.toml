# === === Release === === #

[release]
dev_channel = true
repository = "stokker-technologies/dokime"
plugin_extension = "dokime"
crates_bootstrap_secret = "CARGO_REGISTRY_TOKEN"
# Prepare The Tutorial From The Same Versioned Client Bytes As The Release.
lock_commands = [
  [
    "cargo",
    "update",
    "--workspace",
  ],
  [
    "pnpm",
    "install",
    "--lockfile-only",
    "--ignore-scripts",
    "--dir",
    "crates/dokime-gui",
  ],
  [
    "uv",
    "lock",
  ],
  [
    "uv",
    "sync",
    "--locked",
    "--all-groups",
  ],
]
signature_checks = [
  [
    "uv",
    "run",
    "--locked",
    "--project",
    "tools/python",
    "python",
    "-m",
    "dokime_tools.package.installer",
    "verify",
    "--release-assets",
    "--require-signed",
  ],
]

[[release.package_signing]]
language = "rust"
platform = "windows"
secrets = ["TAURI_SIGNING_PRIVATE_KEY", "TAURI_SIGNING_PRIVATE_KEY_PASSWORD"]

[[release.assets]]
target = "linux-x86_64"
path = "target/package/{profile}/{target}/rust/installers/dokime_{version}_amd64.deb"
name = "{product}_{version}_amd64.deb"

[[release.assets]]
kind = "distribution"
target = "linux-x86_64"
path = "target/package/{profile}/{target}/rust/dokime-distribution-{version}-x86_64-unknown-linux-gnu.zip"
name = "{product}-distribution-{version}-x86_64-unknown-linux-gnu.zip"

[[release.assets]]
kind = "distribution"
target = "windows-x86_64"
path = "target/package/{profile}/{target}/rust/dokime-distribution-{version}-x86_64-pc-windows-msvc.zip"
name = "{product}-distribution-{version}-x86_64-pc-windows-msvc.zip"

[[release.assets]]
target = "linux-x86_64"
path = "target/package/{profile}/{target}/rust/installers/dokime-{version}-1.x86_64.rpm"
name = "{product}-{version}-1.x86_64.rpm"

[[release.assets]]
target = "windows-x86_64"
path = "target/package/{profile}/{target}/rust/installers/dokime-{version}-x86_64-pc-windows-msvc-setup.exe"
name = "{product}-{version}-x86_64-pc-windows-msvc-setup.exe"

[[release.assets]]
target = "windows-x86_64"
path = "target/package/{profile}/{target}/rust/installers/latest.json"
name = "latest.json"
signed_only = true

# === === PyO3 === === #

[[pyo3.modules]]
name = "_native"
crate = "dokime-python"
module_rename = "_native"
rust = "sdk/python/src"
stub = "sdk/python/python/dokime/_native.pyi"
import = "dokime._native"
root = true
state_exceptions = { PyOperationInstance = "The owned running invocation is single-use behind an async mutex; cancellation, immutable identity and response schema belong to that one scoped handle.", PyStream = "The Python stream coordinates one incoming Rust stream, a bounded input sender, opening task and cancellation; its Client is the existing cloneable handle.", PyBackend = "The session is shared through one async mutex; an admission flag closes export synchronously before shutdown is awaited, and endpoint/root are immutable startup snapshots." }
