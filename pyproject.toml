[project]
name = "dokime-rust-workspace"
version = "0.1.0"
requires-python = ">=3.13,<3.16"
dependencies = []

[dependency-groups]
test = ["grpcio>=1.84.0,<2", "pytest==9.1.1", "pytest-cov==7.1.0", "pytest-timeout==2.4.0"]
dev = [
  "dokime-client",
  "dokime-tools",
  "git-cliff==2.14.2",
  "hatchling==1.32.4",
  "mypy==2.4.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.17.0",
  "ty==0.0.86",
]

[tool.uv]
package = false
system-certs = true

[tool.uv.workspace]
members = ["packages/dokime-client", "tools/python"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[tool.uv.sources]
dokime-client = { workspace = true }
dokime-tools = { workspace = true }
