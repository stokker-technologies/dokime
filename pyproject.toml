[project]
name = "dokime-rust-workspace"
version = "0.1.5"
requires-python = ">=3.13,<3.16"
dependencies = []

[dependency-groups]
test = [
  "protobuf>=7.36.2,<8",
  "types-protobuf",
  "grpcio>=1.85.1,<2",
  "polars==2.1.0",
  "pytest==9.1.1",
  "pytest-benchmark==5.3.0",
  "pytest-cov==7.1.0",
  "pytest-timeout==2.4.0",
  "pytest-xdist==3.8.0",
]
dev = ["dokime-tools", "ruff==0.17.0", "ty==0.0.86"]
# SDK Authored Build Hooks and Generators Are Included in the Python Type Check.
sdk-tooling = [
  "hatchling==1.33.0",
  "grpcio-tools==1.85.1",
  "mypy-protobuf==5.1.0",
  "mypy==2.4.1",
  "types-protobuf==7.35.1.20260906",
  "types-grpcio==1.85.0.20261028",
]

[tool.uv]
package = false
system-certs = true

[tool.uv.workspace]
members = ["tools/python"]
# The SDK Wheel Is Built and Installed Explicitly by the SDK Tasks.
exclude = ["sdk/python"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[tool.uv.sources]
dokime-tools = { workspace = true }
