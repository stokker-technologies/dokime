syntax = "proto3";
package dokime.v1;
import "dokime/v1/execution.proto";
import "dokime/v1/values.proto";

// Shared prompt, traceability, file-capture and effect payloads.
message PromptCatalog { repeated Prompt prompts = 1; }
message Prompt {
  Metadata metadata = 1;
  string message = 2;
  repeated PromptField fields = 3;
  repeated PromptAction actions = 4;
  PromptArchetype archetype = 5;
  repeated AnswerRule rules = 6;
  EvidenceCondition condition = 7;
  string owner_suite = 8;
  string template = 9;
  repeated PromptValues examples = 10;
  Severity level = 11;
}
message PromptValues { map<string, Value> values = 1; }
enum PromptArchetype {
  PROMPT_ARCHETYPE_UNSPECIFIED = 0;
  PROMPT_ARCHETYPE_CONFIRMATION = 1;
  PROMPT_ARCHETYPE_FORM = 2;
  PROMPT_ARCHETYPE_CHOICE = 3;
  PROMPT_ARCHETYPE_STATUS = 4;
}
message PromptField {
  Metadata metadata = 1;
  ValueType type = 2;
  bool required = 3;
  bool multiple = 4;
  Value default_value = 5;
  repeated Value choices = 6;
  PromptFieldValidation validation = 7;
  PromptFieldKind kind = 8;
}
message PromptFieldValidation {
  optional uint64 min_length = 1;
  optional uint64 max_length = 2;
  optional string pattern = 3;
  Value minimum = 4;
  Value maximum = 5;
  optional uint64 min_items = 6;
  optional uint64 max_items = 7;
}
enum PromptFieldKind {
  PROMPT_FIELD_KIND_UNSPECIFIED = 0;
  PROMPT_FIELD_KIND_TEXT = 1;
  PROMPT_FIELD_KIND_FLOAT = 2;
  PROMPT_FIELD_KIND_INTEGER = 3;
  PROMPT_FIELD_KIND_CHOICE = 4;
  PROMPT_FIELD_KIND_BOOLEAN = 5;
}
message PromptAction {
  string identifier = 1;
  string label = 2;
  PromptActionEmphasis emphasis = 3;
  bool requires_condition = 4;
}
enum PromptActionEmphasis {
  PROMPT_ACTION_EMPHASIS_UNSPECIFIED = 0;
  PROMPT_ACTION_EMPHASIS_PRIMARY = 1;
  PROMPT_ACTION_EMPHASIS_SECONDARY = 2;
  PROMPT_ACTION_EMPHASIS_DANGER = 3;
}
message AnswerRule { AnswerPredicate predicate = 1; string message = 2; }
message AnswerPredicate {
  oneof kind {
    Value literal = 1;
    string field = 2;
    AnswerPredicate not = 3;
    AnswerBinaryPredicate binary = 4;
  }
}
message AnswerBinaryPredicate { AnswerOperator operator = 1; AnswerPredicate left = 2; AnswerPredicate right = 3; }
enum AnswerOperator {
  ANSWER_OPERATOR_UNSPECIFIED = 0;
  ANSWER_OPERATOR_AND = 1;
  ANSWER_OPERATOR_OR = 2;
  ANSWER_OPERATOR_EQ = 3;
  ANSWER_OPERATOR_NE = 4;
  ANSWER_OPERATOR_GT = 5;
  ANSWER_OPERATOR_GE = 6;
  ANSWER_OPERATOR_LT = 7;
  ANSWER_OPERATOR_LE = 8;
  ANSWER_OPERATOR_CONTAINS = 9;
  ANSWER_OPERATOR_STARTS_WITH = 10;
  ANSWER_OPERATOR_ENDS_WITH = 11;
}
message EvidenceCondition {
  oneof kind {
    RecordMatch record = 1;
    StreamMatch stream = 2;
    EvidenceConditions all = 3;
    EvidenceConditions any = 4;
  }
}
message EvidenceConditions { repeated EvidenceCondition conditions = 1; }
message RecordMatch { string kind = 1; map<string, Value> fields = 2; }
message StreamMatch {
  string stream = 1;
  string field = 2;
  StreamMatchOperator operator = 3;
  Value target = 4;
  optional double tolerance = 5;
}
enum StreamMatchOperator {
  STREAM_MATCH_OPERATOR_UNSPECIFIED = 0;
  STREAM_MATCH_OPERATOR_EXISTS = 1;
  STREAM_MATCH_OPERATOR_EQ = 2;
  STREAM_MATCH_OPERATOR_GT = 3;
  STREAM_MATCH_OPERATOR_GE = 4;
  STREAM_MATCH_OPERATOR_LT = 5;
  STREAM_MATCH_OPERATOR_LE = 6;
  STREAM_MATCH_OPERATOR_WITHIN = 7;
}

message TraceabilityEntry { Metadata metadata = 1; Value value = 2; string source = 3; string unit = 4; }

// One acknowledged chunk per call. Sequence starts at zero; last commits the
// artifact. This is not a stream. The host checks repeated name and media type.
message PublishArtifact {
  string transfer_id = 1;
  string name = 2;
  string mime = 3;
  uint64 sequence = 4;
  bytes data = 5;
  bool last = 6;
  bool aborted = 7;
  bool replace = 8;
}
message ArtifactReceipt { string artifact = 1; uint64 size_bytes = 2; bool sealed = 3; }

message FileSource {
  oneof kind { FileLocation file = 1; FileSelection tree = 2; FileSelection newest = 3; }
}
message FileLocation { oneof kind { string local = 1; FtpLocation ftp = 2; } }
message FtpLocation { string url = 1; optional string secret_id = 2; }
message FileSelection { FileLocation root = 1; repeated FileRule rules = 2; }
// Last matching rule wins. No rules selects every relative path.
message FileRule { string glob = 1; FileRuleAction action = 2; }
enum FileRuleAction { FILE_RULE_ACTION_UNSPECIFIED = 0; FILE_RULE_ACTION_INCLUDE = 1; FILE_RULE_ACTION_EXCLUDE = 2; }
message CaptureMode { oneof kind { StreamCapture stream = 1; MirrorCapture mirror = 2; } }
message StreamCapture { repeated LineMatcher matchers = 1; repeated LineMarker markers = 2; }
message MirrorCapture { optional uint32 interval_s = 1; }
// The stream's row descriptor comes from harmos.v1.Catalog.types.
message LineMatcher { string pattern = 1; string stream = 2; repeated LineField fields = 3; }
message LineField { string name = 1; ValueType type = 2; }
message LineMarker { string pattern = 1; string record_type = 2; }

message CapturedArtifact { string artifact = 1; uint64 size_bytes = 2; }
message CaptureGap { string path = 1; uint64 offset = 2; CaptureGapReason reason = 3; }
enum CaptureGapReason {
  CAPTURE_GAP_REASON_UNSPECIFIED = 0;
  CAPTURE_GAP_REASON_TRUNCATED = 1;
  CAPTURE_GAP_REASON_REPLACED = 2;
  CAPTURE_GAP_REASON_VANISHED = 3;
  CAPTURE_GAP_REASON_RESUME_UNSUPPORTED = 4;
}
