syntax = "proto3";
package dokime.v1;

import "dokime/v1/client_types.proto";

message NotesCreateNoteRequest {
  string epoch = 1;
  string mutation_id = 2;
  AnnotationOwner owner = 3;
  string message = 4;
}

message NotesCreateNoteRunInput {
  oneof value {
    NotesCreateNoteRequest request = 1;
    ClientEmpty cancel = 3;
    ClientEmpty finish = 4;
  }
}

message NotesCreateNoteRunOutput {
  oneof value {
    NoteReceipt response = 2;
  }
}

message NotesEditNoteRequest {
  string epoch = 1;
  string note_id = 2;
  string message = 3;
}

message NotesEditNoteRunInput {
  oneof value {
    NotesEditNoteRequest request = 1;
    ClientEmpty cancel = 3;
    ClientEmpty finish = 4;
  }
}

message NotesEditNoteRunOutput {
  oneof value {
    EditNoteResponse response = 2;
  }
}

message NotesListNotesRequest {
  AnnotationSelection selection = 1;
  uint32 limit = 2;
  string after_id = 3;
  Cursor cursor = 4;
}

message NotesListNotesRunInput {
  oneof value {
    NotesListNotesRequest request = 1;
    ClientEmpty cancel = 3;
    ClientEmpty finish = 4;
  }
}

message NotesListNotesRunOutput {
  oneof value {
    ListNotesResponse response = 2;
  }
}

service Notes {
  // Public. dokime.notes.create_note. Cancelling this call does not undo committed mutations or cancel an admitted
  // execution.
  rpc CreateNote (.dokime.v1.NotesCreateNoteRequest) returns (.dokime.v1.NoteReceipt);
  // Public. Request first; ordered items, then finish or cancel; await settlement and final status.
  rpc RunCreateNote (stream .dokime.v1.NotesCreateNoteRunInput) returns (stream .dokime.v1.NotesCreateNoteRunOutput);
  // Public. dokime.notes.edit_note. Cancelling this call does not undo committed mutations or cancel an admitted
  // execution.
  rpc EditNote (.dokime.v1.NotesEditNoteRequest) returns (.dokime.v1.EditNoteResponse);
  // Public. Request first; ordered items, then finish or cancel; await settlement and final status.
  rpc RunEditNote (stream .dokime.v1.NotesEditNoteRunInput) returns (stream .dokime.v1.NotesEditNoteRunOutput);
  // Public. dokime.notes.list_notes. Follow the returned continuation with unchanged filters/order and its
  // captured cursor; an absent continuation ends paging. Cancelling this call does not undo committed mutations or
  // cancel an admitted execution.
  rpc ListNotes (.dokime.v1.NotesListNotesRequest) returns (.dokime.v1.ListNotesResponse);
  // Public. Request first; ordered items, then finish or cancel; await settlement and final status.
  rpc RunListNotes (stream .dokime.v1.NotesListNotesRunInput) returns (stream .dokime.v1.NotesListNotesRunOutput);
}
