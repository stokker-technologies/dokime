syntax = "proto3";
package dokime.v1;

import "dokime/v1/catalog.proto";
import "dokime/v1/client_types.proto";

message CatalogGetRecordSchemaRequest {
  string record_type = 1;
}

message CatalogGetRecordSchemaRunInput {
  oneof value {
    CatalogGetRecordSchemaRequest request = 1;
    ClientEmpty cancel = 3;
    ClientEmpty finish = 4;
  }
}

message CatalogGetRecordSchemaRunOutput {
  oneof value {
    RecordSchema response = 2;
  }
}

message CatalogGetSuiteRequest {
  string suite_id = 1;
}

message CatalogGetSuiteRunInput {
  oneof value {
    CatalogGetSuiteRequest request = 1;
    ClientEmpty cancel = 3;
    ClientEmpty finish = 4;
  }
}

message CatalogGetSuiteRunOutput {
  oneof value {
    Suite response = 2;
  }
}

message CatalogGetTelemetrySchemaRequest {
  string stream = 1;
}

message CatalogGetTelemetrySchemaRunInput {
  oneof value {
    CatalogGetTelemetrySchemaRequest request = 1;
    ClientEmpty cancel = 3;
    ClientEmpty finish = 4;
  }
}

message CatalogGetTelemetrySchemaRunOutput {
  oneof value {
    TelemetrySchema response = 2;
  }
}

message CatalogListRecordSchemasRequest {

}

message CatalogListRecordSchemasRunInput {
  oneof value {
    CatalogListRecordSchemasRequest request = 1;
    ClientEmpty cancel = 3;
    ClientEmpty finish = 4;
  }
}

message CatalogListRecordSchemasRunOutput {
  oneof value {
    ListRecordSchemasReply response = 2;
  }
}

message CatalogListSuitesRequest {

}

message CatalogListSuitesRunInput {
  oneof value {
    CatalogListSuitesRequest request = 1;
    ClientEmpty cancel = 3;
    ClientEmpty finish = 4;
  }
}

message CatalogListSuitesRunOutput {
  oneof value {
    ListSuitesReply response = 2;
  }
}

message CatalogListTelemetrySchemasRequest {

}

message CatalogListTelemetrySchemasRunInput {
  oneof value {
    CatalogListTelemetrySchemasRequest request = 1;
    ClientEmpty cancel = 3;
    ClientEmpty finish = 4;
  }
}

message CatalogListTelemetrySchemasRunOutput {
  oneof value {
    ListTelemetrySchemasReply response = 2;
  }
}

service Catalog {
  // Public. dokime.catalog.get_record_schema. Cancelling this call does not undo committed mutations or cancel an
  // admitted execution.
  rpc GetRecordSchema (.dokime.v1.CatalogGetRecordSchemaRequest) returns (.dokime.v1.RecordSchema);
  // Public. Request first; ordered items, then finish or cancel; await settlement and final status.
  rpc RunGetRecordSchema (stream .dokime.v1.CatalogGetRecordSchemaRunInput) returns (stream .dokime.v1.CatalogGetRecordSchemaRunOutput);
  // Public. dokime.catalog.get_suite. Cancelling this call does not undo committed mutations or cancel an admitted
  // execution.
  rpc GetSuite (.dokime.v1.CatalogGetSuiteRequest) returns (.dokime.v1.Suite);
  // Public. Request first; ordered items, then finish or cancel; await settlement and final status.
  rpc RunGetSuite (stream .dokime.v1.CatalogGetSuiteRunInput) returns (stream .dokime.v1.CatalogGetSuiteRunOutput);
  // Public. dokime.catalog.get_telemetry_schema. Cancelling this call does not undo committed mutations or cancel
  // an admitted execution.
  rpc GetTelemetrySchema (.dokime.v1.CatalogGetTelemetrySchemaRequest) returns (.dokime.v1.TelemetrySchema);
  // Public. Request first; ordered items, then finish or cancel; await settlement and final status.
  rpc RunGetTelemetrySchema (stream .dokime.v1.CatalogGetTelemetrySchemaRunInput)
      returns (stream .dokime.v1.CatalogGetTelemetrySchemaRunOutput);
  // Public. dokime.catalog.list_record_schemas. Returns the complete bounded set in stable order.
  rpc ListRecordSchemas (.dokime.v1.CatalogListRecordSchemasRequest) returns (.dokime.v1.ListRecordSchemasReply);
  // Public. Request first; ordered items, then finish or cancel; await settlement and final status.
  rpc RunListRecordSchemas (stream .dokime.v1.CatalogListRecordSchemasRunInput)
      returns (stream .dokime.v1.CatalogListRecordSchemasRunOutput);
  // Public. dokime.catalog.list_suites. Returns the complete bounded set in stable order.
  rpc ListSuites (.dokime.v1.CatalogListSuitesRequest) returns (.dokime.v1.ListSuitesReply);
  // Public. Request first; ordered items, then finish or cancel; await settlement and final status.
  rpc RunListSuites (stream .dokime.v1.CatalogListSuitesRunInput) returns (stream .dokime.v1.CatalogListSuitesRunOutput);
  // Public. dokime.catalog.list_telemetry_schemas. Returns the complete bounded set in stable order.
  rpc ListTelemetrySchemas (.dokime.v1.CatalogListTelemetrySchemasRequest) returns (.dokime.v1.ListTelemetrySchemasReply);
  // Public. Request first; ordered items, then finish or cancel; await settlement and final status.
  rpc RunListTelemetrySchemas (stream .dokime.v1.CatalogListTelemetrySchemasRunInput)
      returns (stream .dokime.v1.CatalogListTelemetrySchemasRunOutput);
}
