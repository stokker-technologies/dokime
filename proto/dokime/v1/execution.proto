syntax = "proto3";

package dokime.v1;

import "dokime/v1/values.proto";
import "google/protobuf/timestamp.proto";

// ------------------------------------------------- Operations a plugin serves
//
// Operation identifiers, all Private:
//   <template>.materialize   MaterializeRequest -> TestCase       (pure)
//   <template>.initialize    InitializeRequest  -> InitializeResponse   (optional)
//   <template>.cleanup       CleanupRequest     -> CleanupResponse      (optional)
//   Step.operation           StepRequest        -> StepResponse
//   Criterion.operation      CriterionRequest   -> CriterionResponse
// Execution calls use the execution identifier as Harmos Request.scope.
// Pure materialization has no execution scope, including during preview.

message MaterializeRequest {
  string template = 1;
  // One resolved parameter set from the host's expansion.
  map<string, Value> parameters = 2;
}

message TestCase {
  reserved 1, 2, 3;
  reserved "template", "plugin", "digest";
  map<string, Value> parameters = 4;
  repeated Step steps = 5;
  repeated Criterion criteria = 6;
  // Identifiers of the streams the host opens for the execution.
  repeated string streams = 7;
}

// An execution freezes its definition and provenance, never a live run object.
message Origin {
  oneof kind {
    PluginRun plugin_run = 1;
    Import import = 2;
  }
}

message PluginRun {
  TestCase test_case = 1;
  string plugin = 2;
  string template = 3;
  bytes digest = 4;
  // The plugin process identity from harmos.v1.Description, not run start time.
  google.protobuf.Timestamp started_at = 5;
}

// Frozen import provenance. Admission, uploads and draft handles are separate.
message Import {
  Metadata metadata = 1;
  repeated ImportSource sources = 2;
  // Claimed identity; neither this nor sealing attests measurement authenticity.
  string importer = 3;
  string sdk_version = 4;
  string processing = 5;
  google.protobuf.Timestamp imported_at = 6;
  // Store-scoped whole-import key, distinct from a mutation request identity.
  string key = 7;
  // Corrections create new evidence and may name their sealed predecessor.
  string predecessor = 8;
}

message ImportSource {
  string name = 1;
  bytes sha256 = 2;
  // The host verifies attached bytes; unattached hashes remain importer claims.
  bool attached = 3;
}

message Step {
  // Evidence keys on metadata.identifier.
  Metadata metadata = 1;
  // Generated by the SDK. Its retry count is the operation's policy.
  string operation = 2;
  // The operator may run the step again in an interactive execution.
  bool repeatable = 3;
}

message Criterion {
  Metadata metadata = 1;
  string operation = 2;
}

message InitializeRequest {
  string execution = 1;
  TestCase test_case = 2;
  Origin origin = 3;
}

message InitializeResponse {}

message StepRequest {
  string execution = 1;
  // Metadata.identifier of the step.
  string step = 2;
  // Supplied on every execution call so the SDK can create its instance even
  // when the template has no initialize operation.
  TestCase test_case = 3;
  Origin origin = 4;
}

message StepResponse {}

message CriterionRequest {
  string execution = 1;
  // Metadata.identifier of the criterion.
  string criterion = 2;
  TestCase test_case = 3;
  Origin origin = 4;
}

message CriterionResponse {
  bool passed = 1;
}

message CleanupRequest {
  string execution = 1;
  Termination termination = 2;
  TestCase test_case = 3;
  Origin origin = 4;
}

message CleanupResponse {}

enum Termination {
  TERMINATION_UNSPECIFIED = 0;
  // Every step ran.
  TERMINATION_COMPLETED = 1;
  // A step or initialize failed.
  TERMINATION_FAILED = 2;
  // The operator stopped or cancelled the execution.
  TERMINATION_CANCELLED = 3;
  // The plugin process changed or host recovery closed an interrupted run.
  TERMINATION_INTERRUPTED = 4;
}

message Record {
  string kind = 1;
  bytes payload = 2;
  google.protobuf.Timestamp at = 3;
  uint64 ordinal = 4;
}



// Fields are meaningful only when count is greater than zero.


message ReportProgress {
  string execution = 1;
  uint64 completed = 2;
  uint64 total = 3;
  string label = 4;
}

message ReportProgressResponse {}





enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_DEBUG = 1;
  SEVERITY_INFO = 2;
  SEVERITY_WARNING = 3;
  SEVERITY_ERROR = 4;
}

message ReadSettings {}

message SavedSettings {
  // Saved values of the calling plugin's settings, by identifier.
  map<string, Value> values = 1;
}

message ReadSecret {
  string identifier = 1;
}

message Secret {
  bytes value = 1;
}

message Statistics {
  uint64 count = 1;
  double min = 2;
  double max = 3;
  double mean = 4;
  double stddev = 5;
  double median = 6;
  double p05 = 7;
  double p95 = 8;
  double p99 = 9;
  double first = 10;
  double last = 11;
}
