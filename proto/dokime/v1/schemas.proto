syntax = "proto3";
package dokime.v1;
option csharp_namespace = "Dokime.Protocol.V1";
import "dokime/v1/evidence.proto";
import "dokime/v1/formatting.proto";
import "dokime/v1/metadata.proto";
import "dokime/v1/scalar.proto";

message Field {
  string id = 1;
  .dokime.v1.FieldType value_type = 2;
  bool nullable = 3;
  optional string unit = 4;
}

enum FieldType {
  FIELD_TYPE_UNSPECIFIED = 0;
  FIELD_TYPE_BOOLEAN = 1;
  FIELD_TYPE_INTEGER = 2;
  FIELD_TYPE_INT64 = 3;
  FIELD_TYPE_UINT64 = 4;
  FIELD_TYPE_FLOAT64 = 5;
  FIELD_TYPE_TEXT = 6;
  FIELD_TYPE_DATETIME = 7;
  FIELD_TYPE_SEVERITY = 8;
  FIELD_TYPE_OBJECT = 9;
  FIELD_TYPE_ARRAY = 10;
}

message RecordDisplay {
  .dokime.v1.RecordIcon icon = 1;
  .dokime.v1.RecordTone tone = 2;
}

message RecordField {
  .dokime.v1.Metadata metadata = 1;
  .dokime.v1.ValueType value_type = 2;
  bool required = 3;
  bool nullable = 4;
  .dokime.v1.MeasurementUnit unit = 5;
  repeated .dokime.v1.Value choices = 6;
  .dokime.v1.Value default_value = 7;
  .dokime.v1.ValueFormat format = 8;
}

enum RecordIcon {
  RECORD_ICON_UNSPECIFIED = 0;
  RECORD_ICON_ACTIVITY = 1;
  RECORD_ICON_ALERT_TRIANGLE = 2;
  RECORD_ICON_ARCHIVE = 3;
  RECORD_ICON_BELL = 4;
  RECORD_ICON_CHECK_CIRCLE = 5;
  RECORD_ICON_CIRCLE_DASHED = 6;
  RECORD_ICON_CLIPBOARD_CHECK = 7;
  RECORD_ICON_CPU = 8;
  RECORD_ICON_FILE_TEXT = 9;
  RECORD_ICON_FLAG = 10;
  RECORD_ICON_GAUGE = 11;
  RECORD_ICON_HEART_PULSE = 12;
  RECORD_ICON_HELP_CIRCLE = 13;
  RECORD_ICON_MESSAGE_SQUARE_TEXT = 14;
  RECORD_ICON_PACKAGE = 15;
  RECORD_ICON_PLUG = 16;
  RECORD_ICON_RADIO_TOWER = 17;
  RECORD_ICON_ROTATE_CCW = 18;
  RECORD_ICON_SHIELD_ALERT = 19;
  RECORD_ICON_TARGET = 20;
  RECORD_ICON_TIMER_RESET = 21;
  RECORD_ICON_WRENCH = 22;
  RECORD_ICON_ZAP = 23;
  RECORD_ICON_CLOCK = 24;
}

message RecordSchema {
  string record_type = 1;
  uint32 schema_version = 2;
  .dokime.v1.Metadata metadata = 3;
  optional string template_identifier = 4;
  optional string owner_suite_id = 5;
  .dokime.v1.Severity default_severity = 6;
  repeated .dokime.v1.RecordField fields = 7;
  optional .dokime.v1.ValidationMode validation_mode = 8;
  bool allow_extra_fields = 9;
  .dokime.v1.RecordDisplay display = 10;
  // Fully qualified protobuf message in the frozen descriptor set.
  string message_name = 11;
}

enum RecordTone {
  RECORD_TONE_UNSPECIFIED = 0;
  RECORD_TONE_INFO = 1;
  RECORD_TONE_SUCCESS = 2;
  RECORD_TONE_WARNING = 3;
  RECORD_TONE_DANGER = 4;
  RECORD_TONE_ACCENT = 5;
  RECORD_TONE_MUTED = 6;
  RECORD_TONE_NEUTRAL = 7;
}

message Schema {
  string identity = 1;
  repeated uint32 versions = 2;
  repeated .dokime.v1.Field fields = 3;
}

message TelemetryColumn {
  .dokime.v1.Metadata metadata = 1;
  .dokime.v1.ValueType value_type = 2;
  .dokime.v1.TelemetryRole role = 3;
  .dokime.v1.MeasurementUnit unit = 4;
  optional string display_unit = 5;
  bool required = 6;
  bool nullable = 7;
  .dokime.v1.Value default_value = 8;
  .dokime.v1.ValueFormat format = 9;
}

enum TelemetryRole {
  TELEMETRY_ROLE_UNSPECIFIED = 0;
  TELEMETRY_ROLE_VALUE = 1;
  TELEMETRY_ROLE_COUNTER = 2;
  TELEMETRY_ROLE_STATE = 3;
  TELEMETRY_ROLE_DISTANCE = 4;
  TELEMETRY_ROLE_LATENCY = 5;
  TELEMETRY_ROLE_THROUGHPUT = 6;
}

message TelemetrySchema {
  string stream = 1;
  uint32 schema_version = 2;
  .dokime.v1.Schema storage_schema = 3;
  .dokime.v1.Metadata metadata = 4;
  optional string template_identifier = 5;
  optional string owner_suite_id = 6;
  repeated .dokime.v1.TelemetryColumn columns = 7;
  optional string default_x = 8;
  bool allow_extra_fields = 9;
  bool scalar = 10;
  optional .dokime.v1.ValidationMode validation_mode = 11;
  bool foreign = 12;
  // Fully qualified protobuf row message in the frozen descriptor set.
  string message_name = 13;
}

enum ValidationMode {
  VALIDATION_MODE_UNSPECIFIED = 0;
  VALIDATION_MODE_STRICT = 1;
  VALIDATION_MODE_PROTOTYPE = 2;
}
