syntax = "proto3";
package dokime.v1;
import "dokime/v1/appearance.proto";
import "dokime/v1/catalog_types.proto";
import "dokime/v1/document_types.proto";
import "dokime/v1/execution.proto";
import "dokime/v1/host.proto";
import "dokime/v1/plugins.proto";
import "dokime/v1/values.proto";
import "google/protobuf/timestamp.proto";
import "harmos/v1/types.proto";

// Shared Resource Payloads; Operation Wrappers Live With Their Face Resource.

// Shared Resource Message Contracts
// Canonical values, documents, catalogs and plugin origins are imported, never mirrored.
// New message field numbers are protocol-owned; native row-derived schemas are retired.
message ClientEmpty {}

enum ExecutionState {
  EXECUTION_STATE_UNSPECIFIED = 0;
  EXECUTION_STATE_OPEN = 1;
  EXECUTION_STATE_CLOSED = 2;
  EXECUTION_STATE_SEALED = 3;
}

// Exactly one attribution is required. Only evaluated outcomes participate in the cycle headline verdict.
// Declared and unevaluated executions are counted separately; an empty evaluated set is never Passed.
message ExecutionOutcome {
  oneof attribution {
    UnevaluatedOutcome not_evaluated = 1;
    EvaluatedOutcome evaluated = 2;
    DeclaredOutcome declared = 3;
  }
}

message UnevaluatedOutcome { Termination termination = 1; string reason = 2; }

// Unspecified/Pending are invalid here. Without evaluated criteria, use not_evaluated;
// an empty criterion set cannot produce an evaluated pass.
message EvaluatedOutcome { ResultStatus status = 1; string reason = 2; }

message DeclaredOutcome { ResultStatus status = 1; string reason = 2; string importer = 3; }

// Schemas frozen for this execution, from its plugin catalog or its import-local catalog. Import schemas do not
// register a plugin or overwrite global definitions.
message FrozenSchemas {
  // Frozen descriptors and contract identities for exact payload decoding.
  harmos.v1.Catalog catalog = 3;
  repeated RecordSchema records = 1;
  repeated TelemetrySchema streams = 2;
}

message MapValue { map<string, Value> values = 1; }

// Live manager state, never persisted as an execution state or a Run object.
enum LiveExecutionState {
  LIVE_EXECUTION_STATE_UNSPECIFIED = 0;
  LIVE_EXECUTION_STATE_QUEUED = 1;
  LIVE_EXECUTION_STATE_INITIALIZING = 2;
  LIVE_EXECUTION_STATE_STEPPING = 3;
  LIVE_EXECUTION_STATE_EVALUATING = 4;
  LIVE_EXECUTION_STATE_CLEANING_UP = 5;
  LIVE_EXECUTION_STATE_FINISHED = 6;
  LIVE_EXECUTION_STATE_CANCELLED = 7;
  LIVE_EXECUTION_STATE_INTERRUPTED = 8;
}

message AbsoluteTimeFormat {
  string pattern = 1;
}

message AdmittedPlugin {
  Plugin plugin = 1;
}

// Continue plugin identifier ordering within one process epoch and admission revision. Availability changes can
// invalidate pagination.
message AdmittedPluginCursor {
  string epoch = 1;
  uint64 revision = 2;
  string after_plugin_id = 3;
}

message AdmittedPluginPage {
  repeated AdmittedPlugin plugins = 1;
  AdmittedPluginCursor next = 2;
  uint64 total_count = 3;
  string epoch = 4;
  uint64 revision = 5;
}

// Columns are group-by fields in request order followed by aggregate aliases in request order; every row follows
// that order. complete=false means additional groups exceeded the effective result limit.
message AggregateReply {
  repeated string columns = 1;
  repeated QueryRow rows = 2;
  bool complete = 3;
}

// Unary analysis operations use the analysis metadata identifier as their operation ID.
// Input is one bounded raw scalar series; output must match every declared output.
message AnalysisRequest {
  AnalysisSamples samples = 1;
  MapValue parameters = 2;
}

message AnalysisSamples {
  repeated double axis = 1;
  repeated double values = 2;
  string axis_unit = 3;
  string unit = 4;
}

message AnalysisResponse { repeated AnalysisValues outputs = 1; }

message AnalysisComputation {
  Analysis definition = 1;
  AnalysisSelection selection = 2;
  AnalysisEvidence source = 3;
  repeated AnalysisSeries series = 4;
}

message AnalysisEvidence {
  string store = 1;
  string epoch = 2;
  uint64 position = 3;
  string stream = 4;
  EvidenceScope scope = 5;
  optional double window_s = 6;
  repeated string fields = 7;
  string x_key = 8;
}

message AnalysisSelection {
  string id = 1;
  uint32 version = 2;
  MapValue parameters = 3;
}

message AnalysisSeries {
  string key = 1;
  string label = 2;
  optional string origin = 3;
  uint64 input_samples = 4;
  double first_axis = 5;
  double last_axis = 6;
  repeated AnalysisValues outputs = 7;
}

message AnalysisValues {
  string key = 1;
  string unit = 2;
  string axis_unit = 3;
  repeated double axis = 4;
  repeated double values = 5;
  repeated uint32 display_indices = 6;
}

message AnnotationOwner {
  AnnotationOwnerOwner owner = 1;
}

message AnnotationOwnerOwner {
  oneof kind {
    string cycle_id = 1;
    PlannedCaseNoteOwner planned_case = 2;
    ExecutionNoteOwner execution = 3;
  }
}

message AnnotationSelection {
  AnnotationOwner owner = 1;
  bool include_context = 2;
}

message AppearanceAssetFrame {
  AppearanceAssetFramePayload payload = 1;
}

message AppearanceAssetFramePayload {
  oneof kind {
    AppearanceAssetMetadata metadata = 1;
    ArtifactChunk chunk = 2;
    ArtifactCompletion complete = 3;
  }
}

message ApplicationAppearance {
  ThemeMode theme_mode = 1;
  optional string theme_family = 2;
  Density density = 3;
}

message ApplicationSettings {
  ApplicationAppearance appearance = 1;
  ReportDefaults report = 2;
  ClientPreferences client = 3;
  TelemetryPreferences telemetry = 4;
  RemoteListenerSettings listener = 5;
  PluginPreferences plugins = 6;
}

enum ArchiveScope {
  ARCHIVE_SCOPE_UNSPECIFIED = 0;
  ARCHIVE_SCOPE_UNARCHIVED = 1;
  ARCHIVE_SCOPE_ARCHIVED = 2;
  ARCHIVE_SCOPE_ALL = 3;
}

message ArtifactChunk {
  uint64 offset = 1;
  bytes data = 2;
}

message ArtifactCompletion {
  uint64 size_bytes = 1;
  string sha256 = 2;
}

message ArtifactMetadata {
  string artifact_id = 1;
  string upload_id = 2;
  ArtifactScope scope = 3;
  string filename = 4;
  optional string content_type = 5;
  uint64 size_bytes = 6;
  string sha256 = 7;
  ArtifactState state = 8;
  google.protobuf.Timestamp created_at = 9;
  optional string error = 10;
}

message ArtifactScope {
  optional string cycle_id = 1;
  optional string case_id = 2;
  optional string execution_id = 3;
}

enum ArtifactState {
  ARTIFACT_STATE_UNSPECIFIED = 0;
  ARTIFACT_STATE_COMPLETE = 1;
  ARTIFACT_STATE_CANCELLED = 2;
  ARTIFACT_STATE_REJECTED = 3;
  ARTIFACT_STATE_FAILED = 4;
}

message BootstrapPaths {
  string application = 1;
  string storage = 2;
  string plugins = 3;
  string logs = 4;
}

message Bucket {
  google.protobuf.Timestamp start = 1;
  google.protobuf.Timestamp end = 2;
  string execution_id = 3;
  string stream = 4;
  string source = 5;
  repeated uint32 versions = 6;
  uint64 sample_count = 7;
  repeated BucketValue fields = 8;
}

message BucketRequest {
  uint64 every_nanos = 1;
  Aggregate aggregate = 2;
}

message BucketValue {
  string field = 1;
  uint64 count = 2;
  StatisticValue value = 3;
  optional string unit = 4;
  Aggregate reducer = 5;
}

message CachedRefresh {
  uint64 max_age_ms = 1;
}

message CapturedErrorCause {
  string message = 1;
  optional string code = 2;
  optional string source = 3;
}

message CapturedRecord {
  // Original protobuf bytes interpreted using the frozen record descriptor.
  bytes payload = 16;
  string record_id = 1;
  uint64 sequence = 2;
  google.protobuf.Timestamp timestamp = 3;
  string record_type = 4;
  uint32 schema_version = 5;
  string source = 6;
  Severity severity = 7;
  optional string message = 8;
  CapturedRecordError error = 9;
  Value details = 10;
  EvidenceScope scope = 11;
  optional string related_sample_id = 12;
  optional string related_stream_id = 13;
  optional string related_artifact_id = 14;
  google.protobuf.Timestamp received_at = 15;
}

message CapturedRecordError {
  string message = 1;
  optional string code = 2;
  optional string source = 3;
  repeated CapturedErrorCause cause_chain = 4;
  optional string stacktrace_attachment = 5;
  optional string trace_id = 6;
  optional string correlation_id = 7;
  optional string diagnostics = 8;
}

message CaseActions {
  bool delete = 1;
  repeated string unavailable_reasons = 2;
}

message CaseDetail {
  CaseSummary summary = 1;
  Metadata suite = 2;
  uint64 parameter_count = 3;
  uint64 generation_index = 4;
  .harmos.v1.ReadCut observed_cursor = 5;
}

message CaseParameter {
  string name = 1;
  Value value = 2;
}

enum CaseStatus {
  CASE_STATUS_UNSPECIFIED = 0;
  CASE_STATUS_SKIPPED = 1;
  CASE_STATUS_INVALIDATED = 2;
  CASE_STATUS_PLANNED = 3;
  CASE_STATUS_QUEUED = 4;
  CASE_STATUS_RUNNING = 5;
  CASE_STATUS_PASSED = 6;
  CASE_STATUS_FAILED = 7;
  CASE_STATUS_BLOCKED = 8;
  CASE_STATUS_CANCELLED = 9;
  CASE_STATUS_INTERRUPTED = 10;
}

message CaseSummary {
  string case_id = 1;
  string template_id = 2;
  Metadata metadata = 3;
  uint64 ordinal = 4;
  CaseStatus status = 5;
  optional string latest_execution_id = 6;
  optional ExecutionState latest_execution_status = 7;
  uint32 attempt_count = 8;
  CaseActions actions = 9;
  string suite_id = 10;
  ExecutionOutcome latest_execution_outcome = 11;
}

message ClientPreferences {
  uint64 connect_timeout_ms = 1;
  uint64 request_timeout_ms = 2;
}

message ContourGrid {
  uint32 columns = 1;
  uint32 rows = 2;
  repeated double x_edges = 3;
  repeated double y_edges = 4;
  repeated double values = 5;
  repeated bool valid = 6;
}

enum CriterionStatus {
  CRITERION_STATUS_UNSPECIFIED = 0;
  CRITERION_STATUS_PENDING = 1;
  CRITERION_STATUS_PASSED = 2;
  CRITERION_STATUS_FAILED = 3;
  CRITERION_STATUS_INDETERMINATE = 4;
  CRITERION_STATUS_SKIPPED = 5;
}

message CycleFilter {
  string text = 1;
  repeated CycleStatus statuses = 2;
  google.protobuf.Timestamp created_after = 3;
  google.protobuf.Timestamp created_before = 4;
  optional ArchiveScope archive = 5;
}

message CycleOrder {
  CycleOrderKey key = 1;
  bool descending = 2;
}

enum CycleOrderKey {
  CYCLE_ORDER_KEY_UNSPECIFIED = 0;
  CYCLE_ORDER_KEY_UPDATED_AT = 1;
  CYCLE_ORDER_KEY_CREATED_AT = 2;
  CYCLE_ORDER_KEY_LABEL = 3;
}

enum CyclePhase {
  CYCLE_PHASE_UNSPECIFIED = 0;
  CYCLE_PHASE_ACTIVE = 1;
  CYCLE_PHASE_SEALING = 2;
  CYCLE_PHASE_SEALED = 3;
  CYCLE_PHASE_SEAL_FAILED = 4;
}

message CycleScope {
  string cycle_id = 1;
  optional string execution_id = 2;
}

message CycleSelection {
  repeated string cycle_ids = 1;
  repeated CyclePhase phases = 2;
  Window created_at = 3;
  optional ArchiveScope archive = 4;
  repeated CycleStatus statuses = 5;
}

enum CycleStatus {
  CYCLE_STATUS_UNSPECIFIED = 0;
  CYCLE_STATUS_READY = 1;
  CYCLE_STATUS_RUNNING = 2;
  CYCLE_STATUS_PAUSED = 3;
  CYCLE_STATUS_STOPPING = 4;
  CYCLE_STATUS_COMPLETED = 5;
  CYCLE_STATUS_FAILED = 6;
  CYCLE_STATUS_BLOCKED = 7;
  CYCLE_STATUS_STOPPED = 8;
}

message CycleSummary {
  string cycle_id = 1;
  Metadata metadata = 2;
  CyclePhase phase = 3;
  CycleStatus status = 4;
  uint64 case_count = 5;
  uint64 execution_count = 6;
  bool continue_automatically = 7;
  .harmos.v1.ReadCut observed_cursor = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp started_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  ResultSummary result = 12;
  bool archived = 13;
  bool sealed = 14;
  uint64 running_count = 15;
  uint64 queued_count = 16;
  optional string seal_failure = 17;
  optional string rerun_of = 18;
}

enum Density {
  DENSITY_UNSPECIFIED = 0;
  DENSITY_COMFORTABLE = 1;
  DENSITY_COMPACT = 2;
  DENSITY_TOUCH = 3;
}

message Diagnostic {
  string message = 1;
  repeated string chain = 2;
  string location = 3;
  repeated string span_trace = 4;
  string backtrace = 5;
}

// Structure bindings carry source_id and complete metadata identity before
// StructureComplete. Evaluated replacements retain that identity after EvidenceCut.
message DocumentBinding {
  string source_id = 1;
  Metadata metadata = 2;
  DocumentBindingResult result = 3;
}

message DocumentBindingResult {
  oneof kind {
    bool literal = 1;
    DocumentSummary summary = 2;
    DocumentPlotDefinition plot = 3;
    bool pending = 4;
    DocumentCardFailure failure = 5;
  }
}

message DocumentCard {
  Metadata metadata = 1;
  repeated PlotFilter filters = 2;
  DocumentCardBody body = 3;
}

message DocumentCardBody {
  oneof kind {
    string markdown = 1;
    DocumentTable table = 2;
    DocumentSummary summary = 3;
    DocumentOwnerReference owner = 4;
  }
}

message DocumentCardBudget {
  string name = 1;
  uint64 limit = 2;
  uint64 reached = 3;
  string card_id = 4;
}

message DocumentCardFailure {
  string code = 1;
  string message = 2;
  DocumentCardBudget budget = 3;
}

enum DocumentCardKind {
  DOCUMENT_CARD_KIND_UNSPECIFIED = 0;
  DOCUMENT_CARD_KIND_TEXT = 1;
  DOCUMENT_CARD_KIND_TELEMETRY_SUMMARY = 2;
  DOCUMENT_CARD_KIND_PLOT = 3;
  DOCUMENT_CARD_KIND_TABLE = 4;
  DOCUMENT_CARD_KIND_STEPS = 5;
  DOCUMENT_CARD_KIND_CRITERIA = 6;
  DOCUMENT_CARD_KIND_TRACEABILITY = 7;
  DOCUMENT_CARD_KIND_NOTES = 8;
  DOCUMENT_CARD_KIND_RECORDS = 9;
  DOCUMENT_CARD_KIND_ARTIFACTS = 10;
  DOCUMENT_CARD_KIND_MEDIA = 11;
  DOCUMENT_CARD_KIND_HEALTH = 12;
  DOCUMENT_CARD_KIND_TELEMETRY_CONTEXT = 13;
}

// Both StructureComplete and final Completion count every frame through the
// marker itself, and the distinct cards, layout nodes, bindings, repeats and
// sections received so far. Counters must match the delivered frame sequence.
message DocumentCompletion {
  uint64 frame_count = 1;
  uint64 card_count = 2;
  uint64 layout_node_count = 3;
  uint64 binding_count = 4;
  uint64 repeat_count = 5;
  uint64 section_count = 6;
  bool partial = 7;
}

enum DocumentDensity {
  DOCUMENT_DENSITY_UNSPECIFIED = 0;
  DOCUMENT_DENSITY_COMPACT = 1;
  DOCUMENT_DENSITY_NORMAL = 2;
  DOCUMENT_DENSITY_SPACIOUS = 3;
}

message DocumentEvidenceCut {
  DocumentTelemetryCut cut = 1;
  bool telemetry = 2;
  bool cacheable = 3;
}

// Documents.Get frame order (also retained across bounded page continuations):
// header; source cards; summary group/tile definitions; bindings with source_id
// and metadata.identifier; repeat/section identities and layout; StructureComplete.
// The fixed EvidenceCut follows structure exactly once, before evaluated card
// results. Card results update the matching binding, followed by CardComplete
// naming that binding exactly once. Final Completion has matching counters.
// Structure-only results still include the fixed cut; partial results identify
// their projection. No result, CardComplete or final Completion precedes the cut.
message DocumentFrame {
  DocumentFrameFrame frame = 1;
}

message DocumentFrameFrame {
  oneof kind {
    DocumentHeader header = 1;
    DocumentLayoutNode layout_node = 2;
    DocumentCard card = 3;
    DocumentTableRow table_row = 4;
    DocumentSummaryGroup summary_group = 5;
    DocumentSummaryTile summary_tile = 6;
    DocumentWarning warning = 7;
    DocumentCompletion completion = 8;
    DocumentSummaryGroupDefinition group_definition = 9;
    DocumentSummaryTileDefinition tile_definition = 10;
    DocumentBinding binding = 11;
    DocumentRepeatSelection repeat_selection = 12;
    DocumentRepeatInstance repeat_instance = 13;
    DocumentSectionIdentity section_identity = 14;
    // Closes validated structure after source cards, definitions, bindings and layout.
    DocumentCompletion structure_complete = 15;
    // Binding identity whose evaluated result is now complete, after EvidenceCut.
    string card_complete = 16;
    bool expansion_complete = 17;
    // One fixed cut after StructureComplete and before any evaluated card result.
    DocumentEvidenceCut evidence_cut = 18;
    string section_removal = 19;
    string artifact_cut = 20;
    DocumentPage page = 21;
  }
}

message DocumentFrontiers {
  string process_epoch = 1;
  uint64 state_revision = 2;
  DocumentTelemetryCut telemetry = 3;
  optional string artifacts_sha256 = 4;
  DocumentTelemetryCut evidence = 5;
}

message DocumentHeader {
  string document_id = 1;
  Metadata metadata = 2;
  EvidenceScope scope = 3;
  DocumentFrontiers frontiers = 4;
}

message DocumentLayoutNode {
  uint64 ordinal = 1;
  optional uint64 parent_ordinal = 2;
  DocumentLayoutNodeNode node = 3;
}

message DocumentLayoutNodeNode {
  oneof kind {
    DocumentSection section = 1;
    DocumentPlacement placement = 2;
  }
}

message DocumentOwnerReference {
  DocumentCardKind kind = 1;
  optional string plot_id = 2;
  DocumentPlotDefinition plot = 3;
}

message DocumentPage {
  string current = 1;
  optional string next = 2;
}

message DocumentPlacement {
