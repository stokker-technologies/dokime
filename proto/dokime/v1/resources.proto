  optional string description = 5;
  HostCardBody body = 6;
  SettingsCardRefreshPolicy refresh = 7;
  SettingsCardState state = 8;
  int32 order = 9;
}

message SettingsCardRefreshPolicy {
  SettingsCardRefreshPolicyPolicy policy = 1;
