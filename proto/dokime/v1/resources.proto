  Metadata metadata = 2;
  DocumentRepeat repeat = 3;
}

message DocumentSectionIdentity {
  string node_id = 1;
  Metadata metadata = 2;
  optional string unavailable = 3;
}

message DocumentSpan {
  uint32 base = 1;
  optional uint32 sm = 2;
  optional uint32 md = 3;
  optional uint32 lg = 4;
  optional uint32 xl = 5;
}

message DocumentSummary {
  uint64 group_count = 1;
}

message DocumentSummaryCondition {
  FilterOperator operator = 1;
  Value value = 2;
  DocumentSummaryState state = 3;
}

enum DocumentSummaryFormat {
  DOCUMENT_SUMMARY_FORMAT_UNSPECIFIED = 0;
  DOCUMENT_SUMMARY_FORMAT_AUTO = 1;
  DOCUMENT_SUMMARY_FORMAT_NUMBER = 2;
  DOCUMENT_SUMMARY_FORMAT_PERCENT = 3;
  DOCUMENT_SUMMARY_FORMAT_DURATION = 4;
  DOCUMENT_SUMMARY_FORMAT_DISTANCE = 5;
  DOCUMENT_SUMMARY_FORMAT_STATUS = 6;
  DOCUMENT_SUMMARY_FORMAT_TEXT = 7;
}

message DocumentSummaryGroup {
  string card_id = 1;
  uint64 ordinal = 2;
  Metadata metadata = 3;
  uint64 tile_count = 4;
}

message DocumentSummaryGroupDefinition {
  string card_id = 1;
  uint64 ordinal = 2;
  Metadata metadata = 3;
  uint64 tile_count = 4;
}

enum DocumentSummaryPresentation {
  DOCUMENT_SUMMARY_PRESENTATION_UNSPECIFIED = 0;
  DOCUMENT_SUMMARY_PRESENTATION_VALUE = 1;
  DOCUMENT_SUMMARY_PRESENTATION_PROGRESS = 2;
  DOCUMENT_SUMMARY_PRESENTATION_BADGE = 3;
}

enum DocumentSummaryStat {
  DOCUMENT_SUMMARY_STAT_UNSPECIFIED = 0;
  DOCUMENT_SUMMARY_STAT_LATEST = 1;
}

enum DocumentSummaryState {
  DOCUMENT_SUMMARY_STATE_UNSPECIFIED = 0;
  DOCUMENT_SUMMARY_STATE_OK = 1;
  DOCUMENT_SUMMARY_STATE_WARNING = 2;
  DOCUMENT_SUMMARY_STATE_CRITICAL = 3;
  DOCUMENT_SUMMARY_STATE_MUTED = 4;
