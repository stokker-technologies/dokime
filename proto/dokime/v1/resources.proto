message DocumentSummaryTile {
  string card_id = 1;
  uint64 group_ordinal = 2;
  uint64 ordinal = 3;
  Metadata metadata = 4;
  Value value = 5;
  DocumentSummaryStat stat = 6;
  DocumentSummaryFormat format = 7;
  DocumentSummaryPresentation presentation = 8;
  optional string unit = 9;
  optional DocumentSummaryState state = 10;
