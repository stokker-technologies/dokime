  DataExpression z_expression = 4;
}

enum DocumentRail {
  DOCUMENT_RAIL_UNSPECIFIED = 0;
  DOCUMENT_RAIL_MAIN = 1;
  DOCUMENT_RAIL_RIGHT = 2;
  DOCUMENT_RAIL_LEFT = 3;
}

message DocumentRepeat {
  DataExpression value = 1;
  string label_template = 2;
  optional string id_template = 3;
  DataExpression order_by = 4;
  repeated PlotFilter filters = 5;
