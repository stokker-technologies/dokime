  string stream = 1;
  uint32 schema_version = 2;
  Schema storage_schema = 3;
  Metadata metadata = 4;
  optional string template_identifier = 5;
  optional string owner_suite_id = 6;
  repeated TelemetryColumn columns = 7;
  optional string default_x = 8;
  bool allow_extra_fields = 9;
  bool scalar = 10;
  optional ValidationMode validation_mode = 11;
  bool foreign = 12;
}

