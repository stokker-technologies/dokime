syntax = "proto3";
package dokime.v1;

import "dokime/v1/client_types.proto";
import "dokime/v1/values.proto";

message SecretsExportRequest {
  repeated string identifiers = 1;
  uint64 generation = 2;
}

message SecretsExportRunInput {
  oneof value {
    SecretsExportRequest request = 1;
    ClientEmpty cancel = 3;
    ClientEmpty finish = 4;
  }
}

message SecretsExportRunOutput {
  oneof value {
    SecretArchive response = 2;
  }
}

message SecretsImportRequest {
  bytes data = 1;
  repeated SecretImportChoice choices = 2;
  uint64 generation = 3;
}

message SecretsImportRunInput {
  oneof value {
    SecretsImportRequest request = 1;
    ClientEmpty cancel = 3;
    ClientEmpty finish = 4;
  }
}

message SecretsImportRunOutput {
  oneof value {
    SecretSnapshot response = 2;
  }
}

message SecretsListRequest {

}

message SecretsListRunInput {
  oneof value {
    SecretsListRequest request = 1;
    ClientEmpty cancel = 3;
    ClientEmpty finish = 4;
  }
}

message SecretsListRunOutput {
  oneof value {
    SecretSnapshot response = 2;
  }
}

message SecretsLookupRequest {
  string identifier = 1;
}

message SecretsLookupRunInput {
  oneof value {
    SecretsLookupRequest request = 1;
    ClientEmpty cancel = 3;
    ClientEmpty finish = 4;
  }
}

message SecretsLookupRunOutput {
  oneof value {
    SecretLookupValue response = 2;
  }
}

message SecretsPreviewRequest {
  bytes data = 1;
}

message SecretsPreviewRunInput {
  oneof value {
    SecretsPreviewRequest request = 1;
    ClientEmpty cancel = 3;
    ClientEmpty finish = 4;
  }
}

message SecretsPreviewRunOutput {
  oneof value {
    SecretImportPreview response = 2;
  }
}

message SecretsPutRequest {
  Metadata metadata = 1;
  optional string value = 2;
  uint64 generation = 3;
}

message SecretsPutRunInput {
  oneof value {
    SecretsPutRequest request = 1;
    ClientEmpty cancel = 3;
    ClientEmpty finish = 4;
  }
}

message SecretsPutRunOutput {
  oneof value {
    SecretSnapshot response = 2;
  }
}

message SecretsRemoveRequest {
  repeated string identifiers = 1;
  uint64 generation = 2;
}

message SecretsRemoveRunInput {
  oneof value {
    SecretsRemoveRequest request = 1;
    ClientEmpty cancel = 3;
    ClientEmpty finish = 4;
  }
}

message SecretsRemoveRunOutput {
  oneof value {
    SecretSnapshot response = 2;
  }
}

service Secrets {
  // Public. dokime.secrets.export. Cancelling this call does not undo committed mutations or cancel an admitted
  // execution.
  rpc Export (.dokime.v1.SecretsExportRequest) returns (.dokime.v1.SecretArchive);
  // Public. Request first; ordered items, then finish or cancel; await settlement and final status.
  rpc RunExport (stream .dokime.v1.SecretsExportRunInput) returns (stream .dokime.v1.SecretsExportRunOutput);
  // Public. dokime.secrets.import. Cancelling this call does not undo committed mutations or cancel an admitted
  // execution.
  rpc Import (.dokime.v1.SecretsImportRequest) returns (.dokime.v1.SecretSnapshot);
  // Public. Request first; ordered items, then finish or cancel; await settlement and final status.
  rpc RunImport (stream .dokime.v1.SecretsImportRunInput) returns (stream .dokime.v1.SecretsImportRunOutput);
  // Public. dokime.secrets.list. Cancelling this call does not undo committed mutations or cancel an admitted
  // execution.
  rpc List (.dokime.v1.SecretsListRequest) returns (.dokime.v1.SecretSnapshot);
  // Public. Request first; ordered items, then finish or cancel; await settlement and final status.
  rpc RunList (stream .dokime.v1.SecretsListRunInput) returns (stream .dokime.v1.SecretsListRunOutput);
  // Public. dokime.secrets.lookup. Cancelling this call does not undo committed mutations or cancel an admitted
  // execution.
  rpc Lookup (.dokime.v1.SecretsLookupRequest) returns (.dokime.v1.SecretLookupValue);
  // Public. Request first; ordered items, then finish or cancel; await settlement and final status.
  rpc RunLookup (stream .dokime.v1.SecretsLookupRunInput) returns (stream .dokime.v1.SecretsLookupRunOutput);
  // Public. dokime.secrets.preview. Cancelling this call does not undo committed mutations or cancel an admitted
  // execution.
  rpc Preview (.dokime.v1.SecretsPreviewRequest) returns (.dokime.v1.SecretImportPreview);
  // Public. Request first; ordered items, then finish or cancel; await settlement and final status.
  rpc RunPreview (stream .dokime.v1.SecretsPreviewRunInput) returns (stream .dokime.v1.SecretsPreviewRunOutput);
  // Public. dokime.secrets.put. Cancelling this call does not undo committed mutations or cancel an admitted
  // execution.
  rpc Put (.dokime.v1.SecretsPutRequest) returns (.dokime.v1.SecretSnapshot);
  // Public. Request first; ordered items, then finish or cancel; await settlement and final status.
  rpc RunPut (stream .dokime.v1.SecretsPutRunInput) returns (stream .dokime.v1.SecretsPutRunOutput);
  // Public. dokime.secrets.remove. Cancelling this call does not undo committed mutations or cancel an admitted
  // execution.
  rpc Remove (.dokime.v1.SecretsRemoveRequest) returns (.dokime.v1.SecretSnapshot);
  // Public. Request first; ordered items, then finish or cancel; await settlement and final status.
  rpc RunRemove (stream .dokime.v1.SecretsRemoveRunInput) returns (stream .dokime.v1.SecretsRemoveRunOutput);
}
