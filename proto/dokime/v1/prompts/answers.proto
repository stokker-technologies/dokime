syntax = "proto3";
package dokime.v1.prompts;
option csharp_namespace = "Dokime.Protocol.V1.Prompts";
import "dokime/v1/resources.proto";
import "harmos/v1/types.proto";

// Reads resolve latest durable once, without flushing accepted writes. Only
// returned cuts or seals are accepted as at; continuations bind cut, selection,
// ordering and schema. Missing positions and gaps fail explicitly.

message AnswersCreateRequest {
  string parent = 1;
  string action = 2;
  .dokime.v1.MapValue values = 3;
  bool accepted = 4;
  string request_id = 5;
}

message AnswersCreateResponse { .dokime.v1.PromptResponse answer = 1; .harmos.v1.Receipt receipt = 2; }

service Answers {
  // Public. Identity: dokime.v1.prompts.Answers/Create
  rpc Create(AnswersCreateRequest) returns (AnswersCreateResponse);
}
