// Shared Client Message Contracts
// Canonical values, documents, catalogs and plugin origins are imported, never mirrored.
// New message field numbers are protocol-owned; native row-derived schemas are retired.
message ClientEmpty {}
enum ExecutionState {
  EXECUTION_STATE_UNSPECIFIED = 0;
  EXECUTION_STATE_OPEN = 1;
  EXECUTION_STATE_CLOSED = 2;
  EXECUTION_STATE_SEALED = 3;
}
// Exactly one attribution is required. Only evaluated outcomes participate in the cycle headline verdict.
// Declared and unevaluated executions are counted separately; an empty evaluated set is never Passed.
message ExecutionOutcome {
  oneof attribution {
    UnevaluatedOutcome not_evaluated = 1;
    EvaluatedOutcome evaluated = 2;
    DeclaredOutcome declared = 3;
  }
}
message UnevaluatedOutcome { Termination termination = 1; string reason = 2; }
// Unspecified/Pending are invalid here. Without evaluated criteria, use not_evaluated;
// an empty criterion set cannot produce an evaluated pass.
message EvaluatedOutcome { ResultStatus status = 1; string reason = 2; }
message DeclaredOutcome { ResultStatus status = 1; string reason = 2; string importer = 3; }
// Schemas frozen for this execution, from its plugin catalog or its import-local catalog. Import schemas do not
// register a plugin or overwrite global definitions.
message FrozenSchemas {
  repeated RecordSchema records = 1;
  repeated TelemetrySchema streams = 2;
}
message MapValue { map<string, Value> values = 1; }
// Live manager state, never persisted as an execution state or a Run object.
enum LiveExecutionState {
  LIVE_EXECUTION_STATE_UNSPECIFIED = 0;
  LIVE_EXECUTION_STATE_QUEUED = 1;
  LIVE_EXECUTION_STATE_INITIALIZING = 2;
  LIVE_EXECUTION_STATE_STEPPING = 3;
  LIVE_EXECUTION_STATE_EVALUATING = 4;
  LIVE_EXECUTION_STATE_CLEANING_UP = 5;
  LIVE_EXECUTION_STATE_FINISHED = 6;
  LIVE_EXECUTION_STATE_CANCELLED = 7;
  LIVE_EXECUTION_STATE_INTERRUPTED = 8;
}

