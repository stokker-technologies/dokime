syntax = "proto3";
package dokime.v1;
option csharp_namespace = "Dokime.Protocol.V1";
import "dokime/v1/appearance.proto";
import "harmos/v1/types.proto";

// Reads resolve latest durable once, without flushing accepted writes. Only
// returned cuts or seals are accepted as at; continuations bind cut, selection,
// ordering and schema. Missing positions and gaps fail explicitly.

message BackendAppearanceRequest { .harmos.v1.ReadCut at = 1; }

message BackendAppearanceResponse { .dokime.v1.AppearanceSnapshot appearance = 1; .harmos.v1.ReadCut resolved_at = 2; }

service Backend {
  // Public. Identity: dokime.v1.Backend/Appearance
  rpc Appearance(BackendAppearanceRequest) returns (BackendAppearanceResponse);
}
