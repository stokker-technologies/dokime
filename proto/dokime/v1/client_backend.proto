syntax = "proto3";
package dokime.v1;

import "dokime/v1/backend.proto";
import "dokime/v1/client_types.proto";

message BackendCollectDiagnosticsOutput {
  oneof value {
    DiagnosticsBundleFrame item = 1;
    ClientEmpty response = 2;
  }
}

message BackendCollectDiagnosticsRunInput {
  oneof value {
    CollectBackendDiagnostics request = 1;
    ClientEmpty cancel = 3;
    ClientEmpty finish = 4;
  }
}

message BackendCollectDiagnosticsRunOutput {
  oneof value {
    DiagnosticsBundleFrame item = 1;
    ClientEmpty response = 2;
  }
}

message BackendGetAvailabilityRunInput {
  oneof value {
    GetBackendAvailability request = 1;
    ClientEmpty cancel = 3;
    ClientEmpty finish = 4;
  }
}

message BackendGetAvailabilityRunOutput {
  oneof value {
    BackendAvailability response = 2;
  }
}

message BackendGetHealthRunInput {
  oneof value {
    GetBackendHealth request = 1;
    ClientEmpty cancel = 3;
    ClientEmpty finish = 4;
  }
}

message BackendGetHealthRunOutput {
  oneof value {
    BackendHealth response = 2;
  }
}

message BackendGetIdentityRunInput {
  oneof value {
    GetBackendIdentity request = 1;
    ClientEmpty cancel = 3;
    ClientEmpty finish = 4;
  }
}

message BackendGetIdentityRunOutput {
  oneof value {
    BackendIdentity response = 2;
  }
}

message BackendWatchLogsOutput {
  oneof value {
    LogFrame item = 1;
    ClientEmpty response = 2;
  }
}

message BackendWatchLogsRunInput {
  oneof value {
    WatchBackendLogs request = 1;
    ClientEmpty cancel = 3;
    ClientEmpty finish = 4;
  }
}

message BackendWatchLogsRunOutput {
  oneof value {
    LogFrame item = 1;
    ClientEmpty response = 2;
  }
}

message BackendWatchTraceOutput {
  oneof value {
    TraceBatch item = 1;
    ClientEmpty response = 2;
  }
}

message BackendWatchTraceRunInput {
  oneof value {
    WatchBackendTrace request = 1;
    ClientEmpty cancel = 3;
    ClientEmpty finish = 4;
  }
}

message BackendWatchTraceRunOutput {
  oneof value {
    TraceBatch item = 1;
    ClientEmpty response = 2;
  }
}

service Backend {
  // Public. dokime.backend.collect_diagnostics. Output items precede the final response; require successful final
  // status. Cancelling this call does not undo committed mutations or cancel an admitted execution. Stream One
  // Support Archive Without Secret Material.
  rpc CollectDiagnostics (.dokime.v1.CollectBackendDiagnostics) returns (stream .dokime.v1.BackendCollectDiagnosticsOutput);
  // Public. Request first; ordered items, then finish or cancel; await settlement and final status.
  rpc RunCollectDiagnostics (stream .dokime.v1.BackendCollectDiagnosticsRunInput)
      returns (stream .dokime.v1.BackendCollectDiagnosticsRunOutput);
  // Public. dokime.backend.get_availability. Cancelling this call does not undo committed mutations or cancel an
  // admitted execution.
  rpc GetAvailability (.dokime.v1.GetBackendAvailability) returns (.dokime.v1.BackendAvailability);
  // Public. Request first; ordered items, then finish or cancel; await settlement and final status.
  rpc RunGetAvailability (stream .dokime.v1.BackendGetAvailabilityRunInput) returns (stream .dokime.v1.BackendGetAvailabilityRunOutput);
  // Public. dokime.backend.get_health. Cancelling this call does not undo committed mutations or cancel an
  // admitted execution.
  rpc GetHealth (.dokime.v1.GetBackendHealth) returns (.dokime.v1.BackendHealth);
  // Public. Request first; ordered items, then finish or cancel; await settlement and final status.
  rpc RunGetHealth (stream .dokime.v1.BackendGetHealthRunInput) returns (stream .dokime.v1.BackendGetHealthRunOutput);
  // Public. dokime.backend.get_identity. Cancelling this call does not undo committed mutations or cancel an
  // admitted execution.
  rpc GetIdentity (.dokime.v1.GetBackendIdentity) returns (.dokime.v1.BackendIdentity);
  // Public. Request first; ordered items, then finish or cancel; await settlement and final status.
  rpc RunGetIdentity (stream .dokime.v1.BackendGetIdentityRunInput) returns (stream .dokime.v1.BackendGetIdentityRunOutput);
  // Public. dokime.backend.watch_logs. Output items precede the final response; require successful final status.
  // Cancelling this call does not undo committed mutations or cancel an admitted execution. Replays a bounded tail
  // of the hub log, then follows it. Read access.
  rpc WatchLogs (.dokime.v1.WatchBackendLogs) returns (stream .dokime.v1.BackendWatchLogsOutput);
  // Public. Request first; ordered items, then finish or cancel; await settlement and final status.
  rpc RunWatchLogs (stream .dokime.v1.BackendWatchLogsRunInput) returns (stream .dokime.v1.BackendWatchLogsRunOutput);
  // Public. dokime.backend.watch_trace. Output items precede the final response; require successful final status.
  // Cancelling this call does not undo committed mutations or cancel an admitted execution. Pages the backend's
  // live tracing output for one scope, then optionally follows it. Read access, like the hub log it complements.
  rpc WatchTrace (.dokime.v1.WatchBackendTrace) returns (stream .dokime.v1.BackendWatchTraceOutput);
  // Public. Request first; ordered items, then finish or cancel; await settlement and final status.
  rpc RunWatchTrace (stream .dokime.v1.BackendWatchTraceRunInput) returns (stream .dokime.v1.BackendWatchTraceRunOutput);
}
