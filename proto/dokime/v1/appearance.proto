syntax = "proto3";
package dokime.v1;

// dokime.appearance.get_appearance: GetAppearance -> AppearanceSnapshot.
message GetAppearance {}

message AppearanceSnapshot {
  string app_name = 1;
  OrganizationIdentity organization = 2;
  optional string title_template = 3;
  repeated AppearanceLogo logos = 4;
  repeated ThemeFamily themes = 5;
  optional string active_theme = 6;
  bool theme_family_locked = 7;
  ThemeModePolicy mode_policy = 8;
  bool mode_locked = 9;
  optional string source_plugin_id = 10;
}

message OrganizationIdentity {
  string name = 1;
  optional string unit = 2;
  optional string website = 3;
}

message AppearanceLogo {
  LogoVariant variant = 1;
  AppearanceAssetMetadata asset = 2;
  optional string alt = 3;
}

// Public asset identity, never a filesystem path or URL. A changed digest
// requires a new appearance read; a download must not substitute new bytes.
message AppearanceAssetReference {
  string plugin_id = 1;
  string asset_id = 2;
  string sha256 = 3;
}

message AppearanceAssetMetadata {
  AppearanceAssetReference reference = 1;
  string content_type = 2;
  uint64 size_bytes = 3;
}

message ThemeFamily {
  string plugin_id = 1;
  string theme_id = 2;
  string label = 3;
  optional string description = 4;
  // Self-contained CSS, including font data, within the response budget.
  optional string stylesheet = 5;
  map<string, string> variables = 6;
  ThemeCornerRadii corner_radii = 7;
  ThemeVariant light = 8;
  ThemeVariant dark = 9;
}

message ThemeCornerRadii {
  optional string base = 1;
  optional string sm = 2;
  optional string md = 3;
  optional string lg = 4;
  optional string xl = 5;
  optional string two_xl = 6;
  optional string three_xl = 7;
  optional string four_xl = 8;
}

message ThemeVariant {
  map<string, string> variables = 1;
  repeated string plot_palette = 2;
}

// Typed detail in a standard google.rpc.Status envelope.
message AppearanceFailure { AppearanceFailureKind kind = 1; }

enum LogoVariant {
  LOGO_VARIANT_UNSPECIFIED = 0;
  LOGO_VARIANT_TRANSPARENT_ON_LIGHT = 1;
  LOGO_VARIANT_TRANSPARENT_ON_DARK = 2;
  LOGO_VARIANT_CONTAINED_ON_LIGHT = 3;
  LOGO_VARIANT_CONTAINED_ON_DARK = 4;
}

enum ThemeModePolicy {
  THEME_MODE_POLICY_UNSPECIFIED = 0;
  THEME_MODE_POLICY_USER_OR_SYSTEM = 1;
  THEME_MODE_POLICY_FORCE_SYSTEM = 2;
  THEME_MODE_POLICY_FORCE_LIGHT = 3;
  THEME_MODE_POLICY_FORCE_DARK = 4;
}

enum AppearanceFailureKind {
  APPEARANCE_FAILURE_KIND_UNSPECIFIED = 0;
  APPEARANCE_FAILURE_KIND_ASSET_MISSING = 1;
  APPEARANCE_FAILURE_KIND_ASSET_CHANGED = 2;
  APPEARANCE_FAILURE_KIND_TOO_LARGE = 3;
  APPEARANCE_FAILURE_KIND_INVALID_REFERENCE = 4;
  APPEARANCE_FAILURE_KIND_ASSET_UNAVAILABLE = 5;
}

// Managed calls use the same payloads and allow explicit cancellation and input finish.
service Appearance {
  rpc GetAppearance(.dokime.v1.GetAppearance) returns (.dokime.v1.AppearanceSnapshot);
  rpc RunGetAppearance(stream .dokime.v1.AppearanceGetAppearanceRunInput) returns (stream .dokime.v1.AppearanceGetAppearanceRunOutput);
}

message AppearanceGetAppearanceCancellation {}
message AppearanceGetAppearanceRunInput {
  oneof value {
    GetAppearance request = 1;
    AppearanceGetAppearanceCancellation cancel = 3;
    AppearanceGetAppearanceCancellation finish = 4;
  }
}
message AppearanceGetAppearanceRunOutput {
  oneof value {
    AppearanceSnapshot response = 2;
  }
}
