syntax = "proto3";
package dokime.v1;
option csharp_namespace = "Dokime.Protocol.V1";
import "dokime/v1/resources.proto";
import "harmos/v1/types.proto";

// Reads resolve latest durable once, without flushing accepted writes. Only
// returned cuts or seals are accepted as at; continuations bind cut, selection,
// ordering and schema. Missing positions and gaps fail explicitly.

message DocumentsGetRequest {
  .dokime.v1.DocumentScope scope = 1;
  string document_id = 2;
  bool structure_only = 3;
  repeated string card_ids = 4;
  string page_token = 5;
  uint64 max_bytes = 6;
  .harmos.v1.ReadCut at = 90;
}

message DocumentsGetResponse {
  repeated .dokime.v1.DocumentFrame frames = 1;
  string next_page_token = 2;
  .harmos.v1.ReadCut resolved_at = 90;
}

message DocumentsWatchRequest {
  .dokime.v1.DocumentScope scope = 1;
  string document_id = 2;
  bool structure_only = 3;
  repeated string card_ids = 4;
  string page_token = 5;
  uint64 max_bytes = 6;
  .harmos.v1.ReadCut at = 90;
}

message DocumentsWatchResponse {
  repeated .dokime.v1.DocumentFrame frames = 1;
  .harmos.v1.ReadCut resolved_at = 90;
  bool opening = 91;
  .harmos.v1.Failure resync_required = 92;
}

service Documents {
  // Public. Identity: dokime.v1.Documents/Get
  rpc Get(DocumentsGetRequest) returns (DocumentsGetResponse);
  // Public. Opening snapshot at resolved_at, then durable changes strictly after it.
  // Missing retained cuts or delivery gaps require explicit resynchronization.
  rpc Watch(DocumentsWatchRequest) returns (stream DocumentsWatchResponse);
}
