syntax = "proto3";
package dokime.v1.evidence;
option csharp_namespace = "Dokime.Protocol.V1.Evidence";
import "dokime/v1/resources.proto";
import "harmos/v1/types.proto";

message TraceabilityGetRequest {
  .dokime.v1.EvidenceScope scope = 1;
  .harmos.v1.PageRequest page = 2;
  .harmos.v1.ReadCut at = 3;
}
message TraceabilityGetResponse {
  repeated .dokime.v1.TraceabilitySnapshot snapshots = 1;
  .harmos.v1.ReadCut resolved_at = 2;
  string next_page_token = 3;
}
message TraceabilityWatchRequest {
  .dokime.v1.EvidenceScope scope = 1;
  .harmos.v1.PageRequest page = 2;
  .harmos.v1.ReadCut at = 3;
}
message TraceabilityWatchResponse {
  repeated .dokime.v1.TraceabilitySnapshot snapshots = 1;
  .harmos.v1.ReadCut resolved_at = 2;
  bool opening = 3;
}
service Traceability {
  rpc Get(TraceabilityGetRequest) returns (TraceabilityGetResponse);
  rpc Watch(TraceabilityWatchRequest) returns (stream TraceabilityWatchResponse);
}
