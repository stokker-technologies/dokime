syntax = "proto3";
package dokime.v1.content;
option csharp_namespace = "Dokime.Protocol.V1.ContentResources";
import "dokime/v1/resources.proto";
import "harmos/v1/storage_types.proto";
import "harmos/v1/types.proto";

// Reads resolve latest durable once, without flushing accepted writes. Only
// returned cuts or seals are accepted as at; continuations bind cut, selection,
// ordering and schema. Missing positions and gaps fail explicitly.

message ArtifactsGetRequest { string name = 1; .harmos.v1.ReadCut at = 90; }

message ArtifactsGetResponse {
  .dokime.v1.ArtifactMetadata metadata = 1;
  .harmos.storage.v1.FileReference file = 2;
  .harmos.v1.ReadCut resolved_at = 90;
}

message ArtifactsCreateRequest {
  .harmos.storage.v1.FileReference file = 1;
  .dokime.v1.ArtifactScope scope = 2;
  string filename = 3;
  string content_type = 4;
  string request_id = 5;
}

message ArtifactsCreateResponse { .dokime.v1.ArtifactMetadata artifact = 1; .harmos.v1.Receipt receipt = 2; }

message ArtifactsListRequest { .dokime.v1.ArtifactScope scope = 1; .harmos.v1.ReadCut at = 90; .harmos.v1.PageRequest page = 91; }

message ArtifactsListResponse {
  repeated .dokime.v1.ArtifactMetadata artifacts = 1;
  .harmos.v1.ReadCut resolved_at = 90;
  string next_page_token = 91;
}

message ArtifactsWatchRequest { .dokime.v1.ArtifactScope scope = 1; .harmos.v1.ReadCut at = 90; .harmos.v1.PageRequest page = 91; }

message ArtifactsWatchResponse {
  repeated .dokime.v1.ArtifactMetadata artifacts = 1;
  .harmos.v1.ReadCut resolved_at = 90;
  bool opening = 91;
  .harmos.v1.Failure resync_required = 92;
}

service Artifacts {
  // Public. Identity: dokime.v1.content.Artifacts/Get
  rpc Get(ArtifactsGetRequest) returns (ArtifactsGetResponse);
  // Public. Attach already-published library content as product artifact metadata; no byte transfer.
  rpc Create(ArtifactsCreateRequest) returns (ArtifactsCreateResponse);
  // Public. Identity: dokime.v1.content.Artifacts/List
  rpc List(ArtifactsListRequest) returns (ArtifactsListResponse);
  // Public. Opening snapshot at resolved_at, then durable changes strictly after it.
  // Missing retained cuts or delivery gaps require explicit resynchronization.
  rpc Watch(ArtifactsWatchRequest) returns (stream ArtifactsWatchResponse);
}
