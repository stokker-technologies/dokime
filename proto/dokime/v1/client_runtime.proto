syntax = "proto3";
package dokime.v1;

import "dokime/v1/client_types.proto";
import "dokime/v1/backend.proto";

message RuntimeGetHealthRequest {

}

message RuntimeGetHealthRunInput {
  oneof value {
    RuntimeGetHealthRequest request = 1;
    ClientEmpty cancel = 3;
    ClientEmpty finish = 4;
  }
}

message RuntimeGetHealthRunOutput {
  oneof value {
    BackendHealth response = 2;
  }
}

message RuntimeGetIdentityRequest {

}

message RuntimeGetIdentityRunInput {
  oneof value {
    RuntimeGetIdentityRequest request = 1;
    ClientEmpty cancel = 3;
    ClientEmpty finish = 4;
  }
}

message RuntimeGetIdentityRunOutput {
  oneof value {
    BackendIdentity response = 2;
  }
}

service Runtime {
  // Public. dokime.runtime.health. Cancelling this call does not undo committed mutations or cancel an admitted
  // execution.
  rpc GetHealth (.dokime.v1.RuntimeGetHealthRequest) returns (.dokime.v1.BackendHealth);
  // Public. Request first; ordered items, then finish or cancel; await settlement and final status.
  rpc RunGetHealth (stream .dokime.v1.RuntimeGetHealthRunInput) returns (stream .dokime.v1.RuntimeGetHealthRunOutput);
  // Public. dokime.runtime.identity. Cancelling this call does not undo committed mutations or cancel an admitted
  // execution.
  rpc GetIdentity (.dokime.v1.RuntimeGetIdentityRequest) returns (.dokime.v1.BackendIdentity);
  // Public. Request first; ordered items, then finish or cancel; await settlement and final status.
  rpc RunGetIdentity (stream .dokime.v1.RuntimeGetIdentityRunInput) returns (stream .dokime.v1.RuntimeGetIdentityRunOutput);
}
