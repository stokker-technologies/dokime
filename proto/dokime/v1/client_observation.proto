syntax = "proto3";
package dokime.v1;

import "dokime/v1/client_types.proto";

message ObservationGetRuntimeShellRequest {
  uint32 limit = 1;
  string after_cycle_id = 2;
  Cursor cursor = 3;
}

message ObservationGetRuntimeShellRunInput {
  oneof value {
    ObservationGetRuntimeShellRequest request = 1;
    ClientEmpty cancel = 3;
    ClientEmpty finish = 4;
  }
}

message ObservationGetRuntimeShellRunOutput {
  oneof value {
    RuntimeShellSnapshot response = 2;
  }
}

message ObservationGetTraceabilityRequest {
  EvidenceScope scope = 1;
  uint32 limit = 2;
  string after_traceability_id = 3;
  Cursor cursor = 4;
  string host_traceability_fingerprint = 5;
}

message ObservationGetTraceabilityRunInput {
  oneof value {
    ObservationGetTraceabilityRequest request = 1;
    ClientEmpty cancel = 3;
    ClientEmpty finish = 4;
  }
}

message ObservationGetTraceabilityRunOutput {
  oneof value {
    TraceabilityPage response = 2;
  }
}

message ObservationWatchExecutionProgressRequest {
  string test_execution_id = 1;
}

message ObservationWatchExecutionProgressOutput {
  oneof value {
    ExecutionProgressFrame item = 1;
    ClientEmpty response = 2;
  }
}

message ObservationWatchExecutionProgressRunInput {
  oneof value {
    ObservationWatchExecutionProgressRequest request = 1;
    ClientEmpty cancel = 3;
    ClientEmpty finish = 4;
  }
}

message ObservationWatchExecutionProgressRunOutput {
  oneof value {
    ExecutionProgressFrame item = 1;
    ClientEmpty response = 2;
  }
}

message ObservationWatchRuntimeRequest {
  Cursor cursor = 1;
}

message ObservationWatchRuntimeOutput {
  oneof value {
    RuntimeStateFrame item = 1;
    ClientEmpty response = 2;
  }
}

message ObservationWatchRuntimeRunInput {
  oneof value {
    ObservationWatchRuntimeRequest request = 1;
    ClientEmpty cancel = 3;
    ClientEmpty finish = 4;
  }
}

message ObservationWatchRuntimeRunOutput {
  oneof value {
    RuntimeStateFrame item = 1;
    ClientEmpty response = 2;
  }
}

service Observation {
  // Public. dokime.observation.get_runtime_shell. Follow the returned continuation with unchanged filters/order
  // and its captured cursor; an absent continuation ends paging. Cancelling this call does not undo committed
  // mutations or cancel an admitted execution. Returns a bounded cycle page at one exact runtime revision.
  rpc GetRuntimeShell (.dokime.v1.ObservationGetRuntimeShellRequest) returns (.dokime.v1.RuntimeShellSnapshot);
  // Public. Request first; ordered items, then finish or cancel; await settlement and final status.
  rpc RunGetRuntimeShell (stream .dokime.v1.ObservationGetRuntimeShellRunInput)
      returns (stream .dokime.v1.ObservationGetRuntimeShellRunOutput);
  // Public. dokime.observation.get_traceability. Follow the returned continuation with unchanged filters/order and
  // its captured cursor; an absent continuation ends paging. Cancelling this call does not undo committed
  // mutations or cancel an admitted execution. Returns the bounded, scope-aware current traceability projection.
  // This is a read of the current runtime state and never creates a checkpoint.
  rpc GetTraceability (.dokime.v1.ObservationGetTraceabilityRequest) returns (.dokime.v1.TraceabilityPage);
  // Public. Request first; ordered items, then finish or cancel; await settlement and final status.
  rpc RunGetTraceability (stream .dokime.v1.ObservationGetTraceabilityRunInput)
      returns (stream .dokime.v1.ObservationGetTraceabilityRunOutput);
  // Public. dokime.observation.watch_execution_progress. Output items precede the final response; require
  // successful final status. Cancelling this call does not undo committed mutations or cancel an admitted
  // execution. Streams the latest process-local progress for one execution. This is operational state: it is
  // coalesced, cleared at termination, and never persisted as telemetry or report evidence.
  // Latest progress, not a durable event log; revisions may coalesce. Reconnect with the captured revision or
  // explicitly resynchronize.
  rpc WatchExecutionProgress (.dokime.v1.ObservationWatchExecutionProgressRequest)
      returns (stream .dokime.v1.ObservationWatchExecutionProgressOutput);
  // Public. Request first; ordered items, then finish or cancel; await settlement and final status.
  rpc RunWatchExecutionProgress (stream .dokime.v1.ObservationWatchExecutionProgressRunInput)
      returns (stream .dokime.v1.ObservationWatchExecutionProgressRunOutput);
  // Public. dokime.observation.watch_runtime. Output items precede the final response; require successful final
  // status. Cancelling this call does not undo committed mutations or cancel an admitted execution. This is a
  // latest-state invalidation stream, not a durable event log. The initial frame always resynchronizes from
  // current state. Subsequent frames may coalesce commits. Query cycle/catalog details after a frame as needed. A
  // different epoch or a future position is rejected; reconnect without a cursor to explicitly resynchronize.
  // Disconnect never cancels admitted execution.
  rpc WatchRuntime (.dokime.v1.ObservationWatchRuntimeRequest) returns (stream .dokime.v1.ObservationWatchRuntimeOutput);
  // Public. Request first; ordered items, then finish or cancel; await settlement and final status.
  rpc RunWatchRuntime (stream .dokime.v1.ObservationWatchRuntimeRunInput) returns (stream .dokime.v1.ObservationWatchRuntimeRunOutput);
}
