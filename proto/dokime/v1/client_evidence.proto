syntax = "proto3";
package dokime.v1;

import "dokime/v1/client_types.proto";

message EvidenceGetCapturedRecordSchemaRequest {
  string record_type = 1;
  uint32 schema_version = 2;
  string epoch = 3;
}

message EvidenceGetCapturedRecordSchemaRunInput {
  oneof value {
    EvidenceGetCapturedRecordSchemaRequest request = 1;
    ClientEmpty cancel = 3;
    ClientEmpty finish = 4;
  }
}

message EvidenceGetCapturedRecordSchemaRunOutput {
  oneof value {
    RecordSchema response = 2;
  }
}

message EvidenceListRecordsRequest {
  CapturedRecordSelection selection = 1;
  Cursor after = 2;
  Cursor through = 3;
  uint32 latest = 4;
}

message EvidenceListRecordsRunInput {
  oneof value {
    EvidenceListRecordsRequest request = 1;
    ClientEmpty cancel = 3;
    ClientEmpty finish = 4;
  }
}

message EvidenceListRecordsRunOutput {
  oneof value {
    RecordPage response = 2;
  }
}

message EvidenceWatchRecordsRequest {
  CapturedRecordSelection selection = 1;
  Cursor after = 2;
}

message EvidenceWatchRecordsOutput {
  oneof value {
    RecordPage item = 1;
    ClientEmpty response = 2;
  }
}

message EvidenceWatchRecordsRunInput {
  oneof value {
    EvidenceWatchRecordsRequest request = 1;
    ClientEmpty cancel = 3;
    ClientEmpty finish = 4;
  }
}

message EvidenceWatchRecordsRunOutput {
  oneof value {
    RecordPage item = 1;
    ClientEmpty response = 2;
  }
}

service Evidence {
  // Public. dokime.evidence.get_captured_record_schema. Cancelling this call does not undo committed mutations or
  // cancel an admitted execution.
  rpc GetCapturedRecordSchema (.dokime.v1.EvidenceGetCapturedRecordSchemaRequest) returns (.dokime.v1.RecordSchema);
  // Public. Request first; ordered items, then finish or cancel; await settlement and final status.
  rpc RunGetCapturedRecordSchema (stream .dokime.v1.EvidenceGetCapturedRecordSchemaRunInput)
      returns (stream .dokime.v1.EvidenceGetCapturedRecordSchemaRunOutput);
  // Public. dokime.evidence.list_records. Cancelling this call does not undo committed mutations or cancel an
  // admitted execution.
  rpc ListRecords (.dokime.v1.EvidenceListRecordsRequest) returns (.dokime.v1.RecordPage);
  // Public. Request first; ordered items, then finish or cancel; await settlement and final status.
  rpc RunListRecords (stream .dokime.v1.EvidenceListRecordsRunInput) returns (stream .dokime.v1.EvidenceListRecordsRunOutput);
  // Public. dokime.evidence.watch_records. Output items precede the final response; require successful final
  // status. Cancelling this call does not undo committed mutations or cancel an admitted execution.
  rpc WatchRecords (.dokime.v1.EvidenceWatchRecordsRequest) returns (stream .dokime.v1.EvidenceWatchRecordsOutput);
  // Public. Request first; ordered items, then finish or cancel; await settlement and final status.
  rpc RunWatchRecords (stream .dokime.v1.EvidenceWatchRecordsRunInput) returns (stream .dokime.v1.EvidenceWatchRecordsRunOutput);
}
