syntax = "proto3";
package dokime.v1;
option csharp_namespace = "Dokime.Protocol.V1";
import "dokime/v1/execution.proto";
import "dokime/v1/resources.proto";
import "harmos/v1/types.proto";

// Reads resolve latest durable once, without flushing accepted writes. Only
// returned cuts or seals are accepted as at; continuations bind cut, selection,
// ordering and schema. Missing positions and gaps fail explicitly.

message ExecutionWritable { string label = 1; bool paused = 2; bool archived = 3; }

message ExecutionsGetRequest { string name = 1; .harmos.v1.Position at = 90; }

message ExecutionsGetResponse {
  ExecutionWritable value = 1;
  bytes revision = 2;
  .dokime.v1.ExecutionDetail execution = 3;
  .dokime.v1.ExecutionProgressValue progress = 4;
  .harmos.v1.Position resolved_at = 90;
}

message ExecutionsSetRequest { string name = 1; ExecutionWritable value = 20; bytes expected_revision = 21; string request_id = 22; }

message ExecutionsSetResponse { ExecutionWritable value = 1; bytes revision = 2; .harmos.v1.Receipt receipt = 3; }

message ExecutionsListRequest {
  string parent = 1;
  .dokime.v1.ExecutionSelection selection = 2;
  .dokime.v1.ExecutionFilter filter = 3;
  .dokime.v1.ExecutionOrder order = 4;
  .harmos.v1.ReadCut at = 90;
  .harmos.v1.PageRequest page = 91;
}

message ExecutionsListResponse {
  repeated .dokime.v1.ExecutionDetail executions = 1;
  .dokime.v1.ExecutionOutcomeCounts outcome_counts = 2;
  .harmos.v1.ReadCut resolved_at = 90;
  string next_page_token = 91;
}

message ExecutionsWatchRequest {
  string parent = 1;
  .dokime.v1.ExecutionSelection selection = 2;
  .dokime.v1.ExecutionFilter filter = 3;
  .dokime.v1.ExecutionOrder order = 4;
  .harmos.v1.ReadCut at = 90;
  .harmos.v1.PageRequest page = 91;
}

message ExecutionsWatchResponse {
  repeated .dokime.v1.ExecutionDetail executions = 1;
  .dokime.v1.ExecutionOutcomeCounts outcome_counts = 2;
  .harmos.v1.ReadCut resolved_at = 90;
  bool opening = 91;
  .harmos.v1.Failure resync_required = 92;
}

message ExecutionsCreateRequest { string parent = 1; repeated .dokime.v1.ExecutionBinding executions = 2; string request_id = 3; }

message ExecutionsCreateResponse { repeated .dokime.v1.ExecutionDetail executions = 1; .harmos.v1.Receipt receipt = 2; }

message ExecutionsStartRequest { string name = 1; string request_id = 2; .dokime.v1.ExecutionMode mode = 3; }

message ExecutionsStartResponse { .dokime.v1.ExecutionDetail execution = 1; .harmos.v1.Receipt receipt = 2; }

message ExecutionsStopRequest { string name = 1; string request_id = 2; }

message ExecutionsStopResponse { .dokime.v1.ExecutionDetail execution = 1; .harmos.v1.Receipt receipt = 2; }

message ExecutionsCancelRequest { string name = 1; string request_id = 2; }

message ExecutionsCancelResponse { .dokime.v1.ExecutionDetail execution = 1; .harmos.v1.Receipt receipt = 2; }

message ExecutionsDeleteRequest { string name = 1; string request_id = 2; }

message ExecutionsDeleteResponse { .dokime.v1.ExecutionDetail execution = 1; .harmos.v1.Receipt receipt = 2; }

message ExecutionsParametersRequest { string name = 1; .dokime.v1.ExecutionParameterSet set = 2; .harmos.v1.Position at = 90; }

message ExecutionsParametersResponse { repeated .dokime.v1.MaterializedParameter parameters = 1; .harmos.v1.Position resolved_at = 90; }

message ExecutionsStepsRequest { string name = 1; .harmos.v1.Position at = 90; }

message ExecutionsStepsResponse { repeated .dokime.v1.ExecutionStep steps = 1; .harmos.v1.Position resolved_at = 90; }

service Executions {
  // Public. Identity: dokime.v1.Executions/Get
  rpc Get(ExecutionsGetRequest) returns (ExecutionsGetResponse);
  // Public. Replace the whole writable value using the matching Get revision.
  // Same request_id and normalized payload replay the original receipt; changed
  // payload or a stale revision conflicts. Get again before retrying a conflict.
  rpc Set(ExecutionsSetRequest) returns (ExecutionsSetResponse);
  // Public. Identity: dokime.v1.Executions/List
  rpc List(ExecutionsListRequest) returns (ExecutionsListResponse);
  // Public. Opening snapshot at resolved_at, then durable changes strictly after it.
  // Missing retained cuts or delivery gaps require explicit resynchronization.
  rpc Watch(ExecutionsWatchRequest) returns (stream ExecutionsWatchResponse);
  // Public. Identity: dokime.v1.Executions/Create
  rpc Create(ExecutionsCreateRequest) returns (ExecutionsCreateResponse);
  // Public. Activate an existing unstarted execution; acceptance is not completion.
  rpc Start(ExecutionsStartRequest) returns (ExecutionsStartResponse);
  // Public. Finish at a safe scheduling boundary and retain required cleanup.
  rpc Stop(ExecutionsStopRequest) returns (ExecutionsStopResponse);
  // Public. Interrupt only a running execution; refuse queued cancellation with an action-named failure.
  rpc Cancel(ExecutionsCancelRequest) returns (ExecutionsCancelResponse);
  // Public. Require the sealed boundary; invalidate retained reads explicitly.
  rpc Delete(ExecutionsDeleteRequest) returns (ExecutionsDeleteResponse);
  // Public. Identity: dokime.v1.Executions/Parameters
  rpc Parameters(ExecutionsParametersRequest) returns (ExecutionsParametersResponse);
  // Public. Identity: dokime.v1.Executions/Steps
  rpc Steps(ExecutionsStepsRequest) returns (ExecutionsStepsResponse);
}
