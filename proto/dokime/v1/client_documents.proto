syntax = "proto3";
package dokime.v1;

import "dokime/v1/client_types.proto";

message DocumentsCaptureCurrentDocumentRequest {
  DocumentScope scope = 1;
  string document_id = 2;
  bool structure_only = 3;
  repeated string card_ids = 4;
  optional string page = 5;
}

message DocumentsCaptureCurrentDocumentOutput {
  oneof value {
    DocumentFrame item = 1;
    ClientEmpty response = 2;
  }
}

message DocumentsCaptureCurrentDocumentRunInput {
  oneof value {
    DocumentsCaptureCurrentDocumentRequest request = 1;
    ClientEmpty cancel = 3;
    ClientEmpty finish = 4;
  }
}

message DocumentsCaptureCurrentDocumentRunOutput {
  oneof value {
    DocumentFrame item = 1;
    ClientEmpty response = 2;
  }
}

message DocumentsUpdatePlotSettingsRequest {
  DocumentScope scope = 1;
  string document_id = 2;
  string plot_id = 3;
  optional uint32 display_points = 4;
  Downsample downsample = 5;
}

message DocumentsUpdatePlotSettingsRunInput {
  oneof value {
    DocumentsUpdatePlotSettingsRequest request = 1;
    ClientEmpty cancel = 3;
    ClientEmpty finish = 4;
  }
}

message DocumentsUpdatePlotSettingsRunOutput {
  oneof value {
    ClientEmpty response = 2;
  }
}

service Documents {
  // Public. dokime.documents.capture_current_document. Output items precede the final response; require successful
  // final status. Cancelling this call does not undo committed mutations or cancel an admitted execution.
  rpc CaptureCurrentDocument (.dokime.v1.DocumentsCaptureCurrentDocumentRequest)
      returns (stream .dokime.v1.DocumentsCaptureCurrentDocumentOutput);
  // Public. Request first; ordered items, then finish or cancel; await settlement and final status.
  rpc RunCaptureCurrentDocument (stream .dokime.v1.DocumentsCaptureCurrentDocumentRunInput)
      returns (stream .dokime.v1.DocumentsCaptureCurrentDocumentRunOutput);
  // Public. dokime.documents.update_plot_settings. Cancelling this call does not undo committed mutations or
  // cancel an admitted execution.
  rpc UpdatePlotSettings (.dokime.v1.DocumentsUpdatePlotSettingsRequest) returns (.dokime.v1.ClientEmpty);
  // Public. Request first; ordered items, then finish or cancel; await settlement and final status.
  rpc RunUpdatePlotSettings (stream .dokime.v1.DocumentsUpdatePlotSettingsRunInput)
      returns (stream .dokime.v1.DocumentsUpdatePlotSettingsRunOutput);
}
