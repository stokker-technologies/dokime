syntax = "proto3";
package dokime.v1;
option csharp_namespace = "Dokime.Protocol.V1";
import "dokime/v1/execution.proto";
import "dokime/v1/resources.proto";
import "dokime/v1/values.proto";
import "harmos/v1/types.proto";

// Reads resolve latest durable once, without flushing accepted writes. Only
// returned cuts or seals are accepted as at; continuations bind cut, selection,
// ordering and schema. Missing positions and gaps fail explicitly.

message CycleWritable { string label = 1; bool paused = 2; bool archived = 3; bool continue_automatically = 4; }

message CyclesGetRequest { string name = 1; .harmos.v1.Position at = 90; }

message CyclesGetResponse {
  CycleWritable value = 1;
  bytes revision = 2;
  .dokime.v1.CycleSummary cycle = 3;
  .harmos.v1.Position resolved_at = 90;
}

message CyclesSetRequest { string name = 1; CycleWritable value = 20; bytes expected_revision = 21; string request_id = 22; }

message CyclesSetResponse { CycleWritable value = 1; bytes revision = 2; .harmos.v1.Receipt receipt = 3; }

message CyclesListRequest {
  .dokime.v1.CycleSelection selection = 1;
  .dokime.v1.CycleFilter filter = 2;
  .dokime.v1.CycleOrder order = 3;
  .harmos.v1.ReadCut at = 90;
  .harmos.v1.PageRequest page = 91;
}

message CyclesListResponse {
  repeated .dokime.v1.CycleSummary cycles = 1;
  .harmos.v1.ReadCut resolved_at = 90;
  string next_page_token = 91;
}

message CyclesWatchRequest {
  .dokime.v1.CycleSelection selection = 1;
  .dokime.v1.CycleFilter filter = 2;
  .dokime.v1.CycleOrder order = 3;
  .harmos.v1.ReadCut at = 90;
  .harmos.v1.PageRequest page = 91;
}

message CyclesWatchResponse {
  repeated .dokime.v1.CycleSummary cycles = 1;
  .harmos.v1.ReadCut resolved_at = 90;
  bool opening = 91;
  .harmos.v1.Failure resync_required = 92;
}

message CyclesCreateRequest {
  repeated .dokime.v1.Origin origins = 1;
  .dokime.v1.Metadata metadata = 2;
  bool continue_automatically = 3;
  string source_cycle = 4;
  string request_id = 5;
}

message CyclesCreateResponse {
  .dokime.v1.CycleSummary cycle = 1;
  repeated .dokime.v1.RerunCaseNotice skipped = 2;
  repeated .dokime.v1.RerunCaseNotice dropped_parameters = 4;
  .harmos.v1.Receipt receipt = 3;
}

message CyclesSealRequest { string name = 1; string request_id = 2; }

message CyclesSealResponse { bytes seal = 1; .harmos.v1.Receipt receipt = 2; }

service Cycles {
  // Public. Identity: dokime.v1.Cycles/Get
  rpc Get(CyclesGetRequest) returns (CyclesGetResponse);
  // Public. Replace the whole writable value using the matching Get revision.
  // Same request_id and normalized payload replay the original receipt; changed
  // payload or a stale revision conflicts. Get again before retrying a conflict.
  rpc Set(CyclesSetRequest) returns (CyclesSetResponse);
  // Public. Identity: dokime.v1.Cycles/List
  rpc List(CyclesListRequest) returns (CyclesListResponse);
  // Public. Opening snapshot at resolved_at, then durable changes strictly after it.
  // Missing retained cuts or delivery gaps require explicit resynchronization.
  rpc Watch(CyclesWatchRequest) returns (stream CyclesWatchResponse);
  // Public. Identity: dokime.v1.Cycles/Create
  rpc Create(CyclesCreateRequest) returns (CyclesCreateResponse);
  // Public. Freeze the durable cycle boundary; failed report rendering publishes nothing.
  rpc Seal(CyclesSealRequest) returns (CyclesSealResponse);
}
