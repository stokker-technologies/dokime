syntax = "proto3";
package dokime.v1.storage;
option csharp_namespace = "Dokime.Protocol.V1.StorageResources";
import "dokime/v1/resources.proto";
import "harmos/v1/types.proto";

// Reads resolve latest durable once, without flushing accepted writes. Only
// returned cuts or seals are accepted as at; continuations bind cut, selection,
// ordering and schema. Missing positions and gaps fail explicitly.

message SourcesGetRequest {  .harmos.v1.ReadCut at = 90; }

message SourcesGetResponse { .dokime.v1.StorageSources value = 1; bytes revision = 2;  .harmos.v1.ReadCut resolved_at = 90; }

message SourcesSetRequest {  .dokime.v1.StorageSources value = 20; bytes expected_revision = 21; string request_id = 22; }

message SourcesSetResponse { .dokime.v1.StorageSources value = 1; bytes revision = 2; .harmos.v1.Receipt receipt = 3; }

service Sources {
  // Public. Identity: dokime.v1.storage.Sources/Get
  rpc Get(SourcesGetRequest) returns (SourcesGetResponse);
  // Public. Replace the whole writable value using the matching Get revision.
  // Same request_id and normalized payload replay the original receipt; changed
  // payload or a stale revision conflicts. Get again before retrying a conflict.
  rpc Set(SourcesSetRequest) returns (SourcesSetResponse);
}
