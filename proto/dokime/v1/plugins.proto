syntax = "proto3";
package dokime.v1;
import "harmos/plugin/v1/instance.proto";

// Public operations: dokime.plugins.list (ListPlugins -> PluginEntries),
// dokime.plugins.add (AddRemotePlugin -> Plugin), and
// dokime.plugins.remove (RemovePlugin -> RemovePluginResponse).
// Managed installation and uninstallation retain their existing operations.
message ListPlugins {}
message PluginEntries { repeated Plugin plugins = 1; }
message AddRemotePlugin { string url = 1; }
message RemovePlugin { string entry = 1; }
message RemovePluginResponse {}
message Plugin {
  // Stable even before the first successful connection.
  string entry = 1;
  oneof placement {
    ManagedPlugin managed = 2;
    RemotePlugin remote = 3;
  }
  PluginState state = 4;
  string reason = 5;
  // Absent until first connection; retained while unavailable.
  harmos.plugin.v1.InstanceGetResponse description = 6;
}
message ManagedPlugin { string bundle = 1; }
message RemotePlugin { string url = 1; }
enum PluginState {
  PLUGIN_STATE_UNSPECIFIED = 0;
  PLUGIN_STATE_STARTING = 1;
  PLUGIN_STATE_CONNECTING = 2;
  PLUGIN_STATE_READY = 3;
  PLUGIN_STATE_UNAVAILABLE = 4;
  PLUGIN_STATE_FAILED = 5;
}
