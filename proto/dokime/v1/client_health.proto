syntax = "proto3";
package dokime.v1;

import "dokime/v1/client_types.proto";

message HealthListHealthRequest {
  AnnotationSelection selection = 1;
  uint32 limit = 2;
  string after_id = 3;
  Cursor cursor = 4;
}

message HealthListHealthRunInput {
  oneof value {
    HealthListHealthRequest request = 1;
    ClientEmpty cancel = 3;
    ClientEmpty finish = 4;
  }
}

message HealthListHealthRunOutput {
  oneof value {
    ListHealthResponse response = 2;
  }
}

service Health {
  // Public. dokime.health.list_health. Follow the returned continuation with unchanged filters/order and its
  // captured cursor; an absent continuation ends paging. Cancelling this call does not undo committed mutations or
  // cancel an admitted execution.
  rpc ListHealth (.dokime.v1.HealthListHealthRequest) returns (.dokime.v1.ListHealthResponse);
  // Public. Request first; ordered items, then finish or cancel; await settlement and final status.
  rpc RunListHealth (stream .dokime.v1.HealthListHealthRunInput) returns (stream .dokime.v1.HealthListHealthRunOutput);
}
