syntax = "proto3";
package dokime.v1;

import "dokime/v1/client_types.proto";
import "google/protobuf/timestamp.proto";

message TelemetryListSamplesRequest {
  repeated string streams = 1;
  uint32 limit = 2;
  repeated uint32 schema_versions = 3;
  repeated string sources = 4;
  repeated string signals = 5;
  EvidenceScope scope = 6;
  repeated ListTelemetrySamplesRequestAfterStreamCursorsEntry after_stream_cursors = 7;
  google.protobuf.Timestamp start = 8;
  google.protobuf.Timestamp end = 9;
  bool latest = 10;
}

message TelemetryListSamplesRunInput {
  oneof value {
    TelemetryListSamplesRequest request = 1;
    ClientEmpty cancel = 3;
    ClientEmpty finish = 4;
  }
}

message TelemetryListSamplesRunOutput {
  oneof value {
    TelemetrySamplesReply response = 2;
  }
}

message TelemetryWatchSamplesRequest {
  ListSamples selection = 1;
  bool follow = 2;
}

message TelemetryWatchSamplesOutput {
  oneof value {
    TelemetrySamplesReply item = 1;
    ClientEmpty response = 2;
  }
}

message TelemetryWatchSamplesRunInput {
  oneof value {
    TelemetryWatchSamplesRequest request = 1;
    ClientEmpty cancel = 3;
    ClientEmpty finish = 4;
  }
}

message TelemetryWatchSamplesRunOutput {
  oneof value {
    TelemetrySamplesReply item = 1;
    ClientEmpty response = 2;
  }
}

service Telemetry {
  // Public. dokime.telemetry.list_samples. Follow the returned continuation with unchanged filters/order and its
  // captured cursor; an absent continuation ends paging. Cancelling this call does not undo committed mutations or
  // cancel an admitted execution.
  rpc ListSamples (.dokime.v1.TelemetryListSamplesRequest) returns (.dokime.v1.TelemetrySamplesReply);
  // Public. Request first; ordered items, then finish or cancel; await settlement and final status.
  rpc RunListSamples (stream .dokime.v1.TelemetryListSamplesRunInput) returns (stream .dokime.v1.TelemetryListSamplesRunOutput);
  // Public. dokime.telemetry.watch_samples. Output items precede the final response; require successful final
  // status. Cancelling this call does not undo committed mutations or cancel an admitted execution.
  rpc WatchSamples (.dokime.v1.TelemetryWatchSamplesRequest) returns (stream .dokime.v1.TelemetryWatchSamplesOutput);
  // Public. Request first; ordered items, then finish or cancel; await settlement and final status.
  rpc RunWatchSamples (stream .dokime.v1.TelemetryWatchSamplesRunInput) returns (stream .dokime.v1.TelemetryWatchSamplesRunOutput);
}
