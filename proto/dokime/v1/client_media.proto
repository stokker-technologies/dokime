syntax = "proto3";
package dokime.v1;

import "dokime/v1/client_types.proto";

message MediaAudioRecordingRequest {
  ArtifactScope scope = 1;
  optional uint32 input = 2;
  optional uint32 maximum_seconds = 3;
}

message MediaAudioRecordingOutput {
  oneof value {
    RecordingFrame item = 1;
    ClientEmpty response = 2;
  }
}

message MediaAudioRecordingRunInput {
  oneof value {
    MediaAudioRecordingRequest request = 1;
    ClientEmpty cancel = 3;
    ClientEmpty finish = 4;
  }
}

message MediaAudioRecordingRunOutput {
  oneof value {
    RecordingFrame item = 1;
    ClientEmpty response = 2;
  }
}

message MediaCameraRecordingRequest {
  ArtifactScope scope = 1;
  optional uint32 camera = 2;
  RecordingAudio audio = 3;
  optional uint32 maximum_seconds = 4;
}

message MediaCameraRecordingOutput {
  oneof value {
    RecordingFrame item = 1;
    ClientEmpty response = 2;
  }
}

message MediaCameraRecordingRunInput {
  oneof value {
    MediaCameraRecordingRequest request = 1;
    ClientEmpty cancel = 3;
    ClientEmpty finish = 4;
  }
}

message MediaCameraRecordingRunOutput {
  oneof value {
    RecordingFrame item = 1;
    ClientEmpty response = 2;
  }
}

message MediaPhotoRequest {
  ArtifactScope scope = 1;
  optional uint32 camera = 2;
}

message MediaPhotoRunInput {
  oneof value {
    MediaPhotoRequest request = 1;
    ClientEmpty cancel = 3;
    ClientEmpty finish = 4;
  }
}

message MediaPhotoRunOutput {
  oneof value {
    ArtifactMetadata response = 2;
  }
}

message MediaScreenRecordingRequest {
  ArtifactScope scope = 1;
  optional uint32 display = 2;
  RecordingAudio audio = 3;
  optional uint32 maximum_seconds = 4;
}

message MediaScreenRecordingOutput {
  oneof value {
    RecordingFrame item = 1;
    ClientEmpty response = 2;
  }
}

message MediaScreenRecordingRunInput {
  oneof value {
    MediaScreenRecordingRequest request = 1;
    ClientEmpty cancel = 3;
    ClientEmpty finish = 4;
  }
}

message MediaScreenRecordingRunOutput {
  oneof value {
    RecordingFrame item = 1;
    ClientEmpty response = 2;
  }
}

message MediaScreenshotRequest {
  ArtifactScope scope = 1;
  optional uint32 display = 2;
}

message MediaScreenshotRunInput {
  oneof value {
    MediaScreenshotRequest request = 1;
    ClientEmpty cancel = 3;
    ClientEmpty finish = 4;
  }
}

message MediaScreenshotRunOutput {
  oneof value {
    ArtifactMetadata response = 2;
  }
}

service Media {
  // Public. dokime.media.audio_recording. Output items precede the final response; require successful final
  // status. Cancelling this call does not undo committed mutations or cancel an admitted execution.
  // Progress precedes completed artifact metadata. maximum_seconds defaults to 600 and is bounded by 3600.
  // Cancellation or stream failure stops and seals captured audio; terminal metadata may be undelivered,
  // so reconcile the execution's artifact inventory after an uncertain acknowledgement.
  rpc AudioRecording (.dokime.v1.MediaAudioRecordingRequest) returns (stream .dokime.v1.MediaAudioRecordingOutput);
  // Public. Request first; ordered items, then finish or cancel; await settlement and final status.
  rpc RunAudioRecording (stream .dokime.v1.MediaAudioRecordingRunInput) returns (stream .dokime.v1.MediaAudioRecordingRunOutput);
  // Public. dokime.media.camera_recording. Output items precede the final response; require successful final
  // status. Cancelling this call does not undo committed mutations or cancel an admitted execution.
  // The current host refuses video recording with Unimplemented; retain the declared route for SDK parity.
  rpc CameraRecording (.dokime.v1.MediaCameraRecordingRequest) returns (stream .dokime.v1.MediaCameraRecordingOutput);
  // Public. Request first; ordered items, then finish or cancel; await settlement and final status.
  rpc RunCameraRecording (stream .dokime.v1.MediaCameraRecordingRunInput) returns (stream .dokime.v1.MediaCameraRecordingRunOutput);
  // Public. dokime.media.photo. Cancelling this call does not undo committed mutations or cancel an admitted
  // execution.
  rpc Photo (.dokime.v1.MediaPhotoRequest) returns (.dokime.v1.ArtifactMetadata);
  // Public. Request first; ordered items, then finish or cancel; await settlement and final status.
  rpc RunPhoto (stream .dokime.v1.MediaPhotoRunInput) returns (stream .dokime.v1.MediaPhotoRunOutput);
  // Public. dokime.media.screen_recording. Output items precede the final response; require successful final
  // status. Cancelling this call does not undo committed mutations or cancel an admitted execution.
  // The current host refuses video recording with Unimplemented; retain the declared route for SDK parity.
  rpc ScreenRecording (.dokime.v1.MediaScreenRecordingRequest) returns (stream .dokime.v1.MediaScreenRecordingOutput);
  // Public. Request first; ordered items, then finish or cancel; await settlement and final status.
  rpc RunScreenRecording (stream .dokime.v1.MediaScreenRecordingRunInput) returns (stream .dokime.v1.MediaScreenRecordingRunOutput);
  // Public. dokime.media.screenshot. Cancelling this call does not undo committed mutations or cancel an admitted
  // execution.
  rpc Screenshot (.dokime.v1.MediaScreenshotRequest) returns (.dokime.v1.ArtifactMetadata);
  // Public. Request first; ordered items, then finish or cancel; await settlement and final status.
  rpc RunScreenshot (stream .dokime.v1.MediaScreenshotRunInput) returns (stream .dokime.v1.MediaScreenshotRunOutput);
}
