syntax = "proto3";
package dokime.v1;

import "dokime/v1/client_types.proto";

message PlotsListAnalysesRequest {
  uint32 limit = 1;
  string after_id = 2;
}

message PlotsListAnalysesRunInput {
  oneof value {
    PlotsListAnalysesRequest request = 1;
    ClientEmpty cancel = 3;
    ClientEmpty finish = 4;
  }
}

message PlotsListAnalysesRunOutput {
  oneof value {
    ListAnalysesReply response = 2;
  }
}

message PlotsQuerySnapshotsRequest {
  repeated PlotRequest requests = 1;
}

message PlotsQuerySnapshotsRunInput {
  oneof value {
    PlotsQuerySnapshotsRequest request = 1;
    ClientEmpty cancel = 3;
    ClientEmpty finish = 4;
  }
}

message PlotsQuerySnapshotsRunOutput {
  oneof value {
    PlotSnapshotsReply response = 2;
  }
}

message PlotsWatchRequest {
  repeated PlotRequest requests = 1;
}

message PlotsWatchOutput {
  oneof value {
    PlotStreamFrame item = 1;
    ClientEmpty response = 2;
  }
}

message PlotsWatchRunInput {
  oneof value {
    PlotsWatchRequest request = 1;
    ClientEmpty cancel = 3;
    ClientEmpty finish = 4;
  }
}

message PlotsWatchRunOutput {
  oneof value {
    PlotStreamFrame item = 1;
    ClientEmpty response = 2;
  }
}

service Plots {
  // Public. dokime.plots.list_analyses. Follow the returned continuation with unchanged filters/order and its
  // captured cursor; an absent continuation ends paging. Cancelling this call does not undo committed mutations or
  // cancel an admitted execution. Analysis IDs Are Open; Each Contribution Declares Its Parameters And Outputs.
  rpc ListAnalyses (.dokime.v1.PlotsListAnalysesRequest) returns (.dokime.v1.ListAnalysesReply);
  // Public. Request first; ordered items, then finish or cancel; await settlement and final status.
  rpc RunListAnalyses (stream .dokime.v1.PlotsListAnalysesRunInput) returns (stream .dokime.v1.PlotsListAnalysesRunOutput);
  // Public. dokime.plots.query_snapshots. Cancelling this call does not undo committed mutations or cancel an
  // admitted execution. The reply contains
  // repeated envelopes in one bounded message; callers must lower max_points or split a batch on exhaustion.
  // There is no fixed plot-count limit; Watch delivers each requested plot independently in request order.
  rpc QuerySnapshots (.dokime.v1.PlotsQuerySnapshotsRequest) returns (.dokime.v1.PlotSnapshotsReply);
  // Public. Request first; ordered items, then finish or cancel; await settlement and final status.
  rpc RunQuerySnapshots (stream .dokime.v1.PlotsQuerySnapshotsRunInput) returns (stream .dokime.v1.PlotsQuerySnapshotsRunOutput);
  // Public. dokime.plots.watch. Output items precede the final response; require successful final status.
  // Cancelling this call does not undo committed mutations or cancel an admitted execution. Watch is server-
  // streaming. To change the request set, cancel this stream and open another one. Requests without a cursor
  // receive an initial Snapshot before the watch begins; later frames are coalesced by the server at 100 ms only
  // after a runtime state or telemetry watch advances.
  // Cancellation ends only this watch. Change the request set by cancelling and opening another stream; snapshots
  // and deltas retain each plot cursor.
  rpc Watch (.dokime.v1.PlotsWatchRequest) returns (stream .dokime.v1.PlotsWatchOutput);
  // Public. Request first; ordered items, then finish or cancel; await settlement and final status.
  rpc RunWatch (stream .dokime.v1.PlotsWatchRunInput) returns (stream .dokime.v1.PlotsWatchRunOutput);
}
