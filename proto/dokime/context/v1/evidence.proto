syntax = "proto3";
package dokime.context.v1;
option csharp_namespace = "Dokime.Protocol.Context.V1";

// Public child-call declarations carried by Instance.Invoke; no client service.

message EvidenceStatisticsRequest {
  string execution = 1;
  string stream = 2;
  // Column of the stream. May be empty when the stream has one value column.
  string field = 3;
  // Limit to the time range of one step; empty for the whole execution.
  string step = 4;
}

message EvidenceStatisticsResponse {
  uint64 count = 1;
  double min = 2;
  double max = 3;
  double mean = 4;
  double stddev = 5;
  double median = 6;
  double p05 = 7;
  double p95 = 8;
  double p99 = 9;
  double first = 10;
  double last = 11;
}
