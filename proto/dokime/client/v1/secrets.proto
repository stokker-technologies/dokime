syntax = "proto3";
package dokime.client.v1;
option csharp_namespace = "Dokime.Protocol.Client.V1";
import "dokime/v1/metadata.proto";
import "harmos/v1/types.proto";

message SecretArchive {
  bytes data = 1;
}

enum SecretImportAction {
  SECRET_IMPORT_ACTION_UNSPECIFIED = 0;
  SECRET_IMPORT_ACTION_REPLACE = 1;
  SECRET_IMPORT_ACTION_SKIP = 2;
}

message SecretImportChoice {
  string identifier = 1;
  .dokime.client.v1.SecretImportAction action = 2;
}

message SecretImportEntry {
  .dokime.v1.Metadata metadata = 1;
  bool exists = 2;
}

message SecretImportPreview {
  string host_id = 1;
  string host_label = 2;
  uint64 generation = 3;
  repeated .dokime.client.v1.SecretImportEntry entries = 4;
}

message SecretSnapshot {
  string host_id = 1;
  string host_label = 2;
  uint64 generation = 3;
  repeated .dokime.client.v1.SecretSummary entries = 4;
  bool cleanup_pending = 5;
}

message SecretSummary {
  .dokime.v1.Metadata metadata = 1;
  repeated string known_uses = 2;
}

// Reads resolve latest durable once, without flushing accepted writes. Only
// returned cuts or seals are accepted as at; continuations bind cut, selection,
// ordering and schema. Missing positions and gaps fail explicitly.
message SecretWritable { .dokime.v1.Metadata metadata = 1; optional string value = 2; }

message SecretsGetRequest { string name = 1; .harmos.v1.ReadCut at = 90; }

message SecretsGetResponse { .dokime.client.v1.SecretWritable value = 1; bytes revision = 2;  .harmos.v1.ReadCut resolved_at = 90; }

message SecretsSetRequest { string name = 1; .dokime.client.v1.SecretWritable value = 20; bytes expected_revision = 21; string request_id = 22; }

message SecretsSetResponse { .dokime.client.v1.SecretWritable value = 1; bytes revision = 2; .harmos.v1.Receipt receipt = 3; }

message SecretsListRequest {  .harmos.v1.ReadCut at = 90; }

message SecretsListResponse { repeated .dokime.client.v1.SecretSummary entries = 1; uint64 generation = 2; .harmos.v1.ReadCut resolved_at = 90; }

message SecretsWatchRequest {  .harmos.v1.ReadCut at = 90; }

message SecretsWatchResponse {
  repeated .dokime.client.v1.SecretSummary entries = 1;
  uint64 generation = 2;
  .harmos.v1.ReadCut resolved_at = 90;
  bool opening = 91;
  .harmos.v1.Failure resync_required = 92;
}

message SecretsDeleteRequest { repeated string names = 1; bytes expected_revision = 2; string request_id = 3; }

message SecretsDeleteResponse { .harmos.v1.Receipt receipt = 1; bool cleanup_pending = 2; }

message SecretsExportRequest { repeated string names = 1; uint64 generation = 2; .harmos.v1.ReadCut at = 90; }

message SecretsExportResponse { .dokime.client.v1.SecretArchive archive = 1; .harmos.v1.ReadCut resolved_at = 90; }

message SecretsImportRequest {
  bytes data = 1;
  repeated .dokime.client.v1.SecretImportChoice choices = 2;
  uint64 generation = 3;
  bool validate_only = 4;
  string request_id = 5;
}

message SecretsImportResponse {
  .dokime.client.v1.SecretImportPreview preview = 1;
  .dokime.client.v1.SecretSnapshot snapshot = 2;
  .harmos.v1.Receipt receipt = 3;
}

service Secrets {
  // Public. Identity: dokime.client.v1.Secrets/Get
  rpc Get(.dokime.client.v1.SecretsGetRequest) returns (.dokime.client.v1.SecretsGetResponse);
  // Public. Replace the whole writable value using the matching Get revision.
  // Same request_id and normalized payload replay the original receipt; changed
  // payload or a stale revision conflicts. Get again before retrying a conflict.
  rpc Set(.dokime.client.v1.SecretsSetRequest) returns (.dokime.client.v1.SecretsSetResponse);
  // Public. Identity: dokime.client.v1.Secrets/List
  rpc List(.dokime.client.v1.SecretsListRequest) returns (.dokime.client.v1.SecretsListResponse);
  // Public. Opening snapshot at resolved_at, then durable changes strictly after it.
  // Missing retained cuts or delivery gaps require explicit resynchronization.
  rpc Watch(.dokime.client.v1.SecretsWatchRequest) returns (stream .dokime.client.v1.SecretsWatchResponse);
  // Public. Identity: dokime.client.v1.Secrets/Delete
  rpc Delete(.dokime.client.v1.SecretsDeleteRequest) returns (.dokime.client.v1.SecretsDeleteResponse);
  // Public. Preserve the existing Base64 JSON transfer protection and generation checks.
  rpc Export(.dokime.client.v1.SecretsExportRequest) returns (.dokime.client.v1.SecretsExportResponse);
  // Public. validate_only validates choices without writing; generation conflicts remain explicit.
  rpc Import(.dokime.client.v1.SecretsImportRequest) returns (.dokime.client.v1.SecretsImportResponse);
}
