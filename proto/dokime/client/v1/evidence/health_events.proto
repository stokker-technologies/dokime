syntax = "proto3";
package dokime.client.v1.evidence;
option csharp_namespace = "Dokime.Protocol.Client.V1.EvidenceResources";
import "dokime/v1/evidence.proto";
import "dokime/v1/notes.proto";
import "google/protobuf/timestamp.proto";
import "harmos/v1/types.proto";

message HealthItem {
  string health_item_id = 1;
  .dokime.v1.EvidenceScope scope = 2;
  .dokime.v1.Severity severity = 3;
  string message = 4;
  optional string detail = 5;
  .google.protobuf.Timestamp observed_at = 6;
}

// Reads resolve latest durable once, without flushing accepted writes. Only
// returned cuts or seals are accepted as at; continuations bind cut, selection,
// ordering and schema. Missing positions and gaps fail explicitly.
message HealthEventsListRequest {
  .dokime.v1.AnnotationSelection selection = 1;
  .harmos.v1.ReadCut at = 90;
  .harmos.v1.PageRequest page = 91;
}

message HealthEventsListResponse {
  repeated .dokime.client.v1.evidence.HealthItem events = 1;
  .harmos.v1.ReadCut resolved_at = 90;
  string next_page_token = 91;
}

message HealthEventsWatchRequest {
  .dokime.v1.AnnotationSelection selection = 1;
  .harmos.v1.ReadCut at = 90;
  .harmos.v1.PageRequest page = 91;
}

message HealthEventsWatchResponse {
  repeated .dokime.client.v1.evidence.HealthItem events = 1;
  .harmos.v1.ReadCut resolved_at = 90;
  bool opening = 91;
  .harmos.v1.Failure resync_required = 92;
}

service HealthEvents {
  // Public. Identity: dokime.client.v1.evidence.HealthEvents/List
  rpc List(.dokime.client.v1.evidence.HealthEventsListRequest) returns (.dokime.client.v1.evidence.HealthEventsListResponse);
  // Public. Opening snapshot at resolved_at, then durable changes strictly after it.
  // Missing retained cuts or delivery gaps require explicit resynchronization.
  rpc Watch(.dokime.client.v1.evidence.HealthEventsWatchRequest) returns (stream .dokime.client.v1.evidence.HealthEventsWatchResponse);
}
