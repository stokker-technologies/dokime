syntax = "proto3";
package dokime.client.v1.evidence;
option csharp_namespace = "Dokime.Protocol.Client.V1.EvidenceResources";
import "dokime/v1/evidence.proto";
import "dokime/v1/scalar.proto";
import "dokime/v1/schemas.proto";
import "google/protobuf/timestamp.proto";
import "harmos/v1/types.proto";

message CapturedErrorCause {
  string message = 1;
  optional string code = 2;
  optional string source = 3;
}

message CapturedRecord {
  // Original protobuf bytes interpreted using the frozen record descriptor.
  bytes payload = 16;
  string record_id = 1;
  uint64 sequence = 2;
  .google.protobuf.Timestamp timestamp = 3;
  string record_type = 4;
  uint32 schema_version = 5;
  string source = 6;
  .dokime.v1.Severity severity = 7;
  optional string message = 8;
  .dokime.client.v1.evidence.CapturedRecordError error = 9;
  .dokime.v1.Value details = 10;
  .dokime.v1.EvidenceScope scope = 11;
  optional string related_sample_id = 12;
  optional string related_stream_id = 13;
  optional string related_artifact_id = 14;
  .google.protobuf.Timestamp received_at = 15;
}

message CapturedRecordError {
  string message = 1;
  optional string code = 2;
  optional string source = 3;
  repeated .dokime.client.v1.evidence.CapturedErrorCause cause_chain = 4;
  optional string stacktrace_attachment = 5;
  optional string trace_id = 6;
  optional string correlation_id = 7;
  optional string diagnostics = 8;
}

message CycleScope {
  string cycle_id = 1;
  optional string execution_id = 2;
}

message RecordScope {
  oneof kind {
    string execution = 1;
    .dokime.client.v1.evidence.CycleScope cycle = 2;
  }
}

message CapturedRecordSelection {
  .dokime.v1.EvidenceScope scope = 1;
  repeated string record_types = 2;
  repeated string sources = 3;
  repeated .dokime.v1.Severity severities = 4;
}

// Reads resolve latest durable once, without flushing accepted writes. Only
// returned cuts or seals are accepted as at; continuations bind cut, selection,
// ordering and schema. Missing positions and gaps fail explicitly.
message RecordsListRequest {
  .dokime.client.v1.evidence.RecordScope scope = 1;
  string record_type = 2;
  repeated uint32 versions = 3;
  .dokime.v1.Window between = 4;
  string step = 5;
  .dokime.client.v1.evidence.CapturedRecordSelection selection = 6;
  .harmos.v1.ReadCut at = 90;
  .harmos.v1.PageRequest page = 91;
}

message RecordsListResponse {
  repeated .dokime.client.v1.evidence.CapturedRecord records = 1;
  .dokime.v1.Schema schema = 2;
  .harmos.v1.ReadCut resolved_at = 90;
  string next_page_token = 91;
}

message RecordsWatchRequest {
  .dokime.client.v1.evidence.RecordScope scope = 1;
  string record_type = 2;
  repeated uint32 versions = 3;
  .dokime.v1.Window between = 4;
  string step = 5;
  .dokime.client.v1.evidence.CapturedRecordSelection selection = 6;
  .harmos.v1.ReadCut at = 90;
  .harmos.v1.PageRequest page = 91;
}

message RecordsWatchResponse {
  repeated .dokime.client.v1.evidence.CapturedRecord records = 1;
  .dokime.v1.Schema schema = 2;
  .harmos.v1.ReadCut resolved_at = 90;
  bool opening = 91;
  .harmos.v1.Failure resync_required = 92;
}

service Records {
  // Public. Identity: dokime.client.v1.evidence.Records/List
  rpc List(.dokime.client.v1.evidence.RecordsListRequest) returns (.dokime.client.v1.evidence.RecordsListResponse);
  // Public. Opening snapshot at resolved_at, then durable changes strictly after it.
  // Missing retained cuts or delivery gaps require explicit resynchronization.
  rpc Watch(.dokime.client.v1.evidence.RecordsWatchRequest) returns (stream .dokime.client.v1.evidence.RecordsWatchResponse);
}
