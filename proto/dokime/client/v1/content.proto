syntax = "proto3";
package dokime.client.v1;
option csharp_namespace = "Dokime.Protocol.Client.V1";
import "dokime/v1/appearance.proto";
import "dokime/v1/empty.proto";

message AppearanceAssetFrame {
  .dokime.client.v1.AppearanceAssetFramePayload payload = 1;
}

message AppearanceAssetFramePayload {
  oneof kind {
    .dokime.v1.AppearanceAssetMetadata metadata = 1;
    .dokime.client.v1.ArtifactChunk chunk = 2;
    .dokime.client.v1.ArtifactCompletion complete = 3;
  }
}

message ArtifactChunk {
  uint64 offset = 1;
  bytes data = 2;
}

message ArtifactCompletion {
  uint64 size_bytes = 1;
  string sha256 = 2;
}

// Awaiting Direct Library Composition; Ordinary Contracts Stay Unchanged.
message ContentDownloadAppearanceAssetRequest {
  .dokime.v1.AppearanceAssetReference reference = 1;
}

message ContentDownloadAppearanceAssetOutput {
  oneof value {
    .dokime.client.v1.AppearanceAssetFrame item = 1;
    .dokime.v1.ClientEmpty response = 2;
  }
}

service Content {
  rpc DownloadAppearanceAsset (.dokime.client.v1.ContentDownloadAppearanceAssetRequest)
      returns (stream .dokime.client.v1.ContentDownloadAppearanceAssetOutput);
}
