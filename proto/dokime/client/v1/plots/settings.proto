syntax = "proto3";
package dokime.client.v1.plots;
option csharp_namespace = "Dokime.Protocol.Client.V1.PlotsResources";
import "dokime/v1/documents.proto";
import "dokime/v1/plots.proto";
import "harmos/v1/types.proto";

// Reads resolve latest durable once, without flushing accepted writes. Only
// returned cuts or seals are accepted as at; continuations bind cut, selection,
// ordering and schema. Missing positions and gaps fail explicitly.
message PlotSettingsValue { optional uint32 display_points = 1; .dokime.v1.Downsample downsample = 2; }

message SettingsGetRequest { .dokime.v1.DocumentScope scope = 1; string document_id = 2; string plot_id = 3; .harmos.v1.ReadCut at = 90; }

message SettingsGetResponse { .dokime.client.v1.plots.PlotSettingsValue value = 1; bytes revision = 2;  .harmos.v1.ReadCut resolved_at = 90; }

message SettingsSetRequest {
  .dokime.v1.DocumentScope scope = 1;
  string document_id = 2;
  string plot_id = 3;
  .dokime.client.v1.plots.PlotSettingsValue value = 20;
  bytes expected_revision = 21;
  string request_id = 22;
}

message SettingsSetResponse { .dokime.client.v1.plots.PlotSettingsValue value = 1; bytes revision = 2; .harmos.v1.Receipt receipt = 3; }

service Settings {
  // Public. Identity: dokime.client.v1.plots.Settings/Get
  rpc Get(.dokime.client.v1.plots.SettingsGetRequest) returns (.dokime.client.v1.plots.SettingsGetResponse);
  // Public. Replace the whole writable value using the matching Get revision.
  // Same request_id and normalized payload replay the original receipt; changed
  // payload or a stale revision conflicts. Get again before retrying a conflict.
  rpc Set(.dokime.client.v1.plots.SettingsSetRequest) returns (.dokime.client.v1.plots.SettingsSetResponse);
}
