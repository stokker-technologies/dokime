// Samples Contracts

syntax = "proto3";

package dokime.host.v1.evidence;

// === Imports === //

import "dokime/host/v1/record_schemas.proto";
import "dokime/model/v1/evidence.proto";
import "dokime/model/v1/expressions.proto";
import "dokime/model/v1/scalar.proto";
import "google/protobuf/timestamp.proto";
import "harmos/model/v1/callers.proto";
import "harmos/model/v1/failure.proto";
import "harmos/model/v1/page.proto";
import "harmos/model/v1/position.proto";

// === Options === //

option csharp_namespace = "Dokime.Clients.EvidenceResources";

// Reads select the latest durable boundary without flushing accepted writes.
// Issued cuts, pages and watches retain their selection; missing cuts and gaps refuse.
// Mutation request identities replay the original receipt for the same normalized input.

// === Services === //

// Owns the Samples resource on the host; callers are checked before handler admission.
service Samples {
  // List the Samples resource; admission and policy are owned by the executor.
  rpc List(.dokime.host.v1.evidence.SamplesListRequest) returns (.dokime.host.v1.evidence.SamplesListResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
  // Observe durable changes to the Samples resource; admission and policy are owned by the executor.
  rpc Watch(.dokime.host.v1.evidence.SamplesWatchRequest) returns (stream .dokime.host.v1.evidence.SamplesWatchResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
}

// === Requests and Responses === //

// SamplesListRequest for Samples.List.
message SamplesListRequest {
  .dokime.model.v1.EvidenceScope scope = 1;
  repeated string streams = 2;
  repeated uint32 versions = 3;
  repeated string fields = 4;
  repeated string sources = 5;
  repeated string signals = 6;
  .dokime.model.v1.Window between = 7;
  .dokime.host.v1.evidence.BucketRequest bucket = 8;
  bool latest = 9;
  optional .harmos.model.v1.ReadCut at = 90;
  optional .harmos.model.v1.PageRequest page = 91;
}

// SamplesListResponse for Samples.List.
message SamplesListResponse {
  repeated .dokime.host.v1.evidence.SampleRow samples = 1;
  .dokime.host.v1.Schema schema = 2;
  .harmos.model.v1.ReadCut resolved_at = 90;
  string next_page_token = 91;
}

// SamplesWatchRequest for Samples.Watch.
message SamplesWatchRequest {
  .dokime.model.v1.EvidenceScope scope = 1;
  repeated string streams = 2;
  repeated uint32 versions = 3;
  repeated string fields = 4;
  repeated string sources = 5;
  repeated string signals = 6;
  .dokime.model.v1.Window between = 7;
  .dokime.host.v1.evidence.BucketRequest bucket = 8;
  bool latest = 9;
  optional .harmos.model.v1.ReadCut at = 90;
  optional .harmos.model.v1.PageRequest page = 91;
}

// SamplesWatchResponse for Samples.Watch.
message SamplesWatchResponse {
  repeated .dokime.host.v1.evidence.SampleRow samples = 1;
  .dokime.host.v1.Schema schema = 2;
  .harmos.model.v1.ReadCut resolved_at = 90;
  bool opening = 91;
  .harmos.model.v1.Failure resync_required = 92;
}

// === Resources === //

// Bucket value owned by this resource.
message Bucket {
  .google.protobuf.Timestamp start = 1;
  .google.protobuf.Timestamp end = 2;
  string execution_id = 3;
  string stream = 4;
  string source = 5;
  repeated uint32 versions = 6;
  uint64 sample_count = 7;
  repeated .dokime.host.v1.evidence.BucketValue fields = 8;
}

// BucketRequest value owned by this resource.
message BucketRequest {
  uint64 every_nanos = 1;
  .dokime.model.v1.Aggregate aggregate = 2;
}

// BucketValue value owned by this resource.
message BucketValue {
  string field = 1;
  uint64 count = 2;
  .dokime.host.v1.evidence.StatisticValue value = 3;
  optional string unit = 4;
  .dokime.model.v1.Aggregate reducer = 5;
}

// SampleRow value owned by this resource.
message SampleRow {
  oneof kind {
    .dokime.host.v1.evidence.TelemetrySample raw = 1;
    .dokime.host.v1.evidence.Bucket bucket = 2;
  }
}

// StatisticValue value owned by this resource.
message StatisticValue {
  oneof kind {
    uint64 count = 1;
    double number = 2;
  }
}

// TelemetrySample value owned by this resource.
message TelemetrySample {
  bytes payload = 12;
  string sample_id = 1;
  string stream = 2;
  uint32 schema_version = 3;
  uint64 sequence = 4;
  .google.protobuf.Timestamp timestamp = 5;
  .google.protobuf.Timestamp received_at = 6;
  string source = 7;
  .dokime.model.v1.EvidenceScope scope = 8;
  .dokime.model.v1.MapValue values = 9;
  .dokime.model.v1.MapValue summary = 10;
  .dokime.model.v1.MapValue metadata = 11;
}

// === Enums === //
