// Logs Contracts

syntax = "proto3";

package dokime.host.v1.evidence;

// === Imports === //

import "dokime/v1/evidence.proto";
import "google/protobuf/timestamp.proto";
import "harmos/model/v1/callers.proto";
import "harmos/model/v1/receipt.proto";

// === Options === //

option csharp_namespace = "Dokime.Protocol.Host.V1.EvidenceResources";

// === Services === //

// Host operations with explicit caller admission.
service Logs {
  // Append the Logs resource; admission and policy are owned by the executor.
  rpc Append(.dokime.host.v1.evidence.LogsAppendRequest) returns (.dokime.host.v1.evidence.LogsAppendResponse) {
    option (harmos.model.v1.callers) = PLUGINS;
  }
}

// === Append === //

// LogsAppendRequest for Logs.Append.
message LogsAppendRequest {
  string execution = 1;
  .dokime.v1.Severity severity = 2;
  string message = 3;
  .google.protobuf.Timestamp at = 4;
  string request_id = 20;
}

// LogsAppendResponse for Logs.Append.
message LogsAppendResponse { .harmos.model.v1.Receipt receipt = 1; }

// === Resources === //

// === Enums === //
