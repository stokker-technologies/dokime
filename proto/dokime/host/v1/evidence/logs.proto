// Logs Contracts

syntax = "proto3";

package dokime.host.v1.evidence;

// === Imports === //

import "dokime/model/v1/evidence.proto";
import "google/protobuf/timestamp.proto";
import "harmos/model/v1/callers.proto";
import "harmos/model/v1/receipt.proto";

// === Options === //

option csharp_namespace = "Dokime.Clients.EvidenceResources";

// Reads select the latest durable boundary without flushing accepted writes.
// Issued cuts, pages and watches retain their selection; missing cuts and gaps refuse.
// Mutation request identities replay the original receipt for the same normalized input.

// === Services === //

// Owns the Logs resource on the host; callers are checked before handler admission.
service Logs {
  // Append immutable values to the Logs resource; admission and policy are owned by the executor.
  rpc Append(.dokime.host.v1.evidence.LogsAppendRequest) returns (.dokime.host.v1.evidence.LogsAppendResponse) {
    option (harmos.model.v1.callers) = PLUGINS;
  }
}

// === Requests and Responses === //

// LogsAppendRequest for Logs.Append.
message LogsAppendRequest {
  string execution = 1;
  .dokime.model.v1.Severity severity = 2;
  string message = 3;
  .google.protobuf.Timestamp at = 4;
  string request_id = 20;
}

// LogsAppendResponse for Logs.Append.
message LogsAppendResponse {
  .harmos.model.v1.Receipt receipt = 1;
}

// === Resources === //

// === Enums === //
