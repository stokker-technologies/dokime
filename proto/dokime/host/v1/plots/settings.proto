// Settings Contracts

syntax = "proto3";

package dokime.host.v1.plots;

// === Imports === //

import "dokime/host/v1/documents.proto";
import "dokime/model/v1/plots.proto";
import "harmos/model/v1/callers.proto";
import "harmos/model/v1/position.proto";
import "harmos/model/v1/receipt.proto";

// === Options === //

option csharp_namespace = "Dokime.Protocol.Host.V1.PlotsResources";

// === Services === //

// Host operations with explicit caller admission.
service Settings {
  // Get the Settings resource; admission and policy are owned by the executor.
  rpc Get(.dokime.host.v1.plots.SettingsGetRequest) returns (.dokime.host.v1.plots.SettingsGetResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
  // Set the Settings resource; admission and policy are owned by the executor.
  rpc Set(.dokime.host.v1.plots.SettingsSetRequest) returns (.dokime.host.v1.plots.SettingsSetResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
}

// === Get === //

// SettingsGetRequest for Settings.Get.
message SettingsGetRequest { .dokime.host.v1.DocumentScope scope = 1; string document_id = 2; string plot_id = 3; .harmos.model.v1.ReadCut at = 90; }

// SettingsGetResponse for Settings.Get.
message SettingsGetResponse { .dokime.host.v1.plots.PlotSettingsValue value = 1; bytes revision = 2;  .harmos.model.v1.ReadCut resolved_at = 90; }

// === Set === //

// SettingsSetRequest for Settings.Set.
message SettingsSetRequest {
  .dokime.host.v1.DocumentScope scope = 1;
  string document_id = 2;
  string plot_id = 3;
  .dokime.host.v1.plots.PlotSettingsValue value = 20;
  bytes expected_revision = 21;
  string request_id = 22;
}

// SettingsSetResponse for Settings.Set.
message SettingsSetResponse { .dokime.host.v1.plots.PlotSettingsValue value = 1; bytes revision = 2; .harmos.model.v1.Receipt receipt = 3; }

// === Resources === //

// PlotSettingsValue value owned by this resource.
message PlotSettingsValue { optional uint32 display_points = 1; .dokime.model.v1.Downsample downsample = 2; }

// === Enums === //
