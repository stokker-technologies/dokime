// Suites Contracts

syntax = "proto3";

package dokime.host.v1;

// === Imports === //

import "dokime/model/v1/suites.proto";
import "harmos/model/v1/callers.proto";
import "harmos/model/v1/position.proto";

// === Options === //

option csharp_namespace = "Dokime.Protocol.Host.V1";

// === Services === //

// Host operations with explicit caller admission.
service Suites {
  // Get the Suites resource; admission and policy are owned by the executor.
  rpc Get(.dokime.host.v1.SuitesGetRequest) returns (.dokime.host.v1.SuitesGetResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
  // List the Suites resource; admission and policy are owned by the executor.
  rpc List(.dokime.host.v1.SuitesListRequest) returns (.dokime.host.v1.SuitesListResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
}

// === Get === //

// SuitesGetRequest for Suites.Get.
message SuitesGetRequest { string name = 1; string parent = 2; uint32 schema_version = 3; .harmos.model.v1.ReadCut at = 90; }

// SuitesGetResponse for Suites.Get.
message SuitesGetResponse { .dokime.model.v1.Suite value = 1; .harmos.model.v1.ReadCut resolved_at = 90; }

// === List === //

// SuitesListRequest for Suites.List.
message SuitesListRequest { string parent = 1; .harmos.model.v1.ReadCut at = 90; }

// SuitesListResponse for Suites.List.
message SuitesListResponse { repeated .dokime.model.v1.Suite values = 1; .harmos.model.v1.ReadCut resolved_at = 90; }

// === Resources === //

// === Enums === //
