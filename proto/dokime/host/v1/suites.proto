// Suites Contracts

syntax = "proto3";

package dokime.host.v1;

// === Imports === //

import "dokime/model/v1/suites.proto";
import "harmos/model/v1/callers.proto";
import "harmos/model/v1/position.proto";

// === Options === //

option csharp_namespace = "Dokime.Clients";

// Reads select the latest durable boundary without flushing accepted writes.
// Issued cuts, pages and watches retain their selection; missing cuts and gaps refuse.
// Mutation request identities replay the original receipt for the same normalized input.

// === Services === //

// Owns the Suites resource on the host; callers are checked before handler admission.
service Suites {
  // Read the Suites resource; admission and policy are owned by the executor.
  rpc Get(.dokime.host.v1.SuitesGetRequest) returns (.dokime.host.v1.SuitesGetResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
  // List the Suites resource; admission and policy are owned by the executor.
  rpc List(.dokime.host.v1.SuitesListRequest) returns (.dokime.host.v1.SuitesListResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
}

// === Get === //

// SuitesGetRequest for Suites.Get.
message SuitesGetRequest {
  string name = 1;
  string parent = 2;
  uint32 schema_version = 3;
  optional .harmos.model.v1.ReadCut at = 90;
}

// SuitesGetResponse for Suites.Get.
message SuitesGetResponse {
  .dokime.model.v1.Suite value = 1;
  .harmos.model.v1.ReadCut resolved_at = 90;
}

// === List === //

// SuitesListRequest for Suites.List.
message SuitesListRequest {
  string parent = 1;
  optional .harmos.model.v1.ReadCut at = 90;
}

// SuitesListResponse for Suites.List.
message SuitesListResponse {
  repeated .dokime.model.v1.Suite values = 1;
  .harmos.model.v1.ReadCut resolved_at = 90;
}

// === Resources === //

// === Enums === //
