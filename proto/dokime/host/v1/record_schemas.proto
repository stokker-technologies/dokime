// RecordSchemas Contracts

syntax = "proto3";

package dokime.host.v1;

// === Imports === //

import "dokime/model/v1/evidence.proto";
import "dokime/model/v1/metadata.proto";
import "dokime/model/v1/scalar.proto";
import "harmos/model/v1/callers.proto";
import "harmos/model/v1/position.proto";

// === Options === //

option csharp_namespace = "Dokime.Protocol.Host.V1";

// === Services === //

// Host operations with explicit caller admission.
service RecordSchemas {
  // Get the RecordSchemas resource; admission and policy are owned by the executor.
  rpc Get(.dokime.host.v1.RecordSchemasGetRequest) returns (.dokime.host.v1.RecordSchemasGetResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
  // List the RecordSchemas resource; admission and policy are owned by the executor.
  rpc List(.dokime.host.v1.RecordSchemasListRequest) returns (.dokime.host.v1.RecordSchemasListResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
}

// === Get === //

// RecordSchemasGetRequest for RecordSchemas.Get.
message RecordSchemasGetRequest { string name = 1; string parent = 2; uint32 schema_version = 3; .harmos.model.v1.ReadCut at = 90; }

// RecordSchemasGetResponse for RecordSchemas.Get.
message RecordSchemasGetResponse { .dokime.host.v1.RecordSchema value = 1; .harmos.model.v1.ReadCut resolved_at = 90; }

// === List === //

// RecordSchemasListRequest for RecordSchemas.List.
message RecordSchemasListRequest { string parent = 1; .harmos.model.v1.ReadCut at = 90; }

// RecordSchemasListResponse for RecordSchemas.List.
message RecordSchemasListResponse { repeated .dokime.host.v1.RecordSchema values = 1; .harmos.model.v1.ReadCut resolved_at = 90; }

// === Resources === //

// Field value owned by this resource.
message Field {
  string id = 1;
  .dokime.host.v1.FieldType value_type = 2;
  bool nullable = 3;
  optional string unit = 4;
}

// RecordDisplay value owned by this resource.
message RecordDisplay {
  .dokime.host.v1.RecordIcon icon = 1;
  .dokime.host.v1.RecordTone tone = 2;
}

// RecordField value owned by this resource.
message RecordField {
  .dokime.model.v1.Metadata metadata = 1;
  .dokime.model.v1.ValueType value_type = 2;
  bool required = 3;
  bool nullable = 4;
  .dokime.host.v1.MeasurementUnit unit = 5;
  repeated .dokime.model.v1.Value choices = 6;
  .dokime.model.v1.Value default_value = 7;
  .dokime.host.v1.ValueFormat format = 8;
}

// RecordSchema value owned by this resource.
message RecordSchema {
  string record_type = 1;
  uint32 schema_version = 2;
  .dokime.model.v1.Metadata metadata = 3;
  optional string template_identifier = 4;
  optional string owner_suite_id = 5;
  .dokime.model.v1.Severity default_severity = 6;
  repeated .dokime.host.v1.RecordField fields = 7;
  optional .dokime.host.v1.ValidationMode validation_mode = 8;
  bool allow_extra_fields = 9;
  .dokime.host.v1.RecordDisplay display = 10;
  
  string message_name = 11;
}

// Schema value owned by this resource.
message Schema {
  string identity = 1;
  repeated uint32 versions = 2;
  repeated .dokime.host.v1.Field fields = 3;
}

// TelemetryColumn value owned by this resource.
message TelemetryColumn {
  .dokime.model.v1.Metadata metadata = 1;
  .dokime.model.v1.ValueType value_type = 2;
  .dokime.host.v1.TelemetryRole role = 3;
  .dokime.host.v1.MeasurementUnit unit = 4;
  optional string display_unit = 5;
  bool required = 6;
  bool nullable = 7;
  .dokime.model.v1.Value default_value = 8;
  .dokime.host.v1.ValueFormat format = 9;
}

// TelemetrySchema value owned by this resource.
message TelemetrySchema {
  string stream = 1;
  uint32 schema_version = 2;
  .dokime.host.v1.Schema storage_schema = 3;
  .dokime.model.v1.Metadata metadata = 4;
  optional string template_identifier = 5;
  optional string owner_suite_id = 6;
  repeated .dokime.host.v1.TelemetryColumn columns = 7;
  optional string default_x = 8;
  bool allow_extra_fields = 9;
  bool scalar = 10;
  optional .dokime.host.v1.ValidationMode validation_mode = 11;
  bool foreign = 12;
  
  string message_name = 13;
}

// AbsoluteTimeFormat value owned by this resource.
message AbsoluteTimeFormat {
  string pattern = 1;
}

// ElapsedFormat value owned by this resource.
message ElapsedFormat {
  .dokime.host.v1.ElapsedUnit unit = 1;
}

// EngineeringFormat value owned by this resource.
message EngineeringFormat {
  uint32 significant_digits = 1;
}

// FixedFormat value owned by this resource.
message FixedFormat {
  uint32 decimals = 1;
}

// MeasurementUnit value owned by this resource.
message MeasurementUnit {
  .dokime.model.v1.Metadata metadata = 1;
  .dokime.host.v1.UnitFamily family = 2;
  string symbol = 3;
}

// NormalFormat value owned by this resource.
message NormalFormat {
  optional uint32 max_fraction_digits = 1;
}

// ScientificFormat value owned by this resource.
message ScientificFormat {
  uint32 significant_digits = 1;
}

// SiPrefixFormat value owned by this resource.
message SiPrefixFormat {
  uint32 significant_digits = 1;
}

// ValueFormat value owned by this resource.
message ValueFormat {
  .dokime.host.v1.ValueFormatKind kind = 1;
}

// ValueFormatKind value owned by this resource.
message ValueFormatKind {
  oneof kind {
    .dokime.host.v1.NormalFormat normal = 1;
    .dokime.host.v1.FixedFormat fixed = 2;
    .dokime.host.v1.ScientificFormat scientific = 3;
    .dokime.host.v1.EngineeringFormat engineering = 4;
    .dokime.host.v1.SiPrefixFormat si_prefix = 5;
    .dokime.host.v1.AbsoluteTimeFormat absolute_time = 6;
    .dokime.host.v1.ElapsedFormat elapsed_since_run = 7;
    .dokime.host.v1.ElapsedFormat elapsed_since_cycle = 8;
  }
}

// === Enums === //

// FieldType choices.
enum FieldType {
  FIELD_TYPE_UNSPECIFIED = 0;
  FIELD_TYPE_BOOLEAN = 1;
  FIELD_TYPE_INTEGER = 2;
  FIELD_TYPE_INT64 = 3;
  FIELD_TYPE_UINT64 = 4;
  FIELD_TYPE_FLOAT64 = 5;
  FIELD_TYPE_TEXT = 6;
  FIELD_TYPE_DATETIME = 7;
  FIELD_TYPE_SEVERITY = 8;
  FIELD_TYPE_OBJECT = 9;
  FIELD_TYPE_ARRAY = 10;
}

