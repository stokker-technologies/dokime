// Progress Contracts

syntax = "proto3";

package dokime.host.v1.executions;

// === Imports === //

import "dokime/v1/execution.proto";
import "harmos/model/v1/callers.proto";
import "harmos/model/v1/position.proto";
import "harmos/model/v1/receipt.proto";

// === Options === //

option csharp_namespace = "Dokime.Protocol.Host.V1.ExecutionsResources";

// === Services === //

// Host operations with explicit caller admission.
service Progress {
  // Get the Progress resource; plugin selectors default to and are restricted to trusted caller identity.
  rpc Get(.dokime.host.v1.executions.ProgressGetRequest) returns (.dokime.host.v1.executions.ProgressGetResponse) {
    option (harmos.model.v1.callers) = ALL;
  }
  // Set the Progress resource; admission and policy are owned by the executor.
  rpc Set(.dokime.host.v1.executions.ProgressSetRequest) returns (.dokime.host.v1.executions.ProgressSetResponse) {
    option (harmos.model.v1.callers) = PLUGINS;
  }
  // Watch the Progress resource; admission and policy are owned by the executor.
  rpc Watch(.dokime.host.v1.executions.ProgressWatchRequest) returns (stream .dokime.host.v1.executions.ProgressWatchResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
}

// === Get === //

// ProgressGetRequest for Progress.Get.
message ProgressGetRequest { optional string name = 1; }

// ProgressGetResponse for Progress.Get.
message ProgressGetResponse {
  .dokime.v1.ExecutionProgressValue value = 1;
  bytes revision = 2;
  .harmos.model.v1.Position resolved_at = 3;
}

// === Set === //

// ProgressSetRequest for Progress.Set.
message ProgressSetRequest {
  string name = 1;
  .dokime.v1.ExecutionProgressValue value = 2;
  bytes expected_revision = 3;
  string request_id = 4;
}

// ProgressSetResponse for Progress.Set.
message ProgressSetResponse {
  .dokime.v1.ExecutionProgressValue value = 1;
  bytes revision = 2;
  .harmos.model.v1.Receipt receipt = 3;
}

// === Watch === //

// ProgressWatchRequest for Progress.Watch.
message ProgressWatchRequest { string name = 1; .harmos.model.v1.Position at = 2; }

// ProgressWatchResponse for Progress.Watch.
message ProgressWatchResponse {
  .dokime.v1.ExecutionProgressValue value = 1;
  bytes revision = 2;
  .harmos.model.v1.Position resolved_at = 3;
  string phase = 4;
  bool finished = 5;
}

// === Resources === //

// === Enums === //
