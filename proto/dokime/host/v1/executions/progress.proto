// Progress Contracts

syntax = "proto3";

package dokime.host.v1.executions;

// === Imports === //

import "dokime/host/v1/executions.proto";
import "dokime/model/v1/execution.proto";
import "harmos/model/v1/callers.proto";
import "harmos/model/v1/position.proto";
import "harmos/model/v1/receipt.proto";

// === Options === //

option csharp_namespace = "Dokime.Clients.ExecutionsResources";

// Reads select the latest durable boundary without flushing accepted writes.
// Issued cuts, pages and watches retain their selection; missing cuts and gaps refuse.
// Mutation request identities replay the original receipt for the same normalized input.

// === Services === //

// Owns the Progress resource on the host; callers are checked before handler admission.
service Progress {
  // Read the Progress resource; plugin selectors default to and are restricted to trusted caller identity.
  rpc Get(.dokime.host.v1.executions.ProgressGetRequest) returns (.dokime.host.v1.executions.ProgressGetResponse) {
    option (harmos.model.v1.callers) = ALL;
  }
  // Observe current progress and updates through seal, then end after one sealed frame.
  // An already sealed execution yields one terminal frame. Clients require sealed=true
  // before accepting stream completion; an earlier end or error is incomplete observation.
  rpc Watch(.dokime.host.v1.executions.ProgressWatchRequest) returns (stream .dokime.host.v1.executions.ProgressWatchResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
  // Replace the complete writable value of the Progress resource; admission and policy are owned by the executor.
  rpc Set(.dokime.host.v1.executions.ProgressSetRequest) returns (.dokime.host.v1.executions.ProgressSetResponse) {
    option (harmos.model.v1.callers) = PLUGINS;
  }
}

// === Requests and Responses === //

// ProgressGetRequest for Progress.Get.
// Clients supply the execution name. Plugins may omit it and may name only their own execution.
message ProgressGetRequest {
  optional string name = 1;
  optional .harmos.model.v1.Position at = 2;
}

// ProgressGetResponse for Progress.Get.
message ProgressGetResponse {
  .dokime.model.v1.ExecutionProgressValue value = 1;
  bytes revision = 2;
  .harmos.model.v1.Position resolved_at = 3;
}

// ProgressWatchRequest for Progress.Watch.
message ProgressWatchRequest {
  string name = 1;
  optional .harmos.model.v1.Position at = 2;
}

// ProgressWatchResponse for Progress.Watch.
message ProgressWatchResponse {
  .dokime.model.v1.ExecutionProgressValue value = 1;
  bytes revision = 2;
  .harmos.model.v1.Position resolved_at = 3;
  string phase = 4;
  bool finished = 5;
  // True only in the final frame, after the execution and its outcome are durably sealed.
  bool sealed = 6;
  // Present in the sealed frame, including its evaluated/declared status or unevaluated termination.
  .dokime.host.v1.ExecutionOutcome outcome = 7;
}

// ProgressSetRequest for Progress.Set.
message ProgressSetRequest {
  optional string name = 1;
  .dokime.model.v1.ExecutionProgressValue value = 2;
  bytes expected_revision = 3;
  string request_id = 4;
}

// ProgressSetResponse for Progress.Set.
message ProgressSetResponse {
  .dokime.model.v1.ExecutionProgressValue value = 1;
  bytes revision = 2;
  .harmos.model.v1.Receipt receipt = 3;
}

// === Resources === //

// === Enums === //
