// Secrets Contracts

syntax = "proto3";

package dokime.host.v1.plugins;

// === Imports === //

import "dokime/model/v1/secrets.proto";
import "harmos/model/v1/callers.proto";
import "harmos/model/v1/position.proto";

// === Options === //

option csharp_namespace = "Dokime.Clients.PluginsResources";

// Reads select the latest durable boundary without flushing accepted writes.
// Issued cuts, pages and watches retain their selection; missing cuts and gaps refuse.

// === Services === //

// Read-only view of what each plugin requires from Secret Storage; callers are checked before handler admission.
// A plugin reads the host-wide secret stored under exactly its declared identifier; nothing maps one to the other.
service Secrets {
  // List the Secrets resource; admission and policy are owned by the executor.
  rpc List(.dokime.host.v1.plugins.SecretsListRequest) returns (.dokime.host.v1.plugins.SecretsListResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
}

// === Requests and Responses === //

// SecretsListRequest for Secrets.List.
message SecretsListRequest {
  optional string name = 1;
  optional .harmos.model.v1.ReadCut at = 2;
}

// SecretsListResponse for Secrets.List.
// Each declared identifier and whether Secret Storage holds a secret under it; values never appear.
message SecretsListResponse {
  repeated .dokime.host.v1.plugins.SecretRequirement secrets = 1;
  .harmos.model.v1.ReadCut resolved_at = 2;
}

// === Resources === //

// SecretRequirement value owned by this resource.
message SecretRequirement {
  .dokime.model.v1.SecretDeclaration declaration = 1;
  bool available = 2;
}

// === Enums === //
