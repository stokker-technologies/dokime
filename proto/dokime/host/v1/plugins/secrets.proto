// Secrets Contracts

syntax = "proto3";

package dokime.host.v1.plugins;

// === Imports === //

import "dokime/model/v1/secrets.proto";
import "harmos/model/v1/callers.proto";
import "harmos/model/v1/position.proto";
import "harmos/model/v1/receipt.proto";

// === Options === //

option csharp_namespace = "Dokime.Clients.PluginsResources";

// Reads select the latest durable boundary without flushing accepted writes.
// Issued cuts, pages and watches retain their selection; missing cuts and gaps refuse.
// Mutation request identities replay the original receipt for the same normalized input.

// === Services === //

// Owns the Secrets resource on the host; callers are checked before handler admission.
service Secrets {
  // List the Secrets resource; admission and policy are owned by the executor.
  rpc List(.dokime.host.v1.plugins.SecretsListRequest) returns (.dokime.host.v1.plugins.SecretsListResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
  // Replace the complete writable value of the Secrets resource; admission and policy are owned by the executor.
  rpc Set(.dokime.host.v1.plugins.SecretsSetRequest) returns (.dokime.host.v1.plugins.SecretsSetResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
  // Delete the Secrets resource; admission and policy are owned by the executor.
  rpc Delete(.dokime.host.v1.plugins.SecretsDeleteRequest) returns (.dokime.host.v1.plugins.SecretsDeleteResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
}

// === List === //

// SecretsListRequest for Secrets.List.
message SecretsListRequest {
  optional string name = 1;
  optional .harmos.model.v1.ReadCut at = 2;
}

// SecretsListResponse for Secrets.List.
message SecretsListResponse {
  repeated .dokime.host.v1.plugins.SecretBinding bindings = 1;
  bytes revision = 2;
  .harmos.model.v1.ReadCut resolved_at = 3;
}

// === Set === //

// SecretsSetRequest for Secrets.Set.
// Replace the complete declared-name binding map at the expected revision. Unknown declarations refuse; values never appear in this resource.
message SecretsSetRequest {
  string name = 1;
  repeated .dokime.host.v1.plugins.SecretBindingValue bindings = 2;
  bytes expected_revision = 3;
  string request_id = 4;
}

// SecretsSetResponse for Secrets.Set.
message SecretsSetResponse {
  repeated .dokime.host.v1.plugins.SecretBinding bindings = 1;
  bytes revision = 2;
  .harmos.model.v1.Receipt receipt = 3;
}

// === Delete === //

// SecretsDeleteRequest for Secrets.Delete.
message SecretsDeleteRequest {
  string name = 1;
  repeated string identifiers = 2;
  bytes expected_revision = 3;
  string request_id = 4;
}

// SecretsDeleteResponse for Secrets.Delete.
message SecretsDeleteResponse {
  .harmos.model.v1.Receipt receipt = 1;
}

// === Resources === //

// SecretBindingValue value owned by this resource.
message SecretBindingValue {
  string identifier = 1;
  string secret = 2;
}

// SecretBinding value owned by this resource.
message SecretBinding {
  .dokime.model.v1.SecretDeclaration declaration = 1;
  string secret = 2;
  bool available = 3;
}

// === Enums === //
