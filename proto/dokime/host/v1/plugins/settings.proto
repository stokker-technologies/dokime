// Settings Contracts

syntax = "proto3";

package dokime.host.v1.plugins;

// === Imports === //

import "dokime/model/v1/scalar.proto";
import "dokime/model/v1/settings.proto";
import "harmos/model/v1/callers.proto";
import "harmos/model/v1/position.proto";
import "harmos/model/v1/receipt.proto";

// === Options === //

option csharp_namespace = "Dokime.Protocol.Host.V1.PluginsResources";

// === Services === //

// Host operations with explicit caller admission.
service Settings {
  // Get the Settings resource; admission and policy are owned by the executor.
  rpc Get(.dokime.host.v1.plugins.SettingsGetRequest) returns (.dokime.host.v1.plugins.SettingsGetResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
  // Set the Settings resource; admission and policy are owned by the executor.
  rpc Set(.dokime.host.v1.plugins.SettingsSetRequest) returns (.dokime.host.v1.plugins.SettingsSetResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
}

// === Get === //

// SettingsGetRequest for Settings.Get.
message SettingsGetRequest { string name = 1; .harmos.model.v1.ReadCut at = 90; }

// SettingsGetResponse for Settings.Get.
message SettingsGetResponse {
  .dokime.model.v1.MapValue value = 1;
  bytes revision = 2;
  .dokime.model.v1.SettingsDeclarations schema = 3;
  repeated .dokime.host.v1.plugins.SecretAvailability secrets = 4;
  .dokime.model.v1.MapValue discovered = 5;
  .harmos.model.v1.ReadCut resolved_at = 90;
}

// === Set === //

// SettingsSetRequest for Settings.Set.
message SettingsSetRequest { string name = 1; .dokime.model.v1.MapValue value = 20; bytes expected_revision = 21; string request_id = 22; }

// SettingsSetResponse for Settings.Set.
message SettingsSetResponse { .dokime.model.v1.MapValue value = 1; bytes revision = 2; .harmos.model.v1.Receipt receipt = 3; }

// === Resources === //

// SecretAvailability value owned by this resource.
message SecretAvailability {
  string identifier = 1;
  bool available = 2;
}

// === Enums === //
