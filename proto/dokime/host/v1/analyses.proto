// Analyses Contracts

syntax = "proto3";

package dokime.host.v1;

// === Imports === //

import "dokime/model/v1/analyses.proto";
import "harmos/model/v1/callers.proto";
import "harmos/model/v1/position.proto";

// === Options === //

option csharp_namespace = "Dokime.Clients";

// Reads select the latest durable boundary without flushing accepted writes.
// Issued cuts, pages and watches retain their selection; missing cuts and gaps refuse.
// Mutation request identities replay the original receipt for the same normalized input.

// === Services === //

// Owns the Analyses resource on the host; callers are checked before handler admission.
service Analyses {
  // List the Analyses resource; admission and policy are owned by the executor.
  rpc List(.dokime.host.v1.AnalysesListRequest) returns (.dokime.host.v1.AnalysesListResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
}

// === Requests and Responses === //

// AnalysesListRequest for Analyses.List.
message AnalysesListRequest {
  optional .harmos.model.v1.ReadCut at = 1;
}

// AnalysesListResponse for Analyses.List.
message AnalysesListResponse {
  repeated .dokime.model.v1.Analysis definitions = 1;
  .harmos.model.v1.ReadCut resolved_at = 2;
}

// === Resources === //

// === Enums === //
