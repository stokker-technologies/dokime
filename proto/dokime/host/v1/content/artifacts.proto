// Artifacts Contracts

syntax = "proto3";

package dokime.host.v1.content;

// === Imports === //

import "dokime/model/v1/evidence.proto";
import "dokime/model/v1/metadata.proto";
import "harmos/model/v1/callers.proto";
import "harmos/model/v1/failure.proto";
import "harmos/model/v1/file.proto";
import "harmos/model/v1/page.proto";
import "harmos/model/v1/position.proto";
import "harmos/model/v1/receipt.proto";

// === Options === //

option csharp_namespace = "Dokime.Clients.ContentResources";

// Reads select the latest durable boundary without flushing accepted writes.
// Issued cuts, pages and watches retain their selection; missing cuts and gaps refuse.
// Mutation request identities replay the original receipt for the same normalized input.

// === Services === //

// Owns the Artifacts resource on the host; callers are checked before handler admission.
service Artifacts {
  // Read the Artifacts resource; admission and policy are owned by the executor.
  rpc Get(.dokime.host.v1.content.ArtifactsGetRequest) returns (.dokime.host.v1.content.ArtifactsGetResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
  // Create the Artifacts resource; admission and policy are owned by the executor.
  rpc Create(.dokime.host.v1.content.ArtifactsCreateRequest) returns (.dokime.host.v1.content.ArtifactsCreateResponse) {
    option (harmos.model.v1.callers) = ALL;
  }
  // List the Artifacts resource; admission and policy are owned by the executor.
  rpc List(.dokime.host.v1.content.ArtifactsListRequest) returns (.dokime.host.v1.content.ArtifactsListResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
  // Observe durable changes to the Artifacts resource; admission and policy are owned by the executor.
  rpc Watch(.dokime.host.v1.content.ArtifactsWatchRequest) returns (stream .dokime.host.v1.content.ArtifactsWatchResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
}

// === Requests and Responses === //

// ArtifactsGetRequest for Artifacts.Get.
message ArtifactsGetRequest {
  string name = 1;
  optional .harmos.model.v1.ReadCut at = 90;
}

// ArtifactsGetResponse for Artifacts.Get.
message ArtifactsGetResponse {
  .dokime.model.v1.ArtifactMetadata metadata = 1;
  .harmos.model.v1.FileReference file = 2;
  .harmos.model.v1.ReadCut resolved_at = 90;
}

// ArtifactsCreateRequest for Artifacts.Create.
// Clients supply scope; a plugin may omit it and is restricted to its own execution. Metadata is retained alongside the published file.
message ArtifactsCreateRequest {
  .harmos.model.v1.FileReference file = 1;
  optional .dokime.model.v1.ArtifactScope scope = 2;
  string filename = 3;
  string content_type = 4;
  string request_id = 5;

  optional .dokime.model.v1.Metadata metadata = 6;
}

// ArtifactsCreateResponse for Artifacts.Create.
message ArtifactsCreateResponse {
  .dokime.model.v1.ArtifactMetadata artifact = 1;
  .harmos.model.v1.Receipt receipt = 2;
}

// ArtifactsListRequest for Artifacts.List.
message ArtifactsListRequest {
  .dokime.model.v1.ArtifactScope scope = 1;
  optional .harmos.model.v1.ReadCut at = 90;
  optional .harmos.model.v1.PageRequest page = 91;
}

// ArtifactsListResponse for Artifacts.List.
message ArtifactsListResponse {
  repeated .dokime.model.v1.ArtifactMetadata artifacts = 1;
  .harmos.model.v1.ReadCut resolved_at = 90;
  string next_page_token = 91;
}

// ArtifactsWatchRequest for Artifacts.Watch.
message ArtifactsWatchRequest {
  .dokime.model.v1.ArtifactScope scope = 1;
  optional .harmos.model.v1.ReadCut at = 90;
  optional .harmos.model.v1.PageRequest page = 91;
}

// ArtifactsWatchResponse for Artifacts.Watch.
message ArtifactsWatchResponse {
  repeated .dokime.model.v1.ArtifactMetadata artifacts = 1;
  .harmos.model.v1.ReadCut resolved_at = 90;
  bool opening = 91;
  .harmos.model.v1.Failure resync_required = 92;
}

// === Resources === //

// === Enums === //
