// Secrets Contracts

syntax = "proto3";

package dokime.host.v1;

// === Imports === //

import "dokime/model/v1/metadata.proto";
import "harmos/model/v1/callers.proto";
import "harmos/model/v1/failure.proto";
import "harmos/model/v1/position.proto";
import "harmos/model/v1/receipt.proto";

// === Options === //

option csharp_namespace = "Dokime.Clients";

// Reads select the latest durable boundary without flushing accepted writes.
// Issued cuts, pages and watches retain their selection; missing cuts and gaps refuse.
// Mutation request identities replay the original receipt for the same normalized input.

// === Services === //

// Owns the Secrets resource on the host; callers are checked before handler admission.
service Secrets {
  // Read the Secrets resource; plugin selectors default to and are restricted to trusted caller identity.
  rpc Get(.dokime.host.v1.SecretsGetRequest) returns (.dokime.host.v1.SecretsGetResponse) {
    option (harmos.model.v1.callers) = ALL;
  }
  // Replace the complete writable value of the Secrets resource; admission and policy are owned by the executor.
  rpc Set(.dokime.host.v1.SecretsSetRequest) returns (.dokime.host.v1.SecretsSetResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
  // List the Secrets resource; admission and policy are owned by the executor.
  rpc List(.dokime.host.v1.SecretsListRequest) returns (.dokime.host.v1.SecretsListResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
  // Observe durable changes to the Secrets resource; admission and policy are owned by the executor.
  rpc Watch(.dokime.host.v1.SecretsWatchRequest) returns (stream .dokime.host.v1.SecretsWatchResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
  // Delete the Secrets resource; admission and policy are owned by the executor.
  rpc Delete(.dokime.host.v1.SecretsDeleteRequest) returns (.dokime.host.v1.SecretsDeleteResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
  // Export the Secrets resource; admission and policy are owned by the executor.
  rpc Export(.dokime.host.v1.SecretsExportRequest) returns (.dokime.host.v1.SecretsExportResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
  // Import the Secrets resource; admission and policy are owned by the executor.
  rpc Import(.dokime.host.v1.SecretsImportRequest) returns (.dokime.host.v1.SecretsImportResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
}

// === Get === //

// SecretsGetRequest for Secrets.Get.
// name is a secret identifier. A plugin may read only a name in its SecretsDeclarations, resolved through its own plugin secret bindings.
message SecretsGetRequest {
  string name = 1;
  optional .harmos.model.v1.ReadCut at = 90;
}

// SecretsGetResponse for Secrets.Get.
// secret contains the protected bytes. For plugin callers, value and revision are absent/empty; administrative metadata is clients-only.
message SecretsGetResponse {
  .dokime.host.v1.SecretWritable value = 1;
  bytes revision = 2;
  .harmos.model.v1.ReadCut resolved_at = 90;
  bytes secret = 3;
}

// === Set === //

// SecretsSetRequest for Secrets.Set.
message SecretsSetRequest {
  string name = 1;
  .dokime.host.v1.SecretWritable value = 20;
  bytes expected_revision = 21;
  string request_id = 22;
}

// SecretsSetResponse for Secrets.Set.
message SecretsSetResponse {
  .dokime.host.v1.SecretWritable value = 1;
  bytes revision = 2;
  .harmos.model.v1.Receipt receipt = 3;
}

// === List === //

// SecretsListRequest for Secrets.List.
message SecretsListRequest {
  optional .harmos.model.v1.ReadCut at = 90;
}

// SecretsListResponse for Secrets.List.
message SecretsListResponse {
  repeated .dokime.host.v1.SecretSummary entries = 1;
  uint64 generation = 2;
  .harmos.model.v1.ReadCut resolved_at = 90;
}

// === Watch === //

// SecretsWatchRequest for Secrets.Watch.
message SecretsWatchRequest {
  optional .harmos.model.v1.ReadCut at = 90;
}

// SecretsWatchResponse for Secrets.Watch.
message SecretsWatchResponse {
  repeated .dokime.host.v1.SecretSummary entries = 1;
  uint64 generation = 2;
  .harmos.model.v1.ReadCut resolved_at = 90;
  bool opening = 91;
  .harmos.model.v1.Failure resync_required = 92;
}

// === Delete === //

// SecretsDeleteRequest for Secrets.Delete.
message SecretsDeleteRequest {
  repeated string names = 1;
  bytes expected_revision = 2;
  string request_id = 3;
}

// SecretsDeleteResponse for Secrets.Delete.
message SecretsDeleteResponse {
  .harmos.model.v1.Receipt receipt = 1;
  bool cleanup_pending = 2;
}

// === Export === //

// SecretsExportRequest for Secrets.Export.
message SecretsExportRequest {
  repeated string names = 1;
  uint64 generation = 2;
  optional .harmos.model.v1.ReadCut at = 90;
}

// SecretsExportResponse for Secrets.Export.
message SecretsExportResponse {
  .dokime.host.v1.SecretArchive archive = 1;
  .harmos.model.v1.ReadCut resolved_at = 90;
}

// === Import === //

// SecretsImportRequest for Secrets.Import.
message SecretsImportRequest {
  bytes data = 1;
  repeated .dokime.host.v1.SecretImportChoice choices = 2;
  uint64 generation = 3;
  bool validate_only = 4;
  string request_id = 5;
}

// SecretsImportResponse for Secrets.Import.
message SecretsImportResponse {
  .dokime.host.v1.SecretImportPreview preview = 1;
  .dokime.host.v1.SecretSnapshot snapshot = 2;
  .harmos.model.v1.Receipt receipt = 3;
}

// === Resources === //

// SecretArchive value owned by this resource.
message SecretArchive {
  bytes data = 1;
}

// SecretImportChoice value owned by this resource.
message SecretImportChoice {
  string identifier = 1;
  .dokime.host.v1.SecretImportAction action = 2;
}

// SecretImportEntry value owned by this resource.
message SecretImportEntry {
  .dokime.model.v1.Metadata metadata = 1;
  bool exists = 2;
}

// SecretImportPreview value owned by this resource.
message SecretImportPreview {
  string host_id = 1;
  string host_label = 2;
  uint64 generation = 3;
  repeated .dokime.host.v1.SecretImportEntry entries = 4;
}

// SecretSnapshot value owned by this resource.
message SecretSnapshot {
  string host_id = 1;
  string host_label = 2;
  uint64 generation = 3;
  repeated .dokime.host.v1.SecretSummary entries = 4;
  bool cleanup_pending = 5;
}

// SecretSummary value owned by this resource.
message SecretSummary {
  .dokime.model.v1.Metadata metadata = 1;
  repeated string known_uses = 2;
}

// SecretWritable value owned by this resource.
message SecretWritable {
  .dokime.model.v1.Metadata metadata = 1;
  optional string value = 2;
}

// === Enums === //

// SecretImportAction choices.
enum SecretImportAction {
  SECRET_IMPORT_ACTION_UNSPECIFIED = 0;
  SECRET_IMPORT_ACTION_REPLACE = 1;
  SECRET_IMPORT_ACTION_SKIP = 2;
}
