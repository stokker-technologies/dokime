// Answers Contracts

syntax = "proto3";

package dokime.host.v1.prompts;

// === Imports === //

import "dokime/v1/prompts.proto";
import "dokime/v1/scalar.proto";
import "harmos/model/v1/callers.proto";
import "harmos/model/v1/receipt.proto";

// === Options === //

option csharp_namespace = "Dokime.Protocol.Host.V1.PromptsResources";

// === Services === //

// Host operations with explicit caller admission.
service Answers {
  // Create the Answers resource; admission and policy are owned by the executor.
  rpc Create(.dokime.host.v1.prompts.AnswersCreateRequest) returns (.dokime.host.v1.prompts.AnswersCreateResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
}

// === Create === //

// AnswersCreateRequest for Answers.Create.
message AnswersCreateRequest {
  string parent = 1;
  string action = 2;
  .dokime.v1.MapValue values = 3;
  bool accepted = 4;
  string request_id = 5;
}

// AnswersCreateResponse for Answers.Create.
message AnswersCreateResponse { .dokime.v1.PromptResponse answer = 1; .harmos.model.v1.Receipt receipt = 2; }

// === Resources === //

// === Enums === //
