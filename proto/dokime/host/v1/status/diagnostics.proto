// Diagnostics Contracts
//
// Product client exposure of the in-process library operations.

syntax = "proto3";

package dokime.host.v1.status;

// === Imports === //

import "harmos/host/v1/status/diagnostics.proto";
import "harmos/model/v1/callers.proto";

// === Options === //

option csharp_namespace = "Dokime.Clients.StatusResources";

// === Services === //

// Exposes Diagnostics to product clients with library-owned payloads and execution policy.
service Diagnostics {
  // Create a redacted diagnostics archive on an empty name at offset zero, or read bounded ranges of the retained archive; unknown/expired names refuse.
  rpc Get(.harmos.host.v1.status.DiagnosticsGetRequest) returns (.harmos.host.v1.status.DiagnosticsGetResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
}

// === Requests and Responses === //

