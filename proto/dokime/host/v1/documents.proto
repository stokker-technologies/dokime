// Documents Contracts

syntax = "proto3";

package dokime.host.v1;

// === Imports === //

import "dokime/v1/documents.proto";
import "dokime/v1/evidence.proto";
import "dokime/v1/expressions.proto";
import "dokime/v1/formatting.proto";
import "dokime/v1/metadata.proto";
import "dokime/v1/plots.proto";
import "dokime/v1/scalar.proto";
import "harmos/model/v1/callers.proto";
import "harmos/model/v1/failure.proto";
import "harmos/model/v1/position.proto";
import "harmos/model/v1/receipt.proto";

// === Options === //

option csharp_namespace = "Dokime.Protocol.Host.V1";

// === Services === //

// Host operations with explicit caller admission.
service Documents {
  // AppendParts the Documents resource; admission and policy are owned by the executor.
  rpc AppendParts(.dokime.host.v1.DocumentsAppendPartsRequest) returns (.dokime.host.v1.DocumentsAppendPartsResponse) {
    option (harmos.model.v1.callers) = PLUGINS;
  }
  // Get the Documents resource; admission and policy are owned by the executor.
  rpc Get(.dokime.host.v1.DocumentsGetRequest) returns (.dokime.host.v1.DocumentsGetResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
  // Watch the Documents resource; admission and policy are owned by the executor.
  rpc Watch(.dokime.host.v1.DocumentsWatchRequest) returns (stream .dokime.host.v1.DocumentsWatchResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
}

// === AppendParts === //

// DocumentsAppendPartsRequest for Documents.AppendParts.
message DocumentsAppendPartsRequest {
  string execution = 1;
  string document = 2;
  
  string section = 3;
  oneof part { .dokime.v1.Section subsection = 4; .dokime.v1.Card card = 5; }
  string request_id = 20;
}

// DocumentsAppendPartsResponse for Documents.AppendParts.
message DocumentsAppendPartsResponse { .harmos.model.v1.Receipt receipt = 1; }

// === Get === //

// DocumentsGetRequest for Documents.Get.
message DocumentsGetRequest {
  .dokime.v1.DocumentScope scope = 1;
  string document_id = 2;
  bool structure_only = 3;
  repeated string card_ids = 4;
  string page_token = 5;
  uint64 max_bytes = 6;
  
  
  uint32 max_frames = 7;
  .harmos.model.v1.ReadCut at = 90;
}

// DocumentsGetResponse for Documents.Get.
message DocumentsGetResponse {
  repeated .dokime.host.v1.DocumentFrame frames = 1;
  string next_page_token = 2;
  .harmos.model.v1.ReadCut resolved_at = 90;
}

// === Watch === //

// DocumentsWatchRequest for Documents.Watch.
message DocumentsWatchRequest {
  .dokime.v1.DocumentScope scope = 1;
  string document_id = 2;
  bool structure_only = 3;
  repeated string card_ids = 4;
  string page_token = 5;
  uint64 max_bytes = 6;
  
  uint32 max_frames = 7;
  .harmos.model.v1.ReadCut at = 90;
}

// DocumentsWatchResponse for Documents.Watch.
message DocumentsWatchResponse {
  repeated .dokime.host.v1.DocumentFrame frames = 1;
  .harmos.model.v1.ReadCut resolved_at = 90;
  bool opening = 91;
  .harmos.model.v1.Failure resync_required = 92;
}

// === Resources === //

// DocumentBinding value owned by this resource.
message DocumentBinding {
  string source_id = 1;
  .dokime.v1.Metadata metadata = 2;
  .dokime.host.v1.DocumentBindingResult result = 3;
}

// DocumentBindingResult value owned by this resource.
message DocumentBindingResult {
  oneof kind {
    bool literal = 1;
    .dokime.host.v1.DocumentSummary summary = 2;
    .dokime.host.v1.DocumentPlotDefinition plot = 3;
    bool pending = 4;
    .dokime.host.v1.DocumentCardFailure failure = 5;
  }
}

// DocumentCard value owned by this resource.
message DocumentCard {
  .dokime.v1.Metadata metadata = 1;
  repeated .dokime.v1.PlotFilter filters = 2;
  .dokime.host.v1.DocumentCardBody body = 3;
}

// DocumentCardBody value owned by this resource.
message DocumentCardBody {
  oneof kind {
    string markdown = 1;
    .dokime.host.v1.DocumentTable table = 2;
    .dokime.host.v1.DocumentSummary summary = 3;
    .dokime.host.v1.DocumentOwnerReference owner = 4;
  }
}

// DocumentCardBudget value owned by this resource.
message DocumentCardBudget {
  string name = 1;
  uint64 limit = 2;
  uint64 reached = 3;
  string card_id = 4;
}

// DocumentCardFailure value owned by this resource.
message DocumentCardFailure {
  string code = 1;
  string message = 2;
  .dokime.host.v1.DocumentCardBudget budget = 3;
}

// DocumentCompletion value owned by this resource.
message DocumentCompletion {
  uint64 frame_count = 1;
  uint64 card_count = 2;
  uint64 layout_node_count = 3;
  uint64 binding_count = 4;
  uint64 repeat_count = 5;
  uint64 section_count = 6;
  bool partial = 7;
}

// DocumentEvidenceCut value owned by this resource.
message DocumentEvidenceCut {
  .dokime.host.v1.DocumentTelemetryCut cut = 1;
  bool telemetry = 2;
  bool cacheable = 3;
}

// DocumentFrame value owned by this resource.
message DocumentFrame {
  .dokime.host.v1.DocumentFrameFrame frame = 1;
}

// DocumentFrameFrame value owned by this resource.
message DocumentFrameFrame {
  oneof kind {
    .dokime.host.v1.DocumentHeader header = 1;
    .dokime.host.v1.DocumentLayoutNode layout_node = 2;
    .dokime.host.v1.DocumentCard card = 3;
    .dokime.host.v1.DocumentTableRow table_row = 4;
    .dokime.host.v1.DocumentSummaryGroup summary_group = 5;
    .dokime.host.v1.DocumentSummaryTile summary_tile = 6;
    .dokime.host.v1.DocumentWarning warning = 7;
    .dokime.host.v1.DocumentCompletion completion = 8;
    .dokime.host.v1.DocumentSummaryGroupDefinition group_definition = 9;
    .dokime.host.v1.DocumentSummaryTileDefinition tile_definition = 10;
    .dokime.host.v1.DocumentBinding binding = 11;
    .dokime.host.v1.DocumentRepeatSelection repeat_selection = 12;
    .dokime.host.v1.DocumentRepeatInstance repeat_instance = 13;
    .dokime.host.v1.DocumentSectionIdentity section_identity = 14;
    
    .dokime.host.v1.DocumentCompletion structure_complete = 15;
    
    string card_complete = 16;
    bool expansion_complete = 17;
    
    .dokime.host.v1.DocumentEvidenceCut evidence_cut = 18;
    string section_removal = 19;
    string artifact_cut = 20;
    .dokime.host.v1.DocumentPage page = 21;
  }
}

// DocumentFrontiers value owned by this resource.
message DocumentFrontiers {
  string process_epoch = 1;
  uint64 state_revision = 2;
  .dokime.host.v1.DocumentTelemetryCut telemetry = 3;
  optional string artifacts_sha256 = 4;
  .dokime.host.v1.DocumentTelemetryCut evidence = 5;
}

// DocumentHeader value owned by this resource.
message DocumentHeader {
  string document_id = 1;
  .dokime.v1.Metadata metadata = 2;
  .dokime.v1.EvidenceScope scope = 3;
  .dokime.host.v1.DocumentFrontiers frontiers = 4;
}

// DocumentLayoutNode value owned by this resource.
message DocumentLayoutNode {
  uint64 ordinal = 1;
  optional uint64 parent_ordinal = 2;
  .dokime.host.v1.DocumentLayoutNodeNode node = 3;
}

// DocumentLayoutNodeNode value owned by this resource.
message DocumentLayoutNodeNode {
  oneof kind {
    .dokime.host.v1.DocumentSection section = 1;
    .dokime.host.v1.DocumentPlacement placement = 2;
  }
}

// DocumentOwnerReference value owned by this resource.
message DocumentOwnerReference {
  .dokime.host.v1.DocumentCardKind kind = 1;
  optional string plot_id = 2;
  .dokime.host.v1.DocumentPlotDefinition plot = 3;
}

// DocumentPage value owned by this resource.
message DocumentPage {
  string current = 1;
  optional string next = 2;
}

// DocumentPlacement value owned by this resource.
message DocumentPlacement {
  string card_id = 1;
  .dokime.host.v1.DocumentSpan column_span = 2;
  uint32 row_span = 3;
  int32 order = 4;
  .dokime.host.v1.DocumentDensity density = 5;
  .dokime.host.v1.DocumentRail rail = 6;
}

// DocumentPlotDefinition value owned by this resource.
message DocumentPlotDefinition {
  .dokime.v1.Metadata metadata = 1;
  .dokime.v1.PlotRequest request = 2;
  .dokime.host.v1.PlotPresentation presentation = 3;
  .dokime.v1.DataExpression z_expression = 4;
}

// DocumentRepeat value owned by this resource.
message DocumentRepeat {
  .dokime.v1.DataExpression value = 1;
  string label_template = 2;
  optional string id_template = 3;
  .dokime.v1.DataExpression order_by = 4;
  repeated .dokime.v1.PlotFilter filters = 5;
}

// DocumentRepeatInstance value owned by this resource.
message DocumentRepeatInstance {
  string selection_id = 1;
  uint64 ordinal = 2;
  string suffix = 3;
  string node_id = 4;
  .dokime.v1.PlotFilter filter = 5;
}

// DocumentRepeatSelection value owned by this resource.
message DocumentRepeatSelection {
  string node_id = 1;
  uint64 instance_count = 2;
  bool pending = 3;
}

// DocumentSection value owned by this resource.
message DocumentSection {
  string node_id = 1;
  .dokime.v1.Metadata metadata = 2;
  .dokime.host.v1.DocumentRepeat repeat = 3;
}

// DocumentSectionIdentity value owned by this resource.
message DocumentSectionIdentity {
  string node_id = 1;
  .dokime.v1.Metadata metadata = 2;
  optional string unavailable = 3;
}

// DocumentSpan value owned by this resource.
message DocumentSpan {
  uint32 base = 1;
  optional uint32 sm = 2;
  optional uint32 md = 3;
  optional uint32 lg = 4;
  optional uint32 xl = 5;
}

// DocumentSummary value owned by this resource.
message DocumentSummary {
  uint64 group_count = 1;
}

// DocumentSummaryCondition value owned by this resource.
message DocumentSummaryCondition {
  .dokime.v1.FilterOperator operator = 1;
  .dokime.v1.Value value = 2;
  .dokime.host.v1.DocumentSummaryState state = 3;
}

// DocumentSummaryGroup value owned by this resource.
message DocumentSummaryGroup {
  string card_id = 1;
  uint64 ordinal = 2;
  .dokime.v1.Metadata metadata = 3;
  uint64 tile_count = 4;
}

// DocumentSummaryGroupDefinition value owned by this resource.
message DocumentSummaryGroupDefinition {
  string card_id = 1;
  uint64 ordinal = 2;
  .dokime.v1.Metadata metadata = 3;
  uint64 tile_count = 4;
}

// DocumentSummaryTile value owned by this resource.
message DocumentSummaryTile {
  string card_id = 1;
  uint64 group_ordinal = 2;
  uint64 ordinal = 3;
  .dokime.v1.Metadata metadata = 4;
  .dokime.v1.Value value = 5;
  .dokime.host.v1.DocumentSummaryStat stat = 6;
  .dokime.host.v1.DocumentSummaryFormat format = 7;
  .dokime.host.v1.DocumentSummaryPresentation presentation = 8;
  optional string unit = 9;
  optional .dokime.host.v1.DocumentSummaryState state = 10;
  optional string unavailable = 11;
}

// DocumentSummaryTileDefinition value owned by this resource.
message DocumentSummaryTileDefinition {
  string card_id = 1;
  uint64 group_ordinal = 2;
  uint64 ordinal = 3;
  .dokime.v1.Metadata metadata = 4;
  .dokime.v1.DataExpression value = 5;
  repeated .dokime.v1.PlotFilter filters = 6;
  .dokime.host.v1.DocumentSummaryStat stat = 7;
  .dokime.host.v1.DocumentSummaryFormat format = 8;
  .dokime.host.v1.DocumentSummaryPresentation presentation = 9;
  optional string unit = 10;
  repeated .dokime.host.v1.DocumentSummaryCondition conditions = 11;
}

// DocumentTable value owned by this resource.
message DocumentTable {
  uint64 row_count = 1;
}

// DocumentTableRow value owned by this resource.
message DocumentTableRow {
  string card_id = 1;
  uint64 ordinal = 2;
  .dokime.v1.TableRow values = 3;
}

// DocumentTelemetryCut value owned by this resource.
message DocumentTelemetryCut {
  string store = 1;
  string epoch = 2;
  uint64 position = 3;
}

// DocumentWarning value owned by this resource.
message DocumentWarning {
  string code = 1;
  string message = 2;
}

// PlotPresentation value owned by this resource.
message PlotPresentation {
  .dokime.v1.LineStyle style = 1;
  .dokime.v1.PlotFftOptions fft = 2;
  .dokime.v1.PlotIntervalOptions interval = 3;
  .dokime.v1.PlotHistogramOptions histogram = 4;
  repeated .dokime.host.v1.PlotReferenceLine reference_lines = 5;
  repeated .dokime.host.v1.PlotReferenceBand reference_bands = 6;
  .dokime.v1.ValueFormat x_format = 7;
  .dokime.v1.ValueFormat y_format = 8;
  .dokime.host.v1.PlotAxisKind x_axis = 9;
  optional string x_axis_unit = 10;
  optional double scale = 11;
}

// PlotReferenceBand value owned by this resource.
message PlotReferenceBand {
  .dokime.host.v1.PlotReferenceValue min = 1;
  .dokime.host.v1.PlotReferenceValue max = 2;
  optional string label = 3;
  string color = 4;
  .dokime.host.v1.PlotReferenceValue center = 5;
  .dokime.host.v1.PlotReferenceValue tolerance = 6;
}

// PlotReferenceLine value owned by this resource.
message PlotReferenceLine {
  .dokime.host.v1.PlotReferenceValue value = 1;
  optional string label = 2;
  string color = 3;
}

// PlotReferenceValue value owned by this resource.
message PlotReferenceValue {
  optional double constant = 1;
  .dokime.v1.DataExpression expression = 2;
}

// === Enums === //

// DocumentCardKind choices.
enum DocumentCardKind {
  DOCUMENT_CARD_KIND_UNSPECIFIED = 0;
  DOCUMENT_CARD_KIND_TEXT = 1;
  DOCUMENT_CARD_KIND_TELEMETRY_SUMMARY = 2;
  DOCUMENT_CARD_KIND_PLOT = 3;
  DOCUMENT_CARD_KIND_TABLE = 4;
  DOCUMENT_CARD_KIND_STEPS = 5;
  DOCUMENT_CARD_KIND_CRITERIA = 6;
  DOCUMENT_CARD_KIND_TRACEABILITY = 7;
  DOCUMENT_CARD_KIND_NOTES = 8;
  DOCUMENT_CARD_KIND_RECORDS = 9;
  DOCUMENT_CARD_KIND_ARTIFACTS = 10;
  DOCUMENT_CARD_KIND_MEDIA = 11;
  DOCUMENT_CARD_KIND_HEALTH = 12;
  DOCUMENT_CARD_KIND_TELEMETRY_CONTEXT = 13;
}

// DocumentDensity choices.
enum DocumentDensity {
  DOCUMENT_DENSITY_UNSPECIFIED = 0;
  DOCUMENT_DENSITY_COMPACT = 1;
  DOCUMENT_DENSITY_NORMAL = 2;
  DOCUMENT_DENSITY_SPACIOUS = 3;
}

// DocumentRail choices.
enum DocumentRail {
  DOCUMENT_RAIL_UNSPECIFIED = 0;
  DOCUMENT_RAIL_MAIN = 1;
  DOCUMENT_RAIL_RIGHT = 2;
  DOCUMENT_RAIL_LEFT = 3;
}

// DocumentSummaryFormat choices.
enum DocumentSummaryFormat {
  DOCUMENT_SUMMARY_FORMAT_UNSPECIFIED = 0;
  DOCUMENT_SUMMARY_FORMAT_AUTO = 1;
  DOCUMENT_SUMMARY_FORMAT_NUMBER = 2;
  DOCUMENT_SUMMARY_FORMAT_PERCENT = 3;
  DOCUMENT_SUMMARY_FORMAT_DURATION = 4;
  DOCUMENT_SUMMARY_FORMAT_DISTANCE = 5;
  DOCUMENT_SUMMARY_FORMAT_STATUS = 6;
  DOCUMENT_SUMMARY_FORMAT_TEXT = 7;
}

// DocumentSummaryPresentation choices.
enum DocumentSummaryPresentation {
  DOCUMENT_SUMMARY_PRESENTATION_UNSPECIFIED = 0;
  DOCUMENT_SUMMARY_PRESENTATION_VALUE = 1;
  DOCUMENT_SUMMARY_PRESENTATION_PROGRESS = 2;
  DOCUMENT_SUMMARY_PRESENTATION_BADGE = 3;
}

// DocumentSummaryStat choices.
enum DocumentSummaryStat {
  DOCUMENT_SUMMARY_STAT_UNSPECIFIED = 0;
  DOCUMENT_SUMMARY_STAT_LATEST = 1;
}

// DocumentSummaryState choices.
enum DocumentSummaryState {
  DOCUMENT_SUMMARY_STATE_UNSPECIFIED = 0;
  DOCUMENT_SUMMARY_STATE_OK = 1;
  DOCUMENT_SUMMARY_STATE_WARNING = 2;
  DOCUMENT_SUMMARY_STATE_CRITICAL = 3;
  DOCUMENT_SUMMARY_STATE_MUTED = 4;
}

// PlotAxisKind choices.
enum PlotAxisKind {
  PLOT_AXIS_KIND_UNSPECIFIED = 0;
  PLOT_AXIS_KIND_WALL_TIME = 1;
  PLOT_AXIS_KIND_ELAPSED = 2;
}
