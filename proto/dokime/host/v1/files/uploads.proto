// Uploads Contracts

syntax = "proto3";

package dokime.host.v1.files;

// === Imports === //

import "harmos/model/v1/callers.proto";
import "harmos/model/v1/file.proto";
import "harmos/model/v1/position.proto";
import "harmos/model/v1/receipt.proto";

// === Options === //

option csharp_namespace = "Dokime.Protocol.Host.V1.FilesResources";

// === Services === //

// Host operations with explicit caller admission.
service Uploads {
  // Create the Uploads resource; plugin selectors default to and are restricted to trusted caller identity.
  rpc Create(.dokime.host.v1.files.UploadsCreateRequest) returns (.dokime.host.v1.files.UploadsCreateResponse) {
    option (harmos.model.v1.callers) = ALL;
  }
  // Get the Uploads resource; plugin selectors default to and are restricted to trusted caller identity.
  rpc Get(.dokime.host.v1.files.UploadsGetRequest) returns (.dokime.host.v1.files.UploadsGetResponse) {
    option (harmos.model.v1.callers) = ALL;
  }
  // Resume the Uploads resource; plugin selectors default to and are restricted to trusted caller identity.
  rpc Resume(.dokime.host.v1.files.UploadsResumeRequest) returns (.dokime.host.v1.files.UploadsResumeResponse) {
    option (harmos.model.v1.callers) = ALL;
  }
  // Append the Uploads resource; plugin selectors default to and are restricted to trusted caller identity.
  rpc Append(.dokime.host.v1.files.UploadsAppendRequest) returns (.dokime.host.v1.files.UploadsAppendResponse) {
    option (harmos.model.v1.callers) = ALL;
  }
  // Publish the Uploads resource; plugin selectors default to and are restricted to trusted caller identity.
  rpc Publish(.dokime.host.v1.files.UploadsPublishRequest) returns (.dokime.host.v1.files.UploadsPublishResponse) {
    option (harmos.model.v1.callers) = ALL;
  }
  // Delete the Uploads resource; plugin selectors default to and are restricted to trusted caller identity.
  rpc Delete(.dokime.host.v1.files.UploadsDeleteRequest) returns (.dokime.host.v1.files.UploadsDeleteResponse) {
    option (harmos.model.v1.callers) = ALL;
  }
}

// === Create === //

// UploadsCreateRequest for Uploads.Create.
message UploadsCreateRequest {
  .harmos.model.v1.FileMetadata metadata = 1;
  string request_id = 2;
}

// UploadsCreateResponse for Uploads.Create.
message UploadsCreateResponse {
  .harmos.storage.v1.FileProducer production = 1;
  .harmos.model.v1.Receipt receipt = 2;
  uint64 chunk_bytes = 3;
  uint64 message_bytes = 4;
}

// === Get === //

// UploadsGetRequest for Uploads.Get.
message UploadsGetRequest {
  .harmos.storage.v1.StagedFile file = 1;
  .harmos.model.v1.ReadCut at = 90;
}

// UploadsGetResponse for Uploads.Get.
message UploadsGetResponse {
  .harmos.storage.v1.FileProgress production = 1;
  uint64 writer_generation = 2;
  uint64 accepted_length = 3;
  uint64 durable_length = 4;
  uint64 chunk_bytes = 5;
  uint64 message_bytes = 6;
  .harmos.model.v1.ReadCut resolved_at = 90;
}

// === Resume === //

// UploadsResumeRequest for Uploads.Resume.
message UploadsResumeRequest {
  .harmos.storage.v1.FileSession session = 1;
  string request_id = 2;
}

// UploadsResumeResponse for Uploads.Resume.
message UploadsResumeResponse {
  .harmos.storage.v1.FileProducer production = 1;
  .harmos.model.v1.Receipt receipt = 2;
  uint64 chunk_bytes = 3;
  uint64 message_bytes = 4;
}

// === Append === //

// UploadsAppendRequest for Uploads.Append.
message UploadsAppendRequest {
  .harmos.storage.v1.FileSession session = 1;
  uint64 offset = 2;
  bytes data = 3;
  string request_id = 4;
}

// UploadsAppendResponse for Uploads.Append.
message UploadsAppendResponse {
  .harmos.storage.v1.FileProducer production = 1;
  .harmos.model.v1.Receipt receipt = 2;
}

// === Publish === //

// UploadsPublishRequest for Uploads.Publish.
message UploadsPublishRequest {
  .harmos.storage.v1.FileSession session = 1;
  uint64 length = 2;
  bytes sha256 = 3;
  string request_id = 4;
}

// UploadsPublishResponse for Uploads.Publish.
message UploadsPublishResponse {
  .harmos.model.v1.FileReference file = 1;
  .harmos.model.v1.Receipt receipt = 2;
}

// === Delete === //

// UploadsDeleteRequest for Uploads.Delete.
message UploadsDeleteRequest {
  .harmos.storage.v1.FileSession session = 1;
  string request_id = 2;
}

// UploadsDeleteResponse for Uploads.Delete.
message UploadsDeleteResponse {
  .harmos.storage.v1.FileProgress production = 1;
  .harmos.model.v1.Receipt receipt = 2;
}

// === Resources === //

// === Enums === //
