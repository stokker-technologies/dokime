// Captures Contracts

syntax = "proto3";

package dokime.host.v1.files;

// === Imports === //

import "dokime/v1/files.proto";
import "dokime/v1/scalar.proto";
import "harmos/model/v1/callers.proto";

// === Options === //

option csharp_namespace = "Dokime.Protocol.Host.V1.FilesResources";

// === Services === //

// Host operations with explicit caller admission.
service Captures {
  // Start the Captures resource; admission and policy are owned by the executor.
  rpc Start(.dokime.host.v1.files.CapturesStartRequest) returns (.dokime.host.v1.files.CapturesStartResponse) {
    option (harmos.model.v1.callers) = PLUGINS;
  }
  // Stop the Captures resource; admission and policy are owned by the executor.
  rpc Stop(.dokime.host.v1.files.CapturesStopRequest) returns (.dokime.host.v1.files.CapturesStopResponse) {
    option (harmos.model.v1.callers) = PLUGINS;
  }
}

// === Start === //

// CapturesStartRequest for Captures.Start.
message CapturesStartRequest { .dokime.v1.FileSource source = 1; string output = 2; .dokime.host.v1.files.CaptureMode mode = 3; }

// CapturesStartResponse for Captures.Start.
message CapturesStartResponse { uint64 capture_id = 1; }

// === Stop === //

// CapturesStopRequest for Captures.Stop.
message CapturesStopRequest { uint64 capture_id = 1; }

// CapturesStopResponse for Captures.Stop.
message CapturesStopResponse { repeated .dokime.v1.CapturedArtifact artifacts = 1; repeated .dokime.v1.CaptureGap gaps = 2; }

// === Resources === //

// CaptureMode value owned by this resource.
message CaptureMode { oneof kind { .dokime.host.v1.files.StreamCapture stream = 1; .dokime.host.v1.files.MirrorCapture mirror = 2; } }

// StreamCapture value owned by this resource.
message StreamCapture { repeated .dokime.host.v1.files.LineMatcher matchers = 1; repeated .dokime.host.v1.files.LineMarker markers = 2; }

// MirrorCapture value owned by this resource.
message MirrorCapture { optional uint32 interval_s = 1; }

// LineMatcher value owned by this resource.
message LineMatcher { string pattern = 1; string stream = 2; repeated .dokime.host.v1.files.LineField fields = 3; }

// LineField value owned by this resource.
message LineField { string name = 1; .dokime.v1.ValueType type = 2; }

// LineMarker value owned by this resource.
message LineMarker { string pattern = 1; string record_type = 2; }

// === Enums === //
