// Evidence Contracts

syntax = "proto3";

package dokime.host.v1;

// === Imports === //

import "dokime/model/v1/scalar.proto";
import "harmos/model/v1/callers.proto";
import "harmos/model/v1/file.proto";
import "harmos/model/v1/position.proto";

// === Options === //

option csharp_namespace = "Dokime.Protocol.Host.V1";

// === Services === //

// Host operations with explicit caller admission.
service Evidence {
  // Statistics the Evidence resource; plugin selectors default to and are restricted to trusted caller identity.
  rpc Statistics(.dokime.host.v1.EvidenceStatisticsRequest) returns (.dokime.host.v1.EvidenceStatisticsResponse) {
    option (harmos.model.v1.callers) = ALL;
  }
  // Archive the Evidence resource; admission and policy are owned by the executor.
  rpc Archive(.dokime.host.v1.EvidenceArchiveRequest) returns (.dokime.host.v1.EvidenceArchiveResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
}

// === Statistics === //

// EvidenceStatisticsRequest for Evidence.Statistics.
message EvidenceStatisticsRequest {
  string execution = 1;
  string stream = 2;
  
  string field = 3;
  
  string step = 4;
  .harmos.model.v1.Position at = 5;
}

// EvidenceStatisticsResponse for Evidence.Statistics.
message EvidenceStatisticsResponse {
  uint64 count = 1;
  double min = 2;
  double max = 3;
  double mean = 4;
  double stddev = 5;
  double median = 6;
  double p05 = 7;
  double p95 = 8;
  double p99 = 9;
  double first = 10;
  double last = 11;
  .harmos.model.v1.Position resolved_at = 12;
}

// === Archive === //

// EvidenceArchiveRequest for Evidence.Archive.
message EvidenceArchiveRequest { .dokime.host.v1.EvidenceSubject subject = 1; .harmos.model.v1.ReadCut at = 90; }

// EvidenceArchiveResponse for Evidence.Archive.
message EvidenceArchiveResponse { .harmos.model.v1.FileReference file = 1; .harmos.model.v1.ReadCut resolved_at = 90; }

// === Resources === //

// Statistics value owned by this resource.
message Statistics {
  uint64 count = 1;
  double min = 2;
  double max = 3;
  double mean = 4;
  double stddev = 5;
  double median = 6;
  double p05 = 7;
  double p95 = 8;
  double p99 = 9;
  double first = 10;
  double last = 11;
}

// EvidenceSubject value owned by this resource.
message EvidenceSubject {
  oneof kind {
    string execution = 1;
    string cycle = 2;
  }
}

// Output value owned by this resource.
message Output {
  oneof kind {
    .dokime.model.v1.Null log = 1;
    string artifact = 2;
  }
}

// === Enums === //
