// Executions Contracts

syntax = "proto3";

package dokime.host.v1;

// === Imports === //

import "dokime/host/v1/cycles.proto";
import "dokime/host/v1/record_schemas.proto";
import "dokime/model/v1/evidence.proto";
import "dokime/model/v1/execution.proto";
import "dokime/model/v1/metadata.proto";
import "dokime/model/v1/scalar.proto";
import "google/protobuf/timestamp.proto";
import "harmos/model/v1/callers.proto";
import "harmos/model/v1/failure.proto";
import "harmos/model/v1/page.proto";
import "harmos/model/v1/position.proto";
import "harmos/model/v1/receipt.proto";

// === Options === //

option csharp_namespace = "Dokime.Clients";

// Reads select the latest durable boundary without flushing accepted writes.
// Issued cuts, pages and watches retain their selection; missing cuts and gaps refuse.
// Mutation request identities replay the original receipt for the same normalized input.

// === Services === //

// Owns the Executions resource on the host; callers are checked before handler admission.
service Executions {
  // Read the Executions resource; admission and policy are owned by the executor.
  rpc Get(.dokime.host.v1.ExecutionsGetRequest) returns (.dokime.host.v1.ExecutionsGetResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
  // Replace the complete writable value of the Executions resource; admission and policy are owned by the executor.
  rpc Set(.dokime.host.v1.ExecutionsSetRequest) returns (.dokime.host.v1.ExecutionsSetResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
  // List the Executions resource; admission and policy are owned by the executor.
  rpc List(.dokime.host.v1.ExecutionsListRequest) returns (.dokime.host.v1.ExecutionsListResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
  // Observe durable changes to the Executions resource; admission and policy are owned by the executor.
  rpc Watch(.dokime.host.v1.ExecutionsWatchRequest) returns (stream .dokime.host.v1.ExecutionsWatchResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
  // Create the Executions resource; admission and policy are owned by the executor.
  rpc Create(.dokime.host.v1.ExecutionsCreateRequest) returns (.dokime.host.v1.ExecutionsCreateResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
  // Start the Executions resource; admission and policy are owned by the executor.
  rpc Start(.dokime.host.v1.ExecutionsStartRequest) returns (.dokime.host.v1.ExecutionsStartResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
  // Stop the Executions resource; admission and policy are owned by the executor.
  rpc Stop(.dokime.host.v1.ExecutionsStopRequest) returns (.dokime.host.v1.ExecutionsStopResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
  // Cancel the Executions resource; admission and policy are owned by the executor.
  rpc Cancel(.dokime.host.v1.ExecutionsCancelRequest) returns (.dokime.host.v1.ExecutionsCancelResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
  // Delete the Executions resource; admission and policy are owned by the executor.
  rpc Delete(.dokime.host.v1.ExecutionsDeleteRequest) returns (.dokime.host.v1.ExecutionsDeleteResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
  // Read resolved parameters for the Executions resource; admission and policy are owned by the executor.
  rpc Parameters(.dokime.host.v1.ExecutionsParametersRequest) returns (.dokime.host.v1.ExecutionsParametersResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
  // Read frozen steps for the Executions resource; admission and policy are owned by the executor.
  rpc Steps(.dokime.host.v1.ExecutionsStepsRequest) returns (.dokime.host.v1.ExecutionsStepsResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
}

// === Get === //

// ExecutionsGetRequest for Executions.Get.
message ExecutionsGetRequest {
  string name = 1;
  optional .harmos.model.v1.Position at = 90;
}

// ExecutionsGetResponse for Executions.Get.
message ExecutionsGetResponse {
  .dokime.host.v1.ExecutionWritable value = 1;
  bytes revision = 2;
  .dokime.host.v1.ExecutionDetail execution = 3;
  .dokime.model.v1.ExecutionProgressValue progress = 4;
  .harmos.model.v1.Position resolved_at = 90;
}

// === Set === //

// ExecutionsSetRequest for Executions.Set.
message ExecutionsSetRequest {
  string name = 1;
  .dokime.host.v1.ExecutionWritable value = 20;
  bytes expected_revision = 21;
  string request_id = 22;
}

// ExecutionsSetResponse for Executions.Set.
message ExecutionsSetResponse {
  .dokime.host.v1.ExecutionWritable value = 1;
  bytes revision = 2;
  .harmos.model.v1.Receipt receipt = 3;
}

// === List === //

// ExecutionsListRequest for Executions.List.
message ExecutionsListRequest {
  string parent = 1;
  .dokime.host.v1.ExecutionSelection selection = 2;
  .dokime.host.v1.ExecutionFilter filter = 3;
  .dokime.host.v1.ExecutionOrder order = 4;
  optional .harmos.model.v1.ReadCut at = 90;
  optional .harmos.model.v1.PageRequest page = 91;
}

// ExecutionsListResponse for Executions.List.
message ExecutionsListResponse {
  repeated .dokime.host.v1.ExecutionDetail executions = 1;
  .dokime.host.v1.ExecutionOutcomeCounts outcome_counts = 2;
  .harmos.model.v1.ReadCut resolved_at = 90;
  string next_page_token = 91;
}

// === Watch === //

// ExecutionsWatchRequest for Executions.Watch.
message ExecutionsWatchRequest {
  string parent = 1;
  .dokime.host.v1.ExecutionSelection selection = 2;
  .dokime.host.v1.ExecutionFilter filter = 3;
  .dokime.host.v1.ExecutionOrder order = 4;
  optional .harmos.model.v1.ReadCut at = 90;
  optional .harmos.model.v1.PageRequest page = 91;
}

// ExecutionsWatchResponse for Executions.Watch.
message ExecutionsWatchResponse {
  repeated .dokime.host.v1.ExecutionDetail executions = 1;
  .dokime.host.v1.ExecutionOutcomeCounts outcome_counts = 2;
  .harmos.model.v1.ReadCut resolved_at = 90;
  bool opening = 91;
  .harmos.model.v1.Failure resync_required = 92;
}

// === Create === //

// ExecutionsCreateRequest for Executions.Create.
message ExecutionsCreateRequest {
  string parent = 1;
  repeated .dokime.host.v1.ExecutionBinding executions = 2;
  string request_id = 3;
}

// ExecutionsCreateResponse for Executions.Create.
message ExecutionsCreateResponse {
  repeated .dokime.host.v1.ExecutionDetail executions = 1;
  .harmos.model.v1.Receipt receipt = 2;
}

// === Start === //

// ExecutionsStartRequest for Executions.Start.
message ExecutionsStartRequest {
  string name = 1;
  string request_id = 2;
  .dokime.host.v1.ExecutionMode mode = 3;
}

// ExecutionsStartResponse for Executions.Start.
message ExecutionsStartResponse {
  .dokime.host.v1.ExecutionDetail execution = 1;
  .harmos.model.v1.Receipt receipt = 2;
}

// === Stop === //

// ExecutionsStopRequest for Executions.Stop.
message ExecutionsStopRequest {
  string name = 1;
  string request_id = 2;
}

// ExecutionsStopResponse for Executions.Stop.
message ExecutionsStopResponse {
  .dokime.host.v1.ExecutionDetail execution = 1;
  .harmos.model.v1.Receipt receipt = 2;
}

// === Cancel === //

// ExecutionsCancelRequest for Executions.Cancel.
message ExecutionsCancelRequest {
  string name = 1;
  string request_id = 2;
}

// ExecutionsCancelResponse for Executions.Cancel.
message ExecutionsCancelResponse {
  .dokime.host.v1.ExecutionDetail execution = 1;
  .harmos.model.v1.Receipt receipt = 2;
}

// === Delete === //

// ExecutionsDeleteRequest for Executions.Delete.
message ExecutionsDeleteRequest {
  string name = 1;
  string request_id = 2;
}

// ExecutionsDeleteResponse for Executions.Delete.
message ExecutionsDeleteResponse {
  .dokime.host.v1.ExecutionDetail execution = 1;
  .harmos.model.v1.Receipt receipt = 2;
}

// === Parameters === //

// ExecutionsParametersRequest for Executions.Parameters.
message ExecutionsParametersRequest {
  string name = 1;
  .dokime.host.v1.ExecutionParameterSet set = 2;
  optional .harmos.model.v1.Position at = 90;
}

// ExecutionsParametersResponse for Executions.Parameters.
message ExecutionsParametersResponse {
  repeated .dokime.host.v1.MaterializedParameter parameters = 1;
  .harmos.model.v1.Position resolved_at = 90;
}

// === Steps === //

// ExecutionsStepsRequest for Executions.Steps.
message ExecutionsStepsRequest {
  string name = 1;
  optional .harmos.model.v1.Position at = 90;
}

// ExecutionsStepsResponse for Executions.Steps.
message ExecutionsStepsResponse {
  repeated .dokime.host.v1.ExecutionStep steps = 1;
  .harmos.model.v1.Position resolved_at = 90;
}

// === Resources === //

// FrozenSchemas value owned by this resource.
message FrozenSchemas {
  bytes digest = 3;
  repeated .dokime.host.v1.RecordSchema records = 1;
  repeated .dokime.host.v1.TelemetrySchema streams = 2;
}

// Diagnostic value owned by this resource.
message Diagnostic {
  string message = 1;
  repeated string chain = 2;
  string location = 3;
  repeated string span_trace = 4;
  string backtrace = 5;
}

// ExecutionBinding value owned by this resource.
message ExecutionBinding {
  string execution_id = 1;
  string case_id = 2;
}

// ExecutionControls value owned by this resource.
message ExecutionControls {
  optional string request_id = 1;
  bool paused = 2;
  bool stop_requested = 3;
  bool can_pause = 4;
  bool can_resume = 5;
  bool can_stop = 6;
  .dokime.host.v1.ExecutionMode mode = 7;
  bool can_start = 8;
  bool can_rerun = 9;
  bool can_cancel = 10;
  bool can_inspect = 11;
  bool can_export = 12;
}

// ExecutionOutcomeCounts value owned by this resource.
message ExecutionOutcomeCounts {
  uint64 evaluated_count = 1;
  uint64 not_evaluated_count = 2;
  uint64 declared_count = 3;
  optional .dokime.host.v1.ResultStatus result_status = 4;
}

// ExecutionDetail value owned by this resource.
message ExecutionDetail {
  .dokime.model.v1.ExecutionProgressValue progress = 20;
  .harmos.model.v1.Position resolved_at = 21;

  .dokime.host.v1.ExecutionOutcomeCounts cycle_counts = 19;

  bytes seal = 18;
  .dokime.host.v1.ReportStatus report = 1;
  .dokime.host.v1.ExecutionSummary summary = 2;
  string cycle_id = 3;
  .dokime.model.v1.EvidenceScope scope = 4;
  .dokime.model.v1.Metadata admitted_suite = 5;
  .dokime.model.v1.Metadata admitted_template = 6;
  .google.protobuf.Timestamp started_at = 7;
  .google.protobuf.Timestamp finished_at = 8;
  uint64 input_parameter_count = 9;
  uint64 output_parameter_count = 10;
  uint64 step_count = 11;
  .dokime.host.v1.ExecutionControls controls = 13;
  .dokime.model.v1.Origin origin = 14;
  .dokime.host.v1.ExecutionOutcome outcome = 15;
  .dokime.host.v1.FrozenSchemas schemas = 16;
  optional .dokime.host.v1.LiveExecutionState live_state = 17;
}

// ExecutionFilter value owned by this resource.
message ExecutionFilter {
  string text = 1;
  repeated .dokime.host.v1.ExecutionState statuses = 2;
  repeated string template_ids = 3;
  repeated string cycle_ids = 4;
  .google.protobuf.Timestamp started_after = 5;
  .google.protobuf.Timestamp started_before = 6;
  optional .dokime.host.v1.ArchiveScope archive = 7;
}

// ExecutionOrder value owned by this resource.
message ExecutionOrder {
  .dokime.host.v1.ExecutionOrderKey key = 1;
  bool descending = 2;
}

// ExecutionSelection value owned by this resource.
message ExecutionSelection {
  repeated string template_ids = 1;
  repeated string cycle_ids = 2;
  repeated .dokime.host.v1.ExecutionState statuses = 3;
  .dokime.model.v1.Window started_at = 4;
  optional .dokime.host.v1.ArchiveScope archive = 5;
}

// ExecutionStep value owned by this resource.
message ExecutionStep {
  string step_id = 1;
  .dokime.model.v1.Metadata metadata = 2;
  .dokime.host.v1.StepStatus status = 3;
  .google.protobuf.Timestamp started_at = 4;
  .google.protobuf.Timestamp finished_at = 5;
  uint64 measurement_count = 6;
  uint64 criterion_count = 7;
  uint64 ordinal = 8;
  .dokime.host.v1.Diagnostic detail = 9;
  repeated .dokime.host.v1.StepCriterion criteria = 10;
}

// ExecutionSummary value owned by this resource.
message ExecutionSummary {
  .dokime.host.v1.ExecutionControls controls = 7;
  string execution_id = 1;
  string case_id = 2;
  uint64 ordinal = 3;
  bool archived = 4;
  .dokime.host.v1.ExecutionState state = 5;
  .dokime.host.v1.ExecutionOutcome outcome = 6;
}

// MaterializedParameter value owned by this resource.
message MaterializedParameter {
  string name = 1;
  .dokime.model.v1.Metadata metadata = 2;
  optional string group_id = 3;
  .dokime.host.v1.ParameterSource source = 4;
  .dokime.model.v1.Value value = 5;
  .dokime.host.v1.MeasurementUnit unit = 6;
}

// ReportStatus value owned by this resource.
message ReportStatus {
  .dokime.host.v1.ReportState state = 1;
  optional string failure = 2;
}

// StepCriterion value owned by this resource.
message StepCriterion {
  string criterion_id = 1;
  .dokime.model.v1.Metadata metadata = 2;
  .dokime.host.v1.CriterionStatus status = 3;
  .dokime.model.v1.Value observed = 4;
  optional string message = 5;
  uint64 ordinal = 6;
}

// ExecutionWritable value owned by this resource.
message ExecutionWritable {
  string label = 1;
  bool paused = 2;
  bool archived = 3;
}

// ExecutionOutcome value owned by this resource.
message ExecutionOutcome {
  oneof attribution {
    .dokime.host.v1.UnevaluatedOutcome not_evaluated = 1;
    .dokime.host.v1.EvaluatedOutcome evaluated = 2;
    .dokime.host.v1.DeclaredOutcome declared = 3;
  }
}

// UnevaluatedOutcome value owned by this resource.
message UnevaluatedOutcome {
  .dokime.model.v1.Termination termination = 1;
  string reason = 2;
}

// EvaluatedOutcome value owned by this resource.
message EvaluatedOutcome {
  .dokime.host.v1.ResultStatus status = 1;
  string reason = 2;
}

// DeclaredOutcome value owned by this resource.
message DeclaredOutcome {
  .dokime.host.v1.ResultStatus status = 1;
  string reason = 2;
  string importer = 3;
}

// === Enums === //

// LiveExecutionState choices.
enum LiveExecutionState {
  LIVE_EXECUTION_STATE_UNSPECIFIED = 0;
  LIVE_EXECUTION_STATE_QUEUED = 1;
  LIVE_EXECUTION_STATE_INITIALIZING = 2;
  LIVE_EXECUTION_STATE_STEPPING = 3;
  LIVE_EXECUTION_STATE_EVALUATING = 4;
  LIVE_EXECUTION_STATE_CLEANING_UP = 5;
  LIVE_EXECUTION_STATE_FINISHED = 6;
  LIVE_EXECUTION_STATE_CANCELLED = 7;
  LIVE_EXECUTION_STATE_INTERRUPTED = 8;
}

// CriterionStatus choices.
enum CriterionStatus {
  CRITERION_STATUS_UNSPECIFIED = 0;
  CRITERION_STATUS_PENDING = 1;
  CRITERION_STATUS_PASSED = 2;
  CRITERION_STATUS_FAILED = 3;
  CRITERION_STATUS_INDETERMINATE = 4;
  CRITERION_STATUS_SKIPPED = 5;
}

// ExecutionMode choices.
enum ExecutionMode {
  EXECUTION_MODE_UNSPECIFIED = 0;
  EXECUTION_MODE_AUTOMATIC = 1;
  EXECUTION_MODE_INTERACTIVE = 2;
}

// ExecutionOrderKey choices.
enum ExecutionOrderKey {
  EXECUTION_ORDER_KEY_UNSPECIFIED = 0;
  EXECUTION_ORDER_KEY_STARTED_AT = 1;
  EXECUTION_ORDER_KEY_FINISHED_AT = 2;
  EXECUTION_ORDER_KEY_TITLE = 3;
}

// ExecutionParameterSet choices.
enum ExecutionParameterSet {
  EXECUTION_PARAMETER_SET_UNSPECIFIED = 0;
  EXECUTION_PARAMETER_SET_INPUTS = 1;
  EXECUTION_PARAMETER_SET_OUTPUTS = 2;
}

// ParameterSource choices.
enum ParameterSource {
  PARAMETER_SOURCE_UNSPECIFIED = 0;
  PARAMETER_SOURCE_DEFINITION = 1;
  PARAMETER_SOURCE_TRACEABILITY = 2;
  PARAMETER_SOURCE_ENVIRONMENT = 3;
  PARAMETER_SOURCE_RESOURCE = 4;
  PARAMETER_SOURCE_OPERATOR = 5;
  PARAMETER_SOURCE_RUNTIME = 6;
  PARAMETER_SOURCE_TELEMETRY = 7;
  PARAMETER_SOURCE_RECORD = 8;
  PARAMETER_SOURCE_OUTPUT = 9;
}

// ReportState choices.
enum ReportState {
  REPORT_STATE_UNSPECIFIED = 0;
  REPORT_STATE_PENDING = 1;
  REPORT_STATE_READY = 2;
  REPORT_STATE_FAILED = 3;
}

// StepStatus choices.
enum StepStatus {
  STEP_STATUS_UNSPECIFIED = 0;
  STEP_STATUS_PENDING = 1;
  STEP_STATUS_RUNNING = 2;
  STEP_STATUS_PASSED = 3;
  STEP_STATUS_FAILED = 4;
  STEP_STATUS_SKIPPED = 5;
  STEP_STATUS_CANCELLED = 6;
}

// ExecutionState choices.
enum ExecutionState {
  EXECUTION_STATE_UNSPECIFIED = 0;
  EXECUTION_STATE_OPEN = 1;
  EXECUTION_STATE_CLOSED = 2;
  EXECUTION_STATE_SEALED = 3;
}
