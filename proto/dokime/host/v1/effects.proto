// Effects Contracts

syntax = "proto3";

package dokime.host.v1;

// === Imports === //

import "google/protobuf/timestamp.proto";
import "harmos/model/v1/callers.proto";
import "harmos/model/v1/position.proto";
import "harmos/model/v1/receipt.proto";

// === Options === //

option csharp_namespace = "Dokime.Clients";

// Reads select the latest durable boundary without flushing accepted writes.
// Issued cuts, pages and watches retain their selection; missing cuts and gaps refuse.
// Mutation request identities replay the original receipt for the same normalized input.

// === Services === //

// Owns the Effects resource on the host; callers are checked before handler admission.
service Effects {
  // Create the Effects resource; admission and policy are owned by the executor.
  rpc Create(.dokime.host.v1.EffectsCreateRequest) returns (.dokime.host.v1.EffectsCreateResponse) {
    option (harmos.model.v1.callers) = PLUGINS;
  }
  // Read the Effects resource; admission and policy are owned by the executor.
  rpc Get(.dokime.host.v1.EffectsGetRequest) returns (.dokime.host.v1.EffectsGetResponse) {
    option (harmos.model.v1.callers) = PLUGINS;
  }
  // Replace the complete writable value of the Effects resource; admission and policy are owned by the executor.
  rpc Set(.dokime.host.v1.EffectsSetRequest) returns (.dokime.host.v1.EffectsSetResponse) {
    option (harmos.model.v1.callers) = PLUGINS;
  }
}

// === Create === //

// EffectsCreateRequest for Effects.Create.
message EffectsCreateRequest {
  string resource = 1;
  string inverse_operation = 2;
  bytes inverse = 3;
  string description = 4;
  string request_id = 5;
}

// EffectsCreateResponse for Effects.Create.
message EffectsCreateResponse {
  string name = 1;
  .dokime.host.v1.EffectWritable value = 2;
  bytes revision = 3;
  .harmos.model.v1.Receipt receipt = 4;
}

// === Get === //

// EffectsGetRequest for Effects.Get.
message EffectsGetRequest {
  string name = 1;
  optional .harmos.model.v1.Position at = 2;
}

// EffectsGetResponse for Effects.Get.
message EffectsGetResponse {
  .dokime.host.v1.EffectWritable value = 1;
  bytes revision = 2;
  .harmos.model.v1.Position resolved_at = 3;
}

// === Set === //

// EffectsSetRequest for Effects.Set.
message EffectsSetRequest {
  string name = 1;
  .dokime.host.v1.EffectWritable value = 2;
  bytes expected_revision = 3;
  string request_id = 4;
}

// EffectsSetResponse for Effects.Set.
message EffectsSetResponse {
  .dokime.host.v1.EffectWritable value = 1;
  bytes revision = 2;
  .harmos.model.v1.Receipt receipt = 3;
}

// === Resources === //

// EffectWritable value owned by this resource.
message EffectWritable {
  .google.protobuf.Timestamp applied_at = 1;
  bool restored = 2;
}

// === Enums === //
