// Files Contracts

syntax = "proto3";

package dokime.host.v1;

// === Imports === //

import "dokime/model/v1/files.proto";
import "harmos/model/v1/callers.proto";
import "harmos/model/v1/file.proto";
import "harmos/model/v1/position.proto";
import "harmos/model/v1/receipt.proto";

// === Options === //

option csharp_namespace = "Dokime.Protocol.Host.V1";

// === Services === //

// Host operations with explicit caller admission.
service Files {
  // Get the Files resource; plugin selectors default to and are restricted to trusted caller identity.
  rpc Get(.dokime.host.v1.FilesGetRequest) returns (.dokime.host.v1.FilesGetResponse) {
    option (harmos.model.v1.callers) = ALL;
  }
  // Read the Files resource; plugin selectors default to and are restricted to trusted caller identity.
  rpc Read(.dokime.host.v1.FilesReadRequest) returns (.dokime.host.v1.FilesReadResponse) {
    option (harmos.model.v1.callers) = ALL;
  }
  // Watch the Files resource; plugin selectors default to and are restricted to trusted caller identity.
  rpc Watch(.dokime.host.v1.FilesWatchRequest) returns (stream .dokime.host.v1.FilesWatchResponse) {
    option (harmos.model.v1.callers) = ALL;
  }
  // Delete the Files resource; plugin selectors default to and are restricted to trusted caller identity.
  rpc Delete(.dokime.host.v1.FilesDeleteRequest) returns (.dokime.host.v1.FilesDeleteResponse) {
    option (harmos.model.v1.callers) = ALL;
  }
}

// === Get === //

// FilesGetRequest for Files.Get.
message FilesGetRequest {
  .harmos.model.v1.FileReference file = 1;
  .harmos.model.v1.ReadCut at = 90;
}

// FilesGetResponse for Files.Get.
message FilesGetResponse {
  .harmos.model.v1.FileReference file = 1;
  uint64 chunk_bytes = 2;
  uint64 message_bytes = 3;
  .harmos.model.v1.ReadCut resolved_at = 90;
}

// === Read === //

// FilesReadRequest for Files.Read.
message FilesReadRequest {
  .harmos.model.v1.FileReference file = 1;
  uint64 offset = 2;
  uint64 max_bytes = 3;
  .harmos.model.v1.ReadCut at = 90;
}

// FilesReadResponse for Files.Read.
message FilesReadResponse {
  bytes data = 1;
  uint64 total_length = 2;
  bytes sha256 = 3;
  .harmos.model.v1.ReadCut resolved_at = 90;
}

// === Watch === //

// FilesWatchRequest for Files.Watch.
message FilesWatchRequest {
  .harmos.model.v1.FileReference file = 1;
  uint64 offset = 2;
  .harmos.model.v1.ReadCut at = 90;
}

// FilesWatchResponse for Files.Watch.
message FilesWatchResponse {
  .harmos.storage.v1.FileBatch data = 1;
  .harmos.storage.v1.FileCompletion completion = 2;
  .harmos.model.v1.ReadCut resolved_at = 90;
}

// === Delete === //

// FilesDeleteRequest for Files.Delete.
message FilesDeleteRequest {
  .harmos.model.v1.FileReference file = 1;
  string request_id = 2;
}

// FilesDeleteResponse for Files.Delete.
message FilesDeleteResponse {
  .harmos.model.v1.Receipt receipt = 1;
}

// === Resources === //

// FilesCaptureRequest value owned by this resource.
message FilesCaptureRequest {
  .dokime.model.v1.FileSource source = 1;
  string output = 2;
}

// FilesCaptureResponse value owned by this resource.
message FilesCaptureResponse {
  repeated .dokime.model.v1.CapturedArtifact artifacts = 1;
  repeated .dokime.model.v1.CaptureGap gaps = 2;
}

// === Enums === //
