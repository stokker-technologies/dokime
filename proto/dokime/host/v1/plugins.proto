// Product Plugin Management Contracts

syntax = "proto3";

package dokime.host.v1;

// === Imports === //

import "google/protobuf/timestamp.proto";
import "harmos/model/v1/callers.proto";
import "harmos/model/v1/description.proto";
import "harmos/model/v1/failure.proto";
import "harmos/model/v1/file.proto";
import "harmos/model/v1/position.proto";
import "harmos/model/v1/receipt.proto";

// === Options === //

option csharp_namespace = "Dokime.Clients";

// === Services === //

// Owns product plugin registry and activation policy; library facilities do not provide administration routes.
service Plugins {
  // Get the product plugin registry entry; product policy owns admission and durability.
  rpc Get(.dokime.host.v1.PluginsGetRequest) returns (.dokime.host.v1.PluginsGetResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
  // List the product plugin registry entry; product policy owns admission and durability.
  rpc List(.dokime.host.v1.PluginsListRequest) returns (.dokime.host.v1.PluginsListResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
  // Watch the product plugin registry entry; product policy owns admission and durability.
  rpc Watch(.dokime.host.v1.PluginsWatchRequest) returns (stream .dokime.host.v1.PluginsWatchResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
  // Create the product plugin registry entry; product policy owns admission and durability.
  rpc Create(.dokime.host.v1.PluginsCreateRequest) returns (.dokime.host.v1.PluginsCreateResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
  // Set the product plugin registry entry; product policy owns admission and durability.
  rpc Set(.dokime.host.v1.PluginsSetRequest) returns (.dokime.host.v1.PluginsSetResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
  // Delete the product plugin registry entry; product policy owns admission and durability.
  rpc Delete(.dokime.host.v1.PluginsDeleteRequest) returns (.dokime.host.v1.PluginsDeleteResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
  // Restart the product plugin registry entry; product policy owns admission and durability.
  rpc Restart(.dokime.host.v1.PluginsRestartRequest) returns (.dokime.host.v1.PluginsRestartResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
  // Replace the product plugin registry entry; product policy owns admission and durability.
  rpc Replace(.dokime.host.v1.PluginsReplaceRequest) returns (.dokime.host.v1.PluginsReplaceResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
}

// === Requests and Responses === //

// Carries the resource name and read boundary for Plugins.Get.
message PluginsGetRequest {
  // Persisted management entry identity, distinct from an advertised plugin/declarations ID.
  string name = 1;
  // Unset selects the latest product registry snapshot; otherwise use an issued retained manager cut. Foreign, expired and unissued cuts refuse.
  optional harmos.model.v1.ReadCut at = 2;
}

// Returns one entry from the selected retained product registry snapshot with its cut.
message PluginsGetResponse {
  PluginEntry entry = 1;
  // Issued boundary actually selected for this response; retain and resend it unchanged to continue the same read.
  harmos.model.v1.ReadCut resolved_at = 2;
}

// Carries the read boundary for Plugins.List.
message PluginsListRequest {
  // Unset selects the latest product registry snapshot; otherwise use an issued retained manager cut. Foreign, expired and unissued cuts refuse.
  optional harmos.model.v1.ReadCut at = 1;
}

// Returns the complete selected product registry inventory with its cut.
message PluginsListResponse {
  repeated PluginEntry entries = 1;
  // Issued boundary actually selected for this response; retain and resend it unchanged to continue the same read.
  harmos.model.v1.ReadCut resolved_at = 2;
}

// Carries the resource name and read boundary for Plugins.Watch.
message PluginsWatchRequest {
  // Empty watches all entries; otherwise selects this exact management entry name.
  optional string name = 1;
  // Unset selects the latest product registry snapshot; otherwise use an issued retained manager cut. Foreign, expired and unissued cuts refuse.
  optional harmos.model.v1.ReadCut at = 2;
}

// Distinguishes an opening snapshot, entry changes and a requirement to restart the read.
message PluginsWatchResponse {
  // Issued boundary actually selected for this response; retain and resend it unchanged to continue the same read.
  harmos.model.v1.ReadCut resolved_at = 1;
  // Selects one variant; an unset discriminator carries no selected value.
  oneof event {
    // Required retained snapshot handle issued by this owner; preserve its token and original position.
    PluginSnapshot snapshot = 2;
    PluginChange change = 3;
    // Continuity is unavailable; open a fresh read instead of treating this event as a successful continuation.
    string resync_required = 4;
  }
}

// Carries the request id, resource name, placement and replacement value for Plugins.Create.
message PluginsCreateRequest {
  // Nonempty caller-chosen identity for Create replay. Identical input returns its original response; reuse with changed input refuses.
  string request_id = 1;
  // Persisted management entry identity, distinct from an advertised plugin/declarations ID.
  string name = 2;
  PluginPlacement placement = 3;
  PluginValue value = 4;
  // Opaque creator-chosen label; empty or absent means unspecified and replacement preserves it.
  optional string origin = 5;
  // Product SDK version a registering remote plugin was built against; the host refuses a version it cannot serve.
  optional string sdk_version = 6;
}

// Returns the created entry and persisted receipt; identical request-ID replay returns this original response.
// A remote placement whose name is already registered reuses that entry; the receipt is then absent when nothing changed.
message PluginsCreateResponse {
  PluginEntry entry = 1;
  harmos.model.v1.Receipt receipt = 2;
}

// Carries the resource name, replacement value and expected revision for Plugins.Set.
message PluginsSetRequest {
  // Persisted management entry identity, distinct from an advertised plugin/declarations ID.
  string name = 1;
  PluginValue value = 2;
  // Exact revision returned by the corresponding read. A mismatch refuses; read again before retrying with changed input.
  bytes expected_revision = 3;
}

// Returns the resulting entry and mutation receipt after applying its complete writable value.
message PluginsSetResponse {
  PluginEntry entry = 1;
  harmos.model.v1.Receipt receipt = 2;
}

// Carries the resource name and expected revision for Plugins.Delete.
message PluginsDeleteRequest {
  // Persisted management entry identity, distinct from an advertised plugin/declarations ID.
  string name = 1;
  // Exact revision returned by the corresponding read. A mismatch refuses; read again before retrying with changed input.
  bytes expected_revision = 2;
}

// Returns the durable management deletion receipt without exposing retired installation content.
message PluginsDeleteResponse {
  harmos.model.v1.Receipt receipt = 1;
}

// Carries the resource name and expected revision for Plugins.Restart.
message PluginsRestartRequest {
  // Persisted management entry identity, distinct from an advertised plugin/declarations ID.
  string name = 1;
  // Exact revision returned by the corresponding read. A mismatch refuses; read again before retrying with changed input.
  bytes expected_revision = 2;
}

// Returns the entry with its replacement activation initiated; connection readiness is observed separately.
message PluginsRestartResponse {
  PluginEntry entry = 1;
}

// Carries the existing entry name, new managed placement, expected revision and replay identity.
message PluginsReplaceRequest {
  string name = 1;
  // Required managed placement; replacement does not turn a remote entry into a managed one.
  PluginPlacement placement = 2;
  // Issued entry revision; a conflict requires getting the entry again before retrying.
  bytes expected_revision = 3;
  // Nonempty request identity; identical input replays the original outcome and changed input refuses.
  string request_id = 4;
}

// Returns the replaced entry and its persisted mutation receipt.
message PluginsReplaceResponse {
  PluginEntry entry = 1;
  harmos.model.v1.Receipt receipt = 2;
}

// === Resources === //

// Contains the writable enablement state of a managed plugin entry.
message PluginValue {
  bool enabled = 1;
}

// Captures the running plugin's advertised identity, process start, negotiated revision and declarations.
message PluginDescription {
  // Plugin-advertised identity, distinct from the persisted management entry name.
  string id = 1;
  // Plugin-advertised semantic version, distinct from the negotiated protocol revision.
  string version = 2;
  // Plugin process startup timestamp, stable across connections to that process.
  google.protobuf.Timestamp started_at = 3;
  harmos.model.v1.Declarations declarations = 4;
  // Negotiated protocol revision, not a conditional management revision.
  uint32 revision = 5;
  string sdk = 6;
  string sdk_version = 7;
}

// Connects the host to a remote plain HTTP plugin endpoint; the manager validates endpoint syntax.
message PluginRemote {
  string url = 1;
}

// Content references resolve through the product's content owner; uploading belongs to the product.
message PluginManaged {
  harmos.model.v1.FileReference content = 1;
  // Expected 32-byte digest of the uploaded executable content.
  bytes sha256 = 2;
}

// Marks a WebAssembly module registered in-process by the host. The host owns module loading and re-registration after restart.
message PluginGuest {}

// Chooses managed uploaded content, a remote process or a host-registered WebAssembly guest.
message PluginPlacement {
  // Selects one variant; an unset discriminator carries no selected value.
  oneof kind {
    PluginManaged managed = 1;
    PluginRemote remote = 2;
    PluginGuest guest = 3;
  }
}

// Reports the managed child process identity, executable digest and process start time.
message PluginProcess {
  // Native managed child process ID; absent process metadata does not imply a remote process ID.
  uint32 id = 1;
  // Digest of the managed executable selected for this process.
  bytes executable_digest = 2;
  // Managed process start timestamp, distinct from activation/reconnect identity.
  google.protobuf.Timestamp started_at = 3;
}

// Combines persisted management state with observed activation, process and failure information.
message PluginEntry {
  // Persisted management entry identity, distinct from the plugin's advertised declarations ID.
  string name = 1;
  PluginPlacement placement = 2;
  PluginValue value = 3;
  // Opaque conditional revision of the management value; resend it unchanged to Set/Delete/Restart.
  bytes revision = 4;
  PluginState state = 5;
  // Absent when the entry has no reported failure; failures retain machine classification and diagnostics.
  harmos.model.v1.Failure failure = 6;
  // Advertised description when an activation has supplied it; absent before discovery is available.
  PluginDescription description = 7;
  // Digest of the declarations observed for this entry's activation.
  bytes declarations_digest = 8;
  // Managed process metadata when available; remote placement does not supply managed process metadata.
  PluginProcess process = 9;
  // Generation of the entry's activation; old calls and handles do not follow its replacement.
  uint64 activation = 10;
  // Opaque creator-chosen label; empty means unspecified and only Delete then Create can change it.
  string origin = 11;
}

// Carries the entries selected at the opening boundary of a plugin watch.
message PluginSnapshot {
  repeated PluginEntry entries = 1;
}

// Replaces one entry or identifies an entry removed from the product registry.
message PluginChange {
  // Selects one variant; an unset discriminator carries no selected value.
  oneof kind {
    PluginEntry entry = 1;
    string deleted = 2;
  }
}

// === Enums === //

// The Persisted Entry Lifecycle, Independent of Its Placement.
enum PluginState {
  PLUGIN_STATE_UNSPECIFIED = 0;
  PLUGIN_STATE_CONNECTING = 1;
  PLUGIN_STATE_READY = 2;
  PLUGIN_STATE_UNAVAILABLE = 3;
  PLUGIN_STATE_STOPPED = 4;
  PLUGIN_STATE_STOPPING = 5;
  // A remote placement whose process is not reachable; the entry and its last description stay until an explicit Delete.
  PLUGIN_STATE_OFFLINE = 6;
}
