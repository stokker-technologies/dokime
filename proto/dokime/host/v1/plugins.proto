// Plugins Contracts

syntax = "proto3";

package dokime.host.v1;

// === Imports === //

import "google/protobuf/timestamp.proto";
import "harmos/model/v1/callers.proto";
import "harmos/plugin/v1/instance.proto";

// === Options === //

option csharp_namespace = "Dokime.Protocol.Host.V1";

// === Services === //

// Host operations with explicit caller admission.
service Plugins {
  // GetInstallation the Plugins resource; admission and policy are owned by the executor.
  rpc GetInstallation(.dokime.host.v1.PluginsGetInstallationRequest) returns (.dokime.host.v1.PluginInstallation) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
  // Install the Plugins resource; admission and policy are owned by the executor.
  rpc Install(stream .dokime.host.v1.PluginsInstallInput) returns (.dokime.host.v1.PluginInstallation) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
  // ListAdmittedPlugins the Plugins resource; admission and policy are owned by the executor.
  rpc ListAdmittedPlugins(.dokime.host.v1.PluginsListAdmittedPluginsRequest) returns (.dokime.host.v1.AdmittedPluginPage) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
  // ListInstallations the Plugins resource; admission and policy are owned by the executor.
  rpc ListInstallations(.dokime.host.v1.PluginsListInstallationsRequest) returns (.dokime.host.v1.InstallationPage) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
  // Reload the Plugins resource; admission and policy are owned by the executor.
  rpc Reload(.dokime.host.v1.PluginsReloadRequest) returns (.dokime.v1.ClientEmpty) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
  // Remove the Plugins resource; admission and policy are owned by the executor.
  rpc Remove(.dokime.host.v1.RemovePlugin) returns (.dokime.host.v1.RemovePluginResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
  // SetEnabled the Plugins resource; admission and policy are owned by the executor.
  rpc SetEnabled(.dokime.host.v1.PluginsSetEnabledRequest) returns (.dokime.host.v1.PluginInstallation) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
  // List the Plugins resource; admission and policy are owned by the executor.
  rpc List(.dokime.host.v1.ListPlugins) returns (.dokime.host.v1.PluginEntries) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
  // Add the Plugins resource; admission and policy are owned by the executor.
  rpc Add(.dokime.host.v1.AddRemotePlugin) returns (.dokime.host.v1.Plugin) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
}

// === GetInstallation === //

// PluginsGetInstallationRequest for Plugins.GetInstallation.
message PluginsGetInstallationRequest {
  string install_id = 1;
}

// PluginInstallation for Plugins.GetInstallation.
message PluginInstallation {
  string install_id = 1;
  string sha256 = 2;
  .google.protobuf.Timestamp installed_at = 3;
  .dokime.host.v1.PluginInstallationState state = 4;
  .dokime.host.v1.PluginMetadata metadata = 5;
  optional string error = 6;
  .dokime.host.v1.Plugin plugin = 7;
}

// === Install === //

// PluginsInstallInput for Plugins.Install.
message PluginsInstallInput {
  oneof value {
    .dokime.host.v1.PluginsInstallRequest request = 1;
    .dokime.host.v1.InstallPluginFrame item = 2;
  }
}

// PluginInstallation for Plugins.Install.
message PluginInstallation {
  string install_id = 1;
  string sha256 = 2;
  .google.protobuf.Timestamp installed_at = 3;
  .dokime.host.v1.PluginInstallationState state = 4;
  .dokime.host.v1.PluginMetadata metadata = 5;
  optional string error = 6;
  .dokime.host.v1.Plugin plugin = 7;
}

// === ListAdmittedPlugins === //

// PluginsListAdmittedPluginsRequest for Plugins.ListAdmittedPlugins.
message PluginsListAdmittedPluginsRequest {
  uint32 page_size = 1;
  .dokime.host.v1.AdmittedPluginCursor after = 2;
}

// AdmittedPluginPage for Plugins.ListAdmittedPlugins.
message AdmittedPluginPage {
  repeated .dokime.host.v1.AdmittedPlugin plugins = 1;
  .dokime.host.v1.AdmittedPluginCursor next = 2;
  uint64 total_count = 3;
  string epoch = 4;
  uint64 revision = 5;
}

// === ListInstallations === //

// PluginsListInstallationsRequest for Plugins.ListInstallations.
message PluginsListInstallationsRequest {
  uint32 page_size = 1;
  .dokime.host.v1.InstallationCursor after = 2;
}

// InstallationPage for Plugins.ListInstallations.
message InstallationPage {
  repeated .dokime.host.v1.PluginInstallation installations = 1;
  .dokime.host.v1.InstallationCursor next = 2;
  uint64 total_count = 3;
  string manifest_sha256 = 4;
}

// === Reload === //

// PluginsReloadRequest for Plugins.Reload.
message PluginsReloadRequest {
  optional string install_id = 1;
  optional string plugin_id = 2;
}

// === Remove === //

// RemovePlugin for Plugins.Remove.
message RemovePlugin { string entry = 1; }

// RemovePluginResponse for Plugins.Remove.
message RemovePluginResponse {}

// === SetEnabled === //

// PluginsSetEnabledRequest for Plugins.SetEnabled.
message PluginsSetEnabledRequest {
  string install_id = 1;
  bool enabled = 2;
}

// PluginInstallation for Plugins.SetEnabled.
message PluginInstallation {
  string install_id = 1;
  string sha256 = 2;
  .google.protobuf.Timestamp installed_at = 3;
  .dokime.host.v1.PluginInstallationState state = 4;
  .dokime.host.v1.PluginMetadata metadata = 5;
  optional string error = 6;
  .dokime.host.v1.Plugin plugin = 7;
}

// === List === //

// ListPlugins for Plugins.List.
message ListPlugins {}

// PluginEntries for Plugins.List.
message PluginEntries { repeated .dokime.host.v1.Plugin plugins = 1; }

// === Add === //

// AddRemotePlugin for Plugins.Add.
message AddRemotePlugin { string url = 1; }

// Plugin for Plugins.Add.
message Plugin {
  
  string entry = 1;
  oneof placement {
    .dokime.host.v1.ManagedPlugin managed = 2;
    .dokime.host.v1.RemotePlugin remote = 3;
  }
  .dokime.host.v1.PluginState state = 4;
  string reason = 5;
  
  .harmos.plugin.v1.InstanceGetResponse description = 6;
}

// === Resources === //

// ManagedPlugin value owned by this resource.
message ManagedPlugin { string bundle = 1; }

// RemotePlugin value owned by this resource.
message RemotePlugin { string url = 1; }

// AdmittedPlugin value owned by this resource.
message AdmittedPlugin {
  .dokime.host.v1.Plugin plugin = 1;
}

// AdmittedPluginCursor value owned by this resource.
message AdmittedPluginCursor {
  string epoch = 1;
  uint64 revision = 2;
  string after_plugin_id = 3;
}

// InstallPluginChunk value owned by this resource.
message InstallPluginChunk {
  uint64 offset = 1;
  bytes data = 2;
}

// InstallPluginFrame value owned by this resource.
message InstallPluginFrame {
  .dokime.host.v1.InstallPluginFrameFrame frame = 1;
}

// InstallPluginFrameFrame value owned by this resource.
message InstallPluginFrameFrame {
  oneof kind {
    .dokime.host.v1.InstallPluginHeader header = 1;
    .dokime.host.v1.InstallPluginChunk chunk = 2;
  }
}

// InstallPluginHeader value owned by this resource.
message InstallPluginHeader {
  uint64 size_bytes = 1;
  string sha256 = 2;
}

// InstallationCursor value owned by this resource.
message InstallationCursor {
  string manifest_sha256 = 1;
  string after_install_id = 2;
}

// PluginIdentity value owned by this resource.
message PluginIdentity {
  string name = 1;
  string version = 2;
  string description = 3;
}

// PluginMetadata value owned by this resource.
message PluginMetadata {
  .dokime.host.v1.PluginIdentity identity = 1;
  repeated string owners = 2;
  uint64 size_bytes = 3;
}

// PluginsInstallRequest value owned by this resource.
message PluginsInstallRequest {

}

// === Enums === //

// PluginState choices.
enum PluginState {
  PLUGIN_STATE_UNSPECIFIED = 0;
  PLUGIN_STATE_STARTING = 1;
  PLUGIN_STATE_CONNECTING = 2;
  PLUGIN_STATE_READY = 3;
  PLUGIN_STATE_UNAVAILABLE = 4;
  PLUGIN_STATE_FAILED = 5;
}

// PluginInstallationState choices.
enum PluginInstallationState {
  PLUGIN_INSTALLATION_STATE_UNSPECIFIED = 0;
  PLUGIN_INSTALLATION_STATE_INSTALLED = 1;
  PLUGIN_INSTALLATION_STATE_DISABLED = 2;
  PLUGIN_INSTALLATION_STATE_REMOVAL_PENDING = 3;
}
