// Execution Contracts

syntax = "proto3";

package dokime.model.v1;

// === Imports === //

import "dokime/model/v1/metadata.proto";
import "dokime/model/v1/scalar.proto";
import "google/protobuf/timestamp.proto";

// === Options === //

option csharp_namespace = "Dokime";

// === Services === //

// === Requests and Responses === //

// === Resources === //

// TestCase value owned by this resource.
message TestCase {
  reserved 1, 2, 3;
  reserved "template", "plugin", "digest";
  map<string, .dokime.model.v1.Value> parameters = 4;
  repeated .dokime.model.v1.Step steps = 5;
  repeated .dokime.model.v1.Criterion criteria = 6;

  repeated string streams = 7;
}

// Origin value owned by this resource.
message Origin {
  oneof kind {
    .dokime.model.v1.PluginRun plugin_run = 1;
    .dokime.model.v1.Import import = 2;
  }
}

// PluginRun value owned by this resource.
message PluginRun {
  .dokime.model.v1.TestCase test_case = 1;
  string plugin = 2;
  string template = 3;
  bytes digest = 4;

  .google.protobuf.Timestamp started_at = 5;
}

// Import value owned by this resource.
message Import {
  .dokime.model.v1.Metadata metadata = 1;
  repeated .dokime.model.v1.ImportSource sources = 2;

  string importer = 3;
  string sdk_version = 4;
  string processing = 5;
  .google.protobuf.Timestamp imported_at = 6;

  string key = 7;

  string predecessor = 8;
}

// ImportSource value owned by this resource.
message ImportSource {
  string name = 1;
  bytes sha256 = 2;

  bool attached = 3;
}

// Step value owned by this resource.
message Step {
  .dokime.model.v1.Metadata metadata = 1;

  string operation = 2;

  bool repeatable = 3;
}

// Criterion value owned by this resource.
message Criterion {
  .dokime.model.v1.Metadata metadata = 1;

  string operation = 2;
}

// ExecutionProgressValue value owned by this resource.
message ExecutionProgressValue {
  uint64 completed = 1;
  uint64 total = 2;
  string label = 3;
}

// === Enums === //

// Termination choices.
enum Termination {
  TERMINATION_UNSPECIFIED = 0;

  TERMINATION_COMPLETED = 1;

  TERMINATION_FAILED = 2;

  TERMINATION_CANCELLED = 3;

  TERMINATION_INTERRUPTED = 4;

  // The cycle was sealed before this execution started.
  TERMINATION_NOT_RUN = 5;
}
