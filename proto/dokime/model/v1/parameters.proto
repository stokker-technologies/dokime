// Parameters Contracts

syntax = "proto3";

package dokime.model.v1;

// === Imports === //

import "dokime/model/v1/metadata.proto";
import "dokime/model/v1/scalar.proto";

// === Options === //

option csharp_namespace = "Dokime";

// === Services === //

// === Requests and Responses === //

// === Resources === //

// Parameter value owned by this resource.
message Parameter {
  .dokime.model.v1.Metadata metadata = 1;
  .dokime.model.v1.ValueType type = 2;
  string unit = 3;
  bool required = 4;
  string group = 5;
  .dokime.model.v1.ParameterExpression expression = 6;
  repeated .dokime.model.v1.Value choices = 7;
  optional double min = 8;
  optional double max = 9;
  .dokime.model.v1.ParameterExpansion expansion = 10;
  .dokime.model.v1.ValueType element_type = 11;
  optional uint32 min_items = 12;
  optional uint32 max_items = 13;
  bool runtime_writable = 14;
}

// ParameterExpansion value owned by this resource.
message ParameterExpansion {
  oneof kind {
    bool single = 1;
    bool cartesian = 2;
    string zip = 3;
  }
}

// ParameterExpression value owned by this resource.
message ParameterExpression {
  oneof kind {
    .dokime.model.v1.Value literal = 1;
    .dokime.model.v1.ParameterExpressions array = 2;
    .dokime.model.v1.IntegerRange range = 3;
    .dokime.model.v1.NumberRange arange = 4;
    .dokime.model.v1.LinearSpace linspace = 5;
    string reference = 6;
    .dokime.model.v1.DynamicDefault dynamic_default = 7;
    .dokime.model.v1.ParameterUnary unary = 8;
    .dokime.model.v1.ParameterBinary binary = 9;
  }
}

// ParameterExpressions value owned by this resource.
message ParameterExpressions {
  repeated .dokime.model.v1.ParameterExpression values = 1;
}

// IntegerRange value owned by this resource.
message IntegerRange {
  sint64 start = 1;
  sint64 stop = 2;
  sint64 step = 3;
}

// NumberRange value owned by this resource.
message NumberRange {
  double start = 1;
  double stop = 2;
  double step = 3;
}

// LinearSpace value owned by this resource.
message LinearSpace {
  double start = 1;
  double stop = 2;
  uint64 count = 3;
}

// DynamicDefault value owned by this resource.
message DynamicDefault {
  .dokime.model.v1.DynamicDefaultKey key = 1;
  .dokime.model.v1.ParameterExpression fallback = 2;
}

// ParameterUnary value owned by this resource.
message ParameterUnary {
  .dokime.model.v1.ParameterUnaryOperator operator = 1;
  .dokime.model.v1.ParameterExpression value = 2;
}

// ParameterBinary value owned by this resource.
message ParameterBinary {
  .dokime.model.v1.ParameterBinaryOperator operator = 1;
  .dokime.model.v1.ParameterExpression left = 2;
  .dokime.model.v1.ParameterExpression right = 3;
}

// FileParameter value owned by this resource.
message FileParameter {
  .dokime.model.v1.Metadata metadata = 1;
  optional string default_value = 2;
  bool required = 3;
  repeated string media_types = 4;
}

// === Enums === //

// DynamicDefaultKey choices.
enum DynamicDefaultKey {
  DYNAMIC_DEFAULT_KEY_UNSPECIFIED = 0;
  DYNAMIC_DEFAULT_KEY_OPERATOR_NAME = 1;
  DYNAMIC_DEFAULT_KEY_OPERATOR_EMAIL = 2;
}

// ParameterUnaryOperator choices.
enum ParameterUnaryOperator {
  PARAMETER_UNARY_OPERATOR_UNSPECIFIED = 0;
  PARAMETER_UNARY_OPERATOR_NEGATE = 1;
}

// ParameterBinaryOperator choices.
enum ParameterBinaryOperator {
  PARAMETER_BINARY_OPERATOR_UNSPECIFIED = 0;
  PARAMETER_BINARY_OPERATOR_ADD = 1;
  PARAMETER_BINARY_OPERATOR_SUBTRACT = 2;
  PARAMETER_BINARY_OPERATOR_MULTIPLY = 3;
  PARAMETER_BINARY_OPERATOR_DIVIDE = 4;
}
