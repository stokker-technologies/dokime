// Traceability Contracts

syntax = "proto3";

package dokime.model.v1;

// === Imports === //

import "dokime/model/v1/metadata.proto";
import "dokime/model/v1/scalar.proto";

// === Options === //

option csharp_namespace = "Dokime";

// === Services === //

// === Requests and Responses === //

// === Resources === //

// TraceabilityEntry value owned by this resource.
message TraceabilityEntry {
  .dokime.model.v1.Metadata metadata = 1;
  .dokime.model.v1.Value value = 2;
  string source = 3;
  string unit = 4;
}

// === Enums === //
