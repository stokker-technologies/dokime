// Analyses Contracts

syntax = "proto3";

package dokime.model.v1;

// === Imports === //

import "dokime/model/v1/metadata.proto";
import "dokime/model/v1/parameters.proto";
import "dokime/model/v1/scalar.proto";

// === Options === //

option csharp_namespace = "Dokime.Protocol.Model.V1";

// === Services === //

// === Requests and Responses === //

// === Resources === //

// Analyses value owned by this resource.
message Analyses { repeated .dokime.model.v1.Analysis analyses = 1; }

// Analysis value owned by this resource.
message Analysis {
  .dokime.model.v1.Metadata metadata = 1;
  uint32 version = 2;
  repeated .dokime.model.v1.Parameter parameters = 3;
  repeated .dokime.model.v1.AnalysisOutput outputs = 4;
  uint32 max_samples = 5;
  uint32 max_output_values = 6;
}

// AnalysisOutput value owned by this resource.
message AnalysisOutput {
  .dokime.model.v1.Metadata metadata = 1;
  string unit = 2;
  string axis = 3;
  string axis_unit = 4;
}

// AnalysisSelection value owned by this resource.
message AnalysisSelection {
  string id = 1;
  uint32 version = 2;
  .dokime.model.v1.MapValue parameters = 3;
}

// AnalysisValues value owned by this resource.
message AnalysisValues {
  string key = 1;
  string unit = 2;
  string axis_unit = 3;
  repeated double axis = 4;
  repeated double values = 5;
  repeated uint32 display_indices = 6;
}

// === Enums === //
