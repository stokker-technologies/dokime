// Documents Contracts

syntax = "proto3";

package dokime.model.v1;

// === Imports === //

import "dokime/model/v1/expressions.proto";
import "dokime/model/v1/metadata.proto";
import "dokime/model/v1/plots.proto";
import "dokime/model/v1/scalar.proto";

// === Options === //

option csharp_namespace = "Dokime";

// === Services === //

// === Requests and Responses === //

// === Resources === //

// Document value owned by this resource.
message Document {
  .dokime.model.v1.Metadata metadata = 1;
  repeated .dokime.model.v1.Section sections = 2;
}

// Section value owned by this resource.
message Section {
  .dokime.model.v1.Metadata metadata = 1;
  repeated .dokime.model.v1.Card cards = 2;
  repeated .dokime.model.v1.Section sections = 3;
  .dokime.model.v1.SectionRepeat repeat = 4;
}

// SectionRepeat value owned by this resource.
message SectionRepeat {
  .dokime.model.v1.DataExpression value = 1;
  string label_template = 2;
  .dokime.model.v1.DataExpression order_by = 3;
}

// Card value owned by this resource.
message Card {
  .dokime.model.v1.Metadata metadata = 1;
  oneof body {
    string markdown = 2;
    .dokime.model.v1.Plot plot = 3;
    .dokime.model.v1.Table table = 4;
    .dokime.model.v1.EvidenceCard evidence = 5;
    .dokime.model.v1.Summary summary = 6;
  }
  .dokime.model.v1.CardLayout layout = 7;
  repeated .dokime.model.v1.DocumentFilter filters = 8;
}

// CardLayout value owned by this resource.
message CardLayout {
  uint32 columns = 1;
  uint32 rows = 2;
  sint32 order = 3;
}

// Table value owned by this resource.
message Table {
  repeated .dokime.model.v1.TableRow rows = 1;
}

// TableRow value owned by this resource.
message TableRow {
  map<string, .dokime.model.v1.Value> cells = 1;
}

// Summary value owned by this resource.
message Summary {
  repeated .dokime.model.v1.SummaryTile tiles = 1;
}

// SummaryTile value owned by this resource.
message SummaryTile {
  .dokime.model.v1.Metadata metadata = 1;
  .dokime.model.v1.DataExpression value = 2;
  string unit = 3;
}

// === Enums === //

// EvidenceCard choices.
enum EvidenceCard {
  EVIDENCE_CARD_UNSPECIFIED = 0;
  EVIDENCE_CARD_STEPS = 1;
  EVIDENCE_CARD_CRITERIA = 2;
  EVIDENCE_CARD_TRACEABILITY = 3;
  EVIDENCE_CARD_NOTES = 4;
  EVIDENCE_CARD_RECORDS = 5;
  EVIDENCE_CARD_ARTIFACTS = 6;
  EVIDENCE_CARD_MEDIA = 7;
  EVIDENCE_CARD_HEALTH = 8;
  EVIDENCE_CARD_STREAM_CONTEXT = 9;
}
