// Files Contracts

syntax = "proto3";

package dokime.model.v1;

// === Imports === //

// === Options === //

option csharp_namespace = "Dokime";

// === Services === //

// === Requests and Responses === //

// === Resources === //

// FileSource value owned by this resource.
message FileSource {
  oneof kind {
    .dokime.model.v1.FileLocation file = 1;
    .dokime.model.v1.FileSelection tree = 2;
    .dokime.model.v1.FileSelection newest = 3;
  }
}

// FileLocation value owned by this resource.
message FileLocation {
  oneof kind {
    string local = 1;
    .dokime.model.v1.FtpLocation ftp = 2;
  }
}

// FtpLocation value owned by this resource.
message FtpLocation {
  string url = 1;
  optional string secret_id = 2;
}

// FileSelection value owned by this resource.
message FileSelection {
  .dokime.model.v1.FileLocation root = 1;
  repeated .dokime.model.v1.FileRule rules = 2;
}

// FileRule value owned by this resource.
message FileRule {
  string glob = 1;
  .dokime.model.v1.FileRuleAction action = 2;
}

// CapturedArtifact value owned by this resource.
message CapturedArtifact {
  string artifact = 1;
  uint64 size_bytes = 2;
}

// CaptureGap value owned by this resource.
message CaptureGap {
  string path = 1;
  uint64 offset = 2;
  .dokime.model.v1.CaptureGapReason reason = 3;
}

// === Enums === //

// FileRuleAction choices.
enum FileRuleAction {
  FILE_RULE_ACTION_UNSPECIFIED = 0;
  FILE_RULE_ACTION_INCLUDE = 1;
  FILE_RULE_ACTION_EXCLUDE = 2;
}

// CaptureGapReason choices.
enum CaptureGapReason {
  CAPTURE_GAP_REASON_UNSPECIFIED = 0;
  CAPTURE_GAP_REASON_TRUNCATED = 1;
  CAPTURE_GAP_REASON_REPLACED = 2;
  CAPTURE_GAP_REASON_VANISHED = 3;
  CAPTURE_GAP_REASON_RESUME_UNSUPPORTED = 4;
}
