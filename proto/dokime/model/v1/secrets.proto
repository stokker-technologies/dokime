// Secrets Contracts

syntax = "proto3";

package dokime.model.v1;

// === Imports === //

import "dokime/model/v1/metadata.proto";

// === Options === //

option csharp_namespace = "Dokime";

// === Services === //

// === Requests and Responses === //

// === Resources === //

// SecretsDeclarations value owned by this resource.
message SecretsDeclarations {
  repeated .dokime.model.v1.SecretDeclaration secrets = 1;
}

// SecretDeclaration value owned by this resource.
message SecretDeclaration {
  .dokime.model.v1.Metadata metadata = 1;
  bool required = 2;
}

// === Enums === //
