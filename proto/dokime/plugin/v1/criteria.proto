// Criteria Contracts

syntax = "proto3";

package dokime.plugin.v1;

// === Imports === //

import "dokime/v1/execution.proto";

// === Options === //

option csharp_namespace = "Dokime.Protocol.Plugin.V1";

// === Services === //

// === Requests and Responses === //

// === Resources === //

// CriteriaEvaluateRequest value owned by this resource.
message CriteriaEvaluateRequest {
  string execution = 1;
  
  string criterion = 2;
  .dokime.v1.TestCase test_case = 3;
  .dokime.v1.Origin origin = 4;
}

// CriteriaEvaluateResponse value owned by this resource.
message CriteriaEvaluateResponse {
  bool passed = 1;
}

// === Enums === //
