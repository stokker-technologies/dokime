// Criteria Contracts

syntax = "proto3";

package dokime.plugin.v1;

// === Imports === //

import "dokime/v1/execution.proto";

// === Options === //

option csharp_namespace = "Dokime.Protocol.Plugin.V1";

// === Services === //

// Host-only plugin operations with independent Protected lifecycle bindings.
service Criteria {
  // Evaluate the Criteria resource; admission and policy are owned by the executor.
  rpc Evaluate(.dokime.plugin.v1.CriteriaEvaluateRequest) returns (.dokime.plugin.v1.CriteriaEvaluateResponse);
}

// === Evaluate === //

// CriteriaEvaluateRequest for Criteria.Evaluate.
message CriteriaEvaluateRequest {
  string execution = 1;
  
  string criterion = 2;
  .dokime.v1.TestCase test_case = 3;
  .dokime.v1.Origin origin = 4;
}

// CriteriaEvaluateResponse for Criteria.Evaluate.
message CriteriaEvaluateResponse {
  bool passed = 1;
}

// === Resources === //

// === Enums === //
