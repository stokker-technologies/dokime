// TestCases Contracts

syntax = "proto3";

package dokime.plugin.v1;

// === Imports === //

import "dokime/v1/execution.proto";
import "dokime/v1/scalar.proto";

// === Options === //

option csharp_namespace = "Dokime.Protocol.Plugin.V1";

// === Services === //

// Host-only plugin operations with independent Protected lifecycle bindings.
service TestCases {
  // Materialize the TestCases resource; admission and policy are owned by the executor.
  rpc Materialize(.dokime.plugin.v1.TestCasesMaterializeRequest) returns (.dokime.plugin.v1.TestCasesMaterializeResponse);
}

// === Materialize === //

// TestCasesMaterializeRequest for TestCases.Materialize.
message TestCasesMaterializeRequest {
  string template = 1;
  
  map<string, .dokime.v1.Value> parameters = 2;
}

// TestCasesMaterializeResponse for TestCases.Materialize.
message TestCasesMaterializeResponse { .dokime.v1.TestCase test_case = 1; }

// === Resources === //

// === Enums === //
