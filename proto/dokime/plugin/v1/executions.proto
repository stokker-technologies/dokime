// Executions Contracts

syntax = "proto3";

package dokime.plugin.v1;

// === Imports === //

import "dokime/v1/execution.proto";

// === Options === //

option csharp_namespace = "Dokime.Protocol.Plugin.V1";

// === Services === //

// === Requests and Responses === //

// === Resources === //

// ExecutionsInitializeRequest value owned by this resource.
message ExecutionsInitializeRequest {
  string execution = 1;
  .dokime.v1.TestCase test_case = 2;
  .dokime.v1.Origin origin = 3;
}

// ExecutionsInitializeResponse value owned by this resource.
message ExecutionsInitializeResponse {}

// ExecutionsCleanupRequest value owned by this resource.
message ExecutionsCleanupRequest {
  string execution = 1;
  .dokime.v1.Termination termination = 2;
  .dokime.v1.TestCase test_case = 3;
  .dokime.v1.Origin origin = 4;
}

// ExecutionsCleanupResponse value owned by this resource.
message ExecutionsCleanupResponse {}

