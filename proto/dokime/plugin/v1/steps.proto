// Steps Contracts

syntax = "proto3";

package dokime.plugin.v1;

// === Imports === //

import "dokime/model/v1/execution.proto";
import "harmos/model/v1/callers.proto";

// === Options === //

option csharp_namespace = "Dokime.Plugins";

// === Services === //

// Host-only plugin operations with independent Protected lifecycle bindings.
// CLIENTS identifies the host as this executor's transport client; application
// clients never connect to or receive these methods in their resource tree.
service Steps {
  // Execute the Steps resource; admission and policy are owned by the executor.
  rpc Execute(.dokime.plugin.v1.StepsExecuteRequest) returns (.dokime.plugin.v1.StepsExecuteResponse) {
    option (harmos.model.v1.callers) = CLIENTS;
  }
}

// === Execute === //

// StepsExecuteRequest for Steps.Execute.
message StepsExecuteRequest {
  string execution = 1;

  string step = 2;

  .dokime.model.v1.TestCase test_case = 3;
  .dokime.model.v1.Origin origin = 4;
}

// StepsExecuteResponse for Steps.Execute.
message StepsExecuteResponse {}

// === Resources === //

// === Enums === //
