// Analyses Contracts

syntax = "proto3";

package dokime.plugin.v1;

// === Imports === //

import "dokime/v1/analyses.proto";
import "dokime/v1/scalar.proto";

// === Options === //

option csharp_namespace = "Dokime.Protocol.Plugin.V1";

// === Services === //

// Host-only plugin operations with independent Protected lifecycle bindings.
service Analyses {
  // Compute the Analyses resource; admission and policy are owned by the executor.
  rpc Compute(.dokime.plugin.v1.AnalysesComputeRequest) returns (.dokime.plugin.v1.AnalysesComputeResponse);
}

// === Compute === //

// AnalysesComputeRequest for Analyses.Compute.
message AnalysesComputeRequest {
  .dokime.plugin.v1.AnalysisSamples samples = 1;
  .dokime.v1.MapValue parameters = 2;
}

// AnalysesComputeResponse for Analyses.Compute.
message AnalysesComputeResponse { repeated .dokime.v1.AnalysisValues outputs = 1; }

// === Resources === //

// AnalysisSamples value owned by this resource.
message AnalysisSamples {
  repeated double axis = 1;
  repeated double values = 2;
  string axis_unit = 3;
  string unit = 4;
}

// === Enums === //
