syntax = "proto3";
package dokime.plugin.host.v1;
option csharp_namespace = "Dokime.Protocol.Plugin.Host.V1";
import "harmos/v1/types.proto";
import "dokime/v1/scalar.proto";

// Public child-call declarations carried by Instance.Invoke; no client service.
message EvidenceStatisticsRequest {
  string execution = 1;
  string stream = 2;
  // Column of the stream. May be empty when the stream has one value column.
  string field = 3;
  // Limit to the time range of one step; empty for the whole execution.
  string step = 4;
  .harmos.v1.Position at = 5;
}

message EvidenceStatisticsResponse {
  uint64 count = 1;
  .dokime.v1.Value min = 2;
  .dokime.v1.Value max = 3;
  .dokime.v1.Value mean = 4;
  double stddev = 5;
  .dokime.v1.Value median = 6;
  .dokime.v1.Value p05 = 7;
  .dokime.v1.Value p95 = 8;
  .dokime.v1.Value p99 = 9;
  .dokime.v1.Value first = 10;
  .dokime.v1.Value last = 11;
  .dokime.v1.Value sum = 13;
  .harmos.v1.Position resolved_at = 12;
}
