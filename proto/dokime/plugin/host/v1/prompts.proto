syntax = "proto3";
package dokime.plugin.host.v1;
option csharp_namespace = "Dokime.Protocol.Plugin.Host.V1";
import "dokime/v1/prompts.proto";
import "dokime/v1/scalar.proto";
import "google/protobuf/timestamp.proto";

// Public child-call declarations, carried by Instance.Invoke.
message PromptsCreateRequest {
  string prompt = 1;
  string prompt_type = 2;
  map<string, .dokime.v1.Value> values = 3;
  // An inline definition supports questions assembled by ctx.prompt at runtime;
  // absent uses the catalog definition named by prompt_type.
  .dokime.v1.Prompt definition = 4;
}

message PromptsCreateResponse {
  string prompt = 1;
  string action = 2;
  map<string, .dokime.v1.Value> values = 3;
  string responder = 4;
  .google.protobuf.Timestamp submitted_at = 5;
  bool accepted = 6;
}
