syntax = "proto3";
package dokime.plugin.host.v1;
option csharp_namespace = "Dokime.Protocol.Plugin.Host.V1";
import "dokime/v1/documents.proto";
import "harmos/v1/types.proto";

// Public child-call declarations, carried by Instance.Invoke.
message DocumentsAppendPartsRequest {
  string execution = 1;
  string document = 2;
  // Append to the named section. An empty section selects the document root.
  string section = 3;
  oneof part { .dokime.v1.Section subsection = 4; .dokime.v1.Card card = 5; }
  string request_id = 20;
}

message DocumentsAppendPartsResponse { .harmos.v1.Receipt receipt = 1; }
