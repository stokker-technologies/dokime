syntax = "proto3";
package dokime.plugin.host.v1.executions;
option csharp_namespace = "Dokime.Protocol.Plugin.Host.V1.ExecutionsResources";
import "dokime/v1/execution.proto";
import "harmos/v1/types.proto";

// Public invocation child calls; no independent gRPC service.
message ProgressGetRequest { string name = 1; }

message ProgressGetResponse {
  .dokime.v1.ExecutionProgressValue value = 1;
  bytes revision = 2;
  .harmos.v1.Position resolved_at = 3;
}

message ProgressSetRequest {
  string name = 1;
  .dokime.v1.ExecutionProgressValue value = 2;
  bytes expected_revision = 3;
  string request_id = 4;
}

message ProgressSetResponse {
  .dokime.v1.ExecutionProgressValue value = 1;
  bytes revision = 2;
  .harmos.v1.Receipt receipt = 3;
}
