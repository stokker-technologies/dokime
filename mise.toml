# ***
#
# Dokime
#
# SPDX-License-Identifier: Apache-2.0
#
# ***

# === Settings === #

[settings]
lockfile = true

# === Tools === #

[tools]
# Languages and Runtimes
go = "1.27.3"
node = "26.11.1"
powershell = { version = "7.6.7", os = ["windows"] }
python = "3.15.0"
rust = { version = "1.99.0", components = "clippy,rustfmt,llvm-tools", profile = "minimal", targets = "wasm32-unknown-unknown" }

# Package Managers
pnpm = "12.11.2"
uv = "0.13.7"

# Rust Toolchain
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.148"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
"github:bnjbvr/cargo-machete" = "0.9.2"
sccache = "0.19.0"

# Formatting and Linting
"aqua:koalaman/shellcheck" = "0.11.0"
"go:github.com/rhysd/actionlint/cmd/actionlint" = "v1.7.13-0.20260417151945-fd33e9f582a0"
taplo = "0.10.0"

# Protocols and Code Generation
protoc = "36.2"

# Release and Signing
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"aqua:anchore/syft" = "1.57.0"
"aqua:rustsec/rustsec/cargo-audit" = "0.22.2"
git-cliff = "2.14.2"
"github:CycloneDX/cyclonedx-rust-cargo" = "cargo-cyclonedx-0.5.9"
"github:EmbarkStudios/cargo-about" = "0.9.3"
"github:rust-secure-code/cargo-auditable" = "0.7.7"
minisign = "0.12"

# Project Statistics
"aqua:boyter/scc" = "4.1.0"

# === Environment === #

[env]
PYTHONDONTWRITEBYTECODE = "1"

# === Variables === #

[vars]
python = "uv run --no-sync --project tools/python"
tools = "uv run --no-sync --project tools/python python -m"
lane = "uv run --no-sync --project tools/python python -m dokime_tools.test.run test"

# === Entry Points === #

[tasks."prepare"]
description = "Prepare Tools and Inputs"
usage = 'flag "--refresh-lock" help="Refresh the Python Workspace Lock Before Synchronizing"'
run = [
  "{% if usage.refresh_lock %}uv lock{% endif %}",
  "uv sync --locked --all-groups",
  "pnpm --dir crates/dokime-gui install --frozen-lockfile",
]

[tasks."generate"]
description = "Generate Clients from Contracts"
usage = 'flag "--check" help="Check Rust Bindings; Requires --protocol"; flag "--protocol" help="Generate Checked-In Protocol Bindings Only"'
run = """
{% if usage.check and not usage.protocol %}
python -c "raise SystemExit('Check Protocol: Add --protocol; Native Client Drift Returns With the Desktop')"
{% elif usage.protocol and usage.check %}
mise run test -- --package dokime-protocol --target integration
{% elif usage.protocol %}
{{vars.tools}} dokime_tools.build.cargo focused run --locked --package dokime-protocol-generator
{% else %}
{{vars.tools}} dokime_tools.prepare.generated --generate
{% endif %}
"""

[tasks.format]
description = "Format Every Language"
run = "{{vars.tools}} dokime_tools.ci.tasks format"

[tasks.lint]
description = "Lint Every Language"
run = "{{vars.tools}} dokime_tools.ci.tasks lint"

[tasks.check]
description = "Check Languages and Repository"
run = "{{vars.tools}} dokime_tools.ci.tasks check"

[tasks.build]
description = "Build Products or Focused Packages"
run = "{{vars.tools}} dokime_tools.ci.tasks build"

[tasks.test]
description = "Test Layers or Focused Targets"
run = "{{vars.tools}} dokime_tools.ci.tasks test"

[tasks.package]
description = "Package Built Artifacts"
run = "{{vars.tools}} dokime_tools.ci.tasks package"

[tasks."release:prepare"]
description = "Prepare the Release Branch"
run = "{{vars.tools}} dokime_tools.ci.workflow release-prepare"

[tasks."release:publish"]
description = "Publish a Tagged Release"
run = "{{vars.tools}} dokime_tools.ci.tasks publish"

[tasks."release:rehearse"]
description = "Rehearse Staged Release Packages Without Credentials"
run = "{{vars.tools}} dokime_tools.ci.workflow rehearse"

[tasks."release:tag"]
description = "Tag a Merged Release Review and Fast-Forward Main"
run = "{{vars.tools}} dokime_tools.ci.workflow release-tag"

[tasks."release:verify"]
description = "Verify Published Release Assets and Installers"
run = "{{vars.tools}} dokime_tools.ci.workflow release-verify"

# === Internal Steps === #

[tasks."format:python"]
hide = true
description = "Format Python"
usage = 'flag "--check"'
run = [
  "{{vars.python}} ruff check --select I,F401,PYI{% if not usage.check %} --fix{% endif %} sdk/python",
  "{{vars.python}} ruff format sdk/python{% if usage.check %} --check{% endif %}",
  "{{vars.python}} ruff check --select I,F401,PYI{% if not usage.check %} --fix{% endif %} tools/python",
  "{{vars.python}} ruff format tools/python{% if usage.check %} --check{% endif %}",
  "{{vars.python}} ruff format --no-force-exclude tools/python/src/dokime_tools/test tools/python/src/dokime_tools/release{% if usage.check %} --check{% endif %}",
]

[tasks."format:rust"]
hide = true
description = "Format Rust"
usage = '''
flag "--check"
flag "--package <package>" help="Limit Formatting to One Package"
'''
run = "cargo fmt {% if usage.package %}--package {{usage.package}}{% else %}--all{% endif %}{% if usage.check %} --check{% endif %}"

[tasks."format:toml"]
hide = true
description = "Format TOML"
usage = 'flag "--check"'
run = "git ls-files -z -- '*.toml' | xargs -0 taplo fmt --config tools/config/taplo.toml --option column_width=140{% if usage.check %} --check{% endif %}"
run_windows = '''pwsh -NoProfile -Command "taplo fmt --config tools/config/taplo.toml --option column_width=140{% if usage.check %} --check{% endif %} -- @(git ls-files -- '*.toml')"'''

[tasks."format:typescript"]
hide = true
description = "Format TypeScript"
usage = 'flag "--check"'
run = "pnpm --dir crates/dokime-gui exec biome format{% if usage.check %}{% else %} --write{% endif %} ."

[tasks."lint:python"]
hide = true
description = "Lint Python"
run = [
  "{{vars.python}} ruff check sdk/python",
  "{{vars.python}} ruff check tools/python",
  "{{vars.python}} ty check --project tools/python",
  "{{vars.python}} ruff check --no-force-exclude tools/python/src/dokime_tools/test/run.py tools/python/src/dokime_tools/test/traces.py tools/python/src/dokime_tools/test/pytest.py tools/python/src/dokime_tools/test/schedule.py tools/python/src/dokime_tools/test/archive.py tools/python/src/dokime_tools/test/nextest.py tools/python/src/dokime_tools/test/focused.py tools/python/src/dokime_tools/test/wheel.py tools/python/src/dokime_tools/test/arrow_archive.py",
  '{{vars.python}} ty check --project tools/python --config "src.exclude = []" tools/python/src/dokime_tools/test/run.py tools/python/src/dokime_tools/test/traces.py tools/python/src/dokime_tools/test/pytest.py tools/python/src/dokime_tools/test/schedule.py tools/python/src/dokime_tools/test/archive.py tools/python/src/dokime_tools/test/nextest.py tools/python/src/dokime_tools/test/focused.py',
]

[tasks."lint:rust"]
hide = true
description = "Lint Rust"
usage = 'flag "--package <package>" help="Limit Clippy to One Package"'
run = "{{vars.tools}} dokime_tools.build.lint -- --locked {% if usage.package %}--package {{usage.package}}{% else %}--workspace{% endif %} --all-targets --profile dev"
env = { CARGO_BUILD_WARNINGS = "deny" }

[tasks."lint:typescript"]
hide = true
description = "Lint TypeScript"
run = "pnpm --dir crates/dokime-gui exec biome lint ."

[tasks.screenshots]
description = "Capture Product Screenshots"
run = "{{vars.tools}} dokime_tools.ci.tasks screenshots"

[tasks."check:python"]
hide = true
description = "Check Python"
run = [{ task = "format:python --check" }, { task = "lint:python" }, { task = "test:python:integration --project tools/python" }]

[tasks."check:python:bindings"]
hide = true
description = "Check Built Python Messages and Generated Service Stubs"
usage = 'flag "--profile <profile>" default="dev"'
run = [
  "{{vars.python}} ty check --project sdk/python --exit-zero-on-warning",
  "{{vars.tools}} dokime_tools.test.wheel --profile {{usage.profile}} --stubs --generated-only",
]

[tasks."check:repository"]
hide = true
description = "Check Repository Configuration"
run = [{ task = "format:toml --check" }, "{{vars.tools}} dokime_tools.ci.mise", "shellcheck --version", "actionlint"]

[tasks."check:rust"]
hide = true
description = "Check Rust"
run = [{ task = "format:rust --check" }, { task = "lint:rust" }, "{{vars.tools}} dokime_tools.ci.rust"]

[tasks."check:rust:supply"]
hide = true
description = "Check Dependency Advisories, Licenses and Sources"
run = "{{vars.tools}} dokime_tools.release.sbom --check-supply"

[tasks."check:typescript"]
hide = true
description = "Check TypeScript Formatting and Lint Without Type Checking"
run = [{ task = "format:typescript --check" }, { task = "lint:typescript" }]

[tasks."build:product"]
hide = true
description = "Build Shipping Binaries, Bundles And Frontend"
usage = 'flag "--profile <profile>" default="dev"'
run = [{ task = "build:rust --profile {{usage.profile}}" }, { task = "build:typescript --profile {{usage.profile}}" }]

[tasks."build:python"]
hide = true
description = "Build the Pure Python SDK Wheel"
usage = 'flag "--profile <profile>" default="dev"'
run = "{{vars.tools}} dokime_tools.build.python --profile {{usage.profile}}"

[tasks."build:rust"]
hide = true
description = "Build Shipping Native Executables and Plugin Bundle"
usage = 'flag "--profile <profile>" default="dev"'
run = "{{vars.tools}} dokime_tools.release.sbom --auditable {{usage.profile}} -- python -m dokime_tools.build.rust --profile {{usage.profile}}"

[tasks."build:rust:tests"]
hide = true
description = "Build Independent Test Archive"
usage = 'flag "--profile <profile>" default="dev"; flag "--timings"'
run = [
  "{{vars.tools}} dokime_tools.build.rust.tests --profile {{usage.profile}}{% if usage.timings %} --timings{% endif %}",
  { task = "build:host-fixtures --profile {{usage.profile}}" },
  { task = "build:cli-fixtures --profile {{usage.profile}}" },
]

[tasks."build:cli-fixtures"]
hide = true
description = "Build and Export the Command-Line Starter Fixture"
usage = 'flag "--profile <profile>" default="dev"'
run = "{{vars.tools}} dokime_tools.build.cli_fixtures --profile {{usage.profile}}"

[tasks."build:host-fixtures"]
hide = true
description = "Build and Export Execution Host SDK Fixtures"
usage = 'flag "--profile <profile>" default="dev"; flag "--language <language>"; flag "--export"'
run = "{{vars.tools}} dokime_tools.build.host_fixtures --profile {{usage.profile}}{% if usage.language %} --language {{usage.language}}{% endif %}{% if usage.export %} --export{% endif %}"

[tasks."build:typescript"]
hide = true
description = "Build the Generated GUI Client and Frontend"
usage = 'flag "--profile <profile>" default="dev"'
run = "{{vars.tools}} dokime_tools.build.typescript --profile {{usage.profile}}"

[tasks."test:python"]
hide = true
description = "Test Python Layers"
usage = '''
flag "--profile <profile>" default="dev"
flag "--prepared"
'''
depends = [
  "test:python:integration --profile {{usage.profile}} --project tools/python{% if usage.prepared %} --prepared{% endif %}",
  "test:python:integration --profile {{usage.profile}}{% if usage.prepared %} --prepared{% endif %}",
  "test:python:system --profile {{usage.profile}}{% if usage.prepared %} --prepared{% endif %}",
]

[tasks."test:python:integration"]
hide = true
description = "Test Integration Python"
usage = '''
flag "--profile <profile>" default="dev"
flag "--prepared"
flag "--project <project>" default="sdk/python"
flag "--select <select>"
'''
run = [
  '''{% if usage.prepared %}{{vars.tools}} dokime_tools.test.schedule --lane --profile {{usage.profile}} --category integration --language python --project {{usage.project}}{% elif usage.project == "tools/python" %}{{vars.python}} python -m unittest discover -s tools/python/tests/integration {% if usage.select %}-k "{{usage.select}}"{% endif %}{% else %}{{vars.tools}} dokime_tools.test.python --profile {{usage.profile}} --category integration {% if usage.select %}-- -k "{{usage.select}}"{% endif %}{% endif %}''',
]

[tasks."test:python:system"]
hide = true
description = "Test System Python"
usage = '''
flag "--profile <profile>" default="dev"
flag "--prepared"
flag "--artifacts <artifacts>" help="Use an Explicit Native Fixture Root"
flag "--select <select>" help="Run Matching System Stories"
'''
run = [
  '''{% if usage.prepared %}{{vars.tools}} dokime_tools.test.schedule --lane --profile {{usage.profile}} --category system --language python{% else %}{{vars.tools}} dokime_tools.test.python --profile {{usage.profile}} --category system -- --build-profile {{usage.profile}} {% if usage.artifacts %}--artifacts "{{usage.artifacts}}"{% endif %} {% if usage.select %}-k "{{usage.select}}"{% endif %}{% endif %}''',
]

[tasks."test:python:coverage"]
hide = true
description = "Measure Python SDK Coverage"
usage = 'flag "--profile <profile>" default="dev"'
run = [
  "{{vars.tools}} dokime_tools.test.archive --profile {{usage.profile}} --install-wheels",
  "{{vars.tools}} dokime_tools.test.run coverage --language python --profile {{usage.profile}} --project sdk/python",
]

[tasks."test:python:wheel"]
hide = true
description = "Install the Pure Wheel and Run the Starter"
usage = '''
flag "--profile <profile>" default="dev"
flag "--stubs" help="Check Generated Messages and Service Stubs Against Protos"
'''
run = "{{vars.tools}} dokime_tools.test.wheel --profile {{usage.profile}}{% if usage.stubs %} --stubs{% endif %}"

[tasks."test:rust"]
hide = true
description = "Test Rust Layers"
usage = '''
flag "--profile <profile>" default="dev"
flag "--prepared"
'''
depends = [
  "test:rust:unit --profile {{usage.profile}}{% if usage.prepared %} --prepared{% endif %}",
  "test:rust:integration --profile {{usage.profile}}{% if usage.prepared %} --prepared{% endif %}",
  "test:rust:system --profile {{usage.profile}}{% if usage.prepared %} --prepared{% endif %}",
]

[tasks."test:rust:unit"]
hide = true
description = "Test Unit Rust"
usage = '''
flag "--profile <profile>" default="dev"
flag "--prepared"
flag "--select <select>" help="Narrow the Nextest Filterset"
'''
run = [
  '''{% if usage.prepared %}{{vars.tools}} dokime_tools.test.schedule --lane --profile {{usage.profile}} --category unit --language rust{% else %}{{vars.lane}} --profile {{usage.profile}} --category unit --language rust {% if usage.select %}-- -E "{{usage.select}}"{% endif %}{% endif %}''',
]

[tasks."test:rust:integration"]
hide = true
description = "Test Integration Rust"
usage = '''
flag "--profile <profile>" default="dev"
flag "--prepared"
flag "--select <select>" help="Narrow the Nextest Filterset"
'''
run = [
  '''{% if usage.prepared %}{{vars.tools}} dokime_tools.test.schedule --lane --profile {{usage.profile}} --category integration --language rust{% else %}{{vars.lane}} --profile {{usage.profile}} --category integration --language rust {% if usage.select %}-- {% endif %}{% if usage.select %}-E "{{usage.select}}"{% endif %}{% endif %}''',
]

[tasks."test:rust:system"]
hide = true
description = "Test System Rust"
usage = '''
flag "--profile <profile>" default="dev"
flag "--prepared"
flag "--select <select>" help="Narrow the Nextest Filterset"
'''
run = [
  '''{% if usage.prepared %}{{vars.tools}} dokime_tools.test.schedule --lane --profile {{usage.profile}} --category system --language rust{% else %}{{vars.tools}} dokime_tools.test.archive --install-wheels --profile {{usage.profile}}{% endif %}''',
  '''{% if not usage.prepared %}{{vars.lane}} --profile {{usage.profile}} --category system --language rust {% if usage.select %}-- -E "{{usage.select}}"{% endif %}{% endif %}''',
]

[tasks."test:rust:coverage"]
hide = true
description = "Measure Rust Coverage over Instrumented Lanes"
usage = 'flag "--profile <profile>" default="dev"'
run = [
  "{{vars.tools}} dokime_tools.prepare.generated --profile {{usage.profile}}",
  "{{vars.tools}} dokime_tools.test.archive --install-wheels --profile {{usage.profile}}",
  "{{vars.tools}} dokime_tools.test.run coverage --language rust --profile {{usage.profile}}",
]

[tasks."test:typescript"]
hide = true
description = "Test TypeScript Layers"
usage = '''
flag "--profile <profile>" default="dev"
flag "--prepared"
'''
depends = [
  "test:typescript:unit --profile {{usage.profile}}{% if usage.prepared %} --prepared{% endif %}",
  "test:typescript:integration --profile {{usage.profile}}{% if usage.prepared %} --prepared{% endif %}",
]

[tasks."test:typescript:unit"]
hide = true
description = "Test Unit TypeScript Against Freshly Generated Modules Without Rewriting Sources"

usage = '''
flag "--profile <profile>" default="dev"
flag "--prepared"
flag "--select <select>"
'''
run = [
  "{% if not usage.prepared %}{{vars.tools}} dokime_tools.prepare.generated --generate{% endif %}",
  '''{% if usage.prepared %}{{vars.tools}} dokime_tools.test.schedule --lane --profile {{usage.profile}} --category unit --language typescript{% endif %}''',
  '''{% if not usage.prepared %}{{vars.lane}} --profile {{usage.profile}} --category unit --language typescript --project crates/dokime-gui -- node ./node_modules/vitest/vitest.mjs run {% if usage.select %}{{usage.select}}{% else %}tests/unit --exclude "tests/unit/{settings/preferences,console/nominal,cycle/{nominal,projection,document-stream},history/totals,library/nominal,shell/navigation,plots/{columnar-frame,live-frames,plot-pipeline}}.test.ts" --testNamePattern "^(?!.*Native Rejections and Captured Diagnostics Reach Notification History)"{% endif %} --reporter=default --reporter=junit --outputFile.junit={junit} --testTimeout={timeout_ms}{% endif %}''',
]

[tasks."test:typescript:integration"]
hide = true
description = "Test Integration TypeScript Against Freshly Generated Modules Without Rewriting Sources"

usage = '''
flag "--profile <profile>" default="dev"
flag "--prepared"
flag "--select <select>"
'''
run = [
  "{% if not usage.prepared %}{{vars.tools}} dokime_tools.prepare.generated --generate{% endif %}",
  '''{% if usage.prepared and not usage.select %}{{vars.tools}} dokime_tools.test.schedule --lane --profile {{usage.profile}} --category integration --language typescript{% endif %}''',
  '''{% if not usage.prepared or usage.select %}{{vars.lane}} {% if usage.prepared %}--prepared {% endif %}--profile {{usage.profile}} --category integration --language typescript --project crates/dokime-gui -- node ./node_modules/vitest/vitest.mjs run {% if usage.select %}{{usage.select}}{% else %}tests/integration --exclude "tests/integration/{cycle/{document-query,lifecycle,saved-report},execution/responsiveness,plots/nominal,settings/registry,shell/{contracts,status}}.test.ts"{% endif %} --reporter=default --reporter=junit --outputFile.junit={junit} --testTimeout={timeout_ms}{% endif %}''',
]

[tasks."package:python"]
hide = true
description = "Package the Pure Python SDK Distributions"
usage = '''
flag "--profile <profile>" default="dev"
flag "--target <target>" default="any"
'''
run = "{{vars.tools}} dokime_tools.package.run python --profile {{usage.profile}} --target any"

[tasks."package:rust"]
hide = true
description = "Package the Desktop Installer, Tools and Plugin Archives"
tools = { "aqua:ip7z/7zip" = "26.05" }
usage = '''
flag "--profile <profile>" default="dev"
flag "--target <target>" default="native"
'''
run = [
  "{{vars.tools}} dokime_tools.release.notices",
  "{{vars.tools}} dokime_tools.package.run rust --profile {{usage.profile}} --target {{usage.target}}",
  "{{vars.tools}} dokime_tools.package.distribution --profile {{usage.profile}}",
]

[tasks."ci:nightly-freshness"]
hide = true
description = "Nightly Freshness"
run = "{{vars.tools}} dokime_tools.ci.workflow nightly-freshness"

[tasks."ci:nightly-report"]
hide = true
description = "Nightly Report"
run = "{{vars.tools}} dokime_tools.ci.workflow nightly-report"

[tasks."ci:release-mode"]
hide = true
description = "Select Release Preparation or Tagging"
run = "{{vars.tools}} dokime_tools.ci.workflow release-mode"

[tasks."ci:review"]
hide = true
description = "Review"
run = "{{vars.tools}} dokime_tools.ci.workflow review"

[tasks."ci:required"]
hide = true
description = "Required"
run = "{{vars.tools}} dokime_tools.ci.workflow required"

[tasks."ci:mirror"]
hide = true
description = "Mirror"
run = "{{vars.tools}} dokime_tools.ci.workflow mirror"

[tasks."ci:bindings"]
hide = true
description = "Bindings"
run = "{{vars.tools}} dokime_tools.ci.workflow bindings"

[tasks."ci:test"]
hide = true
lock = true
description = "Test Every Layer Concurrently from Built Artifacts"
usage = 'flag "--profile <profile>" default="dev"'
run = [
  "{{vars.tools}} dokime_tools.test.schedule --prepare --profile {{usage.profile}}",
  { tasks = [
    "test:python --profile {{usage.profile}} --prepared",
    "test:rust --profile {{usage.profile}} --prepared",
    "test:typescript --profile {{usage.profile}} --prepared",
  ] },
  "{{vars.tools}} dokime_tools.test.schedule --finish --profile {{usage.profile}}",
]

[tasks."release:publish:assets"]
hide = true
description = "Draft the Release with Its Assets and SHA256SUMS"
run = "{{vars.tools}} dokime_tools.release.run publish"

[tasks."release:publish:dry"]
hide = true
description = "Dry-Run Every Publication"
run = [
  "{{vars.tools}} dokime_tools.release.version check",
  "{{vars.tools}} dokime_tools.release.run dry",
  "{{vars.tools}} dokime_tools.release.run crates-dry",
]

[tasks."release:publish:finalize"]
hide = true
description = "Verify and Publish the Drafted Release"
run = "{{vars.tools}} dokime_tools.release.run finalize"

[tasks."release:publish:python"]
hide = true
description = "Publish the Pure Python SDK"
run = "{{vars.tools}} dokime_tools.release.run python"
