# ***
#
# Dokime
#
# SPDX-License-Identifier: Apache-2.0
#
# ***

# === Settings === #

[settings]
lockfile = true

# === Tools === #

[tools]
# Languages And Runtimes
node = "26.11.1"
python = "3.15.0"
rust = { version = "1.99.0", components = "clippy,rustfmt,llvm-tools-preview", profile = "minimal", targets = "wasm32-unknown-unknown" }

# Package Managers
pnpm = "12.11.2"
uv = "0.13.0"

# Rust Toolchain
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.148"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
"aqua:cargo-bins/cargo-binstall" = "1.26.0"
sccache = "0.18.0"

# Formatting And Linting
"aqua:rhysd/actionlint" = "1.7.12"
taplo = "0.10.0"

# Protocols And Code Generation
protoc = "36.2"

# Release And Signing
gh = "2.102.0"
git-cliff = "2.14.2"
glab = "1.123.0"
minisign = "0.12"

# Project Statistics
"aqua:boyter/scc" = "4.1.0"

# === Environment === #

[env]
UV_PROJECT_ENVIRONMENT = "{{config_root}}/.venv"
PYTHONDONTWRITEBYTECODE = "1"

# === Variables === #

[vars]
python = "uv run --locked --project tools/python"
tools = "uv run --locked --project tools/python python -m"
lane = "uv run --locked --project tools/python python -m dokime_tools.test.run test"
# The generated client modules; protoc's wire output stays excluded by the package's ruff configuration.
generated_python = "packages/dokime-client/src/dokime_client/_wire packages/dokime-client/src/dokime_client/operation.py packages/dokime-client/src/dokime_client/dynamic.py packages/dokime-client/src/dokime_client/__init__.py packages/dokime-client/src/dokime_client/__init__.pyi"

# === Prepare === #

[tasks.prepare]
description = "Prepare Tools And Inputs"
run = ["uv sync --locked --all-groups --no-install-package dokime-client", "pnpm --dir crates/dokime-gui install --frozen-lockfile"]

[tasks."prepare:harmos"]
description = "Prepare The Pinned Harmos Authoring Tool"
depends = ["prepare"]
run = "{{vars.tools}} dokime_tools.ci.bootstrap --harmos-tools"

[tasks."prepare:report"]
description = "Prepare The Embedded Report Viewer"
depends = ["prepare"]
run = "{{vars.tools}} dokime_tools.build.frontend report"

# === Format === #

[tasks.format]
description = "Format Every Language"
usage = 'flag "--check"'
depends = [
  "format:toml {% if usage.check %}--check{% endif %}",
  "format:rust {% if usage.check %}--check{% endif %}",
  "format:python {% if usage.check %}--check{% endif %}",
  "format:typescript {% if usage.check %}--check{% endif %}",
]

[tasks."format:python"]
description = "Format Python"
usage = 'flag "--check"'
run = [
  "{{vars.python}} ruff format packages/dokime-client{% if usage.check %} --check{% endif %}",
  "{{vars.python}} ruff format tools/python{% if usage.check %} --check{% endif %}",
]

[tasks."format:rust"]
description = "Format Rust"
usage = 'flag "--check"'
run = "cargo fmt --all{% if usage.check %} --check{% endif %}"

[tasks."format:toml"]
description = "Format TOML"
usage = 'flag "--check"'
run = "git ls-files -z -- '*.toml' | xargs -0 taplo fmt --option column_width=140{% if usage.check %} --check{% endif %}"

[tasks."format:typescript"]
description = "Format TypeScript"
depends = ["prepare"]
usage = 'flag "--check"'
run = "pnpm --dir crates/dokime-gui exec biome format{% if usage.check %}{% else %} --write{% endif %} ."

# === Lint === #

[tasks.lint]
description = "Lint Every Language"
depends = ["lint:rust", "lint:python", "lint:typescript"]

[tasks."lint:python"]
description = "Lint Python"
depends = ["prepare"]
run = [
  "{{vars.python}} ruff check packages/dokime-client",
  "{{vars.python}} ruff check tools/python",
  # The Repository Tooling Reads No Generated Client, So Its Types Are Checked Before Any Build.
  "{{vars.python}} ty check --project tools/python",
]

[tasks."lint:rust"]
description = "Lint Rust"
depends = ["prepare:report"]
run = "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings"

[tasks."lint:typescript"]
description = "Lint TypeScript"
depends = ["prepare"]
run = "pnpm --dir crates/dokime-gui exec biome lint ."

# === Check === #

[tasks.check]
description = "Check Every Language And Conventions"
depends = ["check:rust"]

[tasks."check:rust"]
description = "Check Rust"
# The runtime embeds the report viewer, so every feature proof needs it first.
depends = ["prepare:report"]
run = [
  "cargo check --locked --workspace --all-targets --all-features",
  "cargo check --locked --workspace --lib --bins --no-default-features",
  "cargo check --locked -p dokime-domain --target wasm32-unknown-unknown",
]

# === Build === #

[tasks.build]
description = "Build Packageable Binaries, Libraries, Plugins, Frontend And Python Client"
depends = ["build:python --profile {{usage.profile}}"]
usage = 'flag "--profile <profile>" default="dev"'
run = [{ task = "build:typescript --profile {{usage.profile}}" }, { task = "build:rust --profile {{usage.profile}}" }]
env = { CARGO_INCREMENTAL = "0" }

[tasks."build:python"]
description = "Build The Python Client Wheel"
depends = ["prepare:harmos", "prepare:report"]
usage = 'flag "--profile <profile>" default="dev"'
run = "{{vars.tools}} dokime_tools.build.product python --profile {{usage.profile}}"

[tasks."build:rust"]
description = "Build Shipping Executables, Libraries And Plugin Bundle"
# The runtime embeds the report viewer, a declared input of every native capture.
depends = ["prepare:report"]
usage = 'flag "--profile <profile>" default="dev"'
run = "{{vars.tools}} dokime_tools.build.product rust --profile {{usage.profile}}"

[tasks."build:typescript"]
description = "Build The Generated GUI Client And Frontend"
# Contract Metadata Embeds The Frozen Report Before The GUI Client Is Generated.
depends = ["prepare:report"]
usage = 'flag "--profile <profile>" default="dev"'
run = "{{vars.tools}} dokime_tools.build.product typescript --profile {{usage.profile}}"

[tasks."build:tests"]
description = "Build The Shared Test Archive And Test Fixtures From Matching Product Hosts"
depends = ["prepare:report"]
usage = 'flag "--profile <profile>" default="dev"'
run = "{{vars.tools}} dokime_tools.build.tests --profile {{usage.profile}}"
env = { CARGO_INCREMENTAL = "0" }

[tasks."build:bench"]
description = "Build Benchmark Leaves And Matching Bench-Profile Hosts Without A Test Archive"
depends = ["prepare:report"]
run = "{{vars.tools}} dokime_tools.build.benchmarks"
env = { CARGO_INCREMENTAL = "0" }

# === Dev === #

[tasks.dev]
description = "Start The Native Desktop Shell With An Owned Local Backend And The OBC Plugin"
depends = ["prepare:report"]
env.DOKIME_PLUGINS_DIR = "{{config_root}}/target/debug/plugins"
run = [
  'python -c "from pathlib import Path; [Path(p).mkdir(parents=True, exist_ok=True) for p in (\"target/contracts\", \"target/debug/plugins\")]"',
  "cargo build --locked -p dokime-server --bin dokime-server --message-format json-render-diagnostics > target/contracts/dev.jsonl",
  "node crates/dokime-gui/tools/bindings.mjs target/contracts/dev.jsonl",
  "cargo run --locked -p cargo-dokime -- build --package obc-plugin --output target/debug/plugins/obc-plugin.dokime",
  "pnpm --dir crates/dokime-gui run tauri:dev",
]

# === Test === #

[tasks.test]
description = "Test Every Layer"
usage = 'flag "--profile <profile>" default="dev"'
run = [
  { task = "test:unit --profile {{usage.profile}}" },
  { task = "test:integration --profile {{usage.profile}}" },
  { task = "test:generated --profile {{usage.profile}}" },
  { task = "test:acceptance --profile {{usage.profile}}" },
  { task = "test:system --profile {{usage.profile}}" },
]
env = { CARGO_INCREMENTAL = "0" }

[tasks."test:acceptance"]
description = "Test Acceptance Layer"
usage = 'flag "--profile <profile>" default="dev"'
run = [{ task = "test:acceptance:rust --profile {{usage.profile}}" }, { task = "test:acceptance:python --profile {{usage.profile}}" }]
env = { CARGO_INCREMENTAL = "0" }

[tasks."test:acceptance:python"]
description = "Test Acceptance Python"
depends = ["prepare"]
usage = 'flag "--profile <profile>" default="dev"'
run = "{{vars.lane}} --profile {{usage.profile}} --category acceptance --language python --project packages/dokime-client -- --profile {{usage.profile}}"
env = { CARGO_INCREMENTAL = "0" }

[tasks."test:acceptance:rust"]
description = "Test Acceptance Rust"
depends = ["prepare"]
usage = 'flag "--profile <profile>" default="dev"'
run = [
  # The desktop/Python matrix drives the installed client wheel from the Rust lane.
  "{{vars.tools}} dokime_tools.test.archive --profile {{usage.profile}} --target any --install-wheels",
  "{{vars.lane}} --profile {{usage.profile}} --category acceptance --language rust",
]
env = { CARGO_INCREMENTAL = "0" }

[tasks."test:compile"]
description = "Test Compile Contracts In The Build Tree"
usage = 'flag "--profile <profile>" default="dev"'
run = [{ task = "test:compile:rust --profile {{usage.profile}}" }]
env = { CARGO_INCREMENTAL = "0" }

[tasks."test:compile:rust"]
description = "Test Rust Compile Contracts"
usage = 'flag "--profile <profile>" default="dev"'
# The macro stories compile plugin sources with rustc against the built SDK and its dependency closure, which only the build tree has.
run = "cargo nextest run --locked --workspace --all-targets --cargo-profile {{usage.profile}} --features tauri/custom-protocol,dokime-runtime/fault-injection -E \"binary_id(dokime-macros::compile)\""
env = { CARGO_INCREMENTAL = "0" }

[tasks."test:generated"]
description = "Test The Generated Clients"
usage = 'flag "--profile <profile>" default="dev"'
depends = ["test:generated:python --profile {{usage.profile}}", "test:generated:typescript --profile {{usage.profile}}"]
env = { CARGO_INCREMENTAL = "0" }

[tasks."test:generated:python"]
description = "Test The Generated Python Client"
depends = ["prepare"]
usage = 'flag "--profile <profile>" default="dev"'
run = [
  "{{vars.python}} ty check --project packages/dokime-client --exit-zero-on-warning",
  "{{vars.python}} ruff check --force-exclude {{vars.generated_python}}",
  "{{vars.tools}} dokime_tools.test.archive --profile {{usage.profile}} --target any --install-wheels",
  "{{vars.python}} python -c \"import dokime_client, dokime_client.client\"",
]
env = { CARGO_INCREMENTAL = "0" }

[tasks."test:generated:typescript"]
description = "Test The Generated TypeScript Client"
depends = ["prepare"]
usage = 'flag "--profile <profile>" default="dev"'
run = [
  "{{vars.tools}} dokime_tools.prepare.generated --profile {{usage.profile}}",
  "pnpm --dir crates/dokime-gui run typecheck",
  "pnpm --dir crates/dokime-gui exec biome lint --config-path=biome.json --vcs-use-ignore-file=false ../../target/generated/typescript",
  "node crates/dokime-gui/tools/smoke.mjs",
]
env = { CARGO_INCREMENTAL = "0" }

[tasks."test:integration"]
description = "Test Integration Layer"
usage = 'flag "--profile <profile>" default="dev"'
run = [
  { task = "test:integration:rust --profile {{usage.profile}}" },
  { task = "test:integration:python --profile {{usage.profile}}" },
  { task = "test:integration:typescript --profile {{usage.profile}}" },
]
env = { CARGO_INCREMENTAL = "0" }

[tasks."test:integration:python"]
description = "Test Integration Python"
depends = ["prepare"]
usage = 'flag "--profile <profile>" default="dev"'
run = "{{vars.lane}} --profile {{usage.profile}} --category integration --language python --project packages/dokime-client"
env = { CARGO_INCREMENTAL = "0" }

[tasks."test:integration:rust"]
description = "Test Integration Rust"
usage = 'flag "--profile <profile>" default="dev"'
# The compile contracts run only in the build tree (test:compile); every other test binary is integration.
run = "{{vars.lane}} --profile {{usage.profile}} --category integration --language rust -- -E \"not binary_id(dokime-macros::compile)\""
env = { CARGO_INCREMENTAL = "0" }

[tasks."test:integration:typescript"]
description = "Test Integration TypeScript"
depends = ["prepare"]
usage = 'flag "--profile <profile>" default="dev"'
run = [
  "{{vars.tools}} dokime_tools.prepare.generated --profile {{usage.profile}}",
  "{{vars.lane}} --profile {{usage.profile}} --category integration --language typescript --project crates/dokime-gui -- node ./node_modules/vitest/vitest.mjs run tests/integration --reporter=default --reporter=junit --outputFile.junit={junit} --testTimeout={timeout_ms}",
]
env = { CARGO_INCREMENTAL = "0" }

[tasks."test:system"]
description = "Test System Layer"
usage = 'flag "--profile <profile>" default="dev"'
run = [{ task = "test:system:rust --profile {{usage.profile}}" }, { task = "test:system:typescript --profile {{usage.profile}}" }]
env = { CARGO_INCREMENTAL = "0" }

[tasks."test:system:rust"]
description = "Test System Rust"
depends = ["prepare"]
usage = 'flag "--profile <profile>" default="dev"'
run = [
  "{{vars.tools}} dokime_tools.test.archive --profile {{usage.profile}} --target any --install-wheels",
  "{{vars.lane}} --profile {{usage.profile}} --category system --language rust",
]
env = { CARGO_INCREMENTAL = "0" }

[tasks."test:system:typescript"]
description = "Test System TypeScript"
depends = ["prepare"]
usage = 'flag "--profile <profile>" default="dev"'
run = "{{vars.lane}} --profile {{usage.profile}} --category system --language typescript --project crates/dokime-gui -- node e2e/native-desktop.mjs --profile {{usage.profile}} --junit {junit}"
env = { CARGO_INCREMENTAL = "0" }

[tasks."test:unit"]
description = "Test Unit Layer"
usage = 'flag "--profile <profile>" default="dev"'
run = [
  { task = "test:unit:rust --profile {{usage.profile}}" },
  { task = "test:unit:typescript --profile {{usage.profile}}" },
  { task = "test:unit:python --profile {{usage.profile}}" },
]
env = { CARGO_INCREMENTAL = "0" }

[tasks."test:unit:python"]
description = "Test Unit Python"
depends = ["prepare"]
usage = 'flag "--profile <profile>" default="dev"'
run = "{{vars.lane}} --profile {{usage.profile}} --category unit --language python --project packages/dokime-client"

[tasks."test:unit:rust"]
description = "Test Unit Rust"
usage = 'flag "--profile <profile>" default="dev"'
run = "{{vars.lane}} --profile {{usage.profile}} --category unit --language rust"
env = { CARGO_INCREMENTAL = "0" }

[tasks."test:unit:typescript"]
description = "Test Unit TypeScript"
depends = ["prepare"]
usage = 'flag "--profile <profile>" default="dev"'
run = [
  "{{vars.tools}} dokime_tools.prepare.generated --profile {{usage.profile}}",
  "{{vars.lane}} --profile {{usage.profile}} --category unit --language typescript --project crates/dokime-gui -- node ./node_modules/vitest/vitest.mjs run tests/unit --reporter=default --reporter=junit --outputFile.junit={junit} --testTimeout={timeout_ms}",
]
env = { CARGO_INCREMENTAL = "0" }

[tasks.coverage]
description = "Measure Coverage Over Instrumented Lanes"
run = ["{{vars.tools}} dokime_tools.test.run coverage --language rust", "{{vars.tools}} dokime_tools.test.run coverage --language python"]

# === Bench === #

[tasks.bench]
description = "Measure Every Bench Layer"
run = [{ task = "bench:unit:rust" }, { task = "bench:integration:rust" }, { task = "bench:system:rust" }]

[tasks."bench:integration:rust"]
description = "Bench Integration Rust"
run = "{{vars.tools}} dokime_tools.test.run bench --category integration --language rust"

[tasks."bench:system:rust"]
description = "Bench System Rust"
run = "{{vars.tools}} dokime_tools.test.run bench --category system --language rust"

[tasks."bench:unit:rust"]
description = "Bench Unit Rust"
run = "{{vars.tools}} dokime_tools.test.run bench --category unit --language rust"

# === Docs === #

# === Package === #

[tasks.package]
description = "Package Every Language"
usage = 'flag "--profile <profile>" default="dev"'
depends = ["package:rust --profile {{usage.profile}}", "package:python --profile {{usage.profile}}"]

[tasks."package:python"]
description = "Package The Built Python Distributions And Declared Tutorial Bundle"
usage = 'flag "--profile <profile>" default="dev"; flag "--target <target>" default="any"'
run = "{{vars.tools}} dokime_tools.package.examples --profile {{usage.profile}} --target {{usage.target}}"

[tasks."package:rust"]
description = "Package The Desktop Installer With Its CLI And Server Companions And The Plugin Bundle"
depends = ["prepare"]
usage = 'flag "--profile <profile>" default="dev"'
run = [
  "{{vars.tools}} dokime_tools.package.run rust --profile {{usage.profile}}",
  "{{vars.tools}} dokime_tools.package.installer bundle --profile {{usage.profile}}",
]

# === CI === #

[tasks.ci]
description = "Run The CI Flow Locally"
run = [
  { task = "format --check" },
  { task = "lint" },
  { task = "check" },
  { task = "build" },
  { task = "build:tests" },
  { task = "test:compile" },
  { task = "test" },
  { task = "package" },
  { task = "release:publish:dry" },
]

[tasks."ci:nightly"]
description = "Run The Nightly Coverage And Bench Flow"
run = [{ task = "build" }, { task = "build:tests" }, { task = "coverage" }, { task = "build:bench" }, { task = "bench" }]

# === Release === #

[tasks.release]
description = "Prepare And Validate A Release"
run = [{ task = "release:prepare" }, { task = "ci" }, { task = "build --profile release" }]

[tasks."release:prepare"]
description = "Prepare The Release Branch"
run = "{{vars.tools}} dokime_tools.release.run prepare"

[tasks."release:publish"]
description = "Publish A Tagged Release"
run = [{ task = "release:publish:rust" }, { task = "release:publish:python" }, { task = "release:publish:assets" }]

[tasks."release:publish:assets"]
description = "Publish Signed Release Assets"
run = [
  "{{vars.tools}} dokime_tools.release.run stage",
  "{{vars.tools}} dokime_tools.release.run validate",
  "{{vars.tools}} dokime_tools.release.run publish",
  "{{vars.tools}} dokime_tools.release.run finalize",
]

[tasks."release:publish:dry"]
description = "Dry-Run Every Publication"
run = "{{vars.tools}} dokime_tools.test.publish --rust --python packages/dokime-client"

[tasks."release:publish:python"]
description = "Publish The Python Client"
run = "uv publish --trusted-publishing always target/package/release/any/python/dokime_client-*.whl target/package/release/any/python/dokime_client-*.tar.gz"

[tasks."release:publish:rust"]
description = "Publish Rust Crates"
run = "cargo publish --locked --workspace"

[tasks."release:verify"]
description = "Verify Published Assets And Their Opted-In Installers"
run = "{{vars.tools}} dokime_tools.release.run verify"

# === Housekeeping === #

[tasks.housekeeping]
description = "Clean Owned Build Outputs And State"
run = "stkr project housekeeping"

[tasks."housekeeping:stats"]
description = "Count Source Lines"
run = "scc"
