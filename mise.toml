#
# ***

# === Settings === #

[settings]
lockfile = true

# === Tools === #

[tools]
# Languages And Runtimes
node = "26.11.1"
python = "3.15.0"
rust = { version = "1.99.0", components = "clippy,rustfmt,llvm-tools-preview" }

# Package Managers
pnpm = { version = "12.11.2", os = ["linux", "macos"] }
"npm:pnpm" = { version = "12.11.2", os = ["windows"] }
uv = "0.13.0"

# Rust Toolchain
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.148"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
protoc = "36.2"

# Formatting And Linting
taplo = "0.10.0"
"aqua:rhysd/actionlint" = "1.7.12"

# Release And Signing
git-cliff = "2.14.2"
gh = "2.102.0"
"aqua:jedisct1/minisign" = { version = "0.12", os = ["linux"] }

# Project Statistics
"aqua:boyter/scc" = "4.1.0"

# === Environment === #

[env]
UV_PROJECT_ENVIRONMENT = "{{config_root}}/.venv"
TMPDIR = "{{config_root}}/target/tmp"

# === Variables === #

[vars]
platform = "{% if os() == 'windows' %}windows{% else %}linux{% endif %}"
python = "uv run --locked --project tools/python"
tools = "uv run --locked --project tools/python python -m"
lane = "uv run --locked --project tools/python python -m dokime_tools.test.run test"

# === Prepare === #

[tasks.prepare]
description = "Prepare Tools And Inputs"
run = [
  'python -c "from pathlib import Path; Path(\"target/tmp\").mkdir(parents=True, exist_ok=True)"',
  "uv sync --locked --all-groups --no-install-package dokime",
  "pnpm --dir crates/dokime-gui install --frozen-lockfile",
]

[tasks."prepare:report"]
description = "Prepare The Embedded Report Viewer"
depends = ["prepare"]
run = "{{vars.tools}} dokime_tools.build.frontend report"

# === Format === #

[tasks.format]
description = "Format Every Language"
usage = 'flag "--check"'
depends = [
  "format:toml {% if usage.check %}--check{% endif %}",
  "format:rust {% if usage.check %}--check{% endif %}",
  "format:python {% if usage.check %}--check{% endif %}",
  "format:typescript {% if usage.check %}--check{% endif %}",
]

[tasks."format:python"]
description = "Format Python"
usage = 'flag "--check"'
run = [
  "{{vars.python}} ruff format packages/dokime{% if usage.check %} --check{% endif %}",
  "{{vars.python}} ruff format tools/python{% if usage.check %} --check{% endif %}",
]

[tasks."format:rust"]
description = "Format Rust"
usage = 'flag "--check"'
run = "cargo fmt --all{% if usage.check %} --check{% endif %}"

[tasks."format:toml"]
description = "Format TOML"
usage = 'flag "--check"'
run = "git ls-files -z -- '*.toml' | xargs -0 taplo fmt --option column_width=140{% if usage.check %} --check{% endif %}"

[tasks."format:typescript"]
description = "Format TypeScript"
depends = ["prepare"]
usage = 'flag "--check"'
run = "pnpm --dir crates/dokime-gui exec biome format{% if usage.check %}{% else %} --write{% endif %} ."

# === Lint === #

[tasks.lint]
description = "Lint Every Language"
depends = ["lint:rust", "lint:python", "lint:typescript"]

[tasks."lint:python"]
description = "Lint Python"
run = ["{{vars.python}} ruff check packages/dokime", "{{vars.python}} ruff check tools/python"]

[tasks."lint:rust"]
description = "Lint Rust"
depends = ["prepare:report"]
run = "cargo clippy --locked --workspace --all-targets -- -D warnings"

[tasks."lint:typescript"]
description = "Lint TypeScript"
depends = ["prepare"]
run = "pnpm --dir crates/dokime-gui exec biome lint ."

# === Check === #

[tasks.check]
description = "Check Every Language And Conventions"
run = [{ task = "check:rust" }, { task = "check:python" }, { task = "check:typescript" }]

[tasks."check:python"]
description = "Check Python"
depends = ["prepare"]
run = ["{{vars.python}} pyright --project packages/dokime/pyproject.toml", "{{vars.python}} pyright --project tools/python/pyproject.toml"]

[tasks."check:rust"]
description = "Check Rust"
depends = ["prepare:report"]
run = [
  'python -c "from pathlib import Path; Path(\"target/contracts\").mkdir(parents=True, exist_ok=True)"',
  "cargo check --locked --workspace --all-targets --message-format json-render-diagnostics > target/contracts/check.jsonl",
  "cargo check --locked -p dokime-gui --lib --no-default-features",
  "cargo check --locked -p dokime-domain --target wasm32-unknown-unknown",
  "{{vars.tools}} dokime_tools.prepare.bindings --build-json target/contracts/check.jsonl --check",
  "node crates/dokime-gui/tools/bindings.mjs target/contracts/check.jsonl --check",
]

[tasks."check:typescript"]
description = "Check TypeScript"
depends = ["prepare"]
run = "pnpm --dir crates/dokime-gui run typecheck"

# === Build === #

[tasks.build]
description = "Build Binaries, Bundles, Frontend, Wheel And The Test Archive"
usage = 'flag "--profile <profile>" default="dev"'
run = [
  { task = "build:rust --profile {{usage.profile}}" },
  { task = "build:typescript --profile {{usage.profile}}" },
  { task = "build:python --profile {{usage.profile}}" },
  "{{vars.tools}} dokime_tools.build.run stamp --profile {{usage.profile}}",
]

[tasks."build:python"]
description = "Build The Python Client Wheel"
depends = ["prepare"]
usage = 'flag "--profile <profile>" default="dev"'
run = "{{vars.tools}} dokime_tools.build.run python --profile {{usage.profile}}"

[tasks."build:rust"]
description = "Build The Workspace Archive, Executables And Plugin Bundle"
depends = ["prepare"]
usage = 'flag "--profile <profile>" default="dev"'
run = "{{vars.tools}} dokime_tools.build.run rust --profile {{usage.profile}}"

[tasks."build:typescript"]
description = "Build The GUI Bindings And Frontend"
depends = ["prepare"]
usage = 'flag "--profile <profile>" default="dev"'
run = "{{vars.tools}} dokime_tools.build.run typescript --profile {{usage.profile}}"

# === Dev === #

[tasks.dev]
description = "Start The Native Desktop Shell With An Owned Local Backend And The OBC Plugin"
depends = ["prepare:report"]
env.DOKIME_PLUGINS_DIR = "{{config_root}}/target/debug/plugins"
run = [
  'python -c "from pathlib import Path; [Path(p).mkdir(parents=True, exist_ok=True) for p in (\"target/contracts\", \"target/debug/plugins\")]"',
  "cargo build --locked -p dokime-server --bin dokime-server --message-format json-render-diagnostics > target/contracts/dev.jsonl",
  "node crates/dokime-gui/tools/bindings.mjs target/contracts/dev.jsonl",
  "cargo run --locked -p cargo-dokime -- build --package obc-plugin --output target/debug/plugins/obc-plugin.dokime",
  "pnpm --dir crates/dokime-gui run tauri:dev",
]

# === Test === #

[tasks.test]
description = "Test Every Layer"
usage = 'flag "--profile <profile>" default="dev"'
run = [
  { task = "test:unit --profile {{usage.profile}}" },
  { task = "test:integration --profile {{usage.profile}}" },
  { task = "test:acceptance --profile {{usage.profile}}" },
  { task = "test:system --profile {{usage.profile}}" },
]

[tasks."test:unit"]
description = "Test Unit Layer"
usage = 'flag "--profile <profile>" default="dev"'
run = [{ task = "test:unit:rust --profile {{usage.profile}}" }]

[tasks."test:unit:rust"]
description = "Test Unit Rust"
usage = 'flag "--profile <profile>" default="dev"'
run = "{{vars.lane}} --profile {{usage.profile}} --category unit --language rust"

[tasks."test:integration"]
description = "Test Integration Layer"
usage = 'flag "--profile <profile>" default="dev"'
run = [
  { task = "test:integration:rust --profile {{usage.profile}}" },
  { task = "test:integration:python --profile {{usage.profile}}" },
  { task = "test:integration:typescript --profile {{usage.profile}}" },
]

[tasks."test:integration:python"]
description = "Test Integration Python"
usage = 'flag "--profile <profile>" default="dev"'
run = [
  "{{vars.tools}} dokime_tools.prepare.wheel --profile {{usage.profile}}",
  "{{vars.lane}} --profile {{usage.profile}} --category integration --language python --project packages/dokime",
]

[tasks."test:integration:rust"]
description = "Test Integration Rust"
usage = 'flag "--profile <profile>" default="dev"'
run = "{{vars.lane}} --profile {{usage.profile}} --category integration --language rust"

[tasks."test:integration:typescript"]
description = "Test Integration TypeScript"
usage = 'flag "--profile <profile>" default="dev"'
run = "{{vars.lane}} --profile {{usage.profile}} --category integration --language typescript --project crates/dokime-gui -- node ./node_modules/vitest/vitest.mjs run --reporter=default --reporter=junit --outputFile.junit={junit} --testTimeout={timeout_ms}"

[tasks."test:acceptance"]
description = "Test Acceptance Layer"
usage = 'flag "--profile <profile>" default="dev"'
run = [{ task = "test:acceptance:rust --profile {{usage.profile}}" }, { task = "test:acceptance:python --profile {{usage.profile}}" }]

[tasks."test:acceptance:python"]
description = "Test Acceptance Python"
usage = 'flag "--profile <profile>" default="dev"'
run = [
  "{{vars.tools}} dokime_tools.prepare.wheel --profile {{usage.profile}}",
  "{{vars.lane}} --profile {{usage.profile}} --category acceptance --language python --project packages/dokime",
]

[tasks."test:acceptance:rust"]
description = "Test Acceptance Rust"
usage = 'flag "--profile <profile>" default="dev"'
run = "{{vars.lane}} --profile {{usage.profile}} --category acceptance --language rust"

[tasks."test:system"]
description = "Test System Layer"
usage = 'flag "--profile <profile>" default="dev"'
run = [{ task = "test:system:rust --profile {{usage.profile}}" }, { task = "test:system:typescript --profile {{usage.profile}}" }]

[tasks."test:system:rust"]
description = "Test System Rust"
usage = 'flag "--profile <profile>" default="dev"'
run = "{{vars.lane}} --profile {{usage.profile}} --category system --language rust"

[tasks."test:system:typescript"]
description = "Test System TypeScript"
usage = 'flag "--profile <profile>" default="dev"'
run = "{{vars.lane}} --profile {{usage.profile}} --category system --language typescript --project crates/dokime-gui -- node e2e/native-desktop.mjs --junit {junit}"

[tasks."test:verify"]
description = "Verify The Evidence Of One Tree"
run = "{{vars.tools}} dokime_tools.test.run verify"

[tasks.coverage]
description = "Measure Coverage Over Instrumented Lanes"
run = ["{{vars.tools}} dokime_tools.test.run coverage --language rust", "{{vars.tools}} dokime_tools.test.run coverage --language python"]

# === Bench === #

[tasks.bench]
description = "Measure Every Bench Layer"
run = [{ task = "bench:unit:rust" }, { task = "bench:integration:rust" }, { task = "bench:system:rust" }]

[tasks."bench:integration:rust"]
description = "Bench Integration Rust"
run = "{{vars.tools}} dokime_tools.test.run bench --category integration --language rust"

[tasks."bench:system:rust"]
description = "Bench System Rust"
run = "{{vars.tools}} dokime_tools.test.run bench --category system --language rust"

[tasks."bench:unit:rust"]
description = "Bench Unit Rust"
run = "{{vars.tools}} dokime_tools.test.run bench --category unit --language rust"

# === Docs === #

# === Package === #

# === CI === #

[tasks.ci]
description = "Run The CI Flow Locally"
run = [
  { task = "format --check" },
  { task = "lint" },
  { task = "check" },
  { task = "build" },
  { task = "test" },
  { task = "test:verify" },
  { task = "release:publish:dry" },
]

[tasks."ci:nightly"]
description = "Run The Nightly Coverage And Bench Flow"
run = [{ task = "build" }, { task = "coverage" }, { task = "build --profile bench" }, { task = "bench" }]

# === Release === #

[tasks.release]
description = "Prepare And Validate A Release"
run = [{ task = "release:prepare" }, { task = "ci" }, { task = "build --profile release" }]

[tasks."release:prepare"]
description = "Prepare The Release Branch"
run = "{{vars.tools}} dokime_tools.release.run prepare"

[tasks."release:publish"]
description = "Publish A Tagged Release"
run = [{ task = "release:publish:rust" }, { task = "release:publish:python" }, { task = "release:publish:assets" }]

[tasks."release:publish:assets"]
description = "Publish Signed Release Assets"
run = [
  "{{vars.tools}} dokime_tools.release.run stage",
  "{{vars.tools}} dokime_tools.release.run validate",
  "{{vars.tools}} dokime_tools.release.run publish",
  "{{vars.tools}} dokime_tools.release.run finalize",
]

[tasks."release:publish:dry"]
description = "Dry-Run Every Publication"
run = "cargo publish --locked --workspace --dry-run"

[tasks."release:publish:python"]
description = "Publish The Python Client"
run = "uv publish --trusted-publishing always dist/build/{{vars.platform}}/python/*"

[tasks."release:publish:rust"]
description = "Publish Rust Crates"
run = "cargo publish --locked --workspace"

# === Housekeeping === #

[tasks.housekeeping]
description = "Clean Owned Build Outputs And State"
run = "stkr project housekeeping"

[tasks."housekeeping:stats"]
description = "Count Source Lines"
run = "scc"
