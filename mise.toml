# ***
#
# Dokime
#
# SPDX-License-Identifier: Apache-2.0
#
# ***

# === Settings === #

[settings]
jobs = 1
lockfile = true

# === Tools === #

[tools]
# Languages and Runtimes
go = "1.27.3"
node = "26.11.1"
powershell = { version = "7.6.7", os = ["windows"] }
python = "3.15.0"
rust = { version = "1.99.0", components = "clippy,rustfmt,llvm-tools", profile = "minimal", targets = "wasm32-unknown-unknown" }

# Package Managers
pnpm = "12.11.2"
uv = "0.13.7"

# Rust Toolchain
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.148"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
"github:bnjbvr/cargo-machete" = "0.9.2"
sccache = "0.19.0"

# Formatting and Linting
"aqua:koalaman/shellcheck" = "0.11.0"
"go:github.com/rhysd/actionlint/cmd/actionlint" = "v1.7.13-0.20260417151945-fd33e9f582a0"
taplo = "0.10.0"

# Protocols and Code Generation
protoc = "36.2"

# Release and Signing
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"aqua:anchore/syft" = "1.57.0"
"aqua:rustsec/rustsec/cargo-audit" = "0.22.2"
git-cliff = "2.14.2"
"github:CycloneDX/cyclonedx-rust-cargo" = "cargo-cyclonedx-0.5.9"
"github:EmbarkStudios/cargo-about" = "0.9.3"
"github:rust-secure-code/cargo-auditable" = "0.7.7"
minisign = "0.12"

# Project Statistics
"aqua:boyter/scc" = "4.1.0"

# === Environment === #

[env]
RUSTC_WRAPPER = "{{ get_env(name='RUSTC_WRAPPER', default='') if get_env(name='CI', default='') else get_env(name='RUSTC_WRAPPER', default='sccache') }}"
SCCACHE_DIR = "{{ get_env(name='SCCACHE_DIR', default='') if get_env(name='CI', default='') else (get_env(name='LOCALAPPDATA', default=env.HOME ~ '/AppData/Local') if os() == 'windows' else get_env(name='XDG_CACHE_HOME', default=env.HOME ~ '/.cache')) ~ '/sccache' }}"
SCCACHE_CACHE_SIZE = "{{ get_env(name='SCCACHE_CACHE_SIZE', default='') if get_env(name='CI', default='') else '20G' }}"
PYTHONDONTWRITEBYTECODE = "1"

# === Variables === #

[vars]
rust_desktop_features = "tauri/custom-protocol"
rust_plugin_features = "plugin-host/runtime"
rust_release_features = "dokime-server/media-native"
rust_extended_features = "dokime/fault-injection,dokime-server/fault-injection"
python = "uv run --no-sync --project tools/python"
tools = "uv run --no-sync --project tools/python python -m"
lane = "uv run --no-sync --project tools/python python -m dokime_tools.test.run test"

# === Prepare === #

[tasks."prepare"]
description = "Prepare Tools and Inputs"
usage = 'flag "--refresh-lock" help="Refresh the Python Workspace Lock Before Synchronizing"'
run = [
  "{% if usage.refresh_lock %}uv lock{% endif %}",
  "uv sync --locked --all-groups",
  "pnpm --dir crates/dokime-gui install --frozen-lockfile",
]

[tasks."prepare:desktop"]
hide = true
description = "Prepare Native Desktop Automation"
run = "{{vars.tools}} dokime_tools.ci.bootstrap --desktop"

# === Generate === #

[tasks."generate"]
description = "Generate Clients from Contracts"
usage = 'flag "--check"; flag "--protocol" help="Generate Checked-In Protocol Bindings Only"'
run = """
{% if usage.protocol and usage.check %}
mise run test -- --package dokime-protocol --target integration
{% elif usage.protocol %}
cargo run --locked --package dokime-protocol --example generate
{% else %}
{{vars.tools}} dokime_tools.prepare.generated --generate{% if usage.check %} --check{% endif %}
{% endif %}
"""

# === Format === #

[tasks.format]
description = "Format Every Language"
run = "{{vars.tools}} dokime_tools.ci.tasks format"

[tasks."format:python"]
hide = true
description = "Format Python"
usage = 'flag "--check"'
run = [
  "{{vars.python}} ruff check --select I,F401,PYI{% if not usage.check %} --fix{% endif %} sdk/python",
  "{{vars.python}} ruff format sdk/python{% if usage.check %} --check{% endif %}",
  "{{vars.python}} ruff format tools/python{% if usage.check %} --check{% endif %}",
  "{{vars.python}} ruff format --no-force-exclude tools/python/src/dokime_tools/test tools/python/src/dokime_tools/release{% if usage.check %} --check{% endif %}",
]

[tasks."format:rust"]
hide = true
description = "Format Rust"
usage = 'flag "--check"'
run = "cargo fmt --all{% if usage.check %} --check{% endif %}"

[tasks."format:toml"]
hide = true
description = "Format TOML"
usage = 'flag "--check"'
run = "git ls-files -z -- '*.toml' | xargs -0 taplo fmt --config tools/config/taplo.toml --option column_width=140{% if usage.check %} --check{% endif %}"
run_windows = '''pwsh -NoProfile -Command "taplo fmt --config tools/config/taplo.toml --option column_width=140{% if usage.check %} --check{% endif %} -- @(git ls-files -- '*.toml')"'''

[tasks."format:typescript"]
hide = true
description = "Format TypeScript"
usage = 'flag "--check"'
run = "pnpm --dir crates/dokime-gui exec biome format{% if usage.check %}{% else %} --write{% endif %} ."

# === Lint === #

[tasks.lint]
description = "Lint Every Language"
run = "{{vars.tools}} dokime_tools.ci.tasks lint"

[tasks."lint:python"]
hide = true
description = "Lint Python"
run = [
  "{{vars.python}} ruff check sdk/python",
  "{{vars.python}} ruff check tools/python",
  "{{vars.python}} ty check --project tools/python",
  "{{vars.python}} ruff check --no-force-exclude tools/python/src/dokime_tools/test/run.py tools/python/src/dokime_tools/test/traces.py tools/python/src/dokime_tools/test/pytest.py tools/python/src/dokime_tools/test/schedule.py tools/python/src/dokime_tools/test/archive.py tools/python/src/dokime_tools/test/nextest.py tools/python/src/dokime_tools/test/wheel.py tools/python/src/dokime_tools/test/stubs.py",
  '{{vars.python}} ty check --project tools/python --config "src.exclude = []" tools/python/src/dokime_tools/test/run.py tools/python/src/dokime_tools/test/traces.py tools/python/src/dokime_tools/test/pytest.py tools/python/src/dokime_tools/test/schedule.py tools/python/src/dokime_tools/test/archive.py tools/python/src/dokime_tools/test/nextest.py',

]

[tasks."lint:rust"]
hide = true
description = "Lint Rust"
usage = 'flag "--package <package>" help="Limit Clippy to One Consumer Package"'
run = [
  "{% if usage.package %}{{vars.tools}} dokime_tools.build.lint -- --locked --package {{usage.package}} --all-targets --profile dev{% else %}{{vars.tools}} dokime_tools.build.cargo focused clippy --locked --workspace --exclude dokime-gui --all-targets --profile dev --features {{vars.rust_plugin_features}},dokime-runtime/testing{% endif %}",
  "{% if not usage.package %}{{vars.tools}} dokime_tools.build.lint -- --locked --workspace --profile dev --features {{vars.rust_plugin_features}},{{vars.rust_desktop_features}}{% endif %}",
  "{% if not usage.package %}{{vars.tools}} dokime_tools.build.cargo focused clippy --locked --workspace --exclude dokime-gui --bins --benches --profile bench --features plugin-obc/benchmarks,{{vars.rust_plugin_features}}{% endif %}",
]
env = { CARGO_BUILD_WARNINGS = "deny" }

[tasks."lint:typescript"]
hide = true
description = "Lint TypeScript"
run = "pnpm --dir crates/dokime-gui exec biome lint ."

# === Check === #

[tasks.screenshots]
description = "Capture Product Screenshots"
run = "{{vars.tools}} dokime_tools.ci.tasks screenshots"

[tasks.check]
description = "Check Languages and Repository"
run = "{{vars.tools}} dokime_tools.ci.tasks check"

[tasks."check:python"]
hide = true
description = "Check Python"
run = [{ task = "format:python --check" }, { task = "lint:python" }, { task = "test:python:integration --project tools/python" }]

[tasks."check:python:bindings"]
hide = true
description = "Check Built Python Bindings And Stubs"
usage = 'flag "--profile <profile>" default="dev"'
run = [
  "{{vars.python}} ty check --project sdk/python --exit-zero-on-warning",
  "{{vars.tools}} dokime_tools.test.wheel --profile {{usage.profile}} --stubs",
]

[tasks."check:repository"]
hide = true
description = "Check Repository Configuration"
run = [{ task = "format:toml --check" }, "{{vars.tools}} dokime_tools.ci.mise", "shellcheck --version", "actionlint"]

[tasks."check:rust"]
hide = true
description = "Check Rust"
run = [{ task = "format:rust --check" }, { task = "lint:rust" }, "cargo-machete --skip-target-dir"]

[tasks."check:rust:supply"]
hide = true
description = "Check Dependency Advisories, Licenses and Sources"
run = "{{vars.tools}} dokime_tools.release.sbom --check-supply"

[tasks."check:typescript"]
hide = true
description = "Check TypeScript Formatting and Lint Without Type Checking"
run = [{ task = "format:typescript --check" }, { task = "lint:typescript" }]

[tasks."check:typescript:generated"]
hide = true
description = "Type Check the GUI Against Freshly Generated Modules, Never Staged Build Output"
depends = ["generate"]
usage = 'flag "--profile <profile>" default="dev" help="Profile Label for Callers That Pass One; Generation Always Uses the Dev Compiler Profile"'
run = [
  "{{vars.tools}} dokime_tools.prepare.resources --check",
  "pnpm --dir crates/dokime-gui run typecheck",
  "pnpm --dir crates/dokime-gui exec biome lint --config-path=biome.json --vcs-use-ignore-file=false ../../target/generated/typescript",
  "node crates/dokime-gui/tools/smoke.mjs",
]

# === Build === #

[tasks.build]
description = "Build Products or Focused Packages"
run = "{{vars.tools}} dokime_tools.ci.tasks build"

[tasks."build:product"]
hide = true
description = "Build Shipping Binaries, Bundles And Frontend"
usage = 'flag "--profile <profile>" default="dev"'
run = [
  "{{vars.tools}} dokime_tools.build.organization --icons",
  "{{vars.tools}} dokime_tools.prepare.resources",
  { task = "build:rust --profile {{usage.profile}}" },
  { task = "build:typescript --profile {{usage.profile}}" },
  { task = "build:rust:desktop --profile {{usage.profile}}" },
]

[tasks."build:python"]
hide = true
description = "Build The Native Python Wheel"
usage = 'flag "--profile <profile>" default="dev"'
run = "{{vars.tools}} dokime_tools.release.sbom --auditable {{usage.profile}} -- python -m dokime_tools.build.python --profile {{usage.profile}}"

[tasks."build:python:fixtures"]
hide = true
description = "Build Native Python Client Fixtures"
usage = 'flag "--profile <profile>" default="dev"'
run = "{{vars.tools}} dokime_tools.build.python_fixtures --profile {{usage.profile}}"

[tasks."build:rust"]
hide = true
description = "Build Shipping Native Executables and Plugin Bundle"
usage = 'flag "--profile <profile>" default="dev"'
run = "{{vars.tools}} dokime_tools.release.sbom --auditable {{usage.profile}} -- python -m dokime_tools.build.rust --profile {{usage.profile}}"

[tasks."build:rust:bench"]
hide = true
description = "Build Benchmarks and Their Matching Native Fixtures"
usage = 'flag "--binary <binary>" help="Build One Benchmark Executable and Its Native Fixtures"'
run = "{{vars.tools}} dokime_tools.build.rust.bench {% if usage.binary %}--binary {{usage.binary}}{% endif %}"

[tasks."build:rust:contracts"]
hide = true
description = "Verify Rust Compile Contracts in Their Build Tree"
usage = 'flag "--profile <profile>" default="dev"'
run = "{{vars.tools}} dokime_tools.build.rust.contracts --profile {{usage.profile}}"

[tasks."build:rust:desktop"]
hide = true
description = "Build the Desktop with Its Compiled Frontend"
usage = 'flag "--profile <profile>" default="dev"'
run = "{{vars.tools}} dokime_tools.release.sbom --auditable {{usage.profile}} -- python -m dokime_tools.build.rust.desktop --profile {{usage.profile}}"

[tasks."build:rust:tests"]
hide = true
description = "Build Independent Test Archive and Compile Contracts"
usage = 'flag "--profile <profile>" default="dev"'
run = [
  "{{vars.tools}} dokime_tools.build.rust.tests --profile {{usage.profile}}",
  { task = "build:rust:contracts --profile {{usage.profile}}" },
]

[tasks."build:typescript"]
hide = true
description = "Build the Generated GUI Client and Frontend"
usage = 'flag "--profile <profile>" default="dev"'
run = "{{vars.tools}} dokime_tools.build.typescript --profile {{usage.profile}}"

# === Dev === #

[tasks."dev"]
description = "Start the Desktop with an Owned Backend"
depends = ["generate"]
env.DOKIME_PLUGINS_DIR = "{{config_root}}/target/debug/plugins"
run = [
  "{{vars.tools}} dokime_tools.prepare.resources",
  'python -c "from pathlib import Path; [Path(p).mkdir(parents=True, exist_ok=True) for p in (\"target/contracts\", \"target/debug/plugins\")]"',
  "cargo build --locked -p dokime-cli -p cargo-dokime -p plugin-host --bins --message-format json-render-diagnostics > target/contracts/dev.jsonl",
  "cargo run --locked -p cargo-dokime -- sidecar build --package plugin-host --output target/debug/plugins/plugin-host.dokime",
  "cargo run --locked -p cargo-dokime -- sidecar build --package plugin-obc --output target/debug/plugins/plugin-obc.dokime",
  "pnpm --dir crates/dokime-gui run tauri:dev --build-json target/contracts/dev.jsonl",
]

# === Test === #

[tasks.test]
description = "Test Layers or Focused Targets"
run = "{{vars.tools}} dokime_tools.ci.tasks test"

[tasks."test:python"]
hide = true
description = "Test Python Layers"
usage = '''
flag "--profile <profile>" default="dev"
flag "--prepared"
'''
depends = [
  "test:python:integration --profile {{usage.profile}} --project tools/python{% if usage.prepared %} --prepared{% endif %}",
  "test:python:unit --profile {{usage.profile}}{% if usage.prepared %} --prepared{% endif %}",
  "test:python:integration --profile {{usage.profile}}{% if usage.prepared %} --prepared{% endif %}",
  "test:python:acceptance --profile {{usage.profile}}{% if usage.prepared %} --prepared{% endif %}",
  "test:python:system --profile {{usage.profile}}{% if usage.prepared %} --prepared{% endif %}",
]

[tasks."test:python:unit"]
hide = true
description = "Test Unit Python"
usage = '''
flag "--profile <profile>" default="dev"
flag "--prepared"
flag "--select <select>"
'''
run = [
  '''{% if usage.prepared %}{{vars.tools}} dokime_tools.test.schedule --lane --profile {{usage.profile}} --category unit --language python{% else %}{{vars.tools}} dokime_tools.test.python --profile {{usage.profile}} --category unit {% if usage.select %}-- -k "{{usage.select}}"{% endif %}{% endif %}''',
]

[tasks."test:python:integration"]
hide = true
description = "Test Integration Python"
usage = '''
flag "--profile <profile>" default="dev"
flag "--prepared"
flag "--project <project>" default="sdk/python"
flag "--select <select>"
'''
run = [
  '''{% if usage.prepared %}{{vars.tools}} dokime_tools.test.schedule --lane --profile {{usage.profile}} --category integration --language python --project {{usage.project}}{% elif usage.project == "tools/python" %}{{vars.python}} python -m unittest discover -s tools/python/tests/integration {% if usage.select %}-k "{{usage.select}}"{% endif %}{% else %}{{vars.tools}} dokime_tools.test.python --profile {{usage.profile}} --category integration {% if usage.select %}-- -k "{{usage.select}}"{% endif %}{% endif %}''',
]

[tasks."test:python:acceptance"]
hide = true
description = "Test Acceptance Python"
usage = '''
flag "--profile <profile>" default="dev"
flag "--prepared"
flag "--artifacts <artifacts>" help="Use An Explicit Native Client Fixture Root"
flag "--select <select>" help="Run Matching Installed-Wheel Stories"
'''
run = [
  '''{% if usage.prepared %}{{vars.tools}} dokime_tools.test.schedule --lane --profile {{usage.profile}} --category acceptance --language python{% else %}{{vars.tools}} dokime_tools.test.python --profile {{usage.profile}} --category acceptance -- --build-profile {{usage.profile}} {% if usage.artifacts %}--artifacts "{{usage.artifacts}}"{% endif %} {% if usage.select %}-k "{{usage.select}}"{% endif %}{% endif %}''',
]

[tasks."test:python:system"]
hide = true
description = "Test System Python"
usage = '''
flag "--profile <profile>" default="dev"
flag "--prepared"
flag "--artifacts <artifacts>" help="Use an Explicit Native Fixture Root"
flag "--select <select>" help="Run Matching System Stories"
'''
run = [
  '''{% if usage.prepared %}{{vars.tools}} dokime_tools.test.schedule --lane --profile {{usage.profile}} --category system --language python{% else %}{{vars.tools}} dokime_tools.test.python --profile {{usage.profile}} --category system -- --build-profile {{usage.profile}} {% if usage.artifacts %}--artifacts "{{usage.artifacts}}"{% endif %} {% if usage.select %}-k "{{usage.select}}"{% endif %}{% endif %}''',
]

[tasks."test:python:coverage"]
hide = true
description = "Measure Python Coverage of the SDK Python Modules; Native PyO3 Code Is Excluded"
usage = 'flag "--profile <profile>" default="dev"'
run = [
  "{{vars.tools}} dokime_tools.test.archive --profile {{usage.profile}} --install-wheels",
  "{{vars.tools}} dokime_tools.test.run coverage --language python --profile {{usage.profile}} --project sdk/python",
]

[tasks."test:python:wheel"]
hide = true
description = "Import The Installed Native Wheel"
usage = '''
flag "--profile <profile>" default="dev"
flag "--stubs" help="Check All Shipped Stubs Against The Installed Extension"
'''
run = "{{vars.tools}} dokime_tools.test.wheel --profile {{usage.profile}}{% if usage.stubs %} --stubs{% endif %}"

[tasks."test:rust"]
hide = true
description = "Test Rust Layers"
usage = '''
flag "--profile <profile>" default="dev"
flag "--prepared"
'''
depends = [
  "test:rust:unit --profile {{usage.profile}}{% if usage.prepared %} --prepared{% endif %}",
  "test:rust:integration --profile {{usage.profile}}{% if usage.prepared %} --prepared{% endif %}",
  "test:rust:acceptance --profile {{usage.profile}}{% if usage.prepared %} --prepared{% endif %}",
  "test:rust:system --profile {{usage.profile}}{% if usage.prepared %} --prepared{% endif %}",
]

[tasks."test:rust:unit"]
hide = true
description = "Test Unit Rust"
usage = '''
flag "--profile <profile>" default="dev"
flag "--prepared"
flag "--select <select>" help="Narrow the Nextest Filterset"
'''
run = [
  '''{% if usage.prepared %}{{vars.tools}} dokime_tools.test.schedule --lane --profile {{usage.profile}} --category unit --language rust{% else %}{{vars.lane}} --profile {{usage.profile}} --category unit --language rust {% if usage.select %}-- -E "{{usage.select}}"{% endif %}{% endif %}''',
]

[tasks."test:rust:integration"]
hide = true
description = "Test Integration Rust"
usage = '''
flag "--profile <profile>" default="dev"
flag "--prepared"
flag "--select <select>" help="Narrow the Nextest Filterset"
'''
run = [
  '''{% if usage.prepared %}{{vars.tools}} dokime_tools.test.schedule --lane --profile {{usage.profile}} --category integration --language rust{% else %}{{vars.lane}} --profile {{usage.profile}} --category integration --language rust -- -E "not binary_id(dokime-macros::compile)" {% if usage.select %}-E "{{usage.select}}"{% endif %}{% endif %}''',
]

[tasks."test:rust:acceptance"]
hide = true
description = "Test Acceptance Rust"
usage = '''
flag "--profile <profile>" default="dev"
flag "--prepared"
flag "--select <select>" help="Narrow the Nextest Filterset"
'''
run = [
  '''{% if usage.prepared %}{{vars.tools}} dokime_tools.test.schedule --lane --profile {{usage.profile}} --category acceptance --language rust{% else %}{{vars.tools}} dokime_tools.prepare.generated --profile {{usage.profile}}{% endif %}''',
  '''{% if not usage.prepared %}{{vars.tools}} dokime_tools.test.archive --install-wheels --profile {{usage.profile}}{% endif %}''',
  '''{% if not usage.prepared %}{{vars.lane}} --profile {{usage.profile}} --category acceptance --language rust {% if usage.select %}-- -E "{{usage.select}}"{% endif %}{% endif %}''',
]

[tasks."test:rust:system"]
hide = true
description = "Test System Rust"
usage = '''
flag "--profile <profile>" default="dev"
flag "--prepared"
flag "--select <select>" help="Narrow the Nextest Filterset"
'''
run = [
  '''{% if usage.prepared %}{{vars.tools}} dokime_tools.test.schedule --lane --profile {{usage.profile}} --category system --language rust{% else %}{{vars.tools}} dokime_tools.test.archive --install-wheels --profile {{usage.profile}}{% endif %}''',
  '''{% if not usage.prepared %}{{vars.lane}} --profile {{usage.profile}} --category system --language rust {% if usage.select %}-- -E "{{usage.select}}"{% endif %}{% endif %}''',
]

[tasks."test:rust:coverage"]
hide = true
description = "Measure Rust Coverage over Instrumented Lanes"
usage = 'flag "--profile <profile>" default="dev"'
run = [
  "{{vars.tools}} dokime_tools.prepare.generated --profile {{usage.profile}}",
  "{{vars.tools}} dokime_tools.test.archive --install-wheels --profile {{usage.profile}}",
  "{{vars.tools}} dokime_tools.test.run coverage --language rust --profile {{usage.profile}} -- --features \"{{vars.rust_plugin_features}},dokime-runtime/testing,dokime-gui/testing{% if usage.profile == 'release' %},{{vars.rust_release_features}}{% endif %}\" -E \"not binary_id(dokime-macros::compile)\"",
]

[tasks."test:rust:starter"]
hide = true
description = "Prove the Standalone Starter in Nightly Validation"
usage = 'flag "--profile <profile>" default="release"'
run = "{{vars.tools}} dokime_tools.test.rust.starter --profile {{usage.profile}}"

[tasks."test:typescript"]
hide = true
description = "Test TypeScript Layers"
usage = '''
flag "--profile <profile>" default="dev"
flag "--prepared"
'''
depends = [
  "test:typescript:unit --profile {{usage.profile}}{% if usage.prepared %} --prepared{% endif %}",
  "test:typescript:integration --profile {{usage.profile}}{% if usage.prepared %} --prepared{% endif %}",
  "test:typescript:system --profile {{usage.profile}}{% if usage.prepared %} --prepared{% endif %}",
]

[tasks."test:typescript:unit"]
hide = true
description = "Test Unit TypeScript Against Freshly Generated Modules Without Rewriting Sources"

usage = '''
flag "--profile <profile>" default="dev"
flag "--prepared"
flag "--select <select>"
'''
run = [
  "{% if not usage.prepared %}{{vars.tools}} dokime_tools.prepare.generated --generate --check{% endif %}",
  '''{% if usage.prepared %}{{vars.tools}} dokime_tools.test.schedule --lane --profile {{usage.profile}} --category unit --language typescript{% endif %}''',
  '''{% if not usage.prepared %}{{vars.lane}} --profile {{usage.profile}} --category unit --language typescript --project crates/dokime-gui -- node ./node_modules/vitest/vitest.mjs run {% if usage.select %}{{usage.select}}{% else %}tests/unit{% endif %} --reporter=default --reporter=junit --outputFile.junit={junit} --testTimeout={timeout_ms}{% endif %}''',
]

[tasks."test:typescript:integration"]
hide = true
description = "Test Integration TypeScript Against Freshly Generated Modules Without Rewriting Sources"

usage = '''
flag "--profile <profile>" default="dev"
flag "--prepared"
flag "--select <select>"
'''
run = [
  "{% if not usage.prepared %}{{vars.tools}} dokime_tools.prepare.generated --generate --check{% endif %}",
  '''{% if usage.prepared %}{{vars.tools}} dokime_tools.test.schedule --lane --profile {{usage.profile}} --category integration --language typescript{% endif %}''',
  '''{% if not usage.prepared %}{{vars.lane}} --profile {{usage.profile}} --category integration --language typescript --project crates/dokime-gui -- node ./node_modules/vitest/vitest.mjs run {% if usage.select %}{{usage.select}}{% else %}tests/integration{% endif %} --reporter=default --reporter=junit --outputFile.junit={junit} --testTimeout={timeout_ms}{% endif %}''',
]

[tasks."test:typescript:system"]
hide = true
description = "Test System TypeScript"
depends = ["prepare:desktop"]
usage = '''
flag "--profile <profile>" default="dev"
flag "--prepared"
flag "--select <story>" help="Run One Native Desktop Story"
'''
run = [
  "{% if not usage.prepared %}{{vars.tools}} dokime_tools.prepare.generated --profile {{usage.profile}}{% endif %}",
  '''{% if usage.prepared %}{{vars.tools}} dokime_tools.test.schedule --lane --profile {{usage.profile}} --category system --language typescript{% endif %}''',
  '''{% if not usage.prepared %}{{vars.lane}} --profile {{usage.profile}} --category system --language typescript --project crates/dokime-gui -- node e2e/system.mjs --profile {{usage.profile}} --junit {junit} {% if usage.select %}--select {{usage.select}}{% endif %}{% endif %}''',
]

# === Bench === #

[tasks.bench]
description = "Measure Benchmark Layers"
run = "{{vars.tools}} dokime_tools.ci.tasks bench"

[tasks."bench:python:system"]
hide = true
usage = """
flag "--refresh-baseline"
flag "--select <select>"
"""
description = "Measure Python Batch Publication"
run = [
