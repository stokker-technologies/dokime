# ***
#
# Dokime
#
# SPDX-License-Identifier: Apache-2.0
#
# ***

# === Settings === #

[settings]
jobs = 1
lockfile = true

# === Tools === #

[tools]
# Languages and Runtimes
go = "1.27.3"
node = "26.11.1"
powershell = { version = "7.6.7", os = ["windows"] }
python = "3.15.0"
rust = { version = "1.99.0", components = "clippy,rustfmt,llvm-tools", profile = "minimal", targets = "wasm32-unknown-unknown" }

# Package Managers
pnpm = "12.11.2"
uv = "0.13.0"

# Rust Toolchain
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.148"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
"github:bnjbvr/cargo-machete" = "0.9.2"
sccache = "0.19.0"

# Formatting and Linting
"aqua:koalaman/shellcheck" = "0.11.0"
"go:github.com/rhysd/actionlint/cmd/actionlint" = "v1.7.13-0.20260417151945-fd33e9f582a0"
taplo = "0.10.0"

# Protocols and Code Generation
protoc = "36.2"

# Release and Signing
git-cliff = "2.14.2"
minisign = "0.12"

# Project Statistics
"aqua:boyter/scc" = "4.1.0"

# === Environment === #

[env]
RUSTC_WRAPPER = "{{ get_env(name='RUSTC_WRAPPER', default='') if get_env(name='CI', default='') else get_env(name='RUSTC_WRAPPER', default='sccache') }}"
SCCACHE_DIR = "{{ get_env(name='SCCACHE_DIR', default='') if get_env(name='CI', default='') else (get_env(name='LOCALAPPDATA', default=env.HOME ~ '/AppData/Local') if os() == 'windows' else get_env(name='XDG_CACHE_HOME', default=env.HOME ~ '/.cache')) ~ '/sccache' }}"
SCCACHE_CACHE_SIZE = "{{ get_env(name='SCCACHE_CACHE_SIZE', default='') if get_env(name='CI', default='') else '20G' }}"
CARGO_INCREMENTAL = "{{ get_env(name='CARGO_INCREMENTAL', default='') if get_env(name='CI', default='') else '0' }}"
PYTHONDONTWRITEBYTECODE = "1"

# === Variables === #

[vars]
rust_desktop_features = "tauri/custom-protocol"
rust_plugin_features = "plugin-host/runtime"
rust_release_features = "dokime-server/media-native"
rust_extended_features = "dokime/fault-injection,dokime-server/fault-injection"
python = "uv run --locked --project tools/python"
tools = "uv run --locked --project tools/python python -m"
lane = "uv run --locked --project tools/python python -m dokime_tools.test.run test"

# === Prepare === #

[tasks.prepare]
description = "Prepare Tools and Inputs"
usage = 'flag "--refresh-lock" help="Refresh the Python Workspace Lock Before Synchronizing"'
run = [
  "{% if usage.refresh_lock %}uv lock{% endif %}",
  "uv sync --locked --all-groups",
  "pnpm --dir crates/dokime-gui install --frozen-lockfile",
]

[tasks."prepare:generated"]
description = "Build the Contract Generator and Generate TypeScript Modules"
depends = ["prepare"]
usage = 'flag "--write" help="Refresh tracked clients instead of checking them"'
run = "{{vars.tools}} dokime_tools.build.machine -- python -m dokime_tools.prepare.generated --generate{% if not usage.write %} --check{% endif %}"
env.CARGO_INCREMENTAL = "0"

[tasks."prepare:bindings"]
description = "Regenerate TypeScript Contracts"
depends = ["prepare"]
run = "{{vars.tools}} dokime_tools.build.machine -- python -m dokime_tools.prepare.generated --generate"
env.CARGO_INCREMENTAL = "0"

[tasks."prepare:desktop"]
description = "Prepare Native Desktop Automation"
depends = ["prepare"]
run = "{{vars.tools}} dokime_tools.ci.bootstrap --desktop"

[tasks."prepare:organization"]
description = "Generate Default Organization and Desktop Icons"
depends = ["prepare"]
run = "{{vars.tools}} dokime_tools.build.organization --icons"

[tasks."prepare:report"]
description = "Refresh Embedded Runtime Resources"
depends = ["prepare:generated"]
run = "{{vars.tools}} dokime_tools.prepare.resources"

# === Format === #

[tasks.format]
description = "Format Every Language"
usage = 'flag "--check"'
depends = [
  "format:toml {% if usage.check %}--check{% endif %}",
  "format:rust {% if usage.check %}--check{% endif %}",
  "format:python {% if usage.check %}--check{% endif %}",
  "format:typescript {% if usage.check %}--check{% endif %}",
]

[tasks."format:python"]
description = "Format Python"
usage = 'flag "--check"'
run = [
  "{{vars.python}} ruff check --select I,F401,PYI{% if not usage.check %} --fix{% endif %} sdk/python",
  "{{vars.python}} ruff format sdk/python{% if usage.check %} --check{% endif %}",
  "{{vars.python}} ruff format tools/python{% if usage.check %} --check{% endif %}",
  "{{vars.python}} ruff format tools/python/src/dokime_tools/test/run.py tools/python/src/dokime_tools/test/traces.py{% if usage.check %} --check{% endif %}",
  "{{vars.python}} ruff format tools/python/src/dokime_tools/test/pytest.py tools/python/src/dokime_tools/test/schedule.py{% if usage.check %} --check{% endif %}",
  "{{vars.python}} ruff format tools/python/src/dokime_tools/test/archive.py tools/python/src/dokime_tools/test/nextest.py tools/python/src/dokime_tools/test/wheel.py tools/python/src/dokime_tools/test/stubs.py{% if usage.check %} --check{% endif %}",
]

[tasks."format:rust"]
description = "Format Rust"
usage = 'flag "--check"'
run = "cargo fmt --all{% if usage.check %} --check{% endif %}"

[tasks."format:toml"]
description = "Format TOML"
usage = 'flag "--check"'
run = "git ls-files -z -- '*.toml' | xargs -0 taplo fmt --option column_width=140{% if usage.check %} --check{% endif %}"
run_windows = '''pwsh -NoProfile -Command "taplo fmt --option column_width=140{% if usage.check %} --check{% endif %} -- @(git ls-files -- '*.toml')"'''

[tasks."format:typescript"]
description = "Format TypeScript"
depends = ["prepare"]
usage = 'flag "--check"'
run = "pnpm --dir crates/dokime-gui exec biome format{% if usage.check %}{% else %} --write{% endif %} ."

# === Lint === #

[tasks.lint]
description = "Lint Every Language"
depends = ["lint:python", "lint:rust", "lint:typescript"]

[tasks."lint:python"]
description = "Lint Python"
depends = ["prepare"]
run = [
  "{{vars.python}} ruff check sdk/python",
  "{{vars.python}} ruff check tools/python",
  "{{vars.python}} ruff check tools/python/src/dokime_tools/test/python.py",
  "{{vars.python}} ty check --project tools/python",
  '{{vars.python}} ruff check tools/python/src/dokime_tools/test/run.py tools/python/src/dokime_tools/test/traces.py',
  '{{vars.python}} ty check --project tools/python --config "src.exclude = []" tools/python/src/dokime_tools/test/run.py tools/python/src/dokime_tools/test/traces.py',
  '{{vars.python}} ruff check tools/python/src/dokime_tools/test/pytest.py tools/python/src/dokime_tools/test/schedule.py',
  '{{vars.python}} ty check --project tools/python --config "src.exclude = []" tools/python/src/dokime_tools/test/pytest.py tools/python/src/dokime_tools/test/schedule.py',
  '{{vars.python}} ruff check tools/python/src/dokime_tools/test/archive.py tools/python/src/dokime_tools/test/nextest.py tools/python/src/dokime_tools/test/wheel.py tools/python/src/dokime_tools/test/stubs.py',
  '{{vars.python}} ty check --project tools/python --config "src.exclude = []" tools/python/src/dokime_tools/test/archive.py tools/python/src/dokime_tools/test/nextest.py',
]

[tasks."lint:rust"]
description = "Lint Rust"
run = "{{vars.tools}} dokime_tools.build.machine -- python -m dokime_tools.build.cargo focused clippy --locked --workspace --exclude dokime-gui --all-targets --profile dev --features {{vars.rust_plugin_features}},dokime-runtime/testing"
env = { CARGO_BUILD_WARNINGS = "deny" }

[tasks."lint:typescript"]
description = "Lint TypeScript"
depends = ["prepare"]
run = "pnpm --dir crates/dokime-gui exec biome lint ."

# === Check === #

[tasks.check]
description = "Check Every Language and Conventions"
run = [{ task = "check:repository" }, { task = "check:rust" }, { task = "check:python" }, { task = "check:typescript" }]

[tasks."check:python"]
description = "Check Python"
run = [{ task = "format:python --check" }, { task = "lint:python" }, { task = "test:tooling" }]

[tasks."check:python:bindings"]
description = "Check Built Python Bindings And Stubs"
depends = ["prepare"]
usage = 'flag "--profile <profile>" default="dev"'
run = [
  "{{vars.python}} ty check --project sdk/python --exit-zero-on-warning",
  "{{vars.tools}} dokime_tools.test.wheel --profile {{usage.profile}} --stubs",
]

[tasks."check:repository"]
description = "Check Repository Configuration"
run = [{ task = "format:toml --check" }, "{{vars.tools}} dokime_tools.ci.mise", "shellcheck --version", "actionlint"]

[tasks."check:rust"]
description = "Check Rust"
run = [{ task = "format:rust --check" }, { task = "lint:rust" }, "cargo-machete --skip-target-dir"]

[tasks."check:typescript"]
description = "Check TypeScript"
run = [{ task = "format:typescript --check" }, { task = "lint:typescript" }]

[tasks."check:typescript:generated"]
description = "Check the Generated TypeScript Client"
depends = ["prepare:generated"]
usage = '''
flag "--profile <profile>" default="dev"
flag "--source" help="Check freshly prepared bindings instead of staged Product artifacts"
'''
run = [
  "{% if not usage.source %}{{vars.tools}} dokime_tools.prepare.generated --profile {{usage.profile}}{% endif %}",
  "{{vars.tools}} dokime_tools.prepare.resources --check",
  "pnpm --dir crates/dokime-gui run typecheck",
  "pnpm --dir crates/dokime-gui exec biome lint --config-path=biome.json --vcs-use-ignore-file=false ../../target/generated/typescript",
  "node crates/dokime-gui/tools/smoke.mjs",
]
env = { CARGO_INCREMENTAL = "0" }

# === Build === #

[tasks.build]
description = "Build Shipping Binaries, Bundles And Frontend"
usage = 'flag "--profile <profile>" default="dev"'
run = [
  { task = "build:rust --profile {{usage.profile}}" },
  { task = "build:typescript --profile {{usage.profile}}" },
  { task = "build:rust:desktop --profile {{usage.profile}}" },
]
env = { CARGO_INCREMENTAL = "0" }

[tasks."build:python"]
description = "Build The Native Python Wheel"
depends = ["prepare"]
usage = 'flag "--profile <profile>" default="dev"'
run = "{{vars.tools}} dokime_tools.build.machine -- python -m dokime_tools.build.python --profile {{usage.profile}}"

[tasks."build:python:fixtures"]
description = "Build Native Python Client Fixtures"
depends = ["prepare"]
usage = 'flag "--profile <profile>" default="dev"'
run = "{{vars.tools}} dokime_tools.build.machine -- python -m dokime_tools.build.python_fixtures --profile {{usage.profile}}"

[tasks."build:rust"]
description = "Build Shipping Native Executables and Plugin Bundle"
depends = ["prepare"]
usage = 'flag "--profile <profile>" default="dev"'
run = "{{vars.tools}} dokime_tools.build.machine -- python -m dokime_tools.build.rust --profile {{usage.profile}}"

[tasks."build:rust:bench"]
description = "Build Benchmarks and Their Matching Native Fixtures"
depends = ["prepare"]
usage = 'flag "--binary <binary>" help="Build One Benchmark Executable and Its Native Fixtures"'
run = "{{vars.tools}} dokime_tools.build.machine -- python -m dokime_tools.build.rust.bench {% if usage.binary %}--binary {{usage.binary}}{% endif %}"
env.CARGO_INCREMENTAL = "0"

[tasks."build:rust:compatibility"]
description = "Verify Local Extended Feature and Browser Configurations"
usage = 'flag "--profile <profile>" default="dev"'
run = "{{vars.tools}} dokime_tools.build.machine -- python -m dokime_tools.build.rust.compatibility --profile {{usage.profile}}"

env.CARGO_INCREMENTAL = "0"

[tasks."build:rust:contracts"]
description = "Verify Rust Compile Contracts in Their Build Tree"
usage = 'flag "--profile <profile>" default="dev"'
run = "{{vars.tools}} dokime_tools.build.machine -- python -m dokime_tools.build.rust.contracts --profile {{usage.profile}}"
env.CARGO_INCREMENTAL = "0"

[tasks."build:rust:desktop"]
description = "Build the Desktop with Its Compiled Frontend"
usage = 'flag "--profile <profile>" default="dev"'
run = "{{vars.tools}} dokime_tools.build.machine -- python -m dokime_tools.build.rust.desktop --profile {{usage.profile}}"

[tasks."build:rust:focused"]
description = "Compile an Explicit Local Rust Selection"
run = "{{vars.tools}} dokime_tools.build.machine -- python -m dokime_tools.build.cargo focused"

[tasks."build:rust:tests"]
description = "Build Independent Test Archive and Compile Contracts"
depends = ["prepare"]
usage = 'flag "--profile <profile>" default="dev"'
run = [
  "{{vars.tools}} dokime_tools.build.machine -- python -m dokime_tools.build.rust.tests --profile {{usage.profile}}",
  { task = "build:rust:contracts --profile {{usage.profile}}" },
]
env.CARGO_INCREMENTAL = "0"

[tasks."build:typescript"]
description = "Build the Generated GUI Client and Frontend"
depends = ["prepare"]
usage = 'flag "--profile <profile>" default="dev"'
run = "{{vars.tools}} dokime_tools.build.typescript --profile {{usage.profile}}"

# === Dev === #

[tasks.dev]
description = "Start the Native Desktop Shell with an Owned Local Backend and the OBC Plugin"
depends = ["prepare:report"]
env.DOKIME_PLUGINS_DIR = "{{config_root}}/target/debug/plugins"
run = [
  'python -c "from pathlib import Path; [Path(p).mkdir(parents=True, exist_ok=True) for p in (\"target/contracts\", \"target/debug/plugins\")]"',
  "cargo build --locked -p dokime-cli -p cargo-dokime -p plugin-host --bins --message-format json-render-diagnostics > target/contracts/dev.jsonl",
  "cargo run --locked -p cargo-dokime -- sidecar build --package plugin-host --output target/debug/plugins/plugin-host.dokime",
  "cargo run --locked -p cargo-dokime -- sidecar build --package plugin-obc --output target/debug/plugins/plugin-obc.dokime",
  "pnpm --dir crates/dokime-gui run tauri:dev --build-json target/contracts/dev.jsonl",
]

# === Test === #

[tasks.test]
description = "Test Every Layer Concurrently from Built Artifacts"
usage = 'flag "--profile <profile>" default="dev"'
depends = ["prepare:desktop"]
run = "{{vars.tools}} dokime_tools.test.schedule --profile {{usage.profile}}"
env = { CARGO_INCREMENTAL = "0" }

[tasks."test:python"]
description = "Test Python Layers"
usage = 'flag "--profile <profile>" default="dev"'
depends = [
  "test:python:unit --profile {{usage.profile}}",
  "test:python:integration --profile {{usage.profile}}",
  "test:python:acceptance --profile {{usage.profile}}",
  "test:python:system --profile {{usage.profile}}",
]
env = { CARGO_INCREMENTAL = "0" }

[tasks."test:python:unit"]
description = "Test Unit Python"
depends = ["prepare"]
usage = '''
flag "--profile <profile>" default="dev"
flag "--select <select>"
'''
run = '{{vars.tools}} dokime_tools.test.python --profile {{usage.profile}} --category unit {% if usage.select %}-- -k "{{usage.select}}"{% endif %}'

[tasks."test:python:integration"]
description = "Test Integration Python"
depends = ["prepare"]
usage = '''
flag "--profile <profile>" default="dev"
flag "--select <select>"
'''
run = '{{vars.tools}} dokime_tools.test.python --profile {{usage.profile}} --category integration {% if usage.select %}-- -k "{{usage.select}}"{% endif %}'
env = { CARGO_INCREMENTAL = "0" }

[tasks."test:python:acceptance"]
description = "Test Acceptance Python"
depends = ["prepare"]
usage = '''
flag "--profile <profile>" default="dev"
flag "--artifacts <artifacts>" help="Use An Explicit Native Client Fixture Root"
flag "--select <select>" help="Run Matching Installed-Wheel Stories"
'''
run = '{{vars.tools}} dokime_tools.test.python --profile {{usage.profile}} --category acceptance -- --build-profile {{usage.profile}} {% if usage.artifacts %}--artifacts "{{usage.artifacts}}"{% endif %} {% if usage.select %}-k "{{usage.select}}"{% endif %}'
env = { CARGO_INCREMENTAL = "0" }

[tasks."test:python:system"]
description = "Test System Python"
depends = ["prepare"]
usage = '''
flag "--profile <profile>" default="dev"
flag "--artifacts <artifacts>" help="Use an Explicit Native Fixture Root"
flag "--select <select>" help="Run Matching System Stories"
'''
run = '{{vars.tools}} dokime_tools.test.python --profile {{usage.profile}} --category system -- --build-profile {{usage.profile}} {% if usage.artifacts %}--artifacts "{{usage.artifacts}}"{% endif %} {% if usage.select %}-k "{{usage.select}}"{% endif %}'
env = { CARGO_INCREMENTAL = "0" }

[tasks."test:python:coverage"]
description = "Measure Python Coverage over Instrumented Lanes"
depends = ["prepare"]
usage = 'flag "--profile <profile>" default="dev"'
run = [
  "{{vars.tools}} dokime_tools.test.archive --profile {{usage.profile}} --install-wheels",
  "{{vars.tools}} dokime_tools.test.run coverage --language python --profile {{usage.profile}} --project sdk/python",
]

[tasks."test:python:wheel"]
description = "Import The Installed Native Wheel"
usage = '''
flag "--profile <profile>" default="dev"
flag "--stubs" help="Check All Shipped Stubs Against The Installed Extension"
'''
run = "{{vars.tools}} dokime_tools.test.wheel --profile {{usage.profile}}{% if usage.stubs %} --stubs{% endif %}"

[tasks."test:rust"]
description = "Test Rust Layers"
usage = 'flag "--profile <profile>" default="dev"'
depends = [
  "test:rust:unit --profile {{usage.profile}}",
  "test:rust:integration --profile {{usage.profile}}",
  "test:rust:acceptance --profile {{usage.profile}}",
  "test:rust:system --profile {{usage.profile}}",
]
env.CARGO_INCREMENTAL = "0"

[tasks."test:rust:unit"]
description = "Test Unit Rust"
usage = 'flag "--profile <profile>" default="dev"'
run = "{{vars.lane}} --profile {{usage.profile}} --category unit --language rust"
env.CARGO_INCREMENTAL = "0"

[tasks."test:rust:integration"]
description = "Test Integration Rust"
depends = ["prepare"]
usage = '''
flag "--profile <profile>" default="dev"
flag "--select <select>" help="Narrow the Nextest Filterset"
'''
run = "{{vars.lane}} --profile {{usage.profile}} --category integration --language rust -- -E \"not binary_id(dokime-macros::compile)\" {% if usage.select %}-E \"{{usage.select}}\"{% endif %}"
env.CARGO_INCREMENTAL = "0"

[tasks."test:rust:acceptance"]
description = "Test Acceptance Rust"
depends = ["prepare"]
usage = '''
flag "--profile <profile>" default="dev"
flag "--select <select>" help="Narrow the Nextest Filterset"
'''
run = [
  "{{vars.tools}} dokime_tools.prepare.generated --profile {{usage.profile}}",
  "{{vars.tools}} dokime_tools.test.archive --install-wheels --profile {{usage.profile}}",
  "{{vars.lane}} --profile {{usage.profile}} --category acceptance --language rust {% if usage.select %}-- -E \"{{usage.select}}\"{% endif %}",
]
env.CARGO_INCREMENTAL = "0"

[tasks."test:rust:system"]
description = "Test System Rust"
depends = ["prepare"]
usage = '''
flag "--profile <profile>" default="dev"
flag "--select <select>" help="Narrow the Nextest Filterset"
'''
run = [
  "{{vars.tools}} dokime_tools.test.archive --install-wheels --profile {{usage.profile}}",
  '{{vars.lane}} --profile {{usage.profile}} --category system --language rust {% if usage.select %}-- -E "{{usage.select}}"{% endif %}',
]
env.CARGO_INCREMENTAL = "0"

[tasks."test:rust:coverage"]
description = "Measure Rust Coverage over Instrumented Lanes"
depends = ["prepare"]
usage = 'flag "--profile <profile>" default="dev"'
run = [
  "{{vars.tools}} dokime_tools.prepare.generated --profile {{usage.profile}}",
  "{{vars.tools}} dokime_tools.test.archive --install-wheels --profile {{usage.profile}}",
  "{{vars.tools}} dokime_tools.build.machine -- python -m dokime_tools.test.run coverage --language rust --profile {{usage.profile}} -- --features \"{{vars.rust_plugin_features}},dokime-runtime/testing,dokime-gui/testing{% if usage.profile == 'release' %},{{vars.rust_release_features}}{% endif %}\" -E \"not binary_id(dokime-macros::compile)\"",
]

[tasks."test:rust:extended"]
description = "Run Optional Local Compatibility and Fault-Injection Stories"
usage = 'flag "--profile <profile>" default="dev"'
run = [
  { task = "build --profile {{usage.profile}}" },
  { task = "build:rust:compatibility --profile {{usage.profile}}" },
  "{{vars.tools}} dokime_tools.build.machine -- python -m dokime_tools.build.rust.tests --profile {{usage.profile}} --extended",
  { task = "test:rust --profile {{usage.profile}}" },
]

env.CARGO_INCREMENTAL = "0"

[tasks."test:rust:starter"]
description = "Prove the Standalone Starter in Nightly Validation"
usage = 'flag "--profile <profile>" default="release"'
run = "{{vars.tools}} dokime_tools.build.machine -- python -m dokime_tools.test.rust.starter --profile {{usage.profile}}"
env.CARGO_INCREMENTAL = "0"

[tasks."test:tooling"]

description = "Test Project Tooling"
run = "{{vars.python}} python -m unittest discover -s tools/python/tests"

[tasks."test:typescript"]
description = "Test TypeScript Layers"
usage = 'flag "--profile <profile>" default="dev"'
depends = [
  "test:typescript:unit --profile {{usage.profile}}",
  "test:typescript:integration --profile {{usage.profile}}",
  "test:typescript:system --profile {{usage.profile}}",
]
env = { CARGO_INCREMENTAL = "0" }

[tasks."test:typescript:unit"]
description = "Test Unit TypeScript"
depends = ["prepare:generated"]
usage = '''
flag "--profile <profile>" default="dev"
flag "--select <select>"
'''
run = [
  "{% if not usage.select %}{{vars.tools}} dokime_tools.prepare.generated --profile {{usage.profile}}{% endif %}",
  "{{vars.lane}} --profile {{usage.profile}} --category unit --language typescript --project crates/dokime-gui -- node ./node_modules/vitest/vitest.mjs run {% if usage.select %}{{usage.select}}{% else %}tests/unit{% endif %} --reporter=default --reporter=junit --outputFile.junit={junit} --testTimeout={timeout_ms}",
]

[tasks."test:typescript:integration"]
description = "Test Integration TypeScript"
depends = ["prepare:generated"]
usage = '''
flag "--profile <profile>" default="dev"
flag "--select <select>"
'''
run = [
  "{% if not usage.select %}{{vars.tools}} dokime_tools.prepare.generated --profile {{usage.profile}}{% endif %}",
  "{{vars.lane}} --profile {{usage.profile}} --category integration --language typescript --project crates/dokime-gui -- node ./node_modules/vitest/vitest.mjs run {% if usage.select %}{{usage.select}}{% else %}tests/integration{% endif %} --reporter=default --reporter=junit --outputFile.junit={junit} --testTimeout={timeout_ms}",
]
env = { CARGO_INCREMENTAL = "0" }

[tasks."test:typescript:system"]
description = "Test System TypeScript"
depends = ["prepare:desktop", "prepare:generated"]
usage = '''
flag "--profile <profile>" default="dev"
flag "--select <story>" help="Run One Native Desktop Story"
'''
run = [
  "{{vars.tools}} dokime_tools.prepare.generated --profile {{usage.profile}}",
  "{{vars.lane}} --profile {{usage.profile}} --category system --language typescript --project crates/dokime-gui -- node e2e/system.mjs --profile {{usage.profile}} --junit {junit} {% if usage.select %}--select {{usage.select}}{% endif %}",
]
env = { CARGO_INCREMENTAL = "0" }

# === Bench === #

[tasks.bench]
description = "Measure Every Bench Layer"
depends = ["bench:rust:unit", "bench:rust:integration", "bench:rust:system"]

[tasks."bench:python:system"]
description = "Measure Python Batch Publication"
depends = ["prepare"]
run = [
  "{{vars.tools}} dokime_tools.test.archive --profile dev --install-wheels",
  "{{vars.tools}} dokime_tools.test.run bench --language python --category system --project sdk/python -- -s",
]

[tasks."bench:rust:unit"]
description = "Bench Unit Rust"
run = "{{vars.tools}} dokime_tools.test.run bench --category unit --language rust"

[tasks."bench:rust:integration"]
description = "Bench Integration Rust"
run = "{{vars.tools}} dokime_tools.test.run bench --category integration --language rust"

[tasks."bench:rust:system"]
description = "Bench System Rust"
run = "{{vars.tools}} dokime_tools.test.run bench --category system --language rust"

# === Docs === #

# === Package === #

[tasks.package]
description = "Package Every Language"
usage = 'flag "--profile <profile>" default="dev"'
run = [{ tasks = ["package:rust --profile {{usage.profile}}", "package:python --profile {{usage.profile}}"] }]

[tasks."package:python"]
description = "Package the Built Client Distributions"
usage = '''
flag "--profile <profile>" default="dev"
flag "--target <target>" default="native"
'''
run = "{{vars.tools}} dokime_tools.package.run python --profile {{usage.profile}} --target {{usage.target}}"

[tasks."package:rust"]
description = "Package the Desktop Installer, Tools and Plugin Archives"
depends = ["prepare"]
tools = { "aqua:ip7z/7zip" = "26.05" }
usage = '''
flag "--profile <profile>" default="dev"
flag "--target <target>" default="native"
'''
run = [
  "{{vars.tools}} dokime_tools.package.run rust --profile {{usage.profile}} --target {{usage.target}}",
  "{{vars.tools}} dokime_tools.package.installer bundle --profile {{usage.profile}} --target {{usage.target}}",
]

# === CI === #

[tasks."ci:simulate"]
description = "Simulate the Declared CI Graph Locally"
usage = '''
flag "--pipeline <kind>" default=pr
flag "--platform <platform>"
flag "--executor <executor>"
flag "--jobs <count>"
'''
run = "{{vars.tools}} dokime_tools.ci.simulate {% if usage.pipeline %}--pipeline {{usage.pipeline}}{% endif %} {% if usage.platform %}--platform {{usage.platform}}{% endif %} {% if usage.executor %}--executor {{usage.executor}}{% endif %} {% if usage.jobs %}--jobs {{usage.jobs}}{% endif %}"

# === Release === #

[tasks."release:prepare"]
description = "Prepare the Release Branch"
run = "{{vars.tools}} dokime_tools.release.run prepare"

[tasks."release:publish"]
description = "Publish a Tagged Release"
run = [{ task = "release:publish:assets" }, { task = "release:publish:python" }, { task = "release:publish:finalize" }]

[tasks."release:publish:assets"]
description = "Draft the Release with Its Assets and SHA256SUMS"
run = "{{vars.tools}} dokime_tools.release.run publish"

[tasks."release:publish:dry"]
description = "Dry-Run Every Publication"
depends = ["prepare:report"]
run = [
  "{{vars.tools}} dokime_tools.release.version check",
  "{{vars.tools}} dokime_tools.release.run dry",
  "{{vars.tools}} dokime_tools.release.run crates-dry",
]

[tasks."release:publish:finalize"]
description = "Verify and Publish the Drafted Release"
run = "{{vars.tools}} dokime_tools.release.run finalize"

[tasks."release:publish:python"]
description = "Publish The Native Python SDK"
run = "{{vars.tools}} dokime_tools.release.run python"

[tasks."release:publish:rust"]
description = "Publish Rust Crates"
run = "{{vars.tools}} dokime_tools.release.run crates"

[tasks."release:rehearse"]
description = "Rehearse Staged Release Packages Without Credentials"
run = "{{vars.tools}} dokime_tools.release.run rehearse"

[tasks."release:tag"]
description = "Tag a Merged Release Review and Fast-Forward Main"
run = "{{vars.tools}} dokime_tools.release.run tag"

[tasks."release:verify"]
description = "Verify Published Release Assets and Installers"
run = "{{vars.tools}} dokime_tools.release.run verify"

# === Clean === #

# === Housekeeping === #

[tasks.housekeeping]
description = "Clean Owned Build Outputs and State"
run = "stkr project housekeeping"

[tasks."housekeeping:stats"]
description = "Count Source Lines"
run = "scc"
