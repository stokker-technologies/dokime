# ***
#
# Dokime
#
# SPDX-License-Identifier: Apache-2.0
#
# ***

# === Settings === #

[settings]
lockfile = true

# === Tools === #

[tools]
# Languages and Runtimes
go = "1.27.3"
node = "26.11.1"
powershell = { version = "7.6.7", os = ["windows"] }
python = "3.15.0"
rust = { version = "1.99.0", components = "clippy,rustfmt,llvm-tools", profile = "minimal", targets = "wasm32-unknown-unknown" }

# Package Managers
pnpm = "12.11.2"
uv = "0.13.7"

# Rust Toolchain
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.148"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
"github:bnjbvr/cargo-machete" = "0.9.2"
sccache = "0.19.0"

# Formatting and Linting
"aqua:koalaman/shellcheck" = "0.11.0"
"go:github.com/rhysd/actionlint/cmd/actionlint" = "v1.7.13-0.20260417151945-fd33e9f582a0"
taplo = "0.10.0"

# Protocols and Code Generation
protoc = "36.2"
"aqua:bufbuild/buf" = "1.75.0"

# Documentation
"aqua:d2lang/d2" = "0.9.0"

# Release and Signing
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"aqua:anchore/syft" = "1.57.0"
"aqua:rustsec/rustsec/cargo-audit" = "0.22.2"
git-cliff = "2.14.2"
"github:CycloneDX/cyclonedx-rust-cargo" = "cargo-cyclonedx-0.5.9"
"github:EmbarkStudios/cargo-about" = "0.9.3"
"github:rust-secure-code/cargo-auditable" = "0.7.7"
minisign = "0.12"

# Project Statistics
"aqua:boyter/scc" = "4.1.0"

# === Environment === #

[env]
PYTHONDONTWRITEBYTECODE = "1"

# === Variables === #

[vars]
python = "uv run --no-sync --project tools/python"
tools = "uv run --no-sync --project tools/python python -m"
lane = "uv run --no-sync --project tools/python python -m dokime_tools.test.run test"

# === Entry Points === #

[tasks."prepare"]
description = "Prepare Tools and Inputs"
usage = 'flag "--refresh-lock" help="Refresh the Python Workspace Lock Before Synchronizing"; flag "--without-frontend" help="Prepare Only Python Tooling and SDK Inputs"; flag "--tools-only" help="Prepare Only Repository Tooling"; flag "--docs-only" help="Prepare Tooling and Documentation Dependencies"'
run = [
  "{% if usage.refresh_lock %}uv lock{% endif %}",
  "uv sync --locked --all-groups",
  "{% if not usage.tools_only and not usage.docs_only %}mise run build:python{% endif %}",
  "{% if not usage.tools_only and not usage.docs_only %}mise -C sdk/python run install{% endif %}",
  "{% if not usage.tools_only and (usage.docs_only or not usage.without_frontend) %}pnpm install --frozen-lockfile{% endif %}",
]

[tasks."generate"]
description = "Generate Clients from Contracts"
usage = 'flag "--check" help="Check Bindings; Requires --protocol"; flag "--protocol" help="Generate Checked-In Protocol Bindings Only"; flag "--language <language>" { choices "python" }'
run = """
{% if usage.protocol %}
{{vars.tools}} dokime_tools.build.protocol {% if usage.check %}--check{% endif %}{% if usage.language %} --language {{usage.language}}{% endif %}
{% elif usage.check %}
python -c "raise SystemExit('Check Protocol: Add --protocol; Native Client Drift Returns With the Desktop')"
{% else %}
{{vars.tools}} dokime_tools.prepare.generated --generate
{% endif %}
"""

[tasks.format]
description = "Format Every Language"
run = ["buf format --write", "{{vars.tools}} dokime_tools.ci.tasks format"]

[tasks.lint]
description = "Lint Every Language"
run = "{{vars.tools}} dokime_tools.ci.tasks lint"

[tasks.check]
description = "Check Languages and Repository"
run = "{{vars.tools}} dokime_tools.ci.tasks check"

[tasks.build]
description = "Build Products or Focused Packages"
run = "{{vars.tools}} dokime_tools.ci.tasks build"

[tasks.test]
description = "Test Layers or Focused Targets"
run = "{{vars.tools}} dokime_tools.ci.tasks test"

[tasks.bench]
description = "Measure Prepared Benchmark Workloads"
run = "{{vars.tools}} dokime_tools.ci.tasks bench"

[tasks.package]
description = "Package Built Artifacts"
run = "{{vars.tools}} dokime_tools.ci.tasks package"

[tasks."docs:build"]
description = "Build the Documentation Site Entry"
usage = 'flag "--prepared" help="Use Canonical Host Messages Already Generated in This Job"; flag "--archive"; flag "--release"'
run = [
  "{% if not usage.prepared %}mise -C crates/dokime-gui run generate:host-frontend{% endif %}",
  "{{vars.tools}} dokime_tools.docs.site build{% if usage.archive %} --archive{% endif %}{% if usage.release %} --release{% endif %}",
]

[tasks."docs:serve"]
description = "Preview the Documentation Site"
run = ["mise -C crates/dokime-gui run generate:host-frontend", "{{vars.tools}} dokime_tools.docs.site serve"]

[tasks."docs:image"]
description = "Assemble Published Documentation Archives Into the Site Image"
run = "{{vars.tools}} dokime_tools.docs.image"

[tasks."docs:test"]
description = "Test Documentation Tooling"
usage = 'flag "--select <select>"'
run = 'pnpm --dir sites/docs test{% if usage.select %} --test-name-pattern="{{usage.select}}"{% endif %} tests/*.test.ts'

[tasks."docs:format"]
description = "Format the Documentation Site"
run = "pnpm --dir sites/docs format"

[tasks."docs:lint"]
description = "Lint the Documentation Site"
run = [
  "pnpm --dir sites/docs lint",
  "{{vars.python}} ruff check tools/python/src/dokime_tools/docs tools/python/src/dokime_tools/ci/impact.py tools/python/src/dokime_tools/ci/nightly_freshness.py tools/python/tests/integration/test_docs_site.py tools/python/tests/integration/test_ci_impact.py tools/python/tests/integration/test_ci_workflow.py",
  "{{vars.python}} ty check --project tools/python tools/python/src/dokime_tools/docs tools/python/src/dokime_tools/ci/impact.py tools/python/src/dokime_tools/ci/nightly_freshness.py tools/python/tests/integration/test_docs_site.py tools/python/tests/integration/test_ci_impact.py tools/python/tests/integration/test_ci_workflow.py",
]

[tasks."release:prepare"]
description = "Prepare the Release Branch"
run = "{{vars.tools}} dokime_tools.ci.workflow release-prepare"

[tasks."release:publish"]
description = "Publish a Tagged Release"
run = "{{vars.tools}} dokime_tools.ci.tasks publish"

[tasks."release:rehearse"]
description = "Rehearse Staged Release Packages Without Credentials"
run = "{{vars.tools}} dokime_tools.ci.workflow rehearse"

[tasks."release:tag"]
description = "Tag a Merged Release Review and Fast-Forward Main"
run = "{{vars.tools}} dokime_tools.ci.workflow release-tag"

[tasks."release:verify"]
description = "Verify Published Release Assets and Installers"
run = "{{vars.tools}} dokime_tools.ci.workflow release-verify"

# === Dev === #

[tasks.dev]
description = "Start the Desktop with Live Reload and the OBC Plugin on a Disposable Root"
run = "{{vars.tools}} dokime_tools.dev.desktop"

# === Internal Steps === #

[tasks."format:python"]
hide = true
description = "Format Python"
usage = 'flag "--check"; flag "--project <project>" { choices "sdk/python" "tools/python" }'
run = [
  "{% if not usage.project or usage.project == 'sdk/python' %}{{vars.python}} ruff check --select I,F401,PYI{% if not usage.check %} --fix{% endif %} sdk/python{% endif %}",
  "{% if not usage.project or usage.project == 'sdk/python' %}{{vars.python}} ruff format sdk/python{% if usage.check %} --check{% endif %}{% endif %}",
  "{% if not usage.project or usage.project == 'tools/python' %}{{vars.python}} ruff check --select I,F401,PYI{% if not usage.check %} --fix{% endif %} tools/python{% endif %}",
  "{% if not usage.project or usage.project == 'tools/python' %}{{vars.python}} ruff format tools/python{% if usage.check %} --check{% endif %}{% endif %}",
]

[tasks."format:rust"]
hide = true
description = "Format Rust"
usage = '''
flag "--check"
flag "--package <package>" help="Limit Formatting to One Package"
'''
run = "cargo fmt {% if usage.package %}--package {{usage.package}}{% else %}--all{% endif %}{% if usage.check %} --check{% endif %}"

[tasks."format:toml"]
hide = true
description = "Format TOML"
usage = 'flag "--check"'
run = "git ls-files -z -- '*.toml' | xargs -0 taplo fmt --config tools/config/taplo.toml --option column_width=140{% if usage.check %} --check{% endif %}"
run_windows = '''pwsh -NoProfile -Command "taplo fmt --config tools/config/taplo.toml --option column_width=140{% if usage.check %} --check{% endif %} -- @(git ls-files -- '*.toml')"'''

[tasks."format:typescript"]
hide = true
description = "Format TypeScript"
usage = 'flag "--check"'
run = [
  "pnpm -r exec biome format{% if usage.check %}{% else %} --write{% endif %} .",
  "pnpm exec biome format{% if usage.check %}{% else %} --write{% endif %} biome.json tsconfig.json vite.config.ts vitest.config.ts package.json",
]

[tasks."lint:python"]
hide = true
description = "Lint Python"
run = [
  "{{vars.python}} ruff check sdk/python",
  "{{vars.python}} ruff check tools/python",
  "{{vars.python}} ty check --project tools/python",
]

[tasks."lint:rust"]
hide = true
description = "Lint Rust"
usage = 'flag "--package <package>" help="Limit Clippy to One Package"'
run = "{{vars.tools}} dokime_tools.build.lint -- --locked {% if usage.package %}--package {{usage.package}}{% else %}--workspace{% endif %} --all-targets --profile dev"
env = { CARGO_BUILD_WARNINGS = "deny" }

[tasks."lint:typescript"]
hide = true
description = "Lint TypeScript"
run = ["pnpm -r exec biome lint .", "pnpm exec biome lint biome.json tsconfig.json vite.config.ts vitest.config.ts package.json"]

[tasks."typecheck:typescript"]
hide = true
description = "Typecheck Frontend Workspace Packages"
usage = 'flag "--project <project>"'
run = "{% if usage.project %}pnpm --dir {{usage.project}} run typecheck{% else %}pnpm -r --if-present run typecheck{% endif %}"

[tasks.screenshots]
hide = true
description = "Capture Product Screenshots"
run = "{{vars.tools}} dokime_tools.ci.tasks screenshots"

[tasks."check:python"]
hide = true
description = "Check Python"
run = [{ task = "format:python --check" }, { task = "lint:python" }, { task = "test:python:integration --project tools/python" }]

[tasks."check:python:tools"]
hide = true
description = "Check Python Tooling"
run = [
  { task = "format:python --check --project tools/python" },
  "{{vars.python}} ruff check tools/python",
  "{{vars.python}} ty check --project tools/python",
]

[tasks."check:python:bindings"]
hide = true
description = "Check Built Python Messages and Generated Service Stubs"
usage = 'flag "--profile <profile>" default="dev"'
run = [
  "{{vars.python}} ty check --project sdk/python --exit-zero-on-warning",
  "{{vars.tools}} dokime_tools.test.wheel --profile {{usage.profile}} --stubs --generated-only",
]

[tasks."check:repository"]
hide = true
description = "Check Repository Configuration"
run = [
  { task = "format:toml --check" },
  "buf format --diff --exit-code",
  # D6 Reuses Library Payloads; Upstream Owns the Vendored Protocol's Lint Policy.
  "buf lint --exclude-path proto/harmos",
  "{{vars.tools}} dokime_tools.build.protocol_callers",
  "{{vars.tools}} dokime_tools.ci.mise",
  "shellcheck --version",
  "actionlint",
]

[tasks."check:rust"]
hide = true
description = "Check Rust"
run = [{ task = "format:rust --check" }, { task = "lint:rust" }, "{{vars.tools}} dokime_tools.ci.rust"]

[tasks."check:rust:supply"]
hide = true
description = "Check Dependency Advisories, Licenses and Sources"
run = "{{vars.tools}} dokime_tools.release.sbom --check-supply"

[tasks."check:typescript"]
hide = true
description = "Check TypeScript Formatting and Lint Without Type Checking"
run = [{ task = "format:typescript --check" }, { task = "lint:typescript" }]

[tasks."build:product"]
hide = true
description = "Build Shipping Binaries, Bundles and Frontend"
usage = 'flag "--profile <profile>" default="dev"'
run = [{ task = "build:typescript --profile {{usage.profile}}" }, { task = "build:rust --profile {{usage.profile}}" }]

[tasks."build:python"]
hide = true
description = "Build the Pure Python SDK Wheel"
usage = 'flag "--profile <profile>" default="dev"'
run = "{{vars.tools}} dokime_tools.build.python --profile {{usage.profile}}"

[tasks."build:rust"]
hide = true
description = "Build Shipping Native Executables and Plugin Bundle"
usage = 'flag "--profile <profile>" default="dev"'
run = "{{vars.tools}} dokime_tools.release.sbom --auditable {{usage.profile}} -- python -m dokime_tools.build.rust --profile {{usage.profile}}"

[tasks."build:rust:tests"]
hide = true
description = "Build Independent Test Archive"
usage = 'flag "--profile <profile>" default="dev"; flag "--timings"'
run = [
  "{{vars.tools}} dokime_tools.build.rust.tests --profile {{usage.profile}}{% if usage.timings %} --timings{% endif %}",
  { task = "build:host-fixtures --profile {{usage.profile}} --language rust" },
  { task = "build:host-fixtures --profile {{usage.profile}} --language python" },
  { task = "build:cli-fixtures --profile {{usage.profile}}" },
  { task = "build:desktop-fixtures --profile {{usage.profile}}" },
]

[tasks."build:desktop-fixtures"]
hide = true
description = "Build and Export Desktop SDK Fixtures"
usage = 'flag "--profile <profile>" default="dev"'
run = "{{vars.tools}} dokime_tools.build.desktop_fixtures --profile {{usage.profile}}"

[tasks."build:cli-fixtures"]
hide = true
description = "Build and Export a Command-Line Starter Fixture"
usage = 'flag "--profile <profile>" default="dev"; flag "--language <language>" default="rust"'
run = "{{vars.tools}} dokime_tools.build.cli_fixtures --profile {{usage.profile}} --language {{usage.language}}"

[tasks."build:host-fixtures"]
hide = true
description = "Build and Export Execution Host SDK Fixtures"
usage = 'flag "--profile <profile>" default="dev"; flag "--language <language>"; flag "--fixture <fixture>"; flag "--export"'
run = "{{vars.tools}} dokime_tools.build.host_fixtures --profile {{usage.profile}}{% if usage.language %} --language {{usage.language}}{% endif %}{% if usage.fixture %} --fixture {{usage.fixture}}{% endif %}{% if usage.export %} --export{% endif %}"

[tasks."build:typescript"]
hide = true
description = "Build the Generated GUI Client and Frontend"
usage = 'flag "--profile <profile>" default="dev"'
run = "{{vars.tools}} dokime_tools.build.typescript --profile {{usage.profile}}"

[tasks."build:rust:bench"]
hide = true
description = "Build Native Desktop Benchmarks and Matching Hosts"
usage = 'flag "--binary <binary>"'
run = "{{vars.tools}} dokime_tools.build.bench{% if usage.binary %} --binary {{usage.binary}}{% endif %}"

[tasks."test:python"]
hide = true
description = "Test Python Layers"
usage = '''
flag "--profile <profile>" default="dev"
flag "--prepared"
'''
depends = [
  "test:python:unit --profile {{usage.profile}}{% if usage.prepared %} --prepared{% endif %}",
  "test:python:integration --profile {{usage.profile}} --project tools/python{% if usage.prepared %} --prepared{% endif %}",
  "test:python:integration --profile {{usage.profile}}{% if usage.prepared %} --prepared{% endif %}",
  "test:python:system --profile {{usage.profile}}{% if usage.prepared %} --prepared{% endif %}",
]

[tasks."test:python:unit"]
hide = true
description = "Test Unit Python"
usage = '''
flag "--profile <profile>" default="dev"
flag "--prepared"
flag "--select <select>"
'''
run = [
  '''{% if usage.prepared %}{{vars.tools}} dokime_tools.test.schedule --lane --profile {{usage.profile}} --category unit --language python{% else %}{{vars.tools}} dokime_tools.test.python --profile {{usage.profile}} --category unit {% if usage.select %}-- -k "{{usage.select}}"{% endif %}{% endif %}''',
]

[tasks."test:python:integration"]
hide = true
description = "Test Integration Python"
usage = '''
flag "--profile <profile>" default="dev"
flag "--prepared"
flag "--project <project>" default="sdk/python"
flag "--select <select>"
'''
run = [
  '''{% if usage.prepared %}{{vars.tools}} dokime_tools.test.schedule --lane --profile {{usage.profile}} --category integration --language python --project {{usage.project}}{% elif usage.project == "tools/python" %}{{vars.python}} python -m unittest discover -s tools/python/tests/integration -t tools/python {% if usage.select %}-k "{{usage.select}}"{% endif %}{% else %}{{vars.tools}} dokime_tools.test.python --profile {{usage.profile}} --category integration {% if usage.select %}-- -k "{{usage.select}}"{% endif %}{% endif %}''',
]

[tasks."test:python:system"]
hide = true
description = "Test System Python"
usage = '''
flag "--profile <profile>" default="dev"
flag "--prepared"
flag "--select <select>" help="Run Matching System Stories"
'''
run = [
  '''{% if usage.prepared %}{{vars.tools}} dokime_tools.test.schedule --lane --profile {{usage.profile}} --category system --language python{% else %}{{vars.tools}} dokime_tools.test.python --profile {{usage.profile}} --category system {% if usage.select %}-- -k "{{usage.select}}"{% endif %}{% endif %}''',
]

[tasks."test:python:coverage"]
hide = true
description = "Measure Python SDK Coverage"
usage = 'flag "--profile <profile>" default="dev"'
run = [
  "{{vars.tools}} dokime_tools.test.archive --profile {{usage.profile}} --install-wheels",
  "{{vars.tools}} dokime_tools.test.run coverage --language python --profile {{usage.profile}} --project sdk/python",
]

[tasks."test:python:wheel"]
hide = true
description = "Install the Pure Wheel and Run the Starter"
usage = '''
flag "--profile <profile>" default="dev"
flag "--stubs" help="Check Generated Messages and Service Stubs Against Protos"
'''
run = "{{vars.tools}} dokime_tools.test.wheel --profile {{usage.profile}}{% if usage.stubs %} --stubs{% endif %}"

[tasks."test:rust"]
hide = true
description = "Test Rust Layers"
usage = '''
flag "--profile <profile>" default="dev"
flag "--prepared"
'''
depends = [
  "test:rust:unit --profile {{usage.profile}}{% if usage.prepared %} --prepared{% endif %}",
  "test:rust:integration --profile {{usage.profile}}{% if usage.prepared %} --prepared{% endif %}",
  "test:rust:acceptance --profile {{usage.profile}}{% if usage.prepared %} --prepared{% endif %}",
  "test:rust:system --profile {{usage.profile}}{% if usage.prepared %} --prepared{% endif %}",
]

[tasks."test:rust:unit"]
hide = true
description = "Test Unit Rust"
usage = '''
flag "--profile <profile>" default="dev"
flag "--prepared"
flag "--select <select>" help="Narrow the Nextest Filterset"
'''
run = [
  '''{% if usage.prepared %}{{vars.tools}} dokime_tools.test.schedule --lane --profile {{usage.profile}} --category unit --language rust{% else %}{{vars.lane}} --profile {{usage.profile}} --category unit --language rust {% if usage.select %}-- -E "{{usage.select}}"{% endif %}{% endif %}''',
]

[tasks."test:rust:integration"]
hide = true
description = "Test Integration Rust"
usage = '''
flag "--profile <profile>" default="dev"
flag "--prepared"
flag "--select <select>" help="Narrow the Nextest Filterset"
'''
run = [
  '''{% if usage.prepared %}{{vars.tools}} dokime_tools.test.schedule --lane --profile {{usage.profile}} --category integration --language rust{% else %}{{vars.lane}} --profile {{usage.profile}} --category integration --language rust {% if usage.select %}-- {% endif %}{% if usage.select %}-E "{{usage.select}}"{% endif %}{% endif %}''',
]

[tasks."test:rust:system"]
hide = true
description = "Test System Rust"
usage = '''
flag "--profile <profile>" default="dev"
flag "--prepared"
flag "--select <select>" help="Narrow the Nextest Filterset"
'''
run = [
  '''{% if usage.prepared %}{{vars.tools}} dokime_tools.test.schedule --lane --profile {{usage.profile}} --category system --language rust{% else %}{{vars.tools}} dokime_tools.test.archive --install-wheels --profile {{usage.profile}}{% endif %}''',
  '''{% if not usage.prepared %}{{vars.lane}} --profile {{usage.profile}} --category system --language rust {% if usage.select %}-- -E "{{usage.select}}"{% endif %}{% endif %}''',
]

[tasks."test:rust:coverage"]
hide = true
description = "Measure Rust Coverage over Instrumented Lanes"
usage = 'flag "--profile <profile>" default="dev"'
run = [
  "{{vars.tools}} dokime_tools.prepare.generated --profile {{usage.profile}}",
  "mise -C crates/dokime-gui run generate:report",
  "{{vars.tools}} dokime_tools.test.archive --install-wheels --profile {{usage.profile}}",
  "{{vars.tools}} dokime_tools.test.run coverage --language rust --profile {{usage.profile}} -- --features dokime-gui/testing",
]

[tasks."test:rust:acceptance"]
hide = true
description = "Test Native Desktop Acceptance"
usage = '''
flag "--profile <profile>" default="dev"
flag "--prepared"
flag "--select <select>"
'''
run = [
  "{% if not usage.prepared %}{{vars.tools}} dokime_tools.prepare.generated --profile {{usage.profile}}{% endif %}",
  '''{% if usage.prepared %}{{vars.tools}} dokime_tools.test.schedule --lane --profile {{usage.profile}} --category acceptance --language rust{% else %}{{vars.lane}} --profile {{usage.profile}} --category acceptance --language rust{% if usage.select %} -- -E "{{usage.select}}"{% endif %}{% endif %}''',
]

[tasks."bench:rust:storage"]
hide = true
description = "Measure Prepared Arrow Storage Benchmarks"
usage = 'flag "--select <select>"; flag "--once"'
run = '''{{vars.tools}} dokime_tools.test.storage_bench{% if usage.select %} --select "{{usage.select}}"{% endif %}{% if usage.once %} --once{% endif %}'''

[tasks."bench:rust:system"]
hide = true
description = "Measure Prepared Native Desktop Benchmarks"
usage = '''
flag "--profile <profile>" default="dev"
flag "--binary <binary>"
flag "--select <select>"
flag "--refresh-baseline"
flag "--once"
'''
run = [
  "{{vars.tools}} dokime_tools.prepare.generated --profile bench",
  '''{{vars.tools}} dokime_tools.test.run bench --category system --language rust{% if usage.binary %} --binary {{usage.binary}}{% endif %}{% if usage.refresh_baseline %} --refresh-baseline{% endif %}{% if usage.select or usage.once %} --{% endif %}{% if usage.once %} --test{% endif %}{% if usage.select %} "{{usage.select}}"{% endif %}''',
]

[tasks."test:typescript"]
hide = true
description = "Test TypeScript Layers"
usage = '''
flag "--profile <profile>" default="dev"
flag "--prepared"
'''
depends = [
  "test:typescript:unit --profile {{usage.profile}}{% if usage.prepared %} --prepared{% endif %}",
  "test:typescript:integration --profile {{usage.profile}}{% if usage.prepared %} --prepared{% endif %}",
  "test:typescript:system --profile {{usage.profile}}{% if usage.prepared %} --prepared{% endif %}",
]

[tasks."prepare:desktop"]
hide = true
description = "Prepare the Native WebView Driver"
run = "{{vars.tools}} dokime_tools.ci.bootstrap --desktop --gui-runtime"

[tasks."test:typescript:system"]
hide = true
description = "Test Desktop Execution and Connection Journeys"
usage = '''
flag "--profile <profile>" default="dev"
flag "--prepared"
flag "--select <select>"
'''
run = [
  "{% if not usage.prepared %}{{vars.tools}} dokime_tools.prepare.generated --profile {{usage.profile}}{% endif %}",
  '''{% if usage.prepared %}{{vars.tools}} dokime_tools.test.schedule --lane --profile {{usage.profile}} --category system --language typescript{% else %}{{vars.lane}} --profile {{usage.profile}} --category system --language typescript --project crates/dokime-gui -- node e2e/system.mjs --profile {{usage.profile}} --junit {junit}{% if usage.select %} --select {{usage.select}}{% endif %}{% endif %}''',
]

[tasks."test:typescript:unit"]
hide = true
description = "Test Unit TypeScript Against Freshly Generated Modules Without Rewriting Sources"

usage = '''
flag "--profile <profile>" default="dev"
flag "--prepared"
flag "--select <select>"
flag "--project <project>" default="crates/dokime-gui"
'''
run = [
  "{% if not usage.prepared %}{{vars.tools}} dokime_tools.prepare.generated --profile {{usage.profile}}{% endif %}",
  '''{% if usage.prepared and not usage.select and usage.project == 'crates/dokime-gui' %}{{vars.tools}} dokime_tools.test.schedule --lane --profile {{usage.profile}} --category unit --language typescript{% endif %}''',
  '''{% if not usage.prepared or usage.select or usage.project != 'crates/dokime-gui' %}{{vars.lane}} {% if usage.prepared %}--prepared {% endif %}--profile {{usage.profile}} --category unit --language typescript --project {{usage.project}} -- node ./node_modules/vitest/vitest.mjs run {% if usage.select %}{{usage.select}}{% else %}tests/unit{% endif %} --reporter=default --reporter=junit --outputFile.junit={junit} --testTimeout={timeout_ms}{% endif %}''',
]

[tasks."test:typescript:integration"]
hide = true
description = "Test Integration TypeScript Against Freshly Generated Modules Without Rewriting Sources"

usage = '''
flag "--profile <profile>" default="dev"
flag "--prepared"
flag "--select <select>"
flag "--project <project>" default="crates/dokime-gui"
'''
run = [
  "{% if not usage.prepared %}{{vars.tools}} dokime_tools.prepare.generated --profile {{usage.profile}}{% endif %}",
  '''{% if usage.prepared and not usage.select and usage.project == 'crates/dokime-gui' %}{{vars.tools}} dokime_tools.test.schedule --lane --profile {{usage.profile}} --category integration --language typescript{% endif %}''',
  '''{% if not usage.prepared or usage.select or usage.project != 'crates/dokime-gui' %}{{vars.lane}} {% if usage.prepared %}--prepared {% endif %}--profile {{usage.profile}} --category integration --language typescript --project {{usage.project}} -- node ./node_modules/vitest/vitest.mjs run {% if usage.select %}{{usage.select}}{% else %}tests/integration{% endif %} --reporter=default --reporter=junit --outputFile.junit={junit} --testTimeout={timeout_ms}{% endif %}''',
]

