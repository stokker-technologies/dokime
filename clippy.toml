# === Child Processes === #

# Every Child Process Starts Through dokime_runtime_next::process::command, Which Opens No Windows Console Window.
disallowed-methods = [
  { path = "std::process::Command::new", reason = "start child processes with dokime_runtime_next::process::command" },
  { path = "tokio::process::Command::new", reason = "start async child processes with tokio::process::Command::from(dokime_runtime_next::process::command(..))" },
]
