# Project Policy Owned By The Hub
# Native manifests own package metadata; mise owns executable recipes.
# Defaults stay implicit. Commented sections do not declare configuration.

# === Project ===

[project]
name = "Dokime"


# === Repository ===

[housekeeping]
max_workspaces = 5


# === CI ===


# === Agents ===


# === Hooks ===

[hooks]
# Workspace repair and checks exceed one minute even with warm Cargo caches.
step_timeout_seconds = 900


# === Conventions ===

[conventions.ci.multitask]
check_fast = ["ci:route", "check:fast"]
contracts_prepare_release = [
  "contracts:prepare:release",
  "ci:contracts:archive",
  "ci:contracts:publish",
]
build_release = ["ci:contracts:restore", "build:release"]
test_integration_javascript = ["ci:contracts:restore", "test:integration:javascript"]
test_integration_rust = ["ci:artifacts:restore", "test:integration:rust"]
test_integration_python = ["ci:artifacts:restore", "test:integration:python"]
test_acceptance_rust = ["ci:artifacts:restore", "test:acceptance:rust"]
test_acceptance_python = ["ci:artifacts:restore", "test:acceptance:python"]
test_system_javascript = ["ci:artifacts:restore", "test:system:javascript"]
ci_coverage = ["ci:artifacts:restore", "ci:coverage"]
test = ["ci:artifacts:restore", "ci:artifacts:collect", "ci:artifacts:validate"]

[conventions.rust.source_roots]
# Validate the authored source that this compile-only crate renders and includes.
dokime-starter-check = "crates/cargo-dokime/templates"

[skeletons]
# Audit native source and the dedicated project policy skeleton.
include = ["**/*.rs", "**/*.py", "stkr.toml"]
# Generated RPC output is owned and checked by the binding generators.
exclude = [
  "packages/dokime/src/dokime/client/_generated/**",
  "crates/dokime-gui/src-tauri/src/rpc/generated.rs",
]

[barrels]
# Deliberate public façades, not accidental re-export files: the authoring
# prelude and the one namespace a sidecar author imports from.
exclude = ["crates/dokime/src/prelude.rs", "crates/dokime/src/plugin/sidecar.rs"]

[markdown]
include = [
  "**/README.md",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "LICENSE.md",
  ".github/**",
]


# === Templates ===


# === Release ===


# === Documentation ===


# === Screenshots ===


# === Catalogs ===

[[catalogs]]
language = "rust"
path = "plugins/mini/src/operations/mod.rs"
name = "Implemented"
implementations = ["connections.rs", "readiness.rs", "status.rs"]


[[catalogs]]
language = "rust"
path = "crates/cargo-dokime/templates/src/operations/mod.rs"
name = "Implemented"
implementations = ["status.rs", "chamber.rs"]

[[catalogs]]
language = "rust"
path = "crates/dokime/src/storage/objects/mod.rs"
name = "Objects"
implementations = ["case.rs", "cycle.rs", "execution.rs", "suite.rs"]


