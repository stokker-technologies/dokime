# Project Policy Owned By The Hub
# Native manifests own package metadata; mise owns executable recipes.
# Defaults stay implicit. Commented sections do not declare configuration.

# === === Project === === #

[project]
name = "Dokime"
platforms = ["linux", "windows"]

[features]
# The Build Scripts Compile The Operation Contracts With Protoc.
proto = true

# === === Languages === === #

[languages.rust]
roots = ["crates", "plugins"]
# The domain crate also builds for the browser.
targets = ["wasm32-unknown-unknown"]
# The GUI's Node dependencies and the starter templates are not workspace Rust sources.
exclude = ["crates/dokime-gui/node_modules", "crates/cargo-dokime/templates"]

[languages.python]
roots = ["tools/python", "packages"]
generated = ["packages/dokime/src/dokime/_wire", "packages/dokime/src/dokime/operation.py", "packages/dokime/src/dokime/dynamic.py"]

[languages.typescript]
roots = ["crates/dokime-gui"]
exclude = ["crates/dokime-gui/node_modules", "crates/dokime-gui/src-tauri", "crates/dokime-gui/src/routeTree.gen.ts"]
generated = ["crates/dokime-gui/.generated", "crates/dokime-gui/src/lib/rpc/generated"]

# === === Repository === === #

[housekeeping]
max_workspaces = 5

# === === CI === === #

# --- Impact --- #

[ci.impact]
default = "full"

# --- Stage / Check --- #

[[ci.jobs]]
id = "check:rust"
platform = "linux"
runner = "stokker-local-linux-x64"
bootstrap = ["python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-packages"]
timeout_minutes = 120

[[ci.jobs]]
id = "check:rust"
platform = "windows"
runner = "stokker-local-windows-x64"
timeout_minutes = 120

# --- Stage / Build --- #

[[ci.jobs]]
id = "build"
platform = "linux"
runner = "stokker-local-linux-x64"
bootstrap = ["python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-packages"]
timeout_minutes = 50

[[ci.jobs]]
id = "build"
platform = "windows"
runner = "stokker-local-windows-x64"
timeout_minutes = 50

[[ci.jobs]]
id = "build:rust:bench"
platform = "linux"
runner = "stokker-local-linux-x64"
bootstrap = ["python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-packages"]
caches = ["mise", "cargo-downloads", "uv", "pnpm", "sccache", "bench-baselines"]

[[ci.jobs]]
id = "build:rust:tests"
platform = "linux"
runner = "stokker-local-linux-x64"
bootstrap = ["python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-packages"]

[[ci.jobs]]
id = "build:rust:tests"
platform = "windows"
runner = "stokker-local-windows-x64"

# --- Stage / Test --- #

[[ci.jobs]]
id = "test:rust:acceptance"
platform = "linux"
runner = "stokker-local-linux-x64"
bootstrap = ["python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-packages"]
timeout_minutes = 21

[[ci.jobs]]
id = "test:rust:acceptance"
platform = "windows"
runner = "stokker-local-windows-x64"
timeout_minutes = 21

[[ci.jobs]]
id = "test:rust:coverage"
platform = "linux"
bootstrap = ["python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-packages"]

[[ci.jobs]]
id = "test:rust:integration"
platform = "linux"
runner = "stokker-local-linux-x64"
bootstrap = ["python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-packages"]

[[ci.jobs]]
id = "test:rust:integration"
platform = "windows"
runner = "stokker-local-windows-x64"

[[ci.jobs]]
id = "test:rust:system"
platform = "linux"
runner = "stokker-local-linux-x64"
bootstrap = ["python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-packages"]

[[ci.jobs]]
id = "test:rust:system"
platform = "windows"
runner = "stokker-local-windows-x64"

[[ci.jobs]]
id = "test:rust:unit"
platform = "linux"
runner = "stokker-local-linux-x64"
bootstrap = ["python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-packages"]

[[ci.jobs]]
id = "test:rust:unit"
platform = "windows"
runner = "stokker-local-windows-x64"

[[ci.jobs]]
id = "test:typescript:system"
platform = "linux"
bootstrap = ["python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-packages --desktop"]
timeout_minutes = 14

# --- Stage / Bench --- #

[[ci.jobs]]
id = "bench:rust:integration"
platform = "linux"
runner = "stokker-local-linux-x64"

[[ci.jobs]]
id = "bench:rust:system"
platform = "linux"
runner = "stokker-local-linux-x64"

[[ci.jobs]]
id = "bench:rust:unit"
platform = "linux"
runner = "stokker-local-linux-x64"

# --- Stage / Package --- #

[[ci.jobs]]
id = "package:rust"
platform = "linux"
bootstrap = ["python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-packages"]

# --- Stage / Release --- #

[[ci.jobs]]
id = "release:publish:dry"
platform = "linux"
bootstrap = ["python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-packages"]

# === === Hooks === === #

[hooks]
# Workspace repair and checks exceed one minute even with warm Cargo caches.
step_timeout_seconds = 900

# === === Conventions === === #

[conventions.testing.limits]
unit = 512
integration = 256
acceptance = 128
system = 64


[conventions.rust.source_roots]
# Validate the authored source that this compile-only crate renders and includes.
dokime-starter-check = "crates/cargo-dokime/templates"

[skeletons]
# Audit Native Sources And Cargo/CI Policy Skeletons.
include = ["**/*.rs", "**/*.py", "**/Cargo.toml", "mise.toml", "stkr.toml"]
# Generated RPC output is owned and checked by the binding generators.
exclude = ["packages/dokime/src/dokime/client/_generated/**", "crates/dokime-gui/src-tauri/src/rpc/generated.rs"]

[barrels]
# Deliberate public façades, not accidental re-export files: the authoring
# prelude and the one namespace a sidecar author imports from.
exclude = ["crates/dokime-runtime/src/prelude.rs", "crates/dokime-runtime/src/plugin/sidecar.rs"]

[markdown]
include = ["**/README.md", "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md", "LICENSE.md", ".github/**", "openspec/**"]

# === === Templates === === #

[[templates.scaffolds]]
path = "crates/cargo-dokime/templates"
profile = "plugin"
suffix = ".tmpl"
tasks = "crates/cargo-dokime/scaffold.tasks.toml"

[templates.scaffolds.placeholders]
package = "{{package}}"
module = "{{crate}}"
owner = "{{owner}}"
repository = "{{repository}}"
selection = "{{selection}}"

# === === Release === === #

[release]
provider = "github"
repository = "stokker-technologies/dokime"
product = "dokime"
crates_bootstrap_secret = "CARGO_REGISTRY_TOKEN"
targets = ["linux-x86_64", "windows-x86_64"]
signature_checks = [
  [
    "uv",
    "run",
    "--locked",
    "--project",
    "tools/python",
    "python",
    "-m",
    "dokime_tools.package.installer",
    "verify",
    "--require-signed",
  ],
]

[[release.package_signing]]
language = "rust"
platform = "windows"
secrets = ["TAURI_SIGNING_PRIVATE_KEY", "TAURI_SIGNING_PRIVATE_KEY_PASSWORD"]

[[release.assets]]
target = "linux-x86_64"
path = "target/package/{profile}/{target}/rust/installers/dokime_{version}_amd64.deb"
name = "{product}_{version}_amd64.deb"

[[release.assets]]
target = "linux-x86_64"
path = "target/package/{profile}/{target}/rust/installers/dokime-{version}-1.x86_64.rpm"
name = "{product}-{version}-1.x86_64.rpm"

[[release.assets]]
target = "windows-x86_64"
path = "target/package/{profile}/{target}/rust/installers/dokime-{version}-windows-x86_64-setup.exe"
name = "{product}-{version}-windows-x86_64-setup.exe"

[[release.assets]]
target = "windows-x86_64"
path = "target/package/{profile}/{target}/rust/installers/dokime-{version}-windows-x86_64-setup.exe.sig"
name = "{product}-{version}-windows-x86_64-setup.exe.sig"
signed_only = true

[[release.assets]]
target = "windows-x86_64"
path = "target/package/{profile}/{target}/rust/installers/latest.json"
name = "latest.json"
signed_only = true

[[release.assets]]
target = "linux-x86_64"
path = "target/package/{profile}/{target}/rust/plugins/obc-plugin.dokime"
name = "obc-plugin-{version}-{target}.dokime"

[[release.assets]]
target = "windows-x86_64"
path = "target/package/{profile}/{target}/rust/plugins/obc-plugin.dokime"
name = "obc-plugin-{version}-{target}.dokime"

[version]
value = "0.1.0"
files = [
  "Cargo.toml",
  "pyproject.toml",
  "packages/dokime/pyproject.toml",
  "crates/dokime-gui/package.json",
  "crates/dokime-gui/src-tauri/tauri.conf.json",
]

[[package.executables]]
package = "dokime-cli"
command = "dokime"
name = "dokime-cli"
targets = { linux-x86_64 = "x86_64-unknown-linux-gnu", windows-x86_64 = "x86_64-pc-windows-msvc" }
release = true
verify = ["--version"]
installers = ["mise"]

[[package.executables]]
package = "dokime-server-cli"
command = "dokime-server"
name = "dokime-server-cli"
targets = { linux-x86_64 = "x86_64-unknown-linux-gnu", windows-x86_64 = "x86_64-pc-windows-msvc" }
release = true
verify = ["--version"]
installers = ["mise"]

[[package.executables]]
package = "cargo-dokime"
command = "cargo-dokime"
name = "cargo-dokime"
targets = { linux-x86_64 = "x86_64-unknown-linux-gnu", windows-x86_64 = "x86_64-pc-windows-msvc" }
release = true
verify = ["--version"]
installers = ["mise"]
