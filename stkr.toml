# Project Policy Owned By The Hub
# Native manifests own package metadata; mise owns executable recipes.
# Defaults stay implicit. Commented sections do not declare configuration.

# === Project ===

[project]
name = "Dokime"


# === Repository ===

[housekeeping]
max_workspaces = 5


# === CI ===


# === Agents ===


# === Hooks ===

[hooks]
# Workspace repair and checks exceed one minute even with warm Cargo caches.
step_timeout_seconds = 900


# === Conventions ===

[conventions.ci.multitask]
check = ["ci:route", "check"]
test = ["ci:artifacts:restore", "test"]

[conventions.rust.source_roots]
# Validate the authored source that this compile-only crate renders and includes.
dokime-starter-check = "crates/cargo-dokime/templates"

[skeletons]
# Audit native source and the dedicated project policy skeleton.
include = ["**/*.rs", "**/*.py", "stkr.toml"]
# Generated RPC output is owned and checked by the binding generators.
exclude = [
  "crates/dokime-python/python/dokime/client/_generated/**",
  "crates/dokime-gui/src-tauri/src/rpc/generated.rs",
]

[barrels]
# Deliberate public façades, not accidental re-export files: the authoring
# prelude and the one namespace a sidecar author imports from.
exclude = ["crates/dokime/src/prelude.rs", "crates/dokime/src/plugin/sidecar.rs"]

[markdown]
include = [
  "**/README.md",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "LICENSE.md",
  ".github/**",
]


# === Templates ===


# === Release ===


# === Documentation ===


# === Screenshots ===


# === Catalogs ===

[[catalogs]]
language = "rust"
path = "plugins/mini/src/operations/mod.rs"
name = "Implemented"
implementations = ["connections.rs", "readiness.rs", "status.rs"]


[[catalogs]]
language = "rust"
path = "crates/cargo-dokime/templates/src/operations/mod.rs"
name = "Implemented"
implementations = ["status.rs", "chamber.rs"]

[[catalogs]]
language = "rust"
path = "crates/dokime/src/storage/objects/mod.rs"
name = "Objects"
implementations = ["case.rs", "cycle.rs", "execution.rs", "suite.rs"]


# === PyO3 ===

[[pyo3.modules]]
name = "_native"
crate = "dokime-python"
root = true
module_rename = "_native"
import = "dokime._native"
flatten = ["authoring", "core_contracts", "server"]
rust = "crates/dokime-python/src"
stub = "crates/dokime-python/python/dokime/_native/__init__.pyi"
class_module = "dokime.runtime"

[pyo3.modules.native_classes]
Runtime = "dokime._native"
AuthoringContext = "dokime._native"
Artifacts = "dokime._native"
ArtifactWriter = "dokime._native"

[pyo3.modules.public_classes]
Runtime = "dokime._native"
AuthoringContext = "dokime._native"
Artifacts = "dokime._native"
ArtifactWriter = "dokime._native"
ServerConfig = "dokime.runtime"
TlsIdentity = "dokime.runtime"
BearerGrant = "dokime.runtime"
Role = "dokime.runtime"

[[pyo3.modules]]
name = "authoring"
crate = "dokime-python"
module_rename = "authoring"
import = "dokime._native.authoring"
rust = "crates/dokime-python/src/authoring"
stub = "crates/dokime-python/python/dokime/_native/authoring.pyi"

[pyo3.modules.renames]
PyContext = "AuthoringContext"

[pyo3.modules.class_modules]
PyContext = "dokime._native"
PyArtifacts = "dokime._native"
PyArtifactWriter = "dokime._native"

[[pyo3.modules]]
name = "server"
crate = "dokime-python"
module_rename = "server"
import = "dokime._native.server"
rust = "crates/dokime-python/src/server"
stub = "crates/dokime-python/python/dokime/_native/server.pyi"

[pyo3.modules.class_modules]
PyServerConfig = "dokime.runtime"
PyTlsIdentity = "dokime.runtime"
PyBearerGrant = "dokime.runtime"
PyRole = "dokime.runtime"

[[pyo3.modules]]
name = "core_contracts"
crate = "dokime-python"
module_rename = "core_contracts"
import = "dokime._native.core_contracts"
rust = "crates/dokime-python/src/core_contracts"
stub = "crates/dokime-python/python/dokime/_native/core_contracts.pyi"

[[pyo3.modules]]
name = "client"
crate = "dokime-python"
module_rename = "client"
import = "dokime._native.client"
rust = "crates/dokime-python/src/client"
stub = "crates/dokime-python/python/dokime/_native/client.pyi"
class_module = "dokime._native.client"
