[package]
description = "Demonstrates onboard charger validation on a simulated testbench."
name = "obc-plugin"
publish = false
version = { workspace = true }
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.dokime]
debuginfo = false

[dependencies]
# Local
dokime-domain = { version = "0.1.0", path = "../../crates/dokime-domain" }
dokime-runtime = { version = "0.1.0", path = "../../crates/dokime-runtime" }
obc-runtime = { version = "0.1.0", path = "runtime" }

# Error Handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Utilities
sysinfo = { workspace = true }

# Serialization
serde_json = { workspace = true }

# Async
tokio = { workspace = true }

[dev-dependencies]
# Git
harmos = { workspace = true, features = ["plugin-sidecar"] }

# Utilities
sha2 = { workspace = true }

# Async
futures-util = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
