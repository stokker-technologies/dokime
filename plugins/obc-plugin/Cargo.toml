[package]
description = "Demonstrates onboard charger validation on a simulated testbench."
name = "obc-plugin"
publish = false
version = { workspace = true }
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.dokime]
debuginfo = false

[features]
benchmarks = []

[[bin]]
name = "obc-plugin"
path = "src/main.rs"
test = false

[dependencies]
# Local
dokime = { workspace = true, features = ["plugin-sidecar"] }
obc-runtime = { version = "0.1.0", path = "runtime" }

# Error Handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Utilities
sysinfo = { workspace = true }

# Serialization
serde_json = { workspace = true }

# Async
tokio = { workspace = true }

[dev-dependencies]
# Utilities
sha2 = { workspace = true }

# Async
futures-util = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
