# === Package === #

[package]
description = "Demonstrates onboard charger validation on a simulated testbench."
name = "plugin-obc"
publish = false
version = { workspace = true }
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.dokime]
debuginfo = false

# === Package Targets === #

[[bin]]
name = "plugin-obc"
path = "src/main.rs"
test = false

# === Features === #

[features]
default = ["runtime"]
benchmarks = []
# Generated operation resource wiring is gated on the consuming crate's `runtime` feature.
runtime = []

# === Dependencies === #

[dependencies]
# Local
dokime = { workspace = true, features = ["plugin-sidecar"] }
obc-runtime = { version = "0.1.2", path = "runtime" }
plugin-host = { workspace = true }

# Git

# Error Handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Utilities
sysinfo = { workspace = true }

# Serialization
serde_json = { workspace = true }

# Configuration

# Filesystem

# Parsing

# Concurrency

# Async
tokio = { workspace = true }

# Networking

# Storage

# UI

# Testing

