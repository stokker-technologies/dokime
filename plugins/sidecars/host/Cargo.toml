# === Package === #

[package]
name = "plugin-host"
description = "Collects host telemetry and controls host radios, adapters and power plans."
autotests = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
version = { workspace = true }

# === Package Targets === #

[[bin]]
name = "plugin-host"
path = "src/main.rs"
test = false

