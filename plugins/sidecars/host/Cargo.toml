# === Package === #

[package]
name = "plugin-host"
publish = false
edition.workspace = true
rust-version.workspace = true
description = "Collects host telemetry through the supervised Dokime plugin boundary."
license.workspace = true
repository.workspace = true
version = { workspace = true }

[package.metadata.dokime]
debuginfo = false

# === Package Targets === #

[[bin]]
name = "plugin-host"
path = "src/main.rs"
test = false
required-features = ["runtime"]

# === Features === #

[features]
# Definitions (requests, responses, ids, policies, stream rows) build with no features;
# `runtime` adds the operation implementations and their platform dependencies.
default = []
runtime = ["dep:libc", "dep:serde_json", "dep:starship-battery", "dep:sysinfo", "dep:tokio", "dep:tokio-util", "dep:windows", "dep:zbus"]

# === Dependencies === #

[dependencies]
# Local
dokime = { workspace = true, features = ["plugin-sidecar"] }
dokime-domain = { version = "0.1.2", path = "../../../crates/dokime-domain" }

# Git

# Error Handling
thiserror = { workspace = true }

# Logging

# Utilities
libc = { workspace = true, optional = true }
starship-battery = { workspace = true, optional = true }
sysinfo = { workspace = true, optional = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true, optional = true }

# Configuration

# Filesystem

# Parsing

# Concurrency

# Async
tokio = { workspace = true, features = ["process"], optional = true }
tokio-util = { workspace = true, features = ["rt"], optional = true }

# Networking

# Storage

# UI

# Testing

# === Build Dependencies === #

# === Dev Dependencies === #

[dev-dependencies]
# Local
dokime-tracing = { workspace = true }

# Git
harmos-sdk = { workspace = true }

# Error Handling

# Logging

# Utilities

# Serialization

# Configuration

# Filesystem
tempfile = { workspace = true }

# Parsing

# Concurrency

# Async
tokio = { workspace = true, features = ["test-util"] }

# Networking

# Storage

# UI

# Testing

