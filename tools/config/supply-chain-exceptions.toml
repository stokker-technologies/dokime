reason = "Reviewed 2026-11-19: dokime-packaging -> tauri-bundler 2.10.6 -> rpm 0.30.2 (bzip2-compression) -> bzip2 0.6.1 -> libbz2-rs-sys 0.2.7; rpm's default signature-pgp also reaches bzip2 through pgp 0.20.0. cargo update -p libbz2-rs-sys advances 0.2.6 to 0.2.7, which retains bzip2-1.0.6; no license-clean version is reachable within tauri-bundler 2.10.6's requirements and no newer compatible bundler patch is available. The bundler exposes no RPM compression dependency switch. crates/dokime-packaging/src/installer/native.rs:231-237 leaves RPM compression at its default gzip and :262-281 changes only files/dependencies; :352-360 rejects internal PGP signing keys. Accept the permissive bzip2-1.0.6 terms only for this exact crate/version and retain its complete license text in generated notices. Cargo Deny has the matching per-crate exception; Cargo About consumes this entry as its per-crate accepted license."
owner = "orchestrator"
expires = 2026-12-19

