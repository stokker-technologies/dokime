[[advisory]]
ecosystem = "pnpm"
id = "GHSA-fc5q-39xc-vjpf"
package = "picomatch"
version = "4.0.7"
fixed = "await patched upstream release"
category = "vulnerability"
reason = "Reviewed 2026-11-18: pnpm audit reports all picomatch versions through 4.0.7 affected, with no patched release; the npm registry still lists 4.0.7 as latest. @dokime/gui -> @tailwindcss/vite 4.3.3 or @vitejs/plugin-react 6.1.2 -> vite 8.3.4 -> picomatch 4.0.7, also through tinyglobby 0.2.17 and its fdir 6.5.0 peer. Accept this exact version until upstream publishes a fix; update the lockfile to a patched compatible release when available. Advisory: https://github.com/advisories/GHSA-fc5q-39xc-vjpf."
owner = "orchestrator"
expires = 2026-12-18

[[advisory]]
ecosystem = "cargo"
id = "RUSTSEC-2026-0543"
package = "chrono"
version = "0.4.45"
fixed = "replace unmaintained dependency"
category = "unmaintained"
reason = "Reviewed 2026-11-17: RUSTSEC-2026-0543 marks all chrono versions unmaintained and lists no patched release. cargo update -p chrono retains 0.4.45 as the latest compatible release. dokime-storage and harmos-query/harmos-storage consume arrow-array 60.1.0, which requires chrono 0.4.40 or newer. Accept this exact version while the Arrow owners replace chrono with a maintained alternative; upgrade the dependency chain when that replacement is available. Advisory: https://rustsec.org/advisories/RUSTSEC-2026-0543.html."
owner = "orchestrator"
expires = 2026-12-17

[[advisory]]
ecosystem = "cargo"
id = "RUSTSEC-2024-0370"
package = "proc-macro-error"
version = "1.0.4"
fixed = "replace unmaintained dependency"
category = "unmaintained"
reason = "Reviewed 2026-11-16: RustSec reports no patched proc-macro-error version. dokime-gui -> tauri 2.12.5 -> gtk 0.18.2 -> glib 0.18.5 -> glib-macros 0.18.5 -> proc-macro-error, and gtk 0.18.2 -> gtk3-macros 0.18.2 -> proc-macro-error. Latest stable tauri 2.12.6 still requires gtk 0.18; gtk 0.19.0 uses maintained glib 0.22 but cannot satisfy that requirement. Tauri 3.0.0-alpha.6 offers an optional GTK4 path, requiring a separate desktop runtime migration. Upgrade when the stable desktop stack adopts maintained GTK bindings; proc-macro-error itself has no fixed upstream version."
owner = "orchestrator"
expires = 2026-12-16

[[advisory]]
ecosystem = "cargo"
id = "RUSTSEC-2026-0371"
package = "zbus_names"
version = "4.3.4"
fixed = "replace unmaintained dependency"
category = "unmaintained"
reason = "Reviewed 2026-11-16: RustSec reports no patched zbus_names version; the maintained replacement is zbus 6's names module. dokime-gui -> tauri-plugin-opener 2.7.2 -> zbus 5.19.0 -> zbus_names 4.3.4; dokime-runtime -> keyring 4.2.0 -> zbus-secret-service-keyring-store 1.0.1 -> zbus 5.19.0 -> zbus_names 4.3.4. Latest opener 2.7.3 (also 3.0.0-alpha.3) and latest keyring store 1.0.1 still require zbus 5, including their upstream branches. Upgrade both owners when they adopt zbus 6; no compatible upstream replacement exists."
owner = "orchestrator"
expires = 2026-12-16

