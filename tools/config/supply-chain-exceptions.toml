[[advisory]]
ecosystem = "cargo"
id = "RUSTSEC-2024-0436"
package = "paste"
version = "1.0.15"
fixed = "replace unmaintained dependency"
category = "unmaintained"
reason = "Reviewed 2026-11-19: RUSTSEC-2024-0436 lists no patched paste version; cargo update -p paste retains 1.0.15. dokime-packaging -> tauri-bundler 2.10.6 -> image 0.25.10 -> ravif 0.13.0 -> rav1e 0.8.1 -> paste 1.0.15. tauri-bundler requires image ^0.25 with its default AVIF feature, and rav1e requires paste ^1.0; tauri-bundler exposes no AVIF feature switch and no newer compatible patch is available. No finding-free version is reachable within tauri-bundler 2.10.6's requirements. The product never requests AVIF encoding: crates/dokime-packaging/src/installer/native.rs:205-207 writes PNG/ICO icons and :225-234 passes only those icons; artwork.rs:49-55 encodes ICO frames as PNG and :72 writes BMP. Accept this exact build-time macro dependency until upstream replaces paste or makes AVIF optional. Advisory: https://rustsec.org/advisories/RUSTSEC-2024-0436.html."
owner = "orchestrator"
expires = 2026-12-19

[[advisory]]
ecosystem = "cargo"
id = "RUSTSEC-2026-0387"
package = "crypto-bigint"
version = "0.5.5"
fixed = ">=0.7.6"
category = "vulnerability"
reason = "Reviewed 2026-11-19: RUSTSEC-2026-0387 is fixed in crypto-bigint >=0.7.6; cargo update -p crypto-bigint retains 0.5.5. dokime-packaging -> tauri-bundler 2.10.6 -> rpm 0.30.2 (default signature-pgp) -> pgp 0.20.0 -> cx448 0.1.1 -> crypto-bigint 0.5.5; pgp also reaches crypto-bigint through elliptic-curve 0.13.8. cx448 requires ^0.5.5 and elliptic-curve requires ^0.5, excluding 0.7.6; no fixed version is reachable within tauri-bundler 2.10.6's requirements and no newer compatible bundler patch is available. The product never asks the bundler to PGP-sign RPMs: crates/dokime-packaging/src/installer/native.rs:231-237 leaves RPM signing settings at defaults, :309 passes no_sign(true), and :352-360 rejects inherited TAURI_SIGNING_RPM_KEY and passphrase before bundling. The bundler's RPM signer requires that environment key; explicit product RPM signing invokes external rpmsign at native.rs:694-699. Accept this exact version while the unused internal signer remains unreachable. Advisory: https://rustsec.org/advisories/RUSTSEC-2026-0387.html."
owner = "orchestrator"
expires = 2026-12-19

