[[advisory]]
ecosystem = "cargo"
id = "RUSTSEC-2024-0370"
package = "proc-macro-error"
version = "1.0.4"
fixed = "replace unmaintained dependency"
category = "unmaintained"
reason = "Reviewed 2026-11-16: RustSec reports no patched proc-macro-error version. dokime-gui -> tauri 2.12.5 -> gtk 0.18.2 -> glib 0.18.5 -> glib-macros 0.18.5 -> proc-macro-error, and gtk 0.18.2 -> gtk3-macros 0.18.2 -> proc-macro-error. Latest stable tauri 2.12.6 and even 3.0.0-alpha.6 still require gtk 0.18; gtk 0.19.0 uses maintained glib 0.22 but is incompatible with those requirements. Upgrade when Tauri adopts the maintained GTK bindings; no compatible upstream replacement exists."
owner = "orchestrator"
expires = 2026-12-16

