# Dependency Policy: Only Explicitly Allowed License Alternatives May Be Selected.
[advisories]
# Check Transitive Unsoundness Too; the Default Covers Only Direct Workspace Dependencies.
unsound = "all"
# Keep Native Ignores Empty; Reviewed Findings Belong in supply-chain-exceptions.toml.
ignore = []

[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  # Public-Domain Dedication for notify and tiny-keccak.
  "CC0-1.0",
  # Permissive Apache Terms with the LLVM Linking Exception for target-lexicon and winx.
  "Apache-2.0 WITH LLVM-exception",
  # Permissive Data License for the webpki Certificate Root Collections.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

# Reviewed 2026-11-19: Bundler Dependency Paths and Review Deadlines Are in supply-chain-exceptions.toml.
[[licenses.exceptions]]
name = "libbz2-rs-sys"
version = "=0.2.7"
allow = ["bzip2-1.0.6"]

[[licenses.exceptions]]
name = "libfuzzer-sys"
version = "=0.4.13"
allow = ["NCSA"]

[bans]
# Parallel dependency versions are allowed; security and license policy apply to every version.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
