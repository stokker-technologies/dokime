# Native Test Execution And Evidence

[testing]
system_timeout_seconds = 600

[testing.rust]
categories = ["integration", "acceptance", "system"]

[testing.python]
project = "packages/dokime"
install = "preinstalled"
sources = ["src/dokime"]
categories = ["integration", "acceptance"]

[testing.typescript.integration]
# Vitest discovers the desktop client's stories from its own configuration.
directory = "crates/dokime-gui"
command = [
  "node",
  "node_modules/vitest/vitest.mjs",
  "run",
  "--reporter=default",
  "--reporter=junit",
  "--outputFile.junit={junit}",
  "--testTimeout={timeout_ms}",
  "--hookTimeout={timeout_ms}",
]

[testing.typescript.system]
command = [
  "uv",
  "run",
  "--no-sync",
  "--project",
  "tools/python",
  "python",
  "-m",
  "dokime_tools.package.installer",
  "acceptance",
  "--junit",
  "{junit}",
]
