# Native Test Execution And Evidence

[testing]
system_timeout_seconds = 600

[testing.rust]
categories = ["integration", "acceptance", "system"]

[testing.python]
project = "tools/python"
sources = ["src/dokime_tools"]
categories = ["integration"]

# The client suites run against the wheel `prepare:python` installs; uv must never
# rebuild or re-sync it between that step and the tests.
[[testing.python.configurations]]
name = "client"
project = "packages/dokime"
install = "preinstalled"
sources = ["src/dokime"]
categories = ["integration", "acceptance"]

[testing.javascript.integration]
command = [
  "node",
  "--test",
  "--test-reporter=spec",
  "--test-reporter=junit",
  "--test-reporter-destination=stdout",
  "--test-reporter-destination={junit}",
  "--test-timeout={timeout_ms}",
  "crates/dokime-gui/src-tauri/tests/rpc/fixtures/generator.test.mjs",
  "crates/dokime-gui/tests/execution-file-paging.test.mjs",
  "crates/dokime-gui/src-tauri/tests/plots/reduce.test.mjs",
  "crates/dokime-gui/src-tauri/tests/plots/viewport.test.mjs",
  "crates/dokime-gui/tests/prompt-banner.test.mjs",
  "crates/dokime-gui/tests/plot-auto.test.mjs",
  "crates/dokime-gui/tests/histogram-axes.test.mjs",
  "crates/dokime-gui/tests/execution-list.test.mjs",
  "crates/dokime-gui/tests/cycle-menus.test.mjs",
  "crates/dokime-gui/tests/storage-reset.test.mjs",
  "crates/dokime-gui/tests/console-follow.test.mjs",
  "crates/dokime-gui/tests/console-records.test.mjs",
  "crates/dokime-gui/tests/report-steps.test.mjs",
  "crates/dokime-gui/tests/status-bar-operations.test.mjs",
]

[testing.javascript.system]
command = [
  "uv",
  "run",
  "--no-sync",
  "--project",
  "tools/python",
  "python",
  "-m",
  "dokime_tools.installer",
  "acceptance",
  "--junit",
  "{junit}",
]
