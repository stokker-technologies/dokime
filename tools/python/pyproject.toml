[project]
name = "dokime-tools"
version = "0.0.0"
requires-python = ">=3.13,<3.16"
dependencies = ["packaging==26.3", "harmos-tools"]

[dependency-groups]
dev = ["hatchling==1.33.0", "ty==0.0.86", "ruff==0.17.0"]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.ty.environment]
# Match the Pinned Mise Runtime, Including Native Zstandard Tar Archives.
python-version = "3.15"
# Share the Root Uv Workspace Environment.
python = "../../.venv"

[tool.ty.src]
# Check the Package and Its Stories in the Same Gate.
include = ["src", "tests"]

[tool.ruff]
# Match the Shared Formatter Width.
line-length = 140
# Templates Are Rendered Before Source Formatting.
extend-exclude = ["**/.*/**"]
force-exclude = true

[tool.ruff.lint]
# Every Authored Function Declares Its Typed Contract.
select = ["E4", "E7", "E9", "F", "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206"]

[tool.uv]
# Use the Workstation Certificate Store for Dependency Downloads.
system-certs = true

[tool.uv.sources]
# Generated From the Workspace Library Pin by mise run generate -- --protocol.
harmos-tools = { git = "https://github.com/stokker-technologies/harmos", rev = "ded8e21b98915d57996488018cae1c574eb4b45a", subdirectory = "tools/python" }
