[project]
name = "dokime-tools"
version = "0.0.0"
requires-python = ">=3.13,<3.16"
dependencies = ["packaging==26.3"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.pyright]
include = ["src"]
exclude = ["src/dokime_tools/docs", "src/dokime_tools/release", "src/dokime_tools/test"]
pythonVersion = "3.13"
pythonPlatform = "All"
typeCheckingMode = "standard"
venvPath = "../.."
venv = ".venv"

[tool.uv]
system-certs = true

[tool.ruff]
# Hub-rendered runners are formatted, linted and type-checked by the Hub.
extend-exclude = ["src/dokime_tools/docs", "src/dokime_tools/release", "src/dokime_tools/test"]
