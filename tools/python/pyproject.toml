[project]
name = "dokime-tools"
version = "0.0.0"
requires-python = ">=3.13,<3.16"
dependencies = ["packaging==26.3"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.pyright]
include = ["src"]
pythonVersion = "3.13"
pythonPlatform = "All"
typeCheckingMode = "standard"
venvPath = "../.."
venv = ".venv"

[tool.uv]
system-certs = true

[tool.ruff.format]
# Shared generated modules are formatted and validated by Hub.
exclude = [
  "src/dokime_tools/_policy.py",
  "src/dokime_tools/docs.py",
  "src/dokime_tools/docs_site.py",
  "src/dokime_tools/docs_artifacts.py",
  "src/dokime_tools/docs_registry.py",
  "src/dokime_tools/evidence.py",
  "src/dokime_tools/release.py",
  "src/dokime_tools/screenshots.py",
]
