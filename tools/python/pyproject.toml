[project]
name = "dokime-tools"
version = "0.0.0"
requires-python = ">=3.13,<3.16"
dependencies = ["harmos-tools", "packaging==26.3"]

[dependency-groups]
dev = ["hatchling==1.32.4", "ty==0.0.86", "ruff==0.17.0"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.ty.environment]
python-version = "3.13"
python = "../../.venv"

[tool.ty.src]
include = ["src"]
exclude = ["src/dokime_tools/docs", "src/dokime_tools/release", "src/dokime_tools/test"]

[tool.uv]
system-certs = true

[tool.uv.sources]
# Keep this tag equal to the Harmos crate versions in Cargo.toml.
harmos-tools = { git = "https://github.com/stokker-technologies/harmos", subdirectory = "tools/python", tag = "v0.1.14" }

[tool.ruff]
# Dokime owns these runners; release and test orchestration have dedicated task proof.
extend-exclude = ["src/dokime_tools/docs", "src/dokime_tools/release", "src/dokime_tools/test"]
