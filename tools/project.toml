[[ci.jobs]]
id = "check:python:generated"
inputs = ["build:python#python"]

[[ci.jobs]]
id = "check:typescript:generated"
inputs = ["build#clients"]

[[ci.jobs]]
id = "build"
inputs = ["build:python#python"]

[[ci.jobs]]
id = "build:rust:tests"
inputs = []

[ci.jobs.outputs]
tests = ["target/build/{profile}/{target}/tests", "target/build/{profile}/{target}/fixtures"]

[[ci.jobs]]
id = "build:python"
inputs = []

[ci.jobs.outputs]
python = ["target/build/{profile}/any/python"]

[[ci.jobs]]
bootstrap = ["python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-packages"]
id = "build"
platform = "unix"

[ci.jobs.outputs]
cli = ["target/build/{profile}/{target}/bin/dokime"]
clients = ["target/build/{profile}/{target}/generated/typescript"]
generator = ["target/build/{profile}/{target}/bin/cargo-dokime"]
gui = ["target/build/{profile}/{target}/bin/dokime-gui"]
packaging = ["target/build/{profile}/{target}/product", "target/build/{profile}/{target}/web"]
plugins = ["target/build/{profile}/{target}/plugins"]

[[ci.jobs]]
id = "build"
platform = "windows"

[ci.jobs.outputs]
cli = ["target/build/{profile}/{target}/bin/dokime.exe"]
clients = ["target/build/{profile}/{target}/generated/typescript"]
generator = ["target/build/{profile}/{target}/bin/cargo-dokime.exe"]
gui = ["target/build/{profile}/{target}/bin/dokime-gui.exe"]
packaging = ["target/build/{profile}/{target}/product", "target/build/{profile}/{target}/web"]
plugins = ["target/build/{profile}/{target}/plugins"]

[[ci.jobs]]
bootstrap = ["python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-packages"]
id = "build:rust:tests"
platform = "unix"

[[ci.jobs]]
id = "build:rust:bench"

[ci.jobs.outputs]
bench = ["target/build/bench/{target}"]

[[ci.jobs]]
bootstrap = ["python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-packages"]
caches = ["mise", "cargo-downloads", "uv", "pnpm", "sccache", "bench-baselines"]
id = "build:rust:bench"
platform = "unix"

[[ci.jobs]]
id = "test:rust:unit"
inputs = ["build:rust:tests#tests"]

[[ci.jobs]]
id = "test:rust:integration"
inputs = ["build:rust:tests#tests"]

[[ci.jobs]]
id = "test:rust:acceptance"
inputs = ["build:rust:tests#tests", "build#cli", "build#generator", "build#plugins", "build#clients", "build:python#python"]

[[ci.jobs]]
id = "test:rust:system"
inputs = ["build:rust:tests#tests", "build#cli", "build#plugins", "build:python#python"]

[[ci.jobs]]
id = "test:rust:starter"
inputs = ["build#generator"]
pipelines = ["nightly"]

[[ci.jobs]]
id = "test:rust:coverage"
inputs = ["build:rust:tests#tests", "build#cli", "build#gui", "build#generator", "build#plugins", "build#clients", "build:python#python"]

[[ci.jobs]]
id = "test:typescript:unit"
inputs = ["build#clients"]

[[ci.jobs]]
id = "test:typescript:integration"
inputs = ["build#clients"]

[[ci.jobs]]
id = "test:typescript:system"
inputs = ["build#cli", "build#gui", "build#plugins", "build#clients", "build:rust:tests#tests"]

[[ci.jobs]]
id = "test:python:unit"
inputs = ["build:python#python"]

[[ci.jobs]]
id = "test:python:integration"
inputs = ["build:python#python"]

[[ci.jobs]]
id = "test:python:acceptance"
inputs = ["build:python#python", "build#cli", "build#plugins"]

[[ci.jobs]]
id = "test:python:coverage"
inputs = ["build:python#python", "build#cli", "build#plugins"]

[[ci.jobs]]
bootstrap = ["python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-runtime"]
id = "test:rust:acceptance"
platform = "unix"

[[ci.jobs]]
bootstrap = ["python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-packages"]
id = "test:rust:coverage"
platform = "unix"

[[ci.jobs]]
bootstrap = ["python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-runtime"]
id = "test:rust:integration"
platform = "unix"

[[ci.jobs]]
bootstrap = ["python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-runtime"]
id = "test:rust:system"
platform = "unix"

[[ci.jobs]]
bootstrap = ["python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-runtime"]
id = "test:rust:unit"
platform = "unix"

[[ci.jobs]]
bootstrap = ["python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-runtime --desktop"]
id = "test:typescript:system"
platform = "unix"

[[ci.jobs]]
bootstrap = ["python tools/python/src/dokime_tools/ci/bootstrap.py --desktop"]
id = "test:typescript:system"
platform = "windows"

[[ci.jobs]]
id = "bench:rust:unit"
inputs = ["build:rust:bench#bench"]

[[ci.jobs]]
id = "bench:rust:integration"
inputs = ["build:rust:bench#bench"]

[[ci.jobs]]
id = "bench:rust:system"
inputs = ["build:rust:bench#bench"]

[[ci.jobs]]
id = "package:rust"
inputs = ["build#cli", "build#gui", "build#generator", "build#plugins", "build#packaging"]

[ci.jobs.outputs]
package = ["target/package/{profile}/{target}/rust"]

[[ci.jobs]]
id = "package:python"
inputs = ["build:python#python"]

[ci.jobs.outputs]
package = ["target/package/{profile}/any/python"]

[[ci.jobs]]
bootstrap = ["python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-packages"]
id = "package:rust"
platform = "unix"

[[ci.jobs]]
id = "release:tag"
inputs = []

[[ci.jobs]]
id = "release:publish:dry"
inputs = ["package:rust#package", "package:python#package"]

[[ci.jobs]]
id = "release:rehearse"
inputs = ["package:rust#package", "package:python#package"]

[[ci.jobs]]
id = "release:publish"
inputs = ["package:rust#package", "package:python#package"]

[[ci.jobs]]
id = "release:verify"
inputs = ["package:rust#package", "package:python#package"]

[[ci.jobs]]
bootstrap = ["python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-packages"]
id = "release:publish:dry"
platform = "unix"

[[ci.jobs]]
bootstrap = ["python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-packages"]
id = "release:rehearse"
platform = "unix"

[[ci.jobs]]
bootstrap = ["python3 tools/python/src/dokime_tools/ci/bootstrap.py --gui-packages"]
id = "release:tag"
platform = "unix"

[conventions.testing.deadlines]
acceptance = 900
integration = 120
system = 300
unit = 120

[conventions.testing.limits]
acceptance = 128
integration = 256
system = 64
unit = 512

[languages.python]
build_target = "any"
generated = [
  "packages/dokime-client/src/dokime_client/_wire",
  "packages/dokime-client/src/dokime_client/operation.py",
  "packages/dokime-client/src/dokime_client/dynamic.py",
]
roots = ["tools/python", "packages"]

[languages.rust]
exclude = ["crates/dokime-gui/node_modules", "crates/cargo-dokime/templates"]
roots = ["crates", "plugins"]
targets = ["wasm32-unknown-unknown"]

[languages.typescript]
exclude = ["crates/dokime-gui/node_modules", "crates/dokime-gui/src-tauri", "crates/dokime-gui/src/routeTree.gen.ts"]
generated = ["target/generated/typescript", "crates/dokime-gui/src/lib/rpc/generated", "crates/dokime-gui/src/generated/organization"]
roots = ["crates/dokime-gui"]

[[package.executables]]
command = "dokime"
installers = ["mise"]
name = "dokime-cli"
package = "dokime-cli"
release = true
verify = ["--version"]

[package.executables.targets]
linux-x86_64 = "x86_64-unknown-linux-gnu"
windows-x86_64 = "x86_64-pc-windows-msvc"

[[package.executables]]
command = "cargo-dokime"
installers = ["mise"]
name = "cargo-dokime"
package = "cargo-dokime"
release = true
verify = ["--version"]

[package.executables.targets]
linux-x86_64 = "x86_64-unknown-linux-gnu"
windows-x86_64 = "x86_64-pc-windows-msvc"

[project]
name = "Dokime"
platforms = ["unix", "windows"]

[release]
crates_bootstrap_secret = "CARGO_REGISTRY_TOKEN"
dev_channel = true
lock_commands = [
  [
    "cargo",
    "update",
    "--workspace",
  ],
  [
    "pnpm",
    "install",
    "--lockfile-only",
    "--ignore-scripts",
    "--dir",
    "crates/dokime-gui",
  ],
  [
    "uv",
    "lock",
  ],
  [
    "uv",
    "sync",
    "--locked",
    "--all-groups",
    "--no-install-package",
    "dokime-client",
  ],
]
plugin_extension = "dokime"
product = "dokime"
provider = "github"
repository = "stokker-technologies/dokime"
signature_checks = [
  [
    "uv",
    "run",
    "--locked",
    "--project",
    "tools/python",
    "python",
    "-m",
    "dokime_tools.package.installer",
    "verify",
    "--release-assets",
    "--require-signed",
  ],
]
targets = ["linux-x86_64", "windows-x86_64"]

[[release.assets]]
name = "{product}_{version}_amd64.deb"
path = "target/package/{profile}/{target}/rust/installers/dokime_{version}_amd64.deb"
target = "linux-x86_64"

[[release.assets]]
kind = "distribution"
name = "{product}-distribution-{version}-x86_64-unknown-linux-gnu.zip"
path = "target/package/{profile}/{target}/rust/dokime-distribution-{version}-x86_64-unknown-linux-gnu.zip"
target = "linux-x86_64"

[[release.assets]]
kind = "distribution"
name = "{product}-distribution-{version}-x86_64-pc-windows-msvc.zip"
path = "target/package/{profile}/{target}/rust/dokime-distribution-{version}-x86_64-pc-windows-msvc.zip"
target = "windows-x86_64"

[[release.assets]]
name = "{product}-{version}-1.x86_64.rpm"
path = "target/package/{profile}/{target}/rust/installers/dokime-{version}-1.x86_64.rpm"
target = "linux-x86_64"

[[release.assets]]
name = "{product}-{version}-x86_64-pc-windows-msvc-setup.exe"
path = "target/package/{profile}/{target}/rust/installers/dokime-{version}-x86_64-pc-windows-msvc-setup.exe"
target = "windows-x86_64"

[[release.assets]]
name = "latest.json"
path = "target/package/{profile}/{target}/rust/installers/latest.json"
signed_only = true
target = "windows-x86_64"

[[release.package_signing]]
language = "rust"
platform = "windows"
secrets = ["TAURI_SIGNING_PRIVATE_KEY", "TAURI_SIGNING_PRIVATE_KEY_PASSWORD"]

[[release.plugins]]
kind = "sidecar"
package = "plugin-host"
path = "target/package/{profile}/{target}/rust/plugins/plugin-host.dokime"
requires_dokime = ">=0.1.1, <0.2.0"

[release.plugins.targets]
linux-x86_64 = "x86_64-unknown-linux-gnu"
windows-x86_64 = "x86_64-pc-windows-msvc"

[version]
files = [
  "Cargo.toml",
  "pyproject.toml",
  "packages/dokime-client/pyproject.toml",
  "packages/dokime-client/examples/remote/python/pyproject.toml",
  "crates/dokime-gui/package.json",
  "crates/dokime-gui/src-tauri/tauri.conf.json",
]
value = "0.1.2"
