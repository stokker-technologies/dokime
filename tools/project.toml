[conventions.testing]
# Expected Lanes Are Independent of Task Names.
expected_lanes = [
  "python:unit",
  "python:integration",
  "python:system",
  "rust:unit",
  "rust:integration",
  "rust:system",
  "rust:acceptance",
  "typescript:system",
  "typescript:unit",
  "typescript:integration",
]

[conventions.testing.deadlines]
acceptance = 1800
integration = 240
system = 600
unit = 240

[conventions.testing.limits]
acceptance = 128
integration = 256
system = 64
unit = 512

[languages.python]
roots = ["tools/python", "sdk/python"]

[languages.rust]
exclude = ["crates/dokime-gui/node_modules"]
roots = ["crates", "plugins", "sdk/rust"]

[languages.typescript]
exclude = ["crates/dokime-gui/node_modules", "crates/dokime-gui/src-tauri", "crates/dokime-gui/src/routeTree.gen.ts"]
generated = ["target/generated/typescript", "crates/dokime-gui/src/lib/rpc/generated", "crates/dokime-gui/src/generated/organization"]
roots = ["crates/dokime-gui"]

[[package.executables]]
command = "dokime"
installers = ["mise"]
name = "dokime-cli"
package = "dokime-cli"
release = true
verify = ["--version"]

[package.executables.targets]
linux-x86_64 = "x86_64-unknown-linux-gnu"
windows-x86_64 = "x86_64-pc-windows-msvc"

[project]
name = "Dokime"
platforms = ["unix", "windows"]

[release]
crates_bootstrap_secret = "CARGO_REGISTRY_TOKEN"
nightly = true
lock_commands = [
  [
    "cargo",
    "update",
    "--workspace",
  ],
  [
    "pnpm",
    "install",
    "--lockfile-only",
    "--ignore-scripts",
    "--dir",
    "crates/dokime-gui",
  ],
  [
    "pnpm",
    "install",
    "--lockfile-only",
    "--ignore-scripts",
    "--dir",
    "site",
  ],
  [
    "uv",
    "lock",
  ],
  [
    "uv",
    "sync",
    "--locked",
    "--all-groups",
  ],
]
plugin_extension = "dokime"
product = "dokime"
provider = "github"
repository = "stokker-technologies/dokime"
targets = ["linux-x86_64", "windows-x86_64"]

[[release.assets]]
kind = "distribution"
name = "{product}-distribution-{version}-x86_64-unknown-linux-gnu.zip"
path = "target/package/{profile}/{target}/rust/dokime-distribution-{version}-x86_64-unknown-linux-gnu.zip"
target = "linux-x86_64"

[[release.assets]]
kind = "distribution"
name = "{product}-distribution-{version}-x86_64-pc-windows-msvc.zip"
path = "target/package/{profile}/{target}/rust/dokime-distribution-{version}-x86_64-pc-windows-msvc.zip"
target = "windows-x86_64"

[[release.assets]]
kind = "installer"
path = "target/package/{profile}/{target}/rust/dokime-{version}-x86_64-pc-windows-msvc-setup.exe"
target = "windows-x86_64"

[[release.assets]]
kind = "installer"
path = "target/package/{profile}/{target}/rust/dokime-{version}-x86_64-unknown-linux-gnu.deb"
target = "linux-x86_64"

[[release.assets]]
kind = "installer"
path = "target/package/{profile}/{target}/rust/dokime-{version}-x86_64-unknown-linux-gnu.rpm"
target = "linux-x86_64"

[[release.assets]]
kind = "installer"
path = "target/package/{profile}/{target}/rust/latest.json"
signed_only = true
target = "windows-x86_64"

[[release.assets]]
kind = "tool"
name = "{product}-cpp-{version}-x86_64-unknown-linux-gnu.tar.gz"
path = "target/package/{profile}/{target}/cpp/dokime-cpp-{version}-x86_64-unknown-linux-gnu.tar.gz"
target = "linux-x86_64"

[[release.assets]]
kind = "tool"
name = "{product}-cpp-{version}-x86_64-unknown-linux-gnu.tar.gz.sha256"
path = "target/package/{profile}/{target}/cpp/dokime-cpp-{version}-x86_64-unknown-linux-gnu.tar.gz.sha256"
target = "linux-x86_64"

[[release.assets]]
kind = "tool"
name = "{product}-cpp-{version}-x86_64-pc-windows-msvc.tar.gz"
path = "target/package/{profile}/{target}/cpp/dokime-cpp-{version}-x86_64-pc-windows-msvc.tar.gz"
target = "windows-x86_64"

[[release.assets]]
kind = "tool"
name = "{product}-cpp-{version}-x86_64-pc-windows-msvc.tar.gz.sha256"
path = "target/package/{profile}/{target}/cpp/dokime-cpp-{version}-x86_64-pc-windows-msvc.tar.gz.sha256"
target = "windows-x86_64"

[[release.plugins]]
kind = "sidecar"
package = "plugin-obc"
path = "target/package/{profile}/{target}/rust/{package}.dokime"
requires_dokime = ">=0.1.5"

[release.plugins.targets]
linux-x86_64 = "x86_64-unknown-linux-gnu"
windows-x86_64 = "x86_64-pc-windows-msvc"

[version]
files = [
  "Cargo.toml",
  "pyproject.toml",
  "sdk/python/pyproject.toml",
  "crates/dokime-gui/package.json",
  "crates/dokime-gui/src-tauri/tauri.conf.json",
]
value = "0.1.5"
